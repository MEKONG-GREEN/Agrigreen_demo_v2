paths:
# @ag-order: 31300
  /v1/extension/cnts/form-designs:
    get:
      summary: Xem cấu trúc phiên bản hiện hành của năm biểu kỳ CNTS; chỉ Cấp Tỉnh CNTS và Admin
      operationId: extCntsFormDesigns
      tags: [extension]
      responses:
        "200":
          description: Danh sách cấu trúc; chưa cài thì version/template_id null và cấu trúc chuẩn chỉ tham khảo
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/CNTSDesignView"}}
        "403": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
# @ag-order: 31301
  /v1/extension/cnts/form-designs/import-preview:
    post:
      summary: Kiểm cấu trúc Excel/CSV để xem trước, không lưu phiên bản hay thay đổi kỳ
      operationId: extCntsFormDesignImportPreview
      tags: [extension]
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: {type: string, format: binary}
      responses:
        "200":
          description: Lỗi theo dòng; có lỗi thì fields rỗng. Không ghi kể cả valid=true
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CNTSDesignImport"}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
components:
  schemas:
# @ag-order: 5500
    CNTSDesignView:
      type: object
      required: [code, bm, title, period_type, due, template_id, version, fields]
      properties:
        code: {type: string}
        bm: {type: string}
        title: {type: string}
        period_type: {type: string}
        due: {type: string}
        template_id: {type: [string, "null"], format: uuid}
        version: {type: [integer, "null"]}
        fields: {type: array, items: {$ref: "#/components/schemas/FormsField"}}
# @ag-order: 5501
    CNTSDesignImport:
      type: object
      required: [fields, issues, valid]
      properties:
        fields: {type: array, maxItems: 500, items: {$ref: "#/components/schemas/FormsField"}}
        valid: {type: boolean}
        issues:
          type: array
          items:
            type: object
            required: [line, field, message]
            properties:
              line: {type: integer}
              field: {type: string}
              message: {type: string}
