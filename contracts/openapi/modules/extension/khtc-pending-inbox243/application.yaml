paths:
# @ag-order: 20243
  /v1/extension/khtc/pending-review:
    get:
      summary: Phiếu đã gửi chờ rà soát theo chế độ thường niên hoặc phát sinh, phân trang theo nhóm kỳ
      description: Đọc native Progress bằng caller hiện tại. Mặc định thường niên; chế độ phát sinh theo policy riêng (không TW/chỉ xem, Admin cần MFA), đối chiếu yêu cầu bổ sung với lần gửi native. Bộ lọc kỳ/phòng áp trước LIMIT. Không trả tổng toàn cục hoặc bộ lọc cảnh báo. Trang rỗng vẫn có thể có next_cursor; không suy quyền mutation từ kết quả đọc.
      operationId: extensionKhtcPendingReview243
      tags: [extension]
      parameters:
        - in: query
          name: before
          required: false
          schema: {type: string, format: uuid, minLength: 36, maxLength: 36}
        - in: query
          name: report_type
          required: false
          schema: {type: string, enum: [regular, adhoc], default: regular}
        - in: query
          name: period_id
          required: false
          schema: {type: string, format: uuid, minLength: 36, maxLength: 36}
        - in: query
          name: department
          required: false
          schema: {type: string, pattern: '^[a-z][a-z0-9_]{0,39}$', maxLength: 40}
      responses:
        "200":
          description: Tối đa 25 kỳ thuộc chế độ và bộ lọc mỗi trang, gồm lần gửi cuối chưa có quyết định; không suy từ nháp hoặc bảng số liệu niêm phong
          headers:
            Cache-Control: {schema: {type: string, enum: [no-store]}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/KHTCPendingReviewPage243'}
        "400": {$ref: '#/components/responses/Problem'}
        "401": {$ref: '#/components/responses/Problem'}
        "403": {$ref: '#/components/responses/Problem'}
        "404": {$ref: '#/components/responses/Problem'}
        "503": {$ref: '#/components/responses/Problem'}
components:
  schemas:
# @ag-order: 20243
    KHTCPendingReviewPage243:
      type: object
      required: [rows, next_cursor]
      properties:
        rows:
          type: array
          items: {$ref: '#/components/schemas/KHTCPendingReviewRow243'}
        next_cursor: {type: string, format: uuid, nullable: true}
# @ag-order: 20244
    KHTCPendingReviewRow243:
      type: object
      required: [period_id, period_name, department, department_name, submission_id, attempt, submitted_at]
      properties:
        period_id: {type: string, format: uuid}
        period_name: {type: string}
        department: {type: string}
        department_name: {type: string}
        submission_id: {type: string, format: uuid}
        attempt: {type: integer, format: int64, minimum: 1}
        submitted_at: {type: string, format: date-time}
