paths:
# @ag-order: 21500
  /v1/extension/khtc/departments/{department}/program-progress/periods:
    get:
      operationId: extensionKhtcPNProgressPeriods
      summary: Các kỳ Mẫu 5 được giao cho phòng trong ngữ cảnh hiện hành
      tags: [extension]
      parameters:
        - {$ref: '#/components/parameters/KHTCPNDepartment'}
        - {in: query, name: year, required: true, schema: {type: integer, minimum: 2000, maximum: 2100}, description: Bốn chữ số ASCII, không số mũ}
        - {in: query, name: after, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Trang kỳ của phòng; con trỏ tiếp nếu còn dữ liệu
          content:
            application/json:
              schema: {$ref: '#/components/schemas/KHTCPNPeriodPage'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
# @ag-order: 21501
  /v1/extension/khtc/departments/{department}/program-progress/{periodID}:
    get:
      operationId: extensionKhtcPNProgress
      summary: Tiến độ phòng từ đúng bản tính Mẫu 5 đã được KHTC chuẩn bị
      tags: [extension]
      parameters:
        - {$ref: '#/components/parameters/KHTCPNDepartment'}
        - {in: path, name: periodID, required: true, schema: {type: string, format: uuid}}
        - {$ref: '#/components/parameters/KHTCPNSnapshot'}
        - {$ref: '#/components/parameters/KHTCPNProgram'}
        - {$ref: '#/components/parameters/KHTCPNLevel'}
      responses:
        '200':
          description: Snapshot có mốc thật hoặc not_prepared rõ ràng, không tự dựng bản Mẫu 5
          content:
            application/json:
              schema: {$ref: '#/components/schemas/KHTCPNProgress'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
# @ag-order: 21502
  /v1/extension/khtc/departments/{department}/program-progress/{periodID}/excel:
    get:
      operationId: extensionKhtcPNProgressExcel
      summary: Excel chỉ có dòng của phòng, ghim đúng snapshot đang xem
      description: Tệp tra cứu dẫn xuất, không phải phát hành lại báo cáo hoặc cấp số văn bản. Giữ kiểm quyền hiện hành trước đọc; không đổi snapshot nguồn.
      tags: [extension]
      parameters:
        - {$ref: '#/components/parameters/KHTCPNDepartment'}
        - {in: path, name: periodID, required: true, schema: {type: string, format: uuid}}
        - {in: query, name: snapshot_id, required: true, schema: {type: string, format: uuid}}
        - {$ref: '#/components/parameters/KHTCPNProgram'}
        - {$ref: '#/components/parameters/KHTCPNLevel'}
      responses:
        '200':
          description: Excel theo cùng bộ lọc và snapshot
          headers:
            Content-Disposition: {schema: {type: string}}
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: {type: string, format: binary}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
components:
  parameters:
# @ag-order: 21500
    KHTCPNDepartment:
      in: path
      name: department
      required: true
      description: Phòng phải khớp trusted current session; không lấy query làm grant
      schema: {type: string, enum: [trong_trot, chan_nuoi_thuy_san, thong_tin_truyen_thong, hanh_chinh_tong_hop]}
# @ag-order: 21501
    KHTCPNSnapshot: {in: query, name: snapshot_id, schema: {type: string, format: uuid}}
# @ag-order: 21502
    KHTCPNProgram: {in: query, name: program, schema: {type: string, format: uuid}}
# @ag-order: 21503
    KHTCPNLevel: {in: query, name: level, schema: {type: string, enum: [achieved, progressing, slow, qualitative]}}
  schemas:
# @ag-order: 21500
    KHTCPNPeriod:
      type: object
      required: [id, name, year, from, to, cutoff]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        year: {type: integer, minimum: 2000, maximum: 2100}
        from: {type: string, format: date-time}
        to: {type: string, format: date-time}
        cutoff: {type: string, format: date-time}
# @ag-order: 21501
    KHTCPNPeriodPage:
      type: object
      required: [department, items, has_more, next_after]
      properties:
        department: {type: string}
        items: {type: array, items: {$ref: '#/components/schemas/KHTCPNPeriod'}}
        has_more: {type: boolean}
        next_after: {type: [string, 'null'], format: uuid}
# @ag-order: 21502
    KHTCPNSource:
      type: object
      required: [id, version, captured_at]
      properties:
        id: {type: string, format: uuid}
        version: {type: integer, format: int64, minimum: 1}
        captured_at: {type: string, format: date-time}
# @ag-order: 21503
    KHTCPNProgram:
      type: object
      required: [ref, name, roman]
      properties:
        ref: {type: string, format: uuid}
        name: {type: string}
        roman: {type: string}
# @ag-order: 21504
    KHTCPNProgressRow:
      type: object
      required: [ref, parent_ref, kind, roman, name, unit, planned, year_to_date, percent, level, missing]
      properties:
        ref: {type: string, format: uuid}
        parent_ref: {type: [string, 'null'], format: uuid}
        kind: {type: string, enum: [program, group, item]}
        roman: {type: string}
        name: {type: string}
        department: {type: string}
        unit: {type: string}
        planned: {type: [string, 'null'], maxLength: 96}
        year_to_date: {type: string, maxLength: 96}
        percent: {type: [string, 'null'], maxLength: 96}
        level: {type: string}
        missing: {type: boolean}
# @ag-order: 21505
    KHTCPNProgress:
      type: object
      required: [department, period, status, snapshot, programs, rows]
      properties:
        department: {type: string}
        period: {$ref: '#/components/schemas/KHTCPNPeriod'}
        status: {type: string, enum: [snapshot, not_prepared]}
        snapshot:
          anyOf: [{$ref: '#/components/schemas/KHTCPNSource'}, {type: 'null'}]
        programs: {type: array, items: {$ref: '#/components/schemas/KHTCPNProgram'}}
        rows: {type: array, maxItems: 10000, items: {$ref: '#/components/schemas/KHTCPNProgressRow'}}
