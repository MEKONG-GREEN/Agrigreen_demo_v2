paths:
# @ag-order: 21000
  /v1/extension/cnts/campaigns:
    get:
      summary: "Danh sách đợt điều tra CNTS (W11.50 — FN-21) kèm tiến độ"
      operationId: extensionCntsListCampaigns
      tags: [extension]
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema: {type: object, required: [items], properties: {items: {type: array, items: {"$ref": "#/components/schemas/CNTSCampaign"}}}}
        "400": {$ref: "#/components/responses/Problem"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
    post:
      summary: "Tạo đợt điều tra (Nháp)"
      operationId: extensionCntsCreateCampaign
      tags: [extension]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {"$ref": "#/components/schemas/CNTSCampaignInput"}
      responses:
        "201":
          description: Đã tạo
          content:
            application/json:
              schema: {"$ref": "#/components/schemas/CNTSCampaign"}
        "200":
          description: Gọi lặp cùng Idempotency-Key
          content:
            application/json:
              schema: {"$ref": "#/components/schemas/CNTSCampaign"}
        "400": {$ref: "#/components/responses/Problem"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
# @ag-order: 21001
  /v1/extension/cnts/campaigns/{id}:
    get:
      summary: "Chi tiết đợt điều tra, tiến độ theo khu vực/xã"
      operationId: extensionCntsGetCampaign
      tags: [extension]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema: {"$ref": "#/components/schemas/CNTSCampaign"}
        "400": {$ref: "#/components/responses/Problem"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
