  /v1/extension/cnts/campaigns/{id}/draft:
    post:
      summary: "Sửa nội dung đợt Nháp (phiên bản mới)"
      operationId: extensionCntsUpdateCampaign
      tags: [extension]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
