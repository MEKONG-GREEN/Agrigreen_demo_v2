paths:
# @ag-order: 21100
  /v1/extension/cnts/map/layers:
    get:
      summary: "Lớp bản đồ vùng nuôi, vùng dịch theo ngày: vùng, ổ dịch BM-10, điểm/hộ mô hình có tọa độ, thống kê thửa HTX theo xã (FN-18, W11.52)"
      operationId: extensionCntsMapLayers
      tags: [extension]
      parameters:
        - {name: date, in: query, required: false, description: "Ngày xem YYYY-MM-DD (mặc định hôm nay, giờ Việt Nam)", schema: {type: string, format: date}}
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema: {"$ref": "#/components/schemas/CNTSMapLayers"}
        "400": {$ref: "#/components/responses/Problem"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {description: "extension.read_only | extension.out_of_scope", $ref: "#/components/responses/Problem"}
        "404": {description: "extension.cnts_zone_not_found", $ref: "#/components/responses/Problem"}
        "409": {description: "extension.cnts_zone_version_conflict | extension.cnts_zone_retired", $ref: "#/components/responses/Problem"}
        "422": {description: "extension.cnts_zone_invalid", $ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
# @ag-order: 21101
  /v1/extension/cnts/map/zones:
    get:
      summary: "Vùng trên bản đồ tại một ngày (phiên bản mới nhất có ngày áp dụng ≤ ngày xem — FN-18 BR-01, AC-03)"
      operationId: extensionCntsMapZoneList
      tags: [extension]
      parameters:
        - {name: date, in: query, required: false, description: "Ngày xem YYYY-MM-DD (mặc định hôm nay, giờ Việt Nam)", schema: {type: string, format: date}}
        - {name: kind, in: query, required: false, schema: {type: string, enum: [vung_chan_nuoi, vung_thuy_san, vung_dich, vung_uy_hiep, vung_dem, huong_di_chuyen]}}
        - {name: outbreak_ref, in: query, required: false, schema: {type: string, format: uuid}}
        - {name: with_retired, in: query, required: false, schema: {type: string, enum: ["true", "false"]}}
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema: {"$ref": "#/components/schemas/CNTSMapZoneList"}
        "400": {$ref: "#/components/responses/Problem"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {description: "extension.read_only | extension.out_of_scope", $ref: "#/components/responses/Problem"}
        "404": {description: "extension.cnts_zone_not_found", $ref: "#/components/responses/Problem"}
        "409": {description: "extension.cnts_zone_version_conflict | extension.cnts_zone_retired", $ref: "#/components/responses/Problem"}
        "422": {description: "extension.cnts_zone_invalid", $ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
    post:
      summary: "Vẽ vùng (đa giác, theo bán kính, hướng di chuyển) — cán bộ phụ trách dịch Cấp Tỉnh, Admin"
      operationId: extensionCntsMapZoneCreate
      tags: [extension]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {"$ref": "#/components/schemas/CNTSMapZoneSave"}
      responses:
        "200":
          description: Gọi lặp (Idempotency-Key) — trả bản đã ghi
          content:
            application/json:
              schema: {"$ref": "#/components/schemas/CNTSMapZone"}
        "201":
          description: Thành công
          content:
            application/json:
              schema: {"$ref": "#/components/schemas/CNTSMapZone"}
        "400": {$ref: "#/components/responses/Problem"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {description: "extension.read_only | extension.out_of_scope", $ref: "#/components/responses/Problem"}
        "404": {description: "extension.cnts_zone_not_found", $ref: "#/components/responses/Problem"}
        "409": {description: "extension.cnts_zone_version_conflict | extension.cnts_zone_retired", $ref: "#/components/responses/Problem"}
        "422": {description: "extension.cnts_zone_invalid", $ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
# @ag-order: 21102
  /v1/extension/cnts/map/zones/from-outbreak:
    post:
      summary: "Khoanh vùng dịch, vùng bị uy hiếp, vùng đệm theo bán kính quanh ổ dịch BM-10 (mặc định 500 m / 3 km / 10 km)"
      operationId: extensionCntsMapZoneFromOutbreak
      tags: [extension]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {"$ref": "#/components/schemas/CNTSMapFromOutbreak"}
      responses:
        "200":
          description: Gọi lặp (Idempotency-Key) — trả các vùng đã tạo
          content:
            application/json:
              schema: {"$ref": "#/components/schemas/CNTSMapZoneItems"}
        "201":
          description: Thành công
          content:
            application/json:
              schema: {"$ref": "#/components/schemas/CNTSMapZoneItems"}
        "400": {$ref: "#/components/responses/Problem"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {description: "extension.read_only | extension.out_of_scope", $ref: "#/components/responses/Problem"}
        "404": {description: "extension.cnts_zone_not_found", $ref: "#/components/responses/Problem"}
        "409": {description: "extension.cnts_zone_version_conflict | extension.cnts_zone_retired", $ref: "#/components/responses/Problem"}
        "422": {description: "extension.cnts_zone_invalid", $ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
# @ag-order: 21103
  /v1/extension/cnts/map/zones/{ref}:
    get:
      summary: "Vùng hiện hành và lịch sử phiên bản (mới nhất trước)"
      operationId: extensionCntsMapZoneGet
      tags: [extension]
      parameters:
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema: {"$ref": "#/components/schemas/CNTSMapZoneDetail"}
        "400": {$ref: "#/components/responses/Problem"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {description: "extension.read_only | extension.out_of_scope", $ref: "#/components/responses/Problem"}
        "404": {description: "extension.cnts_zone_not_found", $ref: "#/components/responses/Problem"}
        "409": {description: "extension.cnts_zone_version_conflict | extension.cnts_zone_retired", $ref: "#/components/responses/Problem"}
        "422": {description: "extension.cnts_zone_invalid", $ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
    post:
      summary: "Sửa vùng — phiên bản mới (base_version, lý do, ngày áp dụng không sớm hơn bản trước)"
      operationId: extensionCntsMapZoneUpdate
      tags: [extension]
      parameters:
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {"$ref": "#/components/schemas/CNTSMapZoneSave"}
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema: {"$ref": "#/components/schemas/CNTSMapZone"}
        "400": {$ref: "#/components/responses/Problem"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {description: "extension.read_only | extension.out_of_scope", $ref: "#/components/responses/Problem"}
        "404": {description: "extension.cnts_zone_not_found", $ref: "#/components/responses/Problem"}
        "409": {description: "extension.cnts_zone_version_conflict | extension.cnts_zone_retired", $ref: "#/components/responses/Problem"}
        "422": {description: "extension.cnts_zone_invalid", $ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
