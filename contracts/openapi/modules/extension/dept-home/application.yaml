# @ag-order: 20107
  /v1/extension/dept-docs:
    get:
      summary: "Văn bản của phòng (FN-20: lọc, tìm; hết hiệu lực vẫn có, nhãn validity)"
      operationId: extensionDeptDocList
      tags: [extension]
      parameters:
        - {name: department, in: query, required: false, description: "Mã phòng ban — bắt buộc với Admin; vai khác chỉ được bằng phòng của ngữ cảnh", schema: {type: string}}
        - {name: folder, in: query, required: false, schema: {type: string, format: uuid}}
        - {name: q, in: query, required: false, description: "Tìm trong tên, số hiệu, cơ quan ban hành, lĩnh vực, trích yếu", schema: {type: string}}
        - {name: kind, in: query, required: false, schema: {type: string}}
        - {name: validity, in: query, required: false, schema: {type: string, enum: [active, pending, expired]}}
        - {name: include_hidden, in: query, required: false, schema: {type: string, enum: ["1"]}}
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema: {"$ref": "#/components/schemas/DeptDocList"}
        "400": {$ref: "#/components/responses/Problem"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
    post:
      summary: "Thêm văn bản: multipart meta (JSON DeptDocInput) + file (PDF, DOCX, XLSX ≤ 20 MB)"
      operationId: extensionDeptDocCreate
      tags: [extension]
      parameters:
        - {name: department, in: query, required: false, description: "Mã phòng ban — bắt buộc với Admin; vai khác chỉ được bằng phòng của ngữ cảnh", schema: {type: string}}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [meta, file]
              properties:
                meta: {type: string, description: "JSON của DeptDocInput"}
                file: {type: string, format: binary}
      responses:
        "201":
          description: Thành công
          content:
            application/json:
              schema: {"$ref": "#/components/schemas/DeptDoc"}
        "400": {$ref: "#/components/responses/Problem"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "413": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
