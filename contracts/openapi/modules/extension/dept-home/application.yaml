components:
  schemas:
# @ag-order: 30100
    DeptActor: {"type": "object", "properties": {"ref": {"type": "string", "format": "uuid"}, "display": {"type": ["string", "null"]}}, "required": ["ref", "display"], "additionalProperties": false}
# @ag-order: 30101
    DeptProfile: {"type": "object", "properties": {"department_code": {"type": "string"}, "intro": {"type": "string"}, "duties": {"type": "string"}, "version": {"type": "integer"}, "recorded_at": {"type": "string", "format": "date-time"}, "actor": {"$ref": "#/components/schemas/DeptActor"}}, "required": ["department_code", "intro", "duties", "version", "recorded_at", "actor"], "additionalProperties": false}
# @ag-order: 30102
    DeptProfileInput: {"type": "object", "properties": {"intro": {"type": "string"}, "duties": {"type": "string"}, "base_version": {"type": "integer", "description": "0 khi chưa có bản nào"}}, "required": ["base_version"], "additionalProperties": false}
# @ag-order: 30103
    DeptProfileList: {"type": "object", "properties": {"items": {"type": "array", "items": {"$ref": "#/components/schemas/DeptProfile"}}}, "required": ["items"], "additionalProperties": false}
# @ag-order: 30104
    DeptKPI: {"type": "object", "properties": {"key": {"type": "string"}, "label": {"type": "string"}, "value": {"type": "integer"}, "tone": {"type": "string", "enum": ["neutral", "ok", "warn", "bad", "info"]}}, "required": ["key", "label", "value", "tone"], "additionalProperties": false}
# @ag-order: 30105
    DeptClosedPeriod: {"type": "object", "properties": {"form_code": {"type": "string"}, "period_type": {"type": "string"}, "period_key": {"type": "string"}, "period_label": {"type": "string"}, "period_to": {"type": ["string", "null"], "format": "date"}, "units_total": {"type": ["integer", "null"]}, "units_with_data": {"type": ["integer", "null"]}, "closed": {"type": "boolean"}, "closed_at": {"type": ["string", "null"], "format": "date-time"}}, "required": ["form_code", "period_type", "period_key", "period_label", "period_to", "units_total", "units_with_data", "closed", "closed_at"], "additionalProperties": false}
# @ag-order: 30106
    DeptOfficer: {"type": "object", "properties": {"actor": {"$ref": "#/components/schemas/DeptActor"}, "mgmt_level": {"type": ["string", "null"]}, "leader": {"type": "boolean"}}, "required": ["actor", "mgmt_level", "leader"], "additionalProperties": false}
# @ag-order: 30107
    DeptPrice: {"type": "object", "properties": {"board_date": {"type": ["string", "null"], "format": "date"}, "items": {"type": "integer"}, "week_key": {"type": ["string", "null"]}, "tickets": {"type": "integer"}, "week_days_approved": {"type": "integer"}}, "required": ["board_date", "items", "week_key", "tickets", "week_days_approved"], "additionalProperties": false}
# @ag-order: 30108
