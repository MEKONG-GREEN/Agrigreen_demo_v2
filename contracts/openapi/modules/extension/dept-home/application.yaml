      tags: [extension]
      parameters:
        - {name: department, in: query, required: false, description: "Mã phòng ban — bắt buộc với Admin; vai khác chỉ được bằng phòng của ngữ cảnh", schema: {type: string}}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {"$ref": "#/components/schemas/DeptProfileInput"}
      responses:
        "201":
          description: Thành công
          content:
            application/json:
              schema: {"$ref": "#/components/schemas/DeptProfile"}
        "400": {$ref: "#/components/responses/Problem"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
