components:
  schemas:
# @ag-order: 20080
    KHTCAdhocIndicator: {"type":"object","required":["code","name","unit"],"additionalProperties":false,"properties":{"code":{"type":"string","pattern":"^[A-Z][A-Z0-9_]{0,39}$"},"name":{"type":"string","minLength":1,"maxLength":200},"unit":{"type":"string","maxLength":50}}}
# @ag-order: 20081
    KHTCAdhocRequestInput: {"type":"object","required":["department","instruction","due_at","indicators"],"additionalProperties":false,"properties":{"department":{"type":"string","minLength":1,"maxLength":64},"instruction":{"type":"string","minLength":1,"maxLength":4000},"due_at":{"type":"string","format":"date-time"},"indicators":{"type":"array","maxItems":20,"items":{"$ref":"#/components/schemas/KHTCAdhocIndicator"}}}}
# @ag-order: 20082
    KHTCAdhocRequest: {"type":"object","required":["id","period_id","department","instruction","due_at","indicators","state","overdue","return_applied","actor_ref","at"],"additionalProperties":false,"properties":{"department":{"type":"string","minLength":1,"maxLength":64},"instruction":{"type":"string","minLength":1,"maxLength":4000},"due_at":{"type":"string","format":"date-time"},"indicators":{"type":"array","maxItems":20,"items":{"$ref":"#/components/schemas/KHTCAdhocIndicator"}},"id":{"type":"string","format":"uuid"},"period_id":{"type":"string","format":"uuid"},"state":{"type":"string","enum":["intent","issued","fulfilled","cancelled","failed"]},"overdue":{"type":"boolean"},"return_applied":{"type":["boolean","null"]},"actor_ref":{"type":"string","format":"uuid"},"at":{"type":"string","format":"date-time"}}}

# @ag-order: 20083
    KHTCAdhocOpenRecovery: {"type":"object","additionalProperties":false,"required":["id","name","from","to","due_at","departments","generation","requires_adoption","can_adopt","lease_expires_at","created_at"],"properties":{"id":{"type":"string","format":"uuid"},"name":{"type":"string"},"departments":{"type":"array","maxItems":64,"items":{"type":"string"}},"generation":{"type":"integer","minimum":0},"requires_adoption":{"type":"boolean"},"can_adopt":{"type":"boolean"},"from":{"type":"string","format":"date-time"},"to":{"type":"string","format":"date-time"},"due_at":{"type":"string","format":"date-time"},"lease_expires_at":{"type":"string","format":"date-time"},"created_at":{"type":"string","format":"date-time"}}}
