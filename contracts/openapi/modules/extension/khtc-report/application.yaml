paths:
# @ag-order: 20000
  /v1/extension/khtc/periods/{id}/report:
    get:
      summary: "Bản soạn Mẫu 1–5, ô số chỉ đọc và mốc dữ liệu"
      operationId: extensionKhtcReportGet
      tags: [extension]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema: {"$ref": "#/components/schemas/KHTCReportDetail"}
        "400": {$ref: "#/components/responses/Problem"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
# @ag-order: 20001
  /v1/extension/khtc/periods/{id}/report/draft:
    post:
      summary: "Lưu ô hành chính và lời văn; không nhận số liệu hệ thống"
      operationId: extensionKhtcReportSave
      tags: [extension]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {"$ref": "#/components/schemas/KHTCReportSave"}
      responses:
        "201":
          description: Thành công
          content:
            application/json:
              schema: {"$ref": "#/components/schemas/KHTCReportDetail"}
        "400": {$ref: "#/components/responses/Problem"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
# @ag-order: 20002
  /v1/extension/khtc/periods/{id}/report/refresh:
    post:
      summary: "Cán bộ phụ trách cập nhật số liệu, giữ ô hành chính sửa tay"
      operationId: extensionKhtcReportRefresh
      tags: [extension]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {"$ref": "#/components/schemas/KHTCReportRefresh"}
      responses:
        "201":
          description: Thành công
          content:
            application/json:
              schema: {"$ref": "#/components/schemas/KHTCReportDetail"}
        "400": {$ref: "#/components/responses/Problem"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
# @ag-order: 20003
  /v1/extension/khtc/periods/{id}/report/exports:
    get:
      summary: "Lịch sử các phiên bản Excel bất biến"
      operationId: extensionKhtcReportExports
      tags: [extension]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema: {"$ref": "#/components/schemas/KHTCReportExportList"}
        "400": {$ref: "#/components/responses/Problem"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
    post:
      summary: "Xuất Excel từ bản soạn đã lưu; xác nhận cảnh báo Tạm tính"
      operationId: extensionKhtcReportExport
      tags: [extension]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {"$ref": "#/components/schemas/KHTCReportExportInput"}
      responses:
        "201":
          description: Thành công
          content:
            application/json:
              schema: {"$ref": "#/components/schemas/KHTCReportExport"}
        "400": {$ref: "#/components/responses/Problem"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
# @ag-order: 20004
  /v1/extension/khtc/periods/{id}/report/exports/{exportID}/download:
    get:
      summary: "Tải nguyên tệp của phiên bản đã xuất"
      operationId: extensionKhtcReportDownload
      tags: [extension]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: exportID, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Thành công
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: {type: string, format: binary}
        "400": {$ref: "#/components/responses/Problem"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
# @ag-order: 20005
  /v1/extension/khtc/periods/{id}/report/exports/{exportID}/final:
    post:
      summary: "Đánh dấu Bản cuối khi không Tạm tính và nguồn chưa đổi"
      operationId: extensionKhtcReportFinalize
      tags: [extension]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: exportID, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {"type": "object", "properties": {}, "required": [], "additionalProperties": false}
      responses:
        "201":
          description: Thành công
          content:
            application/json:
              schema: {"$ref": "#/components/schemas/KHTCReportDetail"}
        "400": {$ref: "#/components/responses/Problem"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
