paths:
# @ag-order: 20006
  /v1/extension/khtc/periods/{id}/report/exports/{exportID}/word:
    post:
      summary: "Xuất Word (.docx) từ nội dung đóng băng của một bản Excel — qua pf/export, tự cấp số {n}/BC-TTKN khi ô số trống (W10.17)"
      operationId: extensionKhtcReportWordExport
      tags: [extension]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: exportID, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {"type": "object", "properties": {}, "required": [], "additionalProperties": false}
      responses:
        "201":
          description: Thành công
          content:
            application/json:
              schema: {"$ref": "#/components/schemas/KHTCReportWord"}
        "400": {$ref: "#/components/responses/Problem"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
# @ag-order: 20007
  /v1/extension/khtc/periods/{id}/report/words:
    get:
      summary: "Lịch sử các lần xuất Word của báo cáo (mới nhất trước)"
      operationId: extensionKhtcReportWordHistory
      tags: [extension]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema: {"$ref": "#/components/schemas/KHTCReportWordList"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
# @ag-order: 20008
  /v1/extension/khtc/periods/{id}/report/words/{runID}/download:
    get:
      summary: "Tải nguyên tệp Word đã lưu (kiểm băm SHA-256)"
      operationId: extensionKhtcReportWordDownload
      tags: [extension]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: runID, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Thành công
          content:
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema: {type: string, format: binary}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
components:
  schemas:
# @ag-order: 30019
    KHTCReportWord: {"type":"object","properties":{"id":{"type":"string","format":"uuid"},"seq":{"type":"integer"},"template":{"type":"string"},"template_version":{"type":"integer"},"template_hash":{"type":"string"},"input_hash":{"type":"string"},"doc_number":{"type":"string"},"doc_number_auto":{"type":"boolean"},"file_name":{"type":"string"},"body_hash":{"type":"string"},"size":{"type":"integer"},"actor_ref":{"type":"string","format":"uuid"},"at":{"type":"string","format":"date-time"}},"required":["id","seq","template","template_version","template_hash","input_hash","doc_number","doc_number_auto","file_name","body_hash","size","actor_ref","at"],"additionalProperties":false}
# @ag-order: 30020
    KHTCReportWordList: {"type":"object","properties":{"items":{"type":"array","items":{"$ref":"#/components/schemas/KHTCReportWord"}}},"required":["items"],"additionalProperties":false}
