  /v1/extension/khtc/templates/{key}/publish:
    post:
      summary: "Phát hành phiên bản theo ngày bắt đầu kỳ"
      operationId: extensionKhtcTemplatePublish
      tags: [extension]
      parameters: [{"name":"key","in":"path","required":true,"schema":{"$ref":"#/components/schemas/KHTCTemplateKey"}},{"$ref":"#/components/parameters/IdempotencyKey"}]
      requestBody: {"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/KHTCTemplatePublish"}}}}
      responses: {"201":{"description":"Thành công","content":{"application/json":{"schema":{"$ref":"#/components/schemas/KHTCTemplatePublication"}}}},"400":{"$ref":"#/components/responses/Problem"},"401":{"$ref":"#/components/responses/Problem"},"403":{"$ref":"#/components/responses/Problem"},"404":{"$ref":"#/components/responses/Problem"},"409":{"$ref":"#/components/responses/Problem"},"422":{"$ref":"#/components/responses/Problem"},"503":{"$ref":"#/components/responses/Problem"}}
# @ag-order: 24036
  /v1/extension/khtc/templates/{key}/preview:
    post:
      summary: "Xem trước từ snapshot dữ liệu kỳ thật; tình huống mô phỏng có nhãn"
      operationId: extensionKhtcTemplatePreview
      tags: [extension]
      parameters: [{"name":"key","in":"path","required":true,"schema":{"$ref":"#/components/schemas/KHTCTemplateKey"}},{"$ref":"#/components/parameters/IdempotencyKey"}]
      requestBody: {"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/KHTCTemplatePreviewInput"}}}}
      responses: {"200":{"description":"Thành công","content":{"application/json":{"schema":{"$ref":"#/components/schemas/KHTCTemplatePreview"}}}},"400":{"$ref":"#/components/responses/Problem"},"401":{"$ref":"#/components/responses/Problem"},"403":{"$ref":"#/components/responses/Problem"},"404":{"$ref":"#/components/responses/Problem"},"409":{"$ref":"#/components/responses/Problem"},"422":{"$ref":"#/components/responses/Problem"},"503":{"$ref":"#/components/responses/Problem"}}
components:
  schemas:
# @ag-order: 34031
    KHTCTemplateKey: {"type":"string","enum":["mau_1","mau_2","mau_3","mau_4","mau_5"]}
# @ag-order: 34032
    KHTCTemplateBinding: {"type":"object","properties":{"variable":{"type":"string","pattern":"^[a-z][a-z0-9_]{0,39}$"},"source":{"type":"string","enum":["plan","auto","form","module","calculated","admin","text"]},"field":{"type":"string"},"ref":{"type":"string","maxLength":200}},"required":["variable","source","field"],"additionalProperties":false}
# @ag-order: 34033
    KHTCTemplateNode: {"type":"object","properties":{"id":{"type":"string","maxLength":80},"parent":{"type":"string"},"order":{"type":"integer","minimum":1,"maximum":10000},"title":{"type":"string","minLength":1,"maxLength":500},"repeat":{"type":"string","enum":["none","plan_item","program","metric","commodity","form_bullet"]},"tab":{"type":"string","enum":["","all","previous","current"]},"department":{"type":"string"},"preamble":{"type":"string","maxLength":1000},"body":{"type":"string","maxLength":12000},"bindings":{"type":"array","maxItems":32,"items":{"$ref":"#/components/schemas/KHTCTemplateBinding"}},"text_slot":{"type":"boolean"},"locked_admin":{"type":"array","items":{"type":"string"}}},"required":["id","parent","order","title","repeat","body","bindings","text_slot","locked_admin"],"additionalProperties":false}
# @ag-order: 34034
    KHTCTemplateDefinition: {"type":"object","properties":{"key":{"$ref":"#/components/schemas/KHTCTemplateKey"},"nodes":{"type":"array","minItems":1,"maxItems":256,"items":{"$ref":"#/components/schemas/KHTCTemplateNode"}}},"required":["key","nodes"],"additionalProperties":false}
# @ag-order: 34035
    KHTCTemplateVersion: {"type":"object","properties":{"id":{"type":"string","format":"uuid"},"key":{"$ref":"#/components/schemas/KHTCTemplateKey"},"version":{"type":"integer","minimum":1},"action":{"type":"string","enum":["save","restore"]},"definition":{"$ref":"#/components/schemas/KHTCTemplateDefinition"},"hash":{"type":"string"},"restored_from":{"type":"string","format":"uuid"},"actor":{"type":"string","format":"uuid"},"at":{"type":"string","format":"date-time"},"actor_display":{"type":"string"},"rule":{"type":"string"}},"required":["id","key","version","action","definition","hash","actor","at","actor_display","rule"],"additionalProperties":false}
# @ag-order: 34036
    KHTCTemplatePublication: {"type":"object","properties":{"id":{"type":"string","format":"uuid"},"key":{"$ref":"#/components/schemas/KHTCTemplateKey"},"sequence":{"type":"integer"},"version_id":{"type":"string","format":"uuid"},"version":{"type":"integer"},"hash":{"type":"string"},"applies_from":{"type":"string","format":"date-time"},"actor":{"type":"string","format":"uuid"},"at":{"type":"string","format":"date-time"},"actor_display":{"type":"string"}},"required":["id","key","sequence","version_id","version","hash","applies_from","actor","at","actor_display"],"additionalProperties":false}
# @ag-order: 34037
    KHTCTemplateDetail: {"type":"object","properties":{"key":{"$ref":"#/components/schemas/KHTCTemplateKey"},"version_id":{"type":"string","format":"uuid","nullable":true},"version":{"type":"integer"},"definition":{"$ref":"#/components/schemas/KHTCTemplateDefinition"},"hash":{"type":"string"},"history":{"type":"array","items":{"$ref":"#/components/schemas/KHTCTemplateVersion"}},"publications":{"type":"array","items":{"$ref":"#/components/schemas/KHTCTemplatePublication"}},"editable":{"type":"boolean"},"protected_ids":{"type":"array","items":{"type":"string"}},"seeded_ids":{"type":"array","items":{"type":"string"}}},"required":["key","version_id","version","definition","hash","history","publications","editable","protected_ids","seeded_ids"],"additionalProperties":false}
# @ag-order: 34038
    KHTCTemplateCatalog: {"type":"object","properties":{"items":{"type":"array","items":{"$ref":"#/components/schemas/KHTCTemplateDetail"}}},"required":["items"],"additionalProperties":false}
# @ag-order: 34039
    KHTCTemplateSave: {"type":"object","properties":{"base_version":{"type":"integer","minimum":0,"maximum":1000000000},"definition":{"$ref":"#/components/schemas/KHTCTemplateDefinition"},"acknowledge_text_loss":{"type":"boolean"}},"required":["base_version","definition"],"additionalProperties":false}
# @ag-order: 34040
    KHTCTemplateRestore: {"type":"object","properties":{"base_version":{"type":"integer","minimum":1,"maximum":1000000000},"version_id":{"type":"string","format":"uuid"},"acknowledge_text_loss":{"type":"boolean"}},"required":["base_version","version_id"],"additionalProperties":false}
# @ag-order: 34041
    KHTCTemplatePublish: {"type":"object","properties":{"base_version":{"type":"integer","minimum":1,"maximum":1000000000},"version_id":{"type":"string","format":"uuid"},"applies_from":{"type":"string","format":"date"}},"required":["base_version","version_id","applies_from"],"additionalProperties":false}
# @ag-order: 34042
    KHTCTemplatePreviewInput: {"type":"object","properties":{"period_id":{"type":"string","format":"uuid"},"version_id":{"type":"string","format":"uuid","nullable":true},"definition":{"allOf":[{"$ref":"#/components/schemas/KHTCTemplateDefinition"}],"nullable":true},"scenario":{"type":"string","enum":["actual","normal","no_send","unclosed","no_activity","provisional"]}},"required":[],"additionalProperties":false}
# @ag-order: 34043
    KHTCTemplateSourceRow: {"type":"object","properties":{"ref":{"type":"string"},"parent_ref":{"type":"string"},"program_ref":{"type":"string"},"department":{"type":"string"},"status":{"type":"string"},"values":{"type":"object","additionalProperties":{"type":"string"}}},"required":["ref","values"],"additionalProperties":false}
# @ag-order: 34044
    KHTCTemplateContext: {"type":"object","properties":{"period_id":{"type":"string","format":"uuid"},"period_name":{"type":"string"},"period_type":{"type":"string"},"period_start":{"type":"string","format":"date-time"},"plan_version_id":{"type":"string","format":"uuid"},"values":{"type":"object","additionalProperties":{"type":"string"}},"lists":{"type":"object","additionalProperties":{"type":"array","items":{"$ref":"#/components/schemas/KHTCTemplateSourceRow"}}},"texts":{"type":"object","additionalProperties":{"type":"string"}},"provisional":{"type":"array","items":{"type":"string"}},"input_hash":{"type":"string"}},"required":["period_id","period_name","period_type","period_start","plan_version_id","values","lists","texts","provisional","input_hash"],"additionalProperties":false}
# @ag-order: 34045
    KHTCTemplateToken: {"type":"object","properties":{"text":{"type":"string"},"variable":{"type":"string"},"source":{"type":"string"},"field":{"type":"string"},"locked":{"type":"boolean"}},"required":["text","locked"],"additionalProperties":false}
# @ag-order: 34046
    KHTCTemplateRenderedRow: {"type":"object","properties":{"ref":{"type":"string"},"preamble":{"type":"string"},"status":{"type":"string"},"tokens":{"type":"array","items":{"$ref":"#/components/schemas/KHTCTemplateToken"}},"preamble_tokens":{"type":"array","items":{"$ref":"#/components/schemas/KHTCTemplateToken"}}},"required":["ref","tokens"],"additionalProperties":false}
# @ag-order: 34047
    KHTCTemplateRenderedNode: {"type":"object","properties":{"id":{"type":"string"},"parent":{"type":"string"},"number":{"type":"string"},"title":{"type":"string"},"depth":{"type":"integer"},"processing":{"type":"string"},"protected":{"type":"boolean"},"seeded":{"type":"boolean"},"text_slot":{"type":"boolean"},"rows":{"type":"array","items":{"$ref":"#/components/schemas/KHTCTemplateRenderedRow"}}},"required":["id","parent","number","title","depth","processing","protected","seeded","text_slot","rows"],"additionalProperties":false}
# @ag-order: 34048
    KHTCTemplateRendered: {"type":"object","properties":{"key":{"$ref":"#/components/schemas/KHTCTemplateKey"},"nodes":{"type":"array","items":{"$ref":"#/components/schemas/KHTCTemplateRenderedNode"}},"input_hash":{"type":"string"},"provisional":{"type":"array","items":{"type":"string"}}},"required":["key","nodes","input_hash","provisional"],"additionalProperties":false}
# @ag-order: 34049
    KHTCTemplatePreview: {"type":"object","properties":{"context":{"$ref":"#/components/schemas/KHTCTemplateContext"},"document":{"$ref":"#/components/schemas/KHTCTemplateRendered"},"definition_hash":{"type":"string"},"scenario":{"type":"string"}},"required":["context","document","definition_hash","scenario"],"additionalProperties":false}
# @ag-order: 34050
    KHTCFixedTemplateSnapshot:
      type: object
      readOnly: true
      description: "Nguồn mẫu đã ghim trong revision; không chọn lại phiên bản mới khi đọc hoặc xuất lịch sử."
      properties:
        mode: {type: string, enum: [legacy, published]}
        rule: {type: string}
        id: {type: string, format: uuid}
        key: {$ref: '#/components/schemas/KHTCTemplateKey'}
        version: {type: integer, minimum: 1, maximum: 1000000000}
        hash: {type: string, pattern: '^[a-f0-9]{64}$'}
        definition: {type: object, additionalProperties: true, readOnly: true}
        applicable_from: {type: string, format: date-time}
        legacy_until: {type: string, format: date-time}
        word_key: {type: string}
        word_version: {type: integer, minimum: 1}
        word_hash: {type: string, pattern: '^[a-f0-9]{64}$'}
        excel_rule: {type: string}
      required: [mode, rule, id, key, version, hash, definition, applicable_from, word_key, word_version, word_hash, excel_rule]
      additionalProperties: false
