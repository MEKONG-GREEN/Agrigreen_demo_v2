# @ag-order: 24033
  /v1/extension/khtc/templates/{key}/versions:
    post:
      summary: "Lưu phiên bản nháp bất biến"
      operationId: extensionKhtcTemplateSave
      tags: [extension]
      parameters: [{"name":"key","in":"path","required":true,"schema":{"$ref":"#/components/schemas/KHTCTemplateKey"}},{"$ref":"#/components/parameters/IdempotencyKey"}]
      requestBody: {"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/KHTCTemplateSave"}}}}
      responses: {"201":{"description":"Thành công","content":{"application/json":{"schema":{"$ref":"#/components/schemas/KHTCTemplateVersion"}}}},"400":{"$ref":"#/components/responses/Problem"},"401":{"$ref":"#/components/responses/Problem"},"403":{"$ref":"#/components/responses/Problem"},"404":{"$ref":"#/components/responses/Problem"},"409":{"$ref":"#/components/responses/Problem"},"422":{"$ref":"#/components/responses/Problem"},"503":{"$ref":"#/components/responses/Problem"}}
# @ag-order: 24034
  /v1/extension/khtc/templates/{key}/restore:
    post:
      summary: "Khôi phục phiên bản cũ thành bản nháp mới"
      operationId: extensionKhtcTemplateRestore
      tags: [extension]
      parameters: [{"name":"key","in":"path","required":true,"schema":{"$ref":"#/components/schemas/KHTCTemplateKey"}},{"$ref":"#/components/parameters/IdempotencyKey"}]
      requestBody: {"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/KHTCTemplateRestore"}}}}
      responses: {"201":{"description":"Thành công","content":{"application/json":{"schema":{"$ref":"#/components/schemas/KHTCTemplateVersion"}}}},"400":{"$ref":"#/components/responses/Problem"},"401":{"$ref":"#/components/responses/Problem"},"403":{"$ref":"#/components/responses/Problem"},"404":{"$ref":"#/components/responses/Problem"},"409":{"$ref":"#/components/responses/Problem"},"422":{"$ref":"#/components/responses/Problem"},"503":{"$ref":"#/components/responses/Problem"}}
