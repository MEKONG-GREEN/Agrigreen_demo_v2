# @ag-order: 21000
  /v1/extension/cnts/projects:
    get:
      summary: "Chương trình, dự án CNTS trong phạm vi (UR-TINH-19, W11.47)"
      operationId: extensionCntsProjectList
      tags: [extension]
      parameters:
        - {name: status, in: query, required: false, schema: {type: string, enum: [active, closed]}}
        - {name: kind, in: query, required: false, schema: {type: string, enum: [tinh, knqg, hop_tac]}}
        - {name: q, in: query, required: false, schema: {type: string}}
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema: {"$ref": "#/components/schemas/CNTSProjectList"}
        "400": {$ref: "#/components/responses/Problem"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
    post:
      summary: "Tạo chương trình, dự án — chủ nhiệm, lãnh đạo phòng Cấp Tỉnh, Admin"
      operationId: extensionCntsProjectCreate
      tags: [extension]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {"$ref": "#/components/schemas/CNTSProjectSave"}
      responses:
        "200":
          description: Gọi lặp (Idempotency-Key) — trả bản đã ghi
          content:
            application/json:
              schema: {"$ref": "#/components/schemas/CNTSProjectDetail"}
        "201":
          description: Thành công
          content:
            application/json:
              schema: {"$ref": "#/components/schemas/CNTSProjectDetail"}
        "400": {$ref: "#/components/responses/Problem"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {description: "extension.cnts_project_not_found", $ref: "#/components/responses/Problem"}
        "409": {description: "extension.cnts_project_version_conflict | extension.cnts_project_code_taken | extension.cnts_project_closed", $ref: "#/components/responses/Problem"}
        "422": {description: "extension.cnts_project_invalid", $ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
