paths:
# @ag-order: 35000
  /v1/extension/cnts/livestock-households:
    get:
      summary: "Danh sách hộ chăn nuôi trong phạm vi (FN-10, UR-XA-04; Cấp Xã chỉ xã phụ trách — AC-06). Họ tên che bớt, SĐT che một phần"
      operationId: extensionCntsLivestockHouseholdList
      tags: [extension]
      parameters:
        - {name: commune, in: query, required: false, schema: {type: string}}
        - {name: status, in: query, required: false, schema: {type: string, enum: [active, pending_location, deactivated]}}
        - {name: livestock_type, in: query, required: false, schema: {type: string, enum: [nong_ho, trang_trai_nho, trang_trai_vua, trang_trai_cong_nghiep]}}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 200}}
        - {name: offset, in: query, required: false, schema: {type: integer, minimum: 0, maximum: 100000}}
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema: {"$ref": "#/components/schemas/CNTSLivestockHouseholdList"}
        "400": {$ref: "#/components/responses/Problem"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {description: "forbidden | extension.out_of_scope | extension.read_only", $ref: "#/components/responses/Problem"}
        "404": {description: "extension.cnts_livestock_household_not_found", $ref: "#/components/responses/Problem"}
        "409": {description: "extension.cnts_livestock_household_version_conflict | extension.cnts_livestock_household_duplicate | extension.cnts_livestock_household_deactivated | extension.cnts_livestock_household_phone_taken", $ref: "#/components/responses/Problem"}
        "422": {description: "extension.cnts_livestock_household_invalid | extension.cnts_livestock_household_checkin_required", $ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
    post:
      summary: "Thêm hộ (H1–H3) — bắt buộc check-in tại nhà hộ (AC-05); trùng họ tên, ấp, xã → 409 trừ khi confirm_distinct. Cấp Xã (xã mình), cán bộ tổng hợp Cấp Tỉnh, Admin"
      operationId: extensionCntsLivestockHouseholdCreate
      tags: [extension]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {"$ref": "#/components/schemas/CNTSLivestockHouseholdSave"}
      responses:
        "200":
          description: Gọi lặp (Idempotency-Key) — trả bản đã ghi
          content:
            application/json:
              schema: {"$ref": "#/components/schemas/CNTSLivestockHouseholdDetail"}
        "201":
          description: Thành công
          content:
            application/json:
              schema: {"$ref": "#/components/schemas/CNTSLivestockHouseholdDetail"}
        "400": {$ref: "#/components/responses/Problem"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {description: "forbidden | extension.out_of_scope | extension.read_only", $ref: "#/components/responses/Problem"}
        "404": {description: "extension.cnts_livestock_household_not_found", $ref: "#/components/responses/Problem"}
        "409": {description: "extension.cnts_livestock_household_version_conflict | extension.cnts_livestock_household_duplicate | extension.cnts_livestock_household_deactivated | extension.cnts_livestock_household_phone_taken", $ref: "#/components/responses/Problem"}
        "422": {description: "extension.cnts_livestock_household_invalid | extension.cnts_livestock_household_checkin_required", $ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
# @ag-order: 35001
  /v1/extension/cnts/livestock-households/{ref}:
    get:
      summary: "Chi tiết hộ, vị trí check-in hiện hành, lịch sử thay đổi HCN-09 (họ tên/SĐT cũ → mới chỉ dạng che bớt)"
      operationId: extensionCntsLivestockHouseholdGet
      tags: [extension]
      parameters:
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema: {"$ref": "#/components/schemas/CNTSLivestockHouseholdDetail"}
        "400": {$ref: "#/components/responses/Problem"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {description: "forbidden | extension.out_of_scope | extension.read_only", $ref: "#/components/responses/Problem"}
        "404": {description: "extension.cnts_livestock_household_not_found", $ref: "#/components/responses/Problem"}
        "409": {description: "extension.cnts_livestock_household_version_conflict | extension.cnts_livestock_household_duplicate | extension.cnts_livestock_household_deactivated | extension.cnts_livestock_household_phone_taken", $ref: "#/components/responses/Problem"}
        "422": {description: "extension.cnts_livestock_household_invalid | extension.cnts_livestock_household_checkin_required", $ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
    post:
      summary: "Sửa thông tin hộ (H4, base_version) — không đổi vị trí; hộ đã vô hiệu hóa → 409"
      operationId: extensionCntsLivestockHouseholdUpdate
      tags: [extension]
      parameters:
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {"$ref": "#/components/schemas/CNTSLivestockHouseholdSave"}
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema: {"$ref": "#/components/schemas/CNTSLivestockHouseholdDetail"}
        "400": {$ref: "#/components/responses/Problem"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {description: "forbidden | extension.out_of_scope | extension.read_only", $ref: "#/components/responses/Problem"}
        "404": {description: "extension.cnts_livestock_household_not_found", $ref: "#/components/responses/Problem"}
        "409": {description: "extension.cnts_livestock_household_version_conflict | extension.cnts_livestock_household_duplicate | extension.cnts_livestock_household_deactivated | extension.cnts_livestock_household_phone_taken", $ref: "#/components/responses/Problem"}
        "422": {description: "extension.cnts_livestock_household_invalid | extension.cnts_livestock_household_checkin_required", $ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
# @ag-order: 35002
  /v1/extension/cnts/livestock-households/{ref}/checkin:
    post:
      summary: "Check-in tại nhà hộ: Chờ bổ sung vị trí → Đang dùng (BR-08); hộ Đang dùng → đổi vị trí, bắt buộc lý do (H4)"
      operationId: extensionCntsLivestockHouseholdCheckin
      tags: [extension]
      parameters:
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {"$ref": "#/components/schemas/CNTSLivestockHouseholdCheckinRequest"}
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema: {"$ref": "#/components/schemas/CNTSLivestockHouseholdDetail"}
        "400": {$ref: "#/components/responses/Problem"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {description: "forbidden | extension.out_of_scope | extension.read_only", $ref: "#/components/responses/Problem"}
        "404": {description: "extension.cnts_livestock_household_not_found", $ref: "#/components/responses/Problem"}
        "409": {description: "extension.cnts_livestock_household_version_conflict | extension.cnts_livestock_household_duplicate | extension.cnts_livestock_household_deactivated | extension.cnts_livestock_household_phone_taken", $ref: "#/components/responses/Problem"}
        "422": {description: "extension.cnts_livestock_household_invalid | extension.cnts_livestock_household_checkin_required", $ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
# @ag-order: 35003
  /v1/extension/cnts/livestock-households/{ref}/deactivate:
    post:
      summary: "Vô hiệu hóa hộ (BR-04) — chỉ cán bộ tổng hợp Cấp Tỉnh, Admin; bắt buộc lý do; không kích hoạt lại"
      operationId: extensionCntsLivestockHouseholdDeactivate
      tags: [extension]
      parameters:
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {"$ref": "#/components/schemas/CNTSStatusChange"}
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema: {"$ref": "#/components/schemas/CNTSLivestockHouseholdDetail"}
        "400": {$ref: "#/components/responses/Problem"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {description: "forbidden | extension.out_of_scope | extension.read_only", $ref: "#/components/responses/Problem"}
        "404": {description: "extension.cnts_livestock_household_not_found", $ref: "#/components/responses/Problem"}
        "409": {description: "extension.cnts_livestock_household_version_conflict | extension.cnts_livestock_household_duplicate | extension.cnts_livestock_household_deactivated | extension.cnts_livestock_household_phone_taken", $ref: "#/components/responses/Problem"}
        "422": {description: "extension.cnts_livestock_household_invalid | extension.cnts_livestock_household_checkin_required", $ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
