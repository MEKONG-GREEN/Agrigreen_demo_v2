components:
  schemas:
# @ag-order: 648
    CNTSDutyCell:
      type: object
      required: [facility_ref, officer_ref, day, shift]
      properties:
        facility_ref: {type: string, format: uuid}
        officer_ref: {type: string, format: uuid}
        day: {type: integer, minimum: 1, maximum: 31}
        shift: {type: string, enum: [N, D, ND], description: "N ngày, D (Đ) đêm, ND (NĐ) cả ngày đêm; ca đêm qua nửa đêm thuộc ngày bắt đầu ca"}
# @ag-order: 649
    CNTSDutyRosterSave:
      type: object
      required: [base_version, cells]
      properties:
        province_code: {type: string, description: "Tỉnh suy từ phạm vi phiên; Admin không có tỉnh phải chọn, không ghi legacy"}
        base_version: {type: integer, minimum: 0, description: "Phiên bản đã thấy (0 = chưa có lịch) — khóa lạc quan"}
        cells: {type: array, maxItems: 20000, items: {$ref: "#/components/schemas/CNTSDutyCell"}}
        source: {type: string, enum: [grid, copy, excel]}
        note: {type: string, maxLength: 1000}
# @ag-order: 650
    CNTSDutyFacility:
      type: object
      required: [ref, code, name, commune_code, kind, address]
      properties:
        ref: {type: string, format: uuid}
        code: {type: string}
        name: {type: string}
        commune_code: {type: string}
        kind: {type: [string, "null"]}
        address: {type: [string, "null"], description: "Địa chỉ ở danh mục (cột Địa chỉ BM-03); null → web hiện tên xã"}
# @ag-order: 651
    CNTSDutyOfficer:
      type: object
      required: [ref, display, commune_codes, facility_refs, phone_masked]
      properties:
        ref: {type: string, format: uuid}
        display: {type: [string, "null"]}
        commune_codes: {type: array, items: {type: string}}
        facility_refs: {type: array, items: {type: string, format: uuid}, description: "Giới hạn cơ sở (rỗng = cả xã phụ trách)"}
        phone_masked: {type: [string, "null"], description: "SĐT đã che (4 số đầu · 3 số cuối), chỉ khi can_view_phone và viên chức có ô trong lưới"}
# @ag-order: 652
    CNTSDutyWarning:
      type: object
      required: [code, message, facility_ref, officer_ref, days]
      properties:
        code: {type: string, enum: [facility_uncovered, double_shift, officer_not_granted]}
        message: {type: string}
        facility_ref: {type: [string, "null"], format: uuid}
        officer_ref: {type: [string, "null"], format: uuid}
        days: {type: array, items: {type: integer}}
# @ag-order: 653
    CNTSDutyVersion:
      type: object
      required: [version, source, cell_count, note, at, actor_ref, actor_display]
      properties:
        version: {type: integer}
        source: {type: string}
        cell_count: {type: integer}
        note: {type: [string, "null"]}
        at: {type: string, format: date-time}
        actor_ref: {type: string, format: uuid}
        actor_display: {type: [string, "null"]}
# @ag-order: 654
    CNTSDutyRoster:
      type: object
      required: [province_code, legacy, month, days_in_month, version, source, note, cells, facilities, officers, warnings, updated_at, updated_by, versions, can_edit, notified_officer_refs, can_view_phone]
      properties:
        province_code: {type: [string, "null"], description: "Tỉnh của luồng lịch; null với lịch chung cũ"}
        legacy: {type: boolean, description: "Lịch chung cũ chỉ Admin đọc, không sửa"}
        month: {type: string}
        days_in_month: {type: integer}
        version: {type: integer, description: "0 = chưa lập"}
        source: {type: [string, "null"]}
        note: {type: [string, "null"]}
        cells: {type: array, items: {$ref: "#/components/schemas/CNTSDutyCell"}}
        facilities: {type: array, items: {$ref: "#/components/schemas/CNTSDutyFacility"}}
        officers: {type: array, items: {$ref: "#/components/schemas/CNTSDutyOfficer"}}
        warnings: {type: array, items: {$ref: "#/components/schemas/CNTSDutyWarning"}}
        updated_at: {type: [string, "null"], format: date-time}
        updated_by: {type: [string, "null"], format: uuid}
        versions: {type: array, items: {$ref: "#/components/schemas/CNTSDutyVersion"}}
        can_edit: {type: boolean}
        notified_officer_refs: {type: array, items: {type: string, format: uuid}, description: "Viên chức có ca thay đổi ở lần lưu này"}
        can_view_phone: {type: boolean, description: "Người gọi xem được cột ĐT viên chức (người lập lịch)"}
# @ag-order: 654
    CNTSDutyRosterImport:
      type: object
      required: [month, province_code, sheet, basis, row_count, cells, issues, warnings]
      properties:
        month: {type: string}
        province_code: {type: [string, "null"]}
        sheet: {type: string, description: Tên sheet đã đọc}
        basis: {type: [string, "null"], description: Dòng căn cứ đọc được ở tiêu đề}
        row_count: {type: integer, description: Số dòng viên chức đã đọc}
        cells: {type: array, items: {$ref: "#/components/schemas/CNTSDutyCell"}, description: "Ô ghép được (đã chuẩn hóa, sắp)"}
        issues:
          type: array
          description: "Lỗi theo dòng/ô (dòng lỗi cơ sở/viên chức bị bỏ cả dòng; ô ký hiệu lạ bị bỏ ô). Không lặp lại SĐT"
          items:
            type: object
            required: [line, field, message]
            properties:
              line: {type: [integer, "null"], description: Số dòng trong tệp}
              field: {type: string, description: "facility | officer | row | day:<n>"}
              message: {type: string}
        warnings: {type: array, items: {$ref: "#/components/schemas/CNTSDutyWarning"}, description: Cảnh báo như khi lưu lưới}
# @ag-order: 655
    CNTSMyDuty:
      type: object
      required: [date, shift, facility, colleagues]
