paths:
# @ag-order: 85
  /v1/extension/support-requests:
    get:
      summary: Yêu cầu hỗ trợ của nông dân cho cán bộ (HTX US-SUPPORT-01, KN US-TASK-01/03) — kèm nhiệm vụ tự sinh hiện hành
      description: |
        Vai coop_manager (chỉ HTX của mình = org_ref; hỏi HTX khác → 403 extension.out_of_scope), kn_officer /
        kn_province_admin / kn_national_admin (xã/tỉnh trong phạm vi, cộng nhiệm vụ được giao cho mình), platform_admin (mọi nơi).
        Mới nhất trước; cursor là next_cursor của trang trước. Không trả toạ độ — chỉ trạng thái GPS; ảnh là mã tệp (pf/files).
      operationId: extListSupportRequests
      tags: [extension]
      parameters:
        - {name: task_status, in: query, schema: {type: string, enum: [new, assigned, accepted, in_progress, resolved]}, description: "Trạng thái nhiệm vụ tự sinh"}
        - {name: category, in: query, schema: {type: string, enum: [dich_hai, benh_lua, thoi_tiet, ky_thuat, may_moc, khac]}}
        - {name: urgency, in: query, schema: {type: string, enum: [binh_thuong, khan]}}
        - {name: commune_code, in: query, schema: {type: string}}
        - {name: cooperative_ref, in: query, schema: {type: string, format: uuid}}
        - {name: gps_missing, in: query, schema: {type: boolean}, description: "true = chỉ yêu cầu thiếu vị trí GPS"}
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        "200":
          description: Một trang, mới nhất trước
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/SupportRequestStaff"}}
                  next_cursor: {type: [string, "null"]}
        "403": {description: "forbidden | extension.out_of_scope", $ref: "#/components/responses/Problem"}
        "422": {description: "validation_failed", $ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
# @ag-order: 97
  /v1/extension/program-reports:
    post:
      summary: FR-03 báo cáo tiến độ Đề án 1 triệu ha của một HTX × vụ (gửi lại = phiên bản mới, phải duyệt lại)
      operationId: submitProgramReport
      tags: [extension]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [commune_code, cooperative_ref, season_code, season_year, registered_area_ha, deploying_area_ha, completed_area_ha]
              properties:
                id: {type: string, format: uuid}
                commune_code: {type: string}
                cooperative_ref: {type: string, format: uuid}
                season_code: {type: string}
                season_year: {type: integer}
                registered_area_ha: {type: string, description: "decimal (ha)"}
                deploying_area_ha: {type: string, description: "decimal; đang triển khai + hoàn thành ≤ đăng ký"}
                completed_area_ha: {type: string}
                note: {type: string, maxLength: 2000}
                event_time: {type: string, format: date-time}
      responses:
        "201": {description: Đã ghi phiên bản}
        "200": {description: Gọi lặp cùng Idempotency-Key}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
# @ag-order: 98
  /v1/extension/program-reports/{id}/approve:
    post:
      summary: Admin tỉnh duyệt phiên bản hiện hành (không duyệt báo cáo do chính mình gửi — R-56)
      operationId: approveProgramReport
      tags: [extension]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                note: {type: string, maxLength: 500}
      responses:
        "200": {description: Đã duyệt}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
# @ag-order: 99
  /v1/extension/program-progress:
    get:
      summary: Tiến độ Đề án theo HTX × vụ trong phạm vi, kèm mục tiêu tỉnh (tham số extension.program_target_ha:<tỉnh>)
      operationId: getProgramProgress
      tags: [extension]
      parameters:
        - {name: unit, in: query, schema: {type: string}}
        - {name: season_code, in: query, schema: {type: string}}
        - {name: season_year, in: query, schema: {type: integer}}
      responses:
        "200":
          description: Tiến độ
          content:
            application/json:
              schema:
                type: object
                required: [items, targets, unapproved, provisional]
                properties:
                  items: {type: array, items: {type: object}}
                  targets: {type: object, additionalProperties: {type: [string, "null"]}}
                  unapproved: {type: integer}
                  provisional: {type: boolean}
        "403": {$ref: "#/components/responses/Problem"}
# @ag-order: 207
  /v1/support-requests:
    get:
      summary: Yêu cầu hỗ trợ của (các) nông hộ của nông dân, kèm trạng thái nhiệm vụ (HTX US-SUPPORT-01)
      operationId: listMySupportRequests
      tags: [extension]
      parameters:
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        "200":
          description: Mới nhất trước
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/SupportRequest"}}
                  next_cursor: {type: [string, "null"]}
        "403": {description: "forbidden | extension.farmer_household_required", $ref: "#/components/responses/Problem"}
    post:
      summary: Nông dân gửi yêu cầu hỗ trợ (HTX US-SUPPORT-01) — cùng giao dịch tự sinh nhiệm vụ cho cán bộ khuyến nông (KN US-TASK-01)
      description: |
        Vai farmer. Người nhận: cán bộ xã đang trực → cán bộ tỉnh đang trực → cán bộ tỉnh → để trống (admin_queue, báo quản trị tỉnh).
        Thiếu vị trí GPS vẫn nhận (nhãn "Thiếu vị trí GPS"). Ngoại tuyến: gửi qua pf/sync entity support_request (cùng payload).
      operationId: submitSupportRequest
      tags: [extension]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SupportRequestInput"}
      responses:
        "201":
          description: Đã nhận, nhiệm vụ đã sinh
          content:
            application/json:
              schema:
                type: object
                properties:
                  support_request: {$ref: "#/components/schemas/SupportRequest"}
                  replayed: {type: boolean}
        "403": {description: "forbidden | extension.farmer_household_required", $ref: "#/components/responses/Problem"}
        "409": {description: "extension.id_reused", $ref: "#/components/responses/Problem"}
        "422": {description: "validation_failed (\"Vui lòng nhập mô tả và chọn loại sự cố trước khi gửi.\", tối đa 5 ảnh) | extension.household_invalid", $ref: "#/components/responses/Problem"}
        "503": {description: "extension.dependency_unavailable", $ref: "#/components/responses/Problem"}
  # --- hết G2 ---

  # --- pf/simulation ---
# @ag-order: 160
  /v1/extension/report-tasks/{id}/grid-import:
    post:
      summary: "BF-TT-FORMS (UP-04): Nhập từ Excel trên màn nhập biểu Cấp Xã — đọc tệp thành dòng chữ cái cột → giá trị, không ghi"
      description: |
        Thân request là tệp (không multipart): .xlsx đúng bố cục "Tải mẫu Excel" (tiêu đề → hàng chữ cái A, B, C… → dòng loại cột
        → dòng dữ liệu → "Yêu cầu biểu mẫu") hoặc CSV UTF-8 có hàng chữ cái. Lấy sheet hiển thị đầu tiên có hàng chữ cái; bỏ dòng
        trống; ô công thức lấy giá trị đã lưu. Ô SỐ của .xlsx (kể cả công thức ra số) trả giá trị thô dạng thập phân dấu chấm
        ("1.234" = một phẩy hai ba bốn, không theo định dạng hiển thị) và được liệt kê trong `numeric`; ô chữ (CSV luôn là chữ)
        giữ nguyên chuỗi — web chỉ đọc kiểu số VN ("1.234,5" → 1234.5) cho ô chữ. Web ghép dòng với xã (cột tên xã) / chỉ tiêu và chỉ điền ô nhập được của kỳ đang
        mở; người dùng xem lại rồi Lưu nháp / Gửi (máy chủ kiểm lại khi nộp). Cấp Xã, công việc trong phạm vi. Tối đa 4 MB,
        2000 dòng.
      operationId: rcImportGrid
      tags: [extension]
      parameters:
        - {name: X-AG-Context, in: header, required: true, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/IdempotencyKey"
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          text/csv: {schema: {type: string, format: binary}}
          application/vnd.openxmlformats-officedocument.spreadsheetml.sheet: {schema: {type: string, format: binary}}
      responses:
        "200":
          description: Dòng dữ liệu của tệp
          content:
            application/json:
              schema:
                type: object
                required: [sheet, rows]
                properties:
                  sheet: {type: string, description: "Sheet đã đọc (rỗng với CSV)"}
                  rows:
                    type: array
                    items:
                      type: object
                      required: [line, cells, numeric]
                      properties:
                        line: {type: integer, description: "Số dòng trong tệp"}
                        cells: {type: object, additionalProperties: {type: string}, description: "chữ cái cột → giá trị (ô khác rỗng)"}
                        numeric:
                          type: array
                          items: {type: string}
                          description: "Chữ cái cột (theo thứ tự cột) của ô số .xlsx — giá trị trong cells là thập phân dấu chấm chuẩn; CSV luôn rỗng"
        "403": {description: "extension.read_only | forbidden", $ref: "#/components/responses/Problem"}
        "404": {description: extension.report_task_not_found, $ref: "#/components/responses/Problem"}
        "413": {$ref: "#/components/responses/Problem"}
        "422": {description: extension.grid_import_invalid, $ref: "#/components/responses/Problem"}
# @ag-order: 279
  /v1/kn/materials:
    get:
      summary: "FN-XA-03.06: bản ghi vật tư hiện hành (không bị bản bù thay)"
      operationId: knListMaterials
      tags: [extension]
      parameters:
        - {name: X-AG-Context, in: header, required: true, schema: {type: string, format: uuid}}
        - {name: commune, in: query, schema: {type: string}}
        - {name: from, in: query, schema: {type: string, format: date}}
        - {name: to, in: query, schema: {type: string, format: date}}
        - {name: material_code, in: query, schema: {type: string}}
        - {name: department, in: query, schema: {type: string}, description: "Chỉ Admin (vắng = mọi phòng ban)"}
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 500, default: 100}}
      responses:
        "200":
          description: Trang bản ghi
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/MaterialRecord"}}
                  next_cursor: {type: [string, "null"]}
        "403": {description: extension.out_of_scope, $ref: "#/components/responses/Problem"}
    post:
      summary: "FN-XA-03.06: ghi nhận vật tư của xã (Cấp Xã, Admin), 1–200 dòng"
      operationId: knRecordMaterials
      tags: [extension]
      parameters:
        - {name: X-AG-Context, in: header, required: true, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/IdempotencyKey"
        - {name: department, in: query, schema: {type: string}, description: "Chỉ Admin: phòng ban ghi (mặc định trong_trot)"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [commune_code, recorded_on, lines]
              properties:
                commune_code: {type: string}
                recorded_on: {type: string, format: date, description: "Không ở tương lai (giờ VN)"}
                lines:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items:
                    type: object
                    required: [material_code, quantity]
                    properties:
                      material_code: {type: string, description: "Danh mục masterdata material (đang dùng); ĐVT = attrs.unit"}
                      quantity: {type: string, description: "decimal ≥ 0, ≤ 1e9; ĐVT đếm được → số nguyên; còn lại ≤ 4 chữ số lẻ"}
                      note: {type: string, maxLength: 1000}
      responses:
        "201":
          description: Bản ghi đã tạo
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/MaterialRecord"}}
        "403": {description: "extension.read_only | forbidden | extension.out_of_scope", $ref: "#/components/responses/Problem"}
        "422": {description: "validation_failed | extension.material_unknown | extension.material_quantity_invalid | extension.support_reason_required", $ref: "#/components/responses/Problem"}
        "503": {description: extension.dependency_unavailable, $ref: "#/components/responses/Problem"}
# @ag-order: 280
  /v1/kn/materials/import:
    post:
      summary: "BF-TT-MAT (TT-12): Nạp Excel vật tư — đọc tệp CSV UTF-8/.xlsx thành dòng của bảng nhập, không ghi sổ"
      description: |
        Thân request là tệp (không multipart), đọc bằng shared/tabular (ô công thức → cả tệp bị từ chối). Cột bắt buộc
        "Vật tư" (mã hoặc tên trong danh mục material đang dùng) và "Số lượng"; tùy chọn "ĐVT" (phải khớp danh mục),
        "Thời điểm" (dd/mm/yyyy hoặc YYYY-MM-DD, không ở tương lai), "Ghi chú" (không SĐT/CCCD). Dòng lỗi có lý do không chứa
        giá trị nhập; dòng khác vẫn nhận. Người dùng xem lại trong bảng rồi Lưu qua POST /v1/kn/materials (máy chủ kiểm lại).
        Cùng quyền với ghi nhận (Cấp Xã, Admin). Tối đa 200 dòng, 2 MB.
      operationId: knImportMaterials
      tags: [extension]
      parameters:
        - {name: X-AG-Context, in: header, required: true, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          text/csv: {schema: {type: string, format: binary}}
          application/vnd.openxmlformats-officedocument.spreadsheetml.sheet: {schema: {type: string, format: binary}}
      responses:
        "200":
          description: Dòng đọc được và kết quả kiểm từng dòng
          content:
            application/json:
              schema:
                type: object
                required: [lines, accepted, rejected]
                properties:
                  accepted: {type: integer}
                  rejected: {type: integer}
                  lines:
                    type: array
                    items:
                      type: object
                      required: [row, material_code, material_name, unit, quantity, recorded_on, note, status, reason]
                      properties:
                        row: {type: integer, description: "Số dòng trong tệp (tiêu đề = 1)"}
                        material_code: {type: [string, "null"], description: "Mã danh mục nếu nhận ra (cả khi dòng bị loại)"}
                        material_name: {type: [string, "null"]}
                        unit: {type: [string, "null"]}
                        quantity: {type: [string, "null"], description: "decimal đã chuẩn hóa; null nếu không hợp lệ"}
                        recorded_on: {type: [string, "null"], format: date, description: "null = dùng Thời điểm đang chọn"}
                        note: {type: [string, "null"]}
                        status: {type: string, enum: [accepted, rejected]}
                        reason: {type: [string, "null"], description: "Không chứa giá trị nhập"}
        "403": {description: "extension.read_only | forbidden", $ref: "#/components/responses/Problem"}
        "413": {$ref: "#/components/responses/Problem"}
        "422": {description: extension.material_import_invalid, $ref: "#/components/responses/Problem"}
# @ag-order: 280
  /v1/kn/materials/summary:
    get:
      summary: "FN-XA-03.06 AC: tổng hợp vật tư hiện hành theo xã × vật tư (Cấp Tỉnh: các xã trong tỉnh)"
      operationId: knMaterialSummary
      tags: [extension]
      parameters:
        - {name: X-AG-Context, in: header, required: true, schema: {type: string, format: uuid}}
        - {name: commune, in: query, schema: {type: string}}
        - {name: from, in: query, schema: {type: string, format: date}}
        - {name: to, in: query, schema: {type: string, format: date}}
      responses:
        "200":
          description: Tổng hợp
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [commune_code, material_code, material_name, unit, quantity, records]
                      properties:
                        commune_code: {type: string}
                        material_code: {type: string}
                        material_name: {type: string}
                        unit: {type: string}
                        quantity: {type: string}
                        records: {type: integer}
        "403": {description: extension.out_of_scope, $ref: "#/components/responses/Problem"}
# @ag-order: 281
  /v1/kn/materials/{id}/correct:
    post:
      summary: "FN-XA-03.06: sửa = bản ghi bù (bản cũ hết hiện hành)"
      operationId: knCorrectMaterial
      tags: [extension]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: X-AG-Context, in: header, required: true, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity, reason]
              properties:
                quantity: {type: string}
                note: {type: [string, "null"], maxLength: 1000}
                reason: {type: string, minLength: 10, maxLength: 500}
      responses:
        "201":
          description: Bản ghi bù
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MaterialRecord"}
        "403": {description: "extension.read_only | forbidden", $ref: "#/components/responses/Problem"}
        "404": {description: extension.material_record_not_found, $ref: "#/components/responses/Problem"}
        "409": {description: extension.material_superseded, $ref: "#/components/responses/Problem"}
        "422": {description: "validation_failed | extension.material_quantity_invalid", $ref: "#/components/responses/Problem"}
# @ag-order: 282
  /v1/kn/materials/{id}/log:
    get:
      summary: "FN-XA-03.06: lịch sử chuỗi sửa của bản ghi (recorded → corrected…), mới nhất trước"
      operationId: knMaterialLog
      tags: [extension]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: X-AG-Context, in: header, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Log
          content:
            application/json:
              schema: {$ref: "#/components/schemas/KNRecordLogPage"}
        "404": {description: extension.material_record_not_found, $ref: "#/components/responses/Problem"}
  # --- pf/extension CNTS: biểu kỳ Cấp Xã BM-01/04/05/17 (W11.42) — cài biểu vào cap/forms (profile kn_cnts), chia lịch kỳ
  # (kỳ ngày, tuần W11.03 v2, tuần làm việc BM-05) với hạn riêng, phát hành lô kỳ native. Nộp, chốt, sao chép kỳ trước: /v1/forms. ---
# @ag-order: 283
  /v1/extension/cnts/alerts:
    get:
      summary: Cảnh báo CNTS (W11.43 — FN-13, UR-TINH-13, Mục III.5) trong phạm vi người gọi — Khẩn và chưa đóng trước
      description: |
        Cấp Tỉnh: cảnh báo trong phạm vi Nút; Cấp Xã: cảnh báo của các xã phụ trách và cảnh báo được giao cho mình; Admin: mọi
        cảnh báo. status: open (chưa đóng), overdue (chưa đóng, quá hạn xử lý), new, assigned, in_progress, closed.
      operationId: extensionCntsListAlerts
      tags: [extension]
      parameters:
        - {name: status, in: query, required: false, schema: {type: string, enum: [open, overdue, new, assigned, in_progress, closed]}}
        - {name: kind, in: query, required: false, schema: {type: string}}
        - {name: level, in: query, required: false, schema: {type: string, enum: [urgent, attention]}}
        - {name: template_code, in: query, required: false, schema: {type: string}}
        - {name: mine, in: query, required: false, schema: {type: boolean}, description: Chỉ cảnh báo giao cho tôi}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 500}}
      responses:
        "200":
          description: Danh sách
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CNTSAlertList"}
        "403": {description: forbidden, $ref: "#/components/responses/Problem"}
        "422": {description: validation_failed, $ref: "#/components/responses/Problem"}
# @ag-order: 284
  /v1/extension/cnts/alerts/{ref}:
    get:
      summary: Cảnh báo CNTS kèm lịch sử vòng đời
      operationId: extensionCntsGetAlert
      tags: [extension]
      parameters:
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
