              replayed: {type: boolean}
              warnings: {type: array, items: {$ref: "#/components/schemas/KNWarning"}}
  schemas:
# @ag-order: 322
    KNAssignmentInput:
      type: object
      required: [role]
      properties:
        role: {type: string, enum: [kn_tw, kn_tinh, kn_xa, admin]}
        org_ref: {type: [string, "null"], format: uuid, description: "Bắt buộc trừ admin. kn_tw → ttkn_national; kn_tinh, kn_xa → ttkn_province"}
        department_codes: {type: array, items: {type: string}, description: "≥ 1 (trừ admin: rỗng); phòng ban của đơn vị chứa Nút"}
        mgmt_level: {type: [string, "null"], description: "Mã danh mục cấp quản lý (GET /v1/accounts/mgmt-levels, tạm Q-05)"}
        commune_codes: {type: array, items: {type: string}, description: "Chỉ kn_xa; ⊂ xã của Nút tỉnh; rỗng → cảnh báo"}
        valid_from: {type: [string, "null"], format: date-time}
        valid_to: {type: [string, "null"], format: date-time}
        reason: {type: string}
# @ag-order: 323
    KNCommune:
      type: object
      required: [code, name]
