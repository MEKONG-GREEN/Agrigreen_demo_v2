  # --- hết pf/price W11.77 ---
  # --- hết pf/price ---
  # --- W11.61 (D4 KH1, BRD KHTC v2.2 FN-AD-04.01, FN-TI-02.02): Danh mục KHTC, danh sách CT/DA chủ (D20), Kế hoạch năm. Mọi route cần header X-AG-Context (client tự gắn) ---
components:
  parameters:
# @ag-order: 498
    PriceBoardDay:
      name: day
      in: path
      required: true
      schema: {type: string, format: date}
      description: Ngày báo giá (giờ VN)
# @ag-order: 499
    PriceProfile:
      name: profile
      in: query
      required: false
      description: Bên dùng của cap/price (cấu hình gốc lắp ráp; KN = kn). Vắng → profile đầu tiên.
      schema: {type: string, pattern: "^[a-z][a-z0-9_]{0,39}$"}
# @ag-order: 500
    PriceAt:
      name: at
      in: query
      required: false
      description: Ngày báo giá YYYY-MM-DD (vắng → hôm nay, giờ VN)
      schema: {type: string, format: date}
# @ag-order: 501
    PriceItemCode:
      name: code
      in: path
      required: true
      description: Mã mặt hàng (MH + 5 chữ số)
      schema: {type: string, pattern: "^MH[0-9]{5}$"}
  schemas:
# @ag-order: 978
    PriceStatus:
      type: object
      required: [profile, department, level, can_manage, can_steward, rule_version, day, units, groups]
      properties:
        profile: {type: string}
        department: {type: string, description: "Mã phòng ban chủ dữ liệu giá của bên dùng (KN: Phòng TTTT)"}
        level: {type: string, description: "Cấp của người gọi trong bên dùng (TW | TINH | XA); rỗng nếu chỉ có vai quản trị"}
        can_manage: {type: boolean, description: "Vai quản trị (Admin): danh mục nền, xã báo giá, phân công"}
        can_steward: {type: boolean, description: "W11.72: Quản trị nghiệp vụ báo giá — vai quản trị hoặc Cấp Tỉnh có cờ qtnv_bao_gia (lịch, ngưỡng, mặt hàng)"}
        rule_version: {type: string}
        day: {type: string, format: date}
        units: {type: integer, minimum: 0}
        groups: {type: integer, minimum: 0}
# @ag-order: 979
    PriceCatalogEntry:
      type: object
      required: [code, name, sort_order, version, valid_from]
      properties:
        code: {type: string}
        name: {type: string}
        sort_order: {type: integer}
        version: {type: integer, minimum: 1}
        valid_from: {type: string, format: date}
# @ag-order: 980
    PriceCatalog:
      type: object
      required: [day, units, groups, regions]
      properties:
        day: {type: string, format: date}
        units: {type: array, items: {$ref: "#/components/schemas/PriceCatalogEntry"}}
        groups: {type: array, items: {$ref: "#/components/schemas/PriceCatalogEntry"}}
        regions: {type: array, items: {$ref: "#/components/schemas/PriceCatalogEntry"}, description: "W11.72 nhóm vùng"}
    # --- pf/price W11.73 (mặt hàng theo thời kỳ) ---
# @ag-order: 981
    PriceWriteResult:
      type: object
      required: [code, version, valid_from, written]
      properties:
        code: {type: string, description: "Mã mặt hàng / nhóm / bộ / xã; mã đề xuất (uuid) khi tạo hoặc từ chối đề xuất"}
        version: {type: integer, minimum: 0}
        valid_from: {type: string, format: date}
        written: {type: integer, minimum: 0, description: Số dòng sổ đã ghi}
# @ag-order: 982
    PriceItem:
      type: object
      required: [code, name, variety, group_code, unit_code, spec, sale_place, kind, sort_order, version, valid_from, valid_to, since, state,
        replaces_code, note, point_count, has_price, new_price, gated, proposal_id]
      properties:
        code: {type: string, pattern: "^MH[0-9]{5}$"}
        name: {type: string}
        variety: {type: string, description: Giống / phẩm cấp}
        group_code: {type: string}
        unit_code: {type: string}
        spec: {type: [string, "null"], description: Quy cách}
        sale_place: {type: [string, "null"], description: Nơi bán}
        kind: {type: string, enum: [basic, local]}
        sort_order: {type: integer}
        version: {type: integer, minimum: 1}
        valid_from: {type: string, format: date, description: Ngày hiệu lực của phiên bản hiển thị}
        valid_to: {type: [string, "null"], format: date, description: Hiệu lực đến (null = không thời hạn)}
