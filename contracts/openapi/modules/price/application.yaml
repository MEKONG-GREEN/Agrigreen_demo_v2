paths:
# @ag-order: 403
  /v1/price/status:
    get:
      summary: Trạng thái khung cap/price của tenant người gọi — cấu hình bên dùng, cấp của người gọi, số mục danh mục đang hiệu lực
      operationId: priceStatus
      tags: [price]
      parameters:
        - $ref: "#/components/parameters/PriceProfile"
      responses:
        "200":
          description: Trạng thái
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PriceStatus"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {description: forbidden, $ref: "#/components/responses/Problem"}
        "404": {description: price.profile_not_found, $ref: "#/components/responses/Problem"}
# @ag-order: 404
  /v1/price/catalog:
    get:
      summary: Danh mục nền đang hiệu lực tại một ngày (đơn vị tính, nhóm hàng) — phiên bản mới nhất có valid_from ≤ ngày, bỏ mã đã ngưng
      operationId: priceCatalog
      tags: [price]
      parameters:
        - $ref: "#/components/parameters/PriceProfile"
        - {name: at, in: query, required: false, description: "Ngày báo giá YYYY-MM-DD (vắng → hôm nay, giờ VN)", schema: {type: string, format: date}}
      responses:
        "200":
          description: Danh mục
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PriceCatalog"}
        "403": {description: forbidden, $ref: "#/components/responses/Problem"}
        "404": {description: price.profile_not_found, $ref: "#/components/responses/Problem"}
        "422": {description: validation_failed, $ref: "#/components/responses/Problem"}
# @ag-order: 405
  /v1/price/catalog/defaults:
    post:
      summary: Ghi danh mục mặc định (5 nhóm hàng BRD, đơn vị tính thường gặp, 2 nhóm vùng An Giang / Kiên Giang) hiệu lực từ hôm nay — chỉ mã chưa có; vai quản trị danh mục
      operationId: priceInstallDefaults
      tags: [price]
      parameters:
        - $ref: "#/components/parameters/PriceProfile"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "201":
          description: Số phiên bản đã ghi (0 khi mọi mã đã có)
          content:
            application/json:
              schema:
                type: object
                required: [written]
                properties:
                  written: {type: integer, minimum: 0}
        "403": {description: forbidden, $ref: "#/components/responses/Problem"}
        "404": {description: price.profile_not_found, $ref: "#/components/responses/Problem"}
        "409": {description: conflict, $ref: "#/components/responses/Problem"}
  # W11.74 — lịch báo giá, giờ khóa, hạn phản hồi, nhắc nhập giá, ngưỡng cảnh báo (BRD FN-AD-04.04…06, FN-XA-03.04). Đọc: mọi cấp
  # của Profile; ghi: Quản trị nghiệp vụ báo giá (vai quản trị hoặc Cấp Tỉnh có cờ qtnv_bao_gia — W11.72; can_manage ở phản hồi). Số % là chuỗi Decimal. Mọi bản ghi là phiên bản (sổ chỉ ghi thêm).
# @ag-order: 406
  /v1/price/calendar:
    get:
      summary: Lịch báo giá đang hiệu lực, phiên bản đã lên lịch, lịch khóa nhập các ngày tới (mặc định 30), ngoại lệ, lịch sử thay đổi
      operationId: priceCalendar
      tags: [price]
      parameters:
        - $ref: "#/components/parameters/PriceProfile"
      responses:
        "200":
          description: Lịch
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PriceCalendar"}
        "403": {description: forbidden, $ref: "#/components/responses/Problem"}
        "404": {description: price.profile_not_found, $ref: "#/components/responses/Problem"}
# @ag-order: 407
  /v1/price/calendar/schedule:
    post:
      summary: Ghi phiên bản lịch mới (ngày báo giá trong tuần, giờ khóa, hạn phản hồi, giờ nhắc, kênh, nội dung mẫu) có hiệu lực từ valid_from
      description: |
        valid_from không trong quá khứ; hôm nay là ngày báo giá → sớm nhất ngày mai (422 price.valid_from). Nhắc 1 < nhắc 2 < giờ khóa
        (422 price.remind_order) < hạn phản hồi (422 price.respond_before_lock). Biến mẫu chỉ {ngày}, {xã}, {giờ khóa} (422 price.template_var).
      operationId: priceSaveSchedule
      tags: [price]
      parameters:
        - $ref: "#/components/parameters/PriceProfile"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PriceScheduleInput"}
      responses:
        "201":
          description: Phiên bản đã ghi
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PriceSchedule"}
        "403": {description: forbidden, $ref: "#/components/responses/Problem"}
        "404": {description: price.profile_not_found, $ref: "#/components/responses/Problem"}
        "409": {description: conflict, $ref: "#/components/responses/Problem"}
        "422": {description: "validation_failed | price.valid_from | price.remind_order | price.respond_before_lock | price.template_var", $ref: "#/components/responses/Problem"}
# @ag-order: 408
  /v1/price/calendar/exceptions:
    post:
      summary: Thêm ngày nghỉ (holiday — ngày báo giá theo lịch) hoặc ngày báo giá bổ sung (extra — ngày ngoài lịch) kèm lý do; chỉ ngày từ ngày mai
      operationId: priceAddException
      tags: [price]
      parameters:
        - $ref: "#/components/parameters/PriceProfile"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [day, kind, reason]
              properties:
                day: {type: string, format: date}
                kind: {type: string, enum: [holiday, extra]}
                reason: {type: string, minLength: 1, maxLength: 300}
      responses:
        "201":
          description: Ngoại lệ đã ghi
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PriceCalendarException"}
        "403": {description: forbidden, $ref: "#/components/responses/Problem"}
        "409": {description: price.exception_exists, $ref: "#/components/responses/Problem"}
        "422": {description: "validation_failed | price.valid_from | price.exception_mismatch", $ref: "#/components/responses/Problem"}
# @ag-order: 409
  /v1/price/calendar/exceptions/{day}/retire:
    post:
      summary: Xóa ngoại lệ của một ngày (ghi phiên bản retired); chỉ ngày từ ngày mai
      operationId: priceRetireException
      tags: [price]
      parameters:
        - {name: day, in: path, required: true, schema: {type: string, format: date}}
        - $ref: "#/components/parameters/PriceProfile"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204": {description: Đã xóa}
        "403": {description: forbidden, $ref: "#/components/responses/Problem"}
        "404": {description: price.exception_not_found, $ref: "#/components/responses/Problem"}
        "422": {description: price.valid_from, $ref: "#/components/responses/Problem"}
# @ag-order: 410
  /v1/price/calendar/runs:
    get:
      summary: Nhật ký job price_calendar — mốc khóa thực tế (độ trễ so với giờ khóa) và lịch sử gửi nhắc lần 1/2
      operationId: priceCalendarRuns
      tags: [price]
      parameters:
        - $ref: "#/components/parameters/PriceProfile"
        - {name: from, in: query, required: false, description: "Vắng → 30 ngày trước", schema: {type: string, format: date}}
        - {name: to, in: query, required: false, description: "Vắng → hôm nay (giờ VN); tối đa 92 ngày", schema: {type: string, format: date}}
      responses:
        "200":
          description: Nhật ký
          content:
            application/json:
              schema:
                type: object
                required: [from, to, items]
                properties:
                  from: {type: string, format: date}
                  to: {type: string, format: date}
                  items: {type: array, items: {$ref: "#/components/schemas/PriceCalendarRun"}}
        "403": {description: forbidden, $ref: "#/components/responses/Problem"}
        "422": {description: validation_failed, $ref: "#/components/responses/Problem"}
# @ag-order: 411
  /v1/price/calendar/reminder-test:
    post:
      summary: Gửi thử nhắc nhập giá (mẫu của lịch hiện hành) tới tài khoản đang đăng nhập — FN-AD-04.05 AC-02
      operationId: priceReminderTest
      tags: [price]
      parameters:
        - $ref: "#/components/parameters/PriceProfile"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Đã xếp hàng thông báo (pf/notify)
          content:
            application/json:
              schema:
                type: object
                required: [body]
                properties:
                  body: {type: string, description: Nội dung đã thay biến}
        "403": {description: forbidden, $ref: "#/components/responses/Problem"}
# @ag-order: 412
  /v1/price/thresholds:
    get:
      summary: Ngưỡng cảnh báo giá cao / thấp bất thường đang hiệu lực (mặc định + tham số chung, nhóm hàng, mặt hàng) và lịch sử thay đổi
      operationId: priceThresholds
      tags: [price]
      parameters:
        - $ref: "#/components/parameters/PriceProfile"
      responses:
        "200":
          description: Ngưỡng
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PriceThresholds"}
        "403": {description: forbidden, $ref: "#/components/responses/Problem"}
    post:
      summary: Ghi ngưỡng (phiên bản mới) — default kèm lookback_days, flat_pct, survey_pct; group/item chỉ pct. 0 < % ≤ 100
      operationId: priceSaveThreshold
      tags: [price]
      parameters:
        - $ref: "#/components/parameters/PriceProfile"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PriceThresholdInput"}
      responses:
        "201":
          description: Phiên bản đã ghi
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PriceThreshold"}
        "403": {description: forbidden, $ref: "#/components/responses/Problem"}
        "409": {description: conflict, $ref: "#/components/responses/Problem"}
        "422": {description: validation_failed, $ref: "#/components/responses/Problem"}
# @ag-order: 413
  /v1/price/thresholds/{scope}/{code}/retire:
    post:
      summary: Xóa ngưỡng nhóm hàng / mặt hàng (phiên bản retired); ngưỡng mặc định không xóa được
      operationId: priceRetireThreshold
      tags: [price]
      parameters:
        - {name: scope, in: path, required: true, schema: {type: string, enum: [default, group, item]}}
        - {name: code, in: path, required: true, schema: {type: string}}
        - $ref: "#/components/parameters/PriceProfile"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204": {description: Đã xóa}
        "403": {description: forbidden, $ref: "#/components/responses/Problem"}
        "404": {description: price.threshold_not_found, $ref: "#/components/responses/Problem"}
        "422": {description: price.default_threshold, $ref: "#/components/responses/Problem"}
  # --- pf/price W11.73 (pf 000141, BRD Báo giá v1.3 FN-AD-04.03, FN-XA-03.01): mặt hàng theo thời kỳ — mặt hàng có phiên bản +
  # valid_from, nhóm hàng, gán mặt hàng Địa phương cho xã, đề xuất từ xã, bộ theo vụ, "thay thế cho". Ngày hiệu lực vắng →
  # ngày báo giá kế tiếp (BR-02). point_code = mã xã báo giá (mặc định mã ĐVHC xã; liên kết lỏng tới xã báo giá W11.72). ---
# @ag-order: 414
  /v1/price/items:
    get:
      summary: Danh mục mặt hàng nhìn từ một ngày — mọi trạng thái (Hoạt động / Chờ hiệu lực / Ngưng), sắp theo nhóm, thứ tự, mã
      operationId: priceListItems
      tags: [price]
      parameters:
        - $ref: "#/components/parameters/PriceProfile"
        - $ref: "#/components/parameters/PriceAt"
        - {name: group, in: query, required: false, schema: {type: string}}
        - {name: kind, in: query, required: false, schema: {type: string, enum: [basic, local]}}
        - {name: state, in: query, required: false, schema: {type: string, enum: [active, pending, retired]}}
        - {name: q, in: query, required: false, description: "Tìm theo mã, tên, giống/phẩm cấp", schema: {type: string}}
      responses:
        "200":
          description: Danh sách
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PriceItemList"}
        "403": {description: forbidden, $ref: "#/components/responses/Problem"}
        "404": {description: price.profile_not_found, $ref: "#/components/responses/Problem"}
        "422": {description: validation_failed, $ref: "#/components/responses/Problem"}
    post:
      summary: Thêm mặt hàng — mã tự sinh MH#####; Cơ bản áp dụng mọi xã, Địa phương gán cho points; "thay thế cho" ngưng mặt hàng cũ từ ngày hiệu lực
      operationId: priceCreateItem
      tags: [price]
      parameters:
        - $ref: "#/components/parameters/PriceProfile"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PriceItemInput"}
      responses:
        "201":
          description: Đã ghi
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PriceWriteResult"}
        "400": {description: bad_request, $ref: "#/components/responses/Problem"}
        "403": {description: forbidden (chỉ Cấp Tỉnh, vai quản trị), $ref: "#/components/responses/Problem"}
        "404": {description: price.item_not_found (mặt hàng được thay thế), $ref: "#/components/responses/Problem"}
        "409": {description: price.item_duplicate | conflict, $ref: "#/components/responses/Problem"}
        "422": {description: validation_failed | price.item_date_invalid | price.item_basic_not_assignable, $ref: "#/components/responses/Problem"}
# @ag-order: 415
  /v1/price/items/{code}:
    get:
      summary: Một mặt hàng tại ngày — trạng thái, lịch sử phiên bản (lịch sử thay đổi, tên cũ), mặt hàng thay thế nó
      operationId: priceGetItem
      tags: [price]
      parameters:
        - $ref: "#/components/parameters/PriceProfile"
        - $ref: "#/components/parameters/PriceItemCode"
        - $ref: "#/components/parameters/PriceAt"
      responses:
        "200":
          description: Mặt hàng
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PriceItemDetail"}
        "403": {description: forbidden, $ref: "#/components/responses/Problem"}
        "404": {description: price.item_not_found, $ref: "#/components/responses/Problem"}
# @ag-order: 416
  /v1/price/items/{code}/revise:
    post:
      summary: Sửa mặt hàng — phiên bản mới từ valid_from; đã có giá thì chỉ sửa tên, nơi bán (BR-04) và chỉ Quản trị nghiệp vụ
      operationId: priceReviseItem
      tags: [price]
      parameters:
        - $ref: "#/components/parameters/PriceProfile"
        - $ref: "#/components/parameters/PriceItemCode"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PriceItemInput"}
      responses:
        "201":
          description: Đã ghi
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PriceWriteResult"}
        "403": {description: forbidden, $ref: "#/components/responses/Problem"}
        "404": {description: price.item_not_found, $ref: "#/components/responses/Problem"}
        "409": {description: price.item_locked | price.item_retired | price.item_duplicate, $ref: "#/components/responses/Problem"}
        "422": {description: validation_failed | price.item_date_invalid, $ref: "#/components/responses/Problem"}
# @ag-order: 417
  /v1/price/items/{code}/retire:
    post:
      summary: Ngưng mặt hàng — hiệu lực đến valid_to (vắng → hết ngày trước ngày báo giá kế tiếp), có lý do; không xóa
      operationId: priceRetireItem
      tags: [price]
      parameters:
        - $ref: "#/components/parameters/PriceProfile"
        - $ref: "#/components/parameters/PriceItemCode"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                valid_to: {type: string, format: date}
                reason: {type: string, minLength: 1, maxLength: 500}
      responses:
        "201":
          description: Đã ghi
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PriceWriteResult"}
        "403": {description: forbidden, $ref: "#/components/responses/Problem"}
        "404": {description: price.item_not_found, $ref: "#/components/responses/Problem"}
        "409": {description: price.item_retired, $ref: "#/components/responses/Problem"}
        "422": {description: validation_failed | price.item_date_invalid, $ref: "#/components/responses/Problem"}
# @ag-order: 418
  /v1/price/items/{code}/move:
    post:
      summary: Đổi thứ tự hiển thị trong nhóm (lên / xuống) từ ngày báo giá kế tiếp
      operationId: priceMoveItem
      tags: [price]
      parameters:
        - $ref: "#/components/parameters/PriceProfile"
        - $ref: "#/components/parameters/PriceItemCode"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [direction]
              properties:
                direction: {type: string, enum: [up, down]}
      responses:
        "201":
          description: Đã ghi (written = 0 khi đã ở đầu/cuối nhóm)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PriceWriteResult"}
        "403": {description: forbidden, $ref: "#/components/responses/Problem"}
        "404": {description: price.item_not_found, $ref: "#/components/responses/Problem"}
        "409": {description: price.item_retired, $ref: "#/components/responses/Problem"}
# @ag-order: 419
  /v1/price/groups:
    get:
      summary: Nhóm hàng đang hiệu lực tại ngày, kèm số mặt hàng đang hiệu lực
      operationId: priceListGroups
      tags: [price]
      parameters:
        - $ref: "#/components/parameters/PriceProfile"
        - $ref: "#/components/parameters/PriceAt"
      responses:
        "200":
          description: Nhóm hàng
          content:
            application/json:
              schema:
                type: object
                required: [groups]
                properties:
                  groups: {type: array, items: {$ref: "#/components/schemas/PriceGroup"}}
        "403": {description: forbidden, $ref: "#/components/responses/Problem"}
    post:
      summary: Thêm nhóm hàng (hiệu lực từ hôm nay; mã vắng → nhom_<n>)
      operationId: priceCreateGroup
      tags: [price]
      parameters:
        - $ref: "#/components/parameters/PriceProfile"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PriceGroupInput"}
      responses:
        "201":
          description: Đã ghi
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PriceWriteResult"}
        "403": {description: forbidden, $ref: "#/components/responses/Problem"}
        "409": {description: conflict (mã đã có), $ref: "#/components/responses/Problem"}
        "422": {description: validation_failed, $ref: "#/components/responses/Problem"}
# @ag-order: 420
  /v1/price/groups/{code}/revise:
    post:
      summary: Sửa tên / thứ tự nhóm hàng (hiệu lực từ hôm nay)
      operationId: priceReviseGroup
      tags: [price]
      parameters:
        - $ref: "#/components/parameters/PriceProfile"
        - {name: code, in: path, required: true, schema: {type: string}}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PriceGroupInput"}
      responses:
        "201":
          description: Đã ghi
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PriceWriteResult"}
        "403": {description: forbidden, $ref: "#/components/responses/Problem"}
        "404": {description: price.group_not_found, $ref: "#/components/responses/Problem"}
        "422": {description: validation_failed, $ref: "#/components/responses/Problem"}
# @ag-order: 421
  /v1/price/groups/{code}/retire:
    post:
      summary: Xóa nhóm hàng (phiên bản ngưng) — chặn khi nhóm còn mặt hàng đang hoặc sắp hiệu lực
      operationId: priceRetireGroup
      tags: [price]
      parameters:
        - $ref: "#/components/parameters/PriceProfile"
        - {name: code, in: path, required: true, schema: {type: string}}
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "201":
          description: Đã ghi
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PriceWriteResult"}
        "403": {description: forbidden, $ref: "#/components/responses/Problem"}
        "404": {description: price.group_not_found, $ref: "#/components/responses/Problem"}
        "409": {description: price.group_not_empty, $ref: "#/components/responses/Problem"}
# @ag-order: 422
  /v1/price/assignments:
    get:
      summary: Gán mặt hàng Địa phương cho xã đang hiệu lực tại ngày (lọc theo xã)
      operationId: priceListAssignments
      tags: [price]
      parameters:
        - $ref: "#/components/parameters/PriceProfile"
        - $ref: "#/components/parameters/PriceAt"
        - {name: point, in: query, required: false, schema: {type: string}}
      responses:
        "200":
          description: Gán
          content:
            application/json:
              schema:
                type: object
                required: [assignments]
                properties:
                  assignments: {type: array, items: {$ref: "#/components/schemas/PriceAssignment"}}
        "403": {description: forbidden, $ref: "#/components/responses/Problem"}
    post:
