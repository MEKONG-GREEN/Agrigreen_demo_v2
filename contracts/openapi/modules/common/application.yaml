# @ag-order: 822
    Dispatch:
      type: object
      required: [id, department_code, province_code, period_id, period_label, run_ids, forms, formats, provisional, missing_communes, status, recipient_ids, cc_ids, subject, body, link_only, attempts, last_error, sent_at, created_by, created_at, updated_at, can_resend, resumable_at]
      properties:
        id: {type: string, format: uuid}
        department_code: {type: string}
        province_code: {type: string}
        period_id: {type: string, format: uuid}
        period_label: {type: string}
        run_ids: {type: array, items: {type: string, format: uuid}}
        forms: {type: array, items: {type: string}}
        formats: {type: array, items: {type: string}}
        provisional: {type: boolean}
        missing_communes: {type: array, items: {type: string}}
        status: {type: string, enum: [exported, sending, sent, failed]}
        recipient_ids: {type: array, items: {type: string, format: uuid}}
        cc_ids: {type: array, items: {type: string, format: uuid}}
        subject: {type: [string, "null"]}
        body: {type: [string, "null"]}
        link_only: {type: boolean}
        attempts: {type: integer}
        last_error: {type: [string, "null"]}
        sent_at: {type: [string, "null"], format: date-time}
        created_by: {type: string, format: uuid}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        can_resend:
          type: boolean
          description: Máy chủ tính lúc đọc — true khi POST /send hiện được chấp nhận. "Đang gửi" chỉ true khi đã quá hạn nhận việc (Gửi lại tiếp tục cùng lượt); còn hạn thì POST trả 409 reports.dispatch_sending.
        resumable_at:
          type: [string, "null"]
          format: date-time
          description: Chỉ có khi status = sending — mốc từ đó "Gửi lại" được chấp nhận (hạn nhận việc của worker, hoặc updated_at + hạn khi chưa ai nhận). null với trạng thái khác.
