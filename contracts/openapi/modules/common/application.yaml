                  cell:
                    type: object
                    required: [lat, lon, size_deg]
                    properties:
                      lat: {type: string, description: "Vĩ độ tâm ô"}
                      lon: {type: string, description: "Kinh độ tâm ô"}
                      size_deg: {type: string, description: "Cạnh ô (độ), ≥ 0.05"}
                  fetched_at: {type: string, format: date-time}
                  cached: {type: boolean}
                  data: {description: "JSON của nhà cung cấp"}
        "401": {$ref: "#/components/responses/Problem"}
        "404": {description: "extdata.unknown_source", $ref: "#/components/responses/Problem"}
        "422": {description: "validation_failed | extdata.outside_territory", $ref: "#/components/responses/Problem"}
        "502": {description: "extdata.provider_unavailable", $ref: "#/components/responses/Problem"}
# @ag-order: 262
  /v1/extdata/{source}/tiles/{z}/{x}/{y}:
    get:
      summary: "pf/extdata (ADR-0007): tile bản đồ/vệ tinh qua proxy — zoom ≤ max_zoom của nguồn, tile phải giao vùng phục vụ; y có thể kèm đuôi .png"
      operationId: extdataTile
      parameters:
        - {name: source, in: path, required: true, schema: {type: string}}
        - {name: z, in: path, required: true, schema: {type: integer, minimum: 0, maximum: 18}}
        - {name: x, in: path, required: true, schema: {type: integer, minimum: 0}}
        - {name: y, in: path, required: true, schema: {type: string, pattern: "^[0-9]+([.][a-z]+)?$"}}
      responses:
        "200":
          description: Tile nhị phân
          content:
            image/png: {schema: {type: string, format: binary}}
            image/jpeg: {schema: {type: string, format: binary}}
            image/webp: {schema: {type: string, format: binary}}
            application/x-protobuf: {schema: {type: string, format: binary}}
        "401": {$ref: "#/components/responses/Problem"}
        "404": {description: "extdata.unknown_source", $ref: "#/components/responses/Problem"}
        "422": {description: "validation_failed | extdata.zoom_too_high | extdata.outside_territory", $ref: "#/components/responses/Problem"}
        "502": {description: "extdata.provider_unavailable", $ref: "#/components/responses/Problem"}
