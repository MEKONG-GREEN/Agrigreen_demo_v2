      content:
        application/json:
          schema:
            type: object
            required: [org, event, active_households]
            properties:
              org: {$ref: "#/components/schemas/PartyOrg"}
              event: {$ref: "#/components/schemas/PartyOrgEvent"}
              active_households: {type: integer, description: "Số nông hộ đang là thành viên (cảnh báo phạm vi ảnh hưởng khi vô hiệu hóa)"}
# @ag-order: 249
    MechOwnerChanged:
