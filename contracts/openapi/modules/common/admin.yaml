# @ag-order: 382
    ApiKey:
      type: object
      description: Không có bí mật, không có HMAC — chỉ prefix (an toàn để hiển thị và ghi log)
      required: [id, key_prefix, status, issued_at, expires_at]
      properties:
        id: {type: string, format: uuid}
        key_prefix: {type: string, pattern: "^[a-z2-7]{12}$"}
        status: {type: string, enum: [active, rotated, revoked, expired]}
        issued_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        grace_until: {type: [string, "null"], format: date-time}
        revoked_at: {type: [string, "null"], format: date-time}
        revoke_reason: {type: [string, "null"]}
