  # --- pf/content: soạn, duyệt, xuất bản tài liệu (content_editor_national, content_editor_province, content_reviewer) ---

  # Người duyệt xuất bản không được là tác giả phiên bản (R-56 → self_approval_forbidden).

  # TTKN tỉnh chỉ soạn phạm vi tỉnh/xã của mình, không soạn quy trình chuẩn quốc gia (KN BR-06).
# @ag-order: 63
  /v1/geo/plots/import:
    post:
      summary: Nhập tệp ranh giới thửa GeoJSON/KML/Shapefile (.zip) (KN US-PLOT-02, GIS FN-05) — mỗi vùng thành một thửa, cùng quy tắc như vẽ tay; kết quả theo từng đối tượng
      description: |
        Thân request là nội dung tệp (≤ 200 đối tượng, ≤ 10 MB, xử lý đồng bộ). Chỉ nhận WGS84 (EPSG:4326):
        thành phần crs khác hoặc toạ độ ngoài miền kinh/vĩ độ (VN-2000/UTM) → 422 geo.crs_unsupported.
        Shapefile: gói .zip gồm .shp (Polygon/PolygonZ/PolygonM), .dbf, .prj (.shx, .cpg tùy chọn). .prj phải là
        GEOGCS WGS84; VN-2000 hoặc hệ chiếu phẳng → 422 geo.crs_unsupported (hệ thống không tự chuyển VN-2000 —
        chuyển sang EPSG:4326 bằng QGIS/ArcGIS trước). Tải .shp rời → 422 geo.format_invalid. Thuộc tính .dbf
        (tên trường không phân biệt hoa thường): TEN/TEN_THUA/MA_THUA (hoặc SO_TO + SO_THUA → "Tờ … thửa …") làm tên thửa
        (mã thửa do hệ thống sinh), MA_XA → commune_code, MA_HTX → Mã HTX tra ra cooperative_ref.
        Thuộc tính đối tượng được đọc (mọi định dạng): name, commune_code (hoặc ma_xa), cooperative_ref,
        cooperative_code (hoặc ma_htx; không có HTX mã này → đối tượng bị loại geo.cooperative_invalid), household_ref. Idem_key từng đối tượng =
        Idempotency-Key + ":" + thứ tự, nên nhập lại cùng khóa trả duplicate, không tạo trùng.
      operationId: importPlotBoundaries
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - {name: format, in: query, schema: {type: string, enum: [geojson, kml, shapefile]}, description: "Bỏ trống → nhận từ file_name hoặc nội dung"}
        - {name: file_name, in: query, schema: {type: string}}
        - {name: commune_code, in: query, schema: {type: string}, description: "Mặc định khi đối tượng không có commune_code"}
        - {name: cooperative_ref, in: query, schema: {type: string, format: uuid}, description: "Mặc định khi đối tượng không có cooperative_ref"}
        - {name: source, in: query, schema: {type: string, enum: [import_file, cadastral], default: import_file}}
        - {name: confirm_overlap, in: query, schema: {type: boolean, default: false}, description: "Nhận cả đối tượng chồng lấn cùng HTX/thửa nháp (mở xung đột xem xét); chồng lấn HTX khác luôn bị loại"}
      requestBody:
        required: true
        content:
          application/geo+json: {schema: {type: object}}
          application/json: {schema: {type: object}}
          application/vnd.google-earth.kml+xml: {schema: {type: string}}
          application/zip: {schema: {type: string, format: binary}}
      responses:
        "200":
          description: Kết quả theo đối tượng
          content:
            application/json:
              schema:
                type: object
                required: [format, accepted, flagged, duplicate, rejected, features]
                properties:
                  format: {type: string, enum: [geojson, kml, shapefile]}
                  accepted: {type: integer}
                  flagged: {type: integer, description: "Đã tạo, chồng lấn cùng HTX/thửa nháp đã xác nhận — chờ xem xét"}
                  duplicate: {type: integer}
                  rejected: {type: integer}
                  features:
                    type: array
                    items:
                      type: object
                      required: [index, name, status, code, reason, plot_ref, plot_code, area_ha, flagged_overlaps]
                      properties:
                        index: {type: integer}
                        name: {type: [string, "null"]}
                        status: {type: string, enum: [accepted, flagged, duplicate, rejected]}
                        code: {type: [string, "null"], description: "Mã lỗi khi rejected, vd geo.too_few_points, geo.overlap_cross_coop, geo.overlap_needs_confirm"}
                        reason: {type: [string, "null"]}
                        plot_ref: {type: [string, "null"], format: uuid}
                        plot_code: {type: [string, "null"]}
                        area_ha: {type: [string, "null"]}
                        flagged_overlaps: {type: array, items: {type: object}}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
