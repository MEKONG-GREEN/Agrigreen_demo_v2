            properties:
              machine: {$ref: "#/components/schemas/MechMachine"}
              event: {$ref: "#/components/schemas/MechMachineEvent"}
# @ag-order: 251
    MechAreaChanged:
      description: Diện tích vụ sau biến động và dòng sổ vừa ghi
      content:
        application/json:
          schema:
            type: object
            required: [area, event]
            properties:
              area: {$ref: "#/components/schemas/MechSeasonArea"}
