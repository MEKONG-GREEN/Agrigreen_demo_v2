paths:
# @ag-order: 4
  /v1/masterdata/catalogs:
    get:
      summary: "G-06: danh sách danh mục kèm tên tiếng Việt, số mục, số mục ngừng dùng, thuộc tính (vai masterdata_admin)"
      operationId: mdListCatalogs
      responses:
        "200":
          description: Danh mục
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [catalog, name, item_count, inactive_count, attrs_schema]
                      properties:
                        catalog: {type: string}
                        name: {type: string}
                        item_count: {type: integer}
                        inactive_count: {type: integer}
                        attrs_schema: {type: array, items: {type: string}}
        "403": {$ref: "#/components/responses/Problem"}
# @ag-order: 5
  /v1/masterdata/params:
    get:
      summary: "G-07: sổ đăng ký tham số — mọi khóa đã biết (kể cả chưa có phiên bản) và khóa đã có phiên bản, kèm tên, đơn vị, kiểu, khoảng hợp lệ, bản đang hiệu lực, số bản chờ duyệt"
      operationId: mdListParams
      parameters:
        - {name: prefix, in: query, schema: {type: string}, description: "Lọc theo tiền tố khóa, vd cgh."}
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Một trang (sắp theo khóa)
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [key, name, unit, kind, min, max, current, submitted_count]
                      properties:
                        key: {type: string}
                        name: {type: string}
                        unit: {type: string}
                        kind: {type: string, enum: [decimal, text, color], description: "color = mã màu HEX #RRGGBB (GIS US-CFG-01)"}
                        min: {type: [string, "null"]}
                        max: {type: [string, "null"]}
                        current:
                          oneOf:
                            - type: "null"
                            - type: object
                              required: [version, value, text, effective_from]
                              properties:
                                version: {type: integer}
                                value: {type: [string, "null"]}
                                text: {type: [string, "null"]}
                                effective_from: {type: string, format: date-time}
                        submitted_count: {type: integer}
                  next_cursor: {type: [string, "null"]}
        "403": {$ref: "#/components/responses/Problem"}
# @ag-order: 18
  /v1/orgs:
    get:
      summary: "G-08: liệt kê cây tổ chức cho quản trị (toàn quốc thấy mọi tổ chức; quản trị tỉnh thấy trong tỉnh)"
      operationId: partyAdminListOrgs
      parameters:
        - {name: kind, in: query, schema: {type: string, enum: [ttkn_national, ttkn_province, extension_team, dcrd, cooperative, mkg, partner]}}
        - {name: parent_ref, in: query, schema: {type: string, format: uuid}, description: "Chỉ con trực tiếp của tổ chức này"}
        - {name: include_inactive, in: query, schema: {type: boolean, default: true}}
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Một trang
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/PartyOrg"}}
                  next_cursor: {type: [string, "null"]}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
    post:
      summary: Tạo tổ chức trong cây TW → Tỉnh → Xã (HTX tạo qua Neo)
      description: |
        Chỉ platform_admin hoặc registry_admin tạo tổ chức. Vai KN nhận 403 với mọi loại.
        kind=cooperative nhận 422 party.cooperative_requires_anchor và redirect=/quan-tri/neo-htx;
        dùng POST /v1/htx-anchors với new_cooperative để tạo Nút, hồ sơ và Neo.
      operationId: partyCreateOrg
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PartyOrgInput"}
      responses:
        "201":
          description: Đã tạo; ghi sổ pf_party.org_event (action = created)
          headers:
            Location: {schema: {type: string}}
          content:
            application/json:
              schema:
                type: object
                required: [org, seq, representative_duplicate]
                properties:
                  org: {$ref: "#/components/schemas/PartyOrg"}
                  seq: {type: integer}
                  representative_duplicate: {type: boolean, description: "Người đại diện đã có trong kho định danh, dùng lại mã cũ"}
        "403": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
# @ag-order: 19
  /v1/orgs/export.xlsx:
    get:
      summary: Xuất cây tổ chức trong phạm vi ra Excel .xlsx (KN US-ADM-08) — cha luôn đứng trước con; tệp nhập lại được ngay
      description: |
        Cột: Mã tổ chức, Loại (mã kind), Tên, Mã đơn vị hành chính, Mã tổ chức cấp trên, Trạng thái (Hoạt động/Ngừng hoạt động).
        Gồm cả tổ chức ngừng hoạt động. Cấp trên ngoài phạm vi (vd TTKN QG khi TTKN tỉnh xuất) vẫn có mã để nối cây.
      operationId: partyExportOrgTree
      responses:
        "200":
          description: Tệp .xlsx (Content-Disposition attachment)
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: {type: string, format: binary}
        "403": {$ref: "#/components/responses/Problem"}
# @ag-order: 20
  /v1/orgs/import:
    post:
      summary: Nhập cây tổ chức từ Excel .xlsx hoặc CSV UTF-8 (KN US-ADM-08), tối đa 500 dòng; kết quả theo từng dòng
      description: |
        Cùng cột với tệp xuất (tiêu đề có/không dấu; bắt buộc Mã tổ chức, Loại, Tên). Mã chưa có → tạo (CreateOrg);
        mã đã có → di chuyển nếu cấp trên/đơn vị khác (MoveOrg, ghi sổ với lý do `reason`), đổi tên nếu tên khác (RenameOrg).
        Dòng được xử lý cha trước con bất kể thứ tự trong tệp. Dòng HTX mới (mã trống hoặc chưa có) bị loại theo dòng:
        HTX tạo qua Neo HTX theo MST (D2, ADR-0052). Tạo Nút không phải HTX chỉ platform_admin/registry_admin (gói ORGUI);
        vai KN chỉ di chuyển/đổi tên.
        Tệp không vô hiệu hóa tổ chức vắng mặt; cột Trạng thái chỉ để xem. Ô công thức, tệp .xls cũ, thiếu cột bắt buộc →
        từ chối cả tệp (party.import_invalid). Idem_key từng thao tác = Idempotency-Key + ":org:" + số dòng.
      operationId: partyImportOrgTree
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - {name: reason, in: query, schema: {type: string, minLength: 10}, description: "Lý do ghi sổ khi di chuyển/đổi tên; bỏ trống = \"Cập nhật cây tổ chức từ tệp nhập Excel\""}
      requestBody:
        required: true
        content:
          application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
            schema: {type: string, format: binary}
          text/csv:
            schema: {type: string}
      responses:
        "200":
          description: Kết quả theo dòng (thứ tự của tệp)
          content:
            application/json:
              schema:
                type: object
                required: [created, updated, unchanged, rejected, rows]
                properties:
                  created: {type: integer}
                  updated: {type: integer}
                  unchanged: {type: integer}
                  rejected: {type: integer}
                  rows:
                    type: array
                    items:
                      type: object
                      required: [row, status, code, org_ref, changes, reason]
                      properties:
                        row: {type: integer, description: "Số dòng trong tệp (dòng 1 là tiêu đề)"}
                        status: {type: string, enum: [created, updated, unchanged, rejected]}
                        code: {type: [string, "null"], description: "Mã tổ chức (HTX mới: mã vừa sinh)"}
                        org_ref: {type: [string, "null"], format: uuid}
                        changes: {type: array, items: {type: string, enum: [moved, renamed]}}
                        reason: {type: [string, "null"]}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
# @ag-order: 21
  /v1/orgs/{ref}/move:
    post:
      summary: Di chuyển một nút kèm cả nhánh con sang cha mới (sáp nhập đơn vị hành chính), giữ lịch sử
      operationId: partyMoveOrg
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                new_parent_ref: {type: [string, "null"], format: uuid, description: "null = đưa lên gốc"}
                new_admin_unit_code: {type: string, description: "Mã đơn vị mới sau sáp nhập; bỏ trống = giữ"}
                reason: {type: string, minLength: 10}
      responses:
        "200": {$ref: "#/components/responses/PartyOrgChanged"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
# @ag-order: 22
  /v1/orgs/{ref}/rename:
    post:
      summary: Đổi tên tổ chức (ghi sổ, action = renamed)
      operationId: partyRenameOrg
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string, maxLength: 200}
                reason: {type: string}
      responses:
        "200": {$ref: "#/components/responses/PartyOrgChanged"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
# @ag-order: 23
  /v1/orgs/{ref}/events:
    get:
      summary: Nhật ký biến động chỉ đọc, lưu vĩnh viễn (HTX US-HTXSTATUS-03)
      operationId: partyOrgEvents
      parameters:
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Theo seq tăng dần
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/PartyOrgEvent"}}
        "404": {$ref: "#/components/responses/Problem"}
# @ag-order: 24
  /v1/cooperatives/{ref}/deactivation-preview:
    get:
      summary: Phạm vi ảnh hưởng trước khi vô hiệu hóa HTX (HTX US-HTXSTATUS-01 AC-1) — số nông hộ, vụ chưa xong, nhật ký chờ duyệt
      description: >-
        Chỉ đọc, cùng vai và phạm vi với deactivate. Vụ chưa xong và nhật ký chờ duyệt đọc từ pf/cropcycle qua gốc lắp
        ráp; chưa nối → open_seasons, pending_logs = null và season_activity_available = false.
      operationId: partyCooperativeDeactivationPreview
      parameters:
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Phạm vi ảnh hưởng
          content:
            application/json:
              schema:
                type: object
                required: [cooperative_ref, active, active_households, active_children, open_seasons, pending_logs, season_activity_available]
                properties:
                  cooperative_ref: {type: string, format: uuid}
                  active: {type: boolean}
                  active_households: {type: integer, description: Nông hộ đang là thành viên}
                  active_children: {type: integer, description: Tổ chức con đang hoạt động (phải vô hiệu hóa trước)}
                  open_seasons: {type: [integer, "null"], description: Vụ đang mở (chưa hoàn thành)}
                  pending_logs: {type: [integer, "null"], description: Nhật ký canh tác chờ duyệt}
                  season_activity_available: {type: boolean}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
# @ag-order: 25
  /v1/htx-anchors:
    get:
      summary: "D2 (ADR-0052): danh sách neo HTX theo mã số thuế (HTX tạm / đã nhận quyền)"
      operationId: coopListHTXAnchors
      parameters:
        - {name: status, in: query, schema: {type: string, enum: [provisional, claimed]}}
        - {name: q, in: query, description: "Tiền tố mã số thuế (chuẩn hóa: bỏ khoảng trắng, gạch) hoặc mã tạm TMP-", schema: {type: string}}
        - {name: after, in: query, schema: {type: string, format: uuid}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        "200":
          description: Một trang
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/HTXAnchor"}}
                  next_cursor: {type: [string, "null"]}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
    post:
      summary: "D2: Khuyến nông hoặc MKG lập HTX TẠM — gắn neo cho Nút HTX (MST hoặc mã tạm). MST trùng → 409 cooperative.htx_anchor_mst_taken (kèm existing_anchor_id)"
      operationId: coopCreateHTXAnchor
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [created_by]
              oneOf:
                - required: [org_ref]
                  not: {required: [new_cooperative]}
                - required: [new_cooperative]
                  not: {required: [org_ref]}
              properties:
                org_ref: {type: string, format: uuid, description: "Nút HTX (kind=cooperative, đã có hồ sơ)"}
                new_cooperative:
                  type: object
                  additionalProperties: false
                  required: [name, admin_unit_code]
                  description: "Tạo Nút + hồ sơ ngay trong luồng Neo; chỉ platform_admin/registry_admin. Gửi lại cùng Idempotency-Key hoàn tất các bước còn thiếu, không tạo Nút thứ hai. MST lấy từ trường mst bên ngoài."
                  properties:
                    name: {type: string, minLength: 1, maxLength: 200}
                    admin_unit_code: {type: string, description: "Mã xã còn hiệu lực"}
                    parent_ref: {type: string, format: uuid, description: "Nút xã cấp trên (tùy chọn)"}
                    representative_ref: {type: string, format: uuid}
                    representative:
                      type: object
                      required: [full_name, phone]
                      description: "Chuyển thẳng vào kho định danh, không lưu trong sổ Neo"
                      properties:
                        full_name: {type: string}
                        phone: {type: string}
                    profile:
                      type: object
                      properties:
                        area_ha: {type: string, description: "Decimal dạng chuỗi"}
                        established_on: {type: string, format: date}
                        address: {type: string, maxLength: 500}
                        location:
                          type: object
                          required: [lat, lon]
                          properties:
                            lat: {type: string}
                            lon: {type: string}
                created_by: {type: string, enum: [kn, mkg], description: "mkg cần platform_admin"}
                mst: {type: string, description: "Mã số thuế (10 số hoặc 10 + 3 số chi nhánh; khoảng trắng/gạch được bỏ). Vắng = mã tạm"}
                agreement_ref: {type: string, minLength: 3, maxLength: 200, description: "Thỏa thuận HTX — basis_ref của share_grant cho Khuyến nông"}
      responses:
        "200": {description: Gọi lặp cùng Idempotency-Key, content: {application/json: {schema: {$ref: "#/components/schemas/HTXAnchor"}}}}
        "201": {description: Đã lập, content: {application/json: {schema: {$ref: "#/components/schemas/HTXAnchor"}}}}
        "403": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
# @ag-order: 26
  /v1/htx-anchors/backfill:
    post:
      summary: "D2: neo HTX có trước D2 (HTX tạm do KN lập; khóa = MST hồ sơ hoặc mã tạm), có chạy thử"
      operationId: coopBackfillHTXAnchors
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                dry_run: {type: boolean, default: false}
                limit: {type: integer, minimum: 1, maximum: 1000, default: 500}
      responses:
        "200":
          description: Kết quả
          content:
            application/json:
              schema:
                type: object
                required: [dry_run, created, with_mst, temp_code, items, skipped]
                properties:
                  dry_run: {type: boolean}
                  created: {type: integer}
                  with_mst: {type: integer}
                  temp_code: {type: integer}
                  items: {type: array, items: {type: object, additionalProperties: true}}
                  skipped: {type: array, items: {type: object, additionalProperties: true}}
        "403": {$ref: "#/components/responses/Problem"}
# @ag-order: 27
  /v1/htx-anchors/{anchor_id}:
    get:
      summary: "D2: chi tiết neo kèm sổ (vết kiểm toán: lập, gắn MST, nhận quyền)"
      operationId: coopGetHTXAnchor
      parameters:
        - {name: anchor_id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Neo
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/HTXAnchor"
                  - type: object
                    required: [events]
                    properties:
                      events: {type: array, items: {$ref: "#/components/schemas/HTXAnchorEvent"}}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
# @ag-order: 28
  /v1/htx-anchors/{anchor_id}/mst:
    post:
      summary: "D2: gắn mã số thuế cho neo mã tạm (sự kiện mst_attached)"
      operationId: coopAttachHTXAnchorMST
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - {name: anchor_id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mst]
              properties:
                mst: {type: string}
      responses:
        "200": {description: Neo sau khi gắn, content: {application/json: {schema: {$ref: "#/components/schemas/HTXAnchor"}}}}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
# @ag-order: 29
  /v1/htx-anchors/{anchor_id}/claim:
    post:
      summary: "D2: HTX thật nhận quyền (MST đã xác minh, tài khoản HTX đã kích hoạt) — một lần mỗi neo, lũy đẳng, nguyên tử; dry_run trả báo cáo không ghi; Nút đích có dữ liệu → 409 cooperative.htx_anchor_claim_conflict kèm conflict_report"
      operationId: coopClaimHTXAnchor
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - {name: anchor_id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [account_ref, verified_mst, verification_ref]
              properties:
                account_ref: {type: string, format: uuid, description: "Tài khoản HTX đã kích hoạt"}
                verified_mst: {type: string}
                verification_ref: {type: string, minLength: 3, maxLength: 200, description: "Chứng cứ xác minh MST"}
                target_org_ref: {type: string, format: uuid, description: "Nút HTX thật; vắng = Nút tạm của neo"}
                dry_run: {type: boolean, default: false}
      responses:
        "200": {description: Báo cáo nhận quyền (cũng là details của dòng sổ claimed), content: {application/json: {schema: {$ref: "#/components/schemas/HTXClaimReport"}}}}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
# @ag-order: 30
  /v1/cooperatives/{ref}/deactivate:
    post:
      summary: Vô hiệu hóa HTX (soft-delete) — lý do ≥ 20 ký tự; phát pf.party.org.deactivated để khóa tài khoản
      operationId: partyDeactivateCooperative
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string, minLength: 20}
      responses:
        "200": {$ref: "#/components/responses/PartyOrgChanged"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
# @ag-order: 31
  /v1/cooperatives/{ref}/reactivate:
    post:
