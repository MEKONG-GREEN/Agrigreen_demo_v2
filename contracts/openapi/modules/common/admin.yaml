    ApiSubscription:
      type: object
      required: [id, product, scopes, status, proposed_by, proposed_at]
      properties:
        id: {type: string, format: uuid}
        product: {type: string}
        scopes: {type: array, items: {type: string}}
        status: {type: string, enum: [proposed, active, revoked]}
        proposed_by: {type: string, format: uuid}
        proposed_at: {type: string, format: date-time}
        approved_by: {type: [string, "null"], format: uuid}
        approved_at: {type: [string, "null"], format: date-time}
        revoked_at: {type: [string, "null"], format: date-time}
        revoke_reason: {type: [string, "null"]}
# @ag-order: 385
    ApiWebhook:
      type: object
      description: Webhook mỏng (W5.7) — không bao giờ có nonce/khóa; secret CHỈ trong phản hồi đăng ký/xoay.
      required: [id, url, feeds, status, failure_threshold, secret_version, breaker, cursors]
      properties:
        id: {type: string, format: uuid}
        url: {type: string, format: uri}
        feeds: {type: array, items: {type: string}}
        status: {type: string, enum: [active, disabled]}
        status_reason: {type: string}
        failure_threshold: {type: integer}
        secret_version: {type: integer}
        previous_secret_valid_until: {type: [string, "null"], format: date-time}
        created_at: {type: string, format: date-time}
        secret: {type: string, pattern: "^whsec_"}
        breaker:
          type: object
          required: [state, consecutive_failures]
          properties:
            state: {type: string, enum: [closed, open, half_open]}
            consecutive_failures: {type: integer}
            opened_at: {type: [string, "null"], format: date-time}
            next_probe_at: {type: [string, "null"], format: date-time}
            last_success_at: {type: [string, "null"], format: date-time}
            last_failure_at: {type: [string, "null"], format: date-time}
            last_error: {type: [string, "null"]}
        cursors:
          type: array
          items:
            type: object
            properties:
              feed: {type: string}
              notified_cursor: {type: [string, "null"]}
              pending_attempts: {type: integer}
              next_attempt_at: {type: [string, "null"], format: date-time}
              last_attempt_at: {type: [string, "null"], format: date-time}
        recent_deliveries:
          type: array
          items:
            type: object
            properties:
              id: {type: string, format: uuid}
              feed: {type: string}
              cursor: {type: string}
              attempt: {type: integer}
              probe: {type: boolean}
              outcome: {type: string, enum: [delivered, failed, blocked]}
              http_status: {type: [integer, "null"]}
              error_class: {type: [string, "null"]}
              breaker_state: {type: string, enum: [closed, open, half_open]}
              at: {type: string, format: date-time}
