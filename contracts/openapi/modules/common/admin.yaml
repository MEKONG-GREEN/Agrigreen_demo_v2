    ApiKeyIssued:
      type: object
      required: [key_id, client_id, key_prefix, expires_at]
      properties:
        key_id: {type: string, format: uuid}
        client_id: {type: string, format: uuid}
        key_prefix: {type: string}
        api_key: {type: string, description: "agk_<prefix>_<bí mật> — CHỈ có ở phản hồi đầu; không bao giờ lưu, log hay phát lại"}
        expires_at: {type: string, format: date-time}
        previous_key_grace_until: {type: string, format: date-time, description: "Khi xoay: hạn chồng lấn của khóa cũ"}
