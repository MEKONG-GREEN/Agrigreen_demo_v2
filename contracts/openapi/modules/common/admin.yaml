  # --- pf/apiclient W5.7: webhook mỏng + ngắt mạch (ADR-0033 §4) ---
# @ag-order: 230
  /v1/api-clients/{id}/webhooks:
    get:
      summary: Webhook của khách hàng — trạng thái ngắt mạch, cursor đã báo, 10 lần giao gần nhất (không bí mật)
      operationId: listApiWebhooks
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Danh sách
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/ApiWebhook"}}
        "403": {$ref: "#/components/responses/Problem"}
    post:
      summary: Đăng ký webhook (api_client_admin; khách hàng active; feed phải có scope feed:<tên>:read đã duyệt) — bí mật hiện MỘT lần
      description: |
        URL: chỉ `https`, cổng 443/8443, không userinfo/fragment, không tên máy nội bộ; IP literal và MỌI địa chỉ phân
        giải phải ngoài dải nội bộ/loopback/link-local/metadata (kiểm lại lúc kết nối — chống DNS rebinding); tùy chọn
        danh sách tên miền `AG_WEBHOOK_ALLOW_HOSTS`. Tối đa 5 webhook active mỗi khách hàng.
      operationId: registerApiWebhook
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [url, feeds]
              properties:
                url: {type: string, format: uri, maxLength: 2048}
                feeds: {type: array, minItems: 1, maxItems: 20, items: {type: string, pattern: "^[a-z][a-z0-9_]{2,47}$"}}
                failure_threshold: {type: integer, minimum: 1, maximum: 100, default: 5, description: "N lỗi liên tiếp → ngắt mạch"}
      responses:
        "201":
          description: "Webhook + secret (Cache-Control: no-store). Gọi lặp cùng Idempotency-Key trả bản KHÔNG có secret."
          headers:
            Cache-Control: {schema: {type: string, enum: [no-store]}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ApiWebhook"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
# @ag-order: 231
  /v1/api-clients/{id}/webhooks/{webhook_id}/rotate-secret:
