        created_by: {type: string, enum: [kn, mkg]}
        provisional_org_ref: {type: string, format: uuid}
        org_ref: {type: string, format: uuid, description: "Nút hiện hành"}
        aliases: {type: array, items: {type: string, format: uuid}, description: "Mọi Nút của neo (Nút tạm, Nút nhận quyền)"}
        htx_account_ref: {type: [string, "null"], format: uuid}
        agreement_ref: {type: [string, "null"]}
        co_owners: {type: array, items: {type: string, enum: [mkg, htx]}}
        confirmation_status: {type: string, enum: [confirmed, unconfirmed]}
        confirmation_label: {type: string, enum: ["Đã xác nhận", "Chưa xác nhận"]}
        claimed_at: {type: [string, "null"], format: date-time}
        created_at: {type: string, format: date-time}
# @ag-order: 255
    HTXAnchorEvent:
      type: object
      required: [id, seq, action, anchor_key, mst, org_ref, verification_ref, details, actor_ref, event_time, recorded_at]
      properties:
        id: {type: string, format: uuid}
        seq: {type: integer}
        action: {type: string, enum: [provisional_created, legacy_backfilled, mst_attached, claimed]}
        anchor_key: {type: string}
        mst: {type: [string, "null"]}
        org_ref: {type: string, format: uuid}
        verification_ref: {type: [string, "null"]}
        details: {type: [object, "null"], additionalProperties: true}
        actor_ref: {type: string, format: uuid}
        event_time: {type: string, format: date-time}
        recorded_at: {type: string, format: date-time}
