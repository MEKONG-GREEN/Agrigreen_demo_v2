paths:
# @ag-order: 40500
  /v1/public/contacts/support-requests:
    post:
      summary: FN-CH-00.01/Q10 — gửi yêu cầu hỗ trợ tài khoản cho Admin KN, không cần đăng nhập hay assignment
      operationId: knSupportSubmit
      tags: [contact]
      security: []
      parameters:
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/KNSupportInput'}
      responses:
        '202':
          description: Yêu cầu đã commit; không trả tài khoản, tenant, mã yêu cầu hoặc nội dung cá nhân
          content:
            application/json:
              schema: {type: object, additionalProperties: false, required: [status], properties: {status: {type: string, enum: [accepted]}}}
        '413': {description: contact.support_too_large, $ref: '#/components/responses/Problem'}
        '415': {description: contact.support_json_required, $ref: '#/components/responses/Problem'}
        '422': {description: validation_failed | idempotency_key_reused, $ref: '#/components/responses/Problem'}
        '429': {description: rate_limited, $ref: '#/components/responses/Problem'}
        '503': {description: contact.support_unavailable, $ref: '#/components/responses/Problem'}
# @ag-order: 40501
  /v1/contacts/support-requests:
    get:
      summary: Admin KN có MFA xem hàng đợi metadata không PII; ghi audit trước khi trả
      operationId: knSupportList
      tags: [contact]
      parameters:
        - {name: state, in: query, schema: {type: string, enum: [new, resolved]}}
        - {name: offset, in: query, schema: {type: integer, minimum: 0, maximum: 10000}}
      responses:
        '200':
          description: Tối đa 50 yêu cầu trong tenant hiện tại
          content:
            application/json:
              schema: {type: object, required: [items], properties: {items: {type: array, items: {$ref: '#/components/schemas/KNSupportSummary'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
# @ag-order: 40502
  /v1/contacts/support-requests/{id}:
    get:
      summary: Admin KN có MFA đọc nội dung qua vault với mục đích kn.account_support; no-store và audit trước plaintext
      operationId: knSupportDetail
      tags: [contact]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Nội dung giải mã sau kiểm quyền và commit audit
          content:
            application/json:
              schema: {$ref: '#/components/schemas/KNSupportDetail'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
# @ag-order: 40503
  /v1/contacts/support-requests/{id}/resolution:
    put:
      summary: Admin KN đánh dấu đã xử lý bằng CAS; replay khóa gắn actor sau kiểm quyền hiện tại, không dùng cache POST
      operationId: knSupportResolve
      tags: [contact]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: false, required: [expected_version], properties: {expected_version: {type: integer, format: int64, minimum: 1}}}
      responses:
        '200':
          description: Đã commit sự kiện xử lý (hoặc replay cùng thao tác đã được cấp quyền)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/KNSupportSummary'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {description: contact.support_stale | idempotency_key_reused, $ref: '#/components/responses/Problem'}
        '413': {$ref: '#/components/responses/Problem'}
        '415': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
components:
  schemas:
# @ag-order: 40500
    KNSupportInput:
      description: Tổng JSON chuẩn hóa cộng GCM tag không vượt 12 KiB; quá giới hạn trả validation_failed tại message để rút gọn.
      type: object
      additionalProperties: false
      required: [name, contact, message]
      properties:
        name: {type: string, minLength: 1, maxLength: 100, description: Họ tên liên hệ; dữ liệu cá nhân}
        contact: {type: string, minLength: 1, maxLength: 254, description: Email hoặc số điện thoại; không dùng để tra/liệt kê tài khoản}
        message: {type: string, minLength: 10, maxLength: 2000, description: Nội dung hỗ trợ; không nhập mật khẩu hoặc OTP}
# @ag-order: 40501
    KNSupportSummary:
      type: object
      required: [id, created_at, state, version]
      properties:
        id: {type: string, format: uuid}
        created_at: {type: string, format: date-time}
        state: {type: string, enum: [new, resolved]}
        version: {type: integer, format: int64, minimum: 1}
# @ag-order: 40502
    KNSupportDetail:
      allOf:
        - {$ref: '#/components/schemas/KNSupportSummary'}
        - {$ref: '#/components/schemas/KNSupportInput'}
