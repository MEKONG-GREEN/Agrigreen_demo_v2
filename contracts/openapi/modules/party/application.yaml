paths:
# @ag-order: 11
  /v1/me/modules:
    get:
      summary: "Module đã bật cho đơn vị (tenant) của người gọi — W1.4, R-MOD-08: client ẩn màn của module đã tắt"
      description: >-
        Mọi người đã xác thực. Route của module đã tắt trả 403 `module_not_enabled` (problem có `module`); menu
        `GET /v1/menu` đã lọc sẵn ở server. Module `enable: always` luôn `enabled: true`.
      operationId: myModules
      tags: [party]
      responses:
        "200":
          description: Danh sách
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/ModuleEnablement"}}
        "401": {$ref: "#/components/responses/Problem"}
  # --- pf/accounts KN v7.7 gói P1: ngữ cảnh phiên (FN-CH-00.01, gap §4.5 phương án A) ---
  # Keycloak chỉ xác thực. Client chọn vai trò × phòng ban → context_id, gửi header X-AG-Context ở MỌI request (cả Admin API);
  # middleware giải vai, phòng ban, phạm vi ở server. Context lạ / của người khác → 403 accounts.context_invalid; hết hạn → 403
  # accounts.context_expired; vai trò thu hồi, phòng ban không còn Đang áp dụng, tài khoản bị khóa → 403 accounts.context_revoked.
  # Đổi vai trò/phòng ban = chọn lại, không đăng nhập lại.
# @ag-order: 15
  /v1/orgs/tree:
    get:
      summary: "FN-AD-04.02: cây TTKNQG › TTKN tỉnh › Khu vực › Xã trong phạm vi người gọi (xem xuống, không ngang, không lên)"
      operationId: knOrgTree
      tags: [party]
      parameters:
        - {name: include_inactive, in: query, schema: {type: boolean, default: false}}
      responses:
        "200":
          description: Rừng cây (gốc = Nút thấy được cao nhất); xã chưa gán khu vực vào nhóm region_unassigned
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/KNOrgTreeNode"}}
        "401": {$ref: "#/components/responses/Problem"}
# @ag-order: 19
  /v1/departments:
    get:
      summary: "Phòng ban của đơn vị (bước 2 đăng nhập, FN-CH-00.01) — chỉ selectable = true chọn được"
      operationId: knListDepartments
      tags: [party]
      parameters:
        - {name: org_ref, in: query, schema: {type: string, format: uuid}, description: "Đơn vị; vắng = Nút cấp 1/2 gần nhất của Nút người gọi"}
      responses:
        "200":
          description: Danh sách theo thứ tự hiển thị (account_count/record_count luôn null ở Application API)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/KNDepartmentList"}
        "401": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
# @ag-order: 20
  /v1/departments/{code}/modules:
    get:
      summary: "UR-KT-02: cây module (menu) của một phòng ban cho vai KN — bật phòng ban không cần phát hành lại web/app"
      description: |
        Dựng từ bảng menu tĩnh có phiên bản (kn.menu/v3: khuôn theo phòng ban + nhóm "Dùng chung" cuối mọi menu; mục module chưa có hiện "Sắp có", enabled = false, status coming_soon) và trạng thái phòng ban hiện hành ở MỖI request (Cache-Control: no-store).
        audience vắng: theo ngữ cảnh phiên (P1) hoặc vai duy nhất của người gọi. platform_admin xem được mọi cấp (FN-AD-04.07).
        audience = admin: mục con của phòng ban trong nhóm "Phòng ban" (enabled = false khi chưa mở).
      operationId: knDepartmentModules
      tags: [party]
      parameters:
        - {name: code, in: path, required: true, schema: {type: string}}
        - {name: audience, in: query, schema: {type: string, enum: [kn_tw, kn_tinh, kn_xa, admin]}}
        - {name: role, in: query, deprecated: true, schema: {type: string, enum: [kn_tw, kn_tinh, kn_xa, admin]}, description: "Tên cũ của audience (hợp đồng tạm P6) — nhận một đợt; audience thắng"}
        - {name: org_ref, in: query, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Menu
          content:
            application/json:
              schema: {$ref: "#/components/schemas/KNMenu"}
        "403": {description: party.menu_audience_forbidden, $ref: "#/components/responses/Problem"}
        "404": {description: party.department_not_found, $ref: "#/components/responses/Problem"}
        "409": {description: party.department_not_open, $ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
# @ag-order: 21
  /v1/menu:
    get:
      summary: "UR-KT-02, BRD §6: sidebar đầy đủ theo vai + phòng ban của phiên (Admin: Điều hành / Phòng ban / Quản trị hệ thống)"
      description: |
        web-ops/app gọi KHÔNG tham số kèm header X-AG-Context: server lấy vai + phòng ban từ ngữ cảnh phiên (P1).
        Đường dẫn (route) là trang web-ops: "/kn/<màn>" (vai + phòng ban ở ngữ cảnh, không ở URL); màn Admin theo
        phòng ban "/kn/phong-ban/{mã phòng ban}/<màn>"; màn hiện có ngoài /kn giữ đường dẫn cũ. Bản giả lập web
        khớp bảng Go qua ca vàng apps/web-ops/src/api/mock/fixtures/kn-menu.json.
      operationId: knMenu
      tags: [party]
      parameters:
        - {name: audience, in: query, schema: {type: string, enum: [kn_tw, kn_tinh, kn_xa, admin]}, description: "Vắng = theo ngữ cảnh phiên (X-AG-Context) hoặc vai duy nhất"}
        - {name: role, in: query, deprecated: true, schema: {type: string, enum: [kn_tw, kn_tinh, kn_xa, admin]}, description: "Tên cũ của audience (hợp đồng tạm P6) — nhận một đợt; audience thắng"}
        - {name: department, in: query, schema: {type: string}, description: "Vắng = phòng ban của ngữ cảnh phiên, hoặc phòng ban Đang áp dụng duy nhất của đơn vị"}
        - {name: org_ref, in: query, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Menu
          content:
            application/json:
              schema: {$ref: "#/components/schemas/KNMenu"}
        "403": {description: party.menu_audience_forbidden, $ref: "#/components/responses/Problem"}
        "404": {description: party.department_not_found, $ref: "#/components/responses/Problem"}
        "409": {description: party.department_not_open, $ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
# @ag-order: 22
  /v1/regions:
    get:
      summary: "FN-AD-04.02: khu vực của tỉnh kèm số xã được gán (mọi vai chọn/lọc theo Khu vực)"
      operationId: knListRegions
      tags: [party]
      parameters:
        - {name: province_code, in: query, required: true, schema: {type: string}}
        - {name: include_inactive, in: query, schema: {type: boolean, default: false}}
      responses:
        "200":
          description: Danh sách
          content:
            application/json:
              schema: {$ref: "#/components/schemas/KNRegionList"}
        "401": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  # --- hết pf/party KN v7.7 gói P2 ---
# @ag-order: 206
  /v1/households/{ref}/membership:
    post:
      summary: Nông hộ vào / chuyển / rời HTX (KN US-HTX-02, US-HTX-05) — phát pf.party.household.membership_changed
      description: |
        cooperative_ref null = rời HTX. Quản lý HTX chỉ cho hộ (chưa thuộc HTX nào) vào HTX của mình hoặc rời HTX của mình;
        cán bộ KN/quản trị trong phạm vi. Lý do 10–500 ký tự (không đi vào sự kiện). effective_date mặc định hôm nay (giờ VN).
      operationId: changeHouseholdMembership
      tags: [party]
      parameters:
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                cooperative_ref: {type: [string, "null"], format: uuid}
                effective_date: {type: string, format: date}
                reason: {type: string, minLength: 10, maxLength: 500}
      responses:
        "200":
          description: Đã đổi
          content:
            application/json:
              schema:
                type: object
                properties:
                  household: {$ref: "#/components/schemas/Household"}
                  change: {type: string, enum: [joined, left, transferred]}
                  prev_cooperative_ref: {type: [string, "null"], format: uuid}
        "403": {description: "party.out_of_scope", $ref: "#/components/responses/Problem"}
        "404": {description: "party.household_not_found", $ref: "#/components/responses/Problem"}
        "409": {description: "party.membership_unchanged | party.org_state_conflict", $ref: "#/components/responses/Problem"}
        "422": {description: "party.membership_reason_required", $ref: "#/components/responses/Problem"}
# @ag-order: 263
  /v1/kn/cooperatives:
    get:
      tags: [party]
      summary: "Danh sách HTX trên các xã phụ trách (FN-XA-03.03)"
      operationId: knListCooperatives
      parameters:
        - {name: X-AG-Context, in: header, required: true, description: "Ngữ cảnh phiên KN (P1)", schema: {type: string, format: uuid}}
        - {name: commune, in: query, schema: {type: string}, description: "Mã xã; vắng = mọi xã trong phạm vi; ngoài phạm vi → 403 party.out_of_scope"}
        - {name: status, in: query, schema: {type: string, enum: [active, inactive, all], default: active}}
        - {name: q, in: query, schema: {type: string}, description: "Tìm theo tên, Mã HTX, mã số thuế"}
        - {name: area_min, in: query, schema: {type: string}, description: "Diện tích tối thiểu (ha, decimal)"}
        - {name: area_max, in: query, schema: {type: string}, description: "Diện tích tối đa (ha, decimal)"}
        - {name: confirmation, in: query, description: "D2: lọc theo trạng thái xác nhận; vắng = mọi HTX (gồm HTX tạm Chưa xác nhận)", schema: {$ref: "#/components/schemas/HTXConfirmationStatus"}}
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        "200":
          description: Một trang HTX
          content:
            application/json:
              schema: {$ref: "#/components/schemas/KNCooperativeList"}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "428": {$ref: "#/components/responses/Problem"}
    post:
      tags: [party]
      summary: "Thêm HTX trong xã phụ trách (Cấp Xã, Admin)"
      description: "Mã HTX tự sinh. Trùng tên (không phân biệt hoa thường) → 409 party.cooperative_name_taken. Người đại diện chỉ vào kho định danh."
      operationId: knCreateCooperative
      parameters:
        - {name: X-AG-Context, in: header, required: true, description: "Ngữ cảnh phiên KN (P1)", schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/KNCooperativeCreate"}
      responses:
        "201":
          description: HTX đã tạo
          content:
            application/json:
              schema: {$ref: "#/components/schemas/KNCooperative"}
        "403": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
# @ag-order: 264
  /v1/kn/cooperatives/{ref}:
    get:
      tags: [party]
      summary: "Chi tiết HTX (ngoài phạm vi → 404)"
      operationId: knGetCooperative
      parameters:
        - {name: X-AG-Context, in: header, required: true, description: "Ngữ cảnh phiên KN (P1)", schema: {type: string, format: uuid}}
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: HTX
          content:
            application/json:
              schema: {$ref: "#/components/schemas/KNCooperative"}
        "404": {$ref: "#/components/responses/Problem"}
    put:
      tags: [party]
      summary: "Sửa hồ sơ HTX — sự kiện bù (Log cũ → mới, không PII)"
      description: >-
        Trường vắng = giữ nguyên; area_ha/tax_code/head_office rỗng hoặc null = xóa giá trị. Đổi người đại diện: chủ thể mới
        trong kho định danh, Log ghi representative_ref cũ → mới. Gửi lại cùng Idempotency-Key → kết quả hiện tại, không ghi thêm.
        HTX đã vô hiệu hóa → 409 party.org_state_conflict.
      operationId: knUpdateCooperative
      parameters:
        - {name: X-AG-Context, in: header, required: true, description: "Ngữ cảnh phiên KN (P1)", schema: {type: string, format: uuid}}
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/KNCooperativeUpdate"}
      responses:
        "200":
          description: HTX sau khi sửa
          content:
            application/json:
              schema: {$ref: "#/components/schemas/KNCooperative"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
# @ag-order: 265
  /v1/kn/cooperatives/{ref}/deactivate:
    post:
      tags: [party]
      summary: "Vô hiệu hóa HTX (thay xóa cứng) kèm cảnh báo dữ liệu liên kết"
      description: "Lý do ≥ 20 ký tự (ràng buộc sổ org_event, US-HTXSTATUS-01 AC-3). Phát pf.party.org.deactivated."
      operationId: knDeactivateCooperative
      parameters:
        - {name: X-AG-Context, in: header, required: true, description: "Ngữ cảnh phiên KN (P1)", schema: {type: string, format: uuid}}
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/KNReason"}
      responses:
        "200":
          description: HTX đã vô hiệu hóa
          content:
            application/json:
              schema: {$ref: "#/components/schemas/KNCooperativeDeactivated"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
# @ag-order: 266
  /v1/kn/cooperatives/{ref}/reactivate:
    post:
      tags: [party]
      summary: "Kích hoạt lại HTX (lý do ≥ 10 ký tự)"
      operationId: knReactivateCooperative
      parameters:
        - {name: X-AG-Context, in: header, required: true, description: "Ngữ cảnh phiên KN (P1)", schema: {type: string, format: uuid}}
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/KNReason"}
      responses:
        "200":
          description: HTX đã kích hoạt lại
          content:
            application/json:
              schema: {$ref: "#/components/schemas/KNCooperative"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
# @ag-order: 267
  /v1/kn/cooperatives/{ref}/households:
    get:
      tags: [party]
      summary: "Nông hộ thành viên của HTX (tab Nông hộ)"
      operationId: knListHouseholds
      parameters:
        - {name: X-AG-Context, in: header, required: true, description: "Ngữ cảnh phiên KN (P1)", schema: {type: string, format: uuid}}
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        "200":
          description: Một trang nông hộ
          content:
            application/json:
              schema: {$ref: "#/components/schemas/KNHouseholdList"}
        "404": {$ref: "#/components/responses/Problem"}
    post:
      tags: [party]
      summary: "Thêm nông hộ vào HTX (chủ hộ vào kho định danh)"
      description: "SĐT đã có trong kho → 409 party.household_phone_taken; HTX đã vô hiệu hóa → 409 party.org_state_conflict."
      operationId: knCreateHousehold
      parameters:
        - {name: X-AG-Context, in: header, required: true, description: "Ngữ cảnh phiên KN (P1)", schema: {type: string, format: uuid}}
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/KNHouseholdCreate"}
      responses:
        "201":
          description: Nông hộ đã thêm
          content:
            application/json:
              schema: {$ref: "#/components/schemas/KNHousehold"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
# @ag-order: 268
