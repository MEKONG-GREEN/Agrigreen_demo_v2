paths:
# @ag-order: 178
  /v1/share-grants:
    post:
      summary: Đề xuất cấp quyền chia sẻ tenant này (bên cấp) → tenant khác (bên nhận) — ADR-0020
      description: |
        Chỉ `platform_admin` của tenant bên cấp — quản trị viên của ĐƠN VỊ CHỦ dữ liệu (R-SEC-04). Một `platform_admin` KHÁC
        duyệt (R-56). `valid_from` vắng → lúc đề xuất; `valid_to` bắt buộc, ở tương lai, tối đa 5 năm.

        Cấp phép v2 (W4.1, ADR-0030 mục 3): `grant_class` vắng = `partner` (hành vi cũ: `kinds` ≥ 1, không `module_table`/
        `scope_node_ref`). `intra_platform` (đọc tại chỗ qua `k_ref.share_scope`, có hiệu lực từ W4.2): KHÔNG `kinds`;
        bắt buộc `module_table` (`<module>:<share>` có trong `shares` của module chủ — sai → 422 `party.share_table_not_shared`),
        `scope_node_ref` (Nút đang hoạt động của tenant bên cấp), `purpose_code`, `basis_ref` (mã thỏa thuận chia sẻ).
      operationId: proposeShareGrant
      tags: [party]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [grantee_tenant_id, purpose, valid_to]
              properties:
                grantee_tenant_id: {type: string, format: uuid}
                kinds:
                  type: array
                  description: Bắt buộc (≥ 1) với partner; vắng/rỗng với intra_platform
                  items: {$ref: "#/components/schemas/ShareKind"}
                purpose: {type: string, minLength: 10, maxLength: 500}
                valid_from: {type: string, format: date-time}
                valid_to: {type: string, format: date-time}
                grant_class: {$ref: "#/components/schemas/ShareGrantClass"}
                module_table: {type: string, pattern: "^(pf|mkg)/[a-z][a-z0-9_]*:[a-z][a-z0-9_]*$", description: "Chỉ intra_platform, vd pf/cooperative:household"}
                scope_node_ref: {type: string, format: uuid, description: "Chỉ intra_platform: Nút phạm vi của đơn vị chủ"}
                purpose_code: {type: string, pattern: "^[a-z][a-z0-9-]{0,39}(\\.[a-z][a-z0-9-]{0,39}){0,3}$", description: "Mục đích có mã, vd khuyen-nong (bắt buộc với intra_platform)"}
                basis_ref: {type: string, minLength: 3, maxLength: 200, description: "Mã thỏa thuận chia sẻ — căn cứ (bắt buộc với intra_platform)"}
      responses:
        "201":
          description: Đã đề xuất (gọi lặp cùng Idempotency-Key → như lần đầu)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ShareGrant"}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
    get:
      summary: Cấp quyền chia sẻ của tenant bên cấp — ADR-0020
      operationId: listShareGrants
      tags: [party]
      parameters:
        - {name: status, in: query, schema: {type: string, enum: [proposed, active, revoked]}}
        - {name: cursor, in: query, schema: {type: string, format: uuid}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        "200":
          description: Một trang
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/ShareGrant"}}
                  next_cursor: {type: [string, "null"], format: uuid}
        "403": {$ref: "#/components/responses/Problem"}
# @ag-order: 179
  /v1/share-grants/{id}:
    get:
      summary: Một cấp quyền chia sẻ — ADR-0020
      operationId: getShareGrant
      tags: [party]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Cấp quyền
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ShareGrant"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
# @ag-order: 180
  /v1/share-grants/{id}/approve:
    post:
      summary: Duyệt cấp quyền chia sẻ — người duyệt ≠ người đề xuất (R-56), ADR-0020
      description: Ghi cùng giao dịch bảng chiếu ở tenant bên nhận. Tự duyệt → 403 `self_approval_forbidden`.
      operationId: approveShareGrant
      tags: [party]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "201":
          description: Đã duyệt (gọi lặp của chính người duyệt → 200)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ShareGrant"}
        "200":
          description: Đã duyệt trước đó bởi chính người gọi
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ShareGrant"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
# @ag-order: 181
  /v1/share-grants/{id}/revoke:
    post:
      summary: Thu hồi cấp quyền chia sẻ (có hiệu lực ngay) — ADR-0020
      operationId: revokeShareGrant
      tags: [party]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string, minLength: 10, maxLength: 500}
      responses:
        "201":
          description: Đã thu hồi
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ShareGrant"}
        "200":
          description: Đã thu hồi trước đó bởi chính người gọi
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ShareGrant"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
# @ag-order: 182
  /v1/share-grants/{id}/reads:
    get:
      summary: Sổ đọc của bên nhận với một cấp quyền (mỗi lời gọi /v1/partner/* một dòng) — ADR-0020
      operationId: listShareGrantReads
      tags: [party]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: after, in: query, schema: {type: integer, minimum: 0, default: 0}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 500, default: 100}}
      responses:
        "200":
          description: Một trang sổ đọc
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  next_cursor: {type: integer}
                  items: {type: array, items: {$ref: "#/components/schemas/ShareGrantRead"}}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
# @ag-order: 183
  /v1/share-grant-reviews/due:
    get:
      summary: Cấp phép đang hiệu lực đến hạn rà soát định kỳ (R-SEC-04) — W4.1
      description: |
        Chỉ `platform_admin` của đơn vị chủ (tenant bên cấp). Đến hạn khi lần rà soát cuối (hoặc lúc duyệt) + chu kỳ
        (`review_interval_days`, hiện 90 ngày) ≤ hiện tại + `within_days`.
      operationId: listShareGrantsDueForReview
      tags: [party]
      parameters:
        - {name: within_days, in: query, schema: {type: integer, minimum: 0, maximum: 366, default: 0}}
        - {name: cursor, in: query, schema: {type: string, format: uuid}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        "200":
          description: Một trang
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor, review_interval_days]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/ShareGrant"}}
                  next_cursor: {type: [string, "null"], format: uuid}
                  review_interval_days: {type: integer}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
# @ag-order: 184
  /v1/share-grants/{id}/reviews:
    get:
      summary: Sổ rà soát định kỳ của một cấp phép (chỉ ghi thêm) — W4.1, R-SEC-04
      operationId: listShareGrantReviews
      tags: [party]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Mọi dòng rà soát theo seq
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/ShareGrantReview"}}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
    post:
      summary: Ghi quyết định rà soát định kỳ (giữ | thu hồi) — W4.1, R-SEC-04
      description: |
        Chỉ cấp phép đang hiệu lực (khác → 409 `party.share_grant_state`). `retain` đặt lại hạn rà soát; `revoke` thu hồi
        ngay trong cùng giao dịch (`note` là lý do, bắt buộc) và tăng epoch ngữ cảnh của đơn vị xem như thu hồi thường.
      operationId: reviewShareGrant
      tags: [party]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: {type: string, enum: [retain, revoke]}
                note: {type: string, minLength: 10, maxLength: 500}
      responses:
        "201":
          description: Đã ghi (gọi lặp cùng Idempotency-Key → như lần đầu)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ShareGrantReviewResult"}
        "200":
          description: Gọi lặp
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ShareGrantReviewResult"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  # --- hết pf/party cấp quyền chia sẻ ---
  # --- pf/party KN v7.7 gói P2: phòng ban, khu vực, cây 3 cấp, bảng ảnh hưởng (FN-AD-04.02, 04.03) ---
# @ag-order: 185
  /v1/departments:
    get:
      summary: "FN-AD-04.03: phòng ban (module) của một đơn vị kèm số tài khoản/bản ghi (null khi chưa nối nguồn đếm)"
      operationId: knAdminListDepartments
      tags: [party]
      parameters:
        - {name: org_ref, in: query, schema: {type: string, format: uuid}, description: "Đơn vị (Nút cấp 1/2); vắng = đơn vị của Nút người gọi"}
        - {name: include_retired, in: query, schema: {type: boolean, default: false}}
      responses:
        "200":
          description: Danh sách theo thứ tự hiển thị
          content:
            application/json:
              schema: {$ref: "#/components/schemas/KNDepartmentList"}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
    post:
      summary: "FN-AD-04.03: khai báo phòng ban cho Nút cấp 1 (TTKNQG) hoặc cấp 2 (TTKN tỉnh); trùng mã trong đơn vị → 409"
      description: Chỉ Admin (platform_admin, registry_admin). Ghi sổ pf_party.department_event (created, ảnh chụp sau).
      operationId: knCreateDepartment
      tags: [party]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/KNDepartmentInput"}
      responses:
        "201":
          description: Đã tạo (gọi lặp cùng Idempotency-Key → như lần đầu)
          headers:
            Location: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/KNDepartment"}
        "403": {$ref: "#/components/responses/Problem"}
        "409": {description: party.department_code_taken, $ref: "#/components/responses/Problem"}
        "422": {description: validation_failed | party.department_unit_invalid, $ref: "#/components/responses/Problem"}
# @ag-order: 186
  /v1/departments/{id}:
    get:
      summary: Một phòng ban kèm số tài khoản/bản ghi
      operationId: knGetDepartment
      tags: [party]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Phòng ban
          content:
            application/json:
              schema: {$ref: "#/components/schemas/KNDepartment"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
    put:
      summary: Sửa tên, mô tả, thứ tự, bộ menu (không đổi gì → không ghi sổ; đổi → một dòng Log cũ → mới)
      operationId: knUpdateDepartment
      tags: [party]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string, minLength: 1, maxLength: 200}
                description: {type: string, maxLength: 1000}
                sort_order: {type: integer, minimum: 0, maximum: 100000}
                menu_profile: {type: string, enum: [trong_trot, generic]}
      responses:
        "200":
          description: Phòng ban sau khi sửa
          content:
            application/json:
              schema: {$ref: "#/components/schemas/KNDepartment"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {description: party.department_state (đã xóa), $ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
# @ag-order: 187
  /v1/departments/{id}/status:
    post:
      summary: "Đổi trạng thái Đang áp dụng / Chưa mở / Ngưng hoạt động — hiệu lực ngay ở bước 2 đăng nhập và menu (UR-KT-02)"
      description: Ngưng (suspended) bắt buộc lý do ≥ 10 ký tự. Ngưng/đóng phòng ban còn tài khoản/dữ liệu → cảnh báo, dữ liệu cũ giữ nguyên.
      operationId: knDepartmentStatus
      tags: [party]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: {type: string, enum: [active, not_open, suspended]}
                reason: {type: string, minLength: 10, maxLength: 500}
      responses:
        "201":
          description: Đã đổi
          content:
            application/json:
              schema:
                type: object
                required: [department, warnings]
                properties:
                  department: {$ref: "#/components/schemas/KNDepartment"}
                  warnings: {type: array, items: {type: string}}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {description: party.department_state, $ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
# @ag-order: 188
  /v1/departments/{id}/retire:
    post:
      summary: "Xóa phòng ban (sự kiện retired, không xóa cứng) — chặn khi có tài khoản/dữ liệu (409) hoặc chưa nối nguồn đếm (503)"
      operationId: knRetireDepartment
      tags: [party]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string, minLength: 10, maxLength: 500}
      responses:
        "201":
          description: Đã xóa (mã không tái sử dụng)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/KNDepartment"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {description: party.department_in_use | party.department_state, $ref: "#/components/responses/Problem"}
        "503": {description: party.dependency_unavailable, $ref: "#/components/responses/Problem"}
# @ag-order: 189
  /v1/departments/{id}/log:
    get:
      summary: Khung Log của phòng ban — người, thời điểm, cũ → mới, lý do (AC-CHUNG)
      operationId: knDepartmentLog
      tags: [party]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: cursor, in: query, schema: {type: integer, minimum: 0}, description: "seq của dòng cuối trang trước"}
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Một trang
          content:
            application/json:
              schema: {$ref: "#/components/schemas/KNLogPage"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
# @ag-order: 190
  /v1/modules:
    get:
      summary: "Bật module theo đơn vị (W1.4, R-MOD-08): mọi module của danh mục với trạng thái bật của tenant người gọi"
      description: >-
        Module `enable: always` (lõi, mkg/*, pf/extdata) luôn bật. Module `per_tenant` bật mặc định (chưa có dòng sổ) —
        chỉ tắt khi quản trị ghi sự kiện. Tắt module: route của module trả 403 `module_not_enabled`, vai của module không
        cấp được (`accounts.role_module_not_enabled`), menu không hiện màn của module.
      operationId: listModuleEnablement
      tags: [party]
      responses:
        "200":
          description: Danh sách
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/ModuleEnablement"}}
        "403": {$ref: "#/components/responses/Problem"}
# @ag-order: 191
  /v1/modules/{zone}/{name}/enablement:
    post:
      summary: "Bật/tắt một module per_tenant cho tenant người gọi — hiệu lực ngay ở bản sao xử lý, các bản sao khác ≤ 10 giây"
      description: Tắt bắt buộc lý do 10–500 ký tự. Module là `<zone>/<name>` (vd `pf/geo`).
      operationId: setModuleEnablement
      tags: [party]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - {name: zone, in: path, required: true, schema: {type: string, enum: [pf, mkg, vault]}}
        - {name: name, in: path, required: true, schema: {type: string, pattern: "^[a-z][a-z0-9_]{0,39}$"}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: {type: boolean}
                reason: {type: string, minLength: 10, maxLength: 500}
      responses:
        "201":
          description: Đã ghi (200 khi gọi lặp cùng Idempotency-Key)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ModuleEnablement"}
        "200":
          description: Gọi lặp cùng Idempotency-Key
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ModuleEnablement"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {description: party.module_not_found, $ref: "#/components/responses/Problem"}
        "409": {description: party.module_always_on | party.module_enablement_state, $ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
# @ag-order: 192
  /v1/modules/{zone}/{name}/log:
    get:
      summary: Khung Log bật/tắt module — người, thời điểm, trạng thái cũ → mới, lý do
      operationId: moduleEnablementLog
      tags: [party]
      parameters:
        - {name: zone, in: path, required: true, schema: {type: string, enum: [pf, mkg, vault]}}
        - {name: name, in: path, required: true, schema: {type: string}}
        - {name: cursor, in: query, schema: {type: integer, minimum: 0}, description: "seq của dòng cuối trang trước"}
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Một trang
          content:
            application/json:
              schema: {$ref: "#/components/schemas/KNLogPage"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
# @ag-order: 193
  /v1/orgs/{ref}/departments/seed:
    post:
      summary: "Nạp 5 phòng ban mặc định (TTKN An Giang; Phòng Trồng trọt Đang áp dụng; W11.06, chờ khách Q-051); xóa mã tạm phong_ban_5/6 chưa dùng; chạy lặp an toàn"
      operationId: knSeedDepartments
      tags: [party]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Kết quả nạp
          content:
            application/json:
