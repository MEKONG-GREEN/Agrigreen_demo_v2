paths:
# @ag-order: 246
  /v1/cropcycle/htx-collection/schedules:
    get:
      summary: Lịch gom rơm MKG của HTX (qua van collection_schedule) — G3-2
      description: |
        Bản revision lớn nhất theo `schedule_ref`. Quản lý HTX chỉ thấy HTX mình; quản trị toàn tenant (lọc
        `cooperative_ref`); cán bộ KN theo xã trong phạm vi. Mới nhất trước, cursor = `schedule_ref` cuối.
      operationId: listHtxCollectionSchedules
      tags: [cropcycle]
      parameters:
        - {name: cooperative_ref, in: query, schema: {type: string, format: uuid}}
        - {name: status, in: query, schema: {type: string, enum: [planned, confirmed, in_progress, completed, cancelled]}}
        - {name: cursor, in: query, schema: {type: string, format: uuid}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        "200":
          description: Một trang lịch gom
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/HtxCollectionSchedule"}}
                  next_cursor: {type: [string, "null"]}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
# @ag-order: 247
  /v1/cropcycle/htx-collection/statements:
    get:
      summary: Bảng kê số cuộn MKG đã gom theo thửa (qua van htx_collection_statement) — RB-6 chiều mua, G3-2
      description: |
        `status`: `pending` = HTX chưa phản hồi revision hiện hành; `confirmed` / `disputed` = phản hồi cho revision hiện hành.
        Quản lý HTX chỉ HTX mình; quản trị toàn tenant.
      operationId: listHtxCollectionStatements
      tags: [cropcycle]
      parameters:
        - {name: cooperative_ref, in: query, schema: {type: string, format: uuid}}
        - {name: status, in: query, schema: {type: string, enum: [pending, confirmed, disputed]}}
        - {name: cursor, in: query, schema: {type: string, format: uuid}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        "200":
          description: Một trang bảng kê
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/HtxCollectionStatement"}}
                  next_cursor: {type: [string, "null"]}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
# @ag-order: 248
  /v1/cropcycle/htx-collection/statements/{ref}:
    get:
      summary: Một bảng kê kèm lịch sử phản hồi của HTX — G3-2
      operationId: getHtxCollectionStatement
      tags: [cropcycle]
      parameters:
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Bảng kê
          content:
            application/json:
              schema:
                type: object
                required: [statement, responses]
                properties:
                  statement: {$ref: "#/components/schemas/HtxCollectionStatement"}
                  responses: {type: array, items: {$ref: "#/components/schemas/HtxCollectionResponse"}}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
# @ag-order: 249
  /v1/cropcycle/htx-collection/statements/{ref}/responses:
    post:
      summary: Quản lý HTX xác nhận hoặc tranh chấp bảng kê — RB-6 chiều mua, G3-2
      description: |
        Chỉ `coop_manager` của đúng HTX. `revision` phải là bản hiện hành (409 `cropcycle.collection_statement_stale`).
        `confirmed`: số HTX = số MKG. `disputed`: bắt buộc `htx_rolls` (≠ số MKG) và `reason` 10–500 ký tự, không chứa SĐT/CCCD.
        Đã có phản hồi cho cùng revision → bắt buộc `reason`; bản mới thay bản trước (sổ chỉ ghi thêm, `supersedes_id`).
        MKG kéo phản hồi về qua `GET /v1/partner/htx-collection/responses` (ADR-0020).
      operationId: respondHtxCollectionStatement
      tags: [cropcycle]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [revision, outcome]
              properties:
                revision: {type: integer, minimum: 1}
                outcome: {type: string, enum: [confirmed, disputed]}
                htx_rolls: {type: [integer, "null"], minimum: 0}
                reason: {type: string, maxLength: 500}
      responses:
        "201":
          description: Đã ghi phản hồi (gọi lặp cùng Idempotency-Key → phản hồi như lần đầu)
          content:
            application/json:
              schema:
                type: object
                required: [response, statement]
                properties:
                  response: {$ref: "#/components/schemas/HtxCollectionResponse"}
                  statement: {$ref: "#/components/schemas/HtxCollectionStatement"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
# @ag-order: 250
  /v1/cropcycle/htx-collection/responses:
    get:
      summary: Bí danh của GET /v1/partner/htx-collection/responses (ADR-0020)
      description: |
        Giữ để tương thích G3-2. Cùng kiểm cấp quyền chia sẻ `htx_collection_responses`, cùng sổ đọc, cùng dữ liệu với
        `GET /v1/partner/htx-collection/responses`. MKG dùng đường của bề mặt đối tác.
      operationId: listHtxCollectionResponseFeed
      tags: [cropcycle]
      parameters:
        - $ref: "#/components/parameters/PartnerGrantor"
        - {name: after, in: query, schema: {type: integer, minimum: 0, default: 0}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 500, default: 200}}
      responses:
        "200":
          description: Một trang luồng
          content:
            application/json:
              schema: {$ref: "#/components/schemas/HtxCollectionResponseFeedPage"}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
  # --- Bề mặt đối tác (ADR-0020, RB-2 / Q-MKG-12): tài khoản dịch vụ tenant BÊN NHẬN (MKG, vai mkg_sync) đọc dữ liệu
  # tối thiểu của tenant BÊN CẤP (tenant chương trình) sau khi kiểm cấp quyền chia sẻ đang hiệu lực; mọi lời gọi ghi sổ
  # pf_party.partner_read_log. Không có cấp quyền / đã thu hồi / hết hạn / loại không được cấp → 403 party.share_grant_missing.
# @ag-order: 85
  /v1/cropcycle/support-requests:
    get:
      summary: Yêu cầu hỗ trợ của nông dân cho quản lý HTX (HTX US-SUPPORT-01) — module chủ HTX (#313)
      description: |
        Vai coop_manager (chỉ HTX của mình = org_ref; hỏi HTX khác → 403 cropcycle.out_of_scope), platform_admin (toàn
        tenant, lọc cooperative_ref được). Mới nhất trước; cursor là next_cursor (id) của trang trước. Không trả toạ độ —
        chỉ trạng thái GPS; ảnh là mã tệp (pf/files). Thay GET /v1/extension/support-requests (gỡ cùng pf/extension).
      operationId: listCoopSupportRequests
      tags: [cropcycle]
      parameters:
        - {name: category, in: query, schema: {type: string, enum: [dich_hai, benh_lua, thoi_tiet, ky_thuat, may_moc, khac]}}
        - {name: urgency, in: query, schema: {type: string, enum: [binh_thuong, khan]}}
        - {name: commune_code, in: query, schema: {type: string}}
        - {name: cooperative_ref, in: query, schema: {type: string, format: uuid}}
        - {name: gps_missing, in: query, schema: {type: boolean}, description: "true = chỉ yêu cầu thiếu vị trí GPS"}
        - {name: cursor, in: query, schema: {type: string, format: uuid}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        "200":
          description: Một trang, mới nhất trước
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/CoopSupportRequest"}}
                  next_cursor: {type: [string, "null"]}
        "403": {description: "forbidden | cropcycle.out_of_scope", $ref: "#/components/responses/Problem"}
        "422": {description: "validation_failed", $ref: "#/components/responses/Problem"}
# @ag-order: 207
  /v1/support-requests:
    get:
      summary: Yêu cầu hỗ trợ của (các) nông hộ của nông dân (HTX US-SUPPORT-01) — module chủ HTX (#313)
      operationId: listMySupportRequests
      tags: [cropcycle]
      parameters:
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        "200":
          description: Mới nhất trước
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/SupportRequest"}}
                  next_cursor: {type: [string, "null"]}
        "403": {description: "forbidden | cropcycle.farmer_household_required", $ref: "#/components/responses/Problem"}
    post:
      summary: Nông dân gửi yêu cầu hỗ trợ (HTX US-SUPPORT-01) — module chủ HTX, phát pf.cooperative.support_request.submitted
      description: |
        Vai farmer. Quản lý HTX xem qua GET /v1/cropcycle/support-requests; log GPS ghi sau commit (consumer pf.cropcycle.gps_log).
        Từ #313 không còn tự sinh nhiệm vụ khuyến nông. Thiếu vị trí GPS vẫn nhận (nhãn "Thiếu vị trí GPS").
        Ngoại tuyến: gửi qua pf/sync entity support_request (cùng payload).
      operationId: submitSupportRequest
      tags: [cropcycle]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SupportRequestInput"}
      responses:
        "201":
          description: Đã nhận
          content:
            application/json:
              schema:
                type: object
                properties:
                  support_request: {$ref: "#/components/schemas/SupportRequest"}
                  replayed: {type: boolean}
        "403": {description: "forbidden | cropcycle.farmer_household_required", $ref: "#/components/responses/Problem"}
        "409": {description: "cropcycle.id_reused", $ref: "#/components/responses/Problem"}
        "422": {description: "validation_failed (\"Vui lòng nhập mô tả và chọn loại sự cố trước khi gửi.\", tối đa 5 ảnh) | cropcycle.household_invalid | cropcycle.household_no_cooperative", $ref: "#/components/responses/Problem"}
        "503": {description: "cropcycle.dependency_unavailable", $ref: "#/components/responses/Problem"}
  # --- hết G2 ---

  # --- pf/simulation ---
components:
  schemas:
# @ag-order: 517
    HtxCollectionSchedule:
      type: object
      description: Lịch gom rơm MKG của một HTX (van collection_schedule) — chỉ khung thời gian và trạng thái.
      required: [schedule_ref, cooperative_ref, commune_code, window_from, window_to, status, revision, published_at, updated_at]
      properties:
        schedule_ref: {type: string, format: uuid}
        cooperative_ref: {type: string, format: uuid}
        commune_code: {type: string}
        window_from: {type: string, format: date}
        window_to: {type: string, format: date}
        status: {type: string, enum: [planned, confirmed, in_progress, completed, cancelled]}
        revision: {type: integer}
        published_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
# @ag-order: 518
    HtxCollectionResponse:
      type: object
      required: [id, revision, outcome, htx_rolls, reason, responded_at]
      properties:
        id: {type: string, format: uuid}
        revision: {type: integer}
        outcome: {type: string, enum: [confirmed, disputed]}
        htx_rolls: {type: integer}
        reason: {type: [string, "null"]}
        responded_at: {type: string, format: date-time}
        supersedes_id: {type: [string, "null"], format: uuid}
# @ag-order: 519
    HtxCollectionStatement:
      type: object
      description: Bảng kê số cuộn MKG đã gom trên một thửa (van htx_collection_statement) kèm phản hồi hiện hành của HTX.
      required: [statement_ref, cooperative_ref, plot_ref, plot_code, season_ref, collected_on, rolls, revision, pending, response, published_at, updated_at]
      properties:
        statement_ref: {type: string, format: uuid}
        cooperative_ref: {type: string, format: uuid}
        plot_ref: {type: string, format: uuid}
        plot_code: {type: [string, "null"]}
        season_ref: {type: [string, "null"], format: uuid}
        collected_on: {type: string, format: date}
        rolls: {type: integer}
        revision: {type: integer}
        pending: {type: boolean, description: HTX chưa phản hồi revision hiện hành}
        response:
          oneOf:
            - {$ref: "#/components/schemas/HtxCollectionResponse"}
            - {type: "null"}
        published_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    # --- pf/metrics ---
# @ag-order: 730
    SupportRequestInput:
      type: object
      required: [category, description]
      properties:
        id: {type: string, format: uuid, description: "UUIDv7 sinh trên máy (tùy chọn)"}
        household_ref: {type: [string, "null"], format: uuid, description: "Bỏ trống khi tài khoản chỉ có một nông hộ"}
        plot_ref: {type: [string, "null"], format: uuid}
        category: {type: string, enum: [dich_hai, benh_lua, thoi_tiet, ky_thuat, may_moc, khac]}
        urgency: {type: string, enum: [binh_thuong, khan], default: binh_thuong}
        description: {type: string, minLength: 10, maxLength: 2000, description: "Không chứa SĐT/CCCD"}
        photo_refs: {type: array, maxItems: 5, items: {type: string, format: uuid}}
        location:
          type: [object, "null"]
          properties:
            lat: {type: [string, number]}
            lon: {type: [string, number]}
        gps_accuracy_m: {type: [string, number, "null"]}
# @ag-order: 731
    SupportRequest:
      type: object
      properties:
        id: {type: string, format: uuid}
        household_ref: {type: string, format: uuid}
        plot_ref: {type: [string, "null"], format: uuid}
        category: {type: string}
        urgency: {type: string}
        description: {type: string}
        photo_refs: {type: array, items: {type: string, format: uuid}}
        gps_missing: {type: boolean}
        labels: {type: array, items: {type: string}, description: "vd \"Thiếu vị trí GPS\""}
        event_time: {type: string, format: date-time}
        received_at: {type: string, format: date-time}
        task_status: {type: [string, "null"], enum: [new, assigned, accepted, in_progress, resolved, null], description: "Chỉ yêu cầu chép từ pf/extension (#313): trạng thái nhiệm vụ khuyến nông lúc chép; null với yêu cầu mới"}
# @ag-order: 732
    CoopSupportRequest:
      type: object
      description: Yêu cầu hỗ trợ trong danh sách của quản lý HTX (không có toạ độ, không PII) — #313.
      required: [id, household_ref, plot_ref, cooperative_ref, commune_code, province_code, category, urgency, description,
        photo_refs, photo_count, gps_missing, gps_accuracy_m, labels, event_time, received_at, legacy_task_status]
      properties:
        id: {type: string, format: uuid}
        household_ref: {type: string, format: uuid}
        plot_ref: {type: [string, "null"], format: uuid}
        cooperative_ref: {type: string, format: uuid}
        commune_code: {type: string}
        province_code: {type: string}
        category: {type: string, enum: [dich_hai, benh_lua, thoi_tiet, ky_thuat, may_moc, khac]}
        urgency: {type: string, enum: [binh_thuong, khan]}
        description: {type: string}
        photo_refs: {type: array, maxItems: 5, items: {type: string, format: uuid}, description: "Mã tệp ảnh (tải qua pf/files)"}
        photo_count: {type: integer, minimum: 0, maximum: 5}
        gps_missing: {type: boolean}
        gps_accuracy_m: {type: [string, "null"], description: "Độ chính xác GPS (m, decimal)"}
        labels: {type: array, items: {type: string}, description: "vd \"Thiếu vị trí GPS\""}
        event_time: {type: string, format: date-time, description: "Lúc bấm Gửi trên máy"}
        received_at: {type: string, format: date-time, description: "Lúc máy chủ nhận"}
        legacy_task_status: {type: [string, "null"], enum: [new, assigned, accepted, in_progress, resolved, null], description: "Chỉ yêu cầu chép từ pf/extension: trạng thái nhiệm vụ khuyến nông lúc chép"}
    # --- pf/simulation ---

