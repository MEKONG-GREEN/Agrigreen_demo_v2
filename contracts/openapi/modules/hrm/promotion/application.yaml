          type: array
          minItems: 1
          maxItems: 500
          items:
            type: object
            additionalProperties: false
            properties:
              case_key: {type: string, description: "Kỳ trong danh sách đã xuất"}
              staff_id: {type: string, format: uuid, description: "Nhập quyết định đã ban hành"}
              effective_on: {type: string, format: date, description: "Ngày hưởng (vắng → ngày đến kỳ của danh sách)"}
              to_step: {type: integer, minimum: 1, maximum: 99}
              pct_to: {type: string, description: "TNVK: % sau quyết định"}
# @ag-order: 1260
    HrmDecision:
      type: object
      required: [id, decision_no, decided_on, issuer, kind, export_id, source, count, doc_id, status, cancel_reason, recorded_at, actor, people]
      properties:
        id: {type: string, format: uuid}
        decision_no: {type: string}
