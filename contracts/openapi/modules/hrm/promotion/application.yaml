paths:
# @ag-order: 1200
  /v1/hrm/promotion:
    get:
      summary: Danh sách nâng lương thường xuyên từ hồ sơ hiện hành (FN-09 v4.0). Lọc ngày đến kỳ theo bất kỳ năm, tháng; ba trạng thái. Cấp Tỉnh – HCTH, Admin
      operationId: hrmPromotionList
      tags: [hrm]
      parameters:
        - {name: year, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 9999}}
        - {name: month, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 12}}
        - {name: status, in: query, required: false, schema: {$ref: "#/components/schemas/HrmPromoStatus"}}
        - {name: unit, in: query, required: false, schema: {type: string}}
        - {name: q, in: query, required: false, description: Họ tên, schema: {type: string}}
      responses:
        "200":
          description: Danh sách (Cache-Control no-store — có họ tên)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/HrmPromotionList"}
        "403": {description: forbidden | hrm.records_disabled, $ref: "#/components/responses/Problem"}
        "422": {description: validation_failed, $ref: "#/components/responses/Problem"}
# @ag-order: 1201
  /v1/hrm/promotion/cases/{key}:
    get:
      summary: Chi tiết kỳ thường xuyên — căn cứ NB-06, NB-07 và lịch sử xử lý (FN-09 B3)
      operationId: hrmPromotionCase
      tags: [hrm]
      parameters:
        - {name: key, in: path, required: true, description: "Khóa kỳ '<staff_id>:nltx:<khóa>'", schema: {type: string}}
      responses:
        "200":
          description: Chi tiết
          content:
            application/json:
              schema: {$ref: "#/components/schemas/HrmPromoCaseDetail"}
        "403": {description: forbidden | hrm.records_disabled, $ref: "#/components/responses/Problem"}
        "404": {description: hrm.promotion_case_not_found, $ref: "#/components/responses/Problem"}
# @ag-order: 1207
  /v1/hrm/promotion/exports:
    get:
      summary: File đã xuất (FN-09 luồng phụ; AC-04) — mới trước, có ngày và người xuất, quyết định đã lập từ danh sách (không PII)
      operationId: hrmPromotionExports
      tags: [hrm]
      parameters:
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 200}}
      responses:
        "200":
          description: Lịch sử xuất
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/HrmPromoExportSummary"}}
        "403": {description: forbidden | hrm.records_disabled, $ref: "#/components/responses/Problem"}
    post:
      summary: Xuất Mẫu số 1 (NL02) cho người được chọn; chuyển Chờ quyết định. Trả tóm tắt không PII, tải file riêng; dữ liệu cũ vẫn tải lại nguyên bố cục.
      operationId: hrmPromotionExport
      tags: [hrm]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/HrmPromoExportInput"}
      responses:
        "201":
          description: Các tệp đã xuất
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/HrmPromoExported"}}
        "403": {description: forbidden, $ref: "#/components/responses/Problem"}
        "404": {description: hrm.promotion_case_not_found, $ref: "#/components/responses/Problem"}
        "409": {description: hrm.promotion_conflict, $ref: "#/components/responses/Problem"}
        "422": {description: hrm.promotion_export_blocked | validation_failed, $ref: "#/components/responses/Problem"}
# @ag-order: 1208
  /v1/hrm/promotion/exports/{id}:
    get:
      summary: Một lần xuất kèm họ tên và trạng thái từng kỳ — nguồn của khung "Thêm quyết định từ danh sách" (FN-10 B2, B3)
      operationId: hrmPromotionExportGet
      tags: [hrm]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Lần xuất (Cache-Control no-store)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/HrmPromoExportDetail"}
        "403": {description: forbidden | hrm.records_disabled, $ref: "#/components/responses/Problem"}
        "404": {description: hrm.promotion_export_not_found, $ref: "#/components/responses/Problem"}
# @ag-order: 1209
  /v1/hrm/promotion/exports/{id}/file:
    get:
      summary: Tải lại tệp Excel của một lần xuất — dựng lại từ dòng đã lưu + định danh hiện hành, so SHA-256 (X-Export-Drift); ghi sổ download + nhật ký hồ sơ
      operationId: hrmPromotionExportFile
      tags: [hrm]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Tệp .xlsx (Cache-Control no-store)
          headers:
            X-Export-Drift: {schema: {type: string, enum: ["true", "false"]}}
            X-Export-Sha256: {schema: {type: string}}
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: {type: string, format: binary}
        "403": {description: forbidden | hrm.records_disabled, $ref: "#/components/responses/Problem"}
        "404": {description: hrm.promotion_export_not_found, $ref: "#/components/responses/Problem"}
# @ag-order: 1210
  /v1/hrm/promotion/decisions:
    get:
      summary: Sổ quyết định nâng bậc (FN-10 B1) — lọc năm, loại, cơ quan ban hành; q tìm theo số quyết định hoặc tên viên chức (AC-02)
      operationId: hrmDecisionList
      tags: [hrm]
      parameters:
        - {name: year, in: query, required: false, schema: {type: integer, minimum: 1975, maximum: 2100}}
        - {name: kind, in: query, required: false, schema: {$ref: "#/components/schemas/HrmPromoKind"}}
        - {name: issuer, in: query, required: false, schema: {type: string}}
        - {name: q, in: query, required: false, schema: {type: string}}
      responses:
        "200":
          description: Sổ (Cache-Control no-store — có họ tên)
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/HrmDecision"}}
        "403": {description: forbidden | hrm.records_disabled, $ref: "#/components/responses/Problem"}
    post:
      summary: Lưu quyết định (FN-10 B2–B4) — từ danh sách đã xuất (export_id + người có tên) hoặc nhập quyết định đã ban hành (kind + staff_id, bậc/% sau quyết định, ngày hưởng). Cập nhật bậc, hệ số trong hồ sơ CÙNG giao dịch; chỉ cập nhật người có tên, người không có tên giữ trạng thái. Số trùng → 409 hrm.decision_warnings trừ khi acknowledge_warnings
      operationId: hrmDecisionCreate
      tags: [hrm]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/HrmDecisionInput"}
      responses:
        "201":
          description: Đã lưu
          content:
            application/json:
              schema:
                type: object
                required: [id, updated, returned, warnings]
                properties:
                  id: {type: string, format: uuid}
                  updated: {type: integer, description: "Số hồ sơ được ghi bậc mới"}
                  returned: {type: integer, description: "Số người không có tên trong quyết định"}
                  warnings: {type: array, items: {type: string}}
        "403": {description: forbidden, $ref: "#/components/responses/Problem"}
        "404": {description: hrm.promotion_export_not_found, $ref: "#/components/responses/Problem"}
        "409": {description: hrm.decision_warnings | hrm.decision_stale | hrm.promotion_conflict, $ref: "#/components/responses/Problem"}
        "422": {description: hrm.step_out_of_range | validation_failed, $ref: "#/components/responses/Problem"}
# @ag-order: 1211
  /v1/hrm/promotion/decision-book:
    get:
      summary: Xuất sổ quyết định ra Excel (FN-10 luồng phụ; AC-03) — số, ngày, cơ quan, loại, danh sách gốc, số người, tệp, trạng thái (không PII)
      operationId: hrmDecisionBook
      tags: [hrm]
      parameters:
        - {name: year, in: query, required: false, schema: {type: integer, minimum: 1975, maximum: 2100}}
        - {name: kind, in: query, required: false, schema: {$ref: "#/components/schemas/HrmPromoKind"}}
        - {name: issuer, in: query, required: false, schema: {type: string}}
        - {name: q, in: query, required: false, schema: {type: string}}
      responses:
        "200":
          description: Tệp .xlsx
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: {type: string, format: binary}
        "403": {description: forbidden | hrm.records_disabled, $ref: "#/components/responses/Problem"}
# @ag-order: 1212
  /v1/hrm/promotion/decisions/{id}:
    get:
      summary: Chi tiết quyết định (FN-10 Hình 20) — người có tên, bậc/hệ số cũ → mới, ngày hưởng, tệp, lịch sử dòng sổ
      operationId: hrmDecisionGet
      tags: [hrm]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Quyết định (Cache-Control no-store)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/HrmDecision"}
        "403": {description: forbidden | hrm.records_disabled, $ref: "#/components/responses/Problem"}
        "404": {description: hrm.decision_not_found, $ref: "#/components/responses/Problem"}
# @ag-order: 1213
  /v1/hrm/promotion/decisions/{id}/cancel:
    post:
      summary: Hủy quyết định (BR-03) — SỰ KIỆN BÙ, không xóa; lý do 10–500 ký tự; khôi phục bậc, hệ số trước đó; kỳ về "Đã xuất danh sách"; có quyết định sau cho cùng người → 409 hrm.decision_cancel_order
      operationId: hrmDecisionCancel
      tags: [hrm]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: {type: string, minLength: 10, maxLength: 500}
      responses:
        "200":
          description: Đã hủy
          content:
            application/json:
              schema:
                type: object
                required: [id, status]
                properties:
                  id: {type: string, format: uuid}
                  status: {type: string, enum: [cancelled]}
        "403": {description: forbidden, $ref: "#/components/responses/Problem"}
        "404": {description: hrm.decision_not_found, $ref: "#/components/responses/Problem"}
        "409": {description: hrm.decision_cancelled | hrm.decision_cancel_order, $ref: "#/components/responses/Problem"}
        "422": {description: validation_failed, $ref: "#/components/responses/Problem"}
# @ag-order: 1214
  /v1/hrm/promotion/decisions/{id}/file:
    post:
      summary: Đính kèm tệp quyết định — lưu vào Kho tài liệu nhân sự (FN-14, thư mục hệ thống "Quyết định nâng bậc", gắn người có tên, số, ngày quyết định)
      operationId: hrmDecisionFile
      tags: [hrm]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary}
      responses:
        "201":
          description: Đã lưu tệp
          content:
            application/json:
              schema:
                type: object
                required: [doc_id]
                properties:
                  doc_id: {type: string, format: uuid}
        "403": {description: forbidden, $ref: "#/components/responses/Problem"}
        "404": {description: hrm.decision_not_found, $ref: "#/components/responses/Problem"}
        "409": {description: hrm.decision_cancelled, $ref: "#/components/responses/Problem"}
        "413": {description: hrm.doc_too_large, $ref: "#/components/responses/Problem"}
        "503": {description: hrm.docs_unavailable, $ref: "#/components/responses/Problem"}
# @ag-order: 1215
  /v1/hrm/staff/{id}/ratings:
    get:
      summary: Lịch sử xếp loại năm của hồ sơ (FN-18; không dùng để xét điều kiện FN-09) — mọi dòng sổ, cũ trước
      operationId: hrmRatingList
      tags: [hrm]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Xếp loại
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/HrmAnnualRating"}}
        "403": {description: forbidden | hrm.records_disabled, $ref: "#/components/responses/Problem"}
        "404": {description: hrm.staff_not_found, $ref: "#/components/responses/Problem"}
    post:
      summary: Ghi xếp loại năm (nguồn chuyển đổi ban đầu hoặc nhập tay; FN-18 W11.26 ghi nguồn evaluation) — năm đã có → thay, cần lý do ≥ 10 ký tự; rating rỗng = hủy
      operationId: hrmRatingSet
      tags: [hrm]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [year, rating]
              properties:
                year: {type: integer, minimum: 1990, maximum: 2100}
                rating: {type: string, enum: ["", HTXSNV, HTTNV, HTNV, KHTNV]}
                source: {type: string, enum: [manual, conversion]}
                reason: {type: string, maxLength: 500}
      responses:
        "201":
          description: Đã ghi
          content:
            application/json:
              schema: {$ref: "#/components/schemas/HrmAnnualRating"}
        "403": {description: forbidden, $ref: "#/components/responses/Problem"}
        "404": {description: hrm.staff_not_found, $ref: "#/components/responses/Problem"}
        "422": {description: validation_failed, $ref: "#/components/responses/Problem"}
components:
  schemas:
# @ag-order: 1240
    HrmPromoKind:
      type: string
      enum: [nltx, nlth, tnvk]
      description: "nltx — thường xuyên (Mẫu số 1); nlth — trước thời hạn (Mẫu số 2); tnvk — thâm niên vượt khung (Mẫu số 4)"
# @ag-order: 1241
    HrmPromoStatus:
      type: string
      enum: [pending, exported, decided]
      description: "Chưa xử lý | Chờ quyết định | Đã có quyết định"
# @ag-order: 1242
    HrmPromoCond:
      type: string
      enum: [ok, review, fail]
      description: "Đủ | Cần xem xét | Chưa đủ"
# @ag-order: 1243
    HrmPromoBasis:
      type: object
      required: [label, value, result, note]
      properties:
        label: {type: string}
        value: {type: string}
        result: {$ref: "#/components/schemas/HrmPromoCond"}
        note: {type: string}
# @ag-order: 1244
    HrmPromoAward:
      type: object
      required: [event_id, form, label, year, months, used]
      properties:
        event_id: {type: string, format: uuid}
        form: {type: string}
        label: {type: string, description: "Nhãn thành tích (NL03-05)"}
        year: {type: integer}
        months: {type: integer, description: "Số tháng quy đổi (0 = không thuộc bảng quy đổi)"}
        used: {type: boolean}
# @ag-order: 1245
    HrmPromoCase:
      type: object
      required: [key, staff_id, code, name, unit, unit_name, kind, form, due, grade, grade_name, steps, from_step, to_step, from_coeff, to_coeff,
        diff, step_since, reserved, next_due, normal_due, early_months, pct_from, pct_to, pct_since, cond, why, basis, planned_year, blocked,
        status, reason, note, months_enjoyed, decision_id, decision_no, award]
      properties:
        key: {type: string}
        staff_id: {type: string, format: uuid}
        code: {type: string}
        name: {type: string, description: "Họ tên (rỗng khi người gọi không có vai kho)"}
        unit: {type: string}
        unit_name: {type: string}
        kind: {$ref: "#/components/schemas/HrmPromoKind"}
        form: {type: string, enum: [mau1, mau2, mau4]}
        due: {type: string, format: date, description: "Ngày đến kỳ (NLTH: ngày nâng trước hạn; đã có quyết định: ngày hưởng)"}
        grade: {type: string}
        grade_name: {type: string}
        steps: {type: integer}
        from_step: {type: integer}
        to_step: {type: integer}
        from_coeff: {type: string}
        to_coeff: {type: string}
        diff: {type: string, description: "Hệ số chênh lệch (NL02-12, NL04-07)"}
        promotion_months: {type: integer, minimum: 0, maximum: 120, description: NB-07 theo từng người; 0 khi chưa khai báo trong hồ sơ cũ}
        step_since: {type: [string, "null"], format: date}
        reserved: {type: string}
        next_due: {type: [string, "null"], format: date}
        normal_due: {type: [string, "null"], format: date}
        early_months: {type: integer}
        pct_from: {type: [string, "null"]}
        pct_to: {type: [string, "null"]}
        pct_since: {type: [string, "null"], format: date}
        cond: {$ref: "#/components/schemas/HrmPromoCond"}
        why: {type: array, items: {type: string}}
        basis: {type: array, items: {$ref: "#/components/schemas/HrmPromoBasis"}}
        planned_year: {type: integer, description: "NLTH: năm dự kiến khi ngày nâng ngoài năm chỉ tiêu (0 = trong năm)"}
        blocked: {type: array, items: {type: string}, description: "NLTH: lý do chặn xuất Mẫu số 2"}
        status: {$ref: "#/components/schemas/HrmPromoStatus"}
        reason: {type: string, description: "Lý do đưa người chưa đủ vào danh sách"}
        note: {type: string, description: "Ghi chú trả về (không có tên trong quyết định)"}
        months_enjoyed: {type: string, description: "Số tháng được hưởng gợi ý (1 | 0.5)"}
        decision_id: {type: [string, "null"], format: uuid}
        decision_no: {type: string}
        award: {oneOf: [{$ref: "#/components/schemas/HrmPromoAward"}, {type: "null"}]}
# @ag-order: 1246
    HrmPromoEvent:
      type: object
      required: [id, action, due_on, export_id, decision_id, reason, actor, recorded_at]
      properties:
        id: {type: string, format: uuid}
        action: {type: string, enum: [include, exclude, propose, withdraw, export, decide, undecide, return]}
        due_on: {type: [string, "null"], format: date}
        export_id: {type: [string, "null"], format: uuid}
        decision_id: {type: [string, "null"], format: uuid}
        reason: {type: string}
        actor: {type: string, format: uuid}
        recorded_at: {type: string, format: date-time}
# @ag-order: 1247
    HrmAnnualRating:
      type: object
      required: [id, year, rating, source, void, supersedes_id, reason, actor, recorded_at]
      properties:
        id: {type: string, format: uuid}
        year: {type: integer}
        rating: {type: string}
        source: {type: string, enum: [conversion, manual, evaluation]}
        void: {type: boolean}
        supersedes_id: {type: [string, "null"], format: uuid}
        reason: {type: string}
        actor: {type: string, format: uuid}
        recorded_at: {type: string, format: date-time}
# @ag-order: 1248
    HrmPromoCaseDetail:
      allOf:
        - $ref: "#/components/schemas/HrmPromoCase"
        - type: object
          required: [history]
          properties:
            history: {type: array, items: {$ref: "#/components/schemas/HrmPromoEvent"}}
# @ag-order: 1250
    HrmPromotionList:
      type: object
      required: [as_of, items, missing]
      properties:
        as_of: {type: string, format: date, description: Ngày mở màn; không có ngày chốt số liệu}
        items: {type: array, items: {$ref: "#/components/schemas/HrmPromoCase"}}
        missing: {type: array, items: {$ref: "#/components/schemas/HrmPersonBrief"}, description: Viên chức chưa tính được kỳ; cảnh báo tên khi thiếu NB-06 hoặc NB-07}
# @ag-order: 1254
    HrmPromoExportInput:
      type: object
      additionalProperties: false
      required: [keys, review_month]
      properties:
        keys: {type: array, minItems: 1, maxItems: 500, items: {type: string}}
        review_month: {type: string, pattern: "^[0-9]{4}-[0-9]{2}$", description: "Tháng xét YYYY-MM"}
        preparer_id: {type: [string, "null"], format: uuid, description: "Người lập — mã hồ sơ"}
        signer_title: {type: string, enum: ["Giám đốc", "Phó Giám đốc"]}
        reserved: {type: object, additionalProperties: {type: string}, description: "Khóa kỳ → HS bảo lưu hiện có nhập khi lập danh sách, 0–100, tối đa 2 chữ số thập phân"}
        months: {type: object, additionalProperties: {type: string}, description: "Khóa kỳ → số tháng được hưởng (NL02-13, NL04-08)"}
        notes: {type: object, additionalProperties: {type: string}, description: "Khóa kỳ → ghi chú"}
        reserved_after: {type: object, additionalProperties: {type: string}, description: "Khóa kỳ → HS chênh lệch bảo lưu sau nâng (NL02-11)"}
# @ag-order: 1255
    HrmPromoExported:
      type: object
