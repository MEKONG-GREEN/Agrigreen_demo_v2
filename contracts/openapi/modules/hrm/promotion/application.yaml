        export_id: {type: [string, "null"], format: uuid}
        source: {type: string, description: "Danh sách gốc (tên tệp đã xuất) hoặc 'Nhập từ quyết định đã ban hành'"}
        count: {type: integer}
        doc_id: {type: [string, "null"], format: uuid, description: "Tệp ở Kho tài liệu nhân sự"}
        status: {type: string, enum: [applied, cancelled]}
        cancel_reason: {type: [string, "null"]}
        recorded_at: {type: string, format: date-time}
        actor: {type: string, format: uuid}
        people:
          type: array
          items:
            type: object
            required: [staff_id, name, case_key, effective_on, grade, from_step, to_step, from_coeff, to_coeff, pct_from, pct_to]
            properties:
              staff_id: {type: string, format: uuid}
              name: {type: string}
              case_key: {type: string}
              effective_on: {type: string, format: date}
              grade: {type: string}
              from_step: {type: integer}
              to_step: {type: integer}
              from_coeff: {type: string}
              to_coeff: {type: string}
              pct_from: {type: string}
              pct_to: {type: string}
        history:
          type: array
          items:
            type: object
            required: [id, action, doc_id, reason, actor, recorded_at]
            properties:
              id: {type: string, format: uuid}
              action: {type: string, enum: [issue, attach, cancel]}
              doc_id: {type: [string, "null"], format: uuid}
              reason: {type: string}
              actor: {type: string, format: uuid}
              recorded_at: {type: string, format: date-time}
