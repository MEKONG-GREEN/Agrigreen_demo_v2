# @ag-order: 1259
    HrmDecisionInput:
      type: object
      additionalProperties: false
      required: [decision_no, decided_on, issuer, people]
      properties:
        export_id: {type: [string, "null"], format: uuid, description: "Danh sách đã xuất (vắng = nhập quyết định đã ban hành)"}
        kind: {$ref: "#/components/schemas/HrmPromoKind"}
