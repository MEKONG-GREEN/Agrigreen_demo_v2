    parameters:
      - $ref: "#/components/parameters/HrmPlanYear"
      - $ref: "#/components/parameters/HrmPlanUnit"
    post:
      summary: Gửi kế hoạch cho Phòng HCTH (bài nộp cap/forms; số hiện có, dự kiến nghỉ hưu do máy chủ điền — BR-01; gửi sau hạn = Trễ hạn)
      operationId: hrmPlanSubmit
