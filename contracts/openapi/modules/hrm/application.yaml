        - {name: folder, in: query, required: false, schema: {type: string, format: uuid}}
        - {name: recursive, in: query, required: false, schema: {type: string, enum: ["0", "1"]}}
        - {name: q, in: query, required: false, schema: {type: string}}
        - {name: doc_type, in: query, required: false, schema: {$ref: "#/components/schemas/HrmDocType"}}
        - {name: year, in: query, required: false, schema: {type: integer}}
        - {name: unit, in: query, required: false, description: Phòng ban (đơn vị nội bộ), schema: {type: string}}
        - {name: staff, in: query, required: false, description: "Mã hồ sơ nhân sự (cần hồ sơ bật)", schema: {type: string, format: uuid}}
        - {name: include_hidden, in: query, required: false, description: "1 = kèm tài liệu đã ẩn (người quản lý)", schema: {type: string, enum: ["0", "1"]}}
        - {name: offset, in: query, required: false, schema: {type: integer, minimum: 0}}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        "200":
          description: Một trang
          content:
            application/json:
              schema:
                type: object
                required: [total, items]
                properties:
                  total: {type: integer, minimum: 0}
                  items: {type: array, items: {$ref: "#/components/schemas/HrmDoc"}}
        "403": {description: "forbidden | hrm.records_disabled (lọc theo nhân viên khi hồ sơ tắt)", $ref: "#/components/responses/Problem"}
        "404": {description: hrm.folder_not_found, $ref: "#/components/responses/Problem"}
    post:
      summary: Tải lên một tệp với phân loại (FN-14 B3) — pdf, jpg, png, docx, xlsx, doc, xls; tối đa 15 MB; mã hóa và lưu qua pf/evidence
      operationId: hrmDocUpload
      tags: [hrm]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [meta, file]
              properties:
                meta: {type: string, description: "JSON của HrmDocInput (phần văn bản)"}
                file: {type: string, format: binary}
      responses:
        "201":
          description: Đã tải lên
          content:
            application/json:
              schema: {$ref: "#/components/schemas/HrmDocWrite"}
        "403": {description: "forbidden | hrm.records_disabled (gắn nhân viên khi hồ sơ tắt)", $ref: "#/components/responses/Problem"}
        "404": {description: hrm.folder_not_found, $ref: "#/components/responses/Problem"}
        "413": {description: hrm.doc_too_large, $ref: "#/components/responses/Problem"}
        "422": {description: hrm.doc_format | validation_failed, $ref: "#/components/responses/Problem"}
        "503": {description: hrm.docs_unavailable, $ref: "#/components/responses/Problem"}
