paths:
# @ag-order: 354
  /v1/hrm/status:
    get:
      summary: Tình trạng danh mục nhân sự — số mục đang dùng theo loại, bảng hệ số và tham số có hiệu lực hôm nay, số mục còn là dữ liệu mẫu (Q-070)
      operationId: hrmStatus
      tags: [hrm]
      responses:
        "200":
          description: Tình trạng
          content:
            application/json:
              schema: {$ref: "#/components/schemas/HrmStatus"}
        "401": {description: unauthenticated, $ref: "#/components/responses/Problem"}
        "403": {description: forbidden, $ref: "#/components/responses/Problem"}
# @ag-order: 355
  /v1/hrm/defaults:
    post:
      summary: Cài danh mục, bảng hệ số và tham số mặc định (BRD + dữ liệu mẫu đánh dấu placeholder) — chỉ mã/ngạch/khóa chưa có; Admin
      operationId: hrmInstallDefaults
      tags: [hrm]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "201":
          description: Số phiên bản đã ghi (0 khi mọi mục đã có)
          content:
            application/json:
              schema:
                type: object
                required: [items, scales, rules]
                properties:
                  items: {type: integer, minimum: 0}
                  scales: {type: integer, minimum: 0}
                  rules: {type: integer, minimum: 0}
        "403": {description: forbidden, $ref: "#/components/responses/Problem"}
        "409": {description: conflict, $ref: "#/components/responses/Problem"}
# @ag-order: 356
  /v1/hrm/catalogs/{kind}:
    parameters:
      - $ref: "#/components/parameters/HrmKind"
    get:
      summary: Mục hiện hành (phiên bản mới nhất) của một danh mục nhân sự, sắp theo thứ tự rồi mã
      operationId: hrmCatalogList
      tags: [hrm]
      parameters:
        - {name: include_retired, in: query, required: false, description: "true → cả mục đã ngừng sử dụng", schema: {type: boolean}}
      responses:
        "200":
          description: Danh mục
          content:
            application/json:
              schema:
                type: object
                required: [kind, items]
                properties:
                  kind: {type: string}
                  items: {type: array, items: {$ref: "#/components/schemas/HrmCatalogItem"}}
        "403": {description: forbidden, $ref: "#/components/responses/Problem"}
        "404": {description: hrm.kind_unknown, $ref: "#/components/responses/Problem"}
    post:
      summary: Thêm mục (mã được chuẩn hóa — bỏ khoảng trắng, xuống dòng; AC-03); mã đã có → chặn; Admin
      operationId: hrmCatalogCreate
      tags: [hrm]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/HrmCatalogItemInput"}
      responses:
        "201":
          description: Đã ghi phiên bản 1
          content:
            application/json:
              schema: {$ref: "#/components/schemas/HrmWriteResult"}
        "403": {description: forbidden, $ref: "#/components/responses/Problem"}
        "404": {description: hrm.kind_unknown, $ref: "#/components/responses/Problem"}
        "409": {description: hrm.item_exists, $ref: "#/components/responses/Problem"}
        "422": {description: validation_failed | hrm.item_reference, $ref: "#/components/responses/Problem"}
# @ag-order: 357
  /v1/hrm/catalogs/{kind}/{code}/history:
    parameters:
      - $ref: "#/components/parameters/HrmKind"
      - {name: code, in: path, required: true, schema: {type: string}}
    get:
      summary: Mọi phiên bản của một mục (cũ trước)
      operationId: hrmCatalogHistory
      tags: [hrm]
      responses:
        "200":
          description: Lịch sử
          content:
            application/json:
              schema:
                type: object
                required: [versions]
                properties:
                  versions: {type: array, items: {$ref: "#/components/schemas/HrmCatalogItem"}}
        "403": {description: forbidden, $ref: "#/components/responses/Problem"}
        "404": {description: hrm.kind_unknown | hrm.item_not_found, $ref: "#/components/responses/Problem"}
# @ag-order: 358
  /v1/hrm/catalogs/{kind}/{code}/revise:
    parameters:
      - $ref: "#/components/parameters/HrmKind"
      - {name: code, in: path, required: true, schema: {type: string}}
    post:
      summary: Ghi phiên bản mới của mục (sửa tên, thứ tự, thuộc tính; active=false → ngừng sử dụng, true → dùng lại); không đổi mã; Admin
      operationId: hrmCatalogRevise
      tags: [hrm]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/HrmCatalogItemInput"}
      responses:
        "201":
          description: Đã ghi phiên bản mới
          content:
            application/json:
              schema: {$ref: "#/components/schemas/HrmWriteResult"}
        "403": {description: forbidden, $ref: "#/components/responses/Problem"}
        "404": {description: hrm.kind_unknown | hrm.item_not_found, $ref: "#/components/responses/Problem"}
        "409": {description: conflict, $ref: "#/components/responses/Problem"}
        "422": {description: validation_failed | hrm.item_reference, $ref: "#/components/responses/Problem"}
# @ag-order: 359
  /v1/hrm/grade-scales:
    get:
      summary: Ngạch/CDNN đang dùng kèm bảng hệ số có hiệu lực tại một ngày (valid_from lớn nhất ≤ ngày; cùng ngày lấy bản ghi sau)
      operationId: hrmGradeScales
      tags: [hrm]
      parameters:
        - {name: at, in: query, required: false, description: "Ngày YYYY-MM-DD (vắng → hôm nay, giờ VN)", schema: {type: string, format: date}}
      responses:
        "200":
          description: Bảng hệ số
          content:
            application/json:
              schema:
                type: object
                required: [day, grades]
                properties:
                  day: {type: string, format: date}
                  grades:
                    type: array
                    items:
                      type: object
                      required: [grade, scale]
                      properties:
                        grade: {$ref: "#/components/schemas/HrmCatalogItem"}
                        scale:
                          description: null nếu ngạch chưa có bảng hệ số hiệu lực tại ngày hỏi
                          oneOf:
                            - {$ref: "#/components/schemas/HrmGradeScale"}
                            - {type: "null"}
        "403": {description: forbidden, $ref: "#/components/responses/Problem"}
        "422": {description: validation_failed, $ref: "#/components/responses/Problem"}
# @ag-order: 360
  /v1/hrm/grade-scales/{grade}:
    parameters:
      - {name: grade, in: path, required: true, description: "Mã ngạch/CDNN (vd 01.003, V.05.02.07)", schema: {type: string}}
    post:
      summary: Ghi phiên bản bảng hệ số của ngạch từ ngày hiệu lực (BR-02, AC-02 — bảng cũ giữ nguyên cho ngày trước đó); ngạch phải đang dùng; Admin
      operationId: hrmGradeScaleAdd
      tags: [hrm]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/HrmGradeScaleInput"}
      responses:
        "201":
          description: Đã ghi
          content:
            application/json:
              schema: {$ref: "#/components/schemas/HrmWriteResult"}
        "403": {description: forbidden, $ref: "#/components/responses/Problem"}
        "409": {description: conflict, $ref: "#/components/responses/Problem"}
        "422": {description: validation_failed | hrm.item_reference, $ref: "#/components/responses/Problem"}
# @ag-order: 361
  /v1/hrm/grade-scales/{grade}/history:
    parameters:
      - {name: grade, in: path, required: true, schema: {type: string}}
    get:
      summary: Mọi phiên bản bảng hệ số của ngạch theo ngày hiệu lực
      operationId: hrmGradeScaleHistory
      tags: [hrm]
      responses:
        "200":
          description: Lịch sử
          content:
            application/json:
              schema:
                type: object
                required: [versions]
                properties:
                  versions: {type: array, items: {$ref: "#/components/schemas/HrmGradeScale"}}
        "403": {description: forbidden, $ref: "#/components/responses/Problem"}
        "404": {description: hrm.item_not_found, $ref: "#/components/responses/Problem"}
# @ag-order: 362
  /v1/hrm/rules/{key}:
    parameters:
      - $ref: "#/components/parameters/HrmRuleKey"
    get:
      summary: Tham số có hiệu lực tại một ngày và mọi phiên bản (quy tắc nâng bậc, bảng quy đổi thành tích)
      operationId: hrmRule
      tags: [hrm]
      parameters:
        - {name: at, in: query, required: false, description: "Ngày YYYY-MM-DD (vắng → hôm nay, giờ VN)", schema: {type: string, format: date}}
      responses:
        "200":
          description: Tham số
          content:
            application/json:
              schema: {$ref: "#/components/schemas/HrmRuleView"}
        "403": {description: forbidden, $ref: "#/components/responses/Problem"}
        "404": {description: hrm.rule_unknown, $ref: "#/components/responses/Problem"}
        "422": {description: validation_failed, $ref: "#/components/responses/Problem"}
    post:
      summary: Ghi phiên bản tham số từ ngày hiệu lực (payload kiểm chặt theo khóa; mã kỷ luật/khen thưởng phải đang dùng); Admin
      operationId: hrmRuleAdd
      tags: [hrm]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/HrmRuleInput"}
      responses:
        "201":
          description: Đã ghi
          content:
            application/json:
              schema: {$ref: "#/components/schemas/HrmWriteResult"}
        "403": {description: forbidden, $ref: "#/components/responses/Problem"}
        "404": {description: hrm.rule_unknown, $ref: "#/components/responses/Problem"}
        "409": {description: conflict, $ref: "#/components/responses/Problem"}
        "422": {description: validation_failed | hrm.item_reference, $ref: "#/components/responses/Problem"}
  # --- pf/hrm W11.22 (pf 000150, vault 000004): HỒ SƠ NHÂN SỰ (BRD HCTH v3.0 FN-07, FN-08, FN-20). Dữ liệu cá nhân (họ tên, SĐT,
  # địa chỉ, ngày sinh, giới tính, email, ghi chú; thẻ Thống kê BC Sở TK-01..06) chỉ ở kho định danh — trả về trong phản hồi chi
  # tiết/thẻ nhạy cảm (Cache-Control no-store), không lưu ở pf_hrm. Quyền theo ma trận FN-20 (nhóm vai suy từ ngữ cảnh phiên KN ×
  # phạm vi none/self/unit/all; người dùng ưu tiên). Tắt khi AG_HRM_RECORDS chưa bật (mặc định tắt ở production — Q-005):
  # mọi route dưới đây trừ /v1/hrm/access trả 403 hrm.records_disabled. Mỗi lần xem chi tiết, xem thẻ nhạy cảm, xuất ghi nhật ký.
# @ag-order: 363
  /v1/hrm/access:
    get:
      summary: Quyền hồ sơ hiệu lực của người gọi (nhóm vai, đơn vị nội bộ, phạm vi theo nhóm quyền); enabled=false khi hồ sơ chưa bật
      operationId: hrmMyAccess
      tags: [hrm]
      responses:
        "200":
          description: Quyền
          content:
            application/json:
              schema: {$ref: "#/components/schemas/HrmMyAccess"}
        "401": {description: unauthenticated, $ref: "#/components/responses/Problem"}
        "403": {description: forbidden (không có ngữ cảnh phiên KN), $ref: "#/components/responses/Problem"}
# @ag-order: 364
  /v1/hrm/units:
    get:
      summary: Đơn vị nội bộ (phòng/trạm/trại/BGĐ) của đơn vị người gọi — bộ lọc, đơn vị công tác (HS-16), đơn vị quản lý (HS-37)
      operationId: hrmUnits
      tags: [hrm]
      responses:
        "200":
          description: Đơn vị (kể cả đã ngừng)
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [code, name, kind, active]
                      properties:
                        code: {type: string}
                        name: {type: string}
                        kind: {type: string}
                        active: {type: boolean}
        "403": {description: forbidden | hrm.records_disabled, $ref: "#/components/responses/Problem"}
# @ag-order: 365
  /v1/hrm/staff:
    get:
      summary: Danh sách hồ sơ trong phạm vi xem, chiếu tại ngày chốt (as-of); nhãn họ tên che bớt từ kho (FN-07 B1)
      operationId: hrmStaffList
      tags: [hrm]
      parameters:
        - $ref: "#/components/parameters/HrmAt"
        - {name: type, in: query, required: false, schema: {$ref: "#/components/schemas/HrmStaffType"}}
        - {name: unit, in: query, required: false, description: "Đơn vị công tác hoặc đơn vị quản lý (cán bộ xã)", schema: {type: string}}
        - {name: status, in: query, required: false, schema: {type: string, enum: [active, left, none]}}
        - {name: position, in: query, required: false, schema: {type: string}}
        - {name: grade, in: query, required: false, schema: {type: string}}
        - {name: q, in: query, required: false, description: "Tiền tố mã hồ sơ, hoặc SĐT (tra qua chỉ mục mù của kho)", schema: {type: string}}
        - {name: offset, in: query, required: false, schema: {type: integer, minimum: 0}}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
      responses:
        "200":
          description: Một trang
          content:
            application/json:
              schema:
                type: object
                required: [day, total, scope, items]
                properties:
                  day: {type: string, format: date}
                  total: {type: integer, minimum: 0}
                  scope: {$ref: "#/components/schemas/HrmScope"}
                  items: {type: array, items: {$ref: "#/components/schemas/HrmStaffItem"}}
        "403": {description: forbidden | hrm.records_disabled, $ref: "#/components/responses/Problem"}
        "422": {description: validation_failed, $ref: "#/components/responses/Problem"}
    post:
      summary: Thêm hồ sơ (FN-07 B2) — mã tự sinh VC/HD/XA-nnnnn; định danh + ngăn hồ sơ vào kho (mục đích hrm.profile), thẻ TK (hrm.sensitive); quá trình ban đầu bắt buộc đơn vị và chức vụ
      operationId: hrmStaffCreate
      tags: [hrm]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/HrmStaffCreate"}
      responses:
        "201":
          description: Đã tạo
          content:
            application/json:
              schema: {$ref: "#/components/schemas/HrmStaffWrite"}
        "403": {description: forbidden | hrm.records_disabled, $ref: "#/components/responses/Problem"}
        "409": {description: hrm.duplicate_person | conflict, $ref: "#/components/responses/Problem"}
        "422": {description: validation_failed | hrm.item_reference | hrm.step_out_of_range | hrm.not_applicable, $ref: "#/components/responses/Problem"}
# @ag-order: 366
  /v1/hrm/staff/export:
    get:
      summary: Xuất danh sách đang lọc ra CSV (UTF-8 có BOM, mở bằng Excel) trong phạm vi xuất — không có trường TK (BR-03); ghi một dòng nhật ký xuất
      operationId: hrmStaffExport
      tags: [hrm]
      parameters:
        - $ref: "#/components/parameters/HrmAt"
        - {name: type, in: query, required: false, schema: {$ref: "#/components/schemas/HrmStaffType"}}
        - {name: unit, in: query, required: false, schema: {type: string}}
        - {name: status, in: query, required: false, schema: {type: string, enum: [active, left, none]}}
        - {name: position, in: query, required: false, schema: {type: string}}
        - {name: grade, in: query, required: false, schema: {type: string}}
        - {name: q, in: query, required: false, schema: {type: string}}
      responses:
        "200":
          description: Tệp CSV (Cache-Control no-store)
          content:
            text/csv:
              schema: {type: string}
        "403": {description: forbidden | hrm.records_disabled, $ref: "#/components/responses/Problem"}
        "422": {description: validation_failed (quá 5.000 hồ sơ), $ref: "#/components/responses/Problem"}
# @ag-order: 367
  /v1/hrm/staff/{id}:
    parameters:
      - $ref: "#/components/parameters/HrmStaffId"
    get:
      summary: Hồ sơ chi tiết tại ngày chốt (thẻ Thông tin chung, Công tác, Trình độ, Khen thưởng, Ngạch - Bậc, Thông tin làm việc, Lịch sử sửa) — ghi nhật ký xem; không có thẻ TK
      operationId: hrmStaffGet
      tags: [hrm]
      parameters:
        - $ref: "#/components/parameters/HrmAt"
      responses:
        "200":
          description: Hồ sơ (Cache-Control no-store)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/HrmStaffDetail"}
        "403": {description: forbidden | hrm.records_disabled | mfa_required (kho), $ref: "#/components/responses/Problem"}
        "404": {description: hrm.staff_not_found (kể cả hồ sơ ngoài phạm vi), $ref: "#/components/responses/Problem"}
# @ag-order: 368
  /v1/hrm/staff/{id}/profile:
    parameters:
      - $ref: "#/components/parameters/HrmStaffId"
    post:
      summary: Sửa định danh/ngăn hồ sơ (trường vắng = không đổi) và tài khoản gắn (null = gỡ); sổ ghi TÊN trường đã đổi
      operationId: hrmStaffProfile
      tags: [hrm]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/HrmProfileUpdate"}
      responses:
        "200":
          description: Đã ghi (version không đổi khi không có gì đổi)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/HrmStaffWrite"}
        "403": {description: forbidden | hrm.records_disabled, $ref: "#/components/responses/Problem"}
        "404": {description: hrm.staff_not_found, $ref: "#/components/responses/Problem"}
        "409": {description: hrm.duplicate_person, $ref: "#/components/responses/Problem"}
        "422": {description: validation_failed, $ref: "#/components/responses/Problem"}
# @ag-order: 369
  /v1/hrm/staff/{id}/sensitive:
    parameters:
      - $ref: "#/components/parameters/HrmStaffId"
    get:
      summary: Thẻ Thống kê BC Sở (TK-01..06) — chỉ quyền sensitive.view (mặc định HCTH, Admin); viên chức và HĐLĐ; ghi nhật ký view_sensitive; kho đọc với mục đích hrm.sensitive
      operationId: hrmStaffSensitive
      tags: [hrm]
      responses:
        "200":
          description: Các trường (Cache-Control no-store)
          content:
            application/json:
              schema:
                type: object
                required: [id, fields]
                properties:
                  id: {type: string, format: uuid}
                  fields: {$ref: "#/components/schemas/HrmSensitiveFields"}
        "403": {description: forbidden | hrm.records_disabled | mfa_required (kho), $ref: "#/components/responses/Problem"}
        "404": {description: hrm.staff_not_found, $ref: "#/components/responses/Problem"}
        "422": {description: hrm.not_applicable (cán bộ xã), $ref: "#/components/responses/Problem"}
    post:
      summary: Thay thẻ Thống kê BC Sở (cần sensitive.view + profile.edit); dân tộc/tôn giáo là mã danh mục đang dùng
      operationId: hrmStaffSensitiveWrite
      tags: [hrm]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fields]
              additionalProperties: false
              properties:
                fields: {$ref: "#/components/schemas/HrmSensitiveFields"}
      responses:
        "200":
          description: Đã ghi
          content:
            application/json:
              schema: {$ref: "#/components/schemas/HrmStaffWrite"}
        "403": {description: forbidden | hrm.records_disabled, $ref: "#/components/responses/Problem"}
        "404": {description: hrm.staff_not_found, $ref: "#/components/responses/Problem"}
        "422": {description: validation_failed | hrm.item_reference | hrm.not_applicable, $ref: "#/components/responses/Problem"}
# @ag-order: 370
  /v1/hrm/staff/{id}/events:
    parameters:
      - $ref: "#/components/parameters/HrmStaffId"
    post:
      summary: Thêm một dòng quá trình có hiệu lực (đơn vị, chức vụ, tăng cường, ngạch, bậc, văn bằng, bồi dưỡng, khen thưởng, kỷ luật, vào làm/nghỉ việc — FN-07 B4/B6/B7, FN-08)
      operationId: hrmStaffEventAdd
      tags: [hrm]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/HrmEventInput"}
      responses:
        "201": {$ref: "#/components/responses/HrmEventWritten"}
        "403": {description: forbidden | hrm.records_disabled, $ref: "#/components/responses/Problem"}
        "404": {description: hrm.staff_not_found, $ref: "#/components/responses/Problem"}
        "422": {description: validation_failed | hrm.item_reference | hrm.step_out_of_range, $ref: "#/components/responses/Problem"}
# @ag-order: 371
  /v1/hrm/staff/{id}/events/{event}/replace:
    parameters:
      - $ref: "#/components/parameters/HrmStaffId"
      - $ref: "#/components/parameters/HrmEventId"
    post:
      summary: Thay một dòng quá trình còn hiệu lực bằng dòng mới cùng loại (reason 10–500 ký tự bắt buộc); dòng cũ giữ trong lịch sử
      operationId: hrmStaffEventReplace
      tags: [hrm]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/HrmEventInput"}
      responses:
