    HrmStaffEvent:
      type: object
      required: [id, kind, valid_from, precision, valid_to, payload, void, supersedes, reason, version, recorded_at, actor_ref, effective]
      properties:
        id: {type: string, format: uuid}
        kind: {type: string}
        valid_from: {type: string}
        precision: {type: string, enum: [day, month, year]}
        valid_to: {type: [string, "null"], format: date}
        payload: {type: object, additionalProperties: {type: string}}
        void: {type: boolean}
        supersedes: {type: [string, "null"], format: uuid}
        reason: {type: string}
        version: {type: integer}
        recorded_at: {type: string, format: date-time}
        actor_ref: {type: string, format: uuid}
        effective: {type: boolean, description: "false = đã bị thay/hủy, hoặc là dòng hủy"}
# @ag-order: 918
    HrmStaffProfile:
      type: object
      required: [full_name, phone, address, birth_date, birth_precision, gender, email, note]
      properties:
        full_name: {type: string}
        phone: {type: string}
        address: {type: string}
        birth_date: {type: string}
        birth_precision: {type: string}
        gender: {type: string}
        email: {type: string}
        note: {type: string}
# @ag-order: 919
    HrmStaffHistory:
      type: object
      required: [version, change, changed_fields, recorded_at, actor_ref]
      properties:
        version: {type: integer}
        change: {type: string, enum: [created, profile, sensitive, type, account]}
        changed_fields: {type: array, items: {type: string}}
        recorded_at: {type: string, format: date-time}
        actor_ref: {type: string, format: uuid}
# @ag-order: 920
    HrmStaffDetail:
      type: object
      required: [id, code, type, account_ref, day, erased, created_at, age, profile, current, events, history, can]
      properties:
        id: {type: string, format: uuid}
        code: {type: string}
        type: {$ref: "#/components/schemas/HrmStaffType"}
        account_ref: {type: [string, "null"], format: uuid}
        day: {type: string, format: date}
        erased: {type: boolean, description: "Chủ thể đã bị xóa định danh ở kho (RB-3)"}
        created_at: {type: string, format: date-time}
        age: {type: [integer, "null"], description: "Tuổi tại ngày chốt (HS-33)"}
        profile: {$ref: "#/components/schemas/HrmStaffProfile"}
        current: {$ref: "#/components/schemas/HrmSnapshot"}
        events: {type: array, items: {$ref: "#/components/schemas/HrmStaffEvent"}}
        history: {type: array, items: {$ref: "#/components/schemas/HrmStaffHistory"}}
        can:
          type: object
          description: Nhóm quyền của người gọi trên hồ sơ này
          additionalProperties: {type: boolean}
    # --- pf/hrm (W11.21) ---
# @ag-order: 921
    HrmStatus:
      type: object
      required: [can_manage, rule_version, day, counts, placeholders, scales, rules]
      properties:
        can_manage: {type: boolean, description: "true = Admin (ghi được)"}
        rule_version: {type: string}
        day: {type: string, format: date}
        counts: {type: object, additionalProperties: {type: integer, minimum: 0}, description: "Loại danh mục → số mục đang dùng"}
        placeholders: {type: integer, minimum: 0, description: "Số mục/bảng hệ số/tham số hiện hành còn là dữ liệu mẫu (chờ Q-070)"}
        scales: {type: integer, minimum: 0, description: "Số ngạch có bảng hệ số hiệu lực hôm nay"}
        rules: {type: integer, minimum: 0}
# @ag-order: 922
    HrmCatalogAttrs:
      type: object
      additionalProperties: false
      description: >-
        Thuộc tính riêng theo loại; trường không thuộc loại phải vắng. position: leader, allowance (hệ số PCCV, chuỗi 2 chữ số
        thập phân, chỉ khi leader), mgmt_level. grade: equiv_group, grade_type, salary_class. education_level: rank.
        major_group: level. major: groups (mã trình độ → mã nhóm chuyên ngành của trình độ đó). ethnicity: minority.
        religion: no_religion.
      properties:
        leader: {type: boolean}
        allowance: {type: string, pattern: "^\\d+(\\.\\d{1,2})?$"}
        mgmt_level: {type: string}
        equiv_group: {type: string, enum: [CVCC, CVC, CV, CS, CON_LAI]}
        grade_type: {type: string, enum: [cong_chuc, vien_chuc]}
        salary_class: {type: string, maxLength: 20}
        rank: {type: integer, minimum: 1, maximum: 100}
        level: {type: string}
        groups: {type: object, additionalProperties: {type: string}}
        minority: {type: boolean}
        no_religion: {type: boolean}
# @ag-order: 923
    HrmCatalogItem:
      type: object
      required: [kind, code, name, sort_order, active, placeholder, version, attrs, recorded_at]
      properties:
        kind: {type: string}
        code: {type: string}
        name: {type: string}
        sort_order: {type: integer}
        active: {type: boolean, description: "false = đã ngừng sử dụng (không xóa — BR-01)"}
        placeholder: {type: boolean, description: "Dữ liệu mẫu chưa được Phòng HCTH xác nhận (Q-070)"}
        version: {type: integer, minimum: 1}
        attrs: {$ref: "#/components/schemas/HrmCatalogAttrs"}
        recorded_at: {type: string, format: date-time}
# @ag-order: 924
    HrmCatalogItemInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        code: {type: string, description: "Bắt buộc khi thêm; vắng khi sửa (mã ở đường dẫn). Khoảng trắng, xuống dòng bị loại bỏ"}
        name: {type: string, minLength: 1, maxLength: 200}
        sort_order: {type: integer, minimum: 0, maximum: 100000}
        active: {type: boolean, description: "Vắng → true. Sửa với false = ngừng sử dụng"}
        attrs: {$ref: "#/components/schemas/HrmCatalogAttrs"}
# @ag-order: 925
    HrmWriteResult:
      type: object
      required: [code, version]
      properties:
        code: {type: string, description: "Mã đã chuẩn hóa (mục, ngạch hoặc khóa tham số)"}
        version: {type: integer, minimum: 1}
# @ag-order: 926
    HrmGradeScale:
      type: object
      required: [grade_code, valid_from, steps, coefficients, hold_months, note, placeholder, version, recorded_at]
      properties:
        grade_code: {type: string}
        valid_from: {type: string, format: date}
        steps: {type: integer, minimum: 1, maximum: 20}
        coefficients: {type: array, items: {type: string}, description: "Hệ số bậc 1..n, chuỗi thập phân 2 chữ số"}
        hold_months: {type: integer, minimum: 1, maximum: 120, description: "Thời gian giữ bậc (tháng) — NLTX"}
        note: {type: string}
        placeholder: {type: boolean}
        version: {type: integer, minimum: 1}
        recorded_at: {type: string, format: date-time}
# @ag-order: 927
    HrmGradeScaleInput:
      type: object
      additionalProperties: false
      required: [valid_from, coefficients, hold_months]
      properties:
        valid_from: {type: string, format: date}
        coefficients:
          type: array
          minItems: 1
          maxItems: 20
          description: "Hệ số bậc 1..n tăng dần, 0 < hệ số ≤ 99,99, tối đa 2 chữ số thập phân"
          items: {type: string, pattern: "^\\d+(\\.\\d{1,2})?$"}
        hold_months: {type: integer, minimum: 1, maximum: 120}
        note: {type: string, maxLength: 500}
# @ag-order: 928
    HrmRule:
      type: object
      required: [key, valid_from, payload, note, placeholder, version, recorded_at]
      properties:
        key: {type: string}
        valid_from: {type: string, format: date}
        payload: {type: object, description: "promotion: HrmPromotionRules; achievement_conversion: HrmAchievementConversion"}
        note: {type: string}
        placeholder: {type: boolean}
        version: {type: integer, minimum: 1}
        recorded_at: {type: string, format: date-time}
# @ag-order: 929
    HrmRuleView:
      type: object
      required: [key, day, current, versions]
      properties:
        key: {type: string}
        day: {type: string, format: date}
        current:
          oneOf:
            - {$ref: "#/components/schemas/HrmRule"}
            - {type: "null"}
        versions: {type: array, items: {$ref: "#/components/schemas/HrmRule"}}
# @ag-order: 930
    HrmRuleInput:
      type: object
      additionalProperties: false
      required: [valid_from, payload]
      properties:
        valid_from: {type: string, format: date}
        payload:
          oneOf:
            - {$ref: "#/components/schemas/HrmPromotionRules"}
            - {$ref: "#/components/schemas/HrmAchievementConversion"}
        note: {type: string, maxLength: 500}
# @ag-order: 931
    HrmPromotionRules:
      type: object
      additionalProperties: false
      description: Quy tắc nâng bậc (FN-09 BR-02, BR-03) — mặc định là mẫu chờ Q-070. Phần trăm là chuỗi thập phân.
      required: [min_rating, rating_years, achievement_years, discipline_extension_months, nlth_quota_pct, nlth_retirement_months,
        nlth_retirement_within_months, tnvk_start_pct, tnvk_step_pct, tnvk_cycle_months, tnvk_first_months, remind_months,
        retirement_age_male_months, retirement_age_female_months]
      properties:
        min_rating: {type: string, enum: [HTXSNV, HTTNV, HTNV, KHTNV]}
        rating_years: {type: integer, minimum: 1, maximum: 10}
        achievement_years: {type: integer, minimum: 1, maximum: 10}
        discipline_extension_months: {type: object, additionalProperties: {type: integer, minimum: 0, maximum: 60}}
        nlth_quota_pct: {type: string}
        nlth_retirement_months: {type: integer, minimum: 0, maximum: 36}
        nlth_retirement_within_months: {type: integer, minimum: 0, maximum: 36}
        tnvk_start_pct: {type: string}
        tnvk_step_pct: {type: string}
        tnvk_cycle_months: {type: integer, minimum: 1, maximum: 60}
        tnvk_first_months: {type: integer, minimum: 1, maximum: 120}
        remind_months: {type: array, items: {type: integer, minimum: 1, maximum: 24}, minItems: 1, maxItems: 6}
        retirement_age_male_months: {type: integer, minimum: 600, maximum: 840}
        retirement_age_female_months: {type: integer, minimum: 600, maximum: 840}
# @ag-order: 932
    HrmAchievementConversion:
      type: object
      additionalProperties: false
      required: [rules]
      properties:
        rules:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
            additionalProperties: false
            required: [award_code, months]
            properties:
              award_code: {type: string, description: "Mã hình thức khen thưởng (award_form) đang dùng"}
              months: {type: integer, minimum: 1, maximum: 36}
# @ag-order: 1111
    HrmPlanPosition:
      type: object
      additionalProperties: false
      required: [title, count]
      properties:
        title: {type: string, minLength: 1, maxLength: 200}
        level: {type: string, maxLength: 100}
        count: {type: integer, minimum: 1, maximum: 9999}
        when: {type: string, maxLength: 100}
        reason: {type: string, maxLength: 500}
# @ag-order: 1112
    HrmPlanInput:
      type: object
      description: Phần lãnh đạo đơn vị nhập (W11.27)
      required: [leaving, additional]
      properties:
        leaving: {type: integer, minimum: 0, maximum: 9999, description: "Dự kiến nghỉ, chuyển công tác khác"}
        additional: {type: integer, minimum: 0, maximum: 9999, description: "Số cần bổ sung"}
        positions: {type: array, maxItems: 10, items: {$ref: "#/components/schemas/HrmPlanPosition"}}
        note: {type: string, maxLength: 500}
# @ag-order: 1113
    HrmPlanValues:
      allOf:
        - {$ref: "#/components/schemas/HrmPlanInput"}
        - type: object
          required: [current, retiring, demand]
          properties:
            current: {type: integer, description: "Số nhân sự hiện có (tự tính tại ngày chốt)"}
            retiring: {type: integer, description: "Dự kiến nghỉ hưu trong năm (tự tính)"}
            demand: {type: integer, description: "Nhu cầu theo kế hoạch = hiện có − nghỉ hưu − nghỉ/chuyển khác + cần bổ sung"}
# @ag-order: 1114
    HrmPlanPeriod:
      type: object
      required: [year, label, period_ref, status, due_at, cutoff_on, units, submitted, opened_at]
      properties:
        year: {type: integer}
        label: {type: string}
        period_ref: {type: string, format: uuid, description: "Kỳ native cap/forms (profile hrm_plan)"}
        status: {type: string, enum: [open, closed, reopened, cancelled]}
        due_at: {type: string, format: date-time}
        cutoff_on: {type: string, format: date}
        units: {type: array, items: {type: string}}
        submitted: {type: integer}
        opened_at: {type: string, format: date-time}
# @ag-order: 1115
    HrmPlanStatus:
      type: string
      description: "not_started Chưa lập · draft Đang lập · submitted Đã gửi · returned Yêu cầu điều chỉnh · accepted Đã xác nhận · closed Đã chốt · missed Không gửi"
      enum: [not_started, draft, submitted, returned, accepted, closed, missed]
# @ag-order: 1116
    HrmPlanRow:
      type: object
      required: [unit, unit_name, status, late, versions, decision, values, source, adjusted]
      properties:
        unit: {type: string}
        unit_name: {type: string}
        status: {$ref: "#/components/schemas/HrmPlanStatus"}
        late: {type: boolean, description: "Gửi sau hạn (Trễ hạn)"}
        versions: {type: integer}
        decision: {type: string, enum: ["", accepted, returned]}
        review_note: {type: string}
        submitted_at: {type: [string, "null"], format: date-time}
        values: {$ref: "#/components/schemas/HrmPlanValues"}
        source: {type: string, enum: [auto, submitted, adjusted]}
        adjusted: {type: boolean}
# @ag-order: 1117
    HrmPlanSummary:
      type: object
      required: [period, rows, totals, figures_available, can_manage, my_unit]
      properties:
        period: {$ref: "#/components/schemas/HrmPlanPeriod"}
        rows: {type: array, items: {$ref: "#/components/schemas/HrmPlanRow"}}
        totals:
          type: object
          required: [current, retiring, leaving, additional, demand]
          properties:
            current: {type: integer}
            retiring: {type: integer}
            leaving: {type: integer}
            additional: {type: integer}
            demand: {type: integer}
        figures_available: {type: boolean, description: "false: hồ sơ nhân sự chưa bật (AG_HRM_RECORDS) — số tự tính = 0"}
        can_manage: {type: boolean}
        my_unit: {type: string, description: "Đơn vị người gọi lập kế hoạch (lãnh đạo đơn vị); rỗng nếu không"}
# @ag-order: 1118
    HrmPlanAdjustment:
      type: object
      required: [seq, values, reason, actor_ref, recorded_at]
      properties:
        seq: {type: integer}
        values: {$ref: "#/components/schemas/HrmPlanValues"}
        reason: {type: string}
        actor_ref: {type: string, format: uuid}
        recorded_at: {type: string, format: date-time}
# @ag-order: 1119
    HrmPlanDraft:
      type: object
      required: [values, recorded_at]
      properties:
        values: {$ref: "#/components/schemas/HrmPlanInput"}
        recorded_at: {type: string, format: date-time}
# @ag-order: 1120
    HrmPlanUnit:
      type: object
      required: [period, row, figures, draft, submissions, adjustments, can_edit, can_review, can_adjust]
      properties:
        period: {$ref: "#/components/schemas/HrmPlanPeriod"}
        row: {$ref: "#/components/schemas/HrmPlanRow"}
        figures:
          type: object
          required: [available, current, retiring, unknown, retirees]
          properties:
            available: {type: boolean}
            current: {type: integer}
            retiring: {type: integer}
            unknown: {type: integer, description: "Người thiếu giới tính/ngày sinh — không tính được tuổi nghỉ hưu"}
            retirees:
              type: array
              items:
                type: object
                required: [staff_id, code, full_name, retire_on]
                properties:
                  staff_id: {type: string, format: uuid}
                  code: {type: string}
                  full_name: {type: string, description: "Rỗng khi người gọi không được xem hồ sơ (FN-20)"}
                  retire_on: {type: string, format: date}
        draft:
          oneOf:
            - {$ref: "#/components/schemas/HrmPlanDraft"}
            - {type: "null"}
        submissions:
          type: array
          items:
            type: object
            required: [id, version, values, submitted_at, late, decision]
            properties:
              id: {type: string, format: uuid}
              version: {type: integer}
              values: {$ref: "#/components/schemas/HrmPlanValues"}
              submitted_at: {type: string, format: date-time}
              late: {type: boolean}
              decision: {type: string, enum: ["", accepted, returned]}
              review_note: {type: string}
              reviewed_at: {type: [string, "null"], format: date-time}
        adjustments: {type: array, items: {$ref: "#/components/schemas/HrmPlanAdjustment"}}
        can_edit: {type: boolean}
        can_review: {type: boolean}
        can_adjust: {type: boolean}
