  # W11.27 (BRD HCTH v3.0 FN-11, D3 H7): KẾ HOẠCH NHÂN LỰC NĂM — kỳ native cap/forms profile hrm_plan (đơn vị lá = đơn vị nội bộ
  # W11.07). Phòng HCTH/Admin mở kỳ năm, tổng hợp, yêu cầu điều chỉnh/xác nhận, chốt, điều chỉnh sau chốt có lý do; lãnh đạo
  # đơn vị lập, lưu nháp, gửi kế hoạch của đơn vị mình. Số hiện có, dự kiến nghỉ hưu tự tính từ hồ sơ tại ngày chốt (BR-01).
# @ag-order: 487
  /v1/hrm/plans:
    get:
      summary: Các kỳ kế hoạch nhân lực năm người gọi thấy (lãnh đạo đơn vị — kỳ có đơn vị mình), năm mới trước
      operationId: hrmPlanList
      tags: [hrm]
      responses:
        "200":
          description: Danh sách kỳ
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/HrmPlanPeriod"}}
        "401": {description: unauthenticated, $ref: "#/components/responses/Problem"}
        "403": {description: forbidden (chỉ Phòng HCTH, Admin, lãnh đạo đơn vị), $ref: "#/components/responses/Problem"}
        "503": {description: hrm.plan_disabled, $ref: "#/components/responses/Problem"}
    post:
      summary: Mở kỳ kế hoạch năm (B1) — hạn gửi, ngày chốt số liệu hiện có, đơn vị (vắng → mọi đơn vị nội bộ đang dùng)
      operationId: hrmPlanOpen
      tags: [hrm]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [year, due_on]
              additionalProperties: false
              properties:
                year: {type: integer, minimum: 2020, maximum: 2100}
                due_on: {type: string, format: date, description: "Hạn các đơn vị gửi (hết ngày, giờ VN)"}
                cutoff_on: {type: string, format: date, description: "Ngày chốt số liệu hiện có (vắng → hôm nay)"}
                units: {type: array, maxItems: 200, items: {type: string, pattern: "^[a-z][a-z0-9_]{0,39}$"}}
      responses:
        "201":
          description: Đã mở kỳ
          content:
            application/json:
              schema: {$ref: "#/components/schemas/HrmPlanPeriod"}
        "403": {description: forbidden, $ref: "#/components/responses/Problem"}
        "409": {description: hrm.plan_exists, $ref: "#/components/responses/Problem"}
        "422": {description: validation_failed, $ref: "#/components/responses/Problem"}
