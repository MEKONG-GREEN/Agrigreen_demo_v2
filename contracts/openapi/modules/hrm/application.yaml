  # --- hết pf/hrm ---
  # --- pf/contact (cap/directory, W11.23 — BRD HCTH v3.0 FN-13 Contact; Q-071, Q-072): danh bạ liên hệ dùng chung. Một người =
  # một bản ghi = một chủ thể kho định danh (BR-01); cán bộ thuộc tỉnh chiếu từ hồ sơ nhân sự pf/hrm (cổng AG_HRM_RECORDS), liên
  # hệ ngoài tỉnh do Cấp Tỉnh – HCTH, Admin nhập. LỌC TRƯỜNG Ở API theo vai (BR-03): field_set "basic" (Cấp TW, Cấp Xã) — mỗi dòng
  # CHỈ có id, full_name, birth_year, phone, không xem chi tiết, không ghi; "full" (Cấp Tỉnh, Admin) — thêm title, unit, level,
  # email. Phản hồi chứa dữ liệu cá nhân: Cache-Control no-store. Ngữ cảnh KN: header X-AG-Context. ---
components:
  parameters:
# @ag-order: 490
    HrmKind:
      name: kind
      in: path
      required: true
      description: Loại danh mục nhân sự (pf/hrm, FN-19)
      schema:
        type: string
        enum: [position, grade, education_level, major, major_group, ethnicity, religion, political_theory, state_mgmt,
          foreign_language, language_level, it_level, award_form, discipline_form, change_type, leave_reason]
# @ag-order: 491
    HrmRuleKey:
      name: key
      in: path
      required: true
      description: Khóa tham số có phiên bản (pf/hrm) — promotion (quy tắc nâng bậc), achievement_conversion (quy đổi thành tích)
      schema: {type: string, enum: [promotion, achievement_conversion]}
# @ag-order: 492
    HrmAt:
      name: at
      in: query
      required: false
      description: Ngày chốt YYYY-MM-DD (vắng → hôm nay, giờ VN) — truy vấn as-of
      schema: {type: string, format: date}
# @ag-order: 493
    HrmReportCode:
      name: code
      in: path
      required: true
      description: Mã biểu báo cáo Sở
      schema: {type: string, enum: [NS01, NS02, NS03, NS04, NS05, NS06]}
# @ag-order: 494
    HrmStaffId:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
# @ag-order: 495
    HrmEventId:
      name: event
      in: path
      required: true
      schema: {type: string, format: uuid}
# @ag-order: 496
    HrmFolderId:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
# @ag-order: 497
    HrmDocId:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
# @ag-order: 498
    HrmPlanYear:
      name: year
      in: path
      required: true
      description: Năm kế hoạch (W11.27)
      schema: {type: integer, minimum: 2020, maximum: 2100}
# @ag-order: 499
    HrmPlanUnit:
      name: unit
      in: path
      required: true
      description: Mã đơn vị nội bộ (W11.07)
