                  submitted_at: {type: string, format: date-time}
                  late: {type: boolean}
        "403": {description: forbidden, $ref: "#/components/responses/Problem"}
        "409": {description: "forms.period_closed | forms.submission_accepted | forms.submission_conflict", $ref: "#/components/responses/Problem"}
