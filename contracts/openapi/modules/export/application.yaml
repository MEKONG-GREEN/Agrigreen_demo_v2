paths:
# @ag-order: 20100
  /v1/exports/templates:
    get:
      summary: "Mẫu văn bản (cap/export): khóa, phiên bản đăng ký và đã ghi sổ trong đơn vị, biến, danh sách, mục — W10.17"
      operationId: exportTemplatesList
      tags: [export]
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema: {"$ref": "#/components/schemas/ExportTemplateList"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
# @ag-order: 20101
  /v1/exports/runs:
    get:
      summary: "Lịch sử lần xuất văn bản của đơn vị (không kèm tệp), mới nhất trước"
      operationId: exportRunsList
      tags: [export]
      parameters:
        - {name: template, in: query, required: false, schema: {type: string}}
        - {name: subject, in: query, required: false, schema: {type: string}}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 200}}
      responses:
        "200":
          description: Thành công
          content:
            application/json:
              schema: {"$ref": "#/components/schemas/ExportRunList"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
# @ag-order: 20102
  /v1/exports/runs/{id}/download:
    get:
      summary: "Tải lại tệp .docx đã lưu của một lần xuất (kiểm băm SHA-256)"
      operationId: exportRunDownload
      tags: [export]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Thành công
          content:
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema: {type: string, format: binary}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
components:
  schemas:
# @ag-order: 30100
    ExportTemplateVersion: {"type":"object","properties":{"version":{"type":"integer"},"hash":{"type":"string"},"registered":{"type":"boolean"},"recorded_at":{"type":["string","null"],"format":"date-time"},"drift":{"type":"boolean"}},"required":["version","hash","registered","recorded_at","drift"],"additionalProperties":false}
# @ag-order: 30101
    ExportTemplate: {"type":"object","properties":{"key":{"type":"string"},"title":{"type":"string"},"owner":{"type":"string"},"latest":{"type":"integer"},"vars":{"type":"array","items":{"type":"object","properties":{"key":{"type":"string"},"label":{"type":"string"},"required":{"type":"boolean"}},"required":["key","label"],"additionalProperties":false}},"lists":{"type":"array","items":{"type":"object","properties":{"key":{"type":"string"},"label":{"type":"string"},"fields":{"type":"array","items":{"type":"string"}}},"required":["key","label","fields"],"additionalProperties":false}},"sections":{"type":"array","items":{"type":"string"}},"versions":{"type":"array","items":{"$ref":"#/components/schemas/ExportTemplateVersion"}}},"required":["key","title","owner","latest","vars","lists","sections","versions"],"additionalProperties":false}
# @ag-order: 30102
    ExportTemplateList: {"type":"object","properties":{"items":{"type":"array","items":{"$ref":"#/components/schemas/ExportTemplate"}}},"required":["items"],"additionalProperties":false}
# @ag-order: 30103
    ExportRun: {"type":"object","properties":{"id":{"type":"string","format":"uuid"},"seq":{"type":"integer"},"subject":{"type":"string"},"template":{"type":"string"},"template_version":{"type":"integer"},"template_hash":{"type":"string"},"input_hash":{"type":"string"},"doc_number":{"type":"string"},"doc_number_auto":{"type":"boolean"},"file_name":{"type":"string"},"body_hash":{"type":"string"},"size":{"type":"integer"},"actor_ref":{"type":"string","format":"uuid"},"at":{"type":"string","format":"date-time"}},"required":["id","seq","subject","template","template_version","template_hash","input_hash","doc_number","doc_number_auto","file_name","body_hash","size","actor_ref","at"],"additionalProperties":false}
# @ag-order: 30104
    ExportRunList: {"type":"object","properties":{"items":{"type":"array","items":{"$ref":"#/components/schemas/ExportRun"}}},"required":["items"],"additionalProperties":false}
