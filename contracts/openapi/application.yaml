openapi: 3.1.0
info:
  title: AgriGreen Application API
  version: "1"
  description: |
    Bề mặt Application (api.<domain>) — OIDC + JWT (mục 11).
    Mọi POST bắt buộc Idempotency-Key (R-51). Lỗi theo RFC 9457 (docs/errors.md).
    Tenant lấy từ token, không bao giờ từ path/query/body (R-16).
servers:
  - url: https://api.agrigreen.vn
security:
  - oidc: []
paths:
  /v1/consents:
    post:
      summary: Ghi một bản ghi đồng ý theo mục đích (sổ chỉ ghi thêm)
      operationId: recordConsent
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ConsentInput"}
      responses:
        "201":
          description: Đã ghi. Gọi lặp cùng khóa trả lại đúng phản hồi này, kèm header Idempotent-Replayed.
          headers:
            Location: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Consent"}
        "400": {$ref: "#/components/responses/Problem"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
    get:
      summary: Lịch sử đồng ý của một chủ thể (phân trang cursor, R-53)
      operationId: listConsents
      parameters:
        - {name: subject_ref, in: query, required: true, schema: {type: string, format: uuid}}
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        "200":
          description: Một trang
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/Consent"}}
                  next_cursor: {type: [string, "null"]}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/consents/{id}:
    get:
      operationId: getConsent
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Bản ghi
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Consent"}
        "404": {$ref: "#/components/responses/Problem"}
  # --- pf/masterdata (chỉ đọc; ghi qua Admin API — contracts/openapi/admin.yaml) ---

  # Dữ liệu chủ là dữ liệu tham chiếu của tenant: mọi người gọi đã xác thực đều đọc được.
  /v1/masterdata/admin-units:
    get:
      summary: Đơn vị con trực tiếp có hiệu lực tại thời điểm at (parent bỏ trống → các tỉnh)
      operationId: listAdminUnits
      tags: [masterdata]
      parameters:
        - {name: parent, in: query, schema: {type: string}}
        - $ref: "#/components/parameters/At"
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        "200":
          description: Một trang, theo mã
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/AdminUnit"}}
                  next_cursor: {type: [string, "null"]}
        "404": {description: masterdata.admin_unit_not_found, $ref: "#/components/responses/Problem"}
  /v1/masterdata/admin-units/{code}:
    get:
      summary: Đơn vị có hiệu lực tại at (cùng một mã có thể là đơn vị khác nhau ở hai thời điểm)
      operationId: getAdminUnit
      tags: [masterdata]
      parameters:
        - $ref: "#/components/parameters/UnitCode"
        - $ref: "#/components/parameters/At"
      responses:
        "200":
          description: Đơn vị
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AdminUnit"}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/masterdata/admin-units/{code}/tree:
    get:
      summary: Cây đơn vị (chính nó và mọi đơn vị con cháu) có hiệu lực tại at
      operationId: getAdminUnitTree
      tags: [masterdata]
      parameters:
        - $ref: "#/components/parameters/UnitCode"
        - $ref: "#/components/parameters/At"
      responses:
        "200":
          description: Cây
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AdminUnitNode"}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/masterdata/admin-units/{code}/current:
    get:
      summary: Mã hiện hành (tại at) của một mã có thể đã cũ — đi theo chuỗi sáp nhập/chia tách
      operationId: currentAdminUnitCodes
      tags: [masterdata]
      parameters:
        - $ref: "#/components/parameters/UnitCode"
        - $ref: "#/components/parameters/At"
      responses:
        "200":
          description: Mã hiện hành
          content:
            application/json:
              schema:
                type: object
                required: [code, at, current_codes]
                properties:
                  code: {type: string}
                  at: {type: string, format: date-time}
                  current_codes: {type: array, items: {type: string}}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/masterdata/catalogs/{catalog}:
    get:
      summary: Danh sách mục của một danh mục (mặc định chỉ mục đang dùng)
      operationId: listCatalog
      tags: [masterdata]
      parameters:
        - $ref: "#/components/parameters/Catalog"
        - {name: include_inactive, in: query, schema: {type: boolean, default: false}}
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        "200":
          description: Một trang, theo mã
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/CatalogItem"}}
                  next_cursor: {type: [string, "null"]}
        "404": {description: masterdata.catalog_not_found, $ref: "#/components/responses/Problem"}
  /v1/masterdata/catalogs/{catalog}/{code}:
    get:
      summary: Một mục danh mục (kể cả đã ngừng dùng)
      operationId: getCatalogItem
      tags: [masterdata]
      parameters:
        - $ref: "#/components/parameters/Catalog"
        - {name: code, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: Mục
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CatalogItem"}
        "404": {description: masterdata.catalog_item_not_found, $ref: "#/components/responses/Problem"}
  /v1/masterdata/params/value:
    get:
      summary: Giá trị tham số ĐÃ PHÊ DUYỆT có hiệu lực tại thời điểm của sự việc (CGH QT-01, AC-02)
      operationId: getParamValue
      tags: [masterdata]
      parameters:
        - {name: key, in: query, required: true, schema: {type: string}, examples: {norm: {value: "cgh.norm_ha_per_machine:MGD:thu_hoach"}}}
        - $ref: "#/components/parameters/At"
      responses:
        "200":
          description: Giá trị
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ParamValue"}
        "404": {description: masterdata.param_not_found, $ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/me:
    get:
      summary: Người gọi hiện tại, đơn vị công tác và phạm vi dữ liệu đã giải (pf/party, ADR-0009)
      description: |
        Mọi người gọi đã xác thực đều gọi được, không cần vai nghiệp vụ. Không chứa dữ liệu cá nhân
        (R-04, R-14): chỉ mã tham chiếu, vai, tên tổ chức và tên đơn vị hành chính.
        Chỉ để giao diện hiển thị; quyền thật do từng module kiểm ở backend (R-55).
        Phản hồi có Cache-Control private, no-store.
      operationId: getMe
      responses:
        "200":
          description: Người gọi
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Me"}
        "401": {$ref: "#/components/responses/Problem"}
        "503": {description: party.dependency_unavailable — chưa nối danh mục đơn vị hành chính, $ref: "#/components/responses/Problem"}
  /v1/orgs:
    get:
      summary: Tổ chức trong phạm vi của người gọi (phân trang cursor)
      operationId: listOrgs
      parameters:
        - {name: kind, in: query, schema: {$ref: "#/components/schemas/OrgKind"}}
        - {name: include_inactive, in: query, schema: {type: boolean, default: false}}
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        "200":
          description: Một trang
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/Org"}}
                  next_cursor: {type: [string, "null"]}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/cooperatives:
    get:
      summary: HTX/THT trong phạm vi, tìm theo tên, Mã HTX hoặc mã số thuế
      operationId: listCooperatives
      parameters:
        - {name: q, in: query, schema: {type: string}}
        - {name: admin_unit, in: query, description: "G-03: mã tỉnh hoặc xã hiện hành — chỉ HTX thuộc đơn vị này (và con cháu) giao với phạm vi người gọi; mã không có hiệu lực → 422 validation_failed (trường admin_unit)", schema: {type: string}}
        - {name: include_inactive, in: query, schema: {type: boolean, default: false}}
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        "200":
          description: Một trang
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/Cooperative"}}
                  next_cursor: {type: [string, "null"]}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/cooperatives/{ref}:
    get:
      summary: Hồ sơ HTX (ngoài phạm vi → 404)
      operationId: getCooperative
      parameters:
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Hồ sơ
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Cooperative"}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/cooperatives/{ref}/households:
    get:
      summary: Nông hộ thành viên của HTX, kèm nhãn hiển thị đã che (không bao giờ có định danh đầy đủ)
      operationId: listCooperativeHouseholds
      parameters:
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        "200":
          description: Một trang
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/HouseholdListItem"}}
                  next_cursor: {type: [string, "null"]}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/households:
    post:
      summary: Tạo nông hộ — định danh chủ hộ đi thẳng vào kho định danh; trùng SĐT/CCCD → dùng lại mã cũ, báo "trùng"
      operationId: createHousehold
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/HouseholdInput"}
      responses:
        "201":
          description: Đã tạo
          content:
            application/json:
              schema: {$ref: "#/components/schemas/HouseholdCreated"}
        "200":
          description: Trùng chủ hộ đã có (duplicate = true, duplicate_label = "trùng")
          content:
            application/json:
              schema: {$ref: "#/components/schemas/HouseholdCreated"}
        "403": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
  # --- pf/sync --- (docs/dev/sync-contract.md)

  /v1/devices:
    post:
      summary: Đăng ký thiết bị hiện trường cho người gọi (actor_ref, org_ref lấy từ token)
      operationId: registerDevice
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SyncDeviceInput"}
      responses:
        "201":
          description: Đã đăng ký
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SyncDevice"}
        "200":
          description: Cùng người đăng ký lại cùng mã (cài lại, nâng cấp app) — cập nhật app_version
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SyncDevice"}
        "403": {description: "sync.device_revoked — mã đã bị thu hồi; máy xóa dữ liệu và sinh mã mới", $ref: "#/components/responses/Problem"}
        "409": {description: "sync.device_taken", $ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/sync/pull:
    get:
      summary: Thay đổi chiều xuống theo phạm vi phân công (cursor mờ có chữ ký, round-robin giữa các entity)
      operationId: syncPull
      parameters:
        - $ref: "#/components/parameters/DeviceID"
        - {name: cursor, in: query, description: "next_cursor của trang trước; bỏ trống = từ đầu", schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 1000, default: 500}}
      responses:
        "200":
          description: Một trang
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SyncPullPage"}
        "400": {description: "sync.cursor_invalid — con trỏ bị sửa hoặc của thiết bị khác; pull lại từ đầu", $ref: "#/components/responses/Problem"}
        "403": {description: "sync.device_unregistered | sync.device_revoked", $ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/sync/push:
    post:
      summary: Gửi một lô bản ghi chỉ ghi thêm; kết quả theo từng bản ghi
      operationId: syncPush
      parameters:
        - {$ref: "#/components/parameters/IdempotencyKey", description: "Mã lô do máy sinh"}
        - $ref: "#/components/parameters/DeviceID"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SyncPushBatch"}
      responses:
        "200":
          description: Kết quả theo thứ tự bản ghi gửi lên. Gọi lặp cùng Idempotency-Key trả đúng phản hồi này.
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results: {type: array, items: {$ref: "#/components/schemas/SyncPushResult"}}
        "403": {description: "sync.device_unregistered | sync.device_revoked", $ref: "#/components/responses/Problem"}
        "422": {description: "device_id khác header, quá 500 bản ghi", $ref: "#/components/responses/Problem"}
  /v1/files:
    post:
      summary: Tải tệp minh chứng đã mã hóa phong bì (chỉ bản mã, ≤ 15 MB)
      operationId: uploadFile
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/DeviceID"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [meta, blob]
              properties:
                meta: {$ref: "#/components/schemas/SyncEnvelopeMeta"}
                blob: {type: string, format: binary, description: "Bản mã AES-256-GCM ‖ tag; SHA-256 phải bằng meta.sha256_ciphertext"}
                file_ref: {type: string, format: uuid, description: "Tùy chọn: UUIDv7 máy sinh để bản ghi evidence ngoại tuyến tham chiếu trước khi tải"}
            encoding:
              meta: {contentType: application/json}
      responses:
        "201":
          description: Đã lưu
          headers:
            Location: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SyncFileCreated"}
        "200":
          description: Cùng file_ref, cùng bản mã đã có
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SyncFileCreated"}
        "403": {description: "sync.device_unregistered | sync.device_revoked", $ref: "#/components/responses/Problem"}
        "409": {description: "sync.file_ref_taken", $ref: "#/components/responses/Problem"}
        "413": {$ref: "#/components/responses/Problem"}
        "422": {description: "validation_failed | sync.file_checksum_mismatch", $ref: "#/components/responses/Problem"}
        "503": {description: "sync.dependency_unavailable — chưa cấu hình kho đối tượng", $ref: "#/components/responses/Problem"}
  /v1/files/{ref}:
    get:
      summary: Siêu dữ liệu tệp + URL tải BẢN MÃ có hạn 5 phút (vai vault_evidence_viewer, có mục đích)
      operationId: getFile
      parameters:
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/Purpose"
      responses:
        "200":
          description: Siêu dữ liệu (gps, captured_at là dữ liệu cá nhân — không lưu đệm)
          content:
            application/json:
              schema:
                type: object
                required: [file, download_url, expires_at]
                properties:
                  file: {$ref: "#/components/schemas/SyncFile"}
                  download_url: {type: string, format: uri}
                  expires_at: {type: string, format: date-time}
        "400": {description: "sync.purpose_required", $ref: "#/components/responses/Problem"}
        "403": {description: "forbidden | sync.purpose_not_allowed | sync.consent_missing", $ref: "#/components/responses/Problem"}
        "404": {description: "sync.file_not_found", $ref: "#/components/responses/Problem"}
  /v1/files/{ref}/content:
    get:
      summary: Nội dung đã giải mã để hiển thị — kho định danh mở DEK theo mục đích; bản rõ chỉ trong bộ nhớ request
      operationId: getFileContent
      parameters:
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/Purpose"
      responses:
        "200":
          description: Bản rõ, Content-Type = content_type của tệp, Cache-Control no-store
          content:
            "*/*":
              schema: {type: string, format: binary}
        "400": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "410": {description: "vault.erased — hộ đã xóa định danh, tệp không còn mở được", $ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
  # Nền MRV G1 (mục 16). Danh mục trường bằng chứng chưa chốt (C-1): danh mục là dữ liệu có

  # phiên bản + phê duyệt (Admin API); mỗi minh chứng ghim phiên bản danh mục đã duyệt lúc thu.
  /v1/mrv/catalog:
    get:
      summary: Phiên bản danh mục trường ĐÃ DUYỆT của một loại minh chứng (app hiện trường dựng biểu mẫu)
      operationId: getMrvApprovedCatalog
      parameters:
        - {name: evidence_type, in: query, required: true, schema: {type: string, pattern: "^[a-z][a-z0-9_]{2,39}$", examples: [awd_log, field_checklist]}}
        - {name: version, in: query, description: "Bỏ trống = bản đã duyệt mới nhất", schema: {type: integer, minimum: 1}}
      responses:
        "200":
          description: Phiên bản danh mục
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MrvCatalogVersion"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/mrv/evidence-types:
    get:
      summary: Loại minh chứng đang dùng được (có danh mục ĐÃ DUYỆT) kèm phiên bản đã duyệt mới nhất
      description: |
        Cùng vai với GET /v1/mrv/catalog (mrv_collector, mrv_reviewer, mrv_viewer, mrv_exporter, param_setter,
        param_approver). App dùng để biết loại nào có biểu mẫu; nội dung danh mục tải qua GET /v1/mrv/catalog
        hoặc entity pull mrv_catalog. Sắp theo evidence_type.
      operationId: listMrvEvidenceTypes
      responses:
        "200":
          description: Danh sách loại minh chứng
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/MrvEvidenceType"}}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/mrv/evidence:
    post:
      summary: Ghi một minh chứng (hoặc bản ghi bù khi có supersedes_id) — kiểm theo phiên bản danh mục đã ghim
      description: |
        Vai mrv_collector, trong phạm vi xã (ADR-0009). Có household_ref → bắt buộc đồng ý mục đích
        mrv.evidence (mrv.consent_missing). Ảnh chỉ tham chiếu file_ref + sha256 ciphertext (ADR-0004).
        Toạ độ là dữ liệu cá nhân khi gắn với hộ — không ghi log.
      operationId: captureMrvEvidence
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MrvEvidenceInput"}
      responses:
        "201":
          description: Đã ghi
          headers:
            Location: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MrvEvidence"}
        "400": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
    get:
      summary: Bản hiện hành của các chuỗi minh chứng trong phạm vi (hàng chờ duyệt = review_status=pending)
      operationId: listMrvEvidence
      parameters:
        - {name: evidence_type, in: query, schema: {type: string}}
        - {name: admin_unit_code, in: query, schema: {type: string}}
        - {name: review_status, in: query, schema: {type: string, enum: [pending, accepted, rejected]}}
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        "200":
          description: Một trang
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/MrvEvidence"}}
                  next_cursor: {type: [string, "null"]}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/mrv/evidence/{id}:
    get:
      summary: Một phiên bản minh chứng kèm chuỗi sửa sai và các quyết định duyệt
      operationId: getMrvEvidence
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Minh chứng
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MrvEvidenceView"}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/mrv/evidence/{id}/reviews:
    post:
      summary: Quyết định duyệt của TTKN tỉnh cho bản hiện hành (KN US-MRV-05) — người duyệt ≠ người thu
      operationId: reviewMrvEvidence
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision, reason]
              properties:
                decision: {type: string, enum: [accepted, rejected], description: "accepted = Đạt chuẩn; rejected = Yêu cầu kiểm tra lại"}
                reason: {type: string, minLength: 5, maxLength: 1000}
      responses:
        "201":
          description: Đã ghi quyết định
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MrvReview"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/mrv/exports:
    post:
      summary: Yêu cầu xuất gói bằng chứng (mục 12) — 202 + job; worker dựng gói, lưu kèm băm ảnh chụp dữ liệu
      operationId: requestMrvExport
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filters: {$ref: "#/components/schemas/MrvExportFilters"}
      responses:
        "202":
          description: Đã nhận; theo dõi tại Location
          headers:
            Location: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MrvExport"}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/mrv/exports/{id}:
    get:
      summary: Trạng thái job xuất
      operationId: getMrvExport
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Job
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MrvExport"}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/mrv/exports/{id}/package:
    get:
      summary: URL tải gói có hạn (≤ 15 phút; không ghi log)
      operationId: getMrvExportPackage
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: URL có chữ ký
          content:
            application/json:
              schema:
                type: object
                required: [export_id, url, expires_at, package_sha256, snapshot_sha256]
                properties:
                  export_id: {type: string, format: uuid}
                  url: {type: string}
                  expires_at: {type: string, format: date-time}
                  package_sha256: {type: string}
                  snapshot_sha256: {type: string}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
  /v1/mrv/exports/{id}/verify:
    get:
      summary: Dựng lại ảnh chụp dữ liệu tại as_of từ sổ và so với snapshot_sha256 đã lưu
      operationId: verifyMrvExport
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Kết quả so băm
          content:
            application/json:
              schema:
                type: object
                required: [export_id, as_of, snapshot_sha256, rebuilt_sha256, match]
                properties:
                  export_id: {type: string, format: uuid}
                  as_of: {type: string, format: date-time}
                  snapshot_sha256: {type: string}
                  rebuilt_sha256: {type: string}
                  match: {type: boolean}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
  # Chỉ tài liệu ĐÃ XUẤT BẢN trong phạm vi người gọi: toàn quốc + tỉnh + xã của mình (ADR-0009).

  /v1/documents:
    get:
      summary: Tra cứu tài liệu đã xuất bản (KN US-LIB-04, HTX US-NEWS-01) — tìm không dấu, lọc loại/nhãn/chuyên mục
      operationId: listDocuments
      tags: [content]
      parameters:
        - {name: kind, in: query, schema: {$ref: "#/components/schemas/ContentKind"}}
        - {name: tag, in: query, description: "Nhãn '<danh mục>:<mã>', vd farm_stage:sowing", schema: {type: string}}
        - {name: category, in: query, schema: {type: string}}
        - {name: q, in: query, description: "Từ khóa; không phân biệt dấu (\"lua\" khớp \"lúa\"), khớp tiền tố từng từ", schema: {type: string}}
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        "200":
          description: Một trang, mới xuất bản trước
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/ContentDocument"}}
                  next_cursor: {type: [string, "null"]}
        "401": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "503": {description: content.dependency_unavailable, $ref: "#/components/responses/Problem"}
  /v1/documents/{ref}:
    get:
      summary: Bản xuất bản hiện hành, tệp đính kèm (URL có hạn ≤ 15 phút) và hướng dẫn đặc thù địa phương trong phạm vi (KN FR-13)
      operationId: getDocument
      tags: [content]
      parameters:
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Tài liệu
          content:
            application/json:
              schema:
                type: object
                required: [document, version, supplements]
                properties:
                  document: {$ref: "#/components/schemas/ContentDocument"}
                  version: {$ref: "#/components/schemas/ContentVersion"}
                  supplements:
                    type: array
                    items:
                      type: object
                      properties:
                        ref: {type: string, format: uuid}
                        title: {type: string}
                        province_code: {type: [string, "null"]}
                        published_at: {type: [string, "null"], format: date-time}
        "404": {description: "content.document_not_found — không có, chưa xuất bản, đã gỡ hoặc ngoài phạm vi", $ref: "#/components/responses/Problem"}
  /v1/documents/{ref}/versions:
    get:
      summary: Các phiên bản đã từng xuất bản (hiện hành + bị thay) — xuất bản bản mới không xóa bản cũ
      operationId: listDocumentVersions
      tags: [content]
      parameters:
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Lịch sử
          content:
            application/json:
              schema:
                type: object
                required: [document_ref, items]
                properties:
                  document_ref: {type: string, format: uuid}
                  items: {type: array, items: {$ref: "#/components/schemas/ContentVersionInfo"}}
        "404": {$ref: "#/components/responses/Problem"}
  # --- hết pf/content ---

  /v1/plots:
    get:
      summary: Thửa trong khung nhìn (GIS FN-07 BR-24/25) — GeoJSON FeatureCollection, tối đa 1.000 polygon, lọc theo phạm vi xã/HTX
      operationId: listPlotsInBBox
      parameters:
        - {name: bbox, in: query, required: true, description: "minLon,minLat,maxLon,maxLat (WGS84)", schema: {type: string, examples: ["105.55,10.00,105.70,10.15"]}}
        - {name: zoom, in: query, description: "Mức zoom web-mercator; < 17 thì hình được đơn giản hóa (nửa điểm ảnh)", schema: {type: integer, minimum: 0, maximum: 22, default: 17}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 1000, default: 1000}}
      responses:
        "200":
          description: Thửa chưa ngừng dùng giao khung nhìn. truncated = true khi còn thửa vượt limit (hãy zoom sâu hơn).
          content:
            application/json:
              schema:
                type: object
                required: [type, features, truncated, limit]
                properties:
                  type: {type: string, enum: [FeatureCollection]}
                  features: {type: array, items: {$ref: "#/components/schemas/PlotFeature"}}
                  truncated: {type: boolean}
                  limit: {type: integer}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
    post:
      summary: Tạo thửa với ranh giới đầu tiên (KN US-PLOT-01, HTX US-PLOT-02/03). Chồng lấn HTX khác vượt ngưỡng → 409 geo.overlap_cross_coop (không bỏ qua được); cùng HTX/thửa nháp hoặc lệch diện tích khai báo > 5 % → 409 geo.overlap_needs_confirm / geo.area_deviation_needs_confirm, trừ khi confirm_overlap = true (khi đó mở xung đột xem xét)
      operationId: createPlot
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PlotCreateInput"}
      responses:
        "201":
          description: Đã tạo
          headers:
            Location: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PlotWriteResult"}
        "403": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
  /v1/plots/overlap-check:
    post:
      summary: Kiểm trước một ranh giới (KN US-PLOT-03 — cảnh báo ngay khi vẽ); chạy đủ kiểm tra như khi lưu nhưng không ghi
      operationId: checkPlotOverlap
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [geometry, commune_code]
              properties:
                geometry: {$ref: "#/components/schemas/PolygonGeometry"}
                commune_code: {type: string}
                cooperative_ref: {type: [string, "null"], format: uuid}
                exclude_plot_ref: {type: [string, "null"], format: uuid, description: "Thửa đang sửa (không tự so với chính nó)"}
                declared_area_ha: {$ref: "#/components/schemas/Decimal"}
      responses:
        "200":
          description: Kết quả kiểm
          content:
            application/json:
              schema:
                type: object
                required: [area_ha, point_count, tolerance_pct, blocking, needs_confirm, deviation_pct, deviation_needs_confirm, can_save, requires_confirm]
                properties:
                  area_ha: {$ref: "#/components/schemas/Decimal"}
                  point_count: {type: integer}
                  tolerance_pct: {$ref: "#/components/schemas/Decimal"}
                  blocking: {type: array, items: {$ref: "#/components/schemas/PlotOverlap"}, description: "HTX khác — bị chặn khi lưu (geo.overlap_cross_coop)"}
                  needs_confirm: {type: array, items: {$ref: "#/components/schemas/PlotOverlap"}, description: "Cùng HTX / thửa nháp — lưu được khi confirm_overlap = true"}
                  deviation_pct: {oneOf: [{$ref: "#/components/schemas/Decimal"}, {type: "null"}], description: "Lệch so với declared_area_ha (%)"}
                  deviation_needs_confirm: {type: boolean}
                  can_save: {type: boolean, description: "Không có chồng lấn HTX khác"}
                  requires_confirm: {type: boolean, description: "Lưu được nhưng phải gửi confirm_overlap = true"}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/plots/{ref}:
    get:
      summary: Thửa kèm toàn bộ phiên bản ranh giới (lịch sử chỉ đọc) và xung đột; ngoài phạm vi → 404
      operationId: getPlot
      parameters:
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Thửa
          content:
            application/json:
              schema:
                type: object
                required: [plot, versions, conflicts]
                properties:
                  plot: {$ref: "#/components/schemas/PlotFeature"}
                  versions: {type: array, items: {$ref: "#/components/schemas/PlotBoundaryVersion"}}
                  conflicts: {type: array, items: {$ref: "#/components/schemas/BoundaryConflict"}}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/plots/{ref}/boundaries:
    post:
      summary: Sửa ranh giới = phiên bản mới (bản ghi bù) trỏ supersedes_id về phiên bản hiện hành; phiên bản cũ giữ nguyên
      operationId: correctPlotBoundary
      parameters:
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PlotCorrectInput"}
      responses:
        "201":
          description: Đã ghi phiên bản mới
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PlotWriteResult"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {description: "geo.overlap_cross_coop, geo.overlap_needs_confirm, geo.area_deviation_needs_confirm, geo.version_conflict (supersedes_id không phải phiên bản hiện hành; kèm current_boundary_id), geo.plot_state_conflict", content: {application/problem+json: {schema: {$ref: "#/components/schemas/Problem"}}}}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/plots/{ref}/assign:
    post:
      summary: Gán thửa cho HTX / nông hộ (HTX US-PLOT-01 AC-3 — mỗi thửa đúng một HTX); cooperative_ref = null → về nháp. Quản lý HTX chỉ nhận thửa về HTX mình
      operationId: assignPlot
      parameters:
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                cooperative_ref: {type: [string, "null"], format: uuid}
                household_ref: {type: [string, "null"], format: uuid}
                reason: {type: string}
                confirm_overlap: {type: boolean, default: false, description: "Gán HTX mới làm đổi phân loại chồng lấn: HTX khác → 409 geo.overlap_cross_coop; cùng HTX/thửa nháp → cần xác nhận"}
      responses:
        "200":
          description: Đã gán
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PlotAttrResult"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/plots/{ref}/retire:
    post:
      summary: Ngừng dùng thửa (xóa mềm, GIS BR-17) — ẩn khỏi bản đồ, giữ toàn bộ lịch sử; lý do ≥ 10 ký tự
      operationId: retirePlot
      parameters:
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string, minLength: 10}
      responses:
        "200":
          description: Đã ngừng dùng
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PlotAttrResult"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/plots/{ref}/restore:
    post:
      summary: Khôi phục thửa đã ngừng dùng (GIS BR-17) — sự kiện mới 'restored' kèm lý do ≥ 10 ký tự; kiểm lại chồng lấn như khi gán
      operationId: restorePlot
      parameters:
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string, minLength: 10}
                confirm_overlap: {type: boolean, default: false, description: "Xác nhận giữ nguyên khi chồng lấn thửa cùng HTX/thửa nháp"}
      responses:
        "200":
          description: Đã khôi phục
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PlotAttrResult"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/cooperatives/{ref}/plots:
    get:
      summary: Thửa của một HTX (HTX US-PLOT-01), phân trang cursor
      operationId: listCooperativePlots
      parameters:
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 1000, default: 200}}
      responses:
        "200":
          description: Một trang
          content:
            application/json:
              schema:
                type: object
                required: [type, features, next_cursor]
                properties:
                  type: {type: string, enum: [FeatureCollection]}
                  features: {type: array, items: {$ref: "#/components/schemas/PlotFeature"}}
                  next_cursor: {type: [string, "null"]}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/geo/conflicts:
    get:
      summary: Xung đột ranh giới chờ xử lý trong phạm vi (mục 15 — người phụ trách + SLA tạm 72 giờ)
      operationId: listBoundaryConflicts
      parameters:
        - {name: status, in: query, schema: {type: string, enum: [open, resolved]}}
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        "200":
          description: Một trang
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/BoundaryConflict"}}
                  next_cursor: {type: [string, "null"]}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/geo/conflicts/{id}/resolve:
    post:
      summary: Đóng xung đột kèm ghi chú (≥ 10 ký tự); sửa hình nếu cần là một phiên bản ranh giới mới
      operationId: resolveBoundaryConflict
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note]
              properties:
                note: {type: string, minLength: 10}
      responses:
        "200":
          description: Đã đóng
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BoundaryConflict"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/geo/admin-boundaries/{code}:
    get:
      summary: Ranh giới hành chính dùng chung hiện hành của tỉnh/xã (GIS FN-07 BR-21), GeoJSON Feature
      operationId: getAdminBoundary
      parameters:
        - $ref: "#/components/parameters/UnitCode"
        - {name: zoom, in: query, schema: {type: integer, minimum: 0, maximum: 22, default: 12}}
      responses:
        "200":
          description: Ranh giới
          content:
            application/json:
              schema:
                type: object
                required: [type, id, geometry, properties]
                properties:
                  type: {type: string, enum: [Feature]}
                  id: {type: string}
                  geometry: {$ref: "#/components/schemas/PolygonGeometry"}
                  properties:
                    type: object
                    required: [code, level, name, source, area_ha, imported_at]
                    properties:
                      code: {type: string}
                      level: {type: string, enum: [province, commune]}
                      name: {type: string}
                      source: {type: string}
                      area_ha: {$ref: "#/components/schemas/Decimal"}
                      imported_at: {type: string, format: date-time}
        "404": {$ref: "#/components/responses/Problem"}
  # Nghiệp vụ khuyến nông (ADR-0011): nhiệm vụ hỗ trợ + SLA, chỉ đạo khẩn, báo cáo hiện trường,

  # dashboard 4 KPI, danh bạ trực. Vai: kn_officer, kn_province_admin, kn_national_admin,

  # coop_manager (tạo yêu cầu cho HTX mình, xem danh bạ). Phạm vi TW → Tỉnh → Xã (ADR-0009):

  # ngoài phạm vi đọc → 404, ghi → 403 extension.out_of_scope.
  /v1/extension/tasks:
    post:
      summary: Tạo nhiệm vụ hỗ trợ — due_at = lúc tạo + SLA (tham số extension.task_sla_hours tại thời điểm tạo, mặc định 24 giờ)
      operationId: extCreateTask
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ExtTaskInput"}
      responses:
        "201":
          description: Đã tạo
          headers:
            Location: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ExtTask"}
        "403": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
    get:
      summary: Nhiệm vụ trong phạm vi (US-TASK-03) — lọc trạng thái, ưu tiên, cán bộ, quá hạn
      operationId: extListTasks
      parameters:
        - {name: status, in: query, schema: {type: string, enum: [new, assigned, accepted, in_progress, resolved]}}
        - {name: priority, in: query, schema: {type: string, enum: [low, normal, high, urgent]}}
        - {name: assignee_ref, in: query, schema: {type: string, format: uuid}}
        - {name: mine, in: query, schema: {type: boolean}, description: "Chỉ nhiệm vụ giao cho mình"}
        - {name: overdue, in: query, schema: {type: boolean}}
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        "200":
          description: Một trang
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/ExtTask"}}
                  next_cursor: {type: [string, "null"]}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/extension/tasks/bulk-assign:
    post:
      summary: Phân công hàng loạt trong một lần xác nhận (US-TASK-04) — chia vòng tròn; một nhiệm vụ lỗi thì cả lô không đổi
      operationId: extBulkAssign
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [task_ids, assignee_refs]
              properties:
                task_ids: {type: array, minItems: 1, maxItems: 200, items: {type: string, format: uuid}}
                assignee_refs: {type: array, minItems: 1, maxItems: 50, items: {type: string, format: uuid}}
      responses:
        "200":
          description: Đã phân công
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/ExtTask"}}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/extension/tasks/{id}:
    get:
      operationId: extGetTask
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Nhiệm vụ kèm lịch sử sự việc (sổ chỉ ghi thêm)
          content:
            application/json:
              schema:
                type: object
                required: [task, events]
                properties:
                  task: {$ref: "#/components/schemas/ExtTask"}
                  events: {type: array, items: {$ref: "#/components/schemas/ExtTaskEvent"}}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/extension/tasks/{id}/assign:
    post:
      summary: Phân công (hoặc phân công lại) cho cán bộ phụ trách xã/tỉnh của nhiệm vụ
      operationId: extAssignTask
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assignee_ref]
              properties:
                assignee_ref: {type: string, format: uuid}
                note: {type: string, maxLength: 2000}
      responses:
        "200": {$ref: "#/components/responses/ExtTaskWritten"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/extension/tasks/{id}/status:
    post:
      summary: Ghi sự việc — tiếp nhận, tiến độ, hoàn thành (bắt buộc kết quả ≥ 10 ký tự), chuyển tiếp lên tỉnh, mở lại
      operationId: extUpdateTaskStatus
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: {type: string, enum: [accepted, progress, resolved, escalated, reopened]}
                note: {type: string, maxLength: 2000, description: "Không ghi SĐT/CCCD (R-04)"}
                event_time: {type: string, format: date-time}
      responses:
        "200": {$ref: "#/components/responses/ExtTaskWritten"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/extension/directives:
    post:
      summary: Ban hành chỉ đạo khẩn tới đúng vùng đã chọn (US-TASK-03) — phát pf.extension.directive.issued
      operationId: extIssueDirective
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, body, audience_units]
              properties:
                title: {type: string, minLength: 5, maxLength: 200}
                body: {type: string, minLength: 10, maxLength: 5000}
                severity: {type: string, enum: [urgent, normal], default: urgent}
                audience_units: {type: array, minItems: 1, maxItems: 500, items: {type: string}, description: "Mã tỉnh/xã nhận, trong phạm vi người ban hành"}
                expires_at: {type: string, format: date-time}
      responses:
        "201":
          description: Đã ban hành
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ExtDirective"}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
    get:
      summary: Chỉ đạo mình nhận; cấp giám sát thấy thêm chỉ đạo có vùng nhận trong phạm vi (mới nhất trước)
      operationId: extListDirectives
      parameters:
        - {name: mine, in: query, schema: {type: boolean}}
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        "200":
          description: Một trang
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/ExtDirective"}}
                  next_cursor: {type: [string, "null"]}
  /v1/extension/directives/{id}:
    get:
      operationId: extGetDirective
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Chỉ đạo; pending_targets chỉ có với cấp giám sát
          content:
            application/json:
              schema:
                type: object
                required: [directive, pending_targets]
                properties:
                  directive: {$ref: "#/components/schemas/ExtDirective"}
                  pending_targets:
                    type: [array, "null"]
                    items:
                      type: object
                      properties:
                        actor_ref: {type: string, format: uuid}
                        unit_code: {type: string}
                        province_code: {type: string}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/extension/directives/{id}/ack:
    post:
      summary: Xác nhận đã đọc (chỉ người nhận; gọi lặp giữ lần đầu)
      operationId: extAckDirective
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Đã xác nhận
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ExtDirective"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/extension/field-reports:
    post:
      summary: Gửi báo cáo hiện trường (FR-01 gieo sạ, FR-02 sinh trưởng/sâu bệnh). Kỳ mở — gửi lại cùng khóa là phiên bản mới; kỳ đã chốt → 409
      operationId: extCreateFieldReport
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/ExtFieldReportInput"
                - type: object
                  properties:
                    id: {type: string, format: uuid, description: "UUIDv7 do máy sinh"}
                    event_time: {type: string, format: date-time}
      responses:
        "201":
          description: Đã ghi
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ExtFieldReport"}
        "403": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
    get:
      summary: Phiên bản hiện hành trong phạm vi
      operationId: extListFieldReports
      parameters:
        - {name: period, in: query, schema: {type: string, pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$"}}
        - {name: kind, in: query, schema: {type: string, enum: [sowing_progress, growth_pest]}}
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        "200":
          description: Một trang
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/ExtFieldReport"}}
                  next_cursor: {type: [string, "null"]}
  /v1/extension/field-reports/{id}:
    get:
      operationId: extGetFieldReport
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Phiên bản kèm mọi phiên bản cùng khóa
          content:
            application/json:
              schema:
                type: object
                required: [report, versions]
                properties:
                  report: {$ref: "#/components/schemas/ExtFieldReport"}
                  versions: {type: array, items: {$ref: "#/components/schemas/ExtFieldReport"}}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/extension/field-reports/{id}/corrections:
    post:
      summary: Bản ghi bù cho phiên bản hiện hành — bắt buộc correction_reason ≥ 10 ký tự (US-DASH-02 AC-2)
      operationId: extCorrectFieldReport
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [correction_reason]
              properties:
                correction_reason: {type: string, minLength: 10}
                sown_area_ha: {$ref: "#/components/schemas/Decimal"}
                sown_on: {type: string, format: date}
                growth_stage: {type: string}
                pest_code: {type: string}
                severity: {type: string, enum: [nhe, trung_binh, nang]}
                affected_area_ha: {$ref: "#/components/schemas/Decimal"}
                urgent: {type: boolean}
                note: {type: string}
                event_time: {type: string, format: date-time}
      responses:
        "201":
          description: Đã ghi phiên bản mới
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ExtFieldReport"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/extension/report-periods/close:
    post:
      summary: Chốt kỳ báo cáo của một tỉnh (FR-05) — TTKN tỉnh/QG; chốt lặp trả 200
      operationId: extClosePeriod
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [period, province_code]
              properties:
                period: {type: string, pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$"}
                province_code: {type: string}
                note: {type: string}
      responses:
        "201": {description: Đã chốt}
        "200": {description: Đã chốt trước đó}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/extension/program-reports:
    post:
      summary: FR-03 báo cáo tiến độ Đề án 1 triệu ha của một HTX × vụ (gửi lại = phiên bản mới, phải duyệt lại)
      operationId: submitProgramReport
      tags: [extension]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [commune_code, cooperative_ref, season_code, season_year, registered_area_ha, deploying_area_ha, completed_area_ha]
              properties:
                id: {type: string, format: uuid}
                commune_code: {type: string}
                cooperative_ref: {type: string, format: uuid}
                season_code: {type: string}
                season_year: {type: integer}
                registered_area_ha: {type: string, description: "decimal (ha)"}
                deploying_area_ha: {type: string, description: "decimal; đang triển khai + hoàn thành ≤ đăng ký"}
                completed_area_ha: {type: string}
                note: {type: string, maxLength: 2000}
                event_time: {type: string, format: date-time}
      responses:
        "201": {description: Đã ghi phiên bản}
        "200": {description: Gọi lặp cùng Idempotency-Key}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/extension/program-reports/{id}/approve:
    post:
      summary: Admin tỉnh duyệt phiên bản hiện hành (không duyệt báo cáo do chính mình gửi — R-56)
      operationId: approveProgramReport
      tags: [extension]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                note: {type: string, maxLength: 500}
      responses:
        "200": {description: Đã duyệt}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
  /v1/extension/program-progress:
    get:
      summary: Tiến độ Đề án theo HTX × vụ trong phạm vi, kèm mục tiêu tỉnh (tham số extension.program_target_ha:<tỉnh>)
      operationId: getProgramProgress
      tags: [extension]
      parameters:
        - {name: unit, in: query, schema: {type: string}}
        - {name: season_code, in: query, schema: {type: string}}
        - {name: season_year, in: query, schema: {type: integer}}
      responses:
        "200":
          description: Tiến độ
          content:
            application/json:
              schema:
                type: object
                required: [items, targets, unapproved, provisional]
                properties:
                  items: {type: array, items: {type: object}}
                  targets: {type: object, additionalProperties: {type: [string, "null"]}}
                  unapproved: {type: integer}
                  provisional: {type: boolean}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/extension/dashboard:
    get:
      summary: 4 KPI theo phạm vi (US-DASH-01) — tổng luôn bằng tổng các đơn vị con; thiếu báo cáo xã → provisional "Số liệu tạm tính"
      operationId: extDashboard
      parameters:
        - {name: unit, in: query, schema: {type: string}, description: "Mã tỉnh/xã; bỏ trống = toàn quốc (nếu được) hoặc đơn vị phụ trách"}
        - {name: period, in: query, schema: {type: string, pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$"}, description: "Mặc định tháng hiện tại (giờ Việt Nam)"}
      responses:
        "200":
          description: Dashboard
          content:
            application/json:
              schema:
                type: object
                required: [unit, level, period, as_of, total, period_closed, closed_provinces, children]
                properties:
                  unit: {type: [string, "null"]}
                  level: {type: string, enum: [national, province, commune]}
                  period: {type: string}
                  as_of: {type: string, format: date-time}
                  total: {$ref: "#/components/schemas/ExtKPI"}
                  period_closed: {type: boolean}
                  closed_provinces: {type: array, items: {type: string}}
                  children:
                    type: array
                    items:
                      type: object
                      required: [unit, kpi]
                      properties:
                        unit: {type: string, description: "Tỉnh (với toàn quốc) hoặc xã"}
                        kpi: {$ref: "#/components/schemas/ExtKPI"}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/extension/staff:
    post:
      summary: Ghi cán bộ vào danh bạ trực — TTKN tỉnh/QG cho cán bộ trong phạm vi; cán bộ xã tự khai cho mình
      operationId: extUpsertStaff
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [actor_ref, unit_code, role_title, display_name]
              properties:
                actor_ref: {type: string, format: uuid, description: "sub của tài khoản cán bộ"}
                unit_code: {type: string}
                role_title: {type: string}
                display_name: {type: string, description: "Tên cán bộ (danh bạ công vụ, không ghi log)"}
                active: {type: boolean, default: true}
      responses:
        "200":
          description: Đã ghi
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ExtStaff"}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/extension/roster:
    get:
      summary: Danh bạ trực theo địa bàn (US-DIR-02) — không ai đang trực → fallback là cán bộ TTKN tỉnh
      operationId: extRoster
      parameters:
        - {name: unit, in: query, schema: {type: string}}
      responses:
        "200":
          description: Danh bạ
          content:
            application/json:
              schema:
                type: object
                required: [unit, on_duty, items, fallback]
                properties:
                  unit: {type: [string, "null"]}
                  on_duty: {type: integer}
                  items: {type: array, items: {$ref: "#/components/schemas/ExtRosterEntry"}}
                  fallback: {type: array, items: {$ref: "#/components/schemas/ExtRosterEntry"}}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/extension/roster/{id}/contact:
    get:
      summary: >-
        Số điện thoại của cán bộ để gọi/nhắn 1 chạm (US-DIR-02) — đọc từ tài khoản (pf/accounts) lúc bấm,
        không lưu ở pf, phản hồi Cache-Control no-store. Chỉ cán bộ người gọi thấy trong danh bạ (kể cả cán bộ tỉnh dự phòng)
      operationId: extRosterContact
      parameters:
        - {name: id, in: path, required: true, description: actor_ref của cán bộ, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Số liên hệ
          content:
            application/json:
              schema:
                type: object
                required: [actor_ref, phone]
                properties:
                  actor_ref: {type: string, format: uuid}
                  phone: {type: string, description: "Số điện thoại công vụ (PII — không lưu ở máy khách)"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
  /v1/extension/roster/status:
    post:
      summary: Tự cập nhật trạng thái trực (US-DIR-01); hết hạn sau extension.duty_status_ttl_hours → unknown
      operationId: extSetDutyStatus
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: {type: string, enum: [on_duty, off_duty]}
      responses:
        "201":
          description: Đã ghi
          content:
            application/json:
              schema:
                type: object
                required: [status, set_at, valid_until]
                properties:
                  status: {type: string, enum: [on_duty, off_duty]}
                  set_at: {type: string, format: date-time}
                  valid_until: {type: string, format: date-time}
        "404": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/extension/roster/shifts:
    post:
      summary: Khai báo ca trực cho cán bộ trong tỉnh (US-DIR-03)
      operationId: extAddShift
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [actor_ref, starts_at, ends_at]
              properties:
                actor_ref: {type: string, format: uuid}
                starts_at: {type: string, format: date-time}
                ends_at: {type: string, format: date-time}
      responses:
        "201": {description: Đã ghi}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  # Số liệu cân đối/báo cáo/dashboard đọc KẾT QUẢ ĐÃ LƯU theo vụ (FN-10 BR-04), không tính lại.

  # Phạm vi không phải toàn vùng: danh sách máy/chủ sở hữu/diện tích phải lọc theo cooperative_ref trong phạm vi.
  /v1/mechanization/owners:
    get:
      summary: Chủ sở hữu máy (FN-04) — nhãn đã che từ kho định danh, số máy đang hoạt động
      operationId: mechListOwners
      parameters:
        - {name: cooperative_ref, in: query, schema: {type: string, format: uuid}}
        - {name: owner_type, in: query, schema: {$ref: "#/components/schemas/MechOwnerType"}}
        - {name: include_inactive, in: query, schema: {type: boolean, default: false}}
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        "200":
          description: Một trang
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/MechOwner"}}
                  next_cursor: {type: [string, "null"]}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/mechanization/owners/{id}:
    get:
      summary: Một chủ sở hữu
      operationId: mechGetOwner
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Chủ sở hữu
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MechOwner"}
        "404": {description: mechanization.owner_not_found, $ref: "#/components/responses/Problem"}
  /v1/mechanization/machines:
    get:
      summary: Máy móc – thiết bị (FN-05 B1) kèm tình trạng và nhãn nguồn
      operationId: mechListMachines
      parameters:
        - {name: cooperative_ref, in: query, schema: {type: string, format: uuid}}
        - {name: owner_id, in: query, schema: {type: string, format: uuid}}
        - {name: farm_stage, in: query, schema: {type: string}}
        - {name: machine_type, in: query, schema: {type: string}}
        - {name: status, in: query, schema: {$ref: "#/components/schemas/MechMachineStatus"}}
        - {name: include_inactive, in: query, schema: {type: boolean, default: false}}
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        "200":
          description: Một trang
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/MechMachine"}}
                  next_cursor: {type: [string, "null"]}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/mechanization/machines/{ref}:
    get:
      summary: Một máy
      operationId: mechGetMachine
      parameters:
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Máy
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MechMachine"}
        "404": {description: mechanization.machine_not_found, $ref: "#/components/responses/Problem"}
  /v1/mechanization/cooperatives/{ref}/machine-count:
    get:
      summary: Số máy của HTX tại một ngày trong quá khứ (FN-05 BR-09, US-MAC-03)
      description: Đếm máy có Ngày HTX sở hữu ≤ T và (chưa vô hiệu hóa hoặc Ngày vô hiệu hóa > T); tình trạng tại T đọc từ sổ biến động.
      operationId: mechMachineCount
      parameters:
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: at, in: query, required: true, schema: {type: string, format: date}}
      responses:
        "200":
          description: Số máy
          content:
            application/json:
              schema:
                type: object
                required: [cooperative_ref, at, total, active, by_stage]
                properties:
                  cooperative_ref: {type: string, format: uuid}
                  at: {type: string, format: date}
                  total: {type: integer}
                  active: {type: integer, description: "Máy \"Hoạt động\" — tính vào năng lực (FN-05 BR-04)"}
                  by_stage:
                    type: array
                    items:
                      type: object
                      required: [farm_stage, machine_type, total, by_status]
                      properties:
                        farm_stage: {type: string}
                        machine_type: {type: string}
                        total: {type: integer}
                        by_status: {type: object, additionalProperties: {type: integer}}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/mechanization/cooperatives/{ref}/panel:
    get:
      summary: Panel chi tiết HTX trên bản đồ (FN-08 B5) — máy theo khâu, chủ sở hữu (nhãn đã che), mức đáp ứng đã lưu
      operationId: mechCooperativePanel
      parameters:
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: season_code, in: query, schema: {type: string}}
        - {name: season_year, in: query, schema: {type: integer}}
        - {name: run_id, in: query, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Panel
          content:
            application/json:
              schema:
                type: object
                required: [cooperative_ref, name, commune_code, province_code, machines, coverage, run]
                properties:
                  cooperative_ref: {type: string, format: uuid}
                  name: {type: string}
                  commune_code: {type: [string, "null"]}
                  province_code: {type: [string, "null"]}
                  note: {type: string, enum: ["Chưa có máy"]}
                  machines:
                    type: array
                    items:
                      allOf:
                        - $ref: "#/components/schemas/MechMachine"
                        - type: object
                          required: [owner_code, owner_label, owner_masked_phone]
                          properties:
                            owner_code: {type: string}
                            owner_label: {type: string, description: "Nhãn đã che (mục 10.4)"}
                            owner_masked_phone: {type: string}
                  coverage: {oneOf: [{$ref: "#/components/schemas/MechCoverageItem"}, {type: "null"}]}
                  run: {oneOf: [{$ref: "#/components/schemas/MechRun"}, {type: "null"}]}
        "422": {description: mechanization.cooperative_invalid, $ref: "#/components/responses/Problem"}
  /v1/mechanization/season-areas:
    get:
      summary: Diện tích canh tác & lịch mùa vụ theo HTX × vụ, kèm nhãn nguồn [App HTX]/[Nhập tay] và cờ khóa (FN-06)
      operationId: mechListSeasonAreas
      parameters:
        - {name: season_code, in: query, required: true, schema: {type: string}}
        - {name: season_year, in: query, required: true, schema: {type: integer}}
        - {name: cooperative_ref, in: query, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Danh sách
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/MechSeasonArea"}}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/mechanization/balance-runs:
    get:
      summary: Các lần cân đối đã lưu (mới nhất trước)
      operationId: mechListBalanceRuns
      parameters:
        - {name: season_code, in: query, schema: {type: string}}
        - {name: season_year, in: query, schema: {type: integer}}
      responses:
        "200":
          description: Danh sách
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/MechRun"}}
  /v1/mechanization/balance-runs/{id}:
    get:
      summary: Một lần cân đối và các dòng HTX × khâu × chủng loại đã lưu (bất biến)
      operationId: mechGetBalanceRun
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: province_code, in: query, schema: {type: string}}
        - {name: commune_code, in: query, schema: {type: string}}
        - {name: cooperative_ref, in: query, schema: {type: string, format: uuid}}
        - {name: farm_stage, in: query, schema: {type: string}}
        - {name: machine_type, in: query, schema: {type: string}}
      responses:
        "200":
          description: Kết quả
          content:
            application/json:
              schema:
                type: object
                required: [run, results]
                properties:
                  run: {$ref: "#/components/schemas/MechRun"}
                  results: {type: array, items: {$ref: "#/components/schemas/MechResult"}}
        "404": {description: mechanization.run_not_found, $ref: "#/components/responses/Problem"}
  /v1/mechanization/coverage:
    get:
      summary: Mức đáp ứng theo tỉnh → xã → HTX, kèm màu và chú giải (FN-08, FN-10 tab Tổng hợp/Thiếu hụt)
      description: |
        Đọc lần cân đối run_id, hoặc lần mới nhất của (season_code, season_year), hoặc mới nhất mọi vụ.
        Mức của một đơn vị là mức của khâu thấp nhất; nhu cầu/năng lực là tổng. Mức đáp ứng không cắt ở 100% (Thừa ≥ ngưỡng).
      operationId: mechCoverage
      parameters:
        - {name: level, in: query, schema: {type: string, enum: [province, commune, cooperative], default: province}}
        - {name: season_code, in: query, schema: {type: string}}
        - {name: season_year, in: query, schema: {type: integer}}
        - {name: run_id, in: query, schema: {type: string, format: uuid}}
        - {name: province_code, in: query, schema: {type: string}}
        - {name: commune_code, in: query, schema: {type: string}}
        - {name: farm_stage, in: query, schema: {type: string}}
        - {name: machine_type, in: query, schema: {type: string}}
      responses:
        "200":
          description: Tổng hợp
          content:
            application/json:
              schema:
                type: object
                required: [run, level, summary, stages, items, legend]
                properties:
                  run: {$ref: "#/components/schemas/MechRun"}
                  level: {type: string}
                  summary: {$ref: "#/components/schemas/MechGroup"}
                  stages: {type: object, additionalProperties: {$ref: "#/components/schemas/MechGroup"}}
                  items: {type: array, items: {$ref: "#/components/schemas/MechCoverageItem"}}
                  legend:
                    type: array
                    items:
                      type: object
                      required: [status, label, color]
                      properties:
                        status: {$ref: "#/components/schemas/MechCoverageStatus"}
                        label: {type: string}
                        color: {type: string}
        "404": {description: mechanization.run_not_found, $ref: "#/components/responses/Problem"}
  /v1/mechanization/dashboard:
    get:
      summary: Dashboard (FN-11) — 4 thẻ chỉ số và bảng "HTX cần ưu tiên" (mức đáp ứng thấp nhất trước)
      operationId: mechDashboard
      parameters:
        - {name: season_code, in: query, schema: {type: string}}
        - {name: season_year, in: query, schema: {type: integer}}
        - {name: run_id, in: query, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Dashboard
          content:
            application/json:
              schema:
                type: object
                required: [kpis, cooperatives_by_status, priority, run]
                properties:
                  kpis:
                    type: object
                    required: [total_machines, total_cooperatives, cooperatives_sufficient, cooperatives_shortage]
                    properties:
                      total_machines: {type: integer}
                      total_cooperatives: {type: integer}
                      cooperatives_sufficient: {type: integer, description: "Đủ hoặc Thừa"}
                      cooperatives_shortage: {type: integer}
                  cooperatives_by_status: {type: object, additionalProperties: {type: integer}}
                  priority: {type: array, items: {$ref: "#/components/schemas/MechCoverageItem"}}
                  run: {oneOf: [{$ref: "#/components/schemas/MechRun"}, {type: "null"}]}
  /v1/mechanization/trend:
    get:
      summary: Xu hướng nhiều năm theo vụ đã lưu (FN-11 B3) — lần cân đối mới nhất của mỗi vụ
      operationId: mechTrend
      parameters:
        - {name: season_code, in: query, schema: {type: string}}
        - {name: farm_stage, in: query, schema: {type: string}}
      responses:
        "200":
          description: Chuỗi theo vụ
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [run, summary, stages, cooperatives_by_status]
                      properties:
                        run: {$ref: "#/components/schemas/MechRun"}
                        summary: {$ref: "#/components/schemas/MechGroup"}
                        stages: {type: object, additionalProperties: {$ref: "#/components/schemas/MechGroup"}}
                        cooperatives_by_status: {type: object, additionalProperties: {type: integer}}
  # --- hết pf/mechanization ---

  # --- pf/notify --- (ADR-0015: hộp thư trong app; đẩy CHỈ dữ liệu; đồng bộ ngay)
  /v1/notifications:
    get:
      summary: Hộp thư của người gọi (cá nhân + chủ đề theo phạm vi/vai/tổ chức), mới nhất trước
      operationId: listNotifications
      parameters:
        - {name: cursor, in: query, description: "next_cursor của trang trước", schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
        - {name: unread, in: query, description: "true = chỉ chưa đọc", schema: {type: boolean}}
      responses:
        "200":
          description: Một trang. Thông báo chủ đề cũ hơn 90 ngày không hiện.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/Notification"}}
                  next_cursor: {type: [string, "null"]}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/notifications/unread-count:
    get:
      summary: Số thông báo chưa đọc (huy hiệu)
      operationId: notificationUnreadCount
      responses:
        "200":
          description: Đếm
          content:
            application/json:
              schema: {type: object, required: [unread], properties: {unread: {type: integer, minimum: 0}}}
  /v1/notifications/read-all:
    post:
      summary: Đánh dấu đã đọc mọi thông báo người gọi thấy được
      operationId: readAllNotifications
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Số đã đánh dấu
          content:
            application/json:
              schema: {type: object, required: [marked], properties: {marked: {type: integer, minimum: 0}}}
  /v1/notifications/{id}/read:
    post:
      summary: Đánh dấu đã đọc một thông báo (đọc lại giữ read_at lần đầu)
      operationId: readNotification
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Thông báo sau khi đọc
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Notification"}
        "404": {description: "notify.notification_not_found — không có, của người khác, ngoài phạm vi", $ref: "#/components/responses/Problem"}
  /v1/devices/{id}/push-token:
    post:
      summary: Gắn/cập nhật token đẩy FCM cho thiết bị pf/sync của CHÍNH người gọi (gọi mỗi lần khởi động và khi FCM đổi token)
      operationId: registerPushToken
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - {name: id, in: path, required: true, description: "device_id đã đăng ký ở POST /v1/devices", schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PushTokenInput"}
      responses:
        "200":
          description: Đã gắn. Không trả lại token.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PushToken"}
        "403": {description: "notify.device_unregistered | notify.device_revoked", $ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "503": {description: "notify.dependency_unavailable", $ref: "#/components/responses/Problem"}
  /v1/sync/nudge:
    post:
      summary: Yêu cầu thiết bị đồng bộ ngay (US-SYNC-02) — gửi thông điệp dữ liệu {kind sync_now}
      description: |
        Vai kn_province_admin, kn_national_admin, device_admin, platform_admin. Đúng một trong device_id hoặc unit.
        unit phải trong phạm vi; device_id phải có token đang dùng và thuộc phạm vi (device_admin/platform_admin: cả tenant).
        Giới hạn: một đích mỗi 5 phút, mỗi người 30 lần/giờ → 429 + Retry-After.
      operationId: syncNudge
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/NudgeInput"}
      responses:
        "202":
          description: Đã xếp lần gửi
          content:
            application/json:
              schema: {$ref: "#/components/schemas/NudgeResult"}
        "403": {description: "forbidden | notify.out_of_scope", $ref: "#/components/responses/Problem"}
        "404": {description: "notify.nudge_target_not_found", $ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "429": {description: "notify.nudge_rate_limited (retry_after_s, header Retry-After)", $ref: "#/components/responses/Problem"}
  # --- hết pf/notify ---

  /v1/geo/conflicts/{id}:
    get:
      summary: "Chi tiết xung đột ranh giới giữ cả hai phiên bản (US-SYNC-03): bản gây xung đột, bản hiện hành, thửa bị chồng lấn — không PII"
      operationId: getBoundaryConflict
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Xung đột kèm các phiên bản
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/BoundaryConflict"
                  - type: object
                    required: [versions]
                    properties:
                      versions:
                        type: array
                        items:
                          type: object
                          required: [role, boundary_id, plot_ref, plot_code, version, area_ha, current]
                          properties:
                            role: {type: string, enum: [record, current, overlapping]}
                            boundary_id: {type: string, format: uuid}
                            plot_ref: {type: string, format: uuid}
                            plot_code: {type: string}
                            version: {type: integer}
                            area_ha: {$ref: "#/components/schemas/Decimal"}
                            current: {type: boolean}
                            geometry: {$ref: "#/components/schemas/PolygonGeometry"}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/geo/admin-boundaries:
    get:
      summary: "G-05: ranh giới hành chính hiện hành theo cấp và đơn vị cha (FeatureCollection); đơn vị chưa có hình ở missing"
      operationId: listAdminBoundaries
      parameters:
        - {name: level, in: query, required: true, schema: {type: string, enum: [province, commune]}}
        - {name: parent, in: query, schema: {type: string}, description: "Mã tỉnh; bắt buộc với level=commune"}
        - {name: zoom, in: query, schema: {type: integer, minimum: 0, maximum: 22, default: 12}}
      responses:
        "200":
          description: Ranh giới
          content:
            application/geo+json:
              schema:
                type: object
                required: [type, features, missing]
                properties:
                  type: {type: string, enum: [FeatureCollection]}
                  features:
                    type: array
                    items:
                      type: object
                      required: [type, id, geometry, properties]
                      properties:
                        type: {type: string, enum: [Feature]}
                        id: {type: string}
                        geometry: {$ref: "#/components/schemas/PolygonGeometry"}
                        properties:
                          type: object
                          required: [code, level, name, parent_code, source, area_ha, imported_at]
                          properties:
                            code: {type: string}
                            level: {type: string, enum: [province, commune]}
                            name: {type: string}
                            parent_code: {type: [string, "null"]}
                            source: {type: string}
                            area_ha: {$ref: "#/components/schemas/Decimal"}
                            imported_at: {type: string, format: date-time}
                  missing: {type: array, items: {type: string}, description: "Mã đơn vị chưa nhập ranh giới"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/mechanization/forecasts:
    get:
      summary: "Dự báo nhu cầu đã lưu (FN-09, cgh.forecast/v1 — phương pháp tạm, cần DCRD xác nhận); chạy qua Admin API"
      operationId: mechListForecasts
      parameters:
        - {name: season_code, in: query, schema: {type: string}}
        - {name: season_year, in: query, schema: {type: integer}}
      responses:
        "200":
          description: Các lần chạy (mới nhất trước)
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/MechForecastRun"}}
  /v1/mechanization/forecasts/{id}:
    get:
      summary: Một lần dự báo đã lưu (không tính lại) và các dòng HTX × chủng loại trong phạm vi
      operationId: mechGetForecast
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: province_code, in: query, schema: {type: string}}
        - {name: commune_code, in: query, schema: {type: string}}
        - {name: cooperative_ref, in: query, schema: {type: string, format: uuid}}
        - {name: farm_stage, in: query, schema: {type: string}}
        - {name: machine_type, in: query, schema: {type: string}}
      responses:
        "200":
          description: Dự báo
          content:
            application/json:
              schema:
                type: object
                required: [run, results, summary]
                properties:
                  run: {$ref: "#/components/schemas/MechForecastRun"}
                  results: {type: array, items: {$ref: "#/components/schemas/MechForecastResult"}}
                  summary:
                    type: object
                    required: [forecast_area_ha, required_by_stage]
                    properties:
                      forecast_area_ha: {$ref: "#/components/schemas/Decimal"}
                      required_by_stage: {type: object, additionalProperties: {type: string}}
        "404": {description: mechanization.forecast_not_found, $ref: "#/components/responses/Problem"}
  # --- hết pf/mechanization ---

  /v1/dashboard:
    get:
      summary: "G-02 (US-DASH-01): bảng điều hành gộp — KPI pf/extension + HTX/hộ pf/party + thửa số hoá pf/geo + mục tiêu diện tích; tổng = tổng các con (toàn quốc = tổng các tỉnh); thiếu báo cáo → \"Số liệu tạm tính\""
      operationId: unifiedDashboard
      parameters:
        - {name: unit, in: query, schema: {type: string}, description: "Mã tỉnh/xã; bỏ trống = toàn quốc (nếu được) hoặc đơn vị phụ trách"}
        - {name: period, in: query, schema: {type: string, pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$"}}
      responses:
        "200":
          description: Bảng điều hành
          content:
            application/json:
              schema:
                type: object
                required: [unit, level, period, as_of, total, children, sources]
                properties:
                  unit: {type: [string, "null"]}
                  level: {type: string, enum: [national, province, commune]}
                  period: {type: string}
                  as_of: {type: string, format: date-time}
                  total: {$ref: "#/components/schemas/UnifiedFigures"}
                  children:
                    type: array
                    items:
                      allOf:
                        - $ref: "#/components/schemas/UnifiedFigures"
                        - type: object
                          required: [unit, name]
                          properties:
                            unit: {type: string}
                            name: {type: [string, "null"]}
                  sources: {type: array, items: {type: string}, description: "Module đã nối vào số liệu"}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/library:
    get:
      summary: "US-LIB-05: danh mục cá nhân (tài liệu đã lưu để đọc ngoại tuyến) của người gọi, mới lưu trước"
      operationId: listLibrary
      parameters:
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        "200":
          description: Một trang
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/LibraryItem"}}
                  next_cursor: {type: [string, "null"]}
  /v1/documents/{ref}/save:
    post:
      summary: "US-LIB-05: lưu tài liệu đang hiển thị vào danh mục cá nhân (đồng bộ xuống máy qua entity library_item)"
      operationId: saveDocument
      parameters:
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                note: {type: [string, "null"], maxLength: 500}
      responses:
        "200":
          description: Đã lưu
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LibraryItem"}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/documents/{ref}/unsave:
    post:
      summary: "US-LIB-05: bỏ lưu (không xóa cứng; máy nhận tombstone library_item)"
      operationId: unsaveDocument
      parameters:
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Đã bỏ lưu
          content:
            application/json:
              schema:
                type: object
                required: [document_ref, saved, removed_at]
                properties:
                  document_ref: {type: string, format: uuid}
                  saved: {type: boolean}
                  removed_at: {type: string, format: date-time}
        "404": {description: content.library_item_not_found, $ref: "#/components/responses/Problem"}
  # --- pf/reports: mẫu biểu, xuất Excel/PDF bất đồng bộ (mục 12, R-52), điểm kiểm soát xuất dữ liệu (mục 18) ---
  # Mẫu và lịch gửi quản trị qua Admin API (admin.yaml). Mọi yêu cầu xuất và cấp URL tải đi qua MỘT điểm kiểm soát:
  # nhật ký (không PII), hạn mức ngày reports.daily_export_quota (mặc định 50) → 429, vượt reports.export_anomaly_threshold
  # → sự kiện pf.reports.export.anomaly. Số liệu CGH lấy từ kết quả cân đối ĐÃ LƯU (FN-10 BR-04), không tính lại.
  /v1/reports/templates:
    get:
      summary: Mẫu báo cáo đang dùng mà vai của người gọi được xuất (mẫu hệ thống = phiên bản 0)
      operationId: listReportTemplates
      tags: [reports]
      responses:
        "200":
          description: Danh sách mẫu
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/ReportTemplate"}}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/reports/exports:
    get:
      summary: Lịch sử xuất của CHÍNH người gọi (kể cả việc của lịch gửi họ sở hữu), mới nhất trước
      description: Phân trang cursor (R-53). downloadable = true khi việc đã xong và có tệp — tải qua GET /v1/reports/exports/{id}/download.
      operationId: listMyReportExports
      tags: [reports]
      parameters:
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        "200":
          description: Một trang
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items:
                      allOf:
                        - $ref: "#/components/schemas/ReportExport"
                        - type: object
                          required: [downloadable]
                          properties:
                            downloadable: {type: boolean}
                  next_cursor: {type: [string, "null"]}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
    post:
      summary: Yêu cầu xuất báo cáo (Excel/PDF) — 202 + việc xuất; worker dựng tệp. Phạm vi giải lúc yêu cầu (ADR-0009)
      operationId: requestReportExport
      tags: [reports]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [template_key, format]
              properties:
                template_key: {type: string, examples: [kn.sowing_progress, cgh.shortage_by_coop]}
                format: {type: string, enum: [xlsx, pdf]}
                params: {$ref: "#/components/schemas/ReportParams"}
      responses:
        "202":
          description: Đã nhận; theo dõi tại Location
          headers:
            Location: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ReportExport"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "429": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
  /v1/reports/exports/{id}:
    get:
      summary: Trạng thái việc xuất (người yêu cầu, hoặc người có phạm vi bao trọn)
      operationId: getReportExport
      tags: [reports]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Việc xuất
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ReportExport"}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/reports/exports/{id}/download:
    get:
      summary: URL tải tệp có hạn (10 phút; không ghi log) — qua điểm kiểm soát xuất dữ liệu
      operationId: downloadReportExport
      tags: [reports]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: URL có chữ ký
          content:
            application/json:
              schema:
                type: object
                required: [export_id, url, expires_at, file_name, content_type, sha256]
                properties:
                  export_id: {type: string, format: uuid}
                  url: {type: string}
                  expires_at: {type: string, format: date-time}
                  file_name: {type: string}
                  content_type: {type: string}
                  sha256: {type: string}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
  # --- hết pf/reports ---
  # --- pf/cropcycle (App HTX: SOP, vụ, nhật ký, sản lượng, bảng điều hành) ---
  /v1/cropcycle/sops:
    get:
      summary: Mẫu SOP đã ban hành nhìn thấy được (hệ thống + riêng của HTX người gọi)
      operationId: listCropSOPs
      parameters:
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        "200":
          description: Một trang
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/CropSOPTemplate"}}
                  next_cursor: {type: [string, "null"]}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/cropcycle/sops/{ref}:
    get:
      summary: Mẫu SOP kèm các phiên bản ĐÃ PHÁT HÀNH
      operationId: getCropSOP
      parameters:
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200": {description: Mẫu, content: {application/json: {schema: {$ref: "#/components/schemas/CropSOP"}}}}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/cropcycle/sop-versions/{id}:
    get:
      summary: Một phiên bản SOP đã phát hành (bước, mốc thu hoạch)
      operationId: getCropSOPVersion
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Phiên bản
          content:
            application/json:
              schema:
                type: object
                required: [version, template]
                properties:
                  version: {$ref: "#/components/schemas/CropSOPVersion"}
                  template: {$ref: "#/components/schemas/CropSOPTemplate"}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/cropcycle/variety-bindings:
    get:
      summary: Gắn giống lúa ↔ mẫu SOP mặc định (tự gán khi mở vụ, HTX US-SEASON-01 AC-1)
      operationId: listCropVarietyBindings
      responses:
        "200":
          description: Danh sách
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/CropVarietyBinding"}}
  /v1/cropcycle/seasons:
    post:
      summary: Mở vụ cho một thửa (nông dân tự mở; quản lý HTX mở hộ) — HTX US-SEASON-01/03/04
      description: |
        Ngày sạ trong [hôm nay − 15, hôm nay + 30] (giờ Việt Nam). SOP tự gán theo giống nếu không chỉ định.
        `copy_previous: true` lấy giống + SOP của vụ vừa hoàn thành (chặn nếu vụ gần nhất chưa hoàn thành).
        Mỗi thửa tối đa một vụ đang mở. GPS thiếu/lệch không chặn lưu (nhãn `location_status`).
      operationId: openCropSeason
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/CropSeasonOpenInput"}}}
      responses:
        "201": {$ref: "#/components/responses/CropSeasonWritten"}
        "403": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
    get:
      summary: Vụ trong phạm vi (nông dân — hộ mình; quản lý HTX — HTX mình; KN — xã; quản trị — tất cả)
      operationId: listCropSeasons
      parameters:
        - {name: cooperative_ref, in: query, schema: {type: string, format: uuid}}
        - {name: plot_ref, in: query, schema: {type: string, format: uuid}}
        - {name: status, in: query, schema: {type: string, enum: [open, completed, cancelled]}}
        - {name: season_code, in: query, schema: {type: string}}
        - {name: season_year, in: query, schema: {type: integer}}
        - {name: variety_code, in: query, schema: {type: string}}
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        "200":
          description: Một trang
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/CropSeason"}}
                  next_cursor: {type: [string, "null"]}
  /v1/cropcycle/seasons/bulk-open:
    post:
      summary: Mở vụ hàng loạt (quản lý HTX) — thửa lỗi bị bỏ qua kèm lý do (HTX US-SEASON-02, US-SEASON-04 AC-2)
      operationId: bulkOpenCropSeasons
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plot_refs, season_code, season_year, variety_code, sowing_date]
              properties:
                plot_refs: {type: array, maxItems: 200, items: {type: string, format: uuid}}
                season_code: {type: string}
                season_year: {type: integer}
                variety_code: {type: string}
                sowing_date: {type: string, format: date}
                sop_version_id: {type: [string, "null"], format: uuid}
      responses:
        "200":
          description: Kết quả theo thửa
          content:
            application/json:
              schema:
                type: object
                required: [opened, skipped, items]
                properties:
                  opened: {type: integer}
                  skipped: {type: integer}
                  items:
                    type: array
                    items:
                      type: object
                      required: [plot_ref, status]
                      properties:
                        plot_ref: {type: string, format: uuid}
                        status: {type: string, enum: [opened, skipped]}
                        season_ref: {type: string, format: uuid}
                        code: {type: string}
                        reason: {type: string, description: "vd \"Lô đang canh tác vụ khác\", \"Lô không thuộc quyền quản lý\""}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/cropcycle/seasons/{ref}:
    get:
      summary: Vụ kèm lịch sử sự kiện, bước SOP đã ghim, tiến độ và sản lượng
      operationId: getCropSeason
      parameters:
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200": {description: Vụ, content: {application/json: {schema: {$ref: "#/components/schemas/CropSeasonDetail"}}}}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/cropcycle/seasons/{ref}/corrections:
    post:
      summary: Sửa vụ đang mở bằng bản ghi bù (supersedes_id = current_event_id)
      operationId: correctCropSeason
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [supersedes_id, correction_reason]
              properties:
                id: {type: [string, "null"], format: uuid}
                supersedes_id: {type: string, format: uuid}
                correction_reason: {type: string, minLength: 10}
                variety_code: {type: [string, "null"]}
                sowing_date: {type: [string, "null"], format: date}
                sop_version_id: {type: [string, "null"], format: uuid}
      responses:
        "201": {$ref: "#/components/responses/CropSeasonWritten"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/cropcycle/seasons/{ref}/cancel:
    post:
      summary: Hủy vụ mở nhầm (bản ghi bù, vụ chưa khai sản lượng)
      operationId: cancelCropSeason
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [supersedes_id, reason]
              properties:
                supersedes_id: {type: string, format: uuid}
                reason: {type: string, minLength: 10}
      responses:
        "201": {$ref: "#/components/responses/CropSeasonWritten"}
        "409": {$ref: "#/components/responses/Problem"}
  /v1/cropcycle/seasons/{ref}/harvest:
    post:
      summary: Khai sản lượng — đóng vụ trong cùng giao dịch (HTX US-YIELD-01, US-YIELD-03)
      operationId: declareCropHarvest
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/CropHarvestInput"}}}
      responses:
        "201": {$ref: "#/components/responses/CropHarvestWritten"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/cropcycle/plots/{ref}/previous-config:
    get:
      summary: Giống + SOP của vụ vừa hoàn thành trên thửa (HTX US-SEASON-03)
      operationId: getCropPreviousConfig
      parameters:
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Cấu hình
          content:
            application/json:
              schema:
                type: object
                required: [season_ref, season_code, season_year, variety_code, sop_template_ref, sop_version_id, sop_version_no]
                properties:
                  season_ref: {type: string, format: uuid}
                  season_code: {type: string}
                  season_year: {type: integer}
                  variety_code: {type: string}
                  sop_template_ref: {type: string, format: uuid}
                  sop_version_id: {type: string, format: uuid}
                  sop_version_no: {type: integer}
        "409": {$ref: "#/components/responses/Problem"}
  /v1/cropcycle/harvests/bulk:
    post:
      summary: Bảng nhập nhanh sản lượng — lưu nhiều lô trong một lần bấm (HTX US-YIELD-02 AC-2)
      operationId: bulkCropHarvests
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rows]
              properties:
                cooperative_ref: {type: [string, "null"], format: uuid, description: "Quản trị: HTX để tra mã lô; quản lý HTX bỏ trống"}
                rows:
                  type: array
                  maxItems: 200
                  items:
                    type: object
                    properties:
                      season_ref: {type: string, format: uuid}
                      plot_code: {type: string}
                      harvest_date: {type: string, format: date}
                      mass_kg: {type: [string, "null"]}
                      moisture_pct: {type: [string, "null"]}
                      confirm_anomaly: {type: boolean}
      responses:
        "200": {$ref: "#/components/responses/CropBulkHarvest"}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/cropcycle/harvests/import:
    post:
      summary: Nhập sản lượng từ Excel .xlsx / CSV (HTX US-YIELD-02 AC-1) — dòng lỗi bị bỏ qua kèm lý do
      description: "Cột: Mã lô (plot_code) hoặc Mã vụ (season_ref); Sản lượng kg (mass_kg) hoặc Sản lượng tấn (tonnes); Ngày thu hoạch; Độ ẩm; Xác nhận bất thường. Tối đa 200 dòng, 2 MB."
      operationId: importCropHarvests
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - {name: cooperative_ref, in: query, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/vnd.openxmlformats-officedocument.spreadsheetml.sheet: {schema: {type: string, format: binary}}
          text/csv: {schema: {type: string}}
      responses:
        "200": {$ref: "#/components/responses/CropBulkHarvest"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/cropcycle/harvests/{id}/corrections:
    post:
      summary: Sửa sản lượng bằng bản ghi bù thay khai báo hiện hành
      operationId: correctCropHarvest
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/CropHarvestInput"
                - type: object
                  required: [correction_reason]
                  properties:
                    correction_reason: {type: string, minLength: 10}
      responses:
        "201": {$ref: "#/components/responses/CropHarvestWritten"}
        "409": {$ref: "#/components/responses/Problem"}
  /v1/cropcycle/farm-logs:
    post:
      summary: Ghi nhật ký canh tác (HTX US-LOG-01; ghi hộ US-LOG-02) — cần vụ đang mở
      operationId: recordCropFarmLog
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/CropFarmLogInput"}}}
      responses:
        "201": {$ref: "#/components/responses/CropFarmLogWritten"}
        "403": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
    get:
      summary: Nhật ký (phiên bản hiện hành) trong phạm vi — vd danh sách chờ duyệt (HTX US-LOG-05)
      operationId: listCropFarmLogs
      parameters:
        - {name: cooperative_ref, in: query, schema: {type: string, format: uuid}}
        - {name: season_ref, in: query, schema: {type: string, format: uuid}}
        - {name: status, in: query, schema: {type: string, enum: [pending, approved, needs_supplement]}}
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        "200":
          description: Một trang
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/CropFarmLogState"}}
                  next_cursor: {type: [string, "null"]}
  /v1/cropcycle/farm-logs/batch:
    post:
      summary: Ghi nhật ký hàng loạt — một đầu lô + một dòng mỗi thửa (HTX US-LOG-03)
      operationId: recordCropFarmLogBatch
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/CropFarmLogContent"
                - type: object
                  required: [plot_refs]
                  properties:
                    id: {type: [string, "null"], format: uuid}
                    plot_refs: {type: array, maxItems: 200, items: {type: string, format: uuid}}
                    gps: {$ref: "#/components/schemas/CropGPS"}
                    event_time: {type: [string, "null"], format: date-time}
      responses:
        "201":
          description: Đã ghi
          content:
            application/json:
              schema:
                type: object
                required: [batch_ref, requested, accepted, skipped, lines]
                properties:
                  batch_ref: {type: string, format: uuid}
                  requested: {type: integer}
                  accepted: {type: integer}
                  skipped:
                    type: array
                    items:
                      type: object
                      properties:
                        plot_ref: {type: string, format: uuid}
                        code: {type: string}
                        reason: {type: string}
                  lines: {type: array, items: {$ref: "#/components/schemas/CropFarmLog"}}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/cropcycle/farm-logs/{id}:
    get:
      summary: Một phiên bản nhật ký kèm trạng thái duyệt và mọi phiên bản
      operationId: getCropFarmLog
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Nhật ký
          content:
            application/json:
              schema:
                type: object
                required: [log, state, versions]
                properties:
                  log: {$ref: "#/components/schemas/CropFarmLog"}
                  state: {$ref: "#/components/schemas/CropFarmLogState"}
                  versions: {type: array, items: {$ref: "#/components/schemas/CropFarmLog"}}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/cropcycle/farm-logs/{id}/corrections:
    post:
      summary: Sửa nhật ký bằng bản ghi bù — giữ nguyên thời gian và GPS (HTX US-LOG-01 AC-3)
      operationId: correctCropFarmLog
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/CropFarmLogContent"
                - type: object
                  required: [correction_reason]
                  properties:
                    id: {type: [string, "null"], format: uuid}
                    correction_reason: {type: string, minLength: 10}
                    event_time: {type: [string, "null"], format: date-time, description: "Nếu gửi phải trùng bản gốc"}
                    gps: {$ref: "#/components/schemas/CropGPS"}
      responses:
        "201": {$ref: "#/components/responses/CropFarmLogWritten"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/cropcycle/farm-logs/{id}/reviews:
    post:
      summary: Duyệt / yêu cầu bổ sung nhật ký (quản lý HTX; người ghi không tự duyệt) — HTX US-LOG-05
      operationId: reviewCropFarmLog
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: {type: string, enum: [approved, needs_supplement]}
                note: {type: string, maxLength: 1000, description: "Bắt buộc khi needs_supplement"}
      responses:
        "201":
          description: Đã duyệt
          content:
            application/json:
              schema:
                type: object
                required: [review_id, decision, state]
                properties:
                  review_id: {type: string, format: uuid}
                  decision: {type: string}
                  state: {$ref: "#/components/schemas/CropFarmLogState"}
        "403": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
  /v1/cropcycle/dashboard:
    get:
      summary: Dự kiến – thực tế, tiến độ SOP (chỉ nhật ký đã duyệt), thẻ chỉ số — HTX US-DASH-01
      operationId: getCropDashboard
      parameters:
        - {name: season_code, in: query, schema: {type: string}}
        - {name: season_year, in: query, schema: {type: integer}}
        - {name: cooperative_ref, in: query, schema: {type: string, format: uuid}}
        - {name: variety_code, in: query, schema: {type: string}}
      responses:
        "200":
          description: Số liệu
          content:
            application/json:
              schema:
                type: object
                required: [totals, by_variety, by_season, by_cooperative]
                properties:
                  totals: {$ref: "#/components/schemas/CropDashGroup"}
                  by_variety: {type: array, items: {$ref: "#/components/schemas/CropDashGroup"}}
                  by_season: {type: array, items: {$ref: "#/components/schemas/CropDashGroup"}}
                  by_cooperative: {type: array, items: {$ref: "#/components/schemas/CropDashGroup"}}
        "403": {$ref: "#/components/responses/Problem"}
  # --- hết pf/cropcycle ---
components:
  securitySchemes:
    oidc:
      type: openIdConnect
      openIdConnectUrl: https://auth.agrigreen.vn/realms/agrigreen/.well-known/openid-configuration
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, pattern: "^[A-Za-z0-9._:-]{8,200}$"}
    At:
      name: at
      in: query
      description: Thời điểm tra (RFC 3339, hoặc YYYY-MM-DD = 00:00 giờ Việt Nam). Mặc định là hiện tại.
      schema: {type: string}
    UnitCode:
      name: code
      in: path
      required: true
      schema: {type: string, pattern: "^[0-9A-Z][0-9A-Z.-]{0,39}$"}
    Catalog:
      name: catalog
      in: path
      required: true
      schema: {type: string, enum: [rice_variety, farm_stage, machine_type, season, pest]}
    DeviceID:
      name: X-Device-Id
      in: header
      required: true
      description: Mã thiết bị đã đăng ký bởi chính người gọi (pf/sync)
      schema: {type: string, format: uuid}
    Purpose:
      name: X-Purpose
      in: header
      required: true
      description: Mục đích xử lý dữ liệu cá nhân (R-42)
      schema: {type: string, enum: [mrv.evidence, extension.field_support]}
  responses:
    CropSeasonWritten:
      description: Sự kiện vụ đã ghi (pf/cropcycle). Gọi lặp cùng Idempotency-Key trả lại đúng phản hồi.
      content:
        application/json:
          schema:
            type: object
            required: [season, event]
            properties:
              season: {$ref: "#/components/schemas/CropSeason"}
              event: {$ref: "#/components/schemas/CropSeasonEvent"}
    CropHarvestWritten:
      description: Khai báo sản lượng đã ghi (pf/cropcycle)
      content:
        application/json:
          schema:
            type: object
            required: [harvest, season]
            properties:
              harvest: {$ref: "#/components/schemas/CropHarvest"}
              season: {$ref: "#/components/schemas/CropSeason"}
    CropFarmLogWritten:
      description: Phiên bản nhật ký đã ghi (pf/cropcycle)
      content:
        application/json:
          schema:
            type: object
            required: [log, state]
            properties:
              log: {$ref: "#/components/schemas/CropFarmLog"}
              state: {$ref: "#/components/schemas/CropFarmLogState"}
    CropBulkHarvest:
      description: Kết quả nhập sản lượng theo dòng (HTX US-YIELD-02)
      content:
        application/json:
          schema:
            type: object
            required: [accepted, duplicate, rejected, rows]
            properties:
              accepted: {type: integer}
              duplicate: {type: integer}
              rejected: {type: integer}
              rows:
                type: array
                items:
                  type: object
                  required: [row, status]
                  properties:
                    row: {type: integer}
                    status: {type: string, enum: [accepted, duplicate, rejected]}
                    code: {type: string}
                    reason: {type: string}
                    needs_confirm: {type: boolean}
                    season_ref: {type: string, format: uuid}
                    harvest_id: {type: string, format: uuid}
    Problem:
      description: RFC 9457
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    ExtTaskWritten:
      description: Sự việc đã ghi (pf/extension)
      content:
        application/json:
          schema:
            type: object
            required: [task, event]
            properties:
              task: {$ref: "#/components/schemas/ExtTask"}
              event: {$ref: "#/components/schemas/ExtTaskEvent"}
  schemas:
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: {type: string, format: uri}
        title: {type: string}
        status: {type: integer}
        code: {type: string}
        detail: {type: string}
        instance: {type: string}
        trace_id: {type: string}
        errors:
          type: array
          items:
            type: object
            properties:
              field: {type: string}
              reason: {type: string}
    ConsentInput:
      type: object
      required: [subject_ref, purpose, text_version, status, channel, event_time]
      properties:
        id: {type: string, format: uuid, description: "UUIDv7 sinh trên thiết bị khi ngoại tuyến (R-11). Bỏ trống → server sinh."}
        subject_ref: {type: string, format: uuid, description: "Mã tham chiếu chủ thể — không phải định danh (R-41)"}
        purpose: {type: string, pattern: "^[a-z][a-z0-9_.]{2,63}$", examples: ["mrv.evidence"]}
        text_version: {type: string, maxLength: 40}
        status: {type: string, enum: [granted, withdrawn]}
        channel: {type: string, enum: [field_app, web, zalo, paper]}
        event_time: {type: string, format: date-time, description: "Lúc xảy ra tại hiện trường (R-13)"}
        device_id: {type: string}
    Consent:
      allOf:
        - $ref: "#/components/schemas/ConsentInput"
        - type: object
          required: [id, recorded_at, seq]
          properties:
            recorded_at: {type: string, format: date-time}
            seq: {type: integer, description: "Thứ tự trong chuỗi băm của chủ thể"}
    AdminUnit:
      type: object
      required: [code, name, level, parent_code, valid_from, valid_to, successor_codes]
      properties:
        code: {type: string}
        name: {type: string}
        level: {type: string, enum: [province, commune, district], description: "district chỉ có trong dữ liệu trước 01/07/2025"}
        parent_code: {type: [string, "null"]}
        valid_from: {type: string, format: date}
        valid_to: {type: [string, "null"], format: date, description: "Không bao gồm; null = còn hiệu lực"}
        successor_codes: {type: array, items: {type: string}}
    AdminUnitNode:
      allOf:
        - $ref: "#/components/schemas/AdminUnit"
        - type: object
          required: [children]
          properties:
            children: {type: array, items: {$ref: "#/components/schemas/AdminUnitNode"}}
    CatalogItem:
      type: object
      required: [catalog, code, name, attrs, active, deactivation_reason, revision, updated_at]
      properties:
        catalog: {type: string}
        code: {type: string}
        name: {type: string}
        attrs: {type: object, additionalProperties: {type: string}, description: "Số (vd expected_yield_t_per_ha) là chuỗi decimal"}
        active: {type: boolean}
        deactivation_reason: {type: [string, "null"]}
        revision: {type: integer}
        updated_at: {type: string, format: date-time}
    ParamValue:
      type: object
      required: [key, value, text, unit, version, effective_from, source_doc, approved_at, param_version_id, supersedes_id, seq]
      properties:
        key: {type: string}
        value: {type: [string, "null"], description: "Số thập phân dạng chuỗi (R-10)"}
        text: {type: [string, "null"]}
        unit: {type: string}
        version: {type: integer}
        effective_from: {type: string, format: date-time}
        source_doc: {type: string}
        approved_at: {type: string, format: date-time}
        param_version_id: {type: string, format: uuid}
        supersedes_id: {type: [string, "null"], format: uuid}
        seq: {type: integer}
    OrgKind:
      type: string
      enum: [ttkn_national, ttkn_province, extension_team, dcrd, cooperative, mkg, partner]
    Org:
      type: object
      required: [ref, kind, code, name, admin_unit_code, parent_ref, representative_ref, active]
      properties:
        ref: {type: string, format: uuid}
        kind: {$ref: "#/components/schemas/OrgKind"}
        code: {type: string, description: "Mã đơn vị; với HTX là Mã HTX do hệ thống tự sinh (CGH BR-01)"}
        name: {type: string}
        admin_unit_code: {type: [string, "null"], description: "Mã tỉnh/xã hiện hành; null với cấp quốc gia"}
        parent_ref: {type: [string, "null"], format: uuid}
        representative_ref: {type: [string, "null"], format: uuid, description: "Mã tham chiếu người đại diện trong kho định danh"}
        active: {type: boolean}
    Me:
      type: object
      required: [actor_ref, tenant_id, roles, mfa, org, scope]
      additionalProperties: false
      properties:
        actor_ref: {type: string, format: uuid, description: "= sub của token; mã tham chiếu, không phải định danh"}
        tenant_id: {type: string, format: uuid}
        roles: {type: array, items: {type: string}}
        mfa: {type: boolean, description: "Token có yếu tố thứ hai (amr) — Admin API bắt buộc"}
        org:
          description: Đơn vị công tác (claim org_ref). null khi không có org_ref hoặc tổ chức không tồn tại trong tenant.
          oneOf:
            - type: "null"
            - type: object
              required: [ref, kind, name, admin_unit_code, active]
              additionalProperties: false
              properties:
                ref: {type: string, format: uuid}
                kind: {$ref: "#/components/schemas/OrgKind"}
                name: {type: string}
                admin_unit_code: {type: [string, "null"]}
                active: {type: boolean, description: "false = tổ chức đã bị vô hiệu hóa → phạm vi rỗng"}
        scope:
          type: object
          required: [all, level, units, unit_names]
          additionalProperties: false
          properties:
            all: {type: boolean, description: "true = toàn quốc (TTKN QG, Cục KTHT, Mekong Green, platform_admin)"}
            level: {type: string, enum: [national, province, commune, cooperative, none]}
            units: {type: array, items: {type: string}, description: "Mã đơn vị hành chính hiện hành được thấy; rỗng khi all = true hoặc level = none"}
            unit_names: {type: object, additionalProperties: {type: string}, description: "Mã đơn vị → tên (masterdata tại thời điểm hiện tại), gồm cả đơn vị của tổ chức"}
    Decimal:
      type: string
      pattern: "^-?[0-9]+(\\.[0-9]+)?$"
      description: Số thập phân dạng chuỗi (không float)
    Point:
      type: object
      required: [lat, lon]
      properties:
        lat: {$ref: "#/components/schemas/Decimal"}
        lon: {$ref: "#/components/schemas/Decimal"}
    Cooperative:
      allOf:
        - $ref: "#/components/schemas/Org"
        - type: object
          required: [status_reason, tax_code, area_ha, established_on, location, location_provisional]
          properties:
            status_reason: {type: [string, "null"], description: "Lý do vô hiệu hóa hiện tại"}
            tax_code: {type: [string, "null"], pattern: "^[0-9]{10}(-[0-9]{3})?$"}
            area_ha: {oneOf: [{$ref: "#/components/schemas/Decimal"}, {type: "null"}], description: "Diện tích đăng ký hành chính (ha)"}
            established_on: {type: [string, "null"], format: date}
            location: {oneOf: [{$ref: "#/components/schemas/Point"}, {type: "null"}]}
            location_provisional: {type: boolean, description: "true = chưa có toạ độ; bản đồ hiển thị tâm xã, nhãn \"vị trí tạm\""}
        - type: object
          description: Dữ liệu đọc bổ sung của danh sách/hồ sơ HTX (G-03)
          required: [province_code, commune_name, province_name, member_households, digitized_plots]
          properties:
            province_code: {type: [string, "null"], description: "Mã tỉnh hiện hành của xã nơi HTX đặt trụ sở"}
            commune_name: {type: [string, "null"]}
            province_name: {type: [string, "null"]}
            member_households: {type: integer, minimum: 0, description: "Số nông hộ thành viên đang hoạt động"}
            digitized_plots: {type: [integer, "null"], minimum: 0, description: "Số thửa đã số hoá (pf/geo); null khi chưa nối pf/geo hoặc tra lỗi"}
    Household:
      type: object
      required: [household_ref, cooperative_ref, commune_code, cultivated_area_ha, member_since, active]
      properties:
        household_ref: {type: string, format: uuid, description: "Mã tham chiếu trong kho định danh (R-41)"}
        cooperative_ref: {type: [string, "null"], format: uuid}
        commune_code: {type: string}
        cultivated_area_ha: {oneOf: [{$ref: "#/components/schemas/Decimal"}, {type: "null"}]}
        member_since: {type: [string, "null"], format: date}
        active: {type: boolean}
    HouseholdListItem:
      allOf:
        - $ref: "#/components/schemas/Household"
        - type: object
          required: [label, masked_phone, label_unavailable, consents]
          properties:
            label: {type: string, description: "Nhãn đã che, vd \"Nguyễn V. A.\""}
            masked_phone: {type: string, description: "SĐT đã che"}
            label_unavailable: {type: boolean}
            consents:
              type: array
              description: "G-04: trạng thái đồng ý hiện tại theo từng mục đích (R-41/R-42); rỗng khi chưa ghi nhận"
              items:
                type: object
                required: [purpose, status, event_time]
                properties:
                  purpose: {type: string, examples: ["mrv.evidence"]}
                  status: {type: string, enum: [granted, withdrawn]}
                  event_time: {type: string, format: date-time}
    HouseholdInput:
      type: object
      required: [cooperative_ref, identity]
      properties:
        cooperative_ref: {type: string, format: uuid}
        commune_code: {type: string, description: "Bỏ trống = xã của HTX"}
        cultivated_area_ha: {$ref: "#/components/schemas/Decimal"}
        member_since: {type: string, format: date}
        identity:
          type: object
          description: Chỉ chuyển vào kho định danh (mục đích registry.admin), không lưu ở pf_party
          required: [full_name, phone]
          properties:
            full_name: {type: string}
            phone: {type: string}
            national_id: {type: string}
            address: {type: string}
    HouseholdCreated:
      type: object
      required: [household, duplicate]
      properties:
        household: {$ref: "#/components/schemas/Household"}
        duplicate: {type: boolean}
        duplicate_label: {type: string, enum: ["trùng"]}
    # --- pf/sync ---

    SyncDeviceInput:
      type: object
      required: [device_id, platform, app_version]
      properties:
        device_id: {type: string, format: uuid, description: "UUIDv7 sinh trên máy"}
        platform: {type: string, enum: [android, ios]}
        app_version: {type: string, pattern: "^[0-9A-Za-z.+_-]{1,40}$"}
    SyncDevice:
      type: object
      required: [device_id, registered_at, platform, app_version, revoked]
      properties:
        device_id: {type: string, format: uuid}
        registered_at: {type: string, format: date-time}
        platform: {type: string}
        app_version: {type: string}
        revoked: {type: boolean}
    SyncChange:
      type: object
      required: [entity, id, version, op]
      properties:
        entity: {type: string, examples: [catalog_item, admin_unit, mrv_catalog, plot, task, directive, document, pubkey]}
        id: {type: string, format: uuid, description: "pubkey + id 00000000-0000-0000-0000-000000000000 + tombstone = kết thúc lượt khóa: xóa mọi pubkey có version nhỏ hơn"}
        version: {type: integer}
        op: {type: string, enum: [upsert, tombstone]}
        data:
          type: object
          description: |
            Không có khi tombstone. pubkey: {ref, area_code, public_key (base64 32 byte)}.
            catalog_item: SyncCatalogItemData; admin_unit: SyncAdminUnitData; mrv_catalog: MrvCatalogVersion (bản đã duyệt).
    SyncCatalogItemData:
      type: object
      description: |
        data của entity pull catalog_item (pf/masterdata): mục đang dùng của rice_variety, farm_stage, machine_type,
        season, pest — không lọc theo địa bàn. id = UUIDv5 cố định theo (catalog, code); version = sync_seq
        (luôn tăng). Ngừng dùng → tombstone cùng id; dùng lại → upsert version mới.
      required: [catalog, code, name, attrs, revision, updated_at]
      properties:
        catalog: {type: string, enum: [rice_variety, farm_stage, machine_type, season, pest]}
        code: {type: string}
        name: {type: string}
        attrs: {type: object, additionalProperties: {type: string}}
        revision: {type: integer, minimum: 1}
        updated_at: {type: string, format: date-time}
    SyncAdminUnitData:
      type: object
      description: |
        data của entity pull admin_unit (pf/masterdata): một PHIÊN BẢN hiệu lực của đơn vị có mã thuộc phạm vi
        người gọi (toàn quốc: mọi đơn vị). id = UUIDv5 cố định theo (code, valid_from) — mã có thể dùng lại sau
        sắp xếp; version = sync_seq. Phiên bản đã hết hiệu lực (valid_to ≤ hôm nay) → tombstone, kể cả đơn vị
        cũ có đơn vị kế thừa trong phạm vi.
      required: [code, name, level, parent_code, valid_from, valid_to, successor_codes]
      properties:
        code: {type: string}
        name: {type: string}
        level: {type: string, enum: [province, commune, district]}
        parent_code: {type: [string, "null"]}
        valid_from: {type: string, format: date}
        valid_to: {type: [string, "null"], format: date, description: "Khác null: đã định ngày hết hiệu lực trong tương lai; máy coi hết hiệu lực từ ngày này"}
        successor_codes: {type: array, items: {type: string}}
    SyncPullPage:
      type: object
      required: [changes, next_cursor, has_more, server_time, reset]
      properties:
        changes: {type: array, items: {$ref: "#/components/schemas/SyncChange"}}
        next_cursor: {type: string, description: "Mờ, có chữ ký HMAC, gắn với tenant + thiết bị + phạm vi"}
        has_more: {type: boolean}
        server_time: {type: string, format: date-time}
        reset: {type: boolean, description: "true = phạm vi đã đổi; pull bắt đầu lại từ đầu, máy thay toàn bộ dữ liệu tham chiếu"}
    SyncPushRecord:
      type: object
      required: [id, idem_key, entity, op, event_time, payload]
      properties:
        id: {type: string, format: uuid, description: "UUIDv7 sinh trên máy"}
        idem_key: {type: string, pattern: "^dev:[0-9a-fA-F-]{36}:[1-9][0-9]{0,18}$", description: "dev:<device_id của chính máy gửi>:<seq>"}
        entity: {type: string, examples: [plot_boundary, field_report, task_update, consent, evidence]}
        op: {type: string, enum: [create, correct]}
        event_time: {type: string, format: date-time, description: "Có múi giờ; không vượt quá giờ máy chủ + 5 phút"}
        supersedes_id: {type: [string, "null"], format: uuid, description: "Bắt buộc khi op = correct"}
        correction_reason: {type: [string, "null"], minLength: 10, maxLength: 500, description: "Bắt buộc khi op = correct"}
        payload: {type: object, description: "Tối đa 256 KiB; máy chủ pf/sync chỉ lưu SHA-256"}
    SyncConsentPayload:
      type: object
      description: |
        payload của bản ghi push entity = consent (Sink của pf/party). Chỉ op = create; rút lại đồng ý là
        bản ghi mới status = withdrawn. id, event_time, device_id lấy từ phong bì; idem_key của máy là khóa
        chống trùng của sổ đồng ý (gửi lại → duplicate). Cần vai consent_writer.
      required: [subject_ref, purpose, text_version, status]
      properties:
        subject_ref: {type: string, format: uuid}
        purpose: {type: string, pattern: "^[a-z][a-z0-9_.]{2,63}$", examples: ["mrv.evidence"]}
        text_version: {type: string, maxLength: 40}
        status: {type: string, enum: [granted, withdrawn]}
        channel: {type: string, enum: [field_app, web, zalo, paper], default: field_app}
    SyncPushBatch:
      type: object
      required: [device_id, records]
      properties:
        device_id: {type: string, format: uuid, description: "Phải trùng header X-Device-Id"}
        records: {type: array, maxItems: 500, items: {$ref: "#/components/schemas/SyncPushRecord"}}
    SyncPushResult:
      type: object
      required: [id, status]
      properties:
        id: {type: string, description: "id máy gửi, nguyên văn (kể cả khi sai dạng)"}
        status: {type: string, enum: [accepted, duplicate, conflict, rejected]}
        conflict_id: {type: string, format: uuid}
        code: {type: string, description: "Khi rejected: validation_failed | sync.unknown_entity | sync.sink_failed (máy tự gửi lại, không bắt người dùng sửa) | mã của module nhận"}
        errors:
          type: array
          items:
            type: object
            properties:
              field: {type: string}
              reason: {type: string}
    SyncEnvelopeMeta:
      type: object
      description: docs/dev/envelope-format.md, phiên bản 1
      required: [v, alg, subject_ref, nonce, wrapped_dek, sha256_ciphertext, content_type]
      properties:
        v: {type: integer, enum: [1]}
        alg: {type: string, enum: ["A256GCM+X25519-SEALEDBOX"]}
        subject_ref: {type: string, format: uuid}
        nonce: {type: string, contentEncoding: base64, description: "12 byte"}
        wrapped_dek: {type: string, contentEncoding: base64, description: "80 byte (crypto_box_seal)"}
        sha256_ciphertext: {type: string, pattern: "^[0-9a-f]{64}$"}
        content_type: {type: string, enum: [image/jpeg, image/png, image/webp, image/heic, application/pdf, video/mp4]}
        captured_at: {type: string, format: date-time}
        gps:
          type: object
          required: [lat, lon]
          properties:
            lat: {type: number, minimum: -90, maximum: 90}
            lon: {type: number, minimum: -180, maximum: 180}
            accuracy_m: {type: number, minimum: 0}
    SyncFileCreated:
      type: object
      required: [file_ref, sha256_ciphertext, size]
      properties:
        file_ref: {type: string, format: uuid}
        sha256_ciphertext: {type: string}
        size: {type: integer}
    SyncFile:
      type: object
      required: [file_ref, subject_ref, v, alg, nonce, wrapped_dek, sha256_ciphertext, size, content_type, captured_at, gps, created_at]
      properties:
        file_ref: {type: string, format: uuid}
        subject_ref: {type: string, format: uuid}
        v: {type: integer}
        alg: {type: string}
        nonce: {type: string, contentEncoding: base64}
        wrapped_dek: {type: string, contentEncoding: base64}
        sha256_ciphertext: {type: string}
        size: {type: integer}
        content_type: {type: string}
        captured_at: {type: [string, "null"], format: date-time}
        gps:
          oneOf:
            - type: "null"
            - type: object
              properties:
                lat: {type: number}
                lon: {type: number}
                accuracy_m: {type: number}
        created_at: {type: string, format: date-time}
    MrvField:
      type: object
      required: [key, label_vi, data_type, unit, required, min, max, max_scale, enum_values, help_vi, position, reserved]
      properties:
        key: {type: string}
        label_vi: {type: string}
        data_type: {type: string, enum: [decimal, integer, boolean, enum, date, photo, geo_point, text]}
        unit: {type: [string, "null"]}
        required: {type: boolean}
        min: {type: [string, "null"], description: "decimal/integer: giá trị; photo: số ảnh; text: độ dài"}
        max: {type: [string, "null"]}
        max_scale: {type: [integer, "null"]}
        enum_values: {type: array, items: {type: string}}
        help_vi: {type: [string, "null"]}
        position: {type: integer}
        reserved: {type: boolean, description: "plot_ref, season, gps, photo: giá trị lấy từ plot_ref, season_code, gps, file_refs của bản ghi"}
    MrvCatalogVersion:
      type: object
      required: [id, evidence_type, version, status, provisional, source_note, fields, setter_ref, approver_ref, submitted_at, decided_at, decision_note, created_at]
      properties:
        id: {type: string, format: uuid}
        evidence_type: {type: string}
        version: {type: integer}
        status: {type: string, enum: [draft, submitted, approved, rejected]}
        provisional: {type: boolean, description: "Danh mục tạm, chờ chốt C-1"}
        source_note: {type: string}
        fields: {type: array, items: {$ref: "#/components/schemas/MrvField"}}
        setter_ref: {type: string, format: uuid}
        approver_ref: {type: [string, "null"], format: uuid}
        submitted_at: {type: [string, "null"], format: date-time}
        decided_at: {type: [string, "null"], format: date-time}
        decision_note: {type: [string, "null"]}
        created_at: {type: string, format: date-time}
    MrvEvidenceType:
      type: object
      required: [evidence_type, catalog_id, version, provisional, source_note, field_count, approved_at]
      properties:
        evidence_type: {type: string, examples: [awd_log, field_checklist]}
        catalog_id: {type: string, format: uuid, description: "id của phiên bản danh mục đã duyệt mới nhất"}
        version: {type: integer, minimum: 1, description: "Số phiên bản đã duyệt mới nhất — giá trị app gửi trong catalog_version"}
        provisional: {type: boolean, description: "Danh mục tạm, chờ chốt C-1"}
        source_note: {type: string}
        field_count: {type: integer}
        approved_at: {type: [string, "null"], format: date-time}
    MrvFileRef:
      type: object
      required: [file_ref, sha256]
      properties:
        file_ref: {type: string, format: uuid, description: "Tệp đã mã hóa phong bì (POST /v1/files)"}
        sha256: {type: string, pattern: "^[0-9a-f]{64}$", description: "Băm ciphertext"}
    MrvGPS:
      type: object
      description: Dữ liệu cá nhân khi gắn với hộ — không ghi log
      required: [lat, lon]
      properties:
        lat: {$ref: "#/components/schemas/Decimal"}
        lon: {$ref: "#/components/schemas/Decimal"}
        accuracy_m: {oneOf: [{$ref: "#/components/schemas/Decimal"}, {type: "null"}]}
    MrvEvidenceInput:
      type: object
      required: [evidence_type, admin_unit_code, values, event_time]
      properties:
        id: {type: string, format: uuid, description: "UUIDv7 sinh trên máy (R-11)"}
        evidence_type: {type: string, examples: [awd_log, field_checklist]}
        catalog_version: {type: integer, minimum: 1, description: "Phiên bản danh mục máy đang dùng; bỏ trống = bản đã duyệt mới nhất (được ghim)"}
        admin_unit_code: {type: string, description: "Xã nơi thu"}
        plot_ref: {type: string, format: uuid}
        household_ref: {type: string, format: uuid, description: "Có → bắt buộc đồng ý mục đích mrv.evidence"}
        season_code: {type: string}
        values:
          type: object
          description: Giá trị theo khóa trường của danh mục; decimal là CHUỖI (R-10); photo là mảng file_ref
          additionalProperties: true
        file_refs: {type: array, maxItems: 20, items: {$ref: "#/components/schemas/MrvFileRef"}}
        gps: {$ref: "#/components/schemas/MrvGPS"}
        event_time: {type: string, format: date-time}
        supersedes_id: {type: string, format: uuid, description: "Bản ghi bù: id bản HIỆN HÀNH bị thay"}
        correction_reason: {type: string, minLength: 10, maxLength: 1000}
        device_id: {type: string}
    MrvEvidence:
      type: object
      required: [id, root_id, chain_version, evidence_type, catalog_version, admin_unit_code, plot_ref, household_ref, season_code, values, file_refs, gps, event_time, recorded_at, captured_by, device_id, supersedes_id, correction_reason, seq]
      properties:
        id: {type: string, format: uuid}
        root_id: {type: string, format: uuid}
        chain_version: {type: integer}
        evidence_type: {type: string}
        catalog_version: {type: integer}
        admin_unit_code: {type: string}
        plot_ref: {type: [string, "null"], format: uuid}
        household_ref: {type: [string, "null"], format: uuid}
        season_code: {type: [string, "null"]}
        values: {type: object, additionalProperties: true}
        file_refs: {type: array, items: {$ref: "#/components/schemas/MrvFileRef"}}
        gps: {oneOf: [{$ref: "#/components/schemas/MrvGPS"}, {type: "null"}]}
        event_time: {type: string, format: date-time}
        recorded_at: {type: string, format: date-time}
        captured_by: {type: string, format: uuid}
        device_id: {type: [string, "null"]}
        supersedes_id: {type: [string, "null"], format: uuid}
        correction_reason: {type: [string, "null"]}
        seq: {type: integer}
        review_status: {type: string, enum: [pending, accepted, rejected], description: "Chỉ có trong danh sách"}
    MrvReview:
      type: object
      required: [id, evidence_id, root_id, decision, reason, reviewer_ref, event_time, recorded_at, seq]
      properties:
        id: {type: string, format: uuid}
        evidence_id: {type: string, format: uuid}
        root_id: {type: string, format: uuid}
        decision: {type: string, enum: [accepted, rejected]}
        reason: {type: string}
        reviewer_ref: {type: string, format: uuid}
        event_time: {type: string, format: date-time}
        recorded_at: {type: string, format: date-time}
        seq: {type: integer}
    MrvEvidenceView:
      type: object
      required: [evidence, head_id, is_current, review_status, chain, reviews]
      properties:
        evidence: {$ref: "#/components/schemas/MrvEvidence"}
        head_id: {type: string, format: uuid}
        is_current: {type: boolean}
        review_status: {type: string, enum: [pending, accepted, rejected]}
        chain: {type: array, items: {$ref: "#/components/schemas/MrvEvidence"}}
        reviews: {type: array, items: {$ref: "#/components/schemas/MrvReview"}}
    MrvExportFilters:
      type: object
      properties:
        evidence_type: {type: string}
        admin_unit_codes: {type: array, items: {type: string}, description: "Bỏ trống = toàn bộ phạm vi người gọi (giải ra danh sách xã lúc yêu cầu)"}
        all_units: {type: boolean, readOnly: true, description: "Do máy chủ đặt khi phạm vi toàn quốc"}
        season_code: {type: string}
        event_from: {type: string, format: date-time}
        event_to: {type: string, format: date-time}
        review_status: {type: string, enum: [pending, accepted, rejected]}
    MrvExport:
      type: object
      required: [id, status, filters, requested_by, requested_at, object_key, package_sha256, snapshot_sha256, evidence_count, error_code, completed_at]
      properties:
        id: {type: string, format: uuid}
        status: {type: string, enum: [queued, completed, failed]}
        filters: {$ref: "#/components/schemas/MrvExportFilters"}
        requested_by: {type: string, format: uuid}
        requested_at: {type: string, format: date-time, description: "Mốc ảnh chụp dữ liệu (as_of)"}
        object_key: {type: [string, "null"]}
        package_sha256: {type: [string, "null"]}
        snapshot_sha256: {type: [string, "null"], description: "SHA-256 của JSON chuẩn hóa (khóa sắp xếp) của trường snapshot trong gói"}
        evidence_count: {type: [integer, "null"]}
        error_code: {type: [string, "null"]}
        completed_at: {type: [string, "null"], format: date-time}
    ContentKind:
      type: string
      enum: [procedure, guide, news, alert, supplement]
      description: procedure = quy trình kỹ thuật chuẩn quốc gia; supplement = hướng dẫn đặc thù địa phương gắn quy trình gốc; alert = cảnh báo khẩn (phát thông báo đẩy theo vùng)
    ContentAudience:
      type: object
      required: [level, units]
      properties:
        level: {type: string, enum: [national, province, commune]}
        units: {type: array, items: {type: string}, description: "Rỗng với national; [mã tỉnh] với province; mã các xã (cùng tỉnh) với commune"}
        province_code: {type: [string, "null"], description: Tỉnh sở hữu (chỉ đọc)}
    ContentDocument:
      type: object
      required: [ref, kind, audience, status, tags]
      properties:
        ref: {type: string, format: uuid}
        kind: {$ref: "#/components/schemas/ContentKind"}
        audience: {$ref: "#/components/schemas/ContentAudience"}
        parent_ref: {type: [string, "null"], format: uuid}
        status: {type: string, enum: [draft, review, published, retired]}
        title: {type: [string, "null"], description: Tiêu đề của bản xuất bản hiện hành}
        summary: {type: [string, "null"]}
        category: {type: [string, "null"]}
        tags: {type: array, items: {type: string}}
        published_version_no: {type: [integer, "null"]}
        published_at: {type: [string, "null"], format: date-time}
        publisher_ref: {type: [string, "null"], format: uuid}
        retired_at: {type: [string, "null"], format: date-time}
        retire_reason: {type: [string, "null"]}
    ContentAttachment:
      type: object
      required: [id, file_name, content_type, size, sha256, role]
      properties:
        id: {type: string, format: uuid}
        file_name: {type: string}
        content_type: {type: string, enum: [application/pdf, application/vnd.openxmlformats-officedocument.wordprocessingml.document, image/jpeg, image/png, image/webp, video/mp4]}
        size: {type: integer, maximum: 15728640}
        sha256: {type: string, pattern: "^[0-9a-f]{64}$"}
        role: {type: string, enum: [attachment, cover]}
        url: {type: [string, "null"], description: "URL tải có hạn; không ghi log (R-92)"}
        url_expires_at: {type: [string, "null"], format: date-time}
    ContentVersion:
      type: object
      required: [id, version_no, status, title, body, body_format, tags, attachments]
      properties:
        id: {type: string, format: uuid}
        version_no: {type: integer, minimum: 1}
        status: {type: string, enum: [draft, review, published, superseded, discarded, returned]}
        title: {type: string}
        summary: {type: string}
        body: {type: string, description: "Đã qua bộ lọc allow-list (không script, không on*, liên kết chỉ http/https/mailto/att:<id>). Client hiển thị Markdown ở chế độ tắt HTML thô."}
        body_format: {type: string, enum: [markdown, html]}
        category: {type: [string, "null"]}
        tags: {type: array, items: {type: string}}
        author_ref: {type: string, format: uuid}
        recorded_at: {type: string, format: date-time}
        attachments: {type: array, items: {$ref: "#/components/schemas/ContentAttachment"}}
    ContentVersionInfo:
      type: object
      required: [version_no, id, status, title, author_ref, recorded_at]
      properties:
        version_no: {type: integer}
        id: {type: string, format: uuid}
        status: {type: string, enum: [draft, review, published, superseded, discarded, returned]}
        title: {type: string}
        author_ref: {type: string, format: uuid}
        recorded_at: {type: string, format: date-time}
        published_at: {type: [string, "null"], format: date-time}
        publisher_ref: {type: [string, "null"], format: uuid}
        return_reason: {type: [string, "null"]}
    # --- hết pf/content ---

    PolygonGeometry:
      type: object
      description: GeoJSON (RFC 7946) Polygon hoặc MultiPolygon, WGS84 kinh/vĩ độ (EPSG:4326). Vòng chưa khép được tự khép. Tối thiểu 4 đỉnh phân biệt không thẳng hàng mỗi mảnh.
      required: [type, coordinates]
      properties:
        type: {type: string, enum: [Polygon, MultiPolygon]}
        coordinates: {type: array}
    PlotProperties:
      type: object
      required: [ref, code, name, commune_code, cooperative_ref, household_ref, status, status_reason, version, boundary_id, area_ha, source, needs_review, revision, created_at, updated_at]
      properties:
        ref: {type: string, format: uuid}
        code: {type: string, description: "Mã thửa hiển thị, vd TH0000001"}
        name: {type: [string, "null"]}
        commune_code: {type: string}
        cooperative_ref: {type: [string, "null"], format: uuid, description: "null = KN vẽ trước, chưa gán HTX (\"Nháp - KN vẽ trước\")"}
        household_ref: {type: [string, "null"], format: uuid}
        status: {type: string, enum: [draft, active, retired]}
        status_reason: {type: [string, "null"]}
        version: {type: integer, description: "Phiên bản ranh giới hiện hành"}
        boundary_id: {type: string, format: uuid}
        area_ha: {$ref: "#/components/schemas/Decimal"}
        source: {type: string, enum: [kn_web, kn_field_app, htx_app, import_file, cadastral]}
        needs_review: {type: boolean, description: "Có xung đột chồng lấn chờ xử lý"}
        revision: {type: integer}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    PlotFeature:
      type: object
      required: [type, id, geometry, properties]
      properties:
        type: {type: string, enum: [Feature]}
        id: {type: string, format: uuid}
        geometry: {$ref: "#/components/schemas/PolygonGeometry"}
        properties: {$ref: "#/components/schemas/PlotProperties"}
    PlotBoundaryInput:
      type: object
      required: [geometry]
      properties:
        boundary_id: {type: string, format: uuid, description: "UUIDv7 sinh trên máy (R-11); bỏ trống → server sinh"}
        geometry: {$ref: "#/components/schemas/PolygonGeometry"}
        gps_accuracy_m: {$ref: "#/components/schemas/Decimal"}
        source: {type: string, enum: [kn_web, kn_field_app, htx_app, import_file, cadastral], default: kn_web}
