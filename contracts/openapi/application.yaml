        "200":
          description: Danh mục
          content:
            application/json:
              schema:
                type: object
                required: [counts, items]
                properties:
                  counts:
                    type: array
                    items:
                      type: object
                      required: [kind, label, active, total]
                      properties:
                        kind: {$ref: "#/components/schemas/KhtcCatalogKind"}
                        label: {type: string}
                        active: {type: integer}
                        total: {type: integer}
