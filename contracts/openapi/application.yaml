openapi: 3.1.0
info:
  title: AgriGreen Application API
  version: "1"
  description: |
    Bề mặt Application (api.<domain>) — OIDC + JWT (mục 11).
    Mọi POST bắt buộc Idempotency-Key (R-51). Lỗi theo RFC 9457 (docs/errors.md).
    Tenant lấy từ token, không bao giờ từ path/query/body (R-16).
servers:
  - url: https://api.agrigreen.vn
security:
  - oidc: []
paths:
  /v1/consents:
    post:
      summary: Ghi một bản ghi đồng ý theo mục đích (sổ chỉ ghi thêm)
      operationId: recordConsent
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ConsentInput"}
      responses:
        "201":
          description: Đã ghi. Gọi lặp cùng khóa trả lại đúng phản hồi này, kèm header Idempotent-Replayed.
          headers:
            Location: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Consent"}
        "400": {$ref: "#/components/responses/Problem"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
    get:
      summary: Lịch sử đồng ý của một chủ thể (phân trang cursor, R-53)
      operationId: listConsents
      parameters:
        - {name: subject_ref, in: query, required: true, schema: {type: string, format: uuid}}
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        "200":
          description: Một trang
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/Consent"}}
                  next_cursor: {type: [string, "null"]}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/consents/{id}:
    get:
      operationId: getConsent
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Bản ghi
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Consent"}
        "404": {$ref: "#/components/responses/Problem"}
  # --- pf/masterdata (chỉ đọc; ghi qua Admin API — contracts/openapi/admin.yaml) ---

  # Dữ liệu chủ là dữ liệu tham chiếu của tenant: mọi người gọi đã xác thực đều đọc được.
  /v1/masterdata/admin-units:
    get:
      summary: Đơn vị con trực tiếp có hiệu lực tại thời điểm at (parent bỏ trống → các tỉnh)
      operationId: listAdminUnits
      tags: [masterdata]
      parameters:
        - {name: parent, in: query, schema: {type: string}}
        - $ref: "#/components/parameters/At"
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        "200":
          description: Một trang, theo mã
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/AdminUnit"}}
                  next_cursor: {type: [string, "null"]}
        "404": {description: masterdata.admin_unit_not_found, $ref: "#/components/responses/Problem"}
  /v1/masterdata/admin-units/{code}:
    get:
      summary: Đơn vị có hiệu lực tại at (cùng một mã có thể là đơn vị khác nhau ở hai thời điểm)
      operationId: getAdminUnit
      tags: [masterdata]
      parameters:
        - $ref: "#/components/parameters/UnitCode"
        - $ref: "#/components/parameters/At"
      responses:
        "200":
          description: Đơn vị
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AdminUnit"}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/masterdata/admin-units/{code}/tree:
    get:
      summary: Cây đơn vị (chính nó và mọi đơn vị con cháu) có hiệu lực tại at
      operationId: getAdminUnitTree
      tags: [masterdata]
      parameters:
        - $ref: "#/components/parameters/UnitCode"
        - $ref: "#/components/parameters/At"
      responses:
        "200":
          description: Cây
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AdminUnitNode"}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/masterdata/admin-units/{code}/current:
    get:
      summary: Mã hiện hành (tại at) của một mã có thể đã cũ — đi theo chuỗi sáp nhập/chia tách
      operationId: currentAdminUnitCodes
      tags: [masterdata]
      parameters:
        - $ref: "#/components/parameters/UnitCode"
        - $ref: "#/components/parameters/At"
      responses:
        "200":
          description: Mã hiện hành
          content:
            application/json:
              schema:
                type: object
                required: [code, at, current_codes]
                properties:
                  code: {type: string}
                  at: {type: string, format: date-time}
                  current_codes: {type: array, items: {type: string}}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/masterdata/catalogs/{catalog}:
    get:
      summary: Danh sách mục của một danh mục (mặc định chỉ mục đang dùng)
      operationId: listCatalog
      tags: [masterdata]
      parameters:
        - $ref: "#/components/parameters/Catalog"
        - {name: include_inactive, in: query, schema: {type: boolean, default: false}}
        - {name: at, in: query, schema: {type: string}, description: "W11.41 — chỉ danh mục cnts_*: giá trị có hiệu lực tại ngày (YYYY-MM-DD hoặc RFC 3339, giờ Việt Nam); có at thì không phân trang (next_cursor null)"}
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        "200":
          description: Một trang, theo mã
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/CatalogItem"}}
                  next_cursor: {type: [string, "null"]}
        "404": {description: masterdata.catalog_not_found, $ref: "#/components/responses/Problem"}
  /v1/masterdata/catalogs/{catalog}/{code}:
    get:
      summary: Một mục danh mục (kể cả đã ngừng dùng)
      operationId: getCatalogItem
      tags: [masterdata]
      parameters:
        - $ref: "#/components/parameters/Catalog"
        - {name: code, in: path, required: true, schema: {type: string}}
        - {name: at, in: query, schema: {type: string}, description: "W11.41 — chỉ danh mục cnts_*: giá trị có hiệu lực tại ngày (YYYY-MM-DD hoặc RFC 3339, giờ Việt Nam); có at thì không phân trang (next_cursor null)"}
      responses:
        "200":
          description: Mục
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CatalogItem"}
        "404": {description: masterdata.catalog_item_not_found, $ref: "#/components/responses/Problem"}
  /v1/masterdata/params/value:
    get:
      summary: Giá trị tham số ĐÃ PHÊ DUYỆT có hiệu lực tại thời điểm của sự việc (CGH QT-01, AC-02)
      operationId: getParamValue
      tags: [masterdata]
      parameters:
        - {name: key, in: query, required: true, schema: {type: string}, examples: {norm: {value: "cgh.norm_ha_per_machine:MGD:thu_hoach"}}}
        - $ref: "#/components/parameters/At"
      responses:
        "200":
          description: Giá trị
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ParamValue"}
        "404": {description: masterdata.param_not_found, $ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/masterdata/display-config:
    get:
      summary: Quy chuẩn hiển thị dùng chung của bản đồ GIS đang hiệu lực (GIS US-CFG-01/02) — bảng màu heatmap giai đoạn, màu mức lấp đầy kho/Hub, ngưỡng %
      description: |
        Mọi người dùng đã xác thực đọc được (legend web). Giá trị là phiên bản ĐÃ DUYỆT đang hiệu lực (người đặt ≠
        người duyệt, R-56 — "áp dụng ngay" của AC nghĩa là áp dụng ngay khi được duyệt); khóa chưa có phiên bản duyệt
        → giá trị mặc định nhúng (source = default).
      operationId: getDisplayConfig
      tags: [masterdata]
      responses:
        "200":
          description: Quy chuẩn hiển thị
          content:
            application/json:
              schema:
                type: object
                required: [as_of, stage_colors, capacity_colors, ripening_outline_color, hub_capacity_warn_pct, hub_capacity_full_pct, plot_layer_min_zoom]
                properties:
                  as_of: {type: string, format: date-time}
                  stage_colors:
                    type: object
                    description: "Theo mã giai đoạn: chuan_bi, sinh_truong, sap_thu, chin_ro, da_thu, none"
                    additionalProperties: {$ref: "#/components/schemas/DisplayValue"}
                  capacity_colors:
                    type: object
                    description: "Theo mức: available, near_full, full, unknown"
                    additionalProperties: {$ref: "#/components/schemas/DisplayValue"}
                  ripening_outline_color: {$ref: "#/components/schemas/DisplayValue"}
                  hub_capacity_warn_pct: {$ref: "#/components/schemas/DisplayValue"}
                  hub_capacity_full_pct: {$ref: "#/components/schemas/DisplayValue"}
                  plot_layer_min_zoom: {$ref: "#/components/schemas/DisplayValue"}
        "401": {$ref: "#/components/responses/Problem"}
  /v1/me:
    get:
      summary: Người gọi hiện tại, đơn vị công tác và phạm vi dữ liệu đã giải (pf/party, ADR-0009)
      description: |
        Mọi người gọi đã xác thực đều gọi được, không cần vai nghiệp vụ. Không chứa dữ liệu cá nhân
        (R-04, R-14): chỉ mã tham chiếu, vai, tên tổ chức và tên đơn vị hành chính.
        Chỉ để giao diện hiển thị; quyền thật do từng module kiểm ở backend (R-55).
        Phản hồi có Cache-Control private, no-store.
      operationId: getMe
      responses:
        "200":
          description: Người gọi
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Me"}
        "401": {$ref: "#/components/responses/Problem"}
        "503": {description: party.dependency_unavailable — chưa nối danh mục đơn vị hành chính, $ref: "#/components/responses/Problem"}
  /v1/me/modules:
    get:
      summary: "Module đã bật cho đơn vị (tenant) của người gọi — W1.4, R-MOD-08: client ẩn màn của module đã tắt"
      description: >-
        Mọi người đã xác thực. Route của module đã tắt trả 403 `module_not_enabled` (problem có `module`); menu
        `GET /v1/menu` đã lọc sẵn ở server. Module `enable: always` luôn `enabled: true`.
      operationId: myModules
      tags: [party]
      responses:
        "200":
          description: Danh sách
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/ModuleEnablement"}}
        "401": {$ref: "#/components/responses/Problem"}
  # --- pf/accounts KN v7.7 gói P1: ngữ cảnh phiên (FN-CH-00.01, gap §4.5 phương án A) ---
  # Keycloak chỉ xác thực. Client chọn vai trò × phòng ban → context_id, gửi header X-AG-Context ở MỌI request (cả Admin API);
  # middleware giải vai, phòng ban, phạm vi ở server. Context lạ / của người khác → 403 accounts.context_invalid; hết hạn → 403
  # accounts.context_expired; vai trò thu hồi, phòng ban không còn Đang áp dụng, tài khoản bị khóa → 403 accounts.context_revoked.
  # Đổi vai trò/phòng ban = chọn lại, không đăng nhập lại.
  /v1/me/contexts:
    get:
      summary: "FN-CH-00.01 B3: các lần gán vai trò còn hiệu lực của người gọi (thẻ vai trò + thẻ phòng ban, Hình 3b) — rỗng với tài khoản không có vai trò KN"
      operationId: knMyContexts
      tags: [accounts]
      responses:
        "200":
          description: Lần gán (phòng ban chưa mở có status not_open — hiện mờ, không chọn được)
          content:
            application/json:
              schema:
                type: object
                required: [assignments]
                properties:
                  assignments: {type: array, items: {$ref: "#/components/schemas/KNAssignment"}}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {description: accounts.account_locked, $ref: "#/components/responses/Problem"}
  /v1/me/context:
    get:
      summary: "Ngữ cảnh phiên của request (header X-AG-Context)"
      operationId: knCurrentContext
      tags: [accounts]
      parameters:
        - {name: X-AG-Context, in: header, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Ngữ cảnh
          content:
            application/json:
              schema: {$ref: "#/components/schemas/KNSessionContext"}
        "403": {$ref: "#/components/responses/Problem"}
        "428": {description: accounts.context_required, $ref: "#/components/responses/Problem"}
    post:
      summary: "FN-CH-00.01 B4: chọn vai trò + phòng ban → context_id (Admin: department_code = null, bắt buộc MFA)"
      operationId: knSelectContext
      tags: [accounts]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assignment_id, department_code]
              properties:
                assignment_id: {type: string, format: uuid}
                department_code: {type: [string, "null"]}
      responses:
        "201":
          description: Ngữ cảnh mới (hết hạn sau 24 giờ hoặc khi lần gán hết hiệu lực)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/KNSessionContext"}
        "403": {description: "accounts.account_locked, mfa_required (Admin)", $ref: "#/components/responses/Problem"}
        "404": {description: accounts.assignment_not_found, $ref: "#/components/responses/Problem"}
        "409": {description: accounts.department_not_open, $ref: "#/components/responses/Problem"}
        "422": {description: accounts.department_required, $ref: "#/components/responses/Problem"}
  /v1/orgs:
    get:
      summary: Tổ chức trong phạm vi của người gọi (phân trang cursor)
      operationId: listOrgs
      parameters:
        - {name: kind, in: query, schema: {$ref: "#/components/schemas/OrgKind"}}
        - {name: include_inactive, in: query, schema: {type: boolean, default: false}}
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        "200":
          description: Một trang
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/Org"}}
                  next_cursor: {type: [string, "null"]}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
  # --- pf/party KN v7.7 gói P2: phòng ban, menu theo cấu hình (UR-KT-02), khu vực, cây 3 cấp ---
  /v1/orgs/tree:
    get:
      summary: "FN-AD-04.02: cây TTKNQG › TTKN tỉnh › Khu vực › Xã trong phạm vi người gọi (xem xuống, không ngang, không lên)"
      operationId: knOrgTree
      tags: [party]
      parameters:
        - {name: include_inactive, in: query, schema: {type: boolean, default: false}}
      responses:
        "200":
          description: Rừng cây (gốc = Nút thấy được cao nhất); xã chưa gán khu vực vào nhóm region_unassigned
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/KNOrgTreeNode"}}
        "401": {$ref: "#/components/responses/Problem"}
  /v1/me/delegations:
    get:
      summary: "W11.07 Ủy quyền có hạn người gọi đã giao hoặc đã nhận"
      operationId: knMyDelegations
      tags: [accounts]
      responses:
        "200":
          description: Mới nhất trước
          content:
            application/json:
              schema: {$ref: "#/components/schemas/KNDelegationList"}
    post:
      summary: "W11.07 Lãnh đạo phòng ủy quyền có hạn (≤ 30 ngày) cho cán bộ Cấp Tỉnh cùng đơn vị, cùng phòng ban của phiên"
      operationId: knCreateDelegation
      tags: [accounts]
      parameters:
        - {name: X-AG-Context, in: header, required: true, schema: {type: string, format: uuid}}
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [grantee_ref, power, valid_to, reason]
              properties:
                grantee_ref: {type: string, format: uuid}
                department_code: {type: string, description: "Vắng = phòng ban của ngữ cảnh; khác → 403"}
                power: {type: string, enum: [mo_lai_ky, duyet_bao_cao]}
                valid_from: {type: string, format: date-time}
                valid_to: {type: string, format: date-time}
                reason: {type: string}
      responses:
        "201":
          description: Đã ủy quyền
          content:
            application/json:
              schema: {$ref: "#/components/schemas/KNDelegation"}
        "200":
          description: Gọi lặp
          content:
            application/json:
              schema: {$ref: "#/components/schemas/KNDelegation"}
        "403": {description: "accounts.delegation_forbidden, accounts.context_read_only", $ref: "#/components/responses/Problem"}
        "422": {description: "validation_failed, accounts.delegation_grantee_invalid", $ref: "#/components/responses/Problem"}
  /v1/me/delegations/{id}/revoke:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      summary: "W11.07 Người giao thu hồi ủy quyền còn hiệu lực (lý do ≥ 10 ký tự)"
      operationId: knRevokeDelegation
      tags: [accounts]
      parameters:
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [reason], properties: {reason: {type: string}}}
      responses:
        "200":
          description: Đã thu hồi
          content:
            application/json:
              schema: {$ref: "#/components/schemas/KNDelegation"}
        "404": {description: "accounts.delegation_not_found", $ref: "#/components/responses/Problem"}
        "409": {description: "accounts.delegation_state", $ref: "#/components/responses/Problem"}
  /v1/internal-units:
    get:
      summary: "W11.07 Đơn vị nội bộ của đơn vị (đọc)"
      operationId: knListInternalUnits
      tags: [accounts]
      parameters:
        - {name: org_ref, in: query, schema: {type: string, format: uuid}}
        - {name: include_inactive, in: query, schema: {type: boolean, default: false}}
      responses:
        "200":
          description: Theo thứ tự hiển thị
          content:
            application/json:
              schema: {$ref: "#/components/schemas/InternalUnitList"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/departments:
    get:
      summary: "Phòng ban của đơn vị (bước 2 đăng nhập, FN-CH-00.01) — chỉ selectable = true chọn được"
      operationId: knListDepartments
      tags: [party]
      parameters:
        - {name: org_ref, in: query, schema: {type: string, format: uuid}, description: "Đơn vị; vắng = Nút cấp 1/2 gần nhất của Nút người gọi"}
      responses:
        "200":
          description: Danh sách theo thứ tự hiển thị (account_count/record_count luôn null ở Application API)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/KNDepartmentList"}
        "401": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/departments/{code}/modules:
    get:
      summary: "UR-KT-02: cây module (menu) của một phòng ban cho vai KN — bật phòng ban không cần phát hành lại web/app"
      description: |
        Dựng từ bảng menu tĩnh có phiên bản (kn.menu/v3: khuôn theo phòng ban + nhóm "Dùng chung" cuối mọi menu; mục module chưa có hiện "Sắp có", enabled = false, status coming_soon) và trạng thái phòng ban hiện hành ở MỖI request (Cache-Control: no-store).
        audience vắng: theo ngữ cảnh phiên (P1) hoặc vai duy nhất của người gọi. platform_admin xem được mọi cấp (FN-AD-04.07).
        audience = admin: mục con của phòng ban trong nhóm "Phòng ban" (enabled = false khi chưa mở).
      operationId: knDepartmentModules
      tags: [party]
      parameters:
        - {name: code, in: path, required: true, schema: {type: string}}
        - {name: audience, in: query, schema: {type: string, enum: [kn_tw, kn_tinh, kn_xa, admin]}}
        - {name: role, in: query, deprecated: true, schema: {type: string, enum: [kn_tw, kn_tinh, kn_xa, admin]}, description: "Tên cũ của audience (hợp đồng tạm P6) — nhận một đợt; audience thắng"}
        - {name: org_ref, in: query, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Menu
          content:
            application/json:
              schema: {$ref: "#/components/schemas/KNMenu"}
        "403": {description: party.menu_audience_forbidden, $ref: "#/components/responses/Problem"}
        "404": {description: party.department_not_found, $ref: "#/components/responses/Problem"}
        "409": {description: party.department_not_open, $ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/menu:
    get:
      summary: "UR-KT-02, BRD §6: sidebar đầy đủ theo vai + phòng ban của phiên (Admin: Điều hành / Phòng ban / Quản trị hệ thống)"
      description: |
        web-ops/app gọi KHÔNG tham số kèm header X-AG-Context: server lấy vai + phòng ban từ ngữ cảnh phiên (P1).
        Đường dẫn (route) là trang web-ops: "/kn/<màn>" (vai + phòng ban ở ngữ cảnh, không ở URL); màn Admin theo
        phòng ban "/kn/phong-ban/{mã phòng ban}/<màn>"; màn hiện có ngoài /kn giữ đường dẫn cũ. Bản giả lập web
        khớp bảng Go qua ca vàng apps/web-ops/src/api/mock/fixtures/kn-menu.json.
      operationId: knMenu
      tags: [party]
      parameters:
        - {name: audience, in: query, schema: {type: string, enum: [kn_tw, kn_tinh, kn_xa, admin]}, description: "Vắng = theo ngữ cảnh phiên (X-AG-Context) hoặc vai duy nhất"}
        - {name: role, in: query, deprecated: true, schema: {type: string, enum: [kn_tw, kn_tinh, kn_xa, admin]}, description: "Tên cũ của audience (hợp đồng tạm P6) — nhận một đợt; audience thắng"}
        - {name: department, in: query, schema: {type: string}, description: "Vắng = phòng ban của ngữ cảnh phiên, hoặc phòng ban Đang áp dụng duy nhất của đơn vị"}
        - {name: org_ref, in: query, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Menu
          content:
            application/json:
              schema: {$ref: "#/components/schemas/KNMenu"}
        "403": {description: party.menu_audience_forbidden, $ref: "#/components/responses/Problem"}
        "404": {description: party.department_not_found, $ref: "#/components/responses/Problem"}
        "409": {description: party.department_not_open, $ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/regions:
    get:
      summary: "FN-AD-04.02: khu vực của tỉnh kèm số xã được gán (mọi vai chọn/lọc theo Khu vực)"
      operationId: knListRegions
      tags: [party]
      parameters:
        - {name: province_code, in: query, required: true, schema: {type: string}}
        - {name: include_inactive, in: query, schema: {type: boolean, default: false}}
      responses:
        "200":
          description: Danh sách
          content:
            application/json:
              schema: {$ref: "#/components/schemas/KNRegionList"}
        "401": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  # --- hết pf/party KN v7.7 gói P2 ---
  /v1/cooperatives:
    get:
      summary: HTX/THT trong phạm vi, tìm theo tên, Mã HTX hoặc mã số thuế
      operationId: listCooperatives
      parameters:
        - {name: q, in: query, schema: {type: string}}
        - {name: admin_unit, in: query, description: "G-03: mã tỉnh hoặc xã hiện hành — chỉ HTX thuộc đơn vị này (và con cháu) giao với phạm vi người gọi; mã không có hiệu lực → 422 validation_failed (trường admin_unit)", schema: {type: string}}
        - {name: include_inactive, in: query, schema: {type: boolean, default: false}}
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        "200":
          description: Một trang
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/Cooperative"}}
                  next_cursor: {type: [string, "null"]}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/cooperatives/{ref}:
    get:
      summary: Hồ sơ HTX (ngoài phạm vi → 404)
      operationId: getCooperative
      parameters:
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Hồ sơ
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Cooperative"}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/cooperatives/{ref}/households:
    get:
      summary: Nông hộ thành viên của HTX, kèm nhãn hiển thị đã che (không bao giờ có định danh đầy đủ)
      description: |
        HTX US-HH-01 AC-2: `phone` tìm ĐÚNG một SĐT qua chỉ mục mù của kho định danh (mục đích registry.admin, kho ghi sổ
        tra cứu) — trả tối đa một hộ của HTX này, SĐT lạ hoặc hộ HTX khác → danh sách rỗng; giá trị không phải SĐT → 422.
        Không tìm theo họ tên: họ tên chỉ nằm ở kho định danh (R-04), pf không lọc được.
      operationId: listCooperativeHouseholds
      parameters:
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: phone, in: query, description: "SĐT chủ hộ cần tìm (khớp chính xác sau chuẩn hóa)", schema: {type: string, maxLength: 20}}
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        "200":
          description: Một trang
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/HouseholdListItem"}}
                  next_cursor: {type: [string, "null"]}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/bilateral/pairs:
    get:
      summary: Cặp song phương của HTX người gọi (W5.6, ADR-0034)
      description: |
        Luồng song phương MKG ↔ HTX (hợp đồng proposed — chỉ phục vụ ngoài production với AG_BILATERAL_ALLOW_PROPOSED=1,
        bật production chờ C-12). Người gọi: vai coop_manager, đơn vị công tác (org_ref) là Nút HTX có hồ sơ. Cán bộ KN cấp
        trên cùng tenant không thấy (chính sách hai bên so khớp Nút bằng).
      operationId: listBilateralPairs
      responses:
        "200":
          description: Danh sách cặp
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/BilateralPair"}}
        "403": {$ref: "#/components/responses/Problem"}
    post:
      summary: Lập cặp song phương giữa HTX người gọi và tenant đối tác (chỉ bên HTX lập)
      operationId: establishBilateralPair
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [counterparty_tenant_id]
              additionalProperties: false
              properties:
                counterparty_tenant_id: {type: string, format: uuid, description: "Tenant đối tác (MKG)"}
      responses:
        "201":
          description: Đã lập
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BilateralPair"}
        "403": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/bilateral/pairs/{pair_id}/terminate:
    post:
      summary: Chấm dứt cặp song phương (bản ghi cũ giữ nguyên; đối tác bị từ chối ghi và đọc feed cặp từ lời gọi kế tiếp)
      operationId: terminateBilateralPair
      parameters:
        - {name: pair_id, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              additionalProperties: false
              properties:
                reason: {type: string, minLength: 10, maxLength: 500}
      responses:
        "200":
          description: Đã chấm dứt
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BilateralPair"}
        "403": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/bilateral/pairs/{pair_id}/records:
    get:
      summary: Bản ghi song phương của cặp (lịch gom, bảng kê số cuộn của MKG; xác nhận/phản đối của HTX), theo seq
      operationId: listBilateralRecords
      parameters:
        - {name: pair_id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: after, in: query, schema: {type: integer, minimum: 0, default: 0}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 1000, default: 100}}
      responses:
        "200":
          description: Một trang
          content:
            application/json:
              schema:
                type: object
                required: [items, next_after]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/BilateralRecord"}}
                  next_after: {type: integer}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/bilateral/confirmations:
    post:
      summary: HTX xác nhận / phản đối số cuộn của một revision bảng kê (bản ghi htx_roll_confirmation v1, RB-6)
      description: |
        Thân = một bản ghi đúng hợp đồng contracts/integration/ingest/htx_roll_confirmation.v1.json (mặc định từ chối);
        htx_ref phải là HTX của người gọi; bảng kê (statement_ref, statement_revision) phải có trong cặp và mkg_rolls khớp;
        phản đối phải có htx_rolls + reason. Idempotent theo confirmation_ref (cùng nội dung → 200 bản ghi cũ; khác → 409).
      operationId: confirmBilateralRolls
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: true}
      responses:
        "201":
          description: Đã ghi
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BilateralRecord"}
        "200":
          description: Đã ghi trước đó (cùng nội dung)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BilateralRecord"}
        "403": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/households:
    post:
      summary: Tạo nông hộ — định danh chủ hộ đi thẳng vào kho định danh; trùng SĐT/CCCD → dùng lại mã cũ, báo "trùng"
      operationId: createHousehold
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/HouseholdInput"}
      responses:
        "201":
          description: Đã tạo
          content:
            application/json:
              schema: {$ref: "#/components/schemas/HouseholdCreated"}
        "200":
          description: Trùng chủ hộ đã có (duplicate = true, duplicate_label = "trùng")
          content:
            application/json:
              schema: {$ref: "#/components/schemas/HouseholdCreated"}
        "403": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
  /v1/households/copy:
    post:
      summary: Sao chép hàng loạt nông hộ, sửa riêng họ tên/SĐT từng hồ sơ mới (HTX US-HH-02 AC-2..4)
      description: |
        Mỗi hồ sơ mới giữ HTX, xã, diện tích canh tác của hộ nguồn; định danh (họ tên, SĐT, CCCD, địa chỉ) là của hồ sơ mới,
        đi thẳng vào kho định danh — định danh hộ nguồn không được đọc hay chép. Hồ sơ lỗi bị loại kèm lý do
        ("Thiếu họ tên", "Thiếu SĐT", "SĐT đã tồn tại", "Bạn không có quyền truy cập nông hộ này.", "Không tìm thấy nông hộ nguồn"),
        không chặn hồ sơ khác. Quản lý HTX chỉ sao chép trong HTX của mình. Tối đa 50 hồ sơ mỗi lần.
      operationId: copyHouseholds
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                target_cooperative_ref: {type: [string, "null"], format: uuid, description: "HTX của hồ sơ mới; bỏ trống = HTX hiện tại của hộ nguồn"}
                items:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items:
                    type: object
                    required: [source_ref, full_name, phone]
                    properties:
                      source_ref: {type: string, format: uuid}
                      full_name: {type: string}
                      phone: {type: string}
                      national_id: {type: string}
                      address: {type: string}
      responses:
        "200":
          description: Kết quả từng hồ sơ
          content:
            application/json:
              schema:
                type: object
                required: [created, rejected, rows]
                properties:
                  created: {type: integer}
                  rejected: {type: integer}
                  rows:
                    type: array
                    items:
                      type: object
                      required: [index, source_ref, status, reason, household_ref]
                      properties:
                        index: {type: integer, minimum: 1, description: "Thứ tự hồ sơ trong items (từ 1)"}
                        source_ref: {type: string, format: uuid}
                        status: {type: string, enum: [created, rejected]}
                        reason: {type: [string, "null"], description: "Không chứa dữ liệu cá nhân"}
                        household_ref: {type: [string, "null"], format: uuid}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
  /v1/households/{ref}/contact:
    get:
      summary: SĐT chủ hộ lúc bấm gọi nhanh (HTX US-HH-03) — đọc từ kho định danh với mục đích extension.contact, không lưu đệm
      description: |
        Trả `Cache-Control: no-store`; không ghi log giá trị. Quản lý HTX chỉ gọi hộ của HTX mình (khác → 403
        party.out_of_scope "Bạn không có quyền truy cập nông hộ này."). Chưa có SĐT / đã xóa định danh → 404
        party.household_contact_unavailable. Máy/trình duyệt không gọi được → client báo "Không thể khởi tạo cuộc gọi trên thiết bị này." (AC-2).
      operationId: getHouseholdContact
      parameters:
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: SĐT
          headers:
            Cache-Control: {schema: {type: string, enum: [no-store]}}
          content:
            application/json:
              schema:
                type: object
                required: [household_ref, phone]
                properties:
                  household_ref: {type: string, format: uuid}
                  phone: {type: string}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
  # --- pf/sync --- (docs/dev/sync-contract.md)

  /v1/devices:
    post:
      summary: Đăng ký thiết bị hiện trường cho người gọi (actor_ref, org_ref lấy từ token)
      operationId: registerDevice
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SyncDeviceInput"}
      responses:
        "201":
          description: Đã đăng ký
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SyncDevice"}
        "200":
          description: Cùng người đăng ký lại cùng mã (cài lại, nâng cấp app) — cập nhật app_version
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SyncDevice"}
        "403": {description: "sync.device_revoked — mã đã bị thu hồi; máy xóa dữ liệu và sinh mã mới", $ref: "#/components/responses/Problem"}
        "409": {description: "sync.device_taken", $ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/sync/pull:
    get:
      summary: Thay đổi chiều xuống theo phạm vi phân công (cursor mờ có chữ ký, round-robin giữa các entity)
      operationId: syncPull
      parameters:
        - $ref: "#/components/parameters/DeviceID"
        - {name: cursor, in: query, description: "next_cursor của trang trước; bỏ trống = từ đầu", schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 1000, default: 500}}
        - name: entities
          in: query
          description: "KN US-SYNC-02: chỉ đọc các entity này (phân tách dấu phẩy hoặc lặp tham số); con trỏ giữ vị trí entity khác"
          schema: {type: array, items: {type: string}}
          style: form
          explode: true
      responses:
        "200":
          description: Một trang
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SyncPullPage"}
        "400": {description: "sync.cursor_invalid — con trỏ bị sửa hoặc của thiết bị khác; pull lại từ đầu", $ref: "#/components/responses/Problem"}
        "403": {description: "sync.device_unregistered | sync.device_revoked", $ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/sync/push:
    post:
      summary: Gửi một lô bản ghi chỉ ghi thêm; kết quả theo từng bản ghi
      operationId: syncPush
      parameters:
        - {$ref: "#/components/parameters/IdempotencyKey", description: "Mã lô do máy sinh"}
        - $ref: "#/components/parameters/DeviceID"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SyncPushBatch"}
      responses:
        "200":
          description: Kết quả theo thứ tự bản ghi gửi lên. Gọi lặp cùng Idempotency-Key trả đúng phản hồi này.
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results: {type: array, items: {$ref: "#/components/schemas/SyncPushResult"}}
        "403": {description: "sync.device_unregistered | sync.device_revoked", $ref: "#/components/responses/Problem"}
        "422": {description: "device_id khác header, quá 500 bản ghi", $ref: "#/components/responses/Problem"}
  /v1/files:
    post:
      summary: Tải tệp minh chứng đã mã hóa phong bì (chỉ bản mã, ≤ 15 MB)
      operationId: uploadFile
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/DeviceID"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [meta, blob]
              properties:
                meta: {$ref: "#/components/schemas/SyncEnvelopeMeta"}
                blob: {type: string, format: binary, description: "Bản mã AES-256-GCM ‖ tag; SHA-256 phải bằng meta.sha256_ciphertext"}
                file_ref: {type: string, format: uuid, description: "Tùy chọn: UUIDv7 máy sinh để bản ghi evidence ngoại tuyến tham chiếu trước khi tải"}
                subject_module: {type: string, pattern: "^(pf|mkg)/[a-z][a-z0-9]{1,39}$", description: "Tùy chọn (W6.5, R-DB-07): module chủ của thực thể gắn tệp; đi cùng subject_type, subject_id", examples: [pf/cooperative]}
                subject_type: {type: string, pattern: "^[a-z][a-z0-9_]{1,39}$", description: "Loại thực thể module chủ cho tham chiếu", examples: [plot, household, diary_entry]}
                subject_id: {type: string, format: uuid, description: "Mã thực thể — module chủ phải phân giải được trong tenant người gọi"}
            encoding:
              meta: {contentType: application/json}
      responses:
        "201":
          description: Đã lưu
          headers:
            Location: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SyncFileCreated"}
        "200":
          description: Cùng file_ref, cùng bản mã đã có
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SyncFileCreated"}
        "403": {description: "sync.device_unregistered | sync.device_revoked", $ref: "#/components/responses/Problem"}
        "409": {description: "sync.file_ref_taken", $ref: "#/components/responses/Problem"}
        "413": {$ref: "#/components/responses/Problem"}
        "422": {description: "validation_failed | sync.file_checksum_mismatch | evidence.subject_unresolved", $ref: "#/components/responses/Problem"}
        "503": {description: "sync.dependency_unavailable — chưa cấu hình kho đối tượng", $ref: "#/components/responses/Problem"}
  /v1/files/{ref}:
    get:
      summary: Siêu dữ liệu tệp + URL tải BẢN MÃ có hạn 5 phút (vai vault_evidence_viewer, có mục đích; mọi quyết định ghi sổ truy cập)
      operationId: getFile
      parameters:
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/Purpose"
      responses:
        "200":
          description: Siêu dữ liệu (gps, captured_at là dữ liệu cá nhân — không lưu đệm)
          content:
            application/json:
              schema:
                type: object
                required: [file, download_url, expires_at]
                properties:
                  file: {$ref: "#/components/schemas/SyncFile"}
                  download_url: {type: string, format: uri}
                  expires_at: {type: string, format: date-time}
        "400": {description: "sync.purpose_required", $ref: "#/components/responses/Problem"}
        "403": {description: "forbidden | sync.purpose_not_allowed | sync.consent_missing | evidence.subject_forbidden", $ref: "#/components/responses/Problem"}
        "404": {description: "sync.file_not_found", $ref: "#/components/responses/Problem"}
  /v1/files/{ref}/content:
    get:
      summary: Nội dung đã giải mã để hiển thị — kho định danh mở DEK theo mục đích; bản rõ chỉ trong bộ nhớ request
      operationId: getFileContent
      parameters:
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/Purpose"
      responses:
        "200":
          description: Bản rõ, Content-Type = content_type của tệp, Cache-Control no-store
          content:
            "*/*":
              schema: {type: string, format: binary}
        "400": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "410": {description: "vault.erased — hộ đã xóa định danh, tệp không còn mở được", $ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
  # Nền MRV G1 (mục 16). Danh mục trường bằng chứng chưa chốt (C-1): danh mục là dữ liệu có

  # phiên bản + phê duyệt (Admin API); mỗi minh chứng ghim phiên bản danh mục đã duyệt lúc thu.
  /v1/mrv/catalog:
    get:
      summary: Phiên bản danh mục trường ĐÃ DUYỆT của một loại minh chứng (app hiện trường dựng biểu mẫu)
      operationId: getMrvApprovedCatalog
      parameters:
        - {name: evidence_type, in: query, required: true, schema: {type: string, pattern: "^[a-z][a-z0-9_]{2,39}$", examples: [awd_log, field_checklist]}}
        - {name: version, in: query, description: "Bỏ trống = bản đã duyệt mới nhất", schema: {type: integer, minimum: 1}}
      responses:
        "200":
          description: Phiên bản danh mục
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MrvCatalogVersion"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/mrv/evidence-types:
    get:
      summary: Loại minh chứng đang dùng được (có danh mục ĐÃ DUYỆT) kèm phiên bản đã duyệt mới nhất
      description: |
        Cùng vai với GET /v1/mrv/catalog (mrv_collector, mrv_reviewer, mrv_viewer, mrv_exporter, param_setter,
        param_approver). App dùng để biết loại nào có biểu mẫu; nội dung danh mục tải qua GET /v1/mrv/catalog
        hoặc entity pull mrv_catalog. Sắp theo evidence_type.
      operationId: listMrvEvidenceTypes
      responses:
        "200":
          description: Danh sách loại minh chứng
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/MrvEvidenceType"}}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/mrv/evidence:
    post:
      summary: Ghi một minh chứng (hoặc bản ghi bù khi có supersedes_id) — kiểm theo phiên bản danh mục đã ghim
      description: |
        Vai mrv_collector, trong phạm vi xã (ADR-0009). Có household_ref → bắt buộc đồng ý mục đích
        mrv.evidence (mrv.consent_missing). Ảnh chỉ tham chiếu file_ref + sha256 ciphertext (ADR-0004).
        Toạ độ là dữ liệu cá nhân khi gắn với hộ — không ghi log.
      operationId: captureMrvEvidence
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MrvEvidenceInput"}
      responses:
        "201":
          description: Đã ghi
          headers:
            Location: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MrvEvidence"}
        "400": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
    get:
      summary: Bản hiện hành của các chuỗi minh chứng trong phạm vi (hàng chờ duyệt = review_status=pending)
      operationId: listMrvEvidence
      parameters:
        - {name: evidence_type, in: query, schema: {type: string}}
        - {name: admin_unit_code, in: query, schema: {type: string}}
        - {name: review_status, in: query, schema: {type: string, enum: [pending, accepted, rejected]}}
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        "200":
          description: Một trang
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/MrvEvidence"}}
                  next_cursor: {type: [string, "null"]}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/mrv/evidence/{id}:
    get:
      summary: Một phiên bản minh chứng kèm chuỗi sửa sai và các quyết định duyệt
      operationId: getMrvEvidence
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Minh chứng
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MrvEvidenceView"}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/mrv/evidence/{id}/reviews:
    post:
      summary: Quyết định duyệt của TTKN tỉnh cho bản hiện hành (KN US-MRV-05) — người duyệt ≠ người thu
      operationId: reviewMrvEvidence
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision, reason]
              properties:
                decision: {type: string, enum: [accepted, rejected], description: "accepted = Đạt chuẩn; rejected = Yêu cầu kiểm tra lại"}
                reason: {type: string, minLength: 5, maxLength: 1000}
      responses:
        "201":
          description: Đã ghi quyết định
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MrvReview"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/mrv/exports:
    post:
      summary: Yêu cầu xuất gói bằng chứng (mục 12) — 202 + job; worker dựng gói, lưu kèm băm ảnh chụp dữ liệu
      description: >-
        G3: khi bộ lọc không giới hạn evidence_type/review_status, ảnh chụp có thêm farm_logs (liên kết nhật ký HTX, phiên bản
        danh mục đã ghim), collection_evidence (bậc khối lượng qua van), comparisons (KN US-MRV-02) và estimates (rule_version +
        phiên bản tham số, official); gói có estimates_provisional = true khi còn ước tính tạm. Các phần này lọc theo phạm vi xã
        và season_code; dữ liệu G3 ghi sau as_of không làm đổi snapshot_sha256.
      operationId: requestMrvExport
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filters: {$ref: "#/components/schemas/MrvExportFilters"}
      responses:
        "202":
          description: Đã nhận; theo dõi tại Location
          headers:
            Location: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MrvExport"}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/mrv/exports/{id}:
    get:
      summary: Trạng thái job xuất
      operationId: getMrvExport
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Job
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MrvExport"}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/mrv/exports/{id}/package:
    get:
      summary: URL tải gói có hạn (≤ 15 phút; không ghi log)
      operationId: getMrvExportPackage
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: URL có chữ ký
          content:
            application/json:
              schema:
                type: object
                required: [export_id, url, expires_at, package_sha256, snapshot_sha256]
                properties:
                  export_id: {type: string, format: uuid}
                  url: {type: string}
                  expires_at: {type: string, format: date-time}
                  package_sha256: {type: string}
                  snapshot_sha256: {type: string}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
  /v1/mrv/exports/{id}/verify:
    get:
      summary: Dựng lại ảnh chụp dữ liệu tại as_of từ sổ và so với snapshot_sha256 đã lưu
      operationId: verifyMrvExport
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Kết quả so băm
          content:
            application/json:
              schema:
                type: object
                required: [export_id, as_of, snapshot_sha256, rebuilt_sha256, match]
                properties:
                  export_id: {type: string, format: uuid}
                  as_of: {type: string, format: date-time}
                  snapshot_sha256: {type: string}
                  rebuilt_sha256: {type: string}
                  match: {type: boolean}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
  # --- pf/mrv G3: liên kết bằng chứng, đối chiếu (KN US-MRV-02), đủ hồ sơ + bất thường (KN FR-08), ước tính CO2 TẠM ---
  /v1/mrv/completeness:
    get:
      summary: Tình trạng bằng chứng theo thửa/vụ trong phạm vi (mục danh mục có/đã duyệt/thiếu, cờ bất thường FR-08)
      description: >-
        Vai mrv_collector, mrv_reviewer, mrv_viewer, mrv_exporter; phạm vi xã (ADR-0009). Vụ lấy từ sổ tham chiếu vụ
        (consumer pf.mrv.farm_log_link). anomaly=true chỉ trả vụ đang mở không có bản ghi mới ≥ mrv.anomaly_no_record_days ngày.
      operationId: listMrvCompleteness
      parameters:
        - {name: admin_unit_code, in: query, schema: {type: string}}
        - {name: season_code, in: query, schema: {type: string}}
        - {name: plot_ref, in: query, schema: {type: string, format: uuid}}
        - {name: anomaly, in: query, schema: {type: boolean}}
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        "200":
          description: Trang kết quả
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/MrvCompleteness"}}
                  next_cursor: {type: [string, "null"]}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/mrv/seasons/{id}/completeness:
    get:
      summary: Tình trạng bằng chứng của một thửa/vụ
      operationId: getMrvSeasonCompleteness
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}, description: season_ref}
      responses:
        "200":
          description: Tình trạng
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MrvCompleteness"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/mrv/seasons/{id}/comparison:
    get:
      summary: Đối chiếu song song nhật ký HTX ↔ minh chứng cán bộ KN của thửa/vụ (KN US-MRV-02)
      description: >-
        Mỗi nhật ký HTX hiện hành kèm gợi ý tự động (match / mismatch / unverified) theo thửa, vụ và cửa sổ
        ± mrv.compare_window_days ngày, cùng kết quả cán bộ đã xác nhận (result, confirmed).
      operationId: getMrvSeasonComparison
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}, description: season_ref}
      responses:
        "200":
          description: Bảng đối chiếu
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MrvComparisonView"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/mrv/comparisons:
    post:
      summary: Cán bộ KN đánh dấu Khớp/Khác biệt, gắn với bản ghi MRV tương ứng (KN US-MRV-02)
      description: >-
        Vai mrv_collector, trong phạm vi. evidence_id là bản hiện hành của minh chứng cán bộ cùng thửa và vụ.
        mismatch bắt buộc note. Sửa kết quả = bản ghi bù (supersedes_id + correction_reason ≥ 10 ký tự).
      operationId: recordMrvComparison
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [season_ref, log_ref, evidence_id, result]
              properties:
                season_ref: {type: string, format: uuid}
                log_ref: {type: string, format: uuid}
                evidence_id: {type: string, format: uuid}
                result: {type: string, enum: [match, mismatch]}
                note: {type: [string, "null"], maxLength: 1000}
                file_refs:
                  type: array
                  items:
                    type: object
                    required: [file_ref, sha256]
                    properties:
                      file_ref: {type: string, format: uuid}
                      sha256: {type: string, pattern: "^[0-9a-f]{64}$"}
                supersedes_id: {type: [string, "null"], format: uuid}
                correction_reason: {type: [string, "null"], minLength: 10, maxLength: 1000}
      responses:
        "200":
          description: Gọi lặp cùng Idempotency-Key
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MrvComparison"}
        "201":
          description: Đã ghi
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MrvComparison"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/mrv/estimates:
    get:
      summary: Ước tính CO2 mới nhất theo thửa/vụ — TẠM, chờ khách ký phương pháp
      description: >-
        rule_version mrv.co2.estimate.v1: tấn tính = cận dưới bậc khối lượng của bằng chứng thu gom (van
        mrv_collection_evidence), chỉ khi thửa/vụ có minh chứng cán bộ "Đạt chuẩn" (KN US-MRV-05); tránh đốt = tấn ×
        mrv.co2.open_burning_kg_per_t. status = official chỉ khi có phương pháp ĐÃ DUYỆT ghim đúng phiên bản các tham số
        đã duyệt đã dùng; ngược lại provisional kèm nhãn "Tạm — chờ khách ký phương pháp". Không số nào là chính thức ở G3
        trước khi C-1 và phương pháp được ký.
      operationId: listMrvEstimates
      parameters:
        - {name: season_ref, in: query, schema: {type: string, format: uuid}}
        - {name: admin_unit_code, in: query, schema: {type: string}}
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        "200":
          description: Trang kết quả
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/MrvEstimate"}}
                  next_cursor: {type: [string, "null"]}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/mrv/alerts:
    get:
      summary: Cảnh báo MRV trong phạm vi — Cảnh báo khẩn, AWD thiếu hạ tầng, hồ sơ quá hạn (G3)
      description: >-
        KN US-MRV-04 (pest_urgent: nhãn Cảnh báo khẩn tự bật khi vượt ngưỡng), KN FR-08 (awd_no_infrastructure: nhật ký App
        HTX ghi AWD nhưng vùng chưa đủ hạ tầng), KN US-MRV-06 (review_overdue: level 1 đã báo người duyệt, level 2 đã leo
        thang lên quản trị TTKN tỉnh). Mỗi cảnh báo phát pf.mrv.alert.raised → pf/notify. Vai đọc minh chứng
        (mrv_collector, mrv_reviewer, mrv_viewer, mrv_exporter); lọc theo phạm vi xã của người gọi.
      operationId: listMrvAlerts
      parameters:
        - {name: kind, in: query, schema: {type: string, enum: [pest_urgent, awd_no_infrastructure, review_overdue]}}
        - {name: admin_unit_code, in: query, schema: {type: string}}
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        "200":
          description: Trang kết quả
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/MrvAlert"}}
                  next_cursor: {type: [string, "null"]}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/mrv/seasons/{id}/estimate/recompute:
    post:
      summary: Tính lại ước tính của một vụ (vai mrv_reviewer) — cùng đầu vào không ghi thêm dòng
      operationId: recomputeMrvEstimate
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}, description: season_ref}
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Ước tính hiện hành (null khi vụ chưa có bằng chứng thu gom)
          content:
            application/json:
              schema:
                type: object
                required: [estimate]
                properties:
                  estimate:
                    oneOf:
                      - {$ref: "#/components/schemas/MrvEstimate"}
                      - {type: "null"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
  # Chỉ tài liệu ĐÃ XUẤT BẢN trong phạm vi người gọi: toàn quốc + tỉnh + xã của mình (ADR-0009).

  /v1/documents:
    get:
      summary: Tra cứu tài liệu đã xuất bản (KN US-LIB-04, HTX US-NEWS-01) — tìm không dấu, lọc loại/nhãn/chuyên mục
      operationId: listDocuments
      tags: [content]
      parameters:
        - {name: kind, in: query, schema: {$ref: "#/components/schemas/ContentKind"}}
        - {name: tag, in: query, description: "Nhãn '<danh mục>:<mã>', vd farm_stage:sowing", schema: {type: string}}
        - {name: category, in: query, schema: {type: string}}
        - {name: q, in: query, description: "Từ khóa; không phân biệt dấu (\"lua\" khớp \"lúa\"), khớp tiền tố từng từ", schema: {type: string}}
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        "200":
          description: Một trang, mới xuất bản trước
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/ContentDocument"}}
                  next_cursor: {type: [string, "null"]}
        "401": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "503": {description: content.dependency_unavailable, $ref: "#/components/responses/Problem"}
  /v1/documents/{ref}:
    get:
      summary: Bản xuất bản hiện hành, tệp đính kèm (URL có hạn ≤ 15 phút) và hướng dẫn đặc thù địa phương trong phạm vi (KN FR-13)
      operationId: getDocument
      tags: [content]
      parameters:
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Tài liệu
          content:
            application/json:
              schema:
                type: object
                required: [document, version, supplements]
                properties:
                  document: {$ref: "#/components/schemas/ContentDocument"}
                  version: {$ref: "#/components/schemas/ContentVersion"}
                  supplements:
                    type: array
                    items:
                      type: object
                      properties:
                        ref: {type: string, format: uuid}
                        title: {type: string}
                        province_code: {type: [string, "null"]}
                        published_at: {type: [string, "null"], format: date-time}
        "404": {description: "content.document_not_found — không có, chưa xuất bản, đã gỡ hoặc ngoài phạm vi", $ref: "#/components/responses/Problem"}
  /v1/documents/{ref}/versions:
    get:
      summary: Các phiên bản đã từng xuất bản (hiện hành + bị thay) — xuất bản bản mới không xóa bản cũ
      operationId: listDocumentVersions
      tags: [content]
      parameters:
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Lịch sử
          content:
            application/json:
              schema:
                type: object
                required: [document_ref, items]
                properties:
                  document_ref: {type: string, format: uuid}
                  items: {type: array, items: {$ref: "#/components/schemas/ContentVersionInfo"}}
        "404": {$ref: "#/components/responses/Problem"}
  # --- hết pf/content ---

  /v1/plots:
    get:
      summary: Thửa trong khung nhìn (GIS FN-07 BR-24/25) — GeoJSON FeatureCollection, tối đa 1.000 polygon, lọc theo phạm vi xã/HTX
      operationId: listPlotsInBBox
      parameters:
        - {name: bbox, in: query, required: true, description: "minLon,minLat,maxLon,maxLat (WGS84)", schema: {type: string, examples: ["105.55,10.00,105.70,10.15"]}}
        - {name: zoom, in: query, description: "Mức zoom web-mercator; < 17 thì hình được đơn giản hóa (nửa điểm ảnh)", schema: {type: integer, minimum: 0, maximum: 22, default: 17}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 1000, default: 1000}}
      responses:
        "200":
          description: Thửa chưa ngừng dùng giao khung nhìn. truncated = true khi còn thửa vượt limit (hãy zoom sâu hơn).
          content:
            application/json:
              schema:
                type: object
                required: [type, features, truncated, limit]
                properties:
                  type: {type: string, enum: [FeatureCollection]}
                  features: {type: array, items: {$ref: "#/components/schemas/PlotFeature"}}
                  truncated: {type: boolean}
                  limit: {type: integer}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
    post:
      summary: Tạo thửa với ranh giới đầu tiên (KN US-PLOT-01, HTX US-PLOT-02/03). Chồng lấn HTX khác vượt ngưỡng → 409 geo.overlap_cross_coop (không bỏ qua được); cùng HTX/thửa nháp hoặc lệch diện tích khai báo > 5 % → 409 geo.overlap_needs_confirm / geo.area_deviation_needs_confirm, trừ khi confirm_overlap = true (khi đó mở xung đột xem xét)
      operationId: createPlot
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PlotCreateInput"}
      responses:
        "201":
          description: Đã tạo
          headers:
            Location: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PlotWriteResult"}
        "403": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
  /v1/plots/overlap-check:
    post:
      summary: Kiểm trước một ranh giới (KN US-PLOT-03 — cảnh báo ngay khi vẽ); chạy đủ kiểm tra như khi lưu nhưng không ghi
      operationId: checkPlotOverlap
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [geometry, commune_code]
              properties:
                geometry: {$ref: "#/components/schemas/PolygonGeometry"}
                commune_code: {type: string}
                cooperative_ref: {type: [string, "null"], format: uuid}
                exclude_plot_ref: {type: [string, "null"], format: uuid, description: "Thửa đang sửa (không tự so với chính nó)"}
                declared_area_ha: {$ref: "#/components/schemas/Decimal"}
      responses:
        "200":
          description: Kết quả kiểm
          content:
            application/json:
              schema:
                type: object
                required: [area_ha, point_count, tolerance_pct, blocking, needs_confirm, deviation_pct, deviation_needs_confirm, can_save, requires_confirm]
                properties:
                  area_ha: {$ref: "#/components/schemas/Decimal"}
                  point_count: {type: integer}
                  tolerance_pct: {$ref: "#/components/schemas/Decimal"}
                  blocking: {type: array, items: {$ref: "#/components/schemas/PlotOverlap"}, description: "HTX khác — bị chặn khi lưu (geo.overlap_cross_coop)"}
                  needs_confirm: {type: array, items: {$ref: "#/components/schemas/PlotOverlap"}, description: "Cùng HTX / thửa nháp — lưu được khi confirm_overlap = true"}
                  deviation_pct: {oneOf: [{$ref: "#/components/schemas/Decimal"}, {type: "null"}], description: "Lệch so với declared_area_ha (%)"}
                  deviation_needs_confirm: {type: boolean}
                  can_save: {type: boolean, description: "Không có chồng lấn HTX khác"}
                  requires_confirm: {type: boolean, description: "Lưu được nhưng phải gửi confirm_overlap = true"}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/plots/{ref}:
    get:
      summary: Thửa kèm toàn bộ phiên bản ranh giới (lịch sử chỉ đọc) và xung đột; ngoài phạm vi → 404
      operationId: getPlot
      parameters:
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Thửa
          content:
            application/json:
              schema:
                type: object
                required: [plot, versions, conflicts]
                properties:
                  plot: {$ref: "#/components/schemas/PlotFeature"}
                  versions: {type: array, items: {$ref: "#/components/schemas/PlotBoundaryVersion"}}
                  conflicts: {type: array, items: {$ref: "#/components/schemas/BoundaryConflict"}}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/plots/{ref}/boundaries:
    post:
      summary: Sửa ranh giới = phiên bản mới (bản ghi bù) trỏ supersedes_id về phiên bản hiện hành; phiên bản cũ giữ nguyên
      operationId: correctPlotBoundary
      parameters:
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PlotCorrectInput"}
      responses:
        "201":
          description: Đã ghi phiên bản mới
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PlotWriteResult"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {description: "geo.overlap_cross_coop, geo.overlap_needs_confirm, geo.area_deviation_needs_confirm, geo.version_conflict (supersedes_id không phải phiên bản hiện hành; kèm current_boundary_id), geo.plot_state_conflict", content: {application/problem+json: {schema: {$ref: "#/components/schemas/Problem"}}}}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/plots/{ref}/assign:
    post:
      summary: Gán thửa cho HTX / nông hộ (HTX US-PLOT-01 AC-3 — mỗi thửa đúng một HTX); cooperative_ref = null → về nháp. Quản lý HTX chỉ nhận thửa về HTX mình
      operationId: assignPlot
      parameters:
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                cooperative_ref: {type: [string, "null"], format: uuid}
                household_ref: {type: [string, "null"], format: uuid}
                reason: {type: string}
                confirm_overlap: {type: boolean, default: false, description: "Gán HTX mới làm đổi phân loại chồng lấn: HTX khác → 409 geo.overlap_cross_coop; cùng HTX/thửa nháp → cần xác nhận"}
      responses:
        "200":
          description: Đã gán
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PlotAttrResult"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/plots/{ref}/retire:
    post:
      summary: Ngừng dùng thửa (xóa mềm, GIS BR-17) — ẩn khỏi bản đồ, giữ toàn bộ lịch sử; lý do ≥ 10 ký tự
      operationId: retirePlot
      parameters:
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string, minLength: 10}
      responses:
        "200":
          description: Đã ngừng dùng
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PlotAttrResult"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/plots/{ref}/restore:
    post:
      summary: Khôi phục thửa đã ngừng dùng (GIS BR-17) — sự kiện mới 'restored' kèm lý do ≥ 10 ký tự; kiểm lại chồng lấn như khi gán
      operationId: restorePlot
      parameters:
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string, minLength: 10}
                confirm_overlap: {type: boolean, default: false, description: "Xác nhận giữ nguyên khi chồng lấn thửa cùng HTX/thửa nháp"}
      responses:
        "200":
          description: Đã khôi phục
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PlotAttrResult"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/cooperatives/{ref}/plots:
    get:
      summary: Thửa của một HTX (HTX US-PLOT-01), phân trang cursor
      operationId: listCooperativePlots
      parameters:
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 1000, default: 200}}
      responses:
        "200":
          description: Một trang
          content:
            application/json:
              schema:
                type: object
                required: [type, features, next_cursor]
                properties:
                  type: {type: string, enum: [FeatureCollection]}
                  features: {type: array, items: {$ref: "#/components/schemas/PlotFeature"}}
                  next_cursor: {type: [string, "null"]}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/geo/conflicts:
    get:
      summary: Xung đột ranh giới chờ xử lý trong phạm vi (mục 15 — người phụ trách + SLA tạm 72 giờ)
      operationId: listBoundaryConflicts
      parameters:
        - {name: status, in: query, schema: {type: string, enum: [open, resolved]}}
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        "200":
          description: Một trang
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/BoundaryConflict"}}
                  next_cursor: {type: [string, "null"]}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/geo/conflicts/{id}/resolve:
    post:
      summary: Đóng xung đột kèm ghi chú (≥ 10 ký tự); sửa hình nếu cần là một phiên bản ranh giới mới
      operationId: resolveBoundaryConflict
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note]
              properties:
                note: {type: string, minLength: 10}
      responses:
        "200":
          description: Đã đóng
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BoundaryConflict"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/geo/admin-boundaries/{code}:
    get:
      summary: Ranh giới hành chính dùng chung hiện hành của tỉnh/xã (GIS FN-07 BR-21), GeoJSON Feature
      operationId: getAdminBoundary
      parameters:
        - $ref: "#/components/parameters/UnitCode"
        - {name: zoom, in: query, schema: {type: integer, minimum: 0, maximum: 22, default: 12}}
      responses:
        "200":
          description: Ranh giới
          content:
            application/json:
              schema:
                type: object
                required: [type, id, geometry, properties]
                properties:
                  type: {type: string, enum: [Feature]}
                  id: {type: string}
                  geometry: {$ref: "#/components/schemas/PolygonGeometry"}
                  properties:
                    type: object
                    required: [code, level, name, source, area_ha, imported_at]
                    properties:
                      code: {type: string}
                      level: {type: string, enum: [province, commune]}
                      name: {type: string}
                      source: {type: string}
                      area_ha: {$ref: "#/components/schemas/Decimal"}
                      imported_at: {type: string, format: date-time}
        "404": {$ref: "#/components/responses/Problem"}
  # --- pf/geo G2: lớp nền GIS (ranh giới HTX, kho/Hub + sức chứa, đường bộ), log GPS ---

  # Lớp hạ tầng (kho/Hub, đường bộ) là dữ liệu dùng chung: lọc theo vai, không theo phạm vi.

  # Ranh giới HTX và log GPS lọc theo phạm vi TW → Tỉnh → Xã; quản lý HTX chỉ HTX mình.
  /v1/geo/layers:
    get:
      summary: Lớp bản đồ web GIS gộp theo khung nhìn (BRD FN-01, BR-24/25) — mỗi lớp tối đa 1.000 đối tượng; polygon thửa chỉ khi zoom ≥ geo.plot_layer_min_zoom (mặc định 13)
      operationId: geoLayers
      parameters:
        - {name: bbox, in: query, required: true, description: "minLon,minLat,maxLon,maxLat (WGS84)", schema: {type: string}}
        - {name: zoom, in: query, schema: {type: integer, minimum: 0, maximum: 22, default: 12}}
        - {name: layers, in: query, description: "Danh sách lớp, phân cách dấu phẩy", schema: {type: string, default: "cooperatives,plots,facilities,roads"}}
        - {name: min_load_tons, in: query, description: "Lọc lớp đường bộ theo tải trọng phương tiện (tấn)", schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 1000, default: 1000}}
      responses:
        "200":
          description: Các lớp đã yêu cầu (null = không yêu cầu hoặc zoom chưa đủ)
          content:
            application/json:
              schema:
                type: object
                required: [zoom, plot_min_zoom, plots_notice, cooperatives, plots, facilities, roads]
                properties:
                  zoom: {type: integer}
                  plot_min_zoom: {type: integer}
                  plots_notice: {type: [string, "null"], description: "Thông báo khi zoom chưa đủ để tải polygon thửa"}
                  cooperatives: {oneOf: [{$ref: "#/components/schemas/GeoCoopLayer"}, {type: "null"}]}
                  plots:
                    oneOf:
                      - type: object
                        required: [type, features, truncated]
                        properties:
                          type: {type: string, enum: [FeatureCollection]}
                          features: {type: array, items: {$ref: "#/components/schemas/PlotFeature"}}
                          truncated: {type: boolean}
                      - {type: "null"}
                  facilities: {oneOf: [{$ref: "#/components/schemas/GeoFacilityLayer"}, {type: "null"}]}
                  roads: {oneOf: [{$ref: "#/components/schemas/GeoRoadLayer"}, {type: "null"}]}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/geo/standard-map:
    get:
      summary: Bản đồ chuẩn hóa chỉ đọc cho ứng dụng tiêu thụ (TMS — mkg/logistics), GIS US-INT-02 / FN-17
      description: |
        MỘT lần gọi trả mọi lớp nền đã chuẩn hóa trong khung nhìn dạng GeoJSON FeatureCollection (properties.layer):
        admin_boundaries (ranh giới tỉnh/xã theo zoom), cooperatives (ranh giới/marker HTX), facilities (kho/Hub kèm
        widget sức chứa), roads (đường bộ, lọc tải trọng), waterways (tuyến đường thủy của phiên bản đang phát hành,
        cờ passable theo tải trọng) cùng danh sách bản đồ nền đã cấu hình (gis.basemap_url:<loại>; rỗng khi nhà cung
        cấp tile chưa chọn — RB-7). Không có thửa hay dữ liệu cá nhân. Tài khoản dịch vụ vai map_consumer đọc toàn
        tenant; người dùng bản đồ khác theo phạm vi. Mỗi lớp ≤ limit (≤ 1.000) đối tượng. Độ trễ mục tiêu p95 < 500 ms
        (đo ở docs/runbooks/gis-performance.md).
      operationId: geoStandardMap
      parameters:
        - {name: bbox, in: query, required: true, description: "minLon,minLat,maxLon,maxLat (WGS84)", schema: {type: string}}
        - {name: zoom, in: query, schema: {type: integer, minimum: 0, maximum: 22, default: 12}}
        - {name: layers, in: query, description: "admin_boundaries,cooperatives,facilities,roads,waterways (mặc định: tất cả)", schema: {type: string}}
        - {name: admin_level, in: query, description: "Mặc định theo zoom: < 10 tỉnh, ≥ 10 xã", schema: {type: string, enum: [province, commune]}}
        - {name: min_load_tons, in: query, description: "Tải trọng phương tiện (tấn) — lọc đường bộ, đánh dấu đường thủy đi được", schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 1000, default: 1000}}
      responses:
        "200":
          description: Bản đồ chuẩn hóa
          content:
            application/json:
              schema: {$ref: "#/components/schemas/GeoStandardMap"}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "503": {description: geo.dependency_unavailable, $ref: "#/components/responses/Problem"}
  /v1/geo/cooperative-boundaries:
    get:
      summary: Ranh giới HTX trong khung nhìn thuộc phạm vi (GIS FN-04 B2) — kèm marker (điểm pf_party.cooperative.location nếu có, không thì điểm trong vùng); HTX chưa có ranh giới hiện bằng điểm
      operationId: geoCoopBoundariesInBBox
      parameters:
        - {name: bbox, in: query, required: true, schema: {type: string}}
        - {name: zoom, in: query, schema: {type: integer, minimum: 0, maximum: 22, default: 12}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 1000, default: 1000}}
      responses:
        "200":
          description: FeatureCollection
          content:
            application/json:
              schema: {$ref: "#/components/schemas/GeoCoopLayer"}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
    post:
      summary: Vẽ ranh giới đầu tiên của HTX (GIS US-BND-02 AC-1) — diện tích trắc địa tính trong DB; HTX đã có ranh giới → 409 geo.cooperative_boundary_exists (dùng /versions)
      description: |
        Vai plot_editor (cán bộ KN trong phạm vi), coop_manager (chỉ HTX của mình; bỏ trống cooperative_ref = HTX mình),
        geo_admin, platform_admin. Tên, địa chỉ HTX thuộc sổ pf/party; thiếu HTX → 422 với detail
        "Vui lòng nhập đầy đủ Tên HTX và Địa chỉ." (US-BND-02 AC-2). Sự kiện pf.geo.cooperative_boundary.recorded.
      operationId: geoCreateCoopBoundary
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/GeoCoopShapeInput"
                - type: object
                  properties:
                    cooperative_ref: {type: [string, "null"], format: uuid}
                    commune_code: {type: string, description: "Chỉ dùng khi chưa nối pf/party (có party thì lấy đơn vị của HTX)"}
      responses:
        "201": {$ref: "#/components/responses/GeoCoopWritten"}
        "403": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
  /v1/geo/cooperative-boundaries/{ref}:
    get:
      summary: Ranh giới HTX hiện hành kèm mọi phiên bản (lịch sử chỉ đọc, gồm ngừng dùng/khôi phục và người thao tác); ngoài phạm vi → 404
      operationId: geoGetCoopBoundary
      parameters:
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Ranh giới
          content:
            application/json:
              schema:
                type: object
                required: [cooperative, versions]
                properties:
                  cooperative: {$ref: "#/components/schemas/GeoCoopFeature"}
                  versions: {type: array, items: {$ref: "#/components/schemas/GeoCoopBoundaryVersion"}}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/geo/cooperative-boundaries/{ref}/versions:
    post:
      summary: Sửa ranh giới HTX (GIS US-BND-03 AC-1) — phiên bản mới trỏ supersedes_id (= boundary_id hiện hành) kèm lý do ≥ 10 ký tự; sai phiên bản → 409 geo.version_conflict
      operationId: geoCorrectCoopBoundary
      parameters:
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/GeoCoopShapeInput"
                - type: object
                  required: [supersedes_id, correction_reason]
                  properties:
                    supersedes_id: {type: string, format: uuid}
                    correction_reason: {type: string, minLength: 10}
      responses:
        "201": {$ref: "#/components/responses/GeoCoopWritten"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/geo/cooperative-boundaries/{ref}/retire:
    post:
      summary: Xóa mềm ranh giới HTX (GIS US-BND-03 AC-2, BR-14) — ẩn khỏi bản đồ dùng chung; dòng sổ mới giữ hình, lý do, người xóa
      operationId: geoRetireCoopBoundary
      parameters:
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/GeoReasonInput"}
      responses:
        "200": {$ref: "#/components/responses/GeoCoopWritten"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/geo/cooperative-boundaries/{ref}/restore:
    post:
      summary: Khôi phục ranh giới HTX đã ngừng dùng (BR-14)
      operationId: geoRestoreCoopBoundary
      parameters:
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/GeoReasonInput"}
      responses:
        "200": {$ref: "#/components/responses/GeoCoopWritten"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/geo/facilities:
    get:
      summary: Kho/Hub/nhà máy trong khung nhìn — của tenant (origin tenant) và hub MKG nhận qua van (origin mkg), kèm sức chứa hiệu lực (BR-52) và lớp màu (GIS FN-04 B2, US-WH-01 AC-1)
      operationId: geoFacilitiesInBBox
      parameters:
        - {name: bbox, in: query, required: true, schema: {type: string}}
        - {name: kind, in: query, schema: {type: string, enum: [kho, hub, nha_may]}}
        - {name: include_retired, in: query, schema: {type: boolean, default: false}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 1000, default: 1000}}
      responses:
        "200":
          description: FeatureCollection
          content:
            application/json:
              schema: {$ref: "#/components/schemas/GeoFacilityLayer"}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/geo/facilities/{ref}:
    get:
      summary: Kho/Hub của tenant kèm Event Log (BR-14/19), sức chứa hiệu lực và lịch sử ảnh chụp sức chứa
      operationId: geoGetFacility
      parameters:
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Cơ sở
          content:
            application/json:
              schema:
                type: object
                required: [facility, events, capacity, capacity_history]
                properties:
                  facility: {$ref: "#/components/schemas/GeoFacilityFeature"}
                  events: {type: array, items: {$ref: "#/components/schemas/GeoFacilityEvent"}}
                  capacity: {$ref: "#/components/schemas/GeoCapacityView"}
                  capacity_history: {type: array, items: {$ref: "#/components/schemas/GeoCapacitySnapshot"}}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/geo/hubs/{ref}/capacity:
    get:
      summary: Sức chứa hiệu lực và lịch sử của hub MKG (nhận qua van hub_capacity; số Admin nhập tay không bị ghi đè — BR-52)
      operationId: geoHubCapacity
      parameters:
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Sức chứa
          content:
            application/json:
              schema:
                type: object
                required: [hub_ref, capacity, capacity_history]
                properties:
                  hub_ref: {type: string, format: uuid}
                  capacity: {$ref: "#/components/schemas/GeoCapacityView"}
                  capacity_history: {type: array, items: {$ref: "#/components/schemas/GeoCapacitySnapshot"}}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/geo/capacity-widgets:
    get:
      summary: Widget dung lượng trên marker Hub/kho (GIS US-HUB-01, FN-15, BR-50) — % lấp đầy và lớp màu theo ngưỡng geo.hub_capacity_warn_pct / geo.hub_capacity_full_pct (mặc định 60/85)
      operationId: geoCapacityWidgets
      parameters:
        - {name: bbox, in: query, required: true, schema: {type: string}}
        - {name: kind, in: query, schema: {type: string, enum: [kho, hub, nha_may]}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 1000, default: 1000}}
      responses:
        "200":
          description: Marker kèm %
          content:
            application/json:
              schema:
                type: object
                required: [items, truncated, thresholds]
                properties:
                  truncated: {type: boolean}
                  thresholds: {$ref: "#/components/schemas/GeoCapacityThresholds"}
                  items:
                    type: array
                    items:
                      type: object
                      required: [origin, ref, kind, code, name, lon, lat, capacity, used, free, unit, fill_pct, class, source, sync_differs]
                      properties:
                        origin: {type: string, enum: [tenant, mkg]}
                        ref: {type: string, format: uuid}
                        kind: {type: string, enum: [kho, hub, nha_may]}
                        code: {type: string}
                        name: {type: string}
                        lon: {type: string}
                        lat: {type: string}
                        capacity: {type: [string, "null"]}
                        used: {type: [string, "null"]}
                        free: {type: [string, "null"]}
                        unit: {type: [string, "null"]}
                        fill_pct: {type: [string, "null"]}
                        class: {type: string, enum: [available, near_full, full, unknown]}
                        source: {type: [string, "null"], enum: [manual, import, valve, null]}
                        sync_differs: {type: boolean}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/geo/roads:
    get:
      summary: Tuyến đường bộ trong khung nhìn (GIS US-ROAD-01, BR-29/30) — chỉ tuyến có tải trọng cho phép ≥ min_load_tons; chiều dài trắc địa; không tuyến phù hợp → none_matched + notice (AC-2)
      operationId: geoRoadsInBBox
      parameters:
        - {name: bbox, in: query, required: true, schema: {type: string}}
        - {name: min_load_tons, in: query, schema: {type: string}, description: "Tải trọng phương tiện (tấn), > 0"}
        - {name: road_class, in: query, schema: {type: string, enum: [quoc_lo, tinh_lo, huyen_lo, truc_xa, bo_ruong]}}
        - {name: zoom, in: query, schema: {type: integer, minimum: 0, maximum: 22, default: 17}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 1000, default: 1000}}
      responses:
        "200":
          description: FeatureCollection
          content:
            application/json:
              schema: {$ref: "#/components/schemas/GeoRoadLayer"}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/geo/roads/{ref}:
    get:
      summary: Tuyến đường bộ kèm mọi phiên bản
      operationId: geoGetRoad
      parameters:
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Tuyến
          content:
            application/json:
              schema:
                type: object
                required: [road, versions]
                properties:
                  road: {$ref: "#/components/schemas/GeoRoadFeature"}
                  versions: {type: array, items: {$ref: "#/components/schemas/GeoRoadSegment"}}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/geo/gps-fixes:
    get:
      summary: Log toạ độ GPS (HTX US-GPS-03) — chỉ đọc, mới nhất trước, theo phạm vi xã (quản lý HTX chỉ log gắn HTX mình; log không xác định được xã chỉ toàn quốc thấy)
      description: >-
        Ghi log chỉ qua port geo.GpsLog: consumer outbox pf.cropcycle.gps_log (mở vụ, nhật ký, khai sản lượng) và
        pf.extension.gps_log (yêu cầu hỗ trợ) ghi SAU khi nghiệp vụ commit, idempotent theo bản ghi. Log giữ ≥ 12 tháng,
        không bao giờ xóa. Vai farmer (nông dân) chỉ thấy log do chính mình ghi và log gắn với thửa của nông hộ liên kết
        với tài khoản; chưa nối liên kết tài khoản → 503 geo.dependency_unavailable.
      operationId: geoListGpsFixes
      parameters:
        - {name: actor_ref, in: query, schema: {type: string, format: uuid}}
        - {name: target_ref, in: query, schema: {type: string, format: uuid}}
        - {name: plot_ref, in: query, schema: {type: string, format: uuid}}
        - {name: purpose, in: query, schema: {type: string, enum: [season_open, farm_log, harvest, support, plot]}}
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        "200":
          description: Một trang
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/GeoGpsFix"}}
                  next_cursor: {type: [string, "null"]}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
  /v1/geo/gps-fixes/{id}:
    put:
      summary: Luôn từ chối — log GPS chỉ đọc (HTX US-GPS-03 AC-1)
      operationId: geoUpdateGpsFix
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "405": {$ref: "#/components/responses/Problem"}
    patch:
      summary: Luôn từ chối — log GPS chỉ đọc (HTX US-GPS-03 AC-1)
      operationId: geoPatchGpsFix
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "405": {$ref: "#/components/responses/Problem"}
    delete:
      summary: Luôn từ chối — "Dữ liệu log chỉ đọc, không thể chỉnh sửa hoặc xóa." (HTX US-GPS-03 AC-1)
      operationId: geoDeleteGpsFix
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "405": {$ref: "#/components/responses/Problem"}
  # --- hết pf/geo G2 ---

  # Nghiệp vụ khuyến nông (ADR-0011): nhiệm vụ hỗ trợ + SLA, chỉ đạo khẩn, báo cáo hiện trường,

  # dashboard 4 KPI, danh bạ trực. Vai: kn_officer, kn_province_admin, kn_national_admin,

  # coop_manager (tạo yêu cầu cho HTX mình, xem danh bạ). Phạm vi TW → Tỉnh → Xã (ADR-0009):

  # ngoài phạm vi đọc → 404, ghi → 403 extension.out_of_scope.
  /v1/extension/tasks:
    post:
      summary: Tạo nhiệm vụ hỗ trợ — due_at = lúc tạo + SLA (tham số extension.task_sla_hours tại thời điểm tạo, mặc định 24 giờ)
      operationId: extCreateTask
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ExtTaskInput"}
      responses:
        "201":
          description: Đã tạo
          headers:
            Location: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ExtTask"}
        "403": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
    get:
      summary: Nhiệm vụ trong phạm vi (US-TASK-03) — lọc trạng thái, ưu tiên, cán bộ, quá hạn
      operationId: extListTasks
      parameters:
        - {name: status, in: query, schema: {type: string, enum: [new, assigned, accepted, in_progress, resolved]}}
        - {name: priority, in: query, schema: {type: string, enum: [low, normal, high, urgent]}}
        - {name: assignee_ref, in: query, schema: {type: string, format: uuid}}
        - {name: mine, in: query, schema: {type: boolean}, description: "Chỉ nhiệm vụ giao cho mình"}
        - {name: overdue, in: query, schema: {type: boolean}}
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        "200":
          description: Một trang
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/ExtTask"}}
                  next_cursor: {type: [string, "null"]}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/extension/support-requests:
    get:
      summary: Yêu cầu hỗ trợ của nông dân cho cán bộ (HTX US-SUPPORT-01, KN US-TASK-01/03) — kèm nhiệm vụ tự sinh hiện hành
      description: |
        Vai coop_manager (chỉ HTX của mình = org_ref; hỏi HTX khác → 403 extension.out_of_scope), kn_officer /
        kn_province_admin / kn_national_admin (xã/tỉnh trong phạm vi, cộng nhiệm vụ được giao cho mình), platform_admin (mọi nơi).
        Mới nhất trước; cursor là next_cursor của trang trước. Không trả toạ độ — chỉ trạng thái GPS; ảnh là mã tệp (pf/files).
      operationId: extListSupportRequests
      tags: [extension]
      parameters:
        - {name: task_status, in: query, schema: {type: string, enum: [new, assigned, accepted, in_progress, resolved]}, description: "Trạng thái nhiệm vụ tự sinh"}
        - {name: category, in: query, schema: {type: string, enum: [dich_hai, benh_lua, thoi_tiet, ky_thuat, may_moc, khac]}}
        - {name: urgency, in: query, schema: {type: string, enum: [binh_thuong, khan]}}
        - {name: commune_code, in: query, schema: {type: string}}
        - {name: cooperative_ref, in: query, schema: {type: string, format: uuid}}
        - {name: gps_missing, in: query, schema: {type: boolean}, description: "true = chỉ yêu cầu thiếu vị trí GPS"}
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        "200":
          description: Một trang, mới nhất trước
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/SupportRequestStaff"}}
                  next_cursor: {type: [string, "null"]}
        "403": {description: "forbidden | extension.out_of_scope", $ref: "#/components/responses/Problem"}
        "422": {description: "validation_failed", $ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
  /v1/extension/tasks/bulk-assign:
    post:
      summary: Phân công hàng loạt trong một lần xác nhận (US-TASK-04) — chia vòng tròn; một nhiệm vụ lỗi thì cả lô không đổi
      operationId: extBulkAssign
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [task_ids, assignee_refs]
              properties:
                task_ids: {type: array, minItems: 1, maxItems: 200, items: {type: string, format: uuid}}
                assignee_refs: {type: array, minItems: 1, maxItems: 50, items: {type: string, format: uuid}}
      responses:
        "200":
          description: Đã phân công
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/ExtTask"}}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/extension/tasks/{id}:
    get:
      operationId: extGetTask
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Nhiệm vụ kèm lịch sử sự việc (sổ chỉ ghi thêm)
          content:
            application/json:
              schema:
                type: object
                required: [task, events]
                properties:
                  task: {$ref: "#/components/schemas/ExtTask"}
                  events: {type: array, items: {$ref: "#/components/schemas/ExtTaskEvent"}}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/extension/tasks/{id}/assign:
    post:
      summary: Phân công (hoặc phân công lại) cho cán bộ phụ trách xã/tỉnh của nhiệm vụ
      operationId: extAssignTask
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assignee_ref]
              properties:
                assignee_ref: {type: string, format: uuid}
                note: {type: string, maxLength: 2000}
      responses:
        "200": {$ref: "#/components/responses/ExtTaskWritten"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/extension/tasks/{id}/status:
    post:
      summary: Ghi sự việc — tiếp nhận, tiến độ, hoàn thành (bắt buộc kết quả ≥ 10 ký tự), chuyển tiếp lên tỉnh, mở lại
      operationId: extUpdateTaskStatus
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: {type: string, enum: [accepted, progress, resolved, escalated, reopened]}
                note: {type: string, maxLength: 2000, description: "Không ghi SĐT/CCCD (R-04)"}
                event_time: {type: string, format: date-time}
      responses:
        "200": {$ref: "#/components/responses/ExtTaskWritten"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/extension/directives:
    post:
      summary: Ban hành chỉ đạo khẩn tới đúng vùng đã chọn (US-TASK-03) — phát pf.extension.directive.issued
      operationId: extIssueDirective
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, body, audience_units]
              properties:
                title: {type: string, minLength: 5, maxLength: 200}
                body: {type: string, minLength: 10, maxLength: 5000}
                severity: {type: string, enum: [urgent, normal], default: urgent}
                audience_units: {type: array, minItems: 1, maxItems: 500, items: {type: string}, description: "Mã tỉnh/xã nhận, trong phạm vi người ban hành"}
                expires_at: {type: string, format: date-time}
      responses:
        "201":
          description: Đã ban hành
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ExtDirective"}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
    get:
      summary: Chỉ đạo mình nhận; cấp giám sát thấy thêm chỉ đạo có vùng nhận trong phạm vi (mới nhất trước)
      operationId: extListDirectives
      parameters:
        - {name: mine, in: query, schema: {type: boolean}}
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        "200":
          description: Một trang
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/ExtDirective"}}
                  next_cursor: {type: [string, "null"]}
