    KhtcPlanVersion:
      type: object
      required: [id, year, version, basis, decision_no, decision_date, effective_from, copied_from_year, note, entries_count, recorded_at, actor]
      properties:
        id: {type: string, format: uuid}
        year: {type: integer}
        version: {type: integer}
        basis: {type: string, enum: [initial, adjust]}
        decision_no: {type: [string, "null"]}
        decision_date: {type: [string, "null"], format: date}
        effective_from: {type: string, format: date}
        copied_from_year: {type: [integer, "null"]}
        note: {type: [string, "null"]}
        entries_count: {type: integer}
        recorded_at: {type: string, format: date-time}
        actor: {$ref: "#/components/schemas/KhtcActor"}
    KhtcPlan:
      type: object
      required: [year, version, latest_version, entries]
      properties:
        year: {type: integer}
        version: {$ref: "#/components/schemas/KhtcPlanVersion"}
        latest_version: {type: integer}
        entries: {type: array, items: {$ref: "#/components/schemas/KhtcPlanEntry"}}
    KhtcPlanSave:
      type: object
      required: [base_version, entries]
      properties:
        base_version: {type: integer, minimum: 0, description: "Phiên bản mới nhất đang sửa (0 = chưa có) — khóa lạc quan"}
        decision_no: {type: string}
        decision_date: {type: string, format: date}
        effective_from: {type: string, format: date, description: "Vắng ở phiên bản 1 = 01/01"}
        copied_from_year: {type: integer}
        note: {type: string}
        entries: {type: array, items: {$ref: "#/components/schemas/KhtcPlanEntryInput"}}
    KhtcPlanDraft:
      type: object
      required: [from_year, from_version, entries, problems]
      properties:
        from_year: {type: [integer, "null"]}
        from_version: {type: [integer, "null"]}
        entries: {type: array, items: {$ref: "#/components/schemas/KhtcPlanEntry"}}
        problems:
          type: array
          items:
            type: object
            required: [row, field, reason]
            properties:
              row: {type: [integer, "null"]}
              field: {type: string}
              reason: {type: string}
