        base_area_ha: {oneOf: [{$ref: "#/components/schemas/Decimal"}, {type: "null"}], description: "Diện tích cùng vụ năm trước"}
        growth_pct: {oneOf: [{$ref: "#/components/schemas/Decimal"}, {type: "null"}], description: "Tăng trưởng đã áp (%) sau chặn ±20 %"}
        forecast_area_ha: {oneOf: [{$ref: "#/components/schemas/Decimal"}, {type: "null"}]}
        norm_key: {type: string}
        norm: {oneOf: [{type: object}, {type: "null"}]}
        required: {oneOf: [{$ref: "#/components/schemas/Decimal"}, {type: "null"}]}
        required_whole: {type: [integer, "null"]}
        capacity_now: {type: integer, description: "Máy Hoạt động lúc chạy dự báo"}
        gap: {type: [integer, "null"]}
        status: {type: string, enum: [ok, no_data, no_norm]}
        inputs:
          type: object
          required: [history, rates, raw_growth, capped, norm_at]
          properties:
            history: {type: object, additionalProperties: {type: string}}
            rates: {type: object, additionalProperties: {type: string}}
            raw_growth: {type: [string, "null"]}
            capped: {type: boolean}
            norm_at: {type: string, format: date}
        seq: {type: integer}
    UnifiedFigures:
      type: object
      description: "G-02: số liệu gộp của một đơn vị (pf/extension + pf/party + pf/geo + tham số mục tiêu)"
      required: [sown_area_ha, target_area_ha, cooperatives, households, cooperatives_reporting, digitized_plots, digitized_area_ha, open_tasks, overdue_tasks, expected_communes, reported_communes, missing_communes, provisional, provisional_label]
      properties:
        sown_area_ha: {$ref: "#/components/schemas/Decimal"}
        target_area_ha: {oneOf: [{$ref: "#/components/schemas/Decimal"}, {type: "null"}], description: "Tham số extension.target_sown_area_ha:<đơn vị>"}
        cooperatives: {type: integer}
        households: {type: integer}
        cooperatives_reporting: {type: integer}
        digitized_plots: {type: integer}
        digitized_area_ha: {$ref: "#/components/schemas/Decimal"}
        open_tasks: {type: integer}
        overdue_tasks: {type: integer}
        expected_communes: {type: integer}
        reported_communes: {type: integer}
        missing_communes: {type: array, items: {type: string}}
        provisional: {type: boolean}
        provisional_label: {type: [string, "null"]}
    LibraryItem:
      type: object
      description: "US-LIB-05: tài liệu trong danh mục cá nhân"
      required: [document_ref, saved_at, note, available, kind, title, summary, published_at]
      properties:
        document_ref: {type: string, format: uuid}
        saved_at: {type: string, format: date-time}
        note: {type: [string, "null"]}
        available: {type: boolean, description: "false = tài liệu đã gỡ/ra khỏi phạm vi — máy giữ bản đã tải, nhãn \"đã gỡ\""}
        kind: {type: [string, "null"]}
        title: {type: [string, "null"]}
        summary: {type: [string, "null"]}
        published_at: {type: [string, "null"], format: date-time}
    # --- hết pf/mechanization ---

    # --- pf/reports: mẫu báo cáo dạng lưới KN v7.7 (form-template.v1; lược đồ đầy đủ contracts/schemas/form-template.v1.json) ---
    FormDefinition:
      type: object
      description: |
        Định nghĩa lưới của một phiên bản mẫu, đúng bố cục sheet Excel (FN-AD-04.06, FN-XA-03.02). Cột theo chữ cái
        Excel liên tục từ A; tiêu đề nhiều tầng có vùng gộp (dòng tính từ 1 trong khung tiêu đề); công thức chạy trên
        một dòng, tham chiếu "F#" = cột F cùng dòng. Hiển thị: xám = fixed, trắng viền = input, viền xanh đậm = cột theo kỳ
        đang mở, xám nhạt = kỳ khác, xanh lá nhạt = formula; cố định cột tới freeze_through; nhóm cột cho "Đi tới".
        Phần chưa biết từ tệp gốc: cột placeholder = true và mục pending (chờ khách Q-01).
      required: [schema, code, title, sheet_name, requirements, columns, header, period_blocks, rows, totals, groups, freeze_through, rules, pending, completeness]
      properties:
        schema: {type: string, const: form-template.v1}
        code: {type: string, pattern: "^[A-Z0-9][A-Z0-9_.-]{1,31}$"}
        title: {type: string, maxLength: 300, description: "Có thể chứa {season} — thay theo vụ khi dựng layout"}
        sheet_name: {type: string, maxLength: 100}
        requirements: {type: string, maxLength: 4000, description: "“Yêu cầu biểu mẫu” nguyên văn"}
        columns: {type: array, minItems: 1, maxItems: 2000, items: {$ref: "#/components/schemas/FormColumn"}}
        header:
          type: object
          required: [rows, cells, merges]
          properties:
            rows: {type: integer, minimum: 1, maximum: 20}
            cells: {type: array, items: {$ref: "#/components/schemas/FormHeaderCell"}}
            merges: {type: array, items: {type: string, pattern: "^[A-Z]{1,3}[1-9][0-9]*:[A-Z]{1,3}[1-9][0-9]*$"}, examples: [["F1:L1", "A1:A2"]]}
        period_blocks: {type: array, items: {$ref: "#/components/schemas/FormPeriodBlock"}}
        rows:
          type: object
          required: [kind, indicators]
          properties:
            kind: {type: string, enum: [per_commune]}
            indicators:
              type: array
              description: "Rỗng: mỗi xã một dòng. Có: mỗi xã × mỗi chỉ tiêu một dòng (vd T05: 20 đối tượng sâu bệnh)"
              items:
                type: object
                required: [code, label]
                properties:
                  code: {type: string, maxLength: 64}
                  label: {type: string}
                  catalog: {type: string}
                  placeholder: {type: boolean}
        totals:
          type: array
          items:
            type: object
            required: [kind, label, label_letter]
            properties:
              kind: {type: string, enum: [region, province]}
              label: {type: string, description: "“Cộng {region}”, “Toàn tỉnh”"}
              label_letter: {type: string}
        groups:
          type: array
          items:
            type: object
            required: [id, title, from, to]
            properties:
              id: {type: string}
              title: {type: string}
              from: {type: string}
              to: {type: string}
        freeze_through: {type: string, description: "Cố định tới cột này (vd J); rỗng = không"}
        rules: {type: array, maxItems: 200, items: {$ref: "#/components/schemas/FormRule"}}
        pending:
          type: array
          items:
            type: object
            required: [part, detail, question]
            properties:
              part: {type: string}
              detail: {type: string}
              question: {type: string, examples: [Q-01]}
        completeness: {type: string, enum: [complete, partial, placeholder]}
        source:
          type: object
          properties:
            kind: {type: string, enum: [seed, import, designer]}
            file: {type: string}
            sheet: {type: string}
            sha256: {type: string}
            data_row: {type: integer}
            seed_note: {type: string}
    FormColumn:
      type: object
      required: [letter, title, kind, dtype]
      properties:
        letter: {type: string, pattern: "^[A-Z]{1,3}$"}
        key: {type: string}
        title: {type: string, maxLength: 500}
        kind: {type: string, enum: [fixed, provincial, input, per_period, formula], description: "Cố định / Tỉnh giao / Nhập / Cột theo kỳ / Công thức"}
        dtype: {type: string, enum: [number, integer, text, date, catalog]}
        unit: {type: string, examples: [ha, tấn, tấn/ha, "%"]}
        required: {type: boolean}
        catalog: {type: string}
        formula: {type: string, description: "Tập con Excel: + - * / ^ & % so sánh, SUM MIN MAX AVERAGE COUNT ROUND ROUNDUP ROUNDDOWN ABS IF IFERROR AND OR NOT ISBLANK ISNUMBER; tham chiếu F#, dải F#:L#", examples: ["SUM(F#:L#)", "IF(G#=0,0,I#/G#)"]}
        fixed_source: {type: string, description: "row_no | region_name | commune_name | indicator_label | none | xref:<mẫu>:<cột>"}
        period_block: {type: string}
        period_slot: {type: integer, minimum: 1}
        total: {type: string, enum: [sum, formula, none], description: "Dòng tổng: rỗng = sum cho cột số, formula cho cột công thức"}
        min: {type: string, description: "decimal"}
        max: {type: string, description: "decimal"}
        decimals: {type: integer, minimum: 0, maximum: 10}
        group: {type: string}
        placeholder: {type: boolean, description: "Chưa biết từ tệp gốc — chờ khách Q-01"}
        note: {type: string}
        inactive: {type: boolean, description: "Chỉ ở layout: khe kỳ vượt số kỳ của đợt"}
    FormHeaderCell:
      type: object
      required: [row, letter, text]
      properties:
        row: {type: integer, minimum: 1}
        letter: {type: string}
        text: {type: string}
        period_block: {type: string}
        period_slot: {type: integer}
    FormPeriodBlock:
      type: object
      required: [id, first_letter, width, slots, title_pattern]
      properties:
        id: {type: string}
        first_letter: {type: string}
        width: {type: integer, minimum: 1, description: "Số cột mỗi kỳ (PL 07: 4)"}
        slots: {type: integer, minimum: 1, description: "Số kỳ tối đa"}
        title_pattern: {type: string, examples: ["Tuần {n}"]}
    FormRule:
      type: object
      required: [id, expr, message, severity, letters]
      properties:
        id: {type: string}
        expr: {type: string, description: "Biểu thức logic trên dòng; được dùng XREF(\"T01\",\"M\") (liên biểu cùng xã cùng kỳ)", examples: ["J#=XREF(\"T01\",\"M\")"]}
        when: {type: string}
        message: {type: string}
        severity: {type: string, enum: [error, warning]}
        letters: {type: array, items: {type: string}}
    FormTemplate:
      type: object
      required: [id, code, name, department_code, entry_level, status, retired_reason, created_by, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        code: {type: string}
        name: {type: string}
        department_code: {type: string, examples: [trong_trot]}
        entry_level: {type: string, enum: [commune, province]}
        status: {type: string, enum: [active, retired]}
        retired_reason: {type: [string, "null"]}
        created_by: {type: string, format: uuid}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    FormVersion:
      type: object
      required: [id, template_id, version, status, effective_from, effective_label, origin, origin_version_id, import_id, definition_sha256, completeness, pending_count, column_count, created_by, created_at, updated_by, updated_at, proposed_by, proposed_at, published_by, published_at, retired_by, retired_at, retire_reason]
      properties:
        id: {type: string, format: uuid, description: "P4 ghim id này vào công việc khi phát hành biểu"}
        template_id: {type: string, format: uuid}
        version: {type: integer, minimum: 1}
        status: {type: string, enum: [draft, proposed, published, retired]}
        effective_from: {type: [string, "null"], format: date, description: "Áp dụng từ kỳ (ngày bắt đầu kỳ)"}
        effective_label: {type: [string, "null"], examples: ["Tuần 37/2026"]}
        origin: {type: string, enum: [blank, clone, restore, import, seed]}
        origin_version_id: {type: [string, "null"], format: uuid}
        import_id: {type: [string, "null"], format: uuid}
        definition_sha256: {type: string}
        completeness: {type: string, enum: [complete, partial, placeholder]}
        pending_count: {type: integer}
        column_count: {type: integer}
        created_by: {type: string, format: uuid}
        created_at: {type: string, format: date-time}
        updated_by: {type: string, format: uuid}
        updated_at: {type: string, format: date-time}
        proposed_by: {type: [string, "null"], format: uuid}
        proposed_at: {type: [string, "null"], format: date-time}
        published_by: {type: [string, "null"], format: uuid, description: "≠ proposed_by và ≠ updated_by (R-56)"}
        published_at: {type: [string, "null"], format: date-time}
        retired_by: {type: [string, "null"], format: uuid}
        retired_at: {type: [string, "null"], format: date-time}
        retire_reason: {type: [string, "null"]}
        definition: {$ref: "#/components/schemas/FormDefinition"}
    FormAssignment:
      type: object
      required: [id, template_id, department_code, entry_level, report_type, status, assigned_by, assigned_at, revoked_by, revoked_at, revoke_reason]
      properties:
        id: {type: string, format: uuid}
        template_id: {type: string, format: uuid}
        department_code: {type: string}
        entry_level: {type: string, enum: [commune, province]}
        report_type: {$ref: "#/components/schemas/FormReportType"}
        status: {type: string, enum: [active, revoked]}
        assigned_by: {type: string, format: uuid}
        assigned_at: {type: string, format: date-time}
        revoked_by: {type: [string, "null"], format: uuid}
        revoked_at: {type: [string, "null"], format: date-time}
        revoke_reason: {type: [string, "null"]}
    FormReportType:
      type: string
      enum: [weekly, monthly, seasonal, annual, adhoc, dispatch]
      description: "Báo cáo tuần / tháng / hàng vụ / năm (Q-07) / đột xuất / gửi Chi cục (Q-08) — tạm, chờ danh mục report_type của P2"
    FormEvalInput:
      type: object
      required: [mode, rows]
      properties:
        mode: {type: string, enum: [draft, submit], description: "draft bỏ kiểm bắt buộc"}
        open_slots: {type: [array, "null"], items: {type: integer}, description: "Khe kỳ đang mở; null = không kiểm (xem trước)"}
        rows:
          type: array
          maxItems: 5000
          items:
            type: object
            required: [commune, input]
            properties:
              key: {type: string, description: "Mặc định <mã xã> hoặc <mã xã>/<mã chỉ tiêu>"}
              commune: {type: string}
              region: {type: string}
              indicator: {type: string}
              input: {type: object, additionalProperties: {type: string}, description: "Ô người nhập: chữ cái → giá trị (số dạng chuỗi decimal, ngày YYYY-MM-DD)"}
              system: {type: object, additionalProperties: {type: string}, description: "Ô hệ thống: cố định + Tỉnh giao"}
              xrefs: {type: object, additionalProperties: {type: object, additionalProperties: {type: string}}, description: "Mã mẫu → cột → giá trị (cùng xã cùng kỳ)"}
    FormEvalResult:
      type: object
      required: [valid, rows, issues, totals]
      properties:
        valid: {type: boolean, description: "Không có vấn đề mức error — được gửi"}
        rows:
          type: array
          items:
            type: object
            required: [key, commune, cells]
            properties:
              key: {type: string}
              commune: {type: string}
              region: {type: string}
              indicator: {type: string}
              cells: {type: object, additionalProperties: {type: string}}
        issues:
          type: array
          items:
            type: object
            required: [row_key, code, message, severity]
            properties:
              row_key: {type: string}
              letter: {type: string}
              code: {type: string, enum: [reports.row_invalid, reports.cell_unknown_column, reports.cell_not_editable, reports.cell_period_closed, reports.cell_invalid_type, reports.cell_out_of_range, reports.cell_required, reports.formula_error, reports.rule_failed, reports.rule_error, reports.form_invalid]}
              message: {type: string}
              severity: {type: string, enum: [error, warning]}
              rule_id: {type: string}
        totals:
          type: array
          items:
            type: object
            required: [key, kind, members, cells]
            properties:
              key: {type: string, examples: ["region:KV1", province, "province/SB01"]}
              kind: {type: string, enum: [region, province]}
              region: {type: string}
              indicator: {type: string}
              members: {type: integer}
              cells: {type: object, additionalProperties: {type: string}}
    # --- pf/reports ---
    ReportColumn:
      type: object
      required: [key, title]
      properties:
        key: {type: string, description: "Khóa cột của nguồn dữ liệu"}
        title: {type: string}
    ReportDefinition:
      type: object
      required: [title, source, grouping, columns, formats]
      properties:
        title: {type: string, minLength: 5, maxLength: 200}
        source:
          type: string
          enum: [extension.sowing, extension.growth_pest, extension.program_progress, extension.tasks_sla, extension.period_summary, mechanization.summary, mechanization.shortage_by_coop, mechanization.season_compare, cropcycle.production]
        grouping: {type: string, enum: [national, province, commune, cooperative]}
        columns: {type: array, minItems: 1, maxItems: 40, items: {$ref: "#/components/schemas/ReportColumn"}}
        formats: {type: array, items: {type: string, enum: [xlsx, pdf]}}
        provisional_layout: {type: boolean, description: "Bố cục tạm — BRD chưa có mẫu biểu chính thức của Bộ NN&MT/NN&PTNT"}
        form_note: {type: string, maxLength: 500}
    ReportTemplate:
      type: object
      required: [key, version, builtin, status, definition]
      properties:
        key: {type: string}
        version: {type: integer, minimum: 0}
        builtin: {type: boolean}
        status: {type: string, enum: [active, retired]}
        definition: {$ref: "#/components/schemas/ReportDefinition"}
        reason: {type: [string, "null"]}
        created_by: {type: [string, "null"], format: uuid}
        created_at: {type: [string, "null"], format: date-time}
    ReportParams:
      type: object
      properties:
        level: {type: string, enum: [national, province, commune, cooperative], description: "Mặc định: cấp của mẫu"}
        unit_code: {type: string, description: "Tỉnh/xã trong phạm vi; rỗng = toàn phạm vi"}
        period: {type: string, description: "KN: YYYY-MM | YYYY-Qn | YYYY (FR-05); mặc định tháng hiện tại"}
        season_code: {type: string, description: "FR-03, CGH; với đối chiếu là Vụ A"}
        season_year: {type: integer}
        season_code_b: {type: string, description: "CGH tab đối chiếu: Vụ B (khác Vụ A)"}
        season_year_b: {type: integer}
        run_id: {type: string, format: uuid, description: "CGH: lần cân đối đã lưu; rỗng = mới nhất của vụ"}
        machine_type: {type: string}
        cooperative_ref: {type: string, format: uuid, description: "HTX US-DASH-02 (cropcycle.production): lọc HTX. Quản lý HTX luôn là HTX của mình (HTX khác → 403 reports.out_of_scope)"}
        variety_code: {type: string, description: "HTX US-DASH-02 (cropcycle.production): lọc giống lúa"}
    ReportExport:
      type: object
      required: [id, template_key, template_version, title, format, params, status, trigger, requested_by, requested_at]
      properties:
        id: {type: string, format: uuid}
        template_key: {type: string}
        template_version: {type: integer}
        title: {type: string}
        format: {type: string, enum: [xlsx, pdf]}
        params: {$ref: "#/components/schemas/ReportParams"}
        status: {type: string, enum: [queued, completed, failed]}
        trigger: {type: string, enum: [api, schedule]}
        schedule_id: {type: [string, "null"], format: uuid}
        requested_by: {type: string, format: uuid}
        requested_at: {type: string, format: date-time}
        row_count: {type: [integer, "null"]}
        provisional: {type: [boolean, "null"], description: "Số liệu tạm tính"}
        size_bytes: {type: [integer, "null"]}
        sha256: {type: [string, "null"]}
        error_code: {type: [string, "null"]}
        completed_at: {type: [string, "null"], format: date-time}
    ReportScheduleInput:
      type: object
      required: [template_key, format, frequency, hour, recipients]
      properties:
        template_key: {type: string}
        format: {type: string, enum: [xlsx, pdf]}
        unit_code: {type: string}
        params: {$ref: "#/components/schemas/ReportParams"}
        frequency: {type: string, enum: [weekly, monthly]}
        weekday: {type: integer, minimum: 1, maximum: 7, description: "weekly: 1 = thứ Hai"}
        day_of_month: {type: integer, minimum: 1, maximum: 28, description: "monthly"}
        hour: {type: integer, minimum: 0, maximum: 23, description: "Giờ Việt Nam"}
        recipients: {type: array, minItems: 1, maxItems: 50, items: {type: string, format: uuid}}
    ReportSchedule:
      type: object
      required: [id, template_key, format, params, frequency, hour, recipients, owner_ref, active, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        template_key: {type: string}
        format: {type: string, enum: [xlsx, pdf]}
        unit_code: {type: [string, "null"]}
        params: {type: object}
        frequency: {type: string, enum: [weekly, monthly]}
        weekday: {type: [integer, "null"]}
        day_of_month: {type: [integer, "null"]}
        hour: {type: integer}
        recipients: {type: array, items: {type: string, format: uuid}}
        owner_ref: {type: string, format: uuid}
        active: {type: boolean}
        deactivated_reason: {type: [string, "null"]}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    ReportScheduleRun:
      type: object
      required: [slot_key, slot_at, status, fired_at]
      properties:
        slot_key: {type: string, examples: [2026-W40, 2026-10]}
        slot_at: {type: string, format: date-time}
        status: {type: string, enum: [queued, skipped]}
        skip_reason: {type: [string, "null"]}
        job_id: {type: [string, "null"], format: uuid}
        fired_at: {type: string, format: date-time}
        delivery_status: {type: [string, "null"], enum: [sent, skipped, failed, null]}
        delivery_note: {type: [string, "null"]}
        sent_count: {type: [integer, "null"]}
        delivered_at: {type: [string, "null"], format: date-time}
    # --- hết pf/reports ---

    # --- pf/waterway ---
    WaterwayLine:
      type: object
      required: [type, coordinates]
      properties:
        type: {type: string, enum: [LineString]}
        coordinates: {type: array, items: {type: array, minItems: 2, maxItems: 2, items: {type: number}}}
    WaterwayLayerSegment:
      type: object
      required: [segment_ref, revision, name, waterway_class, data_source, length_m, width_m, depth_m, declared_max_load_tons, max_load_tons, certain, limiting, limiting_structure_ref, passable, geometry]
      properties:
        segment_ref: {type: string, format: uuid}
        revision: {type: integer}
        name: {type: string}
