    # --- hết pf/cropcycle ---
    # --- Bề mặt đối tác (ADR-0020) ---
    PartnerGrant:
      type: object
      required: [id, grantor_tenant_id, kinds, valid_from, valid_to]
      properties:
        id: {type: string, format: uuid}
        grantor_tenant_id: {type: string, format: uuid}
        kinds:
          type: array
          items: {type: string, enum: [cooperative_directory, plot_directory, season_harvest_dates, htx_collection_responses, waterway_routes, valve_hub, valve_collection, valve_mrv_evidence]}
        valid_from: {type: string, format: date-time}
        valid_to: {type: string, format: date-time}
    PartnerWaterwayPoint:
      type: object
      required: [lat, lng]
      properties:
        lat: {type: number, minimum: -90, maximum: 90}
        lng: {type: number, minimum: -180, maximum: 180}
    PartnerWaterwayRouteRequest:
      type: object
      required: [points]
      properties:
        points: {type: array, minItems: 2, maxItems: 25, items: {$ref: "#/components/schemas/PartnerWaterwayPoint"}}
        min_load_tons: {type: [string, "null"], pattern: "^[0-9]+(\\.[0-9]+)?$"}
        version: {type: [integer, "null"], minimum: 1, description: "Ghim phiên bản mạng; vắng = phiên bản đang phát hành"}
    PartnerWaterwayLeg:
      type: object
      required: [from, to, found, distance_km, access_km, source, geometry, segment_refs, limiting, reason]
      properties:
        from: {$ref: "#/components/schemas/PartnerWaterwayPoint"}
        to: {$ref: "#/components/schemas/PartnerWaterwayPoint"}
        found: {type: boolean}
        distance_km: {type: string, description: "km, 3 chữ số thập phân, gồm chặng tiếp cận"}
        access_km: {type: string}
        source: {type: string, enum: [routed, digitised, haversine]}
        geometry: {oneOf: [{$ref: "#/components/schemas/WaterwayLine"}, {type: "null"}]}
        segment_refs: {type: array, items: {type: string, format: uuid}}
        limiting: {oneOf: [{$ref: "#/components/schemas/WaterwayLimiting"}, {type: "null"}]}
        reason: {type: [string, "null"]}
    PartnerWaterwayRoute:
      type: object
      description: Kết quả định tuyến cho bên nhận (ADR-0020) — hạ tầng, không dữ liệu cá nhân. MKG lưu nguyên văn vào chặng (mục 16).
      required: [grantor_tenant_id, network_version, found, distance_km, source, limiting, legs]
      properties:
        grantor_tenant_id: {type: string, format: uuid}
        network_version: {type: [integer, "null"], description: "null = bên cấp chưa phát hành mạng (mọi chặng Haversine)"}
        found: {type: boolean, description: "mọi chặng đều có đường thủy"}
        distance_km: {type: string}
        source: {type: string, enum: [routed, digitised, haversine], description: "nguồn yếu nhất trong các chặng"}
        limiting: {oneOf: [{$ref: "#/components/schemas/WaterwayLimiting"}, {type: "null"}]}
        legs: {type: array, items: {$ref: "#/components/schemas/PartnerWaterwayLeg"}}
    PartnerCooperative:
      type: object
      description: HTX cho bên nhận — không người đại diện, không mã số thuế, không nông hộ
      required: [ref, code, name, commune_code, active, lon, lat, updated_at]
      properties:
        ref: {type: string, format: uuid}
        code: {type: string}
        name: {type: string}
        commune_code: {type: [string, "null"]}
        active: {type: boolean}
        lon: {type: [string, "null"], description: "Độ, 7 chữ số thập phân (vị trí hồ sơ HTX)"}
        lat: {type: [string, "null"]}
        updated_at: {type: string, format: date-time}
    PartnerPlot:
      type: object
      description: Thửa cho bên nhận — không nông hộ, không tên thửa, không người tạo
      required: [ref, code, commune_code, cooperative_ref, status, area_ha, geometry, revision, updated_at]
      properties:
        ref: {type: string, format: uuid}
        code: {type: string}
        commune_code: {type: string}
        cooperative_ref: {type: [string, "null"], format: uuid}
        status: {type: string, enum: [draft, active, retired]}
        area_ha: {type: string, description: "Decimal dạng chuỗi"}
        geometry: {type: object, description: "GeoJSON MultiPolygon (EPSG:4326)"}
        revision: {type: integer}
        updated_at: {type: string, format: date-time}
    PartnerSeasonDates:
      type: object
      required: [season_ref, plot_ref, cooperative_ref, commune_code, season_code, season_year, sowing_date, expected_harvest_date, harvest_open_date, status, completed_at, cursor]
      properties:
        season_ref: {type: string, format: uuid}
        plot_ref: {type: string, format: uuid}
        cooperative_ref: {type: string, format: uuid}
        commune_code: {type: string}
        season_code: {type: string}
        season_year: {type: integer}
        sowing_date: {type: string, format: date}
        expected_harvest_date: {type: string, format: date}
        harvest_open_date: {type: string, format: date}
        status: {type: string, enum: [open, completed, cancelled]}
        completed_at: {type: [string, "null"], format: date-time}
        cursor: {type: integer}
    HtxCollectionResponseFeedPage:
      type: object
      required: [items, next_cursor]
      properties:
        next_cursor: {type: integer}
        items:
          type: array
          items:
            type: object
            required: [response_id, cursor, statement_ref, statement_revision, htx_ref, plot_ref, mkg_rolls, outcome, htx_rolls, reason, responded_at, supersedes_response_id]
            properties:
              response_id: {type: string, format: uuid}
              cursor: {type: integer}
              statement_ref: {type: string, format: uuid}
              statement_revision: {type: integer}
              htx_ref: {type: string, format: uuid}
              plot_ref: {type: string, format: uuid}
              mkg_rolls: {type: integer}
              outcome: {type: string, enum: [confirmed, disputed]}
              htx_rolls: {type: integer}
              reason: {type: [string, "null"]}
              responded_at: {type: string, format: date-time}
              supersedes_response_id: {type: [string, "null"], format: uuid}
    # --- hết bề mặt đối tác ---
