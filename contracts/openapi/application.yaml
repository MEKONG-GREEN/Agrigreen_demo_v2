      summary: "Báo cáo tổng hợp các xã đúng bố cục mẫu (lần gần nhất hoặc run_id) — FN-TI-02.05, FN-TW-01.02"
      description: |
        Dòng xã + dòng Cộng khu vực/Toàn tỉnh (FormEngine.Totals; năng suất = sản lượng/diện tích). changed_cells = ô thay đổi so lần
        trước (tooltip cũ/người/thời điểm). pending = "Có n thay đổi mới từ m xã". compare=previous_year: dòng Toàn tỉnh cùng kỳ năm trước.
      operationId: rcGetConsolidation
      parameters:
        - {name: X-AG-Context, in: header, required: true, description: "Ngữ cảnh phiên KN (P1)", schema: {type: string, format: uuid}}
        - {name: period_id, in: query, schema: {type: string, format: uuid}}
        - {name: template_id, in: query, schema: {type: string, format: uuid}}
        - {name: form_code, in: query, schema: {type: string}}
        - {name: run_id, in: query, schema: {type: string, format: uuid}}
        - {name: region, in: query, schema: {type: string}}
        - {name: compare, in: query, schema: {type: string, enum: [previous_year]}}
      responses:
        "200":
          description: Kết quả
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RcConsolidationView"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
