    # --- pf/forms (W6.2) ---
    FormsProfile:
      type: object
      required: [name, hierarchy, roles, publish_by, close_by, review_by, allow_fixtures, require_reviewed_before_close]
      properties:
        name: {type: string}
        hierarchy: {type: array, items: {type: string}}
        roles: {type: object, additionalProperties: {type: string}}
        publish_by: {type: string}
        close_by: {type: string}
        review_by: {type: string}
        allow_fixtures: {type: boolean}
        require_reviewed_before_close: {type: boolean}
        unit_kinds: {type: array, items: {type: string, enum: [commune, facility, household, department]}, description: "Loại đơn vị lá (phần tử đầu = mặc định) — W11.05"}
        departments: {type: array, items: {type: string}, description: "Phòng ban KN được dùng profile (rỗng = mọi phòng ban)"}
        max_submissions: {type: integer, minimum: 0, maximum: 20, description: "Số lần gửi tối đa mặc định (0 = không giới hạn)"}
    FormsField:
      type: object
      required: [key, label, type, required]
      properties:
        key: {type: string, pattern: "^[a-z][a-z0-9_]{0,39}$"}
        label: {type: string}
        type: {type: string, enum: [text, integer, decimal, date, choice]}
        required: {type: boolean}
        options: {type: array, items: {type: string}}
        unit: {type: string}
        non_negative: {type: boolean, description: "W11.42: số không âm (integer/decimal)"}
        group: {type: string, description: "W11.42: nhóm hiển thị trên màn nhập (không kiểm)"}
    FormsTemplateInput:
      type: object
      required: [profile, code, title, fields]
      properties:
        profile: {type: string}
        code: {type: string, pattern: "^[A-Z0-9][A-Z0-9._-]{0,63}$"}
        title: {type: string, minLength: 1, maxLength: 300}
        fields: {type: array, minItems: 1, maxItems: 500, items: {$ref: "#/components/schemas/FormsField"}}
        fixture: {type: boolean, default: false}
    FormsTemplate:
      type: object
      required: [id, profile, code, version, title, fields, fixture, created_by, created_at]
      properties:
        id: {type: string, format: uuid}
        profile: {type: string}
        code: {type: string}
        version: {type: integer}
        title: {type: string}
        fields: {type: array, items: {$ref: "#/components/schemas/FormsField"}}
        fixture: {type: boolean}
        created_by: {type: string, format: uuid}
        created_at: {type: string, format: date-time}
    FormsPublishInput:
      type: object
      required: [profile, template_id, label, due_at, units]
      properties:
        profile: {type: string}
        template_id: {type: string, format: uuid}
        label: {type: string, minLength: 1, maxLength: 200}
        due_at: {type: string, format: date-time}
        units: {type: array, minItems: 1, maxItems: 5000, items: {type: string}}
        unit_kind: {type: string, enum: [commune, facility, household, department], description: "Rỗng = loại mặc định của profile (W11.05)"}
        unit_parents: {type: array, items: {type: string}, description: "Mã xã cha song song với units — bắt buộc với facility/household, cấm với loại khác"}
        max_submissions: {type: integer, minimum: 0, maximum: 20, description: "Vắng = mặc định của profile; 0 = không giới hạn"}
        period: {$ref: "#/components/schemas/FormsPeriodKey"}
    FormsPeriodKey:
      type: object
      description: Khóa kỳ theo lịch kỳ hệ thống (W11.03 — reportcycle/domain Span.Key, thẻ quy tắc chia kỳ) — lưu ở pf_forms.period_spec
      properties:
        kind: {type: string, enum: [day, week, ksgm_week, month, quarter, season, year, adhoc]}
        key: {type: string, pattern: "^[0-9A-Za-z-]{1,20}$", description: "Vd 2026-W41, 2026-10-K2, 2026-Q4"}
        from: {type: string, format: date}
        to: {type: string, format: date}
        rule: {type: string, maxLength: 200}
    FormsPeriodSpec:
      type: object
      required: [unit_kind, unit_parents, max_submissions, review_flow, period_kind, period_key, period_from, period_to, period_rule]
      properties:
        unit_kind: {type: string, enum: [commune, facility, household, department]}
        unit_parents: {type: array, items: {type: string}}
        max_submissions: {type: integer, description: "0 = không giới hạn"}
        review_flow: {type: string, enum: [single], description: "Chỉ một bước rà soát bốn mắt; nhiều bước (HCTH) chưa hỗ trợ"}
        period_kind: {type: [string, "null"]}
        period_key: {type: [string, "null"]}
        period_from: {type: [string, "null"], format: date}
        period_to: {type: [string, "null"], format: date}
        period_rule: {type: [string, "null"]}
    FormsCancelInput:
      type: object
      required: [reason]
      properties:
        reason: {type: string, minLength: 10, maxLength: 500}
    FormsHeld:
      type: object
      required: [id, version, values, submitter_ref, captured_at, event_time]
      description: Bài đến sau khi kỳ đã chốt với đơn vị (Chờ mở kỳ) — không vào số liệu kỳ
      properties:
        id: {type: string, format: uuid}
        version: {type: integer}
        values: {type: object, additionalProperties: {type: string}}
        submitter_ref: {type: string, format: uuid}
        captured_at: {type: string, format: date-time}
        event_time: {type: string, format: date-time}
    FormsPeriod:
      type: object
      required: [id, profile, template_id, template_code, template_version, label, due_at, units, owner_ref, publisher_level, published_by, published_at]
      properties:
        id: {type: string, format: uuid}
        profile: {type: string}
        template_id: {type: string, format: uuid}
        template_code: {type: string}
        template_version: {type: integer}
        label: {type: string}
        due_at: {type: string, format: date-time}
        units: {type: array, items: {type: string}}
        owner_ref: {type: [string, "null"], format: uuid}
        publisher_level: {type: string}
        published_by: {type: string, format: uuid}
        published_at: {type: string, format: date-time}
    FormsPeriodEvent:
      type: object
      required: [id, seq, action, mode, units, reason, actor_ref, event_time]
      properties:
        id: {type: string, format: uuid}
        seq: {type: integer}
        action: {type: string, enum: [published, closed, reopened, cancelled]}
        mode: {type: string, enum: [manual, auto]}
        units: {type: array, items: {type: string}}
        reason: {type: [string, "null"]}
        actor_ref: {type: string, format: uuid}
        event_time: {type: string, format: date-time}
    FormsReview:
      type: object
      required: [id, decision, reviewer_ref, note, event_time]
      properties:
        id: {type: string, format: uuid}
        decision: {type: string, enum: [accepted, returned]}
        reviewer_ref: {type: string, format: uuid}
        note: {type: [string, "null"]}
        event_time: {type: string, format: date-time}
    FormsSubmitInput:
      type: object
      required: [unit, values]
      properties:
        unit: {type: string}
        values: {type: object, additionalProperties: {type: string}, description: "Khóa trường → giá trị chuỗi (thập phân dạng chuỗi, R-10)"}
        captured_at: {type: string, format: date-time, description: "Bản offline: lúc ghi trên thiết bị — kỳ đã chốt với đơn vị thì bài được giữ (202, Chờ mở kỳ)"}
        base_version:
          type: integer
          minimum: 0
          description: "W11.42 khóa lạc quan: số phiên bản cuối người nhập đã thấy (0 = chưa có bài). Khác phiên bản hiện tại → 409 forms.submission_conflict (không ghi đè). Vắng = không kiểm"
        nil_report: {type: boolean, default: false, description: "W11.42 Báo không phát sinh (BM-01 cơ sở không hoạt động, BM-17 không phát sinh): mọi trường số = 0"}
        note: {type: string, maxLength: 1000, description: "H08 ghi chú chung"}
        explanation: {type: string, maxLength: 1000, description: "H09 giải trình / lý do trễ — bắt buộc khi gửi sau hạn với profile require_late_reason (kn_cnts)"}
    FormsSubmission:
      type: object
      required: [id, period_id, unit, version, values, submitter_ref, event_time, status, review]
      properties:
        id: {type: string, format: uuid}
        period_id: {type: string, format: uuid}
        unit: {type: string}
        version: {type: integer}
        values: {type: object, additionalProperties: {type: string}}
        submitter_ref: {type: string, format: uuid}
        event_time: {type: string, format: date-time}
        status: {type: string, enum: [submitted, accepted, returned, awaiting_reopen]}
        review:
          oneOf:
            - {type: "null"}
            - {$ref: "#/components/schemas/FormsReview"}
        nil_report: {type: boolean, description: "W11.42 Báo không phát sinh"}
        note: {type: [string, "null"]}
        explanation: {type: [string, "null"]}
        late: {type: boolean, description: "W11.42 nộp sau hạn (DB tính từ captured_at hoặc event_time)"}
        captured_at: {type: [string, "null"], format: date-time}
    FormsReviewInput:
      type: object
      required: [decision]
      properties:
        decision: {type: string, enum: [accepted, returned]}
        note: {type: string, maxLength: 1000, description: "Bắt buộc khi trả lại"}
    FormsReopenInput:
      type: object
      required: [reason]
      properties:
        reason: {type: string, minLength: 10, maxLength: 500}
        units: {type: array, items: {type: string}, description: "Rỗng = cả kỳ"}
    FormsSnapshot:
      type: object
      required: [id, period_ref, profile, snapshot_no, period_event_id, content_hash, hash_valid, rule_version, actor_ref, event_time]
      properties:
        id: {type: string, format: uuid}
        period_ref: {type: string, format: uuid}
        profile: {type: string}
        snapshot_no: {type: integer, minimum: 1}
        period_event_id: {type: string, format: uuid}
        content_hash: {type: string, description: "SHA-256 (hex) của nội dung, do DB tính"}
        hash_valid: {type: boolean, description: "Băm tính lại khớp content_hash"}
        rule_version: {type: string}
        actor_ref: {type: string, format: uuid}
        event_time: {type: string, format: date-time}
        content: {type: object, additionalProperties: true, description: "Nội dung đóng băng (chỉ ở GET /v1/forms/snapshots/{id})"}
    FormsUnit:
      type: object
      required: [unit, parent, status, submission, held]
      properties:
        unit: {type: string}
        parent: {type: string, description: "Đơn vị lọc phạm vi: mã xã cha (cơ sở/hộ), chính unit với loại khác"}
        status:
          type: string
          enum: [not_submitted, overdue, submitted, accepted, returned, missed, closed_unadjusted, awaiting_reopen]
          description: "Khi kỳ đã chốt với đơn vị: missed = Không nộp, closed_unadjusted = Đã chốt – chưa điều chỉnh, awaiting_reopen = Chờ mở kỳ (W11.05). overdue = Trễ hạn: chưa gửi, kỳ còn nhận bài, quá hạn (W11.42)"
        submission:
          oneOf:
            - {type: "null"}
            - {$ref: "#/components/schemas/FormsSubmission"}
        held:
          oneOf:
            - {type: "null"}
            - {$ref: "#/components/schemas/FormsHeld"}
    FormsPeriodView:
      type: object
      required: [period, spec, status, reopen_units, events, units, snapshots]
      properties:
        period: {$ref: "#/components/schemas/FormsPeriod"}
        spec: {$ref: "#/components/schemas/FormsPeriodSpec"}
        status: {type: string, enum: [open, closed, reopened, cancelled]}
        reopen_units: {type: array, items: {type: string}}
        events: {type: array, items: {$ref: "#/components/schemas/FormsPeriodEvent"}}
        units: {type: array, items: {$ref: "#/components/schemas/FormsUnit"}}
        snapshots: {type: array, items: {$ref: "#/components/schemas/FormsSnapshot"}}
