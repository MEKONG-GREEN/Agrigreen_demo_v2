  /v1/partner/waterway/route:
    get:
      summary: Định tuyến đường thủy trên mạng đã phát hành của tenant bên cấp (loại waterway_routes, proto FM-05, ADR-0020)
      description: |
        Cho mkg/logistics (G4): chuyến vận tải thủy của MKG định tuyến trên mạng pf/waterway CÓ PHIÊN BẢN của tenant chương
        trình. Kiểm cấp quyền `waterway_routes` rồi mới định tuyến ở tenant bên cấp (RLS, không BYPASSRLS); tham số (bán kính
        tiếp cận, hệ số Haversine #10) là của bên cấp. Ghi một dòng `partner_read_log` trước khi trả (lỗi → 503). Chỉ hạ tầng:
        hình học, km, nguồn tính, phiên bản mạng, đoạn, ràng buộc tải trọng — không dữ liệu cá nhân. MKG lưu bền vững kết quả
        đã dùng vào chặng (mục 16). Không có đường thủy → `found = false`, Haversine × hệ số kèm `reason`.
      operationId: routePartnerWaterway
      tags: [partner]
      parameters:
        - $ref: "#/components/parameters/PartnerGrantor"
        - {name: from, in: query, required: true, description: "lat,lng", schema: {type: string}}
        - {name: to, in: query, required: true, description: "lat,lng", schema: {type: string}}
        - {name: min_load_tons, in: query, schema: {type: string, pattern: "^[0-9]+(\\.[0-9]+)?$"}}
        - {name: version, in: query, description: "Ghim phiên bản mạng; vắng = phiên bản đang phát hành", schema: {type: integer, minimum: 1}}
      responses:
        "200":
          description: Kết quả định tuyến (một chặng)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PartnerWaterwayRoute"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
    post:
      summary: Định tuyến đường thủy qua dãy điểm (chuyến nhiều điểm dừng) ở tenant bên cấp (loại waterway_routes, ADR-0020)
      description: |
        Chỉ đọc, nhưng là POST (thân có dãy điểm) nên bắt buộc `Idempotency-Key` (R-51): gọi lặp cùng khóa trả lại đúng kết quả
        đầu. Một chặng cho mỗi cặp điểm liên tiếp, cùng một phiên bản mạng. 2–25 điểm.
      operationId: routePartnerWaterwayPoints
      tags: [partner]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/PartnerGrantor"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PartnerWaterwayRouteRequest"}
      responses:
        "200":
          description: Kết quả định tuyến (mỗi cặp điểm một chặng)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PartnerWaterwayRoute"}
        "400": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
  /v1/gis/replay:
    get:
      summary: Mọi lớp GIS như hệ biết lúc hết ngày X — GIS US-REPLAY-01
      description: |
        Phát lại = ảnh chụp mới nhất ≤ `date` + các thay đổi sau watermark của ảnh chụp và trước cutoff(`date`), áp theo
        (recorded_at, id); bằng đúng việc dựng thẳng từ nhật ký. Ngày hôm nay = trạng thái hiện tại. `geometry=true` → kèm
        hình học GeoJSON as-of tra qua pf/geo theo `geometry_ref`. Ngày tương lai → 422 `metrics.future_date`.
      operationId: replayGisLayers
      tags: [metrics]
      parameters:
        - {name: date, in: query, required: true, schema: {type: string, format: date}}
        - {name: layers, in: query, schema: {type: string}}
        - {name: geometry, in: query, schema: {type: boolean, default: false}}
      responses:
        "200":
          description: Trạng thái theo lớp
          content:
            application/json:
              schema:
                type: object
                required: [business_date, cutoff, items]
                properties:
                  business_date: {type: string, format: date}
                  cutoff: {type: string, format: date-time}
                  items: {type: array, items: {$ref: "#/components/schemas/GisLayerState"}}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
  /v1/extdata/sources:
    get:
      summary: "pf/extdata (ADR-0007): nguồn dữ liệu ngoài đã bật — thời tiết, độ mặn, tile. Không trả URL (có thể chứa khóa API)"
      operationId: extdataSources
      responses:
        "200":
          description: Danh mục nguồn (mặc định rỗng khi chưa cấu hình AG_EXTDATA_SOURCES)
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/ExtDataSource"}}
        "401": {$ref: "#/components/responses/Problem"}
  /v1/extdata/{source}/point:
    get:
      summary: "pf/extdata (ADR-0007): dữ liệu điểm qua proxy khử định danh — tọa độ làm thô về tâm ô lưới trước khi gọi nhà cung cấp; đệm theo ô"
      operationId: extdataPoint
      parameters:
        - {name: source, in: path, required: true, schema: {type: string, pattern: "^[a-z][a-z0-9_]{1,30}$"}}
        - {name: lat, in: query, required: true, description: "Vĩ độ thập phân (chuỗi)", schema: {type: string}}
        - {name: lon, in: query, required: true, description: "Kinh độ thập phân (chuỗi)", schema: {type: string}}
      responses:
        "200":
          description: "Dữ liệu của ô lưới (data là JSON nguyên văn của nhà cung cấp). Cache-Control: private, max-age = thời gian đệm còn lại"
          content:
            application/json:
              schema:
                type: object
                required: [source, kind, cell, fetched_at, cached, data]
                properties:
                  source: {type: string}
                  kind: {type: string, enum: [weather, salinity]}
                  cell:
                    type: object
                    required: [lat, lon, size_deg]
                    properties:
                      lat: {type: string, description: "Vĩ độ tâm ô"}
                      lon: {type: string, description: "Kinh độ tâm ô"}
                      size_deg: {type: string, description: "Cạnh ô (độ), ≥ 0.05"}
                  fetched_at: {type: string, format: date-time}
                  cached: {type: boolean}
                  data: {description: "JSON của nhà cung cấp"}
        "401": {$ref: "#/components/responses/Problem"}
        "404": {description: "extdata.unknown_source", $ref: "#/components/responses/Problem"}
        "422": {description: "validation_failed | extdata.outside_territory", $ref: "#/components/responses/Problem"}
        "502": {description: "extdata.provider_unavailable", $ref: "#/components/responses/Problem"}
  /v1/extdata/{source}/tiles/{z}/{x}/{y}:
    get:
      summary: "pf/extdata (ADR-0007): tile bản đồ/vệ tinh qua proxy — zoom ≤ max_zoom của nguồn, tile phải giao vùng phục vụ; y có thể kèm đuôi .png"
      operationId: extdataTile
      parameters:
        - {name: source, in: path, required: true, schema: {type: string}}
        - {name: z, in: path, required: true, schema: {type: integer, minimum: 0, maximum: 18}}
        - {name: x, in: path, required: true, schema: {type: integer, minimum: 0}}
        - {name: y, in: path, required: true, schema: {type: string, pattern: "^[0-9]+([.][a-z]+)?$"}}
      responses:
        "200":
          description: Tile nhị phân
          content:
            image/png: {schema: {type: string, format: binary}}
            image/jpeg: {schema: {type: string, format: binary}}
            image/webp: {schema: {type: string, format: binary}}
            application/x-protobuf: {schema: {type: string, format: binary}}
        "401": {$ref: "#/components/responses/Problem"}
        "404": {description: "extdata.unknown_source", $ref: "#/components/responses/Problem"}
        "422": {description: "validation_failed | extdata.zoom_too_high | extdata.outside_territory", $ref: "#/components/responses/Problem"}
        "502": {description: "extdata.provider_unavailable", $ref: "#/components/responses/Problem"}
  # ---- KN v7.7 P7 (FN-XA-03.03/03.04: HTX, nông hộ, máy móc HTX) ----
  # Mọi route cần X-AG-Context. Cấp Xã (kn_xa) ghi trong xã phụ trách; Cấp Tỉnh xem trong tỉnh; Cấp Quốc gia xem;
  # Admin mọi thứ (chế độ hỗ trợ: header X-AG-Reason ≥ 10 ký tự). Cấp Tỉnh/Quốc gia ghi → 403 party.read_only.
  /v1/kn/cooperatives:
    get:
      tags: [party]
      summary: "Danh sách HTX trên các xã phụ trách (FN-XA-03.03)"
      operationId: knListCooperatives
      parameters:
        - {name: X-AG-Context, in: header, required: true, description: "Ngữ cảnh phiên KN (P1)", schema: {type: string, format: uuid}}
        - {name: commune, in: query, schema: {type: string}, description: "Mã xã; vắng = mọi xã trong phạm vi; ngoài phạm vi → 403 party.out_of_scope"}
        - {name: status, in: query, schema: {type: string, enum: [active, inactive, all], default: active}}
        - {name: q, in: query, schema: {type: string}, description: "Tìm theo tên, Mã HTX, mã số thuế"}
        - {name: area_min, in: query, schema: {type: string}, description: "Diện tích tối thiểu (ha, decimal)"}
        - {name: area_max, in: query, schema: {type: string}, description: "Diện tích tối đa (ha, decimal)"}
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        "200":
          description: Một trang HTX
          content:
            application/json:
              schema: {$ref: "#/components/schemas/KNCooperativeList"}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "428": {$ref: "#/components/responses/Problem"}
    post:
      tags: [party]
      summary: "Thêm HTX trong xã phụ trách (Cấp Xã, Admin)"
      description: "Mã HTX tự sinh. Trùng tên (không phân biệt hoa thường) → 409 party.cooperative_name_taken. Người đại diện chỉ vào kho định danh."
      operationId: knCreateCooperative
      parameters:
        - {name: X-AG-Context, in: header, required: true, description: "Ngữ cảnh phiên KN (P1)", schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/KNCooperativeCreate"}
      responses:
        "201":
          description: HTX đã tạo
          content:
            application/json:
              schema: {$ref: "#/components/schemas/KNCooperative"}
        "403": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/kn/cooperatives/{ref}:
    get:
      tags: [party]
      summary: "Chi tiết HTX (ngoài phạm vi → 404)"
      operationId: knGetCooperative
      parameters:
        - {name: X-AG-Context, in: header, required: true, description: "Ngữ cảnh phiên KN (P1)", schema: {type: string, format: uuid}}
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: HTX
          content:
            application/json:
              schema: {$ref: "#/components/schemas/KNCooperative"}
        "404": {$ref: "#/components/responses/Problem"}
    put:
      tags: [party]
      summary: "Sửa hồ sơ HTX — sự kiện bù (Log cũ → mới, không PII)"
      description: >-
        Trường vắng = giữ nguyên; area_ha/tax_code/head_office rỗng hoặc null = xóa giá trị. Đổi người đại diện: chủ thể mới
        trong kho định danh, Log ghi representative_ref cũ → mới. Gửi lại cùng Idempotency-Key → kết quả hiện tại, không ghi thêm.
        HTX đã vô hiệu hóa → 409 party.org_state_conflict.
      operationId: knUpdateCooperative
      parameters:
        - {name: X-AG-Context, in: header, required: true, description: "Ngữ cảnh phiên KN (P1)", schema: {type: string, format: uuid}}
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/KNCooperativeUpdate"}
      responses:
        "200":
          description: HTX sau khi sửa
          content:
            application/json:
              schema: {$ref: "#/components/schemas/KNCooperative"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/kn/cooperatives/{ref}/deactivate:
    post:
      tags: [party]
      summary: "Vô hiệu hóa HTX (thay xóa cứng) kèm cảnh báo dữ liệu liên kết"
      description: "Lý do ≥ 20 ký tự (ràng buộc sổ org_event, US-HTXSTATUS-01 AC-3). Phát pf.party.org.deactivated."
      operationId: knDeactivateCooperative
      parameters:
        - {name: X-AG-Context, in: header, required: true, description: "Ngữ cảnh phiên KN (P1)", schema: {type: string, format: uuid}}
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/KNReason"}
      responses:
        "200":
          description: HTX đã vô hiệu hóa
          content:
            application/json:
              schema: {$ref: "#/components/schemas/KNCooperativeDeactivated"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/kn/cooperatives/{ref}/reactivate:
    post:
      tags: [party]
      summary: "Kích hoạt lại HTX (lý do ≥ 10 ký tự)"
      operationId: knReactivateCooperative
      parameters:
        - {name: X-AG-Context, in: header, required: true, description: "Ngữ cảnh phiên KN (P1)", schema: {type: string, format: uuid}}
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/KNReason"}
      responses:
        "200":
          description: HTX đã kích hoạt lại
          content:
            application/json:
              schema: {$ref: "#/components/schemas/KNCooperative"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/kn/cooperatives/{ref}/households:
    get:
      tags: [party]
      summary: "Nông hộ thành viên của HTX (tab Nông hộ)"
      operationId: knListHouseholds
      parameters:
        - {name: X-AG-Context, in: header, required: true, description: "Ngữ cảnh phiên KN (P1)", schema: {type: string, format: uuid}}
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        "200":
          description: Một trang nông hộ
          content:
            application/json:
              schema: {$ref: "#/components/schemas/KNHouseholdList"}
        "404": {$ref: "#/components/responses/Problem"}
    post:
      tags: [party]
      summary: "Thêm nông hộ vào HTX (chủ hộ vào kho định danh)"
      description: "SĐT đã có trong kho → 409 party.household_phone_taken; HTX đã vô hiệu hóa → 409 party.org_state_conflict."
      operationId: knCreateHousehold
      parameters:
        - {name: X-AG-Context, in: header, required: true, description: "Ngữ cảnh phiên KN (P1)", schema: {type: string, format: uuid}}
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/KNHouseholdCreate"}
      responses:
        "201":
          description: Nông hộ đã thêm
          content:
            application/json:
              schema: {$ref: "#/components/schemas/KNHousehold"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/kn/cooperatives/{ref}/log:
    get:
      tags: [party]
      summary: "Log HTX: tạo, vô hiệu hóa/kích hoạt lại, sửa hồ sơ (cũ → mới, không PII)"
      operationId: knCooperativeLog
      parameters:
        - {name: X-AG-Context, in: header, required: true, description: "Ngữ cảnh phiên KN (P1)", schema: {type: string, format: uuid}}
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: cursor, in: query, schema: {type: integer, minimum: 0}, description: "Vị trí trong Log đã gộp (next_cursor)"}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        "200":
          description: Log
          content:
            application/json:
              schema: {$ref: "#/components/schemas/KNLogPage"}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/kn/households/{ref}:
    put:
      tags: [party]
      summary: "Sửa diện tích canh tác của nông hộ — sự kiện bù"
      operationId: knUpdateHousehold
      parameters:
        - {name: X-AG-Context, in: header, required: true, description: "Ngữ cảnh phiên KN (P1)", schema: {type: string, format: uuid}}
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/KNHouseholdUpdate"}
      responses:
        "200":
          description: Nông hộ sau khi sửa
          content:
            application/json:
              schema: {$ref: "#/components/schemas/KNHousehold"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/kn/households/{ref}/log:
    get:
      tags: [party]
      summary: "Log nông hộ: tạo và các lần sửa diện tích"
      operationId: knHouseholdLog
      parameters:
        - {name: X-AG-Context, in: header, required: true, description: "Ngữ cảnh phiên KN (P1)", schema: {type: string, format: uuid}}
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: cursor, in: query, schema: {type: integer, minimum: 0}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        "200":
          description: Log
          content:
            application/json:
              schema: {$ref: "#/components/schemas/KNLogPage"}
        "404": {$ref: "#/components/responses/Problem"}

  # FN-XA-03.04 — Máy móc HTX (khai báo số lượng theo loại máy). Cấp Tỉnh/Quốc gia ghi → 403 mechanization.read_only.
  /v1/kn/machine-counts:
    get:
      tags: [mechanization]
      summary: "Khai báo máy của các HTX trong phạm vi + tổng xã theo loại máy (= Σ HTX)"
      operationId: knMachineCountsOverview
      parameters:
        - {name: X-AG-Context, in: header, required: true, description: "Ngữ cảnh phiên KN (P1)", schema: {type: string, format: uuid}}
        - {name: commune, in: query, schema: {type: string}, description: "Mã xã; ngoài phạm vi → 403 mechanization.out_of_scope"}
      responses:
        "200":
          description: Tổng quan
          content:
            application/json:
              schema: {$ref: "#/components/schemas/KNMachineOverview"}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/kn/machine-counts/{ref}:
    get:
      tags: [mechanization]
      summary: "Khai báo máy hiện hành của một HTX"
      operationId: knCoopMachineCounts
      parameters:
        - {name: X-AG-Context, in: header, required: true, description: "Ngữ cảnh phiên KN (P1)", schema: {type: string, format: uuid}}
        - {name: ref, in: path, required: true, description: "cooperative_ref của HTX", schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Khai báo
          content:
            application/json:
              schema: {$ref: "#/components/schemas/KNCoopMachines"}
        "404": {$ref: "#/components/responses/Problem"}
    put:
      tags: [mechanization]
      summary: "Thay toàn bộ khai báo máy của HTX (mỗi loại đổi = một sự kiện set/removed)"
      description: >-
        Loại máy thuộc danh mục masterdata machine_type đang dùng (mechanization.machine_type_unknown); số lượng phải là
        số JSON nguyên 0–1.000.000 (mechanization.machine_quantity_invalid); trùng loại trong request →
        mechanization.machine_type_duplicate (gợi ý cập nhật dòng đã có); HTX ngừng hoạt động → mechanization.cooperative_invalid.
        Gửi lại cùng Idempotency-Key → khai báo hiện tại, không ghi thêm. Admin: tham số department (mặc định trong_trot).
      operationId: knPutMachineCounts
      parameters:
        - {name: X-AG-Context, in: header, required: true, description: "Ngữ cảnh phiên KN (P1)", schema: {type: string, format: uuid}}
        - {name: ref, in: path, required: true, description: "cooperative_ref của HTX", schema: {type: string, format: uuid}}
        - {name: department, in: query, schema: {type: string}, description: "Chỉ Admin: phòng ban của bản ghi"}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/KNMachineCountsPut"}
      responses:
        "200":
          description: Khai báo sau khi lưu
          content:
            application/json:
              schema: {$ref: "#/components/schemas/KNCoopMachines"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/kn/machine-counts/{ref}/log:
    get:
      tags: [mechanization]
      summary: "Lịch sử thay đổi số lượng máy của HTX"
      operationId: knMachineCountLog
      parameters:
        - {name: X-AG-Context, in: header, required: true, description: "Ngữ cảnh phiên KN (P1)", schema: {type: string, format: uuid}}
        - {name: ref, in: path, required: true, description: "cooperative_ref của HTX", schema: {type: string, format: uuid}}
        - {name: cursor, in: query, schema: {type: integer, minimum: 0}, description: "seq của dòng cuối trang trước"}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        "200":
          description: Lịch sử
          content:
            application/json:
              schema: {$ref: "#/components/schemas/KNMachineLogPage"}
        "404": {$ref: "#/components/responses/Problem"}
  # ---- KN v7.7 P7 (FN-XA-03.05/03.06: thửa, vật tư) ----
  /v1/kn/plots:
    get:
      summary: "FN-XA-03.05: danh sách thửa trong phạm vi ngữ cảnh (không hình học)"
      operationId: knListPlots
      tags: [geo]
      parameters:
        - {name: X-AG-Context, in: header, required: true, schema: {type: string, format: uuid}}
        - {name: commune, in: query, schema: {type: string}, description: "Vắng = mọi xã trong phạm vi; ngoài phạm vi → 403 geo.out_of_scope"}
        - {name: cooperative_ref, in: query, schema: {type: string, format: uuid}}
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 500, default: 100}}
      responses:
        "200":
          description: Trang thửa
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/KNPlot"}}
                  next_cursor: {type: [string, "null"]}
        "403": {description: geo.out_of_scope, $ref: "#/components/responses/Problem"}
        "428": {description: accounts.context_required, $ref: "#/components/responses/Problem"}
    post:
      summary: "FN-XA-03.05: vẽ lô mới (Cấp Xã, Admin) — chặn mọi chồng lấn, diện tích tự tính"
      operationId: knCreatePlot
      tags: [geo]
      parameters:
        - {name: X-AG-Context, in: header, required: true, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/IdempotencyKey"
        - {name: department, in: query, schema: {type: string}, description: "Chỉ Admin: phòng ban ghi (mặc định trong_trot)"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/KNPlotCreate"}
      responses:
        "201":
          description: Thửa đã tạo (POST lặp cùng khóa → cùng kết quả)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/KNPlotWrite"}
        "403": {description: "geo.read_only | forbidden | geo.out_of_scope", $ref: "#/components/responses/Problem"}
        "409": {description: "geo.plot_overlap (kèm overlaps) | geo.plot_exists", $ref: "#/components/responses/Problem"}
        "422": {description: "validation_failed | geo.too_few_points | geo.invalid_geometry | geo.area_out_of_range | geo.outside_commune | geo.cooperative_invalid | geo.support_reason_required", $ref: "#/components/responses/Problem"}
        "503": {description: geo.dependency_unavailable, $ref: "#/components/responses/Problem"}
  /v1/kn/plots/export:
    get:
      summary: "FN-XA-03.05: tải thửa của một xã (GeoJSON | KML)"
      operationId: knExportPlots
      tags: [geo]
      parameters:
        - {name: X-AG-Context, in: header, required: true, schema: {type: string, format: uuid}}
        - {name: commune, in: query, required: true, schema: {type: string}}
        - {name: format, in: query, schema: {type: string, enum: [geojson, kml], default: geojson}}
      responses:
        "200":
          description: "Tệp tải về (Content-Disposition: attachment); properties: ref, code, lot_name, commune_code, cooperative_ref, farmer_label, note, area_ha, declared_area_ha, shape, status"
          content:
            application/geo+json:
              schema: {type: object}
            application/vnd.google-earth.kml+xml:
              schema: {type: string}
        "403": {description: geo.out_of_scope, $ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/kn/plots/{ref}:
    parameters:
      - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: X-AG-Context, in: header, required: true, schema: {type: string, format: uuid}}
    get:
      summary: "FN-XA-03.05: chi tiết thửa kèm hình (ngoài phạm vi/phòng ban → 404)"
      operationId: knGetPlot
      tags: [geo]
      responses:
        "200":
          description: Thửa
          content:
            application/json:
              schema: {$ref: "#/components/schemas/KNPlotDetail"}
        "404": {description: geo.plot_not_found, $ref: "#/components/responses/Problem"}
    put:
      summary: "FN-XA-03.05: sửa thuộc tính (sự kiện bù attributes_changed, Log). Trường vắng = giữ nguyên; null = xóa"
      operationId: knUpdatePlot
      tags: [geo]
      parameters:
        - {name: Idempotency-Key, in: header, required: false, schema: {type: string}, description: "Tùy chọn: PUT lặp cùng khóa → cùng kết quả"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                lot_name: {type: string, maxLength: 200}
                note: {type: [string, "null"], maxLength: 1000}
                farmer_name: {type: [string, "null"], maxLength: 200, description: "→ kho định danh; null/'' = bỏ"}
                cooperative_ref: {type: [string, "null"], format: uuid}
                declared_area_ha: {type: [string, "null"], description: "decimal > 0"}
                reason: {type: string, maxLength: 500}
      responses:
        "200":
          description: Thửa sau sửa (không đổi gì → hiện trạng, không ghi sổ)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/KNPlotDetail"}
        "403": {description: "geo.read_only | forbidden | geo.out_of_scope", $ref: "#/components/responses/Problem"}
        "404": {description: geo.plot_not_found, $ref: "#/components/responses/Problem"}
        "409": {description: geo.plot_state_conflict, $ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/kn/plots/{ref}/boundary:
    post:
      summary: "FN-XA-03.05: sửa ranh giới — phiên bản mới thay supersedes_boundary_id (chặn mọi chồng lấn)"
      operationId: knCorrectPlotBoundary
      tags: [geo]
      parameters:
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: X-AG-Context, in: header, required: true, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [supersedes_boundary_id, geometry, reason]
              properties:
                supersedes_boundary_id: {type: string, format: uuid}
                geometry: {$ref: "#/components/schemas/GeoJSONPolygonal"}
                shape: {type: string, enum: [polygon, circle, square]}
                reason: {type: string, minLength: 10}
      responses:
        "201":
          description: Phiên bản mới
          content:
            application/json:
              schema: {$ref: "#/components/schemas/KNPlotWrite"}
        "404": {description: geo.plot_not_found, $ref: "#/components/responses/Problem"}
        "409": {description: "geo.plot_overlap | geo.version_conflict | geo.plot_state_conflict", $ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/kn/plots/{ref}/log:
    get:
      summary: "FN-XA-03.05: lịch sử thửa (thuộc tính + phiên bản ranh giới), mới nhất trước"
      operationId: knPlotLog
      tags: [geo]
      parameters:
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: X-AG-Context, in: header, required: true, schema: {type: string, format: uuid}}
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        "200":
          description: "Log; event ∈ created|assigned|retired|restored|attributes_changed|boundary_recorded|boundary_corrected"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/KNRecordLogPage"}
        "404": {description: geo.plot_not_found, $ref: "#/components/responses/Problem"}

  /v1/kn/materials:
    get:
      summary: "FN-XA-03.06: bản ghi vật tư hiện hành (không bị bản bù thay)"
      operationId: knListMaterials
      tags: [extension]
      parameters:
        - {name: X-AG-Context, in: header, required: true, schema: {type: string, format: uuid}}
        - {name: commune, in: query, schema: {type: string}}
        - {name: from, in: query, schema: {type: string, format: date}}
        - {name: to, in: query, schema: {type: string, format: date}}
        - {name: material_code, in: query, schema: {type: string}}
        - {name: department, in: query, schema: {type: string}, description: "Chỉ Admin (vắng = mọi phòng ban)"}
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 500, default: 100}}
      responses:
        "200":
          description: Trang bản ghi
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/MaterialRecord"}}
                  next_cursor: {type: [string, "null"]}
        "403": {description: extension.out_of_scope, $ref: "#/components/responses/Problem"}
    post:
      summary: "FN-XA-03.06: ghi nhận vật tư của xã (Cấp Xã, Admin), 1–200 dòng"
      operationId: knRecordMaterials
      tags: [extension]
      parameters:
        - {name: X-AG-Context, in: header, required: true, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/IdempotencyKey"
        - {name: department, in: query, schema: {type: string}, description: "Chỉ Admin: phòng ban ghi (mặc định trong_trot)"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [commune_code, recorded_on, lines]
              properties:
                commune_code: {type: string}
                recorded_on: {type: string, format: date, description: "Không ở tương lai (giờ VN)"}
                lines:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items:
                    type: object
                    required: [material_code, quantity]
                    properties:
                      material_code: {type: string, description: "Danh mục masterdata material (đang dùng); ĐVT = attrs.unit"}
                      quantity: {type: string, description: "decimal ≥ 0, ≤ 1e9; ĐVT đếm được → số nguyên; còn lại ≤ 4 chữ số lẻ"}
                      note: {type: string, maxLength: 1000}
      responses:
        "201":
          description: Bản ghi đã tạo
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/MaterialRecord"}}
        "403": {description: "extension.read_only | forbidden | extension.out_of_scope", $ref: "#/components/responses/Problem"}
        "422": {description: "validation_failed | extension.material_unknown | extension.material_quantity_invalid | extension.support_reason_required", $ref: "#/components/responses/Problem"}
        "503": {description: extension.dependency_unavailable, $ref: "#/components/responses/Problem"}
  /v1/kn/materials/summary:
    get:
      summary: "FN-XA-03.06 AC: tổng hợp vật tư hiện hành theo xã × vật tư (Cấp Tỉnh: các xã trong tỉnh)"
      operationId: knMaterialSummary
      tags: [extension]
      parameters:
        - {name: X-AG-Context, in: header, required: true, schema: {type: string, format: uuid}}
        - {name: commune, in: query, schema: {type: string}}
        - {name: from, in: query, schema: {type: string, format: date}}
        - {name: to, in: query, schema: {type: string, format: date}}
      responses:
        "200":
          description: Tổng hợp
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [commune_code, material_code, material_name, unit, quantity, records]
                      properties:
                        commune_code: {type: string}
                        material_code: {type: string}
                        material_name: {type: string}
                        unit: {type: string}
                        quantity: {type: string}
                        records: {type: integer}
        "403": {description: extension.out_of_scope, $ref: "#/components/responses/Problem"}
  /v1/kn/materials/{id}/correct:
    post:
      summary: "FN-XA-03.06: sửa = bản ghi bù (bản cũ hết hiện hành)"
      operationId: knCorrectMaterial
      tags: [extension]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: X-AG-Context, in: header, required: true, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity, reason]
              properties:
                quantity: {type: string}
                note: {type: [string, "null"], maxLength: 1000}
                reason: {type: string, minLength: 10, maxLength: 500}
      responses:
        "201":
          description: Bản ghi bù
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MaterialRecord"}
        "403": {description: "extension.read_only | forbidden", $ref: "#/components/responses/Problem"}
        "404": {description: extension.material_record_not_found, $ref: "#/components/responses/Problem"}
        "409": {description: extension.material_superseded, $ref: "#/components/responses/Problem"}
        "422": {description: "validation_failed | extension.material_quantity_invalid", $ref: "#/components/responses/Problem"}
  /v1/kn/materials/{id}/log:
    get:
      summary: "FN-XA-03.06: lịch sử chuỗi sửa của bản ghi (recorded → corrected…), mới nhất trước"
      operationId: knMaterialLog
      tags: [extension]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: X-AG-Context, in: header, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Log
          content:
            application/json:
              schema: {$ref: "#/components/schemas/KNRecordLogPage"}
        "404": {description: extension.material_record_not_found, $ref: "#/components/responses/Problem"}
  # --- pf/extension CNTS: biểu kỳ Cấp Xã BM-01/04/05/17 (W11.42) — cài biểu vào cap/forms (profile kn_cnts), chia lịch kỳ
  # (kỳ ngày, tuần W11.03 v2, tuần làm việc BM-05) với hạn riêng, phát hành lô kỳ native. Nộp, chốt, sao chép kỳ trước: /v1/forms. ---
  /v1/extension/cnts/period-forms:
    get:
      summary: Biểu kỳ Cấp Xã CNTS và phiên bản đã cài ở cap/forms
      operationId: extensionCntsPeriodForms
      tags: [extension]
      responses:
        "200":
          description: Danh sách
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/CNTSPeriodForm"}}
        "403": {description: forbidden, $ref: "#/components/responses/Problem"}
        "503": {description: extension.dependency_unavailable, $ref: "#/components/responses/Problem"}
  /v1/extension/cnts/period-forms/install:
    post:
      summary: Cài (phiên bản mới) biểu chưa có hoặc khác định nghĩa chuẩn — Admin KN / reports_admin
      operationId: extensionCntsInstallPeriodForms
      tags: [extension]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Danh sách sau khi cài
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/CNTSPeriodForm"}}
        "403": {description: forbidden, $ref: "#/components/responses/Problem"}
        "503": {description: extension.dependency_unavailable, $ref: "#/components/responses/Problem"}
  /v1/extension/cnts/period-series/preview:
    post:
      summary: Xem trước lô kỳ của một biểu (kỳ, hạn nộp, số công việc) — chưa ghi
      operationId: extensionCntsPreviewSeries
      tags: [extension]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CNTSSeriesInput"}
      responses:
        "200":
          description: Lô kỳ
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CNTSSeries"}
        "422": {description: validation_failed, $ref: "#/components/responses/Problem"}
  /v1/extension/cnts/period-series:
    post:
      summary: Phát hành lô kỳ native cap/forms của một biểu (một giao dịch; Cấp Tỉnh phòng CNTS; cơ sở phải thuộc xã)
      operationId: extensionCntsPublishSeries
      tags: [extension]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CNTSSeriesInput"}
      responses:
        "201":
          description: Lô kỳ đã phát hành (periods[].id)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CNTSSeries"}
        "403": {description: forbidden, $ref: "#/components/responses/Problem"}
        "404": {description: forms.template_not_found, $ref: "#/components/responses/Problem"}
        "422": {description: "validation_failed | forms.facility_invalid", $ref: "#/components/responses/Problem"}
  # --- pf/forms (cap/forms, W6.2): biểu thu thập theo kỳ — phát hành, nộp, rà soát bốn mắt, chốt kèm ảnh chụp đóng băng, mở lại.
  # Bên dùng chọn bằng query `profile` (KN: kn). Route v1 cũ của KN (/v1/extension/report-*) chạy song song và ghi song song
  # chốt/mở lại kỳ + ảnh chụp sang pf_forms (origin = mirror). Ngữ cảnh KN: header X-AG-Context như các route KN khác.
  # 14 biểu thật (Q-01) chưa có: chỉ có biểu mẫu thử (fixture); profile kn không phát hành kỳ trên biểu fixture. ---
  /v1/forms/profiles:
    get:
      summary: Cấu hình biểu của các bên dùng (hierarchy, publish_by, close_by, review_by)
      operationId: formsProfiles
      tags: [forms]
      responses:
        "200":
          description: Danh sách
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/FormsProfile"}}
        "401": {$ref: "#/components/responses/Problem"}
  /v1/forms/templates:
    get:
      summary: Phiên bản mới nhất của mỗi biểu của bên dùng
      operationId: formsTemplates
      tags: [forms]
      parameters:
        - $ref: "#/components/parameters/FormsProfile"
      responses:
        "200":
          description: Danh sách
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/FormsTemplate"}}
        "403": {description: forbidden, $ref: "#/components/responses/Problem"}
        "404": {description: forms.profile_not_found, $ref: "#/components/responses/Problem"}
    post:
      summary: Định nghĩa phiên bản mới của biểu (vai define_by) — phiên bản cũ và kỳ đã phát hành không đổi
      operationId: formsDefineTemplate
      tags: [forms]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/FormsTemplateInput"}
      responses:
        "201":
          description: Phiên bản đã ghi
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FormsTemplate"}
        "403": {description: forbidden, $ref: "#/components/responses/Problem"}
        "404": {description: forms.profile_not_found, $ref: "#/components/responses/Problem"}
        "422": {description: forms.template_invalid, $ref: "#/components/responses/Problem"}
  /v1/forms/templates/fixtures:
    post:
      summary: Ghi các biểu mẫu thử (fixture) cho bên dùng — cơ chế chạy khi chưa có biểu thật (Q-01)
      operationId: formsInstallFixtures
      tags: [forms]
      parameters:
        - $ref: "#/components/parameters/FormsProfile"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "201":
          description: Các phiên bản đã ghi (fixture = true)
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/FormsTemplate"}}
        "403": {description: forbidden, $ref: "#/components/responses/Problem"}
        "404": {description: forms.profile_not_found, $ref: "#/components/responses/Problem"}
  /v1/forms/templates/{id}:
    get:
      summary: Một phiên bản biểu
      operationId: formsTemplate
      tags: [forms]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/FormsProfile"
      responses:
        "200":
          description: Phiên bản
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FormsTemplate"}
        "404": {description: forms.template_not_found, $ref: "#/components/responses/Problem"}
  /v1/forms/periods:
    get:
      summary: Kỳ của bên dùng mà người gọi thấy (toàn quốc, Nút phát hành, hoặc có đơn vị nhận trong phạm vi), mới trước
      operationId: formsPeriods
      tags: [forms]
      parameters:
        - $ref: "#/components/parameters/FormsProfile"
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        "200":
          description: Danh sách
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/FormsPeriod"}}
        "403": {description: forbidden, $ref: "#/components/responses/Problem"}
    post:
      summary: Phát hành kỳ (cấp publish_by; đơn vị nhận thuộc phạm vi người phát hành; biểu fixture chỉ khi profile cho phép)
      operationId: formsPublishPeriod
      tags: [forms]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/FormsPublishInput"}
      responses:
        "201":
          description: Kỳ đã phát hành
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FormsPeriodView"}
        "403": {description: forbidden, $ref: "#/components/responses/Problem"}
        "404": {description: "forms.profile_not_found | forms.template_not_found", $ref: "#/components/responses/Problem"}
        "409": {description: forms.fixture_template, $ref: "#/components/responses/Problem"}
        "422": {description: "validation_failed | forms.facility_invalid", $ref: "#/components/responses/Problem"}
  /v1/forms/periods/{id}:
    get:
      summary: Kỳ kèm trạng thái chiếu từ sổ, bài nộp cuối của từng đơn vị trong phạm vi, ảnh chụp
      operationId: formsPeriod
      tags: [forms]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/FormsProfile"
      responses:
        "200":
          description: Kỳ
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FormsPeriodView"}
        "404": {description: forms.period_not_found, $ref: "#/components/responses/Problem"}
  /v1/forms/periods/{id}/submissions:
    post:
      summary: Nộp phiên bản mới của bài (cấp lá, đơn vị trong phạm vi) — lập yêu cầu duyệt ở cap/workflow
      operationId: formsSubmit
      tags: [forms]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/FormsProfile"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/FormsSubmitInput"}
      responses:
        "201":
          description: Phiên bản đã ghi
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FormsSubmission"}
        "202":
          description: "Bản offline (captured_at) đến sau khi kỳ đã chốt với đơn vị — giữ ở trạng thái Chờ mở kỳ (status = awaiting_reopen), không vào số liệu kỳ (W11.05)"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FormsSubmission"}
        "403": {description: forbidden, $ref: "#/components/responses/Problem"}
        "404": {description: forms.period_not_found, $ref: "#/components/responses/Problem"}
        "409": {description: "forms.period_closed | forms.submission_accepted | forms.submission_limit | forms.period_cancelled | forms.submission_conflict", $ref: "#/components/responses/Problem"}
        "422": {description: "forms.values_invalid | forms.unit_not_in_period | forms.late_reason_required", $ref: "#/components/responses/Problem"}
    get:
      summary: Lịch sử phiên bản bài nộp của một đơn vị (mới trước) kèm rà soát
      operationId: formsSubmissions
      tags: [forms]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/FormsProfile"
        - {name: unit, in: query, required: true, schema: {type: string}}
      responses:
        "200":
          description: Danh sách
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/FormsSubmission"}}
        "403": {description: forbidden, $ref: "#/components/responses/Problem"}
        "404": {description: forms.period_not_found, $ref: "#/components/responses/Problem"}
  /v1/forms/periods/{id}/close:
    post:
      summary: Chốt kỳ (cấp close_by của Nút phát hành) — ảnh chụp đóng băng, băm SHA-256 do DB tính; sự kiện pf.forms.period.closed
      operationId: formsClosePeriod
      tags: [forms]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/FormsProfile"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Kỳ sau chốt
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FormsPeriodView"}
        "403": {description: forbidden, $ref: "#/components/responses/Problem"}
        "404": {description: forms.period_not_found, $ref: "#/components/responses/Problem"}
        "409": {description: "forms.period_closed | forms.pending_review | forms.period_cancelled", $ref: "#/components/responses/Problem"}
  /v1/forms/periods/{id}/reopen:
    post:
      summary: Mở lại kỳ đã chốt (cả kỳ hoặc một số đơn vị; lý do bắt buộc) — bản ghi mới, ảnh chụp đã chốt không đổi
      operationId: formsReopenPeriod
      tags: [forms]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/FormsProfile"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/FormsReopenInput"}
      responses:
        "200":
          description: Kỳ sau mở lại
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FormsPeriodView"}
        "403": {description: forbidden, $ref: "#/components/responses/Problem"}
        "404": {description: forms.period_not_found, $ref: "#/components/responses/Problem"}
        "409": {description: "forms.period_not_closed | forms.period_cancelled", $ref: "#/components/responses/Problem"}
        "422": {description: "validation_failed | forms.unit_not_in_period", $ref: "#/components/responses/Problem"}
  /v1/forms/periods/{id}/cancel:
    post:
      summary: Hủy kỳ đang mở (cấp close_by của Nút phát hành; lý do bắt buộc) — trạng thái cuối, không nộp/chốt/mở lại sau hủy (W11.05, KHTC BR-DL-18)
      operationId: formsCancelPeriod
      tags: [forms]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/FormsProfile"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/FormsCancelInput"}
      responses:
        "200":
          description: Kỳ sau hủy
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FormsPeriodView"}
        "403": {description: forbidden, $ref: "#/components/responses/Problem"}
        "404": {description: forms.period_not_found, $ref: "#/components/responses/Problem"}
        "409": {description: "forms.period_closed | forms.period_cancelled", $ref: "#/components/responses/Problem"}
        "422": {description: validation_failed, $ref: "#/components/responses/Problem"}
  /v1/forms/periods/{id}/snapshots:
    get:
      summary: Ảnh chụp của kỳ (native hoặc ghi song song — mã kỳ của bên dùng; kỳ ghi song song chỉ cấp trên cấp lá), kèm kiểm băm
      operationId: formsPeriodSnapshots
      tags: [forms]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/FormsProfile"
      responses:
        "200":
          description: Danh sách (không kèm nội dung)
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/FormsSnapshot"}}
        "403": {description: forbidden, $ref: "#/components/responses/Problem"}
        "404": {description: forms.period_not_found, $ref: "#/components/responses/Problem"}
  /v1/forms/submissions/{id}/review:
    post:
      summary: Rà soát phiên bản bài nộp cuối (cấp review_by) — chấp nhận hoặc trả lại; người rà soát ≠ người nộp (cap/workflow)
      operationId: formsReview
      tags: [forms]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/FormsProfile"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/FormsReviewInput"}
      responses:
        "200":
          description: Bài nộp sau rà soát
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FormsSubmission"}
        "403": {description: "forbidden | self_approval_forbidden", $ref: "#/components/responses/Problem"}
        "404": {description: forms.submission_not_found, $ref: "#/components/responses/Problem"}
        "409": {description: "forms.period_closed | forms.submission_superseded | forms.already_reviewed | forms.submission_limit | forms.period_cancelled", $ref: "#/components/responses/Problem"}
        "422": {description: validation_failed, $ref: "#/components/responses/Problem"}
  /v1/forms/snapshots/{id}:
    get:
      summary: Một ảnh chụp kèm nội dung đóng băng và kết quả kiểm băm (hash_valid)
      operationId: formsSnapshot
      tags: [forms]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/FormsProfile"
      responses:
        "200":
          description: Ảnh chụp
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FormsSnapshot"}
        "404": {description: forms.snapshot_not_found, $ref: "#/components/responses/Problem"}
  /v1/forms/tasks:
    get:
      summary: "W11.42 Công việc (kỳ × đơn vị trong phạm vi người gọi) kèm định nghĩa biểu và bài nộp cuối — màn Công việc cần làm (CNTS FN-08), theo dõi nộp"
      operationId: formsTasks
      tags: [forms]
      parameters:
        - $ref: "#/components/parameters/FormsProfile"
        - {name: code, in: query, schema: {type: string}, description: "Mã biểu (vd CNTS-BM04)"}
        - {name: from, in: query, schema: {type: string, format: date}, description: "Kỳ có ngày cuối ≥ from"}
        - {name: to, in: query, schema: {type: string, format: date}, description: "Kỳ có ngày đầu ≤ to"}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 60}, description: Số kỳ tối đa}
      responses:
        "200":
          description: Danh sách (kỳ mới trước; kỳ đã hủy bỏ qua)
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/FormsTask"}}
        "403": {description: forbidden, $ref: "#/components/responses/Problem"}
        "404": {description: forms.profile_not_found, $ref: "#/components/responses/Problem"}
  /v1/forms/periods/{id}/previous:
    get:
      summary: "W11.42 Sao chép kỳ trước (UR-XA-13): bài nộp cuối của đơn vị ở kỳ gần nhất trước đó của cùng biểu (null nếu chưa có)"
      operationId: formsPrevious
      tags: [forms]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/FormsProfile"
        - {name: unit, in: query, required: true, schema: {type: string}}
      responses:
        "200":
          description: Bài kỳ trước
          content:
            application/json:
              schema:
                type: object
                required: [previous]
                properties:
                  previous:
                    oneOf:
                      - {type: "null"}
                      - {$ref: "#/components/schemas/FormsPrevious"}
        "403": {description: forbidden, $ref: "#/components/responses/Problem"}
        "404": {description: forms.period_not_found, $ref: "#/components/responses/Problem"}
  # --- hết pf/forms ---
  # --- pf/hrm (dom/hrm, W11.21 — ADR-0050): danh mục nhân sự Phòng HCTH (BRD HCTH v3.0 FN-19, UR-ADM-08). Đọc: Admin và Cấp Tỉnh
  # của Phòng Hành chính – Tổng hợp (port.Access ở gốc lắp ráp); ghi: Admin. Mọi bản ghi là phiên bản (sổ chỉ ghi thêm); ngừng sử
  # dụng = phiên bản active=false (BR-01). Số thập phân (hệ số, PCCV, %) là chuỗi. Không dữ liệu cá nhân.
  /v1/hrm/status:
    get:
      summary: Tình trạng danh mục nhân sự — số mục đang dùng theo loại, bảng hệ số và tham số có hiệu lực hôm nay, số mục còn là dữ liệu mẫu (Q-070)
      operationId: hrmStatus
      tags: [hrm]
      responses:
        "200":
          description: Tình trạng
          content:
            application/json:
              schema: {$ref: "#/components/schemas/HrmStatus"}
        "401": {description: unauthenticated, $ref: "#/components/responses/Problem"}
        "403": {description: forbidden, $ref: "#/components/responses/Problem"}
  /v1/hrm/defaults:
    post:
      summary: Cài danh mục, bảng hệ số và tham số mặc định (BRD + dữ liệu mẫu đánh dấu placeholder) — chỉ mã/ngạch/khóa chưa có; Admin
      operationId: hrmInstallDefaults
      tags: [hrm]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "201":
          description: Số phiên bản đã ghi (0 khi mọi mục đã có)
          content:
            application/json:
              schema:
                type: object
                required: [items, scales, rules]
                properties:
                  items: {type: integer, minimum: 0}
                  scales: {type: integer, minimum: 0}
                  rules: {type: integer, minimum: 0}
        "403": {description: forbidden, $ref: "#/components/responses/Problem"}
        "409": {description: conflict, $ref: "#/components/responses/Problem"}
  /v1/hrm/catalogs/{kind}:
    parameters:
      - $ref: "#/components/parameters/HrmKind"
    get:
      summary: Mục hiện hành (phiên bản mới nhất) của một danh mục nhân sự, sắp theo thứ tự rồi mã
      operationId: hrmCatalogList
      tags: [hrm]
      parameters:
        - {name: include_retired, in: query, required: false, description: "true → cả mục đã ngừng sử dụng", schema: {type: boolean}}
      responses:
        "200":
          description: Danh mục
          content:
            application/json:
              schema:
                type: object
                required: [kind, items]
                properties:
                  kind: {type: string}
                  items: {type: array, items: {$ref: "#/components/schemas/HrmCatalogItem"}}
        "403": {description: forbidden, $ref: "#/components/responses/Problem"}
        "404": {description: hrm.kind_unknown, $ref: "#/components/responses/Problem"}
    post:
      summary: Thêm mục (mã được chuẩn hóa — bỏ khoảng trắng, xuống dòng; AC-03); mã đã có → chặn; Admin
      operationId: hrmCatalogCreate
      tags: [hrm]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/HrmCatalogItemInput"}
      responses:
        "201":
          description: Đã ghi phiên bản 1
          content:
            application/json:
              schema: {$ref: "#/components/schemas/HrmWriteResult"}
        "403": {description: forbidden, $ref: "#/components/responses/Problem"}
        "404": {description: hrm.kind_unknown, $ref: "#/components/responses/Problem"}
        "409": {description: hrm.item_exists, $ref: "#/components/responses/Problem"}
        "422": {description: validation_failed | hrm.item_reference, $ref: "#/components/responses/Problem"}
  /v1/hrm/catalogs/{kind}/{code}/history:
    parameters:
      - $ref: "#/components/parameters/HrmKind"
      - {name: code, in: path, required: true, schema: {type: string}}
    get:
      summary: Mọi phiên bản của một mục (cũ trước)
      operationId: hrmCatalogHistory
      tags: [hrm]
      responses:
        "200":
          description: Lịch sử
          content:
            application/json:
              schema:
                type: object
                required: [versions]
                properties:
                  versions: {type: array, items: {$ref: "#/components/schemas/HrmCatalogItem"}}
        "403": {description: forbidden, $ref: "#/components/responses/Problem"}
        "404": {description: hrm.kind_unknown | hrm.item_not_found, $ref: "#/components/responses/Problem"}
  /v1/hrm/catalogs/{kind}/{code}/revise:
    parameters:
      - $ref: "#/components/parameters/HrmKind"
      - {name: code, in: path, required: true, schema: {type: string}}
    post:
      summary: Ghi phiên bản mới của mục (sửa tên, thứ tự, thuộc tính; active=false → ngừng sử dụng, true → dùng lại); không đổi mã; Admin
      operationId: hrmCatalogRevise
      tags: [hrm]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/HrmCatalogItemInput"}
      responses:
        "201":
          description: Đã ghi phiên bản mới
          content:
            application/json:
              schema: {$ref: "#/components/schemas/HrmWriteResult"}
        "403": {description: forbidden, $ref: "#/components/responses/Problem"}
        "404": {description: hrm.kind_unknown | hrm.item_not_found, $ref: "#/components/responses/Problem"}
        "409": {description: conflict, $ref: "#/components/responses/Problem"}
        "422": {description: validation_failed | hrm.item_reference, $ref: "#/components/responses/Problem"}
  /v1/hrm/grade-scales:
    get:
      summary: Ngạch/CDNN đang dùng kèm bảng hệ số có hiệu lực tại một ngày (valid_from lớn nhất ≤ ngày; cùng ngày lấy bản ghi sau)
      operationId: hrmGradeScales
      tags: [hrm]
      parameters:
        - {name: at, in: query, required: false, description: "Ngày YYYY-MM-DD (vắng → hôm nay, giờ VN)", schema: {type: string, format: date}}
      responses:
        "200":
          description: Bảng hệ số
          content:
            application/json:
              schema:
                type: object
                required: [day, grades]
                properties:
                  day: {type: string, format: date}
                  grades:
                    type: array
                    items:
                      type: object
                      required: [grade, scale]
                      properties:
                        grade: {$ref: "#/components/schemas/HrmCatalogItem"}
                        scale:
                          description: null nếu ngạch chưa có bảng hệ số hiệu lực tại ngày hỏi
                          oneOf:
                            - {$ref: "#/components/schemas/HrmGradeScale"}
                            - {type: "null"}
        "403": {description: forbidden, $ref: "#/components/responses/Problem"}
        "422": {description: validation_failed, $ref: "#/components/responses/Problem"}
  /v1/hrm/grade-scales/{grade}:
    parameters:
      - {name: grade, in: path, required: true, description: "Mã ngạch/CDNN (vd 01.003, V.05.02.07)", schema: {type: string}}
    post:
      summary: Ghi phiên bản bảng hệ số của ngạch từ ngày hiệu lực (BR-02, AC-02 — bảng cũ giữ nguyên cho ngày trước đó); ngạch phải đang dùng; Admin
      operationId: hrmGradeScaleAdd
      tags: [hrm]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/HrmGradeScaleInput"}
      responses:
        "201":
          description: Đã ghi
          content:
            application/json:
              schema: {$ref: "#/components/schemas/HrmWriteResult"}
        "403": {description: forbidden, $ref: "#/components/responses/Problem"}
        "409": {description: conflict, $ref: "#/components/responses/Problem"}
        "422": {description: validation_failed | hrm.item_reference, $ref: "#/components/responses/Problem"}
  /v1/hrm/grade-scales/{grade}/history:
    parameters:
      - {name: grade, in: path, required: true, schema: {type: string}}
    get:
      summary: Mọi phiên bản bảng hệ số của ngạch theo ngày hiệu lực
      operationId: hrmGradeScaleHistory
      tags: [hrm]
      responses:
        "200":
          description: Lịch sử
          content:
            application/json:
              schema:
                type: object
                required: [versions]
                properties:
                  versions: {type: array, items: {$ref: "#/components/schemas/HrmGradeScale"}}
        "403": {description: forbidden, $ref: "#/components/responses/Problem"}
        "404": {description: hrm.item_not_found, $ref: "#/components/responses/Problem"}
  /v1/hrm/rules/{key}:
    parameters:
      - $ref: "#/components/parameters/HrmRuleKey"
    get:
      summary: Tham số có hiệu lực tại một ngày và mọi phiên bản (quy tắc nâng bậc, bảng quy đổi thành tích)
      operationId: hrmRule
      tags: [hrm]
      parameters:
        - {name: at, in: query, required: false, description: "Ngày YYYY-MM-DD (vắng → hôm nay, giờ VN)", schema: {type: string, format: date}}
      responses:
        "200":
          description: Tham số
          content:
            application/json:
              schema: {$ref: "#/components/schemas/HrmRuleView"}
        "403": {description: forbidden, $ref: "#/components/responses/Problem"}
        "404": {description: hrm.rule_unknown, $ref: "#/components/responses/Problem"}
        "422": {description: validation_failed, $ref: "#/components/responses/Problem"}
    post:
      summary: Ghi phiên bản tham số từ ngày hiệu lực (payload kiểm chặt theo khóa; mã kỷ luật/khen thưởng phải đang dùng); Admin
      operationId: hrmRuleAdd
      tags: [hrm]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/HrmRuleInput"}
      responses:
        "201":
          description: Đã ghi
          content:
            application/json:
              schema: {$ref: "#/components/schemas/HrmWriteResult"}
        "403": {description: forbidden, $ref: "#/components/responses/Problem"}
        "404": {description: hrm.rule_unknown, $ref: "#/components/responses/Problem"}
        "409": {description: conflict, $ref: "#/components/responses/Problem"}
        "422": {description: validation_failed | hrm.item_reference, $ref: "#/components/responses/Problem"}
  # --- pf/hrm W11.22 (pf 000150, vault 000004): HỒ SƠ NHÂN SỰ (BRD HCTH v3.0 FN-07, FN-08, FN-20). Dữ liệu cá nhân (họ tên, SĐT,
  # địa chỉ, ngày sinh, giới tính, email, ghi chú; thẻ Thống kê BC Sở TK-01..06) chỉ ở kho định danh — trả về trong phản hồi chi
  # tiết/thẻ nhạy cảm (Cache-Control no-store), không lưu ở pf_hrm. Quyền theo ma trận FN-20 (nhóm vai suy từ ngữ cảnh phiên KN ×
  # phạm vi none/self/unit/all; người dùng ưu tiên). Tắt khi AG_HRM_RECORDS chưa bật (mặc định tắt ở production — Q-005):
  # mọi route dưới đây trừ /v1/hrm/access trả 403 hrm.records_disabled. Mỗi lần xem chi tiết, xem thẻ nhạy cảm, xuất ghi nhật ký.
  /v1/hrm/access:
    get:
      summary: Quyền hồ sơ hiệu lực của người gọi (nhóm vai, đơn vị nội bộ, phạm vi theo nhóm quyền); enabled=false khi hồ sơ chưa bật
      operationId: hrmMyAccess
      tags: [hrm]
      responses:
        "200":
          description: Quyền
          content:
            application/json:
              schema: {$ref: "#/components/schemas/HrmMyAccess"}
        "401": {description: unauthenticated, $ref: "#/components/responses/Problem"}
        "403": {description: forbidden (không có ngữ cảnh phiên KN), $ref: "#/components/responses/Problem"}
  /v1/hrm/units:
    get:
      summary: Đơn vị nội bộ (phòng/trạm/trại/BGĐ) của đơn vị người gọi — bộ lọc, đơn vị công tác (HS-16), đơn vị quản lý (HS-37)
      operationId: hrmUnits
      tags: [hrm]
      responses:
        "200":
          description: Đơn vị (kể cả đã ngừng)
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [code, name, kind, active]
                      properties:
                        code: {type: string}
                        name: {type: string}
                        kind: {type: string}
                        active: {type: boolean}
        "403": {description: forbidden | hrm.records_disabled, $ref: "#/components/responses/Problem"}
  /v1/hrm/staff:
    get:
      summary: Danh sách hồ sơ trong phạm vi xem, chiếu tại ngày chốt (as-of); nhãn họ tên che bớt từ kho (FN-07 B1)
      operationId: hrmStaffList
      tags: [hrm]
      parameters:
        - $ref: "#/components/parameters/HrmAt"
        - {name: type, in: query, required: false, schema: {$ref: "#/components/schemas/HrmStaffType"}}
        - {name: unit, in: query, required: false, description: "Đơn vị công tác hoặc đơn vị quản lý (cán bộ xã)", schema: {type: string}}
        - {name: status, in: query, required: false, schema: {type: string, enum: [active, left, none]}}
        - {name: position, in: query, required: false, schema: {type: string}}
        - {name: grade, in: query, required: false, schema: {type: string}}
        - {name: q, in: query, required: false, description: "Tiền tố mã hồ sơ, hoặc SĐT (tra qua chỉ mục mù của kho)", schema: {type: string}}
        - {name: offset, in: query, required: false, schema: {type: integer, minimum: 0}}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
      responses:
        "200":
          description: Một trang
          content:
            application/json:
              schema:
                type: object
                required: [day, total, scope, items]
                properties:
                  day: {type: string, format: date}
                  total: {type: integer, minimum: 0}
                  scope: {$ref: "#/components/schemas/HrmScope"}
                  items: {type: array, items: {$ref: "#/components/schemas/HrmStaffItem"}}
        "403": {description: forbidden | hrm.records_disabled, $ref: "#/components/responses/Problem"}
        "422": {description: validation_failed, $ref: "#/components/responses/Problem"}
    post:
      summary: Thêm hồ sơ (FN-07 B2) — mã tự sinh VC/HD/XA-nnnnn; định danh + ngăn hồ sơ vào kho (mục đích hrm.profile), thẻ TK (hrm.sensitive); quá trình ban đầu bắt buộc đơn vị và chức vụ
      operationId: hrmStaffCreate
      tags: [hrm]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/HrmStaffCreate"}
      responses:
        "201":
          description: Đã tạo
          content:
            application/json:
              schema: {$ref: "#/components/schemas/HrmStaffWrite"}
        "403": {description: forbidden | hrm.records_disabled, $ref: "#/components/responses/Problem"}
        "409": {description: hrm.duplicate_person | conflict, $ref: "#/components/responses/Problem"}
        "422": {description: validation_failed | hrm.item_reference | hrm.step_out_of_range | hrm.not_applicable, $ref: "#/components/responses/Problem"}
  /v1/hrm/staff/export:
    get:
      summary: Xuất danh sách đang lọc ra CSV (UTF-8 có BOM, mở bằng Excel) trong phạm vi xuất — không có trường TK (BR-03); ghi một dòng nhật ký xuất
      operationId: hrmStaffExport
      tags: [hrm]
      parameters:
        - $ref: "#/components/parameters/HrmAt"
        - {name: type, in: query, required: false, schema: {$ref: "#/components/schemas/HrmStaffType"}}
        - {name: unit, in: query, required: false, schema: {type: string}}
        - {name: status, in: query, required: false, schema: {type: string, enum: [active, left, none]}}
        - {name: position, in: query, required: false, schema: {type: string}}
        - {name: grade, in: query, required: false, schema: {type: string}}
        - {name: q, in: query, required: false, schema: {type: string}}
      responses:
        "200":
          description: Tệp CSV (Cache-Control no-store)
          content:
            text/csv:
              schema: {type: string}
        "403": {description: forbidden | hrm.records_disabled, $ref: "#/components/responses/Problem"}
        "422": {description: validation_failed (quá 5.000 hồ sơ), $ref: "#/components/responses/Problem"}
  /v1/hrm/staff/{id}:
    parameters:
      - $ref: "#/components/parameters/HrmStaffId"
    get:
      summary: Hồ sơ chi tiết tại ngày chốt (thẻ Thông tin chung, Công tác, Trình độ, Khen thưởng, Ngạch - Bậc, Thông tin làm việc, Lịch sử sửa) — ghi nhật ký xem; không có thẻ TK
      operationId: hrmStaffGet
      tags: [hrm]
      parameters:
        - $ref: "#/components/parameters/HrmAt"
      responses:
        "200":
          description: Hồ sơ (Cache-Control no-store)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/HrmStaffDetail"}
        "403": {description: forbidden | hrm.records_disabled | mfa_required (kho), $ref: "#/components/responses/Problem"}
        "404": {description: hrm.staff_not_found (kể cả hồ sơ ngoài phạm vi), $ref: "#/components/responses/Problem"}
  /v1/hrm/staff/{id}/profile:
    parameters:
      - $ref: "#/components/parameters/HrmStaffId"
    post:
      summary: Sửa định danh/ngăn hồ sơ (trường vắng = không đổi) và tài khoản gắn (null = gỡ); sổ ghi TÊN trường đã đổi
      operationId: hrmStaffProfile
      tags: [hrm]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/HrmProfileUpdate"}
      responses:
        "200":
          description: Đã ghi (version không đổi khi không có gì đổi)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/HrmStaffWrite"}
        "403": {description: forbidden | hrm.records_disabled, $ref: "#/components/responses/Problem"}
        "404": {description: hrm.staff_not_found, $ref: "#/components/responses/Problem"}
        "409": {description: hrm.duplicate_person, $ref: "#/components/responses/Problem"}
        "422": {description: validation_failed, $ref: "#/components/responses/Problem"}
  /v1/hrm/staff/{id}/sensitive:
    parameters:
      - $ref: "#/components/parameters/HrmStaffId"
    get:
      summary: Thẻ Thống kê BC Sở (TK-01..06) — chỉ quyền sensitive.view (mặc định HCTH, Admin); viên chức và HĐLĐ; ghi nhật ký view_sensitive; kho đọc với mục đích hrm.sensitive
      operationId: hrmStaffSensitive
      tags: [hrm]
      responses:
        "200":
          description: Các trường (Cache-Control no-store)
          content:
            application/json:
              schema:
                type: object
                required: [id, fields]
                properties:
                  id: {type: string, format: uuid}
                  fields: {$ref: "#/components/schemas/HrmSensitiveFields"}
        "403": {description: forbidden | hrm.records_disabled | mfa_required (kho), $ref: "#/components/responses/Problem"}
        "404": {description: hrm.staff_not_found, $ref: "#/components/responses/Problem"}
        "422": {description: hrm.not_applicable (cán bộ xã), $ref: "#/components/responses/Problem"}
    post:
      summary: Thay thẻ Thống kê BC Sở (cần sensitive.view + profile.edit); dân tộc/tôn giáo là mã danh mục đang dùng
      operationId: hrmStaffSensitiveWrite
      tags: [hrm]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fields]
              additionalProperties: false
              properties:
                fields: {$ref: "#/components/schemas/HrmSensitiveFields"}
      responses:
        "200":
          description: Đã ghi
          content:
            application/json:
              schema: {$ref: "#/components/schemas/HrmStaffWrite"}
        "403": {description: forbidden | hrm.records_disabled, $ref: "#/components/responses/Problem"}
        "404": {description: hrm.staff_not_found, $ref: "#/components/responses/Problem"}
        "422": {description: validation_failed | hrm.item_reference | hrm.not_applicable, $ref: "#/components/responses/Problem"}
  /v1/hrm/staff/{id}/events:
    parameters:
      - $ref: "#/components/parameters/HrmStaffId"
    post:
      summary: Thêm một dòng quá trình có hiệu lực (đơn vị, chức vụ, tăng cường, ngạch, bậc, văn bằng, bồi dưỡng, khen thưởng, kỷ luật, vào làm/nghỉ việc — FN-07 B4/B6/B7, FN-08)
      operationId: hrmStaffEventAdd
      tags: [hrm]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/HrmEventInput"}
      responses:
        "201": {$ref: "#/components/responses/HrmEventWritten"}
        "403": {description: forbidden | hrm.records_disabled, $ref: "#/components/responses/Problem"}
        "404": {description: hrm.staff_not_found, $ref: "#/components/responses/Problem"}
        "422": {description: validation_failed | hrm.item_reference | hrm.step_out_of_range, $ref: "#/components/responses/Problem"}
  /v1/hrm/staff/{id}/events/{event}/replace:
    parameters:
      - $ref: "#/components/parameters/HrmStaffId"
      - $ref: "#/components/parameters/HrmEventId"
    post:
      summary: Thay một dòng quá trình còn hiệu lực bằng dòng mới cùng loại (reason 10–500 ký tự bắt buộc); dòng cũ giữ trong lịch sử
      operationId: hrmStaffEventReplace
      tags: [hrm]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/HrmEventInput"}
      responses:
        "201": {$ref: "#/components/responses/HrmEventWritten"}
        "403": {description: forbidden | hrm.records_disabled, $ref: "#/components/responses/Problem"}
        "404": {description: hrm.staff_not_found | hrm.event_not_found, $ref: "#/components/responses/Problem"}
        "422": {description: validation_failed | hrm.item_reference | hrm.step_out_of_range, $ref: "#/components/responses/Problem"}
  /v1/hrm/staff/{id}/events/{event}/void:
    parameters:
      - $ref: "#/components/parameters/HrmStaffId"
      - $ref: "#/components/parameters/HrmEventId"
    post:
      summary: Hủy một dòng quá trình còn hiệu lực (sự kiện bù có lý do 10–500 ký tự; hồ sơ không xóa — BR-01)
      operationId: hrmStaffEventVoid
      tags: [hrm]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              additionalProperties: false
              properties:
                reason: {type: string, minLength: 10, maxLength: 500}
      responses:
        "201": {$ref: "#/components/responses/HrmEventWritten"}
        "403": {description: forbidden | hrm.records_disabled, $ref: "#/components/responses/Problem"}
        "404": {description: hrm.staff_not_found | hrm.event_not_found, $ref: "#/components/responses/Problem"}
        "422": {description: validation_failed, $ref: "#/components/responses/Problem"}
  /v1/hrm/staff/{id}/access-log:
    parameters:
      - $ref: "#/components/parameters/HrmStaffId"
    get:
      summary: Nhật ký xem chi tiết, xem thẻ TK, xuất có hồ sơ này (mới trước) — quyền audit.view
      operationId: hrmStaffAccessLog
      tags: [hrm]
      parameters:
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 500, default: 200}}
      responses:
        "200":
          description: Nhật ký
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/HrmAccessEntry"}}
        "403": {description: forbidden | hrm.records_disabled, $ref: "#/components/responses/Problem"}
        "404": {description: hrm.staff_not_found, $ref: "#/components/responses/Problem"}
  /v1/hrm/permissions:
    get:
      summary: Ma trận phân quyền hồ sơ (FN-20) — mọi nhóm vai (mặc định + đã chỉnh) và các dòng theo người dùng; chỉ Admin
      operationId: hrmPermissions
      tags: [hrm]
      responses:
        "200":
          description: Ma trận
          content:
            application/json:
              schema:
                type: object
                required: [perms, scopes, groups, items]
                properties:
                  perms: {type: array, items: {type: string}}
                  scopes: {type: array, items: {$ref: "#/components/schemas/HrmScope"}}
                  groups: {type: array, items: {type: string}}
                  items: {type: array, items: {$ref: "#/components/schemas/HrmPermEntry"}}
        "403": {description: forbidden | hrm.records_disabled, $ref: "#/components/responses/Problem"}
    post:
      summary: Ghi phiên bản mới của một dòng ma trận (nhóm vai hoặc người dùng); quyền Admin cố định (hrm.permission_locked); thẻ TK chỉ cấp cho nhóm HCTH hoặc từng người
      operationId: hrmPermissionSet
      tags: [hrm]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [grantee_kind, grantee, perms]
              additionalProperties: false
              properties:
                grantee_kind: {type: string, enum: [role, user]}
                grantee: {type: string, description: "Nhóm vai (hcth, manager, tinh, xa, tw) hoặc mã người dùng (UUID)"}
                perms: {$ref: "#/components/schemas/HrmPermMatrix"}
                note: {type: string, maxLength: 500}
      responses:
        "201":
          description: Đã ghi
          content:
            application/json:
              schema:
                type: object
                required: [version]
                properties:
                  version: {type: integer}
        "403": {description: forbidden | hrm.records_disabled, $ref: "#/components/responses/Problem"}
        "422": {description: validation_failed | hrm.permission_locked, $ref: "#/components/responses/Problem"}
  /v1/hrm/permissions/history:
    get:
      summary: Nhật ký đổi quyền hồ sơ — mọi phiên bản của mọi dòng ma trận, cũ trước; chỉ Admin
      operationId: hrmPermissionHistory
      tags: [hrm]
      responses:
        "200":
          description: Lịch sử
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/HrmPermEntry"}}
        "403": {description: forbidden | hrm.records_disabled, $ref: "#/components/responses/Problem"}
  # --- hết pf/hrm ---
  # --- pf/price (cap/price, W11.71 — ADR-0049): khung module giá của Báo giá nông sản (BRD v1.3). Trạng thái module và danh mục
  # nền (đơn vị tính, nhóm hàng) có hiệu lực theo ngày; route nghiệp vụ (xã báo giá, mặt hàng, lịch, phiếu, bảng giá) thêm ở
  # W11.72–W11.76. Bên dùng chọn bằng query `profile` (vắng → profile đầu tiên; KN = kn). Ngữ cảnh KN: header X-AG-Context. ---
  /v1/price/status:
    get:
      summary: Trạng thái khung cap/price của tenant người gọi — cấu hình bên dùng, cấp của người gọi, số mục danh mục đang hiệu lực
      operationId: priceStatus
      tags: [price]
      parameters:
        - $ref: "#/components/parameters/PriceProfile"
      responses:
        "200":
          description: Trạng thái
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PriceStatus"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {description: forbidden, $ref: "#/components/responses/Problem"}
        "404": {description: price.profile_not_found, $ref: "#/components/responses/Problem"}
  /v1/price/catalog:
    get:
      summary: Danh mục nền đang hiệu lực tại một ngày (đơn vị tính, nhóm hàng) — phiên bản mới nhất có valid_from ≤ ngày, bỏ mã đã ngưng
      operationId: priceCatalog
      tags: [price]
      parameters:
        - $ref: "#/components/parameters/PriceProfile"
        - {name: at, in: query, required: false, description: "Ngày báo giá YYYY-MM-DD (vắng → hôm nay, giờ VN)", schema: {type: string, format: date}}
      responses:
        "200":
          description: Danh mục
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PriceCatalog"}
        "403": {description: forbidden, $ref: "#/components/responses/Problem"}
        "404": {description: price.profile_not_found, $ref: "#/components/responses/Problem"}
        "422": {description: validation_failed, $ref: "#/components/responses/Problem"}
  /v1/price/catalog/defaults:
    post:
      summary: Ghi danh mục mặc định (5 nhóm hàng BRD, đơn vị tính thường gặp, 2 nhóm vùng An Giang / Kiên Giang) hiệu lực từ hôm nay — chỉ mã chưa có; vai quản trị danh mục
      operationId: priceInstallDefaults
      tags: [price]
      parameters:
        - $ref: "#/components/parameters/PriceProfile"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "201":
          description: Số phiên bản đã ghi (0 khi mọi mã đã có)
          content:
            application/json:
              schema:
                type: object
                required: [written]
                properties:
                  written: {type: integer, minimum: 0}
        "403": {description: forbidden, $ref: "#/components/responses/Problem"}
        "404": {description: price.profile_not_found, $ref: "#/components/responses/Problem"}
        "409": {description: conflict, $ref: "#/components/responses/Problem"}
  # W11.74 — lịch báo giá, giờ khóa, hạn phản hồi, nhắc nhập giá, ngưỡng cảnh báo (BRD FN-AD-04.04…06, FN-XA-03.04). Đọc: mọi cấp
  # của Profile; ghi: Quản trị nghiệp vụ báo giá (vai quản trị hoặc Cấp Tỉnh có cờ qtnv_bao_gia — W11.72; can_manage ở phản hồi). Số % là chuỗi Decimal. Mọi bản ghi là phiên bản (sổ chỉ ghi thêm).
  /v1/price/calendar:
    get:
      summary: Lịch báo giá đang hiệu lực, phiên bản đã lên lịch, lịch khóa nhập các ngày tới (mặc định 30), ngoại lệ, lịch sử thay đổi
      operationId: priceCalendar
      tags: [price]
      parameters:
        - $ref: "#/components/parameters/PriceProfile"
      responses:
        "200":
          description: Lịch
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PriceCalendar"}
        "403": {description: forbidden, $ref: "#/components/responses/Problem"}
        "404": {description: price.profile_not_found, $ref: "#/components/responses/Problem"}
  /v1/price/calendar/schedule:
    post:
      summary: Ghi phiên bản lịch mới (ngày báo giá trong tuần, giờ khóa, hạn phản hồi, giờ nhắc, kênh, nội dung mẫu) có hiệu lực từ valid_from
      description: |
        valid_from không trong quá khứ; hôm nay là ngày báo giá → sớm nhất ngày mai (422 price.valid_from). Nhắc 1 < nhắc 2 < giờ khóa
        (422 price.remind_order) < hạn phản hồi (422 price.respond_before_lock). Biến mẫu chỉ {ngày}, {xã}, {giờ khóa} (422 price.template_var).
      operationId: priceSaveSchedule
      tags: [price]
      parameters:
        - $ref: "#/components/parameters/PriceProfile"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PriceScheduleInput"}
      responses:
        "201":
          description: Phiên bản đã ghi
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PriceSchedule"}
        "403": {description: forbidden, $ref: "#/components/responses/Problem"}
        "404": {description: price.profile_not_found, $ref: "#/components/responses/Problem"}
        "409": {description: conflict, $ref: "#/components/responses/Problem"}
        "422": {description: "validation_failed | price.valid_from | price.remind_order | price.respond_before_lock | price.template_var", $ref: "#/components/responses/Problem"}
  /v1/price/calendar/exceptions:
    post:
      summary: Thêm ngày nghỉ (holiday — ngày báo giá theo lịch) hoặc ngày báo giá bổ sung (extra — ngày ngoài lịch) kèm lý do; chỉ ngày từ ngày mai
      operationId: priceAddException
      tags: [price]
      parameters:
        - $ref: "#/components/parameters/PriceProfile"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [day, kind, reason]
              properties:
                day: {type: string, format: date}
                kind: {type: string, enum: [holiday, extra]}
                reason: {type: string, minLength: 1, maxLength: 300}
      responses:
        "201":
          description: Ngoại lệ đã ghi
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PriceCalendarException"}
        "403": {description: forbidden, $ref: "#/components/responses/Problem"}
        "409": {description: price.exception_exists, $ref: "#/components/responses/Problem"}
        "422": {description: "validation_failed | price.valid_from | price.exception_mismatch", $ref: "#/components/responses/Problem"}
  /v1/price/calendar/exceptions/{day}/retire:
    post:
      summary: Xóa ngoại lệ của một ngày (ghi phiên bản retired); chỉ ngày từ ngày mai
      operationId: priceRetireException
      tags: [price]
      parameters:
        - {name: day, in: path, required: true, schema: {type: string, format: date}}
        - $ref: "#/components/parameters/PriceProfile"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204": {description: Đã xóa}
        "403": {description: forbidden, $ref: "#/components/responses/Problem"}
        "404": {description: price.exception_not_found, $ref: "#/components/responses/Problem"}
        "422": {description: price.valid_from, $ref: "#/components/responses/Problem"}
  /v1/price/calendar/runs:
    get:
      summary: Nhật ký job price_calendar — mốc khóa thực tế (độ trễ so với giờ khóa) và lịch sử gửi nhắc lần 1/2
      operationId: priceCalendarRuns
      tags: [price]
      parameters:
        - $ref: "#/components/parameters/PriceProfile"
        - {name: from, in: query, required: false, description: "Vắng → 30 ngày trước", schema: {type: string, format: date}}
        - {name: to, in: query, required: false, description: "Vắng → hôm nay (giờ VN); tối đa 92 ngày", schema: {type: string, format: date}}
      responses:
        "200":
          description: Nhật ký
          content:
            application/json:
              schema:
                type: object
                required: [from, to, items]
                properties:
                  from: {type: string, format: date}
                  to: {type: string, format: date}
                  items: {type: array, items: {$ref: "#/components/schemas/PriceCalendarRun"}}
        "403": {description: forbidden, $ref: "#/components/responses/Problem"}
        "422": {description: validation_failed, $ref: "#/components/responses/Problem"}
  /v1/price/calendar/reminder-test:
    post:
      summary: Gửi thử nhắc nhập giá (mẫu của lịch hiện hành) tới tài khoản đang đăng nhập — FN-AD-04.05 AC-02
      operationId: priceReminderTest
      tags: [price]
      parameters:
        - $ref: "#/components/parameters/PriceProfile"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Đã xếp hàng thông báo (pf/notify)
          content:
            application/json:
              schema:
                type: object
                required: [body]
                properties:
                  body: {type: string, description: Nội dung đã thay biến}
        "403": {description: forbidden, $ref: "#/components/responses/Problem"}
  /v1/price/thresholds:
    get:
      summary: Ngưỡng cảnh báo giá cao / thấp bất thường đang hiệu lực (mặc định + tham số chung, nhóm hàng, mặt hàng) và lịch sử thay đổi
      operationId: priceThresholds
      tags: [price]
      parameters:
        - $ref: "#/components/parameters/PriceProfile"
      responses:
        "200":
          description: Ngưỡng
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PriceThresholds"}
        "403": {description: forbidden, $ref: "#/components/responses/Problem"}
    post:
      summary: Ghi ngưỡng (phiên bản mới) — default kèm lookback_days, flat_pct, survey_pct; group/item chỉ pct. 0 < % ≤ 100
      operationId: priceSaveThreshold
      tags: [price]
      parameters:
        - $ref: "#/components/parameters/PriceProfile"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PriceThresholdInput"}
      responses:
        "201":
          description: Phiên bản đã ghi
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PriceThreshold"}
        "403": {description: forbidden, $ref: "#/components/responses/Problem"}
        "409": {description: conflict, $ref: "#/components/responses/Problem"}
        "422": {description: validation_failed, $ref: "#/components/responses/Problem"}
  /v1/price/thresholds/{scope}/{code}/retire:
    post:
      summary: Xóa ngưỡng nhóm hàng / mặt hàng (phiên bản retired); ngưỡng mặc định không xóa được
      operationId: priceRetireThreshold
      tags: [price]
      parameters:
        - {name: scope, in: path, required: true, schema: {type: string, enum: [default, group, item]}}
        - {name: code, in: path, required: true, schema: {type: string}}
        - $ref: "#/components/parameters/PriceProfile"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204": {description: Đã xóa}
        "403": {description: forbidden, $ref: "#/components/responses/Problem"}
        "404": {description: price.threshold_not_found, $ref: "#/components/responses/Problem"}
        "422": {description: price.default_threshold, $ref: "#/components/responses/Problem"}
  # --- pf/price W11.73 (pf 000141, BRD Báo giá v1.3 FN-AD-04.03, FN-XA-03.01): mặt hàng theo thời kỳ — mặt hàng có phiên bản +
  # valid_from, nhóm hàng, gán mặt hàng Địa phương cho xã, đề xuất từ xã, bộ theo vụ, "thay thế cho". Ngày hiệu lực vắng →
  # ngày báo giá kế tiếp (BR-02). point_code = mã xã báo giá (mặc định mã ĐVHC xã; liên kết lỏng tới xã báo giá W11.72). ---
  /v1/price/items:
    get:
      summary: Danh mục mặt hàng nhìn từ một ngày — mọi trạng thái (Hoạt động / Chờ hiệu lực / Ngưng), sắp theo nhóm, thứ tự, mã
      operationId: priceListItems
      tags: [price]
      parameters:
        - $ref: "#/components/parameters/PriceProfile"
        - $ref: "#/components/parameters/PriceAt"
        - {name: group, in: query, required: false, schema: {type: string}}
        - {name: kind, in: query, required: false, schema: {type: string, enum: [basic, local]}}
        - {name: state, in: query, required: false, schema: {type: string, enum: [active, pending, retired]}}
        - {name: q, in: query, required: false, description: "Tìm theo mã, tên, giống/phẩm cấp", schema: {type: string}}
      responses:
        "200":
          description: Danh sách
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PriceItemList"}
        "403": {description: forbidden, $ref: "#/components/responses/Problem"}
        "404": {description: price.profile_not_found, $ref: "#/components/responses/Problem"}
        "422": {description: validation_failed, $ref: "#/components/responses/Problem"}
    post:
      summary: Thêm mặt hàng — mã tự sinh MH#####; Cơ bản áp dụng mọi xã, Địa phương gán cho points; "thay thế cho" ngưng mặt hàng cũ từ ngày hiệu lực
      operationId: priceCreateItem
      tags: [price]
      parameters:
        - $ref: "#/components/parameters/PriceProfile"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PriceItemInput"}
      responses:
        "201":
          description: Đã ghi
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PriceWriteResult"}
        "400": {description: bad_request, $ref: "#/components/responses/Problem"}
        "403": {description: forbidden (chỉ Cấp Tỉnh, vai quản trị), $ref: "#/components/responses/Problem"}
        "404": {description: price.item_not_found (mặt hàng được thay thế), $ref: "#/components/responses/Problem"}
        "409": {description: price.item_duplicate | conflict, $ref: "#/components/responses/Problem"}
        "422": {description: validation_failed | price.item_date_invalid | price.item_basic_not_assignable, $ref: "#/components/responses/Problem"}
  /v1/price/items/{code}:
    get:
      summary: Một mặt hàng tại ngày — trạng thái, lịch sử phiên bản (lịch sử thay đổi, tên cũ), mặt hàng thay thế nó
      operationId: priceGetItem
      tags: [price]
      parameters:
        - $ref: "#/components/parameters/PriceProfile"
        - $ref: "#/components/parameters/PriceItemCode"
        - $ref: "#/components/parameters/PriceAt"
      responses:
        "200":
          description: Mặt hàng
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PriceItemDetail"}
        "403": {description: forbidden, $ref: "#/components/responses/Problem"}
        "404": {description: price.item_not_found, $ref: "#/components/responses/Problem"}
  /v1/price/items/{code}/revise:
    post:
      summary: Sửa mặt hàng — phiên bản mới từ valid_from; đã có giá thì chỉ sửa tên, nơi bán (BR-04) và chỉ Quản trị nghiệp vụ
      operationId: priceReviseItem
      tags: [price]
      parameters:
        - $ref: "#/components/parameters/PriceProfile"
        - $ref: "#/components/parameters/PriceItemCode"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PriceItemInput"}
      responses:
        "201":
          description: Đã ghi
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PriceWriteResult"}
        "403": {description: forbidden, $ref: "#/components/responses/Problem"}
        "404": {description: price.item_not_found, $ref: "#/components/responses/Problem"}
        "409": {description: price.item_locked | price.item_retired | price.item_duplicate, $ref: "#/components/responses/Problem"}
        "422": {description: validation_failed | price.item_date_invalid, $ref: "#/components/responses/Problem"}
  /v1/price/items/{code}/retire:
    post:
      summary: Ngưng mặt hàng — hiệu lực đến valid_to (vắng → hết ngày trước ngày báo giá kế tiếp), có lý do; không xóa
      operationId: priceRetireItem
      tags: [price]
      parameters:
        - $ref: "#/components/parameters/PriceProfile"
        - $ref: "#/components/parameters/PriceItemCode"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                valid_to: {type: string, format: date}
                reason: {type: string, minLength: 1, maxLength: 500}
      responses:
        "201":
          description: Đã ghi
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PriceWriteResult"}
        "403": {description: forbidden, $ref: "#/components/responses/Problem"}
        "404": {description: price.item_not_found, $ref: "#/components/responses/Problem"}
        "409": {description: price.item_retired, $ref: "#/components/responses/Problem"}
        "422": {description: validation_failed | price.item_date_invalid, $ref: "#/components/responses/Problem"}
  /v1/price/items/{code}/move:
    post:
      summary: Đổi thứ tự hiển thị trong nhóm (lên / xuống) từ ngày báo giá kế tiếp
      operationId: priceMoveItem
      tags: [price]
      parameters:
        - $ref: "#/components/parameters/PriceProfile"
        - $ref: "#/components/parameters/PriceItemCode"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [direction]
              properties:
                direction: {type: string, enum: [up, down]}
      responses:
        "201":
          description: Đã ghi (written = 0 khi đã ở đầu/cuối nhóm)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PriceWriteResult"}
        "403": {description: forbidden, $ref: "#/components/responses/Problem"}
        "404": {description: price.item_not_found, $ref: "#/components/responses/Problem"}
        "409": {description: price.item_retired, $ref: "#/components/responses/Problem"}
  /v1/price/groups:
    get:
      summary: Nhóm hàng đang hiệu lực tại ngày, kèm số mặt hàng đang hiệu lực
      operationId: priceListGroups
      tags: [price]
      parameters:
        - $ref: "#/components/parameters/PriceProfile"
        - $ref: "#/components/parameters/PriceAt"
      responses:
        "200":
          description: Nhóm hàng
          content:
            application/json:
              schema:
                type: object
                required: [groups]
                properties:
                  groups: {type: array, items: {$ref: "#/components/schemas/PriceGroup"}}
        "403": {description: forbidden, $ref: "#/components/responses/Problem"}
    post:
      summary: Thêm nhóm hàng (hiệu lực từ hôm nay; mã vắng → nhom_<n>)
      operationId: priceCreateGroup
      tags: [price]
      parameters:
        - $ref: "#/components/parameters/PriceProfile"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PriceGroupInput"}
      responses:
        "201":
          description: Đã ghi
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PriceWriteResult"}
        "403": {description: forbidden, $ref: "#/components/responses/Problem"}
        "409": {description: conflict (mã đã có), $ref: "#/components/responses/Problem"}
        "422": {description: validation_failed, $ref: "#/components/responses/Problem"}
  /v1/price/groups/{code}/revise:
    post:
      summary: Sửa tên / thứ tự nhóm hàng (hiệu lực từ hôm nay)
      operationId: priceReviseGroup
      tags: [price]
      parameters:
        - $ref: "#/components/parameters/PriceProfile"
        - {name: code, in: path, required: true, schema: {type: string}}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PriceGroupInput"}
      responses:
        "201":
          description: Đã ghi
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PriceWriteResult"}
        "403": {description: forbidden, $ref: "#/components/responses/Problem"}
        "404": {description: price.group_not_found, $ref: "#/components/responses/Problem"}
        "422": {description: validation_failed, $ref: "#/components/responses/Problem"}
  /v1/price/groups/{code}/retire:
    post:
      summary: Xóa nhóm hàng (phiên bản ngưng) — chặn khi nhóm còn mặt hàng đang hoặc sắp hiệu lực
      operationId: priceRetireGroup
      tags: [price]
      parameters:
        - $ref: "#/components/parameters/PriceProfile"
        - {name: code, in: path, required: true, schema: {type: string}}
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "201":
          description: Đã ghi
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PriceWriteResult"}
        "403": {description: forbidden, $ref: "#/components/responses/Problem"}
        "404": {description: price.group_not_found, $ref: "#/components/responses/Problem"}
        "409": {description: price.group_not_empty, $ref: "#/components/responses/Problem"}
  /v1/price/assignments:
    get:
      summary: Gán mặt hàng Địa phương cho xã đang hiệu lực tại ngày (lọc theo xã)
      operationId: priceListAssignments
      tags: [price]
      parameters:
        - $ref: "#/components/parameters/PriceProfile"
        - $ref: "#/components/parameters/PriceAt"
        - {name: point, in: query, required: false, schema: {type: string}}
      responses:
        "200":
          description: Gán
          content:
            application/json:
              schema:
                type: object
                required: [assignments]
                properties:
                  assignments: {type: array, items: {$ref: "#/components/schemas/PriceAssignment"}}
        "403": {description: forbidden, $ref: "#/components/responses/Problem"}
    post:
      summary: Gán mặt hàng Địa phương cho xã từ valid_from (gán đã có bỏ qua); mặt hàng Cơ bản không gán riêng
      operationId: priceAssignItems
      tags: [price]
      parameters:
        - $ref: "#/components/parameters/PriceProfile"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PriceAssignInput"}
      responses:
        "201":
          description: Đã ghi
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PriceWriteResult"}
        "403": {description: forbidden, $ref: "#/components/responses/Problem"}
        "404": {description: price.item_not_found, $ref: "#/components/responses/Problem"}
        "409": {description: price.item_retired, $ref: "#/components/responses/Problem"}
        "422": {description: validation_failed | price.item_date_invalid | price.item_basic_not_assignable, $ref: "#/components/responses/Problem"}
  /v1/price/assignments/remove:
    post:
      summary: Bỏ gán mặt hàng khỏi xã từ valid_from; hôm nay xã đã có phiếu → áp dụng từ ngày báo giá kế tiếp
      operationId: priceUnassignItems
      tags: [price]
      parameters:
        - $ref: "#/components/parameters/PriceProfile"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PriceAssignInput"}
      responses:
        "201":
          description: Đã ghi
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PriceWriteResult"}
        "403": {description: forbidden, $ref: "#/components/responses/Problem"}
        "404": {description: price.item_not_found, $ref: "#/components/responses/Problem"}
        "422": {description: validation_failed | price.item_date_invalid | price.item_basic_not_assignable, $ref: "#/components/responses/Problem"}
  /v1/price/point-items:
    get:
      summary: Mặt hàng xã báo giá phải báo giá tại ngày — Cơ bản ∪ Địa phương đã gán, lọc bộ theo vụ, đúng thứ tự (AC-04)
      operationId: pricePointItems
      tags: [price]
      parameters:
        - $ref: "#/components/parameters/PriceProfile"
        - $ref: "#/components/parameters/PriceAt"
        - {name: point, in: query, required: true, schema: {type: string}}
      responses:
        "200":
          description: Mặt hàng của xã
          content:
            application/json:
              schema:
                type: object
                required: [day, point_code, items]
                properties:
                  day: {type: string, format: date}
                  point_code: {type: string}
                  items: {type: array, items: {$ref: "#/components/schemas/PriceItem"}}
        "403": {description: forbidden, $ref: "#/components/responses/Problem"}
        "422": {description: validation_failed, $ref: "#/components/responses/Problem"}
  /v1/price/item-sets:
    get:
      summary: Bộ mặt hàng theo vụ nhìn từ một ngày (có hiệu lực hoặc sắp hiệu lực)
      operationId: priceListItemSets
      tags: [price]
      parameters:
        - $ref: "#/components/parameters/PriceProfile"
        - $ref: "#/components/parameters/PriceAt"
      responses:
        "200":
          description: Bộ mặt hàng
          content:
            application/json:
              schema:
                type: object
                required: [sets]
                properties:
                  sets: {type: array, items: {$ref: "#/components/schemas/PriceItemSet"}}
        "403": {description: forbidden, $ref: "#/components/responses/Problem"}
    post:
      summary: Tạo bộ mặt hàng theo vụ — mặt hàng thuộc bộ chỉ xuất hiện ở xã khi có bộ chứa nó đang bật (BR-08)
      operationId: priceCreateItemSet
      tags: [price]
      parameters:
        - $ref: "#/components/parameters/PriceProfile"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PriceItemSetInput"}
      responses:
        "201":
          description: Đã ghi
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PriceWriteResult"}
        "403": {description: forbidden, $ref: "#/components/responses/Problem"}
        "404": {description: price.item_not_found, $ref: "#/components/responses/Problem"}
        "409": {description: price.item_set_exists, $ref: "#/components/responses/Problem"}
        "422": {description: validation_failed | price.item_date_invalid, $ref: "#/components/responses/Problem"}
  /v1/price/item-sets/{code}/revise:
    post:
      summary: Sửa bộ (tên, vụ, danh sách, bật/tắt, retire = ngưng bộ) — phiên bản mới từ valid_from
      operationId: priceReviseItemSet
      tags: [price]
      parameters:
        - $ref: "#/components/parameters/PriceProfile"
        - {name: code, in: path, required: true, schema: {type: string}}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PriceItemSetInput"}
      responses:
        "201":
          description: Đã ghi
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PriceWriteResult"}
        "403": {description: forbidden, $ref: "#/components/responses/Problem"}
        "404": {description: price.item_set_not_found | price.item_not_found, $ref: "#/components/responses/Problem"}
        "422": {description: validation_failed | price.item_date_invalid, $ref: "#/components/responses/Problem"}
  /v1/price/proposals:
    get:
      summary: Đề xuất mặt hàng từ xã (mới nhất trước); Cấp Xã chỉ thấy đề xuất của mình
      operationId: priceListProposals
      tags: [price]
      parameters:
        - $ref: "#/components/parameters/PriceProfile"
        - {name: status, in: query, required: false, schema: {type: string, enum: [pending, approved, rejected]}}
      responses:
        "200":
          description: Đề xuất
          content:
            application/json:
              schema:
                type: object
                required: [proposals]
                properties:
                  proposals: {type: array, items: {$ref: "#/components/schemas/PriceProposal"}}
        "403": {description: forbidden, $ref: "#/components/responses/Problem"}
    post:
      summary: Đề xuất mặt hàng mới (Cấp Xã, Cấp Tỉnh) — chỉ xuất hiện ở màn Nhập báo giá khi được duyệt và gán cho xã
      operationId: priceCreateProposal
      tags: [price]
      parameters:
        - $ref: "#/components/parameters/PriceProfile"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PriceProposalInput"}
      responses:
        "201":
          description: Đã ghi (code = mã đề xuất)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PriceWriteResult"}
        "403": {description: forbidden, $ref: "#/components/responses/Problem"}
        "422": {description: validation_failed, $ref: "#/components/responses/Problem"}
  /v1/price/proposals/{id}/approve:
    post:
      summary: Duyệt đề xuất — tạo mặt hàng (nội dung gửi kèm, mặc định Địa phương) và gán cho xã đề xuất từ ngày hiệu lực (AC-05)
      operationId: priceApproveProposal
      tags: [price]
      parameters:
        - $ref: "#/components/parameters/PriceProfile"
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PriceItemInput"}
      responses:
        "201":
          description: Đã ghi (code = mã mặt hàng mới)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PriceWriteResult"}
        "403": {description: forbidden, $ref: "#/components/responses/Problem"}
        "404": {description: price.proposal_not_found, $ref: "#/components/responses/Problem"}
        "409": {description: price.proposal_decided | price.item_duplicate, $ref: "#/components/responses/Problem"}
        "422": {description: validation_failed | price.item_date_invalid, $ref: "#/components/responses/Problem"}
  /v1/price/proposals/{id}/reject:
    post:
      summary: Từ chối đề xuất kèm lý do
      operationId: priceRejectProposal
      tags: [price]
      parameters:
        - $ref: "#/components/parameters/PriceProfile"
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note]
              properties:
                note: {type: string, minLength: 1, maxLength: 500}
      responses:
        "201":
          description: Đã ghi
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PriceWriteResult"}
        "403": {description: forbidden, $ref: "#/components/responses/Problem"}
        "404": {description: price.proposal_not_found, $ref: "#/components/responses/Problem"}
        "409": {description: price.proposal_decided, $ref: "#/components/responses/Problem"}
        "422": {description: validation_failed, $ref: "#/components/responses/Problem"}
  # --- hết pf/price W11.73 ---
  # --- pf/price W11.72 — xã báo giá + phân công (BRD FN-AD-04.02, FN-AD-04.01; nhóm vùng mục II). Đọc: mọi cấp của Profile; ghi:
  # vai quản trị (Admin). Thay đổi xã/phân công có ngày hiệu lực (vắng → ngày báo giá kế tiếp; không trong quá khứ). ---
  /v1/price/regions:
    get:
      summary: Nhóm vùng tại ngày (mọi trạng thái), kèm số xã báo giá đang hoạt động
      operationId: priceListRegions
      tags: [price]
      parameters:
        - $ref: "#/components/parameters/PriceProfile"
        - $ref: "#/components/parameters/PriceAt"
      responses:
        "200":
          description: Nhóm vùng
          content:
            application/json:
              schema:
                type: object
                required: [regions]
                properties:
                  regions: {type: array, items: {$ref: "#/components/schemas/PriceRegion"}}
        "403": {description: forbidden, $ref: "#/components/responses/Problem"}
    post:
      summary: Thêm nhóm vùng (hiệu lực từ hôm nay; mã vắng → vung_<n>) — vai quản trị
      operationId: priceCreateRegion
      tags: [price]
      parameters:
        - $ref: "#/components/parameters/PriceProfile"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PriceRegionInput"}
      responses:
        "201":
          description: Đã ghi
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PriceWriteResult"}
        "403": {description: forbidden, $ref: "#/components/responses/Problem"}
        "409": {description: conflict (mã đã có), $ref: "#/components/responses/Problem"}
        "422": {description: validation_failed, $ref: "#/components/responses/Problem"}
  /v1/price/regions/{code}/revise:
    post:
      summary: Sửa tên / thứ tự nhóm vùng (hiệu lực từ hôm nay)
      operationId: priceReviseRegion
      tags: [price]
      parameters:
        - $ref: "#/components/parameters/PriceProfile"
        - {name: code, in: path, required: true, schema: {type: string}}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PriceRegionInput"}
      responses:
        "201":
          description: Đã ghi
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PriceWriteResult"}
        "403": {description: forbidden, $ref: "#/components/responses/Problem"}
        "422": {description: validation_failed | price.region_not_found, $ref: "#/components/responses/Problem"}
  /v1/price/regions/{code}/retire:
    post:
      summary: Ngưng nhóm vùng từ hôm nay — chặn khi còn xã báo giá đang hoặc sắp hoạt động thuộc nhóm
      operationId: priceRetireRegion
      tags: [price]
      parameters:
        - $ref: "#/components/parameters/PriceProfile"
        - {name: code, in: path, required: true, schema: {type: string}}
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "201":
          description: Đã ghi
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PriceWriteResult"}
        "403": {description: forbidden, $ref: "#/components/responses/Problem"}
        "409": {description: price.region_in_use, $ref: "#/components/responses/Problem"}
        "422": {description: price.region_not_found, $ref: "#/components/responses/Problem"}
  /v1/price/points:
    get:
      summary: Danh mục xã báo giá tại ngày (B1) — mã, tên, mã ĐVHC, nhóm vùng, cán bộ Xã phụ trách, cán bộ Tỉnh, số mặt hàng, trạng thái
      operationId: priceListPoints
      tags: [price]
      parameters:
        - $ref: "#/components/parameters/PriceProfile"
        - $ref: "#/components/parameters/PriceAt"
        - {name: region, in: query, required: false, schema: {type: string}}
        - {name: state, in: query, required: false, schema: {type: string, enum: [active, pending, retired]}}
        - {name: mine, in: query, required: false, description: "true: Cấp Xã — xã mình phụ trách chính; Cấp Tỉnh — xã được phân công cho mình", schema: {type: boolean}}
      responses:
        "200":
          description: Xã báo giá (sắp theo nhóm vùng, mã)
          content:
            application/json:
              schema:
                type: object
                required: [points]
                properties:
                  points: {type: array, items: {$ref: "#/components/schemas/PricePoint"}}
        "403": {description: forbidden, $ref: "#/components/responses/Problem"}
        "422": {description: validation_failed, $ref: "#/components/responses/Problem"}
    post:
      summary: Thêm xã báo giá (B2) — ĐVHC cấp xã có hiệu lực (tên theo ĐVHC), nhóm vùng, ngày bắt đầu báo giá; mã XBG#### hệ thống sinh
      operationId: priceCreatePoint
      tags: [price]
      parameters:
        - $ref: "#/components/parameters/PriceProfile"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PricePointInput"}
      responses:
        "201":
          description: Đã ghi
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PriceWriteResult"}
        "403": {description: forbidden, $ref: "#/components/responses/Problem"}
        "409": {description: price.admin_unit_taken, $ref: "#/components/responses/Problem"}
        "422": {description: validation_failed | price.admin_unit_invalid | price.region_not_found | price.valid_from, $ref: "#/components/responses/Problem"}
  /v1/price/points/{code}:
    get:
      summary: Một xã báo giá tại ngày kèm lịch sử thay đổi và lịch sử phân công (AC-02)
      operationId: priceGetPoint
      tags: [price]
      parameters:
        - $ref: "#/components/parameters/PriceProfile"
        - {name: code, in: path, required: true, schema: {type: string}}
        - $ref: "#/components/parameters/PriceAt"
      responses:
        "200":
          description: Xã báo giá
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PricePointDetail"}
        "403": {description: forbidden, $ref: "#/components/responses/Problem"}
        "404": {description: price.point_not_found, $ref: "#/components/responses/Problem"}
  /v1/price/points/{code}/revise:
    post:
      summary: Sửa xã báo giá từ ngày hiệu lực — đổi nhóm vùng, chuyển sang mã ĐVHC mới khi sắp xếp ĐVHC (giữ mã xã, lịch sử)
      operationId: priceRevisePoint
      tags: [price]
      parameters:
        - $ref: "#/components/parameters/PriceProfile"
        - {name: code, in: path, required: true, schema: {type: string}}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PricePointInput"}
      responses:
        "201":
          description: Đã ghi
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PriceWriteResult"}
        "403": {description: forbidden, $ref: "#/components/responses/Problem"}
        "404": {description: price.point_not_found, $ref: "#/components/responses/Problem"}
        "409": {description: price.admin_unit_taken, $ref: "#/components/responses/Problem"}
        "422": {description: validation_failed | price.admin_unit_invalid | price.region_not_found | price.point_inactive | price.valid_from, $ref: "#/components/responses/Problem"}
  /v1/price/points/{code}/retire:
    post:
      summary: Ngưng xã báo giá từ ngày hiệu lực, lý do bắt buộc (B3); hôm nay xã đã gửi phiếu → áp dụng từ ngày báo giá kế tiếp
      operationId: priceRetirePoint
      tags: [price]
      parameters:
        - $ref: "#/components/parameters/PriceProfile"
        - {name: code, in: path, required: true, schema: {type: string}}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PricePointInput"}
      responses:
        "201":
          description: Đã ghi
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PriceWriteResult"}
        "403": {description: forbidden, $ref: "#/components/responses/Problem"}
        "404": {description: price.point_not_found, $ref: "#/components/responses/Problem"}
        "422": {description: validation_failed | price.point_inactive | price.valid_from, $ref: "#/components/responses/Problem"}
  /v1/price/points/{code}/officers:
    post:
      summary: Phân công người phụ trách xã từ ngày hiệu lực — role xa (cán bộ Xã phụ trách chính, thay người cũ) | tinh (cán bộ Cấp Tỉnh); officer_ref null = bỏ phân công
      operationId: priceAssignPointOfficer
      tags: [price]
      parameters:
        - $ref: "#/components/parameters/PriceProfile"
        - {name: code, in: path, required: true, schema: {type: string}}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PriceOfficerInput"}
      responses:
        "201":
          description: Đã ghi
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PriceWriteResult"}
        "403": {description: forbidden, $ref: "#/components/responses/Problem"}
        "404": {description: price.point_not_found, $ref: "#/components/responses/Problem"}
        "422": {description: validation_failed | price.officer_invalid | price.point_inactive | price.valid_from, $ref: "#/components/responses/Problem"}
  /v1/price/admin-units:
    get:
      summary: ĐVHC cấp xã có hiệu lực tại ngày (danh mục ĐVHC dùng chung, ADR-0032) để chọn khi thêm/sửa xã báo giá, kèm xã báo giá đang gắn
      operationId: priceListAdminUnits
      tags: [price]
      parameters:
        - $ref: "#/components/parameters/PriceProfile"
        - $ref: "#/components/parameters/PriceAt"
      responses:
        "200":
          description: ĐVHC
          content:
            application/json:
              schema:
                type: object
                required: [admin_units]
                properties:
                  admin_units: {type: array, items: {$ref: "#/components/schemas/PriceAdminUnit"}}
        "403": {description: forbidden, $ref: "#/components/responses/Problem"}
  /v1/price/officers:
    get:
      summary: Danh bạ cán bộ để phân công (cán bộ Cấp Xã / Cấp Tỉnh của phòng ban báo giá) — vai quản trị, Cấp Tỉnh
      operationId: priceListOfficers
      tags: [price]
      parameters:
        - $ref: "#/components/parameters/PriceProfile"
        - {name: level, in: query, required: true, schema: {type: string, enum: [XA, TINH]}}
      responses:
        "200":
          description: Cán bộ (directory = false khi gốc lắp ráp chưa nối danh bạ)
          content:
            application/json:
              schema:
                type: object
                required: [officers, directory]
                properties:
                  officers: {type: array, items: {$ref: "#/components/schemas/PriceOfficer"}}
                  directory: {type: boolean}
        "403": {description: forbidden, $ref: "#/components/responses/Problem"}
        "422": {description: validation_failed, $ref: "#/components/responses/Problem"}
  # --- hết pf/price W11.72 ---
  # --- pf/price W11.75 — phiếu báo giá + xác minh (pf 000148; BRD FN-XA-03.01…03, 03.05, FN-TI-02.02…04, 02.09). Cấp Xã:
  # phiếu của xã mình phụ trách tại ngày, nhập ngày báo giá hôm nay trước giờ khóa (chặn đúng giờ khóa — 409
  # price.ticket_locked); Cấp Tỉnh: xem mọi xã, sửa / nhập thay / xóa / xác minh xã được phân công hoặc chưa phân công; Admin như
  # Cấp Tỉnh mọi xã; Cấp TW không đọc phiếu. Giá, % là chuỗi Decimal. version = phiên bản đầu phiếu (khóa lạc quan, 409
  # price.ticket_stale). ---
  /v1/price/tickets:
    get:
      summary: Phiếu của các xã báo giá trong một ngày (Chi tiết báo giá FN-TI-02.02; Cấp Xã chỉ xã mình) — trạng thái nhìn theo giờ khóa
      operationId: priceListDayTickets
      tags: [price]
      parameters:
        - $ref: "#/components/parameters/PriceProfile"
        - {name: day, in: query, required: false, schema: {type: string, format: date}, description: "Ngày báo giá (vắng → hôm nay)"}
        - {name: region, in: query, required: false, schema: {type: string}}
        - {name: mine, in: query, required: false, schema: {type: boolean}, description: "Cấp Tỉnh: chỉ xã được phân công"}
      responses:
        "200":
          description: Phiếu trong ngày
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PriceTicketDay"}
        "403": {description: forbidden, $ref: "#/components/responses/Problem"}
        "422": {description: validation_failed, $ref: "#/components/responses/Problem"}
  /v1/price/tickets/sheet:
    get:
      summary: Phiếu báo giá của một xã một ngày (màn Nhập báo giá FN-XA-03.01; Sửa phiếu / Nhập thay FN-TI-02.04, 02.09) — mặt hàng của xã, giá tham chiếu (CT-02), ngưỡng, cảnh báo
      operationId: priceGetSheet
      tags: [price]
      parameters:
        - $ref: "#/components/parameters/PriceProfile"
        - {name: point, in: query, required: false, schema: {type: string}, description: "Mã xã báo giá; Cấp Xã phụ trách đúng một xã có thể bỏ trống"}
        - {name: day, in: query, required: false, schema: {type: string, format: date}}
      responses:
        "200":
          description: Phiếu
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PriceSheet"}
        "403": {description: forbidden | price.point_not_assigned, $ref: "#/components/responses/Problem"}
        "404": {description: price.point_not_found, $ref: "#/components/responses/Problem"}
        "422": {description: validation_failed, $ref: "#/components/responses/Problem"}
    post:
      summary: Cán bộ Xã lưu nháp (submit = false) hoặc gửi / gửi lại (submit = true) phiếu ngày báo giá hôm nay, trước giờ khóa — gửi sinh / cập nhật / tự hủy cảnh báo Tạm tính
      operationId: priceSaveSheet
      tags: [price]
      parameters:
        - $ref: "#/components/parameters/PriceProfile"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PriceEntryInput"}
      responses:
        "201":
          description: Phiếu sau khi lưu
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PriceSheet"}
        "403": {description: forbidden | price.point_not_assigned, $ref: "#/components/responses/Problem"}
        "404": {description: price.point_not_found, $ref: "#/components/responses/Problem"}
        "409": {description: price.ticket_locked | price.ticket_stale | price.ticket_exists | price.board_approved | conflict, $ref: "#/components/responses/Problem"}
        "422": {description: validation_failed | price.price_invalid | price.ticket_incomplete | price.not_quote_day | price.point_inactive, $ref: "#/components/responses/Problem"}
  /v1/price/tickets/proxy:
    post:
      summary: Cấp Tỉnh nhập thay phiếu của xã Không nộp (FN-TI-02.09) — sau giờ khóa, lý do bắt buộc; submit = true → Nộp muộn
      operationId: priceSaveProxy
      tags: [price]
      parameters:
        - $ref: "#/components/parameters/PriceProfile"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PriceEntryInput"}
      responses:
        "201":
          description: Phiếu sau khi lưu
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PriceSheet"}
        "403": {description: forbidden | price.point_not_handled, $ref: "#/components/responses/Problem"}
        "404": {description: price.point_not_found, $ref: "#/components/responses/Problem"}
        "409": {description: price.ticket_not_locked | price.ticket_exists | price.ticket_stale | price.board_approved, $ref: "#/components/responses/Problem"}
        "422": {description: validation_failed | price.reason_required | price.price_invalid | price.ticket_incomplete | price.not_quote_day, $ref: "#/components/responses/Problem"}
  /v1/price/tickets/history:
    get:
      summary: Lịch sử báo giá của một xã (FN-XA-03.03) — mỗi ngày báo giá một dòng (Không nộp khi không có phiếu) và phiếu Đã xóa; khoảng ≤ 12 tháng
      operationId: priceTicketHistory
      tags: [price]
      parameters:
        - $ref: "#/components/parameters/PriceProfile"
        - {name: point, in: query, required: false, schema: {type: string}}
        - {name: from, in: query, required: false, schema: {type: string, format: date}, description: "Vắng → 30 ngày trước to"}
        - {name: to, in: query, required: false, schema: {type: string, format: date}, description: "Vắng → hôm nay"}
      responses:
        "200":
          description: Lịch sử
          content:
            application/json:
              schema:
                type: object
                required: [rows]
                properties:
                  rows: {type: array, items: {$ref: "#/components/schemas/PriceHistoryRow"}}
        "403": {description: forbidden, $ref: "#/components/responses/Problem"}
        "422": {description: validation_failed, $ref: "#/components/responses/Problem"}
  /v1/price/tickets/export:
    get:
      summary: Xuất Excel chi tiết báo giá của một ngày theo bộ lọc (FN-TI-02.02 luồng phụ) — Cấp Tỉnh, Admin
      operationId: priceExportTickets
      tags: [price]
      parameters:
        - $ref: "#/components/parameters/PriceProfile"
        - {name: day, in: query, required: false, schema: {type: string, format: date}}
        - {name: region, in: query, required: false, schema: {type: string}}
        - {name: mine, in: query, required: false, schema: {type: boolean}}
      responses:
        "200":
          description: Tệp .xlsx
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: {type: string, format: binary}
        "403": {description: forbidden, $ref: "#/components/responses/Problem"}
  /v1/price/tickets/print:
    get:
      summary: In một hoặc nhiều phiếu (gộp một tệp) theo bố cục File 2 dạng bảng (FN-XA-03.02) — PDF hoặc Excel; giá in là giá Xã gửi kèm chú thích hiệu chỉnh / loại
      operationId: pricePrintTickets
      tags: [price]
      parameters:
        - $ref: "#/components/parameters/PriceProfile"
        - {name: ticket, in: query, required: true, schema: {type: array, items: {type: string, format: uuid}}, style: form, explode: true}
        - {name: format, in: query, required: false, schema: {type: string, enum: [pdf, xlsx]}}
      responses:
        "200":
          description: Tệp PDF hoặc .xlsx
          content:
            application/pdf:
              schema: {type: string, format: binary}
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: {type: string, format: binary}
        "403": {description: forbidden | price.point_not_assigned, $ref: "#/components/responses/Problem"}
        "404": {description: price.ticket_not_found, $ref: "#/components/responses/Problem"}
        "409": {description: conflict (phiếu Không nộp / Đã xóa không in được), $ref: "#/components/responses/Problem"}
        "422": {description: validation_failed, $ref: "#/components/responses/Problem"}
        "503": {description: price.pdf_unavailable, $ref: "#/components/responses/Problem"}
  /v1/price/tickets/{id}:
    get:
      summary: Một phiếu theo mã (kể cả phiếu Đã xóa) — chi tiết phiếu, lịch sử hiệu chỉnh, trao đổi xác minh
      operationId: priceGetTicket
      tags: [price]
      parameters:
        - $ref: "#/components/parameters/PriceProfile"
