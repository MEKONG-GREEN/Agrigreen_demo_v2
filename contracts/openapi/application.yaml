      responses:
        "201": {description: Phiên bản mới, content: {application/json: {schema: {$ref: "#/components/schemas/KhtcCatalogItem"}}}}
        "200": {description: Gửi lặp cùng khóa, content: {application/json: {schema: {$ref: "#/components/schemas/KhtcCatalogItem"}}}}
        "404": {description: extension.khtc_catalog_not_found, $ref: "#/components/responses/Problem"}
        "409": {description: extension.khtc_default_conflict, $ref: "#/components/responses/Problem"}
