      tags: [extension]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - {name: kind, in: path, required: true, schema: {$ref: "#/components/schemas/KhtcCatalogKind"}}
        - {name: code, in: path, required: true, schema: {type: string}}
