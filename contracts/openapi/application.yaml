openapi: 3.1.0
info:
  title: AgriGreen Application API
  version: "1"
  description: |
    Bề mặt Application (api.<domain>) — OIDC + JWT (mục 11).
    Mọi POST bắt buộc Idempotency-Key (R-51). Lỗi theo RFC 9457 (docs/errors.md).
    Tenant lấy từ token, không bao giờ từ path/query/body (R-16).
servers:
  - url: https://api.agrigreen.vn
security:
  - oidc: []
paths:
  /v1/consents:
    post:
      summary: Ghi một bản ghi đồng ý theo mục đích (sổ chỉ ghi thêm)
      operationId: recordConsent
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ConsentInput"}
      responses:
        "201":
          description: Đã ghi. Gọi lặp cùng khóa trả lại đúng phản hồi này, kèm header Idempotent-Replayed.
          headers:
            Location: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Consent"}
        "400": {$ref: "#/components/responses/Problem"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
    get:
      summary: Lịch sử đồng ý của một chủ thể (phân trang cursor, R-53)
      operationId: listConsents
      parameters:
        - {name: subject_ref, in: query, required: true, schema: {type: string, format: uuid}}
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        "200":
          description: Một trang
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/Consent"}}
                  next_cursor: {type: [string, "null"]}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/consents/{id}:
    get:
      operationId: getConsent
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Bản ghi
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Consent"}
        "404": {$ref: "#/components/responses/Problem"}
  # --- pf/masterdata (chỉ đọc; ghi qua Admin API — contracts/openapi/admin.yaml) ---

  # Dữ liệu chủ là dữ liệu tham chiếu của tenant: mọi người gọi đã xác thực đều đọc được.
  /v1/masterdata/admin-units:
    get:
      summary: Đơn vị con trực tiếp có hiệu lực tại thời điểm at (parent bỏ trống → các tỉnh)
      operationId: listAdminUnits
      tags: [masterdata]
      parameters:
        - {name: parent, in: query, schema: {type: string}}
        - $ref: "#/components/parameters/At"
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        "200":
          description: Một trang, theo mã
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/AdminUnit"}}
                  next_cursor: {type: [string, "null"]}
        "404": {description: masterdata.admin_unit_not_found, $ref: "#/components/responses/Problem"}
  /v1/masterdata/admin-units/{code}:
    get:
      summary: Đơn vị có hiệu lực tại at (cùng một mã có thể là đơn vị khác nhau ở hai thời điểm)
      operationId: getAdminUnit
      tags: [masterdata]
      parameters:
        - $ref: "#/components/parameters/UnitCode"
        - $ref: "#/components/parameters/At"
      responses:
        "200":
          description: Đơn vị
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AdminUnit"}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/masterdata/admin-units/{code}/tree:
    get:
      summary: Cây đơn vị (chính nó và mọi đơn vị con cháu) có hiệu lực tại at
      operationId: getAdminUnitTree
      tags: [masterdata]
      parameters:
        - $ref: "#/components/parameters/UnitCode"
        - $ref: "#/components/parameters/At"
      responses:
        "200":
          description: Cây
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AdminUnitNode"}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/masterdata/admin-units/{code}/current:
    get:
      summary: Mã hiện hành (tại at) của một mã có thể đã cũ — đi theo chuỗi sáp nhập/chia tách
      operationId: currentAdminUnitCodes
      tags: [masterdata]
      parameters:
        - $ref: "#/components/parameters/UnitCode"
        - $ref: "#/components/parameters/At"
      responses:
        "200":
          description: Mã hiện hành
          content:
            application/json:
              schema:
                type: object
                required: [code, at, current_codes]
                properties:
                  code: {type: string}
                  at: {type: string, format: date-time}
                  current_codes: {type: array, items: {type: string}}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/masterdata/catalogs/{catalog}:
    get:
      summary: Danh sách mục của một danh mục (mặc định chỉ mục đang dùng)
      operationId: listCatalog
      tags: [masterdata]
      parameters:
        - $ref: "#/components/parameters/Catalog"
        - {name: include_inactive, in: query, schema: {type: boolean, default: false}}
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        "200":
          description: Một trang, theo mã
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/CatalogItem"}}
                  next_cursor: {type: [string, "null"]}
        "404": {description: masterdata.catalog_not_found, $ref: "#/components/responses/Problem"}
  /v1/masterdata/catalogs/{catalog}/{code}:
    get:
      summary: Một mục danh mục (kể cả đã ngừng dùng)
      operationId: getCatalogItem
      tags: [masterdata]
      parameters:
        - $ref: "#/components/parameters/Catalog"
        - {name: code, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: Mục
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CatalogItem"}
        "404": {description: masterdata.catalog_item_not_found, $ref: "#/components/responses/Problem"}
  /v1/masterdata/params/value:
    get:
      summary: Giá trị tham số ĐÃ PHÊ DUYỆT có hiệu lực tại thời điểm của sự việc (CGH QT-01, AC-02)
      operationId: getParamValue
      tags: [masterdata]
      parameters:
        - {name: key, in: query, required: true, schema: {type: string}, examples: {norm: {value: "cgh.norm_ha_per_machine:MGD:thu_hoach"}}}
        - $ref: "#/components/parameters/At"
      responses:
        "200":
          description: Giá trị
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ParamValue"}
        "404": {description: masterdata.param_not_found, $ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/orgs:
    get:
      summary: Tổ chức trong phạm vi của người gọi (phân trang cursor)
      operationId: listOrgs
      parameters:
        - {name: kind, in: query, schema: {$ref: "#/components/schemas/OrgKind"}}
        - {name: include_inactive, in: query, schema: {type: boolean, default: false}}
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        "200":
          description: Một trang
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/Org"}}
                  next_cursor: {type: [string, "null"]}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/cooperatives:
    get:
      summary: HTX/THT trong phạm vi, tìm theo tên, Mã HTX hoặc mã số thuế
      operationId: listCooperatives
      parameters:
        - {name: q, in: query, schema: {type: string}}
        - {name: include_inactive, in: query, schema: {type: boolean, default: false}}
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        "200":
          description: Một trang
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/Cooperative"}}
                  next_cursor: {type: [string, "null"]}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/cooperatives/{ref}:
    get:
      summary: Hồ sơ HTX (ngoài phạm vi → 404)
      operationId: getCooperative
      parameters:
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Hồ sơ
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Cooperative"}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/cooperatives/{ref}/households:
    get:
      summary: Nông hộ thành viên của HTX, kèm nhãn hiển thị đã che (không bao giờ có định danh đầy đủ)
      operationId: listCooperativeHouseholds
      parameters:
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        "200":
          description: Một trang
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/HouseholdListItem"}}
                  next_cursor: {type: [string, "null"]}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/households:
    post:
      summary: Tạo nông hộ — định danh chủ hộ đi thẳng vào kho định danh; trùng SĐT/CCCD → dùng lại mã cũ, báo "trùng"
      operationId: createHousehold
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/HouseholdInput"}
      responses:
        "201":
          description: Đã tạo
          content:
            application/json:
              schema: {$ref: "#/components/schemas/HouseholdCreated"}
        "200":
          description: Trùng chủ hộ đã có (duplicate = true, duplicate_label = "trùng")
          content:
            application/json:
              schema: {$ref: "#/components/schemas/HouseholdCreated"}
        "403": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
  # --- pf/sync --- (docs/dev/sync-contract.md)
  /v1/devices:
    post:
      summary: Đăng ký thiết bị hiện trường cho người gọi (actor_ref, org_ref lấy từ token)
      operationId: registerDevice
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SyncDeviceInput"}
      responses:
        "201":
          description: Đã đăng ký
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SyncDevice"}
        "200":
          description: Cùng người đăng ký lại cùng mã (cài lại, nâng cấp app) — cập nhật app_version
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SyncDevice"}
        "403": {description: "sync.device_revoked — mã đã bị thu hồi; máy xóa dữ liệu và sinh mã mới", $ref: "#/components/responses/Problem"}
        "409": {description: "sync.device_taken", $ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/sync/pull:
    get:
      summary: Thay đổi chiều xuống theo phạm vi phân công (cursor mờ có chữ ký, round-robin giữa các entity)
      operationId: syncPull
      parameters:
        - $ref: "#/components/parameters/DeviceID"
        - {name: cursor, in: query, description: "next_cursor của trang trước; bỏ trống = từ đầu", schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 1000, default: 500}}
      responses:
        "200":
          description: Một trang
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SyncPullPage"}
        "400": {description: "sync.cursor_invalid — con trỏ bị sửa hoặc của thiết bị khác; pull lại từ đầu", $ref: "#/components/responses/Problem"}
        "403": {description: "sync.device_unregistered | sync.device_revoked", $ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/sync/push:
    post:
      summary: Gửi một lô bản ghi chỉ ghi thêm; kết quả theo từng bản ghi
      operationId: syncPush
      parameters:
        - {$ref: "#/components/parameters/IdempotencyKey", description: "Mã lô do máy sinh"}
        - $ref: "#/components/parameters/DeviceID"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SyncPushBatch"}
      responses:
        "200":
          description: Kết quả theo thứ tự bản ghi gửi lên. Gọi lặp cùng Idempotency-Key trả đúng phản hồi này.
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results: {type: array, items: {$ref: "#/components/schemas/SyncPushResult"}}
        "403": {description: "sync.device_unregistered | sync.device_revoked", $ref: "#/components/responses/Problem"}
        "422": {description: "device_id khác header, quá 500 bản ghi", $ref: "#/components/responses/Problem"}
  /v1/files:
    post:
      summary: Tải tệp minh chứng đã mã hóa phong bì (chỉ bản mã, ≤ 15 MB)
      operationId: uploadFile
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/DeviceID"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [meta, blob]
              properties:
                meta: {$ref: "#/components/schemas/SyncEnvelopeMeta"}
                blob: {type: string, format: binary, description: "Bản mã AES-256-GCM ‖ tag; SHA-256 phải bằng meta.sha256_ciphertext"}
                file_ref: {type: string, format: uuid, description: "Tùy chọn: UUIDv7 máy sinh để bản ghi evidence ngoại tuyến tham chiếu trước khi tải"}
            encoding:
              meta: {contentType: application/json}
      responses:
        "201":
          description: Đã lưu
          headers:
            Location: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SyncFileCreated"}
        "200":
          description: Cùng file_ref, cùng bản mã đã có
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SyncFileCreated"}
        "403": {description: "sync.device_unregistered | sync.device_revoked", $ref: "#/components/responses/Problem"}
        "409": {description: "sync.file_ref_taken", $ref: "#/components/responses/Problem"}
        "413": {$ref: "#/components/responses/Problem"}
        "422": {description: "validation_failed | sync.file_checksum_mismatch", $ref: "#/components/responses/Problem"}
        "503": {description: "sync.dependency_unavailable — chưa cấu hình kho đối tượng", $ref: "#/components/responses/Problem"}
  /v1/files/{ref}:
    get:
      summary: Siêu dữ liệu tệp + URL tải BẢN MÃ có hạn 5 phút (vai vault_evidence_viewer, có mục đích)
      operationId: getFile
      parameters:
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/Purpose"
      responses:
        "200":
          description: Siêu dữ liệu (gps, captured_at là dữ liệu cá nhân — không lưu đệm)
          content:
            application/json:
              schema:
                type: object
                required: [file, download_url, expires_at]
                properties:
                  file: {$ref: "#/components/schemas/SyncFile"}
                  download_url: {type: string, format: uri}
                  expires_at: {type: string, format: date-time}
        "400": {description: "sync.purpose_required", $ref: "#/components/responses/Problem"}
        "403": {description: "forbidden | sync.purpose_not_allowed | sync.consent_missing", $ref: "#/components/responses/Problem"}
        "404": {description: "sync.file_not_found", $ref: "#/components/responses/Problem"}
  /v1/files/{ref}/content:
    get:
      summary: Nội dung đã giải mã để hiển thị — kho định danh mở DEK theo mục đích; bản rõ chỉ trong bộ nhớ request
      operationId: getFileContent
      parameters:
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/Purpose"
      responses:
        "200":
          description: Bản rõ, Content-Type = content_type của tệp, Cache-Control no-store
          content:
            "*/*":
              schema: {type: string, format: binary}
        "400": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "410": {description: "vault.erased — hộ đã xóa định danh, tệp không còn mở được", $ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
components:
  securitySchemes:
    oidc:
      type: openIdConnect
      openIdConnectUrl: https://auth.agrigreen.vn/realms/agrigreen/.well-known/openid-configuration
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, pattern: "^[A-Za-z0-9._:-]{8,200}$"}
    At:
      name: at
      in: query
      description: Thời điểm tra (RFC 3339, hoặc YYYY-MM-DD = 00:00 giờ Việt Nam). Mặc định là hiện tại.
      schema: {type: string}
    UnitCode:
      name: code
      in: path
      required: true
      schema: {type: string, pattern: "^[0-9A-Z][0-9A-Z.-]{0,39}$"}
    Catalog:
      name: catalog
      in: path
      required: true
      schema: {type: string, enum: [rice_variety, farm_stage, machine_type, season, pest]}
    DeviceID:
      name: X-Device-Id
      in: header
      required: true
      description: Mã thiết bị đã đăng ký bởi chính người gọi (pf/sync)
      schema: {type: string, format: uuid}
    Purpose:
      name: X-Purpose
      in: header
      required: true
      description: Mục đích xử lý dữ liệu cá nhân (R-42)
      schema: {type: string, enum: [mrv.evidence, extension.field_support]}
  responses:
    Problem:
      description: RFC 9457
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
  schemas:
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: {type: string, format: uri}
        title: {type: string}
        status: {type: integer}
        code: {type: string}
        detail: {type: string}
        instance: {type: string}
        trace_id: {type: string}
        errors:
          type: array
          items:
            type: object
            properties:
              field: {type: string}
              reason: {type: string}
    ConsentInput:
      type: object
      required: [subject_ref, purpose, text_version, status, channel, event_time]
      properties:
        id: {type: string, format: uuid, description: "UUIDv7 sinh trên thiết bị khi ngoại tuyến (R-11). Bỏ trống → server sinh."}
        subject_ref: {type: string, format: uuid, description: "Mã tham chiếu chủ thể — không phải định danh (R-41)"}
        purpose: {type: string, pattern: "^[a-z][a-z0-9_.]{2,63}$", examples: ["mrv.evidence"]}
        text_version: {type: string, maxLength: 40}
        status: {type: string, enum: [granted, withdrawn]}
        channel: {type: string, enum: [field_app, web, zalo, paper]}
        event_time: {type: string, format: date-time, description: "Lúc xảy ra tại hiện trường (R-13)"}
        device_id: {type: string}
    Consent:
      allOf:
        - $ref: "#/components/schemas/ConsentInput"
        - type: object
          required: [id, recorded_at, seq]
          properties:
            recorded_at: {type: string, format: date-time}
            seq: {type: integer, description: "Thứ tự trong chuỗi băm của chủ thể"}
    AdminUnit:
      type: object
      required: [code, name, level, parent_code, valid_from, valid_to, successor_codes]
      properties:
        code: {type: string}
        name: {type: string}
        level: {type: string, enum: [province, commune, district], description: "district chỉ có trong dữ liệu trước 01/07/2025"}
        parent_code: {type: [string, "null"]}
        valid_from: {type: string, format: date}
        valid_to: {type: [string, "null"], format: date, description: "Không bao gồm; null = còn hiệu lực"}
        successor_codes: {type: array, items: {type: string}}
    AdminUnitNode:
      allOf:
        - $ref: "#/components/schemas/AdminUnit"
        - type: object
          required: [children]
          properties:
            children: {type: array, items: {$ref: "#/components/schemas/AdminUnitNode"}}
    CatalogItem:
      type: object
      required: [catalog, code, name, attrs, active, deactivation_reason, revision, updated_at]
      properties:
        catalog: {type: string}
        code: {type: string}
        name: {type: string}
        attrs: {type: object, additionalProperties: {type: string}, description: "Số (vd expected_yield_t_per_ha) là chuỗi decimal"}
        active: {type: boolean}
        deactivation_reason: {type: [string, "null"]}
        revision: {type: integer}
        updated_at: {type: string, format: date-time}
    ParamValue:
      type: object
      required: [key, value, text, unit, version, effective_from, source_doc, approved_at, param_version_id, supersedes_id, seq]
      properties:
        key: {type: string}
        value: {type: [string, "null"], description: "Số thập phân dạng chuỗi (R-10)"}
        text: {type: [string, "null"]}
        unit: {type: string}
        version: {type: integer}
        effective_from: {type: string, format: date-time}
        source_doc: {type: string}
        approved_at: {type: string, format: date-time}
        param_version_id: {type: string, format: uuid}
        supersedes_id: {type: [string, "null"], format: uuid}
        seq: {type: integer}
    OrgKind:
      type: string
      enum: [ttkn_national, ttkn_province, extension_team, dcrd, cooperative, mkg, partner]
    Org:
      type: object
      required: [ref, kind, code, name, admin_unit_code, parent_ref, representative_ref, active]
      properties:
        ref: {type: string, format: uuid}
        kind: {$ref: "#/components/schemas/OrgKind"}
        code: {type: string, description: "Mã đơn vị; với HTX là Mã HTX do hệ thống tự sinh (CGH BR-01)"}
        name: {type: string}
        admin_unit_code: {type: [string, "null"], description: "Mã tỉnh/xã hiện hành; null với cấp quốc gia"}
        parent_ref: {type: [string, "null"], format: uuid}
        representative_ref: {type: [string, "null"], format: uuid, description: "Mã tham chiếu người đại diện trong kho định danh"}
        active: {type: boolean}
    Decimal:
      type: string
      pattern: "^-?[0-9]+(\\.[0-9]+)?$"
      description: Số thập phân dạng chuỗi (không float)
    Point:
      type: object
      required: [lat, lon]
      properties:
        lat: {$ref: "#/components/schemas/Decimal"}
        lon: {$ref: "#/components/schemas/Decimal"}
    Cooperative:
      allOf:
        - $ref: "#/components/schemas/Org"
        - type: object
          required: [status_reason, tax_code, area_ha, established_on, location, location_provisional]
          properties:
            status_reason: {type: [string, "null"], description: "Lý do vô hiệu hóa hiện tại"}
            tax_code: {type: [string, "null"], pattern: "^[0-9]{10}(-[0-9]{3})?$"}
            area_ha: {oneOf: [{$ref: "#/components/schemas/Decimal"}, {type: "null"}], description: "Diện tích đăng ký hành chính (ha)"}
            established_on: {type: [string, "null"], format: date}
            location: {oneOf: [{$ref: "#/components/schemas/Point"}, {type: "null"}]}
            location_provisional: {type: boolean, description: "true = chưa có toạ độ; bản đồ hiển thị tâm xã, nhãn \"vị trí tạm\""}
    Household:
      type: object
      required: [household_ref, cooperative_ref, commune_code, cultivated_area_ha, member_since, active]
      properties:
        household_ref: {type: string, format: uuid, description: "Mã tham chiếu trong kho định danh (R-41)"}
        cooperative_ref: {type: [string, "null"], format: uuid}
        commune_code: {type: string}
        cultivated_area_ha: {oneOf: [{$ref: "#/components/schemas/Decimal"}, {type: "null"}]}
        member_since: {type: [string, "null"], format: date}
        active: {type: boolean}
    HouseholdListItem:
      allOf:
        - $ref: "#/components/schemas/Household"
        - type: object
          required: [label, masked_phone, label_unavailable]
          properties:
            label: {type: string, description: "Nhãn đã che, vd \"Nguyễn V. A.\""}
            masked_phone: {type: string, description: "SĐT đã che"}
            label_unavailable: {type: boolean}
    HouseholdInput:
      type: object
      required: [cooperative_ref, identity]
      properties:
        cooperative_ref: {type: string, format: uuid}
        commune_code: {type: string, description: "Bỏ trống = xã của HTX"}
        cultivated_area_ha: {$ref: "#/components/schemas/Decimal"}
        member_since: {type: string, format: date}
        identity:
          type: object
          description: Chỉ chuyển vào kho định danh (mục đích registry.admin), không lưu ở pf_party
          required: [full_name, phone]
          properties:
            full_name: {type: string}
            phone: {type: string}
            national_id: {type: string}
            address: {type: string}
    HouseholdCreated:
      type: object
      required: [household, duplicate]
      properties:
        household: {$ref: "#/components/schemas/Household"}
        duplicate: {type: boolean}
        duplicate_label: {type: string, enum: ["trùng"]}
    # --- pf/sync ---
    SyncDeviceInput:
      type: object
      required: [device_id, platform, app_version]
      properties:
        device_id: {type: string, format: uuid, description: "UUIDv7 sinh trên máy"}
        platform: {type: string, enum: [android, ios]}
        app_version: {type: string, pattern: "^[0-9A-Za-z.+_-]{1,40}$"}
    SyncDevice:
      type: object
      required: [device_id, registered_at, platform, app_version, revoked]
      properties:
        device_id: {type: string, format: uuid}
        registered_at: {type: string, format: date-time}
        platform: {type: string}
        app_version: {type: string}
        revoked: {type: boolean}
    SyncChange:
      type: object
      required: [entity, id, version, op]
      properties:
        entity: {type: string, examples: [plot, task, directive, document, pubkey]}
        id: {type: string, format: uuid, description: "pubkey + id 00000000-0000-0000-0000-000000000000 + tombstone = kết thúc lượt khóa: xóa mọi pubkey có version nhỏ hơn"}
        version: {type: integer}
        op: {type: string, enum: [upsert, tombstone]}
        data: {type: object, description: "Không có khi tombstone. pubkey: {ref, area_code, public_key (base64 32 byte)}"}
    SyncPullPage:
      type: object
      required: [changes, next_cursor, has_more, server_time, reset]
      properties:
        changes: {type: array, items: {$ref: "#/components/schemas/SyncChange"}}
        next_cursor: {type: string, description: "Mờ, có chữ ký HMAC, gắn với tenant + thiết bị + phạm vi"}
        has_more: {type: boolean}
        server_time: {type: string, format: date-time}
        reset: {type: boolean, description: "true = phạm vi đã đổi; pull bắt đầu lại từ đầu, máy thay toàn bộ dữ liệu tham chiếu"}
    SyncPushRecord:
      type: object
      required: [id, idem_key, entity, op, event_time, payload]
      properties:
        id: {type: string, format: uuid, description: "UUIDv7 sinh trên máy"}
        idem_key: {type: string, pattern: "^dev:[0-9a-fA-F-]{36}:[1-9][0-9]{0,18}$", description: "dev:<device_id của chính máy gửi>:<seq>"}
        entity: {type: string, examples: [plot_boundary, field_report, task_update, consent, evidence]}
        op: {type: string, enum: [create, correct]}
        event_time: {type: string, format: date-time, description: "Có múi giờ; không vượt quá giờ máy chủ + 5 phút"}
        supersedes_id: {type: [string, "null"], format: uuid, description: "Bắt buộc khi op = correct"}
        correction_reason: {type: [string, "null"], minLength: 10, maxLength: 500, description: "Bắt buộc khi op = correct"}
        payload: {type: object, description: "Tối đa 256 KiB; máy chủ pf/sync chỉ lưu SHA-256"}
    SyncPushBatch:
      type: object
      required: [device_id, records]
      properties:
        device_id: {type: string, format: uuid, description: "Phải trùng header X-Device-Id"}
        records: {type: array, maxItems: 500, items: {$ref: "#/components/schemas/SyncPushRecord"}}
    SyncPushResult:
      type: object
      required: [id, status]
      properties:
        id: {type: string, description: "id máy gửi, nguyên văn (kể cả khi sai dạng)"}
        status: {type: string, enum: [accepted, duplicate, conflict, rejected]}
        conflict_id: {type: string, format: uuid}
        code: {type: string, description: "Khi rejected: validation_failed | sync.unknown_entity | sync.sink_failed (máy tự gửi lại, không bắt người dùng sửa) | mã của module nhận"}
        errors:
          type: array
          items:
            type: object
            properties:
              field: {type: string}
              reason: {type: string}
    SyncEnvelopeMeta:
      type: object
      description: docs/dev/envelope-format.md, phiên bản 1
      required: [v, alg, subject_ref, nonce, wrapped_dek, sha256_ciphertext, content_type]
      properties:
        v: {type: integer, enum: [1]}
        alg: {type: string, enum: ["A256GCM+X25519-SEALEDBOX"]}
        subject_ref: {type: string, format: uuid}
        nonce: {type: string, contentEncoding: base64, description: "12 byte"}
        wrapped_dek: {type: string, contentEncoding: base64, description: "80 byte (crypto_box_seal)"}
        sha256_ciphertext: {type: string, pattern: "^[0-9a-f]{64}$"}
        content_type: {type: string, enum: [image/jpeg, image/png, image/webp, image/heic, application/pdf, video/mp4]}
        captured_at: {type: string, format: date-time}
        gps:
          type: object
          required: [lat, lon]
          properties:
            lat: {type: number, minimum: -90, maximum: 90}
            lon: {type: number, minimum: -180, maximum: 180}
            accuracy_m: {type: number, minimum: 0}
    SyncFileCreated:
      type: object
      required: [file_ref, sha256_ciphertext, size]
      properties:
        file_ref: {type: string, format: uuid}
        sha256_ciphertext: {type: string}
        size: {type: integer}
    SyncFile:
      type: object
      required: [file_ref, subject_ref, v, alg, nonce, wrapped_dek, sha256_ciphertext, size, content_type, captured_at, gps, created_at]
      properties:
        file_ref: {type: string, format: uuid}
        subject_ref: {type: string, format: uuid}
        v: {type: integer}
        alg: {type: string}
        nonce: {type: string, contentEncoding: base64}
        wrapped_dek: {type: string, contentEncoding: base64}
        sha256_ciphertext: {type: string}
        size: {type: integer}
        content_type: {type: string}
        captured_at: {type: [string, "null"], format: date-time}
        gps:
          oneOf:
            - type: "null"
            - type: object
              properties:
                lat: {type: number}
                lon: {type: number}
                accuracy_m: {type: number}
        created_at: {type: string, format: date-time}
