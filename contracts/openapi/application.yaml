        "200": {description: Gửi lặp cùng khóa, content: {application/json: {schema: {$ref: "#/components/schemas/KhtcCatalogItem"}}}}
        "409": {description: "extension.khtc_catalog_exists | extension.khtc_default_conflict", $ref: "#/components/responses/Problem"}
