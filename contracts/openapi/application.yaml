            schema: {$ref: "#/components/schemas/KhtcProgramInput"}
      responses:
        "201": {description: Phiên bản 1, content: {application/json: {schema: {$ref: "#/components/schemas/KhtcProgram"}}}}
        "200": {description: Gửi lặp cùng khóa, content: {application/json: {schema: {$ref: "#/components/schemas/KhtcProgram"}}}}
        "409": {description: extension.khtc_program_exists, $ref: "#/components/responses/Problem"}
  /v1/kn/khtc/programs/{ref}/revise:
    post:
      summary: "Sửa / ngừng (active=false) CT/DA — phiên bản mới"
      operationId: knKhtcReviseProgram
      tags: [extension]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/KhtcProgramInput"}
      responses:
        "201": {description: Phiên bản mới, content: {application/json: {schema: {$ref: "#/components/schemas/KhtcProgram"}}}}
        "200": {description: Gửi lặp cùng khóa, content: {application/json: {schema: {$ref: "#/components/schemas/KhtcProgram"}}}}
        "404": {description: extension.khtc_program_not_found, $ref: "#/components/responses/Problem"}
        "409": {description: extension.khtc_program_exists, $ref: "#/components/responses/Problem"}
  /v1/kn/khtc/programs/{ref}/history:
    get:
      summary: Mọi phiên bản của CT/DA, mới nhất trước
      operationId: knKhtcProgramHistory
      tags: [extension]
      parameters:
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Lịch sử
          content:
            application/json:
              schema: {type: object, required: [items], properties: {items: {type: array, items: {$ref: "#/components/schemas/KhtcProgram"}}}}
        "404": {description: extension.khtc_program_not_found, $ref: "#/components/responses/Problem"}
  /v1/kn/khtc/plans/{year}:
    get:
      summary: "FN-TI-02.02: một phiên bản Kế hoạch năm (6 tab) — ?version=n, ?at=ngày (BR-DL-13), mặc định mới nhất"
      operationId: knKhtcGetPlan
      tags: [extension]
      parameters:
        - {name: year, in: path, required: true, schema: {type: integer, minimum: 2000, maximum: 2100}}
        - {name: version, in: query, schema: {type: integer, minimum: 1}}
        - {name: at, in: query, schema: {type: string, format: date}}
      responses:
        "200": {description: Kế hoạch, content: {application/json: {schema: {$ref: "#/components/schemas/KhtcPlan"}}}}
        "404": {description: extension.khtc_plan_not_found, $ref: "#/components/responses/Problem"}
  /v1/kn/khtc/plans/{year}/versions:
    get:
      summary: Lịch sử phiên bản kế hoạch năm (cũ trước)
      operationId: knKhtcPlanVersions
      tags: [extension]
      parameters:
        - {name: year, in: path, required: true, schema: {type: integer, minimum: 2000, maximum: 2100}}
      responses:
        "200":
          description: Phiên bản
          content:
            application/json:
              schema: {type: object, required: [items], properties: {items: {type: array, items: {$ref: "#/components/schemas/KhtcPlanVersion"}}}}
    post:
      summary: "Lưu kế hoạch năm: phiên bản 1 (lập) hoặc Điều chỉnh theo QĐ (≥ 2, bắt buộc số, ngày QĐ, ngày hiệu lực) — cả cây"
      operationId: knKhtcSavePlan
      tags: [extension]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - {name: year, in: path, required: true, schema: {type: integer, minimum: 2000, maximum: 2100}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/KhtcPlanSave"}
      responses:
        "201": {description: Phiên bản mới, content: {application/json: {schema: {$ref: "#/components/schemas/KhtcPlan"}}}}
        "200": {description: Gửi lặp cùng khóa, content: {application/json: {schema: {$ref: "#/components/schemas/KhtcPlan"}}}}
        "409": {description: "extension.khtc_plan_version_conflict | extension.khtc_entry_in_use", $ref: "#/components/responses/Problem"}
        "422": {description: "extension.khtc_plan_invalid | extension.khtc_effective_date_invalid", $ref: "#/components/responses/Problem"}
  /v1/kn/khtc/plans/{year}/copy-draft:
    get:
      summary: "Sao chép từ năm trước: bản nháp (không ghi) từ phiên bản mới nhất năm N−1, chỉ nội dung còn theo dõi"
      operationId: knKhtcCopyDraft
      tags: [extension]
      parameters:
        - {name: year, in: path, required: true, schema: {type: integer, minimum: 2000, maximum: 2100}}
      responses:
        "200": {description: Bản nháp, content: {application/json: {schema: {$ref: "#/components/schemas/KhtcPlanDraft"}}}}
        "404": {description: extension.khtc_plan_not_found, $ref: "#/components/responses/Problem"}
  /v1/kn/khtc/plans/{year}/export:
    get:
      summary: "Xuất Excel một phiên bản kế hoạch năm (cả 6 tab; bố cục nhập lại được)"
      operationId: knKhtcExportPlan
      tags: [extension]
      parameters:
        - {name: year, in: path, required: true, schema: {type: integer, minimum: 2000, maximum: 2100}}
        - {name: version, in: query, schema: {type: integer, minimum: 1}}
      responses:
        "200":
          description: Tệp .xlsx
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet: {schema: {type: string, format: binary}}
        "404": {description: extension.khtc_plan_not_found, $ref: "#/components/responses/Problem"}
  /v1/kn/khtc/plans/{year}/import-draft:
    post:
      summary: "Nhập Excel/CSV (bố cục của tệp xuất) thành bản nháp — không ghi; lỗi theo dòng"
      operationId: knKhtcImportDraft
      tags: [extension]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - {name: year, in: path, required: true, schema: {type: integer, minimum: 2000, maximum: 2100}}
      requestBody:
        required: true
        content:
          application/vnd.openxmlformats-officedocument.spreadsheetml.sheet: {schema: {type: string, format: binary}}
          text/csv: {schema: {type: string, format: binary}}
      responses:
        "200": {description: Bản nháp, content: {application/json: {schema: {$ref: "#/components/schemas/KhtcPlanDraft"}}}}
        "422": {description: extension.khtc_import_invalid, $ref: "#/components/responses/Problem"}
components:
  securitySchemes:
    oidc:
      type: openIdConnect
      openIdConnectUrl: https://auth.agrigreen.vn/realms/agrigreen/.well-known/openid-configuration
  parameters:
    PartnerGrantor:
      name: grantor
      in: query
      description: |
        Tenant BÊN CẤP (ADR-0020) — không phải tenant người gọi (tenant người gọi luôn lấy từ token, R-16). Vắng mặt → chỉ nhận
        khi đúng một bên cấp có loại dữ liệu này (nhiều bên cấp → 422 party.share_grantor_ambiguous).
      schema: {type: string, format: uuid}
    FormsProfile:
      name: profile
      in: query
      required: true
      description: Bên dùng của cap/forms (cấu hình gốc lắp ráp; KN = kn)
      schema: {type: string, pattern: "^[a-z][a-z0-9_]{0,39}$"}
    HrmKind:
      name: kind
      in: path
      required: true
      description: Loại danh mục nhân sự (pf/hrm, FN-19)
      schema:
        type: string
        enum: [position, grade, education_level, major, major_group, ethnicity, religion, political_theory, state_mgmt,
          foreign_language, language_level, it_level, award_form, discipline_form, change_type, leave_reason]
    HrmRuleKey:
      name: key
      in: path
      required: true
      description: Khóa tham số có phiên bản (pf/hrm) — promotion (quy tắc nâng bậc), achievement_conversion (quy đổi thành tích)
      schema: {type: string, enum: [promotion, achievement_conversion]}
    HrmAt:
      name: at
      in: query
      required: false
      description: Ngày chốt YYYY-MM-DD (vắng → hôm nay, giờ VN) — truy vấn as-of
      schema: {type: string, format: date}
    HrmStaffId:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
    HrmEventId:
      name: event
      in: path
      required: true
      schema: {type: string, format: uuid}
    PriceBoardDay:
      name: day
      in: path
      required: true
      schema: {type: string, format: date}
      description: Ngày báo giá (giờ VN)
    PriceProfile:
      name: profile
      in: query
      required: false
      description: Bên dùng của cap/price (cấu hình gốc lắp ráp; KN = kn). Vắng → profile đầu tiên.
      schema: {type: string, pattern: "^[a-z][a-z0-9_]{0,39}$"}
    PriceAt:
      name: at
      in: query
      required: false
      description: Ngày báo giá YYYY-MM-DD (vắng → hôm nay, giờ VN)
      schema: {type: string, format: date}
    PriceItemCode:
      name: code
      in: path
      required: true
      description: Mã mặt hàng (MH + 5 chữ số)
      schema: {type: string, pattern: "^MH[0-9]{5}$"}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, pattern: "^[A-Za-z0-9._:-]{8,200}$"}
    At:
      name: at
      in: query
      description: Thời điểm tra (RFC 3339, hoặc YYYY-MM-DD = 00:00 giờ Việt Nam). Mặc định là hiện tại.
      schema: {type: string}
    UnitCode:
      name: code
      in: path
      required: true
      schema: {type: string, pattern: "^[0-9A-Z][0-9A-Z.-]{0,39}$"}
    Catalog:
      name: catalog
      in: path
      required: true
      schema: {type: string, enum: [rice_variety, farm_stage, machine_type, season, pest, vessel_class, crop, material, production_model, report_type, cnts_species, cnts_breed, cnts_vaccine, cnts_vaccination_schedule, cnts_disease, cnts_chemical, cnts_slaughter_facility, cnts_aquaculture_object, cnts_fishing_group, cnts_indicator, cnts_model_type, cnts_document_type]}
    DeviceID:
      name: X-Device-Id
      in: header
      required: true
      description: Mã thiết bị đã đăng ký bởi chính người gọi (pf/sync)
      schema: {type: string, format: uuid}
    Purpose:
      name: X-Purpose
      in: header
      required: true
      description: Mục đích xử lý dữ liệu cá nhân (R-42)
      schema: {type: string, enum: [mrv.evidence, extension.field_support]}
  responses:
    HrmEventWritten:
      description: Đã ghi dòng quá trình
      content:
        application/json:
          schema:
            type: object
            required: [id, version]
            properties:
              id: {type: string, format: uuid}
              version: {type: integer}
    Problem:
      description: RFC 9457
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    GeoCoopWritten:
      description: Ranh giới HTX sau khi ghi và dòng sổ vừa ghi (gọi lặp cùng Idempotency-Key → phản hồi như lần đầu)
      headers:
        Location: {schema: {type: string}}
      content:
        application/json:
          schema:
            type: object
            required: [cooperative, boundary]
            properties:
              cooperative: {$ref: "#/components/schemas/GeoCoopFeature"}
              boundary: {$ref: "#/components/schemas/GeoCoopBoundaryVersion"}
    ExtTaskWritten:
      description: Sự việc đã ghi (pf/extension)
      content:
        application/json:
          schema:
            type: object
            required: [task, event]
            properties:
              task: {$ref: "#/components/schemas/ExtTask"}
              event: {$ref: "#/components/schemas/ExtTaskEvent"}
    CropSeasonWritten:
      description: Sự kiện vụ đã ghi (pf/cropcycle). Gọi lặp cùng Idempotency-Key trả lại đúng phản hồi.
      content:
        application/json:
          schema:
            type: object
            required: [season, event]
            properties:
              season: {$ref: "#/components/schemas/CropSeason"}
              event: {$ref: "#/components/schemas/CropSeasonEvent"}
    CropHarvestWritten:
      description: Khai báo sản lượng đã ghi (pf/cropcycle)
      content:
        application/json:
          schema:
            type: object
            required: [harvest, season]
            properties:
              harvest: {$ref: "#/components/schemas/CropHarvest"}
              season: {$ref: "#/components/schemas/CropSeason"}
    CropFarmLogWritten:
      description: Phiên bản nhật ký đã ghi (pf/cropcycle)
      content:
        application/json:
          schema:
            type: object
            required: [log, state]
            properties:
              log: {$ref: "#/components/schemas/CropFarmLog"}
              state: {$ref: "#/components/schemas/CropFarmLogState"}
    CropBulkHarvest:
      description: Kết quả nhập sản lượng theo dòng (HTX US-YIELD-02)
      content:
        application/json:
          schema:
            type: object
            required: [accepted, duplicate, rejected, rows]
            properties:
              accepted: {type: integer}
              duplicate: {type: integer}
              rejected: {type: integer}
              rows:
                type: array
                items:
                  type: object
                  required: [row, status]
                  properties:
                    row: {type: integer}
                    status: {type: string, enum: [accepted, duplicate, rejected]}
                    code: {type: string}
                    reason: {type: string}
                    needs_confirm: {type: boolean}
                    season_ref: {type: string, format: uuid}
                    harvest_id: {type: string, format: uuid}
  schemas:
    ExtDataSource:
      type: object
      required: [id, kind, in_territory, ttl_seconds, fake]
      properties:
        id: {type: string}
        kind: {type: string, enum: [weather, salinity, tile]}
        in_territory: {type: boolean, description: "Đích thuộc AG_RESIDENCY_ALLOWLIST (RB-7)"}
        adr: {type: string, description: "ADR riêng của nguồn ngoài lãnh thổ (ADR-0007)"}
        cell_deg: {type: string, description: "Cạnh ô lưới (nguồn điểm)"}
        max_zoom: {type: integer, description: "Trần zoom (nguồn tile)"}
        ttl_seconds: {type: integer}
        fake: {type: boolean, description: "Nhà cung cấp giả (Local/Dev)"}
    HtxCollectionSchedule:
      type: object
      description: Lịch gom rơm MKG của một HTX (van collection_schedule) — chỉ khung thời gian và trạng thái.
      required: [schedule_ref, cooperative_ref, commune_code, window_from, window_to, status, revision, published_at, updated_at]
      properties:
        schedule_ref: {type: string, format: uuid}
        cooperative_ref: {type: string, format: uuid}
        commune_code: {type: string}
        window_from: {type: string, format: date}
        window_to: {type: string, format: date}
        status: {type: string, enum: [planned, confirmed, in_progress, completed, cancelled]}
        revision: {type: integer}
        published_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    HtxCollectionResponse:
      type: object
      required: [id, revision, outcome, htx_rolls, reason, responded_at]
      properties:
        id: {type: string, format: uuid}
        revision: {type: integer}
        outcome: {type: string, enum: [confirmed, disputed]}
        htx_rolls: {type: integer}
        reason: {type: [string, "null"]}
        responded_at: {type: string, format: date-time}
        supersedes_id: {type: [string, "null"], format: uuid}
    HtxCollectionStatement:
      type: object
      description: Bảng kê số cuộn MKG đã gom trên một thửa (van htx_collection_statement) kèm phản hồi hiện hành của HTX.
      required: [statement_ref, cooperative_ref, plot_ref, plot_code, season_ref, collected_on, rolls, revision, pending, response, published_at, updated_at]
      properties:
        statement_ref: {type: string, format: uuid}
        cooperative_ref: {type: string, format: uuid}
        plot_ref: {type: string, format: uuid}
        plot_code: {type: [string, "null"]}
        season_ref: {type: [string, "null"], format: uuid}
        collected_on: {type: string, format: date}
        rolls: {type: integer}
        revision: {type: integer}
        pending: {type: boolean, description: HTX chưa phản hồi revision hiện hành}
        response:
          oneOf:
            - {$ref: "#/components/schemas/HtxCollectionResponse"}
            - {type: "null"}
        published_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    # --- pf/metrics ---
    MetricDefinition:
      type: object
      required: [key, version, title, description, unit, grain, aggregation, source_module, source, rule_version, effective_from, proposed_by, approved_by, file]
      properties:
        key: {type: string}
        version: {type: integer}
        title: {type: string}
        description: {type: string}
        unit: {type: string}
        grain: {type: string, enum: [day, season]}
        aggregation: {type: string, enum: [sum, count, avg, max, last]}
        source_module: {type: string}
        source: {type: string}
        rule_version: {type: string}
        effective_from: {type: string, format: date}
        proposed_by: {type: string}
        approved_by: {type: string}
        file: {type: string}
    MetricWatermark:
      type: object
      required: [last_event_id, recorded_at]
      properties:
        last_event_id: {type: string, format: uuid}
        recorded_at: {type: string, format: date-time}
    MetricValue:
      type: object
      required: [id, business_date, value, definition_version, cutoff, watermark, computed_at, supersedes_id, correction_reason, current]
      properties:
        id: {type: string, format: uuid}
        business_date: {type: string, format: date}
        value: {type: string, description: "Số thập phân dạng chuỗi (R-10)"}
        definition_version: {type: integer}
        cutoff: {type: string, format: date-time}
        watermark:
          oneOf:
            - {$ref: "#/components/schemas/MetricWatermark"}
            - {type: "null"}
        computed_at: {type: string, format: date-time}
        supersedes_id: {type: [string, "null"], format: uuid}
        correction_reason: {type: [string, "null"]}
        current: {type: boolean}
    GisLayerEvent:
      type: object
      required: [id, layer, feature_ref, op, before, after, source_event_id, source_type, source_module, event_time, recorded_at]
      properties:
        id: {type: string, format: uuid}
        layer: {type: string}
        feature_ref: {type: string, format: uuid}
        op: {type: string, enum: [create, update, retire, restore]}
        before: {type: [object, "null"], additionalProperties: true}
        after: {type: [object, "null"], additionalProperties: true}
        source_event_id: {type: string, format: uuid}
        source_type: {type: string}
        source_module: {type: string}
        event_time: {type: string, format: date-time}
        recorded_at: {type: string, format: date-time}
    GisLayerFeature:
      type: object
      required: [feature_ref, attributes, retired]
      properties:
        feature_ref: {type: string, format: uuid}
        attributes: {type: [object, "null"], additionalProperties: true}
        retired: {type: boolean}
        geometry: {type: object, additionalProperties: true, description: "GeoJSON as-of (chỉ khi geometry=true)"}
    GisLayerState:
      type: object
      required: [layer, business_date, watermark, basis, base_snapshot_date, feature_count, features]
      properties:
        layer: {type: string}
        business_date: {type: string, format: date}
        watermark:
          oneOf:
            - {$ref: "#/components/schemas/MetricWatermark"}
            - {type: "null"}
        basis: {type: string, enum: [snapshot, replay]}
        base_snapshot_date: {type: [string, "null"], format: date}
        feature_count: {type: integer}
        features: {type: array, items: {$ref: "#/components/schemas/GisLayerFeature"}}
        recorded_at: {type: string, format: date-time}
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: {type: string, format: uri}
        title: {type: string}
        status: {type: integer}
        code: {type: string}
        detail: {type: string}
        instance: {type: string}
        trace_id: {type: string}
        errors:
          type: array
          items:
            type: object
            properties:
              field: {type: string}
              reason: {type: string}
    ConsentInput:
      type: object
      required: [subject_ref, purpose, text_version, status, channel, event_time]
      properties:
        id: {type: string, format: uuid, description: "UUIDv7 sinh trên thiết bị khi ngoại tuyến (R-11). Bỏ trống → server sinh."}
        subject_ref: {type: string, format: uuid, description: "Mã tham chiếu chủ thể — không phải định danh (R-41)"}
        purpose: {type: string, pattern: "^[a-z][a-z0-9_.]{2,63}$", examples: ["mrv.evidence"]}
        text_version: {type: string, maxLength: 40}
        status: {type: string, enum: [granted, withdrawn]}
        channel: {type: string, enum: [field_app, web, zalo, paper]}
        event_time: {type: string, format: date-time, description: "Lúc xảy ra tại hiện trường (R-13)"}
        device_id: {type: string}
    Consent:
      allOf:
        - $ref: "#/components/schemas/ConsentInput"
        - type: object
          required: [id, recorded_at, seq]
          properties:
            recorded_at: {type: string, format: date-time}
            seq: {type: integer, description: "Thứ tự trong chuỗi băm của chủ thể"}
    AdminUnit:
      type: object
      required: [code, name, level, parent_code, valid_from, valid_to, successor_codes]
      properties:
        code: {type: string}
        name: {type: string}
        level: {type: string, enum: [province, commune, district], description: "district chỉ có trong dữ liệu trước 01/07/2025"}
        parent_code: {type: [string, "null"]}
        valid_from: {type: string, format: date}
        valid_to: {type: [string, "null"], format: date, description: "Không bao gồm; null = còn hiệu lực"}
        successor_codes: {type: array, items: {type: string}}
    AdminUnitNode:
      allOf:
        - $ref: "#/components/schemas/AdminUnit"
        - type: object
          required: [children]
          properties:
            children: {type: array, items: {$ref: "#/components/schemas/AdminUnitNode"}}
    CatalogItem:
      type: object
      required: [catalog, code, name, attrs, active, deactivation_reason, revision, updated_at]
      properties:
        catalog: {type: string}
        code: {type: string}
        name: {type: string}
        attrs: {type: object, additionalProperties: {type: string}, description: "Số (vd expected_yield_t_per_ha) là chuỗi decimal"}
        active: {type: boolean}
        deactivation_reason: {type: [string, "null"]}
        revision: {type: integer}
        updated_at: {type: string, format: date-time}
        forms_in_use: {type: integer, description: "KN v7.7 FN-AD-04.05: số mẫu báo cáo đang dùng mục (vắng khi chưa nối P3)"}
        valid_from: {type: string, format: date, description: "W11.41 (danh mục cnts_*): ngày bắt đầu hiệu lực của giá trị trả về (đọc theo at hoặc vừa ghi)"}
    DisplayValue:
      type: object
      required: [key, value, default, version, source]
      properties:
        key: {type: string, examples: ["gis.stage_color:chin_ro"]}
        value: {type: string, description: "Mã màu HEX #RRGGBB hoặc số thập phân dạng chuỗi"}
        default: {type: string}
        version: {type: integer, description: "0 = chưa có phiên bản duyệt"}
        source: {type: string, enum: [approved, default]}
    MechAreaSyncLog:
      type: object
      required: [id, cooperative_ref, season_code, season_year, source, source_label, outcome, area_ha, source_at, event_id, recorded_at]
      properties:
        id: {type: string, format: uuid}
        cooperative_ref: {type: string, format: uuid}
        season_code: {type: string}
        season_year: {type: integer}
        source: {type: string, enum: [app_htx, manual]}
        source_label: {type: string}
        outcome: {type: string, enum: [applied, kept_locked, stale_ignored], description: "Kết quả áp QT-03"}
        area_ha: {type: string}
        source_at: {type: string, format: date-time}
        event_id: {type: [string, "null"], format: uuid}
        recorded_at: {type: string, format: date-time}
    MechAreaSyncCoop:
      type: object
      required: [id, cooperative_ref, season_code, season_year, source, source_label, outcome, area_ha, source_at, event_id, recorded_at, sync_count, stale]
      properties:
        id: {type: string, format: uuid}
        cooperative_ref: {type: string, format: uuid}
        season_code: {type: string}
        season_year: {type: integer}
        source: {type: string, enum: [app_htx, manual]}
        source_label: {type: string}
        outcome: {type: string, enum: [applied, kept_locked, stale_ignored]}
        area_ha: {type: string}
        source_at: {type: string, format: date-time}
        event_id: {type: [string, "null"], format: uuid}
        recorded_at: {type: string, format: date-time}
        sync_count: {type: integer}
        stale: {type: boolean, description: "Bản App HTX của HTX cũ hơn ngưỡng độ tươi"}
    GeoStandardMap:
      type: object
      description: Bản đồ chuẩn hóa cho TMS (GIS US-INT-02)
      required: [schema, type, generated_at, bbox, zoom, admin_level, features, layers, basemaps, basemap_notice, capacity_thresholds]
      properties:
        schema: {type: string, enum: [agrigreen.standard_map/v1]}
        type: {type: string, enum: [FeatureCollection]}
        generated_at: {type: string, format: date-time}
        bbox: {type: array, items: {type: number}, minItems: 4, maxItems: 4}
        zoom: {type: integer}
        admin_level: {type: string, enum: [province, commune]}
        features:
          type: array
          items:
            type: object
            required: [type, id, geometry, properties]
            properties:
              type: {type: string, enum: [Feature]}
              id: {type: string}
              geometry: {type: object}
              properties:
                type: object
                required: [layer]
                properties:
                  layer: {type: string, enum: [admin_boundaries, cooperatives, facilities, roads, waterways]}
                additionalProperties: true
        layers:
          type: object
          additionalProperties:
            type: object
            required: [count, truncated]
            properties:
              count: {type: integer}
              truncated: {type: boolean}
              passable_count: {type: integer}
              version_no: {type: integer}
        basemaps:
          type: array
          items:
            type: object
            required: [kind, url]
            properties:
              kind: {type: string, enum: [street, satellite, terrain]}
              url: {type: string}
        basemap_notice: {type: [string, "null"]}
        capacity_thresholds:
          oneOf:
            - type: object
              required: [warn_pct, full_pct]
              properties:
                warn_pct: {type: string}
                full_pct: {type: string}
            - {type: "null"}
    ParamValue:
      type: object
      required: [key, value, text, unit, version, effective_from, source_doc, approved_at, param_version_id, supersedes_id, seq]
      properties:
        key: {type: string}
        value: {type: [string, "null"], description: "Số thập phân dạng chuỗi (R-10)"}
        text: {type: [string, "null"]}
        unit: {type: string}
        version: {type: integer}
        effective_from: {type: string, format: date-time}
        source_doc: {type: string}
        approved_at: {type: string, format: date-time}
        param_version_id: {type: string, format: uuid}
        supersedes_id: {type: [string, "null"], format: uuid}
        seq: {type: integer}
    OrgKind:
      type: string
      enum: [ttkn_national, ttkn_province, extension_team, dcrd, cooperative, mkg, partner]
    Org:
      type: object
      required: [ref, kind, code, name, admin_unit_code, parent_ref, representative_ref, active]
      properties:
        ref: {type: string, format: uuid}
        kind: {$ref: "#/components/schemas/OrgKind"}
        code: {type: string, description: "Mã đơn vị; với HTX là Mã HTX do hệ thống tự sinh (CGH BR-01)"}
        name: {type: string}
        admin_unit_code: {type: [string, "null"], description: "Mã tỉnh/xã hiện hành; null với cấp quốc gia"}
        parent_ref: {type: [string, "null"], format: uuid}
        representative_ref: {type: [string, "null"], format: uuid, description: "Mã tham chiếu người đại diện trong kho định danh"}
        active: {type: boolean}
        region: {$ref: "#/components/schemas/KNRegionRef", description: "KN v7.7 FN-AD-04.02: Khu vực của Nút xã (chỉ trong danh sách /v1/orgs, khi đã gán)"}
    # --- pf/party KN v7.7 gói P2 ---
    KNDepartment:
      type: object
      required: [id, org_ref, code, name, description, sort_order, status, status_label, menu_profile, retired, selectable, account_count, record_count, updated_by, updated_at]
      properties:
        id: {type: string, format: uuid}
        org_ref: {type: string, format: uuid, description: "Đơn vị: Nút cấp 1 (ttkn_national) hoặc cấp 2 (ttkn_province)"}
        code: {type: string, pattern: "^[a-z][a-z0-9_]{1,39}$", description: "Mã phòng ban — department_code của mọi bản ghi KN mới"}
        name: {type: string}
        description: {type: [string, "null"]}
        sort_order: {type: integer}
        status: {type: string, enum: [active, not_open, suspended], description: "Đang áp dụng / Chưa mở / Ngưng hoạt động"}
        status_label: {type: string}
        menu_profile: {type: string, enum: [trong_trot, generic, chan_nuoi_thuy_san, ke_hoach_tai_chinh, thong_tin_truyen_thong, hanh_chinh_tong_hop], description: "Bộ menu dựng sẵn trong mã (kn.menu/v3); generic + mã có khuôn riêng → khuôn riêng"}
        retired: {type: boolean, description: "Đã xóa (sự kiện retired) — mã không tái sử dụng"}
        selectable: {type: boolean, description: "Chọn được ở bước 2 đăng nhập (Đang áp dụng, chưa xóa)"}
        account_count: {type: [integer, "null"], description: "null = chưa nối nguồn đếm (P1) hoặc Application API"}
        record_count: {type: [integer, "null"]}
        updated_by: {type: string, format: uuid}
        updated_at: {type: string, format: date-time}
    KNDepartmentList:
      type: object
      required: [org_ref, items]
      properties:
        org_ref: {type: string, format: uuid}
        items: {type: array, items: {$ref: "#/components/schemas/KNDepartment"}}
    KNRegion:
      type: object
      required: [id, province_code, code, name, sort_order, active, deactivation_reason, commune_count, updated_by, updated_at]
      properties:
        id: {type: string, format: uuid}
        province_code: {type: string}
        code: {type: string}
        name: {type: string}
        sort_order: {type: integer}
        active: {type: boolean}
        deactivation_reason: {type: [string, "null"]}
        commune_count: {type: integer, description: "Số Nút xã đang hoạt động được gán"}
        updated_by: {type: string, format: uuid}
        updated_at: {type: string, format: date-time}
    KNRegionList:
      type: object
      required: [province_code, items, assigned_communes]
      properties:
        province_code: {type: string}
        items: {type: array, items: {$ref: "#/components/schemas/KNRegion"}}
        assigned_communes: {type: integer, description: "Σ commune_count"}
    KNRegionRef:
      type: object
      required: [code, name]
      properties:
        code: {type: string}
        name: {type: string}
    KNOrgTreeNode:
      type: object
      required: [ref, kind, code, name, admin_unit_code, level, active, region, commune_count, children]
      properties:
        ref: {type: [string, "null"], format: uuid, description: "null với nhóm khu vực"}
        kind: {type: string, enum: [ttkn_national, ttkn_province, extension_team, region, region_unassigned]}
        code: {type: string}
        name: {type: string}
        admin_unit_code: {type: [string, "null"]}
        level: {type: integer, description: "1 TTKNQG, 2 TTKN tỉnh, 3 Xã; 0 với nhóm khu vực"}
        active: {type: boolean}
        region:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/KNRegionRef"
        commune_count: {type: integer}
        children: {type: array, items: {$ref: "#/components/schemas/KNOrgTreeNode"}}
    # --- hết pf/party KN v7.7 gói P2 (chung) ---
    KNMenuItem:
      type: object
      required: [key, label, route, icon, badge_source, enabled, children]
      properties:
        key: {type: string, description: "Khóa ổn định của mục (vd xa.nhiem_vu.cong_viec)"}
        label: {type: string}
        route: {type: [string, "null"], description: "Trang web-ops (/kn/<màn>; Admin theo phòng ban /kn/phong-ban/{mã}/<màn>); null với mục cha chỉ mở/đóng"}
        icon: {type: string, description: "Tên icon NavIcon của web-ops (app tự ánh xạ)"}
        badge_source: {type: [string, "null"], description: "Khóa số đếm việc cần xử lý (ẩn khi 0) — client lấy số từ module sở hữu"}
        enabled: {type: boolean, description: "false: hiện mờ, không bấm được (phòng ban chưa mở trong menu Admin; mục \"Sắp có\")"}
        status: {type: string, enum: [active, not_open, suspended, coming_soon], description: "Mục phòng ban của menu Admin (active/not_open/suspended); coming_soon: mục của module chưa có — nhãn \"Sắp có\" (kn.menu/v3)"}
        status_label: {type: string}
        children: {type: array, items: {$ref: "#/components/schemas/KNMenuItem"}}
    KNMenuGroup:
      type: object
      required: [key, label, items]
      properties:
        key: {type: string, description: "dieu_hanh | nghiep_vu | bao_cao | du_lieu | dung_chung; Admin: dieu_hanh | phong_ban | quan_tri | dung_chung"}
        label: {type: string}
        items: {type: array, items: {$ref: "#/components/schemas/KNMenuItem"}}
    ModuleEnablement:
      type: object
      description: Trạng thái bật một module cho tenant (W1.4, R-MOD-08)
      required: [module, kind, enable, enabled, reason, updated_by, updated_at]
      properties:
        module: {type: string, description: "Tên repo, vd pf/geo"}
        kind: {type: string, enum: [kernel, capability, domain]}
        enable: {type: string, enum: [always, per_tenant]}
        enabled: {type: boolean}
        reason: {type: [string, "null"]}
        updated_by: {type: [string, "null"], format: uuid}
        updated_at: {type: [string, "null"], format: date-time}
    KNMenu:
      type: object
      required: [menu_version, audience, org_ref, department, default_route, groups]
      properties:
        menu_version: {type: string, description: "Phiên bản bảng menu tĩnh (kn.menu/v3)"}
        audience: {type: string, enum: [kn_tw, kn_tinh, kn_xa, admin]}
        org_ref: {type: [string, "null"], format: uuid}
        department:
          oneOf:
            - type: "null"
            - type: object
              required: [code, name, status, menu_profile]
              properties:
                code: {type: string}
                name: {type: string}
                status: {type: string}
                menu_profile: {type: string}
        default_route: {type: string}
        groups: {type: array, items: {$ref: "#/components/schemas/KNMenuGroup"}}
    # --- pf/accounts KN v7.7 gói P1 (cùng định nghĩa ở admin.yaml) ---
    KNCommune:
      type: object
      required: [code, name]
      properties:
        code: {type: string}
        name: {type: string}
    KNDepartmentRef:
      type: object
      required: [code, name, description, status]
      properties:
        code: {type: string}
        name: {type: string}
        description: {type: [string, "null"]}
        status: {type: string, enum: [active, not_open, suspended]}
        read_only: {type: boolean, description: "W11.07: phòng ban ngoài lần gán, chọn được ở chế độ chỉ xem (Lãnh đạo đơn vị, Ban Giám đốc)"}
    KNAssignment:
      type: object
      required: [assignment_id, user_ref, role, org_ref, org_name, mgmt_level, mgmt_level_code, communes, departments, valid_from, valid_to, active,
        created_by, created_at, updated_by, updated_at]
      properties:
        assignment_id: {type: string, format: uuid}
        user_ref: {type: string, format: uuid}
        role: {type: string, enum: [kn_tw, kn_tinh, kn_xa, admin]}
        org_ref: {type: [string, "null"], format: uuid, description: "null: Admin không gắn Nút"}
        org_name: {type: string, description: "Admin không Nút: \"Toàn hệ thống\""}
        mgmt_level: {type: [string, "null"], description: "Nhãn cấp quản lý (tạm Q-05), vd \"Chuyên viên\""}
        mgmt_level_code: {type: [string, "null"]}
        communes: {type: array, items: {$ref: "#/components/schemas/KNCommune"}, description: "Xã phụ trách (Cấp Xã)"}
        departments: {type: array, items: {$ref: "#/components/schemas/KNDepartmentRef"}, description: "Admin: rỗng"}
        valid_from: {type: string, format: date-time}
        valid_to: {type: [string, "null"], format: date-time}
        active: {type: boolean}
        created_by: {type: string, format: uuid}
        created_at: {type: string, format: date-time}
        updated_by: {type: string, format: uuid}
        updated_at: {type: string, format: date-time}
        attributes: {$ref: "#/components/schemas/KNAssignmentAttrs"}
    KNSessionContext:
      type: object
      required: [context_id, assignment_id, role, department_code, department_name, org_ref, org_name, communes, default_route, expires_at,
        support_session_id, on_behalf_of]
      properties:
        context_id: {type: string, format: uuid, description: "Gửi lại qua header X-AG-Context"}
        assignment_id: {type: [string, "null"], format: uuid, description: "null: ngữ cảnh hỗ trợ không gắn tài khoản"}
        role: {type: string, enum: [kn_tw, kn_tinh, kn_xa, admin]}
        department_code: {type: [string, "null"], description: "null với Admin"}
        department_name: {type: [string, "null"]}
        org_ref: {type: [string, "null"], format: uuid}
        org_name: {type: string}
        communes: {type: array, items: {$ref: "#/components/schemas/KNCommune"}}
        default_route: {type: string, description: "Trang mặc định theo vai trò (Dashboard / Công việc cần làm / Tổng quan hệ thống)"}
        expires_at: {type: string, format: date-time}
        support_session_id: {type: [string, "null"], format: uuid, description: "Khác null: Admin đang hỗ trợ (FN-AD-04.07) — dải cảnh báo vàng"}
        on_behalf_of: {type: [string, "null"], format: uuid}
        read_only: {type: boolean, description: "W11.07: ngữ cảnh chỉ xem (Cấp TW, Lãnh đạo đơn vị ở phòng ban khác, Ban Giám đốc) — mọi thao tác ghi 403 accounts.context_read_only"}
        mgmt_level_code: {type: [string, "null"]}
        manager: {type: boolean, description: "Lãnh đạo (≥ phó phòng/phụ trách/lãnh đạo đơn vị, hoặc nhóm Lãnh đạo phòng)"}
        province_group: {type: [string, "null"]}
        duties: {type: array, items: {type: string}}
        internal_unit_code: {type: [string, "null"]}
        powers: {type: array, items: {type: string}, description: "Quyền nhận qua ủy quyền có hạn còn hiệu lực (đầy đủ ở GET /v1/me/context)"}
    # --- W11.07: phân quyền trong vai + đơn vị nội bộ (cùng định nghĩa ở admin.yaml/application.yaml) ---
    KNAssignmentAttrs:
      type: object
      description: "Thuộc tính phân quyền trong vai (sổ phụ pf_accounts.assignment_attr_event, W11.07)"
      required: [province_group, province_group_label, duties, internal_unit_code, facility_refs, household_refs]
      properties:
        province_group: {type: [string, "null"], enum: [vien_chuc, tong_hop, chu_nhiem, lanh_dao_phong, ban_giam_doc, null], description: "Nhóm Cấp Tỉnh (chỉ kn_tinh; tạm Q-059)"}
        province_group_label: {type: [string, "null"]}
        duties: {type: array, items: {type: string, enum: [qtnv_bao_gia, phu_trach_bieu]}, description: "Cờ nhiệm vụ (chỉ kn_tinh)"}
        internal_unit_code: {type: [string, "null"], description: "Đơn vị nội bộ; Cấp Xã: đơn vị quản lý (HS-37)"}
        facility_refs: {type: array, items: {type: string, format: uuid}, description: "Cấp Xã: giới hạn cơ sở (rỗng = cả xã)"}
        household_refs: {type: array, items: {type: string, format: uuid}, description: "Cấp Xã: giới hạn hộ (rỗng = cả xã)"}
    KNDelegation:
      type: object
      required: [delegation_id, grantor_ref, grantee_ref, department_code, power, power_label, valid_from, valid_to, revoked, status, reason, created_at]
      properties:
        delegation_id: {type: string, format: uuid}
        grantor_ref: {type: string, format: uuid}
        grantee_ref: {type: string, format: uuid}
        department_code: {type: string}
        power: {type: string, enum: [mo_lai_ky, duyet_bao_cao]}
        power_label: {type: string}
        valid_from: {type: string, format: date-time}
        valid_to: {type: string, format: date-time}
        revoked: {type: boolean}
        status: {type: string, enum: [active, scheduled, expired, revoked]}
        reason: {type: string}
        created_at: {type: string, format: date-time}
    KNDelegationList:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/KNDelegation"}}
    InternalUnit:
      type: object
      required: [id, org_ref, code, kind, kind_label, name, department_code, sort_order, active, updated_at]
      properties:
        id: {type: string, format: uuid}
        org_ref: {type: string, format: uuid}
        code: {type: string}
        kind: {type: string, enum: [ban_giam_doc, van_phong, phong, tram, trai, tang_cuong]}
        kind_label: {type: string}
        name: {type: string}
        department_code: {type: [string, "null"], description: "kind = phong: mã phòng ban P2"}
        sort_order: {type: integer}
        active: {type: boolean}
        updated_at: {type: string, format: date-time}
    InternalUnitList:
      type: object
      required: [org_ref, items, kinds]
      properties:
        org_ref: {type: string, format: uuid}
        items: {type: array, items: {$ref: "#/components/schemas/InternalUnit"}}
        kinds: {type: array, items: {type: object, required: [code, label], properties: {code: {type: string}, label: {type: string}}}}
    Me:
      type: object
      required: [actor_ref, tenant_id, roles, mfa, org, scope]
      additionalProperties: false
      properties:
        actor_ref: {type: string, format: uuid, description: "= sub của token; mã tham chiếu, không phải định danh"}
        tenant_id: {type: string, format: uuid}
        roles: {type: array, items: {type: string}}
        mfa: {type: boolean, description: "Token có yếu tố thứ hai (amr) — Admin API bắt buộc"}
        org:
          description: Đơn vị công tác (claim org_ref). null khi không có org_ref hoặc tổ chức không tồn tại trong tenant.
          oneOf:
            - type: "null"
            - type: object
              required: [ref, kind, name, admin_unit_code, active]
              additionalProperties: false
              properties:
                ref: {type: string, format: uuid}
                kind: {$ref: "#/components/schemas/OrgKind"}
                name: {type: string}
                admin_unit_code: {type: [string, "null"]}
                active: {type: boolean, description: "false = tổ chức đã bị vô hiệu hóa → phạm vi rỗng"}
        scope:
          type: object
          required: [all, level, units, unit_names]
          additionalProperties: false
          properties:
            all: {type: boolean, description: "true = toàn quốc (TTKN QG, Cục KTHT, Mekong Green, platform_admin)"}
            level: {type: string, enum: [national, province, commune, cooperative, none]}
            units: {type: array, items: {type: string}, description: "Mã đơn vị hành chính hiện hành được thấy; rỗng khi all = true hoặc level = none"}
            unit_names: {type: object, additionalProperties: {type: string}, description: "Mã đơn vị → tên (masterdata tại thời điểm hiện tại), gồm cả đơn vị của tổ chức"}
    Decimal:
      type: string
      pattern: "^-?[0-9]+(\\.[0-9]+)?$"
      description: Số thập phân dạng chuỗi (không float)
    Point:
      type: object
      required: [lat, lon]
      properties:
        lat: {$ref: "#/components/schemas/Decimal"}
        lon: {$ref: "#/components/schemas/Decimal"}
    Cooperative:
      allOf:
        - $ref: "#/components/schemas/Org"
        - type: object
          required: [status_reason, tax_code, area_ha, established_on, location, location_provisional]
          properties:
            status_reason: {type: [string, "null"], description: "Lý do vô hiệu hóa hiện tại"}
            tax_code: {type: [string, "null"], pattern: "^[0-9]{10}(-[0-9]{3})?$"}
            area_ha: {oneOf: [{$ref: "#/components/schemas/Decimal"}, {type: "null"}], description: "Diện tích đăng ký hành chính (ha)"}
            established_on: {type: [string, "null"], format: date}
            location: {oneOf: [{$ref: "#/components/schemas/Point"}, {type: "null"}]}
            location_provisional: {type: boolean, description: "true = chưa có toạ độ; bản đồ hiển thị tâm xã, nhãn \"vị trí tạm\""}
            address: {type: [string, "null"], description: "Địa chỉ trụ sở HTX (HTX US-HTX-02; không phải dữ liệu cá nhân)"}
        - type: object
          description: Dữ liệu đọc bổ sung của danh sách/hồ sơ HTX (G-03)
          required: [province_code, commune_name, province_name, member_households, digitized_plots]
          properties:
            province_code: {type: [string, "null"], description: "Mã tỉnh hiện hành của xã nơi HTX đặt trụ sở"}
            commune_name: {type: [string, "null"]}
            province_name: {type: [string, "null"]}
            member_households: {type: integer, minimum: 0, description: "Số nông hộ thành viên đang hoạt động"}
            digitized_plots: {type: [integer, "null"], minimum: 0, description: "Số thửa đã số hoá (pf/geo); null khi chưa nối pf/geo hoặc tra lỗi"}
    Household:
      type: object
      required: [household_ref, cooperative_ref, commune_code, cultivated_area_ha, member_since, active]
      properties:
        household_ref: {type: string, format: uuid, description: "Mã tham chiếu trong kho định danh (R-41)"}
        cooperative_ref: {type: [string, "null"], format: uuid}
        commune_code: {type: string}
        cultivated_area_ha: {oneOf: [{$ref: "#/components/schemas/Decimal"}, {type: "null"}]}
        member_since: {type: [string, "null"], format: date}
        active: {type: boolean}
    BilateralPair:
      type: object
      required: [pair_id, htx_ref, counterparty_tenant_id, active, since, terminated_at]
      properties:
        pair_id: {type: string, format: uuid, description: "UUIDv5(counterparty_tenant_id, htx_ref)"}
        htx_ref: {type: string, format: uuid}
        counterparty_tenant_id: {type: string, format: uuid}
        active: {type: boolean}
        since: {type: [string, "null"], format: date-time}
        terminated_at: {type: [string, "null"], format: date-time}
    BilateralRecord:
      type: object
      required: [id, pair_id, seq, contract, entity_key, author_side, channel, record, payload_sha256, recorded_at]
      properties:
        id: {type: string, format: uuid}
        pair_id: {type: string, format: uuid}
        seq: {type: integer}
        contract: {type: string, pattern: "^[a-z][a-z0-9_]{2,47}[.]v[0-9]+$"}
        entity_key: {type: string}
        author_side: {type: string, enum: [a, b], description: "a = MKG qua cổng tích hợp; b = HTX"}
        channel: {type: string, enum: [api, file, app]}
        record: {type: object, description: "Bản ghi theo hợp đồng contracts/integration/ingest/<tên>.v<N>.json"}
        payload_sha256: {type: string, pattern: "^[0-9a-f]{64}$"}
        recorded_at: {type: string, format: date-time}
    HouseholdListItem:
      allOf:
        - $ref: "#/components/schemas/Household"
        - type: object
          required: [label, masked_phone, label_unavailable, consents]
          properties:
            label: {type: string, description: "Nhãn đã che, vd \"Nguyễn V. A.\""}
            masked_phone: {type: string, description: "SĐT đã che"}
            label_unavailable: {type: boolean}
            consents:
              type: array
              description: "G-04: trạng thái đồng ý hiện tại theo từng mục đích (R-41/R-42); rỗng khi chưa ghi nhận"
              items:
                type: object
                required: [purpose, status, event_time]
                properties:
                  purpose: {type: string, examples: ["mrv.evidence"]}
                  status: {type: string, enum: [granted, withdrawn]}
                  event_time: {type: string, format: date-time}
    HouseholdInput:
      type: object
      required: [cooperative_ref, identity]
      properties:
        cooperative_ref: {type: string, format: uuid}
        commune_code: {type: string, description: "Bỏ trống = xã của HTX"}
        cultivated_area_ha: {$ref: "#/components/schemas/Decimal"}
        member_since: {type: string, format: date}
        identity:
          type: object
          description: Chỉ chuyển vào kho định danh (mục đích registry.admin), không lưu ở pf_party
          required: [full_name, phone]
          properties:
            full_name: {type: string}
            phone: {type: string}
            national_id: {type: string}
            address: {type: string}
    HouseholdCreated:
      type: object
      required: [household, duplicate]
      properties:
        household: {$ref: "#/components/schemas/Household"}
        duplicate: {type: boolean}
        duplicate_label: {type: string, enum: ["trùng"]}
    # --- pf/sync ---

    SyncDeviceInput:
      type: object
      required: [device_id, platform, app_version]
      properties:
        device_id: {type: string, format: uuid, description: "UUIDv7 sinh trên máy"}
        platform: {type: string, enum: [android, ios]}
        app_version: {type: string, pattern: "^[0-9A-Za-z.+_-]{1,40}$"}
    SyncDevice:
      type: object
      required: [device_id, registered_at, platform, app_version, revoked]
      properties:
        device_id: {type: string, format: uuid}
        registered_at: {type: string, format: date-time}
        platform: {type: string}
        app_version: {type: string}
        revoked: {type: boolean}
    SyncChange:
      type: object
      required: [entity, id, version, op]
      properties:
        entity: {type: string, examples: [catalog_item, admin_unit, mrv_catalog, plot, task, directive, document, pubkey]}
        id: {type: string, format: uuid, description: "pubkey + id 00000000-0000-0000-0000-000000000000 + tombstone = kết thúc lượt khóa: xóa mọi pubkey có version nhỏ hơn"}
        version: {type: integer}
        op: {type: string, enum: [upsert, tombstone]}
        data:
          type: object
          description: |
            Không có khi tombstone. pubkey: {ref, area_code, public_key (base64 32 byte)}.
            catalog_item: SyncCatalogItemData; admin_unit: SyncAdminUnitData; mrv_catalog: MrvCatalogVersion (bản đã duyệt).
    SyncCatalogItemData:
      type: object
      description: |
        data của entity pull catalog_item (pf/masterdata): mục đang dùng của rice_variety, farm_stage, machine_type,
        season, pest, vessel_class và (KN v7.7) crop, material, production_model, report_type — không lọc theo địa bàn. id = UUIDv5 cố định theo (catalog, code); version = sync_seq
        (luôn tăng). Ngừng dùng → tombstone cùng id; dùng lại → upsert version mới.
      required: [catalog, code, name, attrs, revision, updated_at]
      properties:
        catalog: {type: string, enum: [rice_variety, farm_stage, machine_type, season, pest, vessel_class, crop, material, production_model, report_type]}
        code: {type: string}
        name: {type: string}
        attrs: {type: object, additionalProperties: {type: string}}
        revision: {type: integer, minimum: 1}
        updated_at: {type: string, format: date-time}
    SyncAdminUnitData:
      type: object
      description: |
        data của entity pull admin_unit (pf/masterdata): một PHIÊN BẢN hiệu lực của đơn vị có mã thuộc phạm vi
        người gọi (toàn quốc: mọi đơn vị). id = UUIDv5 cố định theo (code, valid_from) — mã có thể dùng lại sau
        sắp xếp; version = sync_seq. Phiên bản đã hết hiệu lực (valid_to ≤ hôm nay) → tombstone, kể cả đơn vị
        cũ có đơn vị kế thừa trong phạm vi.
      required: [code, name, level, parent_code, valid_from, valid_to, successor_codes]
      properties:
        code: {type: string}
        name: {type: string}
        level: {type: string, enum: [province, commune, district]}
        parent_code: {type: [string, "null"]}
        valid_from: {type: string, format: date}
        valid_to: {type: [string, "null"], format: date, description: "Khác null: đã định ngày hết hiệu lực trong tương lai; máy coi hết hiệu lực từ ngày này"}
        successor_codes: {type: array, items: {type: string}}
    SyncPullPage:
      type: object
      required: [changes, next_cursor, has_more, server_time, reset]
      properties:
        changes: {type: array, items: {$ref: "#/components/schemas/SyncChange"}}
        next_cursor: {type: string, description: "Mờ, có chữ ký HMAC, gắn với tenant + thiết bị + phạm vi"}
        has_more: {type: boolean}
        server_time: {type: string, format: date-time}
        reset: {type: boolean, description: "true = phạm vi đã đổi; pull bắt đầu lại từ đầu, máy thay toàn bộ dữ liệu tham chiếu"}
    SyncPushRecord:
      type: object
      required: [id, idem_key, entity, op, event_time, payload]
      properties:
        id: {type: string, format: uuid, description: "UUIDv7 sinh trên máy"}
        idem_key: {type: string, pattern: "^dev:[0-9a-fA-F-]{36}:[1-9][0-9]{0,18}$", description: "dev:<device_id của chính máy gửi>:<seq>"}
        entity: {type: string, examples: [plot_boundary, field_report, task_update, consent, evidence]}
        op: {type: string, enum: [create, correct]}
        event_time: {type: string, format: date-time, description: "Có múi giờ; không vượt quá giờ máy chủ + 5 phút"}
        supersedes_id: {type: [string, "null"], format: uuid, description: "Bắt buộc khi op = correct"}
        correction_reason: {type: [string, "null"], minLength: 10, maxLength: 500, description: "Bắt buộc khi op = correct"}
        payload: {type: object, description: "Tối đa 256 KiB; máy chủ pf/sync chỉ lưu SHA-256"}
    SyncReportSubmissionPayload:
      type: object
      description: |
        KN v7.7 P7 (N-07): payload của bản ghi push entity = report_submission (Sink của pf/extension, ngữ cảnh Cấp Xã
        qua X-AG-Context). Chỉ op = create; id của bản ghi = id bài nộp (UUIDv7 máy sinh, gửi lại → duplicate).
        conflict khi phiên bản liền trước do người/máy khác ghi và mới hơn base_version (bản vẫn được lưu).
        Chiều xuống: report_task, form_layout, report_submission — docs/dev/sync-contract.md "Báo cáo KN v7.7".
      required: [task_id, kind, rows]
      properties:
        task_id: {type: string, format: uuid}
        kind: {type: string, enum: [draft, submitted]}
        base_version: {type: integer, minimum: 0, description: "latest_version máy đã thấy qua pull"}
        rows:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: object
            required: [input]
            properties:
              indicator: {type: string}
              input: {type: object, additionalProperties: {type: string}, description: "chữ cái cột → giá trị"}
    SyncConsentPayload:
      type: object
      description: |
        payload của bản ghi push entity = consent (Sink của pf/party). Chỉ op = create; rút lại đồng ý là
        bản ghi mới status = withdrawn. id, event_time, device_id lấy từ phong bì; idem_key của máy là khóa
        chống trùng của sổ đồng ý (gửi lại → duplicate). Cần vai consent_writer.
      required: [subject_ref, purpose, text_version, status]
      properties:
        subject_ref: {type: string, format: uuid}
        purpose: {type: string, pattern: "^[a-z][a-z0-9_.]{2,63}$", examples: ["mrv.evidence"]}
        text_version: {type: string, maxLength: 40}
        status: {type: string, enum: [granted, withdrawn]}
        channel: {type: string, enum: [field_app, web, zalo, paper], default: field_app}
    SyncPushBatch:
      type: object
      required: [device_id, records]
      properties:
        device_id: {type: string, format: uuid, description: "Phải trùng header X-Device-Id"}
        records: {type: array, maxItems: 500, items: {$ref: "#/components/schemas/SyncPushRecord"}}
    SyncPushResult:
      type: object
      required: [id, status]
      properties:
        id: {type: string, description: "id máy gửi, nguyên văn (kể cả khi sai dạng)"}
        status: {type: string, enum: [accepted, duplicate, conflict, rejected]}
        conflict_id: {type: string, format: uuid}
        code: {type: string, description: "Khi rejected: validation_failed | sync.unknown_entity | sync.sink_failed (máy tự gửi lại, không bắt người dùng sửa) | mã của module nhận"}
        errors:
          type: array
          items:
            type: object
            properties:
              field: {type: string}
              reason: {type: string}
    SyncEnvelopeMeta:
      type: object
      description: docs/dev/envelope-format.md, phiên bản 1
      required: [v, alg, subject_ref, nonce, wrapped_dek, sha256_ciphertext, content_type]
      properties:
        v: {type: integer, enum: [1]}
        alg: {type: string, enum: ["A256GCM+X25519-SEALEDBOX"]}
        subject_ref: {type: string, format: uuid}
        nonce: {type: string, contentEncoding: base64, description: "12 byte"}
        wrapped_dek: {type: string, contentEncoding: base64, description: "80 byte (crypto_box_seal)"}
        sha256_ciphertext: {type: string, pattern: "^[0-9a-f]{64}$"}
        content_type: {type: string, enum: [image/jpeg, image/png, image/webp, image/heic, application/pdf, video/mp4]}
        captured_at: {type: string, format: date-time}
        gps:
          type: object
          required: [lat, lon]
          properties:
            lat: {type: number, minimum: -90, maximum: 90}
            lon: {type: number, minimum: -180, maximum: 180}
            accuracy_m: {type: number, minimum: 0}
    SyncFileCreated:
      type: object
      required: [file_ref, sha256_ciphertext, size]
      properties:
        file_ref: {type: string, format: uuid}
        sha256_ciphertext: {type: string}
        size: {type: integer}
    SyncFile:
      type: object
      required: [file_ref, subject_ref, v, alg, nonce, wrapped_dek, sha256_ciphertext, size, content_type, captured_at, gps, subject_module, subject_type, subject_id, created_at]
      properties:
        file_ref: {type: string, format: uuid}
        subject_ref: {type: string, format: uuid}
        v: {type: integer}
        alg: {type: string}
        nonce: {type: string, contentEncoding: base64}
        wrapped_dek: {type: string, contentEncoding: base64}
        sha256_ciphertext: {type: string}
        size: {type: integer}
        content_type: {type: string}
        captured_at: {type: [string, "null"], format: date-time}
        gps:
          oneOf:
            - type: "null"
            - type: object
              properties:
                lat: {type: number}
                lon: {type: number}
                accuracy_m: {type: number}
        subject_module: {type: [string, "null"], description: "Bộ ba R-DB-07 (W6.5): module chủ; null ở tệp cũ và tệp tải trước khi biết thực thể", examples: [pf/cooperative]}
        subject_type: {type: [string, "null"], examples: [plot]}
        subject_id: {type: [string, "null"], format: uuid}
        created_at: {type: string, format: date-time}
    MrvField:
      type: object
      required: [key, label_vi, data_type, unit, required, min, max, max_scale, enum_values, help_vi, position, reserved]
      properties:
        key: {type: string}
        label_vi: {type: string}
        data_type: {type: string, enum: [decimal, integer, boolean, enum, date, photo, geo_point, text]}
        unit: {type: [string, "null"]}
        required: {type: boolean}
        min: {type: [string, "null"], description: "decimal/integer: giá trị; photo: số ảnh; text: độ dài"}
        max: {type: [string, "null"]}
        max_scale: {type: [integer, "null"]}
        enum_values: {type: array, items: {type: string}}
        help_vi: {type: [string, "null"]}
        position: {type: integer}
        reserved: {type: boolean, description: "plot_ref, season, gps, photo: giá trị lấy từ plot_ref, season_code, gps, file_refs của bản ghi"}
    MrvCatalogVersion:
      type: object
      required: [id, evidence_type, version, status, provisional, source_note, fields, setter_ref, approver_ref, submitted_at, decided_at, decision_note, created_at]
      properties:
        id: {type: string, format: uuid}
        evidence_type: {type: string}
        version: {type: integer}
        status: {type: string, enum: [draft, submitted, approved, rejected]}
        provisional: {type: boolean, description: "Danh mục tạm, chờ chốt C-1"}
        source_note: {type: string}
        fields: {type: array, items: {$ref: "#/components/schemas/MrvField"}}
        setter_ref: {type: string, format: uuid}
        approver_ref: {type: [string, "null"], format: uuid}
        submitted_at: {type: [string, "null"], format: date-time}
        decided_at: {type: [string, "null"], format: date-time}
        decision_note: {type: [string, "null"]}
        created_at: {type: string, format: date-time}
    MrvEvidenceType:
      type: object
      required: [evidence_type, catalog_id, version, provisional, source_note, field_count, approved_at]
      properties:
        evidence_type: {type: string, examples: [awd_log, field_checklist]}
        catalog_id: {type: string, format: uuid, description: "id của phiên bản danh mục đã duyệt mới nhất"}
        version: {type: integer, minimum: 1, description: "Số phiên bản đã duyệt mới nhất — giá trị app gửi trong catalog_version"}
        provisional: {type: boolean, description: "Danh mục tạm, chờ chốt C-1"}
        source_note: {type: string}
        field_count: {type: integer}
        approved_at: {type: [string, "null"], format: date-time}
    MrvFileRef:
      type: object
      required: [file_ref, sha256]
      properties:
        file_ref: {type: string, format: uuid, description: "Tệp đã mã hóa phong bì (POST /v1/files)"}
        sha256: {type: string, pattern: "^[0-9a-f]{64}$", description: "Băm ciphertext"}
    MrvGPS:
      type: object
      description: Dữ liệu cá nhân khi gắn với hộ — không ghi log
      required: [lat, lon]
      properties:
        lat: {$ref: "#/components/schemas/Decimal"}
        lon: {$ref: "#/components/schemas/Decimal"}
        accuracy_m: {oneOf: [{$ref: "#/components/schemas/Decimal"}, {type: "null"}]}
    MrvEvidenceInput:
      type: object
      required: [evidence_type, admin_unit_code, values, event_time]
      properties:
        id: {type: string, format: uuid, description: "UUIDv7 sinh trên máy (R-11)"}
        evidence_type: {type: string, examples: [awd_log, field_checklist]}
        catalog_version: {type: integer, minimum: 1, description: "Phiên bản danh mục máy đang dùng; bỏ trống = bản đã duyệt mới nhất (được ghim)"}
        admin_unit_code: {type: string, description: "Xã nơi thu"}
        plot_ref: {type: string, format: uuid}
        household_ref: {type: string, format: uuid, description: "Có → bắt buộc đồng ý mục đích mrv.evidence"}
        season_code: {type: string}
        values:
          type: object
          description: Giá trị theo khóa trường của danh mục; decimal là CHUỖI (R-10); photo là mảng file_ref
          additionalProperties: true
        file_refs: {type: array, maxItems: 20, items: {$ref: "#/components/schemas/MrvFileRef"}}
        gps: {$ref: "#/components/schemas/MrvGPS"}
        event_time: {type: string, format: date-time}
        supersedes_id: {type: string, format: uuid, description: "Bản ghi bù: id bản HIỆN HÀNH bị thay"}
        correction_reason: {type: string, minLength: 10, maxLength: 1000}
        device_id: {type: string}
    MrvEvidence:
      type: object
      required: [id, root_id, chain_version, evidence_type, catalog_version, admin_unit_code, plot_ref, household_ref, season_code, values, file_refs, gps, event_time, recorded_at, captured_by, device_id, supersedes_id, correction_reason, seq]
      properties:
        id: {type: string, format: uuid}
        root_id: {type: string, format: uuid}
        chain_version: {type: integer}
        evidence_type: {type: string}
        catalog_version: {type: integer}
        admin_unit_code: {type: string}
        plot_ref: {type: [string, "null"], format: uuid}
        household_ref: {type: [string, "null"], format: uuid}
        season_code: {type: [string, "null"]}
        values: {type: object, additionalProperties: true}
        file_refs: {type: array, items: {$ref: "#/components/schemas/MrvFileRef"}}
        gps: {oneOf: [{$ref: "#/components/schemas/MrvGPS"}, {type: "null"}]}
        event_time: {type: string, format: date-time}
        recorded_at: {type: string, format: date-time}
        captured_by: {type: string, format: uuid}
        device_id: {type: [string, "null"]}
        supersedes_id: {type: [string, "null"], format: uuid}
        correction_reason: {type: [string, "null"]}
        seq: {type: integer}
        review_status: {type: string, enum: [pending, accepted, rejected], description: "Chỉ có trong danh sách"}
        urgent: {type: boolean, description: "Chỉ có trong danh sách: bản hiện hành mang nhãn Cảnh báo khẩn (KN US-MRV-04)"}
    MrvReview:
      type: object
      required: [id, evidence_id, root_id, decision, reason, reviewer_ref, event_time, recorded_at, seq]
      properties:
        id: {type: string, format: uuid}
        evidence_id: {type: string, format: uuid}
        root_id: {type: string, format: uuid}
        decision: {type: string, enum: [accepted, rejected]}
        reason: {type: string}
        reviewer_ref: {type: string, format: uuid}
        event_time: {type: string, format: date-time}
        recorded_at: {type: string, format: date-time}
        seq: {type: integer}
    MrvEvidenceView:
      type: object
      required: [evidence, head_id, is_current, review_status, chain, reviews]
      properties:
        evidence: {$ref: "#/components/schemas/MrvEvidence"}
        head_id: {type: string, format: uuid}
        is_current: {type: boolean}
        review_status: {type: string, enum: [pending, accepted, rejected]}
        chain: {type: array, items: {$ref: "#/components/schemas/MrvEvidence"}}
        reviews: {type: array, items: {$ref: "#/components/schemas/MrvReview"}}
        urgent: {type: boolean, description: "Phiên bản đang xem mang nhãn Cảnh báo khẩn — tự bật khi vượt ngưỡng (KN US-MRV-04)"}
        alerts: {type: array, items: {$ref: "#/components/schemas/MrvAlert"}, description: "Mọi cảnh báo của chuỗi minh chứng, cũ → mới"}
    MrvAlert:
      type: object
      description: >-
        Một cảnh báo MRV (sổ pf_mrv.alert, chỉ ghi thêm). pest_urgent (mrv.pest_urgent.v1): loại sâu bệnh/thiên tai
        thuộc mrv.urgent.categories VÀ (cấp ≥ mrv.urgent.min_severity HOẶC diện tích ≥ mrv.urgent.min_area_ha);
        awd_no_infrastructure (mrv.awd_infra.v1): nhật ký App HTX có mã hoạt động thuộc mrv.awd.activity_codes mà thửa/xã
        chưa có minh chứng irrigation_infrastructure đạt (KN FR-08); review_overdue (mrv.review_overdue.v1): hồ sơ chờ
        duyệt quá mrv.review_sla_hours (level 1, người duyệt) / mrv.review_escalate_hours (level 2, quản trị TTKN tỉnh)
        (KN US-MRV-06). Mọi ngưỡng là tham số có phiên bản — TẠM, chờ khách; params ghi phiên bản đã dùng.
      required: [id, kind, level, severity, label, admin_unit_code, subject_type, subject_id, subject_root_id, plot_ref, season_ref,
        detail, params, rule_version, event_time, recorded_at, seq]
      properties:
        id: {type: string, format: uuid}
        kind: {type: string, enum: [pest_urgent, awd_no_infrastructure, review_overdue]}
        level: {type: integer, minimum: 0, maximum: 2}
        severity: {type: string, enum: [urgent, normal]}
        label: {type: string, description: "Nhãn hiển thị, vd Cảnh báo khẩn"}
        admin_unit_code: {type: string}
        subject_type: {type: string, enum: [evidence, farm_log]}
        subject_id: {type: string, format: uuid, description: "Phiên bản minh chứng hoặc log_id của nhật ký HTX"}
        subject_root_id: {type: string, format: uuid, description: "Gốc chuỗi minh chứng hoặc log_ref"}
        plot_ref: {type: [string, "null"], format: uuid}
        season_ref: {type: [string, "null"], format: uuid}
        detail: {type: object, additionalProperties: true, description: "Đầu vào đã đánh giá (không có dữ liệu cá nhân)"}
        params: {type: array, items: {$ref: "#/components/schemas/MrvParamUse"}}
        rule_version: {type: string}
        event_time: {type: string, format: date-time}
        recorded_at: {type: string, format: date-time}
        seq: {type: integer}
    MrvExportFilters:
      type: object
      properties:
        evidence_type: {type: string}
        admin_unit_codes: {type: array, items: {type: string}, description: "Bỏ trống = toàn bộ phạm vi người gọi (giải ra danh sách xã lúc yêu cầu)"}
        all_units: {type: boolean, readOnly: true, description: "Do máy chủ đặt khi phạm vi toàn quốc"}
        season_code: {type: string}
        event_from: {type: string, format: date-time}
        event_to: {type: string, format: date-time}
        review_status: {type: string, enum: [pending, accepted, rejected]}
    MrvExport:
      type: object
      required: [id, status, filters, requested_by, requested_at, object_key, package_sha256, snapshot_sha256, evidence_count, error_code, completed_at]
      properties:
        id: {type: string, format: uuid}
        status: {type: string, enum: [queued, completed, failed]}
        filters: {$ref: "#/components/schemas/MrvExportFilters"}
        requested_by: {type: string, format: uuid}
        requested_at: {type: string, format: date-time, description: "Mốc ảnh chụp dữ liệu (as_of)"}
        object_key: {type: [string, "null"]}
        package_sha256: {type: [string, "null"]}
        snapshot_sha256: {type: [string, "null"], description: "SHA-256 của JSON chuẩn hóa (khóa sắp xếp) của trường snapshot trong gói"}
        evidence_count: {type: [integer, "null"]}
        error_code: {type: [string, "null"]}
        completed_at: {type: [string, "null"], format: date-time}
    MrvSeason:
      type: object
      required: [season_ref, plot_ref, commune_code, season_code, season_year, status, sowing_date]
      properties:
        season_ref: {type: string, format: uuid}
        plot_ref: {type: string, format: uuid}
        commune_code: {type: string}
        season_code: {type: string}
        season_year: {type: integer}
        status: {type: string, enum: [open, completed, cancelled]}
        sowing_date: {type: [string, "null"], format: date}
    MrvParamUse:
      type: object
      required: [key, version, value, unit, source]
      properties:
        key: {type: string}
        version: {type: integer, description: "0 khi source = default"}
        value: {type: string, description: Số thập phân dạng chuỗi}
        unit: {type: string}
        source: {type: string, enum: [approved, default], description: "default = chưa có bản duyệt, dùng mặc định prototype (không bao giờ chính thức)"}
    MrvEstimateInput:
      type: object
      required: [evidence_ref, revision, collected_kg_bucket, bucket_rule_version, collected_on, counted, tonnes]
      properties:
        evidence_ref: {type: string, format: uuid}
        revision: {type: integer}
        collected_kg_bucket: {type: string}
        bucket_rule_version: {type: string}
        collected_on: {type: string, format: date}
        counted: {type: boolean}
        tonnes: {type: string, description: "Cận dưới bậc (t); \"0\" khi không tính"}
        exclusion: {type: string, description: "chua_co_minh_chung_dat_chuan | bac_khong_hop_le"}
    MrvEstimate:
      type: object
      required: [id, season_ref, plot_ref, commune_code, season_code, rule_version, input_sha256, counted_tonnes, avoided_burning_kgco2e,
        transport_kgco2e, transport_status, inputs, params, status, official, label, method_version_id, computed_at, recorded_at, supersedes_id, seq]
      properties:
        id: {type: string, format: uuid}
        season_ref: {type: string, format: uuid}
        plot_ref: {type: string, format: uuid}
        commune_code: {type: string}
        season_code: {type: string}
        rule_version: {type: string, examples: [mrv.co2.estimate.v1]}
        input_sha256: {type: string}
        counted_tonnes: {type: string}
        avoided_burning_kgco2e: {type: string}
        transport_kgco2e: {type: [string, "null"]}
        transport_status: {type: string, enum: [computed, no_leg_data]}
        inputs: {type: array, items: {$ref: "#/components/schemas/MrvEstimateInput"}}
        params: {type: array, items: {$ref: "#/components/schemas/MrvParamUse"}}
        status: {type: string, enum: [provisional, official]}
        official: {type: boolean}
        label: {type: string}
        method_version_id: {type: [string, "null"], format: uuid}
        computed_at: {type: string, format: date-time}
        recorded_at: {type: string, format: date-time}
        supersedes_id: {type: [string, "null"], format: uuid}
        seq: {type: integer}
    MrvCompletenessItem:
      type: object
      required: [key, source, catalog_version, status, count, approved_count]
      properties:
        key: {type: string, description: "Loại minh chứng, htx_farm_log hoặc collection_evidence"}
        source: {type: string, enum: [kn_evidence, htx_farm_log, collection_evidence]}
        catalog_version: {type: [integer, "null"]}
        status: {type: string, enum: [missing, present, approved, rejected]}
        count: {type: integer}
        approved_count: {type: integer}
    MrvCompleteness:
      type: object
      required: [season, items, counts_toward_estimate, anomaly, estimate]
      properties:
        season: {$ref: "#/components/schemas/MrvSeason"}
        items: {type: array, items: {$ref: "#/components/schemas/MrvCompletenessItem"}}
        counts_toward_estimate: {type: boolean, description: "Có minh chứng cán bộ Đạt chuẩn (KN US-MRV-05)"}
        anomaly:
          type: object
          required: [no_record, last_record_at, days_since, threshold_days]
          properties:
            no_record: {type: boolean, description: "KN FR-08: vụ đang mở, không có bản ghi mới ≥ threshold_days"}
            last_record_at: {type: [string, "null"], format: date-time}
            days_since: {type: integer}
            threshold_days: {type: integer}
        estimate:
          oneOf:
            - {$ref: "#/components/schemas/MrvEstimate"}
            - {type: "null"}
    MrvComparison:
      type: object
      required: [id, evidence_id, log_ref, log_id, season_ref, result, note, file_refs, compared_by, event_time, recorded_at, supersedes_id, correction_reason]
      properties:
        id: {type: string, format: uuid}
        evidence_id: {type: string, format: uuid}
        log_ref: {type: string, format: uuid}
        log_id: {type: string, format: uuid}
        season_ref: {type: string, format: uuid}
        result: {type: string, enum: [match, mismatch]}
        note: {type: [string, "null"]}
        file_refs: {type: array, items: {$ref: "#/components/schemas/MrvFileRef"}}
        compared_by: {type: string, format: uuid}
        event_time: {type: string, format: date-time}
        recorded_at: {type: string, format: date-time}
        supersedes_id: {type: [string, "null"], format: uuid}
        correction_reason: {type: [string, "null"]}
    MrvOfficerRecord:
      type: object
      required: [evidence_id, root_id, evidence_type, activity_code, event_time, review_status]
      properties:
        evidence_id: {type: string, format: uuid}
        root_id: {type: string, format: uuid}
        evidence_type: {type: string}
        activity_code: {type: string}
        event_time: {type: string, format: date-time}
        review_status: {type: string, enum: [pending, accepted, rejected]}
    MrvComparisonView:
      type: object
      required: [season, window_days, lines, officer_records]
      properties:
        season: {$ref: "#/components/schemas/MrvSeason"}
        window_days: {type: integer}
        officer_records: {type: array, items: {$ref: "#/components/schemas/MrvOfficerRecord"}}
        lines:
          type: array
          items:
            type: object
            required: [log_ref, log_id, log_version, activity_code, log_event_time, location_status, htx_review_decision, catalog_version,
              suggested, suggested_officer_record, result, confirmed, comparisons]
            properties:
              log_ref: {type: string, format: uuid}
              log_id: {type: string, format: uuid}
              log_version: {type: integer}
              activity_code: {type: string}
              log_event_time: {type: string, format: date-time}
              location_status: {type: string}
              htx_review_decision: {type: [string, "null"]}
              catalog_version: {type: [integer, "null"], description: "Phiên bản danh mục htx_farm_log đã duyệt được ghim lúc liên kết"}
              suggested: {type: string, enum: [match, mismatch, unverified]}
              suggested_officer_record:
                oneOf:
                  - {$ref: "#/components/schemas/MrvOfficerRecord"}
                  - {type: "null"}
              result: {type: string, enum: [match, mismatch, unverified], description: "Kết quả cán bộ xác nhận mới nhất, hoặc gợi ý"}
              confirmed: {type: boolean}
              comparisons: {type: array, items: {$ref: "#/components/schemas/MrvComparison"}}
    ContentKind:
      type: string
      enum: [procedure, guide, news, alert, supplement]
      description: procedure = quy trình kỹ thuật chuẩn quốc gia; supplement = hướng dẫn đặc thù địa phương gắn quy trình gốc; alert = cảnh báo khẩn (phát thông báo đẩy theo vùng)
    ContentAudience:
      type: object
      required: [level, units]
      properties:
        level: {type: string, enum: [national, province, commune]}
        units: {type: array, items: {type: string}, description: "Rỗng với national; [mã tỉnh] với province; mã các xã (cùng tỉnh) với commune"}
        province_code: {type: [string, "null"], description: Tỉnh sở hữu (chỉ đọc)}
    ContentDocument:
      type: object
      required: [ref, kind, audience, status, tags]
      properties:
        ref: {type: string, format: uuid}
        kind: {$ref: "#/components/schemas/ContentKind"}
        audience: {$ref: "#/components/schemas/ContentAudience"}
        parent_ref: {type: [string, "null"], format: uuid}
        status: {type: string, enum: [draft, review, published, retired]}
        title: {type: [string, "null"], description: Tiêu đề của bản xuất bản hiện hành}
        summary: {type: [string, "null"]}
        category: {type: [string, "null"]}
        tags: {type: array, items: {type: string}}
        published_version_no: {type: [integer, "null"]}
        published_at: {type: [string, "null"], format: date-time}
        publisher_ref: {type: [string, "null"], format: uuid}
        retired_at: {type: [string, "null"], format: date-time}
        retire_reason: {type: [string, "null"]}
    ContentAttachment:
      type: object
      required: [id, file_name, content_type, size, sha256, role]
      properties:
        id: {type: string, format: uuid}
        file_name: {type: string}
        content_type: {type: string, enum: [application/pdf, application/vnd.openxmlformats-officedocument.wordprocessingml.document, image/jpeg, image/png, image/webp, video/mp4]}
        size: {type: integer, maximum: 15728640}
        sha256: {type: string, pattern: "^[0-9a-f]{64}$"}
        role: {type: string, enum: [attachment, cover]}
        url: {type: [string, "null"], description: "URL tải có hạn; không ghi log (R-92)"}
        url_expires_at: {type: [string, "null"], format: date-time}
    ContentVersion:
      type: object
      required: [id, version_no, status, title, body, body_format, tags, attachments]
      properties:
        id: {type: string, format: uuid}
        version_no: {type: integer, minimum: 1}
        status: {type: string, enum: [draft, review, published, superseded, discarded, returned]}
        title: {type: string}
        summary: {type: string}
        body: {type: string, description: "Đã qua bộ lọc allow-list (không script, không on*, liên kết chỉ http/https/mailto/att:<id>). Client hiển thị Markdown ở chế độ tắt HTML thô."}
        body_format: {type: string, enum: [markdown, html]}
        category: {type: [string, "null"]}
        tags: {type: array, items: {type: string}}
        author_ref: {type: string, format: uuid}
        recorded_at: {type: string, format: date-time}
        attachments: {type: array, items: {$ref: "#/components/schemas/ContentAttachment"}}
    ContentVersionInfo:
      type: object
      required: [version_no, id, status, title, author_ref, recorded_at]
      properties:
        version_no: {type: integer}
        id: {type: string, format: uuid}
        status: {type: string, enum: [draft, review, published, superseded, discarded, returned]}
        title: {type: string}
        author_ref: {type: string, format: uuid}
        recorded_at: {type: string, format: date-time}
        published_at: {type: [string, "null"], format: date-time}
        publisher_ref: {type: [string, "null"], format: uuid}
        return_reason: {type: [string, "null"]}
    # --- hết pf/content ---

    PolygonGeometry:
      type: object
      description: GeoJSON (RFC 7946) Polygon hoặc MultiPolygon, WGS84 kinh/vĩ độ (EPSG:4326). Vòng chưa khép được tự khép. Tối thiểu 3 đỉnh phân biệt không thẳng hàng mỗi mảnh.
      required: [type, coordinates]
      properties:
        type: {type: string, enum: [Polygon, MultiPolygon]}
        coordinates: {type: array}
    # --- pf/geo G2 ---

    GeoPointGeometry:
      type: object
      description: GeoJSON Point WGS84 [kinh độ, vĩ độ]
      required: [type, coordinates]
      properties:
        type: {type: string, enum: [Point]}
        coordinates: {type: array, items: {type: number}, minItems: 2, maxItems: 3}
    GeoLineStringGeometry:
      type: object
      description: GeoJSON LineString WGS84, ≥ 2 điểm phân biệt
      required: [type, coordinates]
      properties:
        type: {type: string, enum: [LineString]}
        coordinates: {type: array, items: {type: array, items: {type: number}}}
    GeoReasonInput:
      type: object
      required: [reason]
      properties:
        reason: {type: string, minLength: 10}
    GeoCoopShapeInput:
      type: object
      required: [geometry]
      properties:
        boundary_id: {type: string, format: uuid, description: "UUIDv7 sinh trên máy; bỏ trống → server sinh"}
        geometry: {$ref: "#/components/schemas/PolygonGeometry"}
        source: {type: string, enum: [geo_web, htx_app, import_file], description: "Mặc định geo_web (quản lý HTX: htx_app)"}
        event_time: {type: string, format: date-time}
        device_id: {type: [string, "null"]}
    GeoCoopFeature:
      type: object
      required: [type, id, geometry, properties]
      properties:
        type: {type: string, enum: [Feature]}
        id: {type: string, format: uuid}
        geometry:
          oneOf:
            - $ref: "#/components/schemas/PolygonGeometry"
            - $ref: "#/components/schemas/GeoPointGeometry"
        properties:
          type: object
          required: [cooperative_ref, marker_source]
          properties:
            cooperative_ref: {type: string, format: uuid}
            code: {type: string, description: "Chỉ ở marker HTX chưa có ranh giới"}
            name: {type: string, description: "Chỉ ở marker HTX chưa có ranh giới"}
            commune_code: {type: string}
            status: {type: [string, "null"], enum: [active, retired, null], description: "null = HTX chưa có ranh giới (chỉ marker)"}
            status_reason: {type: [string, "null"]}
            version: {type: integer}
            boundary_id: {type: [string, "null"], format: uuid}
            area_ha: {$ref: "#/components/schemas/Decimal"}
            source: {type: string}
            revision: {type: integer}
            marker: {$ref: "#/components/schemas/GeoPointGeometry"}
            marker_source: {type: string, enum: [party_location, point_on_surface]}
            created_at: {type: string, format: date-time}
            updated_at: {type: string, format: date-time}
    GeoCoopBoundaryVersion:
      type: object
      required: [boundary_id, cooperative_ref, version, action, area_ha, point_count, source, commune_code, event_time, recorded_at, supersedes_id, correction_reason, actor_ref]
      properties:
        boundary_id: {type: string, format: uuid}
        cooperative_ref: {type: string, format: uuid}
        version: {type: integer}
        action: {type: string, enum: [recorded, retired, restored]}
        area_ha: {$ref: "#/components/schemas/Decimal"}
        point_count: {type: integer}
        source: {type: string, enum: [geo_web, htx_app, import_file, party_sync]}
        commune_code: {type: string}
        event_time: {type: string, format: date-time}
        recorded_at: {type: string, format: date-time}
        supersedes_id: {type: [string, "null"], format: uuid}
        correction_reason: {type: [string, "null"]}
        actor_ref: {type: string, format: uuid, description: "Người vẽ/sửa/xóa"}
        device_id: {type: [string, "null"]}
        geometry: {$ref: "#/components/schemas/PolygonGeometry"}
    GeoCoopLayer:
      type: object
      required: [type, features, truncated, limit]
      properties:
        type: {type: string, enum: [FeatureCollection]}
        features: {type: array, items: {$ref: "#/components/schemas/GeoCoopFeature"}}
        truncated: {type: boolean}
        limit: {type: integer}
    GeoCapacityThresholds:
      type: object
      required: [warn_pct, full_pct]
      properties:
        warn_pct: {$ref: "#/components/schemas/Decimal"}
        full_pct: {$ref: "#/components/schemas/Decimal"}
    GeoCapacityLatest:
      type: object
      required: [source, snapshot_id, as_of, capacity, used, unit, released, released_at]
      properties:
        source: {type: string, enum: [manual, import, valve]}
        snapshot_id: {type: string, format: uuid}
        as_of: {type: string, format: date-time}
        capacity: {$ref: "#/components/schemas/Decimal"}
        used: {$ref: "#/components/schemas/Decimal"}
        unit: {type: string, enum: [tan, m3, ke]}
        released: {type: boolean, description: "Số Admin đã được nhả (BR-52)"}
        released_at: {type: [string, "null"], format: date-time}
    GeoCapacityView:
      type: object
      description: Sức chứa hiệu lực theo BR-52 — số Admin (manual/import) mới nhất chưa nhả, nếu không có thì số của van.
      required: [capacity, used, unit, source, as_of, snapshot_id, fill_pct, class, sync_differs, pending_sync, by_source]
      properties:
        capacity: {type: [string, "null"]}
        used: {type: [string, "null"]}
        unit: {type: [string, "null"]}
        source: {type: [string, "null"], enum: [manual, import, valve, null]}
        as_of: {type: [string, "null"], format: date-time}
        snapshot_id: {type: [string, "null"], format: uuid}
        fill_pct: {type: [string, "null"]}
        class: {type: string, enum: [available, near_full, full, unknown]}
        sync_differs: {type: boolean, description: "Van có số mới hơn, khác số Admin đang áp dụng — chờ Admin xác nhận (release)"}
        pending_sync: {oneOf: [{$ref: "#/components/schemas/GeoCapacityLatest"}, {type: "null"}]}
        by_source: {type: array, items: {$ref: "#/components/schemas/GeoCapacityLatest"}}
    GeoCapacitySnapshot:
      type: object
      required: [id, subject_kind, subject_ref, seq, action, source, as_of, capacity, used, unit, recorded_at, supersedes_id, correction_reason, actor_ref]
      properties:
        id: {type: string, format: uuid}
        subject_kind: {type: string, enum: [facility, hub]}
        subject_ref: {type: string, format: uuid}
        seq: {type: integer}
        action: {type: string, enum: [snapshot, release]}
        source: {type: string, enum: [manual, import, valve]}
        as_of: {type: string, format: date-time}
        capacity: {type: [string, "null"]}
        used: {type: [string, "null"]}
        unit: {type: [string, "null"]}
        recorded_at: {type: string, format: date-time}
        supersedes_id: {type: [string, "null"], format: uuid}
        correction_reason: {type: [string, "null"]}
        actor_ref: {type: string, format: uuid}
    GeoFacilityFeature:
      type: object
      required: [type, id, geometry, properties]
      properties:
        type: {type: string, enum: [Feature]}
        id: {type: string, format: uuid}
        geometry: {$ref: "#/components/schemas/GeoPointGeometry"}
        properties:
          type: object
          required: [origin, ref, kind, code, name, unit, status, version]
          properties:
            origin: {type: string, enum: [tenant, mkg], description: "tenant = pf_geo.facility (vd kho bên thứ ba); mkg = hub MKG qua van công bố"}
            ref: {type: string, format: uuid}
            kind: {type: string, enum: [kho, hub, nha_may]}
