      description: |
        Mỗi tệp đi qua điểm kiểm soát DLP (export_audit kind dispatch). Kỳ chưa tổng hợp → 409 reports.dispatch_no_data; gsheet khi
        cờ tắt → 409 reports.gsheet_disabled. Kỳ chưa chốt/còn xã chưa nộp → tệp ghi "Tạm tính" + danh sách xã chưa nộp.
      operationId: dispCreate
