    get:
      summary: Máy móc – thiết bị (FN-05 B1) kèm tình trạng và nhãn nguồn
      operationId: mechListMachines
      parameters:
        - {name: cooperative_ref, in: query, schema: {type: string, format: uuid}}
        - {name: owner_id, in: query, schema: {type: string, format: uuid}}
        - {name: farm_stage, in: query, schema: {type: string}}
        - {name: machine_type, in: query, schema: {type: string}}
        - {name: status, in: query, schema: {$ref: "#/components/schemas/MechMachineStatus"}}
        - {name: include_inactive, in: query, schema: {type: boolean, default: false}}
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        "200":
          description: Một trang
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/MechMachine"}}
                  next_cursor: {type: [string, "null"]}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/mechanization/machines/{ref}:
    get:
      summary: Một máy
      operationId: mechGetMachine
      parameters:
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Máy
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MechMachine"}
        "404": {description: mechanization.machine_not_found, $ref: "#/components/responses/Problem"}
  /v1/mechanization/cooperatives/{ref}/machine-count:
    get:
      summary: Số máy của HTX tại một ngày trong quá khứ (FN-05 BR-09, US-MAC-03)
      description: Đếm máy có Ngày HTX sở hữu ≤ T và (chưa vô hiệu hóa hoặc Ngày vô hiệu hóa > T); tình trạng tại T đọc từ sổ biến động.
      operationId: mechMachineCount
      parameters:
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: at, in: query, required: true, schema: {type: string, format: date}}
      responses:
        "200":
          description: Số máy
          content:
            application/json:
              schema:
                type: object
                required: [cooperative_ref, at, total, active, by_stage]
                properties:
                  cooperative_ref: {type: string, format: uuid}
                  at: {type: string, format: date}
                  total: {type: integer}
                  active: {type: integer, description: "Máy \"Hoạt động\" — tính vào năng lực (FN-05 BR-04)"}
                  by_stage:
                    type: array
                    items:
                      type: object
                      required: [farm_stage, machine_type, total, by_status]
                      properties:
                        farm_stage: {type: string}
                        machine_type: {type: string}
                        total: {type: integer}
                        by_status: {type: object, additionalProperties: {type: integer}}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/mechanization/cooperatives/{ref}/panel:
    get:
      summary: Panel chi tiết HTX trên bản đồ (FN-08 B5) — máy theo khâu, chủ sở hữu (nhãn đã che), mức đáp ứng đã lưu
      operationId: mechCooperativePanel
      parameters:
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: season_code, in: query, schema: {type: string}}
        - {name: season_year, in: query, schema: {type: integer}}
        - {name: run_id, in: query, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Panel
          content:
            application/json:
              schema:
                type: object
                required: [cooperative_ref, name, commune_code, province_code, machines, coverage, run]
                properties:
                  cooperative_ref: {type: string, format: uuid}
                  name: {type: string}
                  commune_code: {type: [string, "null"]}
                  province_code: {type: [string, "null"]}
                  note: {type: string, enum: ["Chưa có máy"]}
                  machines:
                    type: array
                    items:
                      allOf:
                        - $ref: "#/components/schemas/MechMachine"
                        - type: object
                          required: [owner_code, owner_label, owner_masked_phone]
                          properties:
                            owner_code: {type: string}
                            owner_label: {type: string, description: "Nhãn đã che (mục 10.4)"}
                            owner_masked_phone: {type: string}
                  coverage: {oneOf: [{$ref: "#/components/schemas/MechCoverageItem"}, {type: "null"}]}
                  run: {oneOf: [{$ref: "#/components/schemas/MechRun"}, {type: "null"}]}
        "422": {description: mechanization.cooperative_invalid, $ref: "#/components/responses/Problem"}
  /v1/mechanization/season-areas:
    get:
      summary: Diện tích canh tác & lịch mùa vụ theo HTX × vụ, kèm nhãn nguồn [App HTX]/[Nhập tay] và cờ khóa (FN-06)
      operationId: mechListSeasonAreas
      parameters:
        - {name: season_code, in: query, required: true, schema: {type: string}}
        - {name: season_year, in: query, required: true, schema: {type: integer}}
        - {name: cooperative_ref, in: query, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Danh sách
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/MechSeasonArea"}}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/mechanization/balance-runs:
    get:
      summary: Các lần cân đối đã lưu (mới nhất trước)
      operationId: mechListBalanceRuns
      parameters:
        - {name: season_code, in: query, schema: {type: string}}
        - {name: season_year, in: query, schema: {type: integer}}
      responses:
        "200":
          description: Danh sách
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/MechRun"}}
  /v1/mechanization/balance-runs/{id}:
    get:
      summary: Một lần cân đối và các dòng HTX × khâu × chủng loại đã lưu (bất biến)
      operationId: mechGetBalanceRun
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: province_code, in: query, schema: {type: string}}
        - {name: commune_code, in: query, schema: {type: string}}
        - {name: cooperative_ref, in: query, schema: {type: string, format: uuid}}
        - {name: farm_stage, in: query, schema: {type: string}}
        - {name: machine_type, in: query, schema: {type: string}}
      responses:
        "200":
          description: Kết quả
          content:
            application/json:
              schema:
                type: object
                required: [run, results]
                properties:
                  run: {$ref: "#/components/schemas/MechRun"}
                  results: {type: array, items: {$ref: "#/components/schemas/MechResult"}}
        "404": {description: mechanization.run_not_found, $ref: "#/components/responses/Problem"}
  /v1/mechanization/coverage:
    get:
      summary: Mức đáp ứng theo tỉnh → xã → HTX, kèm màu và chú giải (FN-08, FN-10 tab Tổng hợp/Thiếu hụt)
      description: |
        Đọc lần cân đối run_id, hoặc lần mới nhất của (season_code, season_year), hoặc mới nhất mọi vụ.
        Mức của một đơn vị là mức của khâu thấp nhất; nhu cầu/năng lực là tổng. Mức đáp ứng không cắt ở 100% (Thừa ≥ ngưỡng).
      operationId: mechCoverage
      parameters:
        - {name: level, in: query, schema: {type: string, enum: [province, commune, cooperative], default: province}}
        - {name: season_code, in: query, schema: {type: string}}
        - {name: season_year, in: query, schema: {type: integer}}
        - {name: run_id, in: query, schema: {type: string, format: uuid}}
        - {name: province_code, in: query, schema: {type: string}}
        - {name: commune_code, in: query, schema: {type: string}}
        - {name: farm_stage, in: query, schema: {type: string}}
        - {name: machine_type, in: query, schema: {type: string}}
      responses:
        "200":
          description: Tổng hợp
          content:
            application/json:
              schema:
                type: object
                required: [run, level, summary, stages, items, legend]
                properties:
                  run: {$ref: "#/components/schemas/MechRun"}
                  level: {type: string}
                  summary: {$ref: "#/components/schemas/MechGroup"}
                  stages: {type: object, additionalProperties: {$ref: "#/components/schemas/MechGroup"}}
                  items: {type: array, items: {$ref: "#/components/schemas/MechCoverageItem"}}
                  legend:
                    type: array
                    items:
                      type: object
                      required: [status, label, color]
                      properties:
                        status: {$ref: "#/components/schemas/MechCoverageStatus"}
                        label: {type: string}
                        color: {type: string}
        "404": {description: mechanization.run_not_found, $ref: "#/components/responses/Problem"}
  /v1/mechanization/dashboard:
    get:
      summary: Dashboard (FN-11) — 4 thẻ chỉ số và bảng "HTX cần ưu tiên" (mức đáp ứng thấp nhất trước)
      operationId: mechDashboard
      parameters:
        - {name: season_code, in: query, schema: {type: string}}
        - {name: season_year, in: query, schema: {type: integer}}
        - {name: run_id, in: query, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Dashboard
          content:
            application/json:
              schema:
                type: object
                required: [kpis, cooperatives_by_status, priority, run]
                properties:
                  kpis:
                    type: object
                    required: [total_machines, total_cooperatives, cooperatives_sufficient, cooperatives_shortage]
                    properties:
                      total_machines: {type: integer}
                      total_cooperatives: {type: integer}
                      cooperatives_sufficient: {type: integer, description: "Đủ hoặc Thừa"}
                      cooperatives_shortage: {type: integer}
                  cooperatives_by_status: {type: object, additionalProperties: {type: integer}}
                  priority: {type: array, items: {$ref: "#/components/schemas/MechCoverageItem"}}
                  run: {oneOf: [{$ref: "#/components/schemas/MechRun"}, {type: "null"}]}
  /v1/mechanization/trend:
    get:
      summary: Xu hướng nhiều năm theo vụ đã lưu (FN-11 B3) — lần cân đối mới nhất của mỗi vụ
      operationId: mechTrend
      parameters:
        - {name: season_code, in: query, schema: {type: string}}
        - {name: farm_stage, in: query, schema: {type: string}}
      responses:
        "200":
          description: Chuỗi theo vụ
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [run, summary, stages, cooperatives_by_status]
                      properties:
                        run: {$ref: "#/components/schemas/MechRun"}
                        summary: {$ref: "#/components/schemas/MechGroup"}
                        stages: {type: object, additionalProperties: {$ref: "#/components/schemas/MechGroup"}}
                        cooperatives_by_status: {type: object, additionalProperties: {type: integer}}
  # --- hết pf/mechanization ---

  # --- pf/notify --- (ADR-0015: hộp thư trong app; đẩy CHỈ dữ liệu; đồng bộ ngay)
  /v1/notifications:
    get:
      summary: Hộp thư của người gọi (cá nhân + chủ đề theo phạm vi/vai/tổ chức), mới nhất trước
      operationId: listNotifications
      parameters:
        - {name: cursor, in: query, description: "next_cursor của trang trước", schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
        - {name: unread, in: query, description: "true = chỉ chưa đọc", schema: {type: boolean}}
      responses:
        "200":
          description: Một trang. Thông báo chủ đề cũ hơn 90 ngày không hiện.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/Notification"}}
                  next_cursor: {type: [string, "null"]}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/notifications/unread-count:
    get:
      summary: Số thông báo chưa đọc (huy hiệu)
      operationId: notificationUnreadCount
      responses:
        "200":
          description: Đếm
          content:
            application/json:
              schema: {type: object, required: [unread], properties: {unread: {type: integer, minimum: 0}}}
  /v1/notifications/read-all:
    post:
      summary: Đánh dấu đã đọc mọi thông báo người gọi thấy được
      operationId: readAllNotifications
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Số đã đánh dấu
          content:
            application/json:
              schema: {type: object, required: [marked], properties: {marked: {type: integer, minimum: 0}}}
  /v1/notifications/{id}/read:
    post:
      summary: Đánh dấu đã đọc một thông báo (đọc lại giữ read_at lần đầu)
      operationId: readNotification
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Thông báo sau khi đọc
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Notification"}
        "404": {description: "notify.notification_not_found — không có, của người khác, ngoài phạm vi", $ref: "#/components/responses/Problem"}
  /v1/devices/{id}/push-token:
    post:
      summary: Gắn/cập nhật token đẩy FCM cho thiết bị pf/sync của CHÍNH người gọi (gọi mỗi lần khởi động và khi FCM đổi token)
      operationId: registerPushToken
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - {name: id, in: path, required: true, description: "device_id đã đăng ký ở POST /v1/devices", schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PushTokenInput"}
      responses:
        "200":
          description: Đã gắn. Không trả lại token.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PushToken"}
        "403": {description: "notify.device_unregistered | notify.device_revoked", $ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "503": {description: "notify.dependency_unavailable", $ref: "#/components/responses/Problem"}
  /v1/sync/nudge:
    post:
      summary: Yêu cầu thiết bị đồng bộ ngay (US-SYNC-02) — gửi thông điệp dữ liệu {kind sync_now}
      description: |
        Vai kn_province_admin, kn_national_admin, device_admin, platform_admin. Đúng một trong device_id hoặc unit.
        unit phải trong phạm vi; device_id phải có token đang dùng và thuộc phạm vi (device_admin/platform_admin: cả tenant).
        Giới hạn: một đích mỗi 5 phút, mỗi người 30 lần/giờ → 429 + Retry-After.
      operationId: syncNudge
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/NudgeInput"}
      responses:
        "202":
          description: Đã xếp lần gửi
          content:
            application/json:
              schema: {$ref: "#/components/schemas/NudgeResult"}
        "403": {description: "forbidden | notify.out_of_scope", $ref: "#/components/responses/Problem"}
        "404": {description: "notify.nudge_target_not_found", $ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "429": {description: "notify.nudge_rate_limited (retry_after_s, header Retry-After)", $ref: "#/components/responses/Problem"}
  # --- hết pf/notify ---

  /v1/geo/conflicts/{id}:
    get:
      summary: "Chi tiết xung đột ranh giới giữ cả hai phiên bản (US-SYNC-03): bản gây xung đột, bản hiện hành, thửa bị chồng lấn — không PII"
      operationId: getBoundaryConflict
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Xung đột kèm các phiên bản
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/BoundaryConflict"
                  - type: object
                    required: [versions]
                    properties:
                      versions:
                        type: array
                        items:
                          type: object
                          required: [role, boundary_id, plot_ref, plot_code, version, area_ha, current]
                          properties:
                            role: {type: string, enum: [record, current, overlapping]}
                            boundary_id: {type: string, format: uuid}
                            plot_ref: {type: string, format: uuid}
                            plot_code: {type: string}
                            version: {type: integer}
                            area_ha: {$ref: "#/components/schemas/Decimal"}
                            current: {type: boolean}
                            geometry: {$ref: "#/components/schemas/PolygonGeometry"}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/geo/admin-boundaries:
    get:
      summary: "G-05: ranh giới hành chính hiện hành theo cấp và đơn vị cha (FeatureCollection); đơn vị chưa có hình ở missing"
      operationId: listAdminBoundaries
      parameters:
        - {name: level, in: query, required: true, schema: {type: string, enum: [province, commune]}}
        - {name: parent, in: query, schema: {type: string}, description: "Mã tỉnh; bắt buộc với level=commune"}
        - {name: zoom, in: query, schema: {type: integer, minimum: 0, maximum: 22, default: 12}}
      responses:
        "200":
          description: Ranh giới
          content:
            application/geo+json:
              schema:
                type: object
                required: [type, features, missing]
                properties:
                  type: {type: string, enum: [FeatureCollection]}
                  features:
                    type: array
                    items:
                      type: object
                      required: [type, id, geometry, properties]
                      properties:
                        type: {type: string, enum: [Feature]}
                        id: {type: string}
                        geometry: {$ref: "#/components/schemas/PolygonGeometry"}
                        properties:
                          type: object
                          required: [code, level, name, parent_code, source, area_ha, imported_at]
                          properties:
                            code: {type: string}
                            level: {type: string, enum: [province, commune]}
                            name: {type: string}
                            parent_code: {type: [string, "null"]}
                            source: {type: string}
                            area_ha: {$ref: "#/components/schemas/Decimal"}
                            imported_at: {type: string, format: date-time}
                  missing: {type: array, items: {type: string}, description: "Mã đơn vị chưa nhập ranh giới"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/mechanization/area-sync-status:
    get:
      summary: Độ tươi dữ liệu App HTX và lần đồng bộ gần nhất theo HTX của một vụ (CGH FN-07 B5, AC-03) — chỉ báo "đang dùng dữ liệu nhập tay dự phòng"
      operationId: mechAreaSyncStatus
      parameters:
        - {name: season_code, in: query, required: true, schema: {type: string}}
        - {name: season_year, in: query, required: true, schema: {type: integer}}
      responses:
        "200":
          description: Độ tươi và nhật ký mới nhất theo HTX
          content:
            application/json:
              schema:
                type: object
                required: [last_app_htx_at, threshold_hours, stale, fallback_manual, message, items]
                properties:
                  last_app_htx_at: {type: [string, "null"], format: date-time}
                  threshold_hours: {type: string, description: "cgh.area_feed_stale_hours (mặc định 48)"}
                  stale: {type: boolean}
                  fallback_manual: {type: boolean}
                  message: {type: [string, "null"]}
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/MechAreaSyncCoop"}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/mechanization/area-sync-log:
    get:
      summary: Nhật ký đồng bộ và cập nhật thủ công diện tích vụ (CGH FN-07 B5, BR-04) — Admin CGH
      operationId: mechAreaSyncLog
      parameters:
        - {name: cooperative_ref, in: query, schema: {type: string, format: uuid}}
        - {name: season_code, in: query, schema: {type: string}}
        - {name: season_year, in: query, schema: {type: integer}}
        - {name: source, in: query, schema: {type: string, enum: [app_htx, manual]}}
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        "200":
          description: Một trang nhật ký, mới nhất trước
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  next_cursor: {type: [string, "null"]}
                  items: {type: array, items: {$ref: "#/components/schemas/MechAreaSyncLog"}}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/mechanization/forecasts:
    get:
      summary: "Dự báo nhu cầu đã lưu (FN-09, cgh.forecast/v1 — phương pháp tạm, cần DCRD xác nhận); chạy qua Admin API"
      operationId: mechListForecasts
      parameters:
        - {name: season_code, in: query, schema: {type: string}}
        - {name: season_year, in: query, schema: {type: integer}}
      responses:
        "200":
          description: Các lần chạy (mới nhất trước)
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/MechForecastRun"}}
  /v1/mechanization/forecasts/{id}:
    get:
      summary: Một lần dự báo đã lưu (không tính lại) và các dòng HTX × chủng loại trong phạm vi
      operationId: mechGetForecast
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: province_code, in: query, schema: {type: string}}
        - {name: commune_code, in: query, schema: {type: string}}
        - {name: cooperative_ref, in: query, schema: {type: string, format: uuid}}
        - {name: farm_stage, in: query, schema: {type: string}}
        - {name: machine_type, in: query, schema: {type: string}}
      responses:
        "200":
          description: Dự báo
          content:
            application/json:
              schema:
                type: object
                required: [run, results, summary]
                properties:
                  run: {$ref: "#/components/schemas/MechForecastRun"}
                  results: {type: array, items: {$ref: "#/components/schemas/MechForecastResult"}}
                  summary:
                    type: object
                    required: [forecast_area_ha, required_by_stage]
                    properties:
                      forecast_area_ha: {$ref: "#/components/schemas/Decimal"}
                      required_by_stage: {type: object, additionalProperties: {type: string}}
        "404": {description: mechanization.forecast_not_found, $ref: "#/components/responses/Problem"}
  # --- hết pf/mechanization ---

  /v1/dashboard:
    get:
      summary: "G-02 (US-DASH-01): bảng điều hành gộp — KPI pf/extension + HTX/hộ pf/party + thửa số hoá pf/geo + mục tiêu diện tích; tổng = tổng các con (toàn quốc = tổng các tỉnh); thiếu báo cáo → \"Số liệu tạm tính\""
      operationId: unifiedDashboard
      parameters:
        - {name: unit, in: query, schema: {type: string}, description: "Mã tỉnh/xã; bỏ trống = toàn quốc (nếu được) hoặc đơn vị phụ trách"}
        - {name: period, in: query, schema: {type: string, pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$"}}
      responses:
        "200":
          description: Bảng điều hành
          content:
            application/json:
              schema:
                type: object
                required: [unit, level, period, as_of, total, children, sources]
                properties:
                  unit: {type: [string, "null"]}
                  level: {type: string, enum: [national, province, commune]}
                  period: {type: string}
                  as_of: {type: string, format: date-time}
                  total: {$ref: "#/components/schemas/UnifiedFigures"}
                  children:
                    type: array
                    items:
                      allOf:
                        - $ref: "#/components/schemas/UnifiedFigures"
                        - type: object
                          required: [unit, name]
                          properties:
                            unit: {type: string}
                            name: {type: [string, "null"]}
                  sources: {type: array, items: {type: string}, description: "Module đã nối vào số liệu"}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/library:
    get:
      summary: "US-LIB-05: danh mục cá nhân (tài liệu đã lưu để đọc ngoại tuyến) của người gọi, mới lưu trước"
      operationId: listLibrary
      parameters:
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        "200":
          description: Một trang
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/LibraryItem"}}
                  next_cursor: {type: [string, "null"]}
  /v1/documents/{ref}/save:
    post:
      summary: "US-LIB-05: lưu tài liệu đang hiển thị vào danh mục cá nhân (đồng bộ xuống máy qua entity library_item)"
      operationId: saveDocument
      parameters:
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                note: {type: [string, "null"], maxLength: 500}
      responses:
        "200":
          description: Đã lưu
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LibraryItem"}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/documents/{ref}/unsave:
    post:
      summary: "US-LIB-05: bỏ lưu (không xóa cứng; máy nhận tombstone library_item)"
      operationId: unsaveDocument
      parameters:
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Đã bỏ lưu
          content:
            application/json:
              schema:
                type: object
                required: [document_ref, saved, removed_at]
                properties:
                  document_ref: {type: string, format: uuid}
                  saved: {type: boolean}
                  removed_at: {type: string, format: date-time}
        "404": {description: content.library_item_not_found, $ref: "#/components/responses/Problem"}
  # --- pf/reports: mẫu biểu, xuất Excel/PDF bất đồng bộ (mục 12, R-52), điểm kiểm soát xuất dữ liệu (mục 18) ---

  # Mẫu và lịch gửi quản trị qua Admin API (admin.yaml). Mọi yêu cầu xuất và cấp URL tải đi qua MỘT điểm kiểm soát:

  # nhật ký (không PII), hạn mức ngày reports.daily_export_quota (mặc định 50) → 429, vượt reports.export_anomaly_threshold

  # → sự kiện pf.reports.export.anomaly. Số liệu CGH lấy từ kết quả cân đối ĐÃ LƯU (FN-10 BR-04), không tính lại.
  /v1/reports/templates:
    get:
      summary: Mẫu báo cáo đang dùng mà vai của người gọi được xuất (mẫu hệ thống = phiên bản 0)
      operationId: listReportTemplates
      tags: [reports]
      responses:
        "200":
          description: Danh sách mẫu
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/ReportTemplate"}}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/reports/exports:
    get:
      summary: Lịch sử xuất của CHÍNH người gọi (kể cả việc của lịch gửi họ sở hữu), mới nhất trước
      description: Phân trang cursor (R-53). downloadable = true khi việc đã xong và có tệp — tải qua GET /v1/reports/exports/{id}/download.
      operationId: listMyReportExports
      tags: [reports]
      parameters:
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        "200":
          description: Một trang
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items:
                      allOf:
                        - $ref: "#/components/schemas/ReportExport"
                        - type: object
                          required: [downloadable]
                          properties:
                            downloadable: {type: boolean}
                  next_cursor: {type: [string, "null"]}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
    post:
      summary: Yêu cầu xuất báo cáo (Excel/PDF) — 202 + việc xuất; worker dựng tệp. Phạm vi giải lúc yêu cầu (ADR-0009)
      description: >-
        Mẫu htx.production (nguồn cropcycle.production — HTX US-DASH-02): sản lượng dự kiến – thực tế, diện tích, số nông hộ,
        tiến độ SOP theo HTX × vụ × giống, cùng số liệu bảng điều hành GET /v1/cropcycle/dashboard. Quản lý HTX chỉ xuất HTX
        của mình (params.cooperative_ref được gán); cán bộ KN theo phạm vi xã/tỉnh; platform_admin toàn bộ.
      operationId: requestReportExport
      tags: [reports]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [template_key, format]
              properties:
                template_key: {type: string, examples: [kn.sowing_progress, cgh.shortage_by_coop]}
                format: {type: string, enum: [xlsx, pdf]}
                params: {$ref: "#/components/schemas/ReportParams"}
      responses:
        "202":
          description: Đã nhận; theo dõi tại Location
          headers:
            Location: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ReportExport"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "429": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
  /v1/reports/exports/{id}:
    get:
      summary: Trạng thái việc xuất (người yêu cầu, hoặc người có phạm vi bao trọn)
      operationId: getReportExport
      tags: [reports]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Việc xuất
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ReportExport"}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/reports/exports/{id}/download:
    get:
      summary: URL tải tệp có hạn (10 phút; không ghi log) — qua điểm kiểm soát xuất dữ liệu
      operationId: downloadReportExport
      tags: [reports]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: URL có chữ ký
          content:
            application/json:
              schema:
                type: object
                required: [export_id, url, expires_at, file_name, content_type, sha256]
                properties:
                  export_id: {type: string, format: uuid}
                  url: {type: string}
                  expires_at: {type: string, format: date-time}
                  file_name: {type: string}
                  content_type: {type: string}
                  sha256: {type: string}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
  /v1/reports/recipients:
    get:
      summary: Người nhận chọn được cho lịch báo cáo của quản lý HTX — tài khoản đang bật, email đã xác minh, thuộc HTX của người gọi (HTX US-DASH-03)
      description: "Chỉ quản lý HTX (coop_manager, không kèm vai KN). Email đã che; địa chỉ đầy đủ chỉ tra lúc gửi. Cache-Control no-store."
      operationId: listReportRecipients
      tags: [reports]
      responses:
        "200":
          description: Danh sách
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [actor_ref, display_name, masked_email]
                      properties:
                        actor_ref: {type: string, format: uuid}
                        display_name: {type: string}
                        masked_email: {type: string, examples: ["ke•••@htx.vn"]}
        "403": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
  /v1/reports/schedules:
    get:
      summary: Lịch gửi báo cáo HTX của quản lý HTX (HTX US-DASH-03) — chỉ HTX của mình
      description: Chỉ quản lý HTX; cán bộ KN, Admin CGH, quản trị dùng Admin API (MFA) → 403 ở đây.
      operationId: listCoopReportSchedules
      tags: [reports]
      responses:
        "200":
          description: Danh sách
          content:
            application/json:
              schema: {type: object, required: [items], properties: {items: {type: array, items: {$ref: "#/components/schemas/ReportSchedule"}}}}
        "403": {$ref: "#/components/responses/Problem"}
    post:
      summary: Quản lý HTX lập lịch gửi báo cáo HTX (tuần/tháng, giờ Việt Nam) tới tài khoản của HTX (HTX US-DASH-03)
      description: |
        Mẫu HTX (vd htx.production); params.cooperative_ref luôn là HTX của người lập. `recipients` phải thuộc
        `GET /v1/reports/recipients` — khác → 422 reports.recipient_not_in_cooperative
        ("Email đăng ký nhận báo cáo không hợp lệ hoặc gửi thất bại, vui lòng kiểm tra lại."). Mẫu không phải HTX → 403.
      operationId: createCoopReportSchedule
      tags: [reports]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ReportScheduleInput"}
      responses:
        "201":
          description: Đã lập lịch
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ReportSchedule"}
        "200":
          description: Gọi lặp cùng Idempotency-Key
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ReportSchedule"}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
  /v1/reports/schedules/{id}/deactivate:
    post:
      summary: Quản lý HTX ngừng lịch kèm lý do (không xóa; lịch sử chạy giữ nguyên)
      operationId: deactivateCoopReportSchedule
      tags: [reports]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [reason], properties: {reason: {type: string, minLength: 10, maxLength: 500}}}
      responses:
        "200":
          description: Lịch
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ReportSchedule"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/reports/schedules/{id}/runs:
    get:
      summary: Các lần chạy của lịch HTX kèm kết quả gửi email (AC-2 — người lập thấy lần gửi bị bỏ/thiếu email)
      operationId: listCoopReportScheduleRuns
      tags: [reports]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Lần chạy
          content:
            application/json:
              schema: {type: object, required: [items], properties: {items: {type: array, items: {$ref: "#/components/schemas/ReportScheduleRun"}}}}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
  # --- hết pf/reports ---

  # --- pf/waterway: lớp đường thủy đã phát hành và định tuyến theo tải trọng (GIS US-WATER-01, FN-09 BR-37/38; mục 16) ---
  /v1/waterway/segments:
    get:
      summary: Tuyến sông/kênh của phiên bản mạng đã phát hành, đánh dấu tuyến phù hợp tải trọng sà lan — GIS US-WATER-01
      description: |
        Mọi người dùng đã xác thực của tenant. Tuyến nháp không bao giờ xuất hiện. `passable` = tải trọng lưu thông suy ra
        (rộng/sâu/công trình, có biên an toàn) ≥ `min_load_tons`; tuyến thiếu số liệu không được coi là đi được.
        AC-2: `passable_count = 0` khi có `min_load_tons` → `message` "Không tìm thấy tuyến…". Chưa phát hành → `version_no = null`, `items` rỗng.
      operationId: listWaterwayLayer
      tags: [waterway]
      parameters:
        - {name: bbox, in: query, description: "minLng,minLat,maxLng,maxLat", schema: {type: string}}
        - {name: min_load_tons, in: query, schema: {type: string, pattern: "^[0-9]+(\\.[0-9]+)?$"}}
        - {name: version, in: query, description: "Ghim phiên bản đã từng phát hành; mặc định phiên bản đang có hiệu lực", schema: {type: integer, minimum: 1}}
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        "200":
          description: Một trang (theo segment_ref)
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor, total, passable_count, min_load_tons, version_no, message]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/WaterwayLayerSegment"}}
                  next_cursor: {type: [string, "null"]}
                  total: {type: integer, description: "Số tuyến trong khung (mọi trang)"}
                  passable_count: {type: integer, description: "Số tuyến phù hợp tải trọng trong khung (mọi trang)"}
                  min_load_tons: {type: string}
                  version_no: {type: [integer, "null"]}
                  message: {type: [string, "null"]}
        "404": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/waterway/routes:
    get:
      summary: Đường thủy ngắn nhất trong số các tuyến ĐI ĐƯỢC với tải trọng yêu cầu (pgr_dijkstra trên phiên bản mạng)
      description: |
        Trả hình học đường đi, km (gồm chặng tiếp cận), nhãn nguồn tính (routed | digitised | haversine — Simulation FN-04 BR-04),
        phiên bản mạng đã dùng và ràng buộc bất lợi nhất trên đường. Không có đường thủy (chưa phát hành, ngoài bán kính tiếp cận,
        không liên thông, không đủ tải trọng) → `found = false`, khoảng cách Haversine × hệ số #10 kèm `reason`.
      operationId: routeWaterway
      tags: [waterway]
      parameters:
        - {name: from, in: query, required: true, description: "lat,lng", schema: {type: string}}
        - {name: to, in: query, required: true, description: "lat,lng", schema: {type: string}}
        - {name: min_load_tons, in: query, schema: {type: string, pattern: "^[0-9]+(\\.[0-9]+)?$"}}
        - {name: version, in: query, schema: {type: integer, minimum: 1}}
      responses:
        "200":
          description: Kết quả định tuyến
          content:
            application/json:
              schema: {$ref: "#/components/schemas/WaterwayRoute"}
        "404": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/waterway/networks/current:
    get:
      summary: Phiên bản mạng đang có hiệu lực (để ghim vào kịch bản)
      operationId: getCurrentWaterwayNetwork
      tags: [waterway]
      responses:
        "200":
          description: Phiên bản
          content:
            application/json:
              schema: {$ref: "#/components/schemas/WaterwayNetworkSummary"}
        "404": {$ref: "#/components/responses/Problem"}
  # --- hết pf/waterway ---

  # --- G2: pf/accounts (tài khoản nông dân App HTX), pf/party, pf/extension (yêu cầu hỗ trợ) ---
  /v1/farmer-accounts:
    get:
      summary: Tài khoản nông dân của một HTX (HTX US-ACC-01) — không dữ liệu cá nhân
      description: Vai coop_manager (mặc định HTX của mình, không xem HTX khác), kn_officer/kn_province_admin (trong phạm vi), platform_admin.
      operationId: listFarmerAccounts
      tags: [accounts]
      parameters:
        - {name: cooperative_ref, in: query, schema: {type: string, format: uuid}}
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        "200":
          description: Một trang
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/FarmerAccount"}}
                  next_cursor: {type: [string, "null"]}
        "403": {description: "accounts.out_of_scope", $ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
    post:
      summary: Tạo tài khoản nông dân cho nông hộ của HTX (HTX US-ACC-01, US-LOGIN-01) và phát lượt kích hoạt QR/liên kết một lần
      description: |
        Tên đăng nhập = SĐT chuẩn hóa 0xxxxxxxxx; SĐT phải là SĐT chủ hộ trong kho định danh (household_ref bỏ trống → tra theo SĐT).
        Vai farmer, required action UPDATE_PASSWORD, KHÔNG org_ref, không mật khẩu, không email/SMS (g2-conventions §1).
        activation.link chỉ có ở phản hồi đầu (Cache-Control no-store); gọi lặp cùng Idempotency-Key trả bản đã lược liên kết.
      operationId: createFarmerAccount
      tags: [accounts]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                household_ref: {type: [string, "null"], format: uuid}
                phone: {type: string, description: "SĐT chủ hộ (0xxxxxxxxx hoặc +84…)"}
                full_name: {type: string}
      responses:
        "201":
          description: Đã tạo
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FarmerCreated"}
        "200":
          description: Phát lại (không có liên kết)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FarmerCreated"}
        "403": {description: "forbidden | accounts.out_of_scope", $ref: "#/components/responses/Problem"}
        "409": {description: "accounts.farmer_exists | accounts.phone_taken | accounts.org_inactive", $ref: "#/components/responses/Problem"}
        "422": {description: "accounts.household_invalid | accounts.phone_household_mismatch", $ref: "#/components/responses/Problem"}
        "503": {description: "accounts.dependency_unavailable", $ref: "#/components/responses/Problem"}
  /v1/farmer-accounts/import:
    post:
      summary: Nhập tài khoản nông dân hàng loạt từ CSV/XLSX (HTX US-ACC-02) — kết quả theo từng dòng, dòng hợp lệ nhận liên kết kích hoạt
      description: Cột phone (SĐT, bắt buộc), household_ref (Mã nông hộ, tùy chọn), full_name (Họ tên). Tối đa 200 dòng, 2 MB.
      operationId: importFarmerAccounts
      tags: [accounts]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          text/csv: {schema: {type: string, format: binary}}
          application/vnd.openxmlformats-officedocument.spreadsheetml.sheet: {schema: {type: string, format: binary}}
      responses:
        "200":
          description: Kết quả
          content:
            application/json:
              schema:
                type: object
                required: [created, rejected, rows]
                properties:
                  created: {type: integer}
                  rejected: {type: integer}
                  rows:
                    type: array
                    items:
                      type: object
                      required: [row, status]
                      properties:
                        row: {type: integer}
                        status: {type: string, enum: [created, rejected]}
                        reason: {type: [string, "null"]}
                        user_ref: {type: [string, "null"], format: uuid}
                        household_ref: {type: [string, "null"], format: uuid}
                        activation: {oneOf: [{$ref: "#/components/schemas/FarmerActivation"}, {type: "null"}]}
        "422": {description: "accounts.import_invalid", $ref: "#/components/responses/Problem"}
  /v1/farmer-accounts/{id}/activation:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}, description: "user_ref (id Keycloak) của nông dân"}
    get:
      summary: Lượt kích hoạt của tài khoản nông dân — chỉ siêu dữ liệu (ai phát, lúc nào, hạn, đã dùng/thu hồi)
      operationId: listFarmerActivations
      tags: [accounts]
      responses:
        "200":
          description: Mới nhất trước
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_ref: {type: string, format: uuid}
                  items: {type: array, items: {$ref: "#/components/schemas/FarmerGrant"}}
        "404": {description: "accounts.farmer_not_found", $ref: "#/components/responses/Problem"}
    post:
      summary: Phát lại liên kết/QR kích hoạt (mất QR, hết hạn, quên mật khẩu) — lượt đang mở bị thu hồi (reissued)
      operationId: reissueFarmerActivation
      tags: [accounts]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "201":
          description: Lượt mới (link chỉ có ở phản hồi đầu)
          content:
            application/json:
              schema:
                type: object
                properties:
                  activation: {$ref: "#/components/schemas/FarmerActivation"}
        "404": {description: "accounts.farmer_not_found", $ref: "#/components/responses/Problem"}
        "409": {description: "accounts.state_conflict — tài khoản đang khóa", $ref: "#/components/responses/Problem"}
        "503": {description: "accounts.activation_link_unavailable", $ref: "#/components/responses/Problem"}
  /v1/farmer/households:
    get:
      summary: Nông hộ liên kết với tài khoản nông dân gọi (vai farmer)
      operationId: myFarmerHouseholds
      tags: [accounts]
      responses:
        "200":
          description: Danh sách
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        household_ref: {type: string, format: uuid}
                        cooperative_ref: {type: string, format: uuid}
                        commune_code: {type: string}
  /v1/farmer/coop-staff:
    get:
      summary: Danh bạ cán bộ HTX của nông dân, tìm theo tên hoặc chức vụ (HTX US-SUPPORT-02) — không có SĐT
      operationId: farmerCoopStaff
      tags: [accounts]
      parameters:
        - {name: q, in: query, schema: {type: string}, description: "Tên hoặc chức vụ, không phân biệt dấu"}
      responses:
        "200":
          description: Danh sách (Cache-Control private, no-store)
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        user_ref: {type: string, format: uuid}
                        cooperative_ref: {type: string, format: uuid}
                        display_name: {type: string}
                        title: {type: string}
                        has_phone: {type: boolean, description: "false → ẩn nút gọi nhanh (AC-2)"}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/farmer/coop-staff/{id}/contact:
    get:
      summary: SĐT của cán bộ HTX lúc bấm gọi/copy (HTX US-SUPPORT-02 AC-1) — đọc từ Keycloak, không lưu, Cache-Control no-store
      operationId: farmerCoopStaffContact
      tags: [accounts]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: SĐT
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_ref: {type: string, format: uuid}
                  phone: {type: string}
        "404": {description: "accounts.staff_not_found | accounts.contact_unavailable", $ref: "#/components/responses/Problem"}
  /v1/households/{ref}/membership:
    post:
      summary: Nông hộ vào / chuyển / rời HTX (KN US-HTX-02, US-HTX-05) — phát pf.party.household.membership_changed
      description: |
        cooperative_ref null = rời HTX. Quản lý HTX chỉ cho hộ (chưa thuộc HTX nào) vào HTX của mình hoặc rời HTX của mình;
        cán bộ KN/quản trị trong phạm vi. Lý do 10–500 ký tự (không đi vào sự kiện). effective_date mặc định hôm nay (giờ VN).
      operationId: changeHouseholdMembership
      tags: [party]
      parameters:
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                cooperative_ref: {type: [string, "null"], format: uuid}
                effective_date: {type: string, format: date}
                reason: {type: string, minLength: 10, maxLength: 500}
      responses:
        "200":
          description: Đã đổi
          content:
            application/json:
              schema:
                type: object
                properties:
                  household: {$ref: "#/components/schemas/Household"}
                  change: {type: string, enum: [joined, left, transferred]}
                  prev_cooperative_ref: {type: [string, "null"], format: uuid}
        "403": {description: "party.out_of_scope", $ref: "#/components/responses/Problem"}
        "404": {description: "party.household_not_found", $ref: "#/components/responses/Problem"}
        "409": {description: "party.membership_unchanged | party.org_state_conflict", $ref: "#/components/responses/Problem"}
        "422": {description: "party.membership_reason_required", $ref: "#/components/responses/Problem"}
  /v1/support-requests:
    get:
      summary: Yêu cầu hỗ trợ của (các) nông hộ của nông dân, kèm trạng thái nhiệm vụ (HTX US-SUPPORT-01)
      operationId: listMySupportRequests
      tags: [extension]
      parameters:
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        "200":
          description: Mới nhất trước
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/SupportRequest"}}
                  next_cursor: {type: [string, "null"]}
        "403": {description: "forbidden | extension.farmer_household_required", $ref: "#/components/responses/Problem"}
    post:
      summary: Nông dân gửi yêu cầu hỗ trợ (HTX US-SUPPORT-01) — cùng giao dịch tự sinh nhiệm vụ cho cán bộ khuyến nông (KN US-TASK-01)
      description: |
        Vai farmer. Người nhận: cán bộ xã đang trực → cán bộ tỉnh đang trực → cán bộ tỉnh → để trống (admin_queue, báo quản trị tỉnh).
        Thiếu vị trí GPS vẫn nhận (nhãn "Thiếu vị trí GPS"). Ngoại tuyến: gửi qua pf/sync entity support_request (cùng payload).
      operationId: submitSupportRequest
      tags: [extension]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SupportRequestInput"}
      responses:
        "201":
          description: Đã nhận, nhiệm vụ đã sinh
          content:
            application/json:
              schema:
                type: object
                properties:
                  support_request: {$ref: "#/components/schemas/SupportRequest"}
                  replayed: {type: boolean}
        "403": {description: "forbidden | extension.farmer_household_required", $ref: "#/components/responses/Problem"}
        "409": {description: "extension.id_reused", $ref: "#/components/responses/Problem"}
        "422": {description: "validation_failed (\"Vui lòng nhập mô tả và chọn loại sự cố trước khi gửi.\", tối đa 5 ảnh) | extension.household_invalid", $ref: "#/components/responses/Problem"}
        "503": {description: "extension.dependency_unavailable", $ref: "#/components/responses/Problem"}
  # --- hết G2 ---

  # --- pf/simulation ---
  /v1/candidate-hubs:
    post:
      summary: Tạo Hub ứng viên (CGH FN-02)
      operationId: createCandidateHub
      tags: [simulation]
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, location]
              properties:
                name: {type: string, minLength: 2, maxLength: 200}
                location: {$ref: "#/components/schemas/SimLatLng"}
                unit_code: {type: string}
      responses:
        "201": {description: Hub đã tạo, content: {application/json: {schema: {$ref: "#/components/schemas/SimCandidateHub"}}}}
        "200": {description: Gọi lặp, content: {application/json: {schema: {$ref: "#/components/schemas/SimCandidateHub"}}}}
        "422": {$ref: "#/components/responses/Problem"}
    get:
      summary: Liệt kê Hub ứng viên (cursor theo mã)
      operationId: listCandidateHubs
      tags: [simulation]
      parameters:
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200}}
      responses:
        "200":
          description: Trang Hub
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/SimCandidateHub"}}
                  next_cursor: {type: [string, "null"]}
  /v1/candidate-hubs/{id}/retire:
    post:
      summary: Ngừng dùng Hub ứng viên kèm lý do (không xóa)
      operationId: retireCandidateHub
      tags: [simulation]
      parameters:
        - {$ref: "#/components/parameters/IdempotencyKey"}
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/SimReason"}}}}
      responses:
        "200": {description: Hub, content: {application/json: {schema: {$ref: "#/components/schemas/SimCandidateHub"}}}}
        "404": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/scenarios:
    post:
      summary: Tạo kịch bản chọn Hub
      operationId: createScenario
      tags: [simulation]
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, plant, reference_year]
              properties:
                name: {type: string, minLength: 2, maxLength: 200}
                plant: {$ref: "#/components/schemas/SimPlant"}
                lifecycle_years: {type: integer, minimum: 0, maximum: 50, description: "0/không gửi = tham số #47"}
                discounted: {type: boolean}
                baseline_mode: {type: string, enum: [no_hub, manual, scenario]}
                baseline_manual_cost_per_ton: {type: [string, "null"]}
                baseline_scenario_id: {type: [string, "null"], format: uuid}
                reference_year: {type: integer, minimum: 2000, maximum: 2100}
      responses:
        "201": {description: Kịch bản, content: {application/json: {schema: {$ref: "#/components/schemas/SimScenario"}}}}
        "200": {description: Gọi lặp, content: {application/json: {schema: {$ref: "#/components/schemas/SimScenario"}}}}
        "422": {$ref: "#/components/responses/Problem"}
    get:
      summary: Liệt kê kịch bản của tenant kèm Hub đang gán (cursor theo mã) — màn hình mô phỏng web
      operationId: listScenarios
      tags: [simulation]
      parameters:
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200}}
      responses:
        "200":
          description: Trang kịch bản
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/SimScenario"}}
                  next_cursor: {type: [string, "null"]}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/scenarios:compare:
    post:
      summary: So sánh kết quả mô phỏng (CGH FN-14) — xếp theo TCO/tấn, cột No-Hub Baseline
      operationId: compareScenarios
      tags: [simulation]
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [simulation_ids]
              properties:
                simulation_ids: {type: array, minItems: 1, maxItems: 20, items: {type: string, format: uuid}}
                include_baseline: {type: boolean, default: true}
      responses:
        "200":
          description: Bảng so sánh (blocked khác null khi khác vòng đời/chế độ chiết khấu — BR-02)
          content:
            application/json:
              schema:
                type: object
                required: [rows, sorted_by, blocked, warnings]
                properties:
                  rows: {type: array, items: {$ref: "#/components/schemas/SimCompareRow"}}
                  sorted_by: {type: string}
                  blocked: {type: [string, "null"]}
                  warnings: {type: array, items: {type: string}}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/scenarios/{id}:
    get:
      summary: Đọc kịch bản kèm Hub đang gán
      operationId: getScenario
      tags: [simulation]
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        "200": {description: Kịch bản, content: {application/json: {schema: {$ref: "#/components/schemas/SimScenario"}}}}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/scenarios/{id}/history:
    get:
      summary: Sổ thay đổi kịch bản (kiểm toán, bản ghi bù)
      operationId: getScenarioHistory
      tags: [simulation]
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        "200":
          description: Dòng sổ theo seq
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/SimChange"}}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/scenarios/{id}/hubs:
    post:
      summary: Gán Hub vào kịch bản hoặc sửa cấu hình (trường không gửi giữ nguyên, FN-02 BR-03)
      operationId: attachScenarioHub
      tags: [simulation]
      parameters:
        - {$ref: "#/components/parameters/IdempotencyKey"}
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hub_id]
              properties:
                hub_id: {type: string, format: uuid}
                service_radius_km: {type: string}
                design_capacity_tons: {type: string, description: "TỒN KHO TỐI ĐA (tấn)"}
                barge_payload_tons: {type: string}
                mode_field_hub: {type: string, enum: [auto, road, waterway]}
                mode_hub_plant: {type: string, enum: [auto, road, waterway]}
                land_mode: {type: string, enum: [mua, thue]}
      responses:
        "200": {description: Kịch bản, content: {application/json: {schema: {$ref: "#/components/schemas/SimScenario"}}}}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/scenarios/{id}/hubs/{hub_id}/detach:
    post:
      summary: Gỡ Hub khỏi kịch bản bằng bản ghi bù kèm lý do
      operationId: detachScenarioHub
      tags: [simulation]
      parameters:
        - {$ref: "#/components/parameters/IdempotencyKey"}
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: hub_id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/SimReason"}}}}
      responses:
        "200": {description: Kịch bản, content: {application/json: {schema: {$ref: "#/components/schemas/SimScenario"}}}}
        "404": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/simulations:
    post:
      summary: Chạy mô phỏng (mục 12) — 202 + Location /v1/jobs/{id}; ảnh chụp dựng ở worker, optimizer tính
      operationId: submitSimulation
      tags: [simulation]
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scenario_id]
              properties:
                scenario_id: {type: string, format: uuid}
                sensitivity: {type: boolean, description: "FN-18: chạy kèm độ nhạy (bộ mặc định)"}
                sensitivity_codes: {type: array, items: {type: string}}
                mode: {type: string, enum: [evaluate, select_hubs], description: "select_hubs: THỬ NGHIỆM (MILP)"}
                max_hubs: {type: [integer, "null"], minimum: 1}
      responses:
        "202":
          description: Đã nhận
          headers: {Location: {schema: {type: string}}}
          content: {application/json: {schema: {$ref: "#/components/schemas/SimSimulation"}}}
        "404": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/simulations/{id}:
    get:
      summary: Trạng thái mô phỏng, ảnh chụp đã ghim, cờ Chính thức
      operationId: getSimulation
      tags: [simulation]
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        "200": {description: Mô phỏng, content: {application/json: {schema: {$ref: "#/components/schemas/SimSimulation"}}}}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/simulations/{id}/result:
    get:
      summary: Kết quả bất biến (khối result của contracts/optimizer/result.v1) kèm độ nhạy
      operationId: getSimulationResult
      tags: [simulation]
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        "200":
          description: Kết quả
          content:
            application/json:
              schema:
                type: object
                required: [simulation_id, scenario_id, status, official, official_eligible, engine_version, algorithm_version, result_sha256, received_at, result]
                properties:
                  simulation_id: {type: string, format: uuid}
                  scenario_id: {type: string, format: uuid}
                  status: {type: string, enum: [tham_khao, chinh_thuc]}
                  official: {type: boolean}
                  official_eligible: {type: boolean}
                  snapshot: {$ref: "#/components/schemas/SimSnapshotMeta"}
                  engine_version: {type: string}
                  algorithm_version: {type: string}
                  result_sha256: {type: string}
                  received_at: {type: string, format: date-time}
                  result: {type: object, additionalProperties: true}
                  sensitivity: {type: [object, "null"], additionalProperties: true}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
  /v1/simulations/{id}/mark-official:
    post:
      summary: Đánh dấu Chính thức — chỉ khi mọi tham số của ảnh chụp đã phê duyệt (FN-01 BR-04)
      operationId: markSimulationOfficial
      tags: [simulation]
      parameters:
        - {$ref: "#/components/parameters/IdempotencyKey"}
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200": {description: Mô phỏng, content: {application/json: {schema: {$ref: "#/components/schemas/SimSimulation"}}}}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
  /v1/jobs/{id}:
    get:
      summary: Trạng thái việc dài (R-52) — hiện phục vụ việc mô phỏng (id việc = id mô phỏng)
      operationId: getJob
      tags: [simulation]
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        "200":
          description: Việc
          content:
            application/json:
              schema:
                type: object
                required: [id, kind, status, requested_at, links]
                properties:
                  id: {type: string, format: uuid}
                  kind: {type: string, enum: [simulation]}
                  status: {type: string, enum: [queued, running, completed, failed]}
                  error_code: {type: [string, "null"]}
                  requested_at: {type: string, format: date-time}
                  completed_at: {type: [string, "null"], format: date-time}
                  links: {type: object, additionalProperties: {type: string}}
        "404": {$ref: "#/components/responses/Problem"}
  # --- hết pf/simulation ---

  # --- pf/cropcycle (App HTX: SOP, vụ, nhật ký, sản lượng, bảng điều hành) ---
  /v1/cropcycle/sops:
    get:
      summary: Mẫu SOP đã ban hành nhìn thấy được (hệ thống + riêng của HTX người gọi)
      operationId: listCropSOPs
      parameters:
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        "200":
          description: Một trang
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/CropSOPTemplate"}}
                  next_cursor: {type: [string, "null"]}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/cropcycle/sops/{ref}:
    get:
      summary: Mẫu SOP kèm các phiên bản ĐÃ PHÁT HÀNH
      operationId: getCropSOP
      parameters:
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200": {description: Mẫu, content: {application/json: {schema: {$ref: "#/components/schemas/CropSOP"}}}}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/cropcycle/sop-versions/{id}:
    get:
      summary: Một phiên bản SOP đã phát hành (bước, mốc thu hoạch)
      operationId: getCropSOPVersion
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Phiên bản
          content:
            application/json:
              schema:
                type: object
                required: [version, template]
                properties:
                  version: {$ref: "#/components/schemas/CropSOPVersion"}
                  template: {$ref: "#/components/schemas/CropSOPTemplate"}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/cropcycle/variety-bindings:
    get:
      summary: Gắn giống lúa ↔ mẫu SOP mặc định (tự gán khi mở vụ, HTX US-SEASON-01 AC-1)
      operationId: listCropVarietyBindings
      responses:
        "200":
          description: Danh sách
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/CropVarietyBinding"}}
  /v1/cropcycle/seasons:
    post:
      summary: Mở vụ cho một thửa (nông dân tự mở; quản lý HTX mở hộ) — HTX US-SEASON-01/03/04
      description: |
        Ngày sạ trong [hôm nay − 15, hôm nay + 30] (giờ Việt Nam). SOP tự gán theo giống nếu không chỉ định.
        `copy_previous: true` lấy giống + SOP của vụ vừa hoàn thành (chặn nếu vụ gần nhất chưa hoàn thành).
        Mỗi thửa tối đa một vụ đang mở. GPS thiếu/lệch không chặn lưu (nhãn `location_status`).
      operationId: openCropSeason
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/CropSeasonOpenInput"}}}
      responses:
        "201": {$ref: "#/components/responses/CropSeasonWritten"}
        "403": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
    get:
      summary: Vụ trong phạm vi (nông dân — hộ mình; quản lý HTX — HTX mình; KN — xã; quản trị — tất cả)
      operationId: listCropSeasons
      parameters:
        - {name: cooperative_ref, in: query, schema: {type: string, format: uuid}}
        - {name: plot_ref, in: query, schema: {type: string, format: uuid}}
        - {name: status, in: query, schema: {type: string, enum: [open, completed, cancelled]}}
        - {name: season_code, in: query, schema: {type: string}}
        - {name: season_year, in: query, schema: {type: integer}}
        - {name: variety_code, in: query, schema: {type: string}}
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        "200":
          description: Một trang
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/CropSeason"}}
                  next_cursor: {type: [string, "null"]}
  /v1/cropcycle/seasons/bulk-open:
    post:
      summary: Mở vụ hàng loạt (quản lý HTX) — thửa lỗi bị bỏ qua kèm lý do (HTX US-SEASON-02, US-SEASON-04 AC-2)
      operationId: bulkOpenCropSeasons
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plot_refs, season_code, season_year, variety_code, sowing_date]
              properties:
                plot_refs: {type: array, maxItems: 200, items: {type: string, format: uuid}}
                season_code: {type: string}
                season_year: {type: integer}
                variety_code: {type: string}
                sowing_date: {type: string, format: date}
                sop_version_id: {type: [string, "null"], format: uuid}
      responses:
        "200":
          description: Kết quả theo thửa
          content:
            application/json:
              schema:
                type: object
                required: [opened, skipped, items]
                properties:
                  opened: {type: integer}
                  skipped: {type: integer}
                  items:
                    type: array
                    items:
                      type: object
                      required: [plot_ref, status]
                      properties:
                        plot_ref: {type: string, format: uuid}
                        status: {type: string, enum: [opened, skipped]}
                        season_ref: {type: string, format: uuid}
                        code: {type: string}
                        reason: {type: string, description: "vd \"Lô đang canh tác vụ khác\", \"Lô không thuộc quyền quản lý\""}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/cropcycle/seasons/{ref}:
    get:
      summary: Vụ kèm lịch sử sự kiện, bước SOP đã ghim, tiến độ và sản lượng
      operationId: getCropSeason
      parameters:
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200": {description: Vụ, content: {application/json: {schema: {$ref: "#/components/schemas/CropSeasonDetail"}}}}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/cropcycle/seasons/{ref}/corrections:
    post:
      summary: Sửa vụ đang mở bằng bản ghi bù (supersedes_id = current_event_id)
      operationId: correctCropSeason
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [supersedes_id, correction_reason]
              properties:
                id: {type: [string, "null"], format: uuid}
                supersedes_id: {type: string, format: uuid}
                correction_reason: {type: string, minLength: 10}
                variety_code: {type: [string, "null"]}
                sowing_date: {type: [string, "null"], format: date}
                sop_version_id: {type: [string, "null"], format: uuid}
      responses:
        "201": {$ref: "#/components/responses/CropSeasonWritten"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/cropcycle/seasons/{ref}/cancel:
    post:
      summary: Hủy vụ mở nhầm (bản ghi bù, vụ chưa khai sản lượng)
      operationId: cancelCropSeason
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [supersedes_id, reason]
              properties:
                supersedes_id: {type: string, format: uuid}
                reason: {type: string, minLength: 10}
      responses:
        "201": {$ref: "#/components/responses/CropSeasonWritten"}
        "409": {$ref: "#/components/responses/Problem"}
  /v1/cropcycle/seasons/{ref}/harvest:
    post:
      summary: Khai sản lượng — đóng vụ trong cùng giao dịch (HTX US-YIELD-01, US-YIELD-03)
      operationId: declareCropHarvest
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/CropHarvestInput"}}}
      responses:
        "201": {$ref: "#/components/responses/CropHarvestWritten"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/cropcycle/plots/{ref}/previous-config:
    get:
      summary: Giống + SOP của vụ vừa hoàn thành trên thửa (HTX US-SEASON-03)
      operationId: getCropPreviousConfig
      parameters:
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Cấu hình
          content:
            application/json:
              schema:
                type: object
                required: [season_ref, season_code, season_year, variety_code, sop_template_ref, sop_version_id, sop_version_no]
                properties:
                  season_ref: {type: string, format: uuid}
                  season_code: {type: string}
                  season_year: {type: integer}
                  variety_code: {type: string}
                  sop_template_ref: {type: string, format: uuid}
                  sop_version_id: {type: string, format: uuid}
                  sop_version_no: {type: integer}
        "409": {$ref: "#/components/responses/Problem"}
  /v1/cropcycle/harvests/bulk:
    post:
      summary: Bảng nhập nhanh sản lượng — lưu nhiều lô trong một lần bấm (HTX US-YIELD-02 AC-2)
      operationId: bulkCropHarvests
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rows]
              properties:
                cooperative_ref: {type: [string, "null"], format: uuid, description: "Quản trị: HTX để tra mã lô; quản lý HTX bỏ trống"}
                rows:
                  type: array
                  maxItems: 200
                  items:
                    type: object
                    properties:
                      season_ref: {type: string, format: uuid}
                      plot_code: {type: string}
                      harvest_date: {type: string, format: date}
                      mass_kg: {type: [string, "null"]}
                      moisture_pct: {type: [string, "null"]}
                      confirm_anomaly: {type: boolean}
      responses:
        "200": {$ref: "#/components/responses/CropBulkHarvest"}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/cropcycle/harvests/import:
    post:
      summary: Nhập sản lượng từ Excel .xlsx / CSV (HTX US-YIELD-02 AC-1) — dòng lỗi bị bỏ qua kèm lý do
      description: "Cột: Mã lô (plot_code) hoặc Mã vụ (season_ref); Sản lượng kg (mass_kg) hoặc Sản lượng tấn (tonnes); Ngày thu hoạch; Độ ẩm; Xác nhận bất thường. Tối đa 200 dòng, 2 MB."
      operationId: importCropHarvests
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - {name: cooperative_ref, in: query, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/vnd.openxmlformats-officedocument.spreadsheetml.sheet: {schema: {type: string, format: binary}}
          text/csv: {schema: {type: string}}
      responses:
        "200": {$ref: "#/components/responses/CropBulkHarvest"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/cropcycle/harvests/{id}/corrections:
    post:
      summary: Sửa sản lượng bằng bản ghi bù thay khai báo hiện hành
      operationId: correctCropHarvest
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/CropHarvestInput"
                - type: object
                  required: [correction_reason]
                  properties:
                    correction_reason: {type: string, minLength: 10}
      responses:
        "201": {$ref: "#/components/responses/CropHarvestWritten"}
        "409": {$ref: "#/components/responses/Problem"}
  /v1/cropcycle/farm-logs:
    post:
      summary: Ghi nhật ký canh tác (HTX US-LOG-01; ghi hộ US-LOG-02) — cần vụ đang mở
      operationId: recordCropFarmLog
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/CropFarmLogInput"}}}
      responses:
        "201": {$ref: "#/components/responses/CropFarmLogWritten"}
        "403": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
    get:
      summary: Nhật ký (phiên bản hiện hành) trong phạm vi — vd danh sách chờ duyệt (HTX US-LOG-05)
      operationId: listCropFarmLogs
      parameters:
        - {name: cooperative_ref, in: query, schema: {type: string, format: uuid}}
        - {name: season_ref, in: query, schema: {type: string, format: uuid}}
        - {name: status, in: query, schema: {type: string, enum: [pending, approved, needs_supplement]}}
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        "200":
          description: Một trang
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/CropFarmLogState"}}
                  next_cursor: {type: [string, "null"]}
  /v1/cropcycle/farm-logs/batch:
    post:
      summary: Ghi nhật ký hàng loạt — một đầu lô + một dòng mỗi thửa (HTX US-LOG-03)
      operationId: recordCropFarmLogBatch
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/CropFarmLogContent"
                - type: object
                  required: [plot_refs]
                  properties:
                    id: {type: [string, "null"], format: uuid}
                    plot_refs: {type: array, maxItems: 200, items: {type: string, format: uuid}}
                    gps: {$ref: "#/components/schemas/CropGPS"}
                    event_time: {type: [string, "null"], format: date-time}
      responses:
        "201":
          description: Đã ghi
          content:
            application/json:
              schema:
                type: object
                required: [batch_ref, requested, accepted, skipped, lines]
                properties:
                  batch_ref: {type: string, format: uuid}
                  requested: {type: integer}
                  accepted: {type: integer}
                  skipped:
                    type: array
                    items:
                      type: object
                      properties:
                        plot_ref: {type: string, format: uuid}
                        code: {type: string}
                        reason: {type: string}
                  lines: {type: array, items: {$ref: "#/components/schemas/CropFarmLog"}}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/cropcycle/farm-logs/{id}:
    get:
      summary: Một phiên bản nhật ký kèm trạng thái duyệt và mọi phiên bản
      operationId: getCropFarmLog
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Nhật ký
          content:
            application/json:
              schema:
                type: object
                required: [log, state, versions]
                properties:
                  log: {$ref: "#/components/schemas/CropFarmLog"}
                  state: {$ref: "#/components/schemas/CropFarmLogState"}
                  versions: {type: array, items: {$ref: "#/components/schemas/CropFarmLog"}}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/cropcycle/farm-logs/{id}/corrections:
    post:
      summary: Sửa nhật ký bằng bản ghi bù — giữ nguyên thời gian và GPS (HTX US-LOG-01 AC-3)
      operationId: correctCropFarmLog
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/CropFarmLogContent"
                - type: object
                  required: [correction_reason]
                  properties:
                    id: {type: [string, "null"], format: uuid}
                    correction_reason: {type: string, minLength: 10}
                    event_time: {type: [string, "null"], format: date-time, description: "Nếu gửi phải trùng bản gốc"}
                    gps: {$ref: "#/components/schemas/CropGPS"}
      responses:
        "201": {$ref: "#/components/responses/CropFarmLogWritten"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/cropcycle/farm-logs/{id}/reviews:
    post:
      summary: Duyệt / yêu cầu bổ sung nhật ký (quản lý HTX; người ghi không tự duyệt) — HTX US-LOG-05
      operationId: reviewCropFarmLog
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: {type: string, enum: [approved, needs_supplement]}
                note: {type: string, maxLength: 1000, description: "Bắt buộc khi needs_supplement"}
      responses:
        "201":
          description: Đã duyệt
          content:
            application/json:
              schema:
                type: object
                required: [review_id, decision, state]
                properties:
                  review_id: {type: string, format: uuid}
                  decision: {type: string}
                  state: {$ref: "#/components/schemas/CropFarmLogState"}
        "403": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
  /v1/cropcycle/dashboard:
    get:
      summary: Dự kiến – thực tế, tiến độ SOP (chỉ nhật ký đã duyệt), thẻ chỉ số — HTX US-DASH-01
      operationId: getCropDashboard
      parameters:
        - {name: season_code, in: query, schema: {type: string}}
        - {name: season_year, in: query, schema: {type: integer}}
        - {name: cooperative_ref, in: query, schema: {type: string, format: uuid}}
        - {name: variety_code, in: query, schema: {type: string}}
      responses:
        "200":
          description: Số liệu
          content:
            application/json:
              schema:
                type: object
                required: [totals, by_variety, by_season, by_cooperative]
                properties:
                  totals: {$ref: "#/components/schemas/CropDashGroup"}
                  by_variety: {type: array, items: {$ref: "#/components/schemas/CropDashGroup"}}
                  by_season: {type: array, items: {$ref: "#/components/schemas/CropDashGroup"}}
                  by_cooperative: {type: array, items: {$ref: "#/components/schemas/CropDashGroup"}}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/cropcycle/stage-map:
    get:
      summary: Lớp giai đoạn mùa vụ cho web GIS — GIS US-SEASON-01 (FN-13, bản đồ nhiệt) và US-YIELD-01 (FN-14, vùng chín rộ 1–3 ngày tới)
      description: |
        Giai đoạn suy từ ngày của vụ (ngày sạ, cổng thu hoạch, ngày thu hoạch dự kiến của SOP đã ghim) và trạng thái vụ:
        chuan_bi (chưa tới ngày sạ) → sinh_truong → sap_thu (đã qua cổng thu hoạch) → chin_ro (tới/qua ngày dự kiến, vụ chưa đóng)
        → da_thu (vụ hoàn thành trong 45 ngày gần nhất). `ripening` = vụ đang mở có ngày thu hoạch dự kiến trong [date+1, date+3].
        `expected_tons` = năng suất dự kiến App HTX gửi × diện tích (BR-48: GIS không tự dự báo; null khi App HTX chưa gửi).
        Mỗi thửa một dòng (ưu tiên vụ đang mở), tối đa 1.000 thửa (BR-25); web ghép `plot_ref` với lớp thửa của pf/geo
        và `cooperative_ref` với ranh giới HTX. Phạm vi như bảng điều hành (quản lý HTX chỉ HTX mình, KN theo xã, nông dân theo hộ).
      operationId: getCropStageMap
      parameters:
        - {name: date, in: query, description: "Ngày tra YYYY-MM-DD (giờ Việt Nam), trong vòng một năm; mặc định hôm nay", schema: {type: string, format: date}}
        - {name: cooperative_ref, in: query, schema: {type: string, format: uuid}}
        - {name: commune_code, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 1000, default: 1000}}
      responses:
        "200":
          description: Lớp giai đoạn
          content:
            application/json:
              schema:
                type: object
                required: [date, stages, ripening_days, plots, cooperatives, truncated, limit]
                properties:
                  date: {type: string, format: date}
                  stages:
                    type: array
                    items:
                      type: object
                      required: [code, label]
                      properties:
                        code: {$ref: "#/components/schemas/CropStage"}
                        label: {type: string}
                  ripening_days:
                    type: object
                    required: [from, to]
                    properties:
                      from: {type: integer}
                      to: {type: integer}
                  plots:
                    type: array
                    items:
                      type: object
                      required: [plot_ref, plot_code, season_ref, cooperative_ref, commune_code, variety_code, season_status, stage, sowing_date, harvest_open_date, expected_harvest_date, days_to_harvest, ripening, area_ha, expected_tons]
                      properties:
                        plot_ref: {type: string, format: uuid}
                        plot_code: {type: string}
                        season_ref: {type: string, format: uuid}
                        cooperative_ref: {type: string, format: uuid}
                        commune_code: {type: string}
                        variety_code: {type: string}
                        season_status: {type: string, enum: [open, completed]}
                        stage: {$ref: "#/components/schemas/CropStage"}
                        sowing_date: {type: string, format: date}
                        harvest_open_date: {type: string, format: date}
                        expected_harvest_date: {type: string, format: date}
                        days_to_harvest: {type: integer}
                        ripening: {type: boolean}
                        area_ha: {$ref: "#/components/schemas/Decimal"}
                        expected_tons: {type: [string, "null"]}
                  cooperatives:
                    type: array
                    items:
                      type: object
                      required: [cooperative_ref, commune_code, dominant_stage, stage_area_ha, plot_count, ripening_plot_count, ripening_area_ha, ripening_expected_tons, earliest_ripening_date]
                      properties:
                        cooperative_ref: {type: string, format: uuid}
                        commune_code: {type: string}
                        dominant_stage: {$ref: "#/components/schemas/CropStage"}
                        stage_area_ha: {type: object, additionalProperties: {type: string}}
                        plot_count: {type: integer}
                        ripening_plot_count: {type: integer}
                        ripening_area_ha: {$ref: "#/components/schemas/Decimal"}
                        ripening_expected_tons: {type: [string, "null"]}
                        earliest_ripening_date: {type: [string, "null"], format: date}
                  truncated: {type: boolean}
                  limit: {type: integer}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  # --- hết pf/cropcycle ---
  # --- pf/metrics ---
  /v1/metrics/definitions:
    get:
      summary: Định nghĩa chỉ số có phiên bản (tệp khai báo trong kho mã — mục 16)
      description: |
        Mọi phiên bản định nghĩa người gọi xem được: `metrics_viewer`, `platform_admin` xem tất cả; vai nghiệp vụ (KN, CGH,
        HTX, GIS) xem chỉ số khai `viewer_roles` chứa vai đó. Không xem được định nghĩa nào → 403.
      operationId: listMetricDefinitions
      tags: [metrics]
      responses:
        "200":
          description: Danh sách phiên bản
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/MetricDefinition"}}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/metrics/{key}/values:
    get:
      summary: Lịch sử giá trị chỉ số theo ngày đã chốt — KN US-DASH-01/02, CGH FN-10/11
      description: |
        Giá trị ngày D là giá trị "như hệ biết lúc hết ngày D" (bản ghi nguồn có `recorded_at` < `cutoff` = 00:00 giờ VN ngày
        D+1), ghi sổ bởi job `metrics_snapshot` (00:45) hoặc backfill. Kỳ đã chốt không bị sửa: tính lại tạo dòng mới
        `supersedes_id` + `correction_reason`; mặc định trả dòng hiện hành mỗi ngày, `history=true` trả cả dòng đã bị thay.
        Phạm vi: `unit` rỗng = toàn tenant (chỉ phạm vi TW); `unit` = mã tỉnh/xã trong phạm vi người gọi (chỉ số KN, CGH ghi
        theo tỉnh; HTX, GIS theo xã). Chỉ số theo vụ (`grain = season`) cần `dimension` (vd `DX-2026`); thiếu → `items`
        rỗng và `dimensions` là các vụ đã ghi. Mặc định `to` = hôm qua, `from` = `to` − 30 ngày; tối đa 400 ngày.
      operationId: listMetricValues
      tags: [metrics]
      parameters:
        - {name: key, in: path, required: true, schema: {type: string, example: kn.sown_area_ha}}
        - {name: from, in: query, schema: {type: string, format: date}}
        - {name: to, in: query, schema: {type: string, format: date}}
        - {name: unit, in: query, description: "Mã đơn vị hành chính; rỗng = toàn tenant", schema: {type: string}}
        - {name: dimension, in: query, description: "Chiều của chỉ số theo vụ, vd DX-2026", schema: {type: string}}
        - {name: history, in: query, schema: {type: boolean, default: false}}
      responses:
        "200":
          description: Chuỗi giá trị theo ngày tăng dần
          content:
            application/json:
              schema:
                type: object
                required: [key, title, unit, grain, scope_unit, dimension, from, to, items, dimensions]
                properties:
                  key: {type: string}
                  title: {type: string}
                  unit: {type: string}
                  grain: {type: string, enum: [day, season]}
                  scope_unit: {type: string}
                  dimension: {type: string}
                  from: {type: string, format: date}
                  to: {type: string, format: date}
                  items: {type: array, items: {$ref: "#/components/schemas/MetricValue"}}
                  dimensions: {type: array, items: {type: string}}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/gis/events:
    get:
      summary: Nhật ký thay đổi lớp GIS (chỉ ghi thêm, trước/sau + nguồn) — GIS US-EVL-01
      description: |
        Mỗi thay đổi đối tượng trên một lớp (tạo, sửa, ngừng dùng, khôi phục) nhận từ sự kiện của module chủ lớp, theo
        `recorded_at` ∈ [00:00 VN ngày `from`, cutoff ngày `to`). Mặc định 7 ngày tới hôm nay. Người không có phạm vi TW chỉ
        thấy đối tượng có `commune_code`/`province_code` trong phạm vi (lớp nền không có địa bàn luôn thấy). Hình học không
        chép vào nhật ký: `after.geometry_ref` trỏ dòng sổ bất biến của pf/geo (xem `/v1/gis/replay?geometry=true`).
        Vai: `metrics_viewer`, `platform_admin`, `geo_admin`, `plot_viewer`, `plot_editor`, `kn_national_admin`, `kn_province_admin`, `cgh_viewer`.
      operationId: listGisLayerEvents
      tags: [metrics]
      parameters:
        - {name: layer, in: query, schema: {type: string, enum: [plot, coop_boundary, facility, season_stage, cgh_balance, waterway]}}
        - {name: feature_ref, in: query, schema: {type: string, format: uuid}}
        - {name: from, in: query, schema: {type: string, format: date}}
        - {name: to, in: query, schema: {type: string, format: date}}
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 500, default: 100}}
      responses:
        "200":
          description: Một trang theo (recorded_at, id)
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor, from, to]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/GisLayerEvent"}}
                  next_cursor: {type: [string, "null"]}
                  from: {type: string, format: date}
                  to: {type: string, format: date}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/gis/snapshots/{date}:
    get:
      summary: Ảnh chụp cuối ngày của các lớp GIS (dựng từ nhật ký, kèm watermark) — GIS US-SNAP-01
      description: |
        Ảnh chụp đã lưu của đúng ngày `date` (job `metrics_snapshot` 00:45 chụp hôm qua). Chưa chụp → `items` rỗng (dùng
        `/v1/gis/replay`). Lọc phạm vi như `/v1/gis/events`.
      operationId: listGisSnapshots
      tags: [metrics]
      parameters:
        - {name: date, in: path, required: true, schema: {type: string, format: date}}
        - {name: layers, in: query, description: "Danh sách lớp, phân tách dấu phẩy; mặc định mọi lớp", schema: {type: string}}
      responses:
        "200":
          description: Ảnh chụp theo lớp
          content:
            application/json:
              schema:
                type: object
                required: [business_date, items]
                properties:
                  business_date: {type: string, format: date}
                  items: {type: array, items: {$ref: "#/components/schemas/GisLayerState"}}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/cropcycle/htx-collection/schedules:
    get:
      summary: Lịch gom rơm MKG của HTX (qua van collection_schedule) — G3-2
      description: |
        Bản revision lớn nhất theo `schedule_ref`. Quản lý HTX chỉ thấy HTX mình; quản trị toàn tenant (lọc
        `cooperative_ref`); cán bộ KN theo xã trong phạm vi. Mới nhất trước, cursor = `schedule_ref` cuối.
      operationId: listHtxCollectionSchedules
      tags: [cropcycle]
      parameters:
        - {name: cooperative_ref, in: query, schema: {type: string, format: uuid}}
        - {name: status, in: query, schema: {type: string, enum: [planned, confirmed, in_progress, completed, cancelled]}}
        - {name: cursor, in: query, schema: {type: string, format: uuid}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        "200":
          description: Một trang lịch gom
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/HtxCollectionSchedule"}}
                  next_cursor: {type: [string, "null"]}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/cropcycle/htx-collection/statements:
    get:
      summary: Bảng kê số cuộn MKG đã gom theo thửa (qua van htx_collection_statement) — RB-6 chiều mua, G3-2
      description: |
        `status`: `pending` = HTX chưa phản hồi revision hiện hành; `confirmed` / `disputed` = phản hồi cho revision hiện hành.
        Quản lý HTX chỉ HTX mình; quản trị toàn tenant.
      operationId: listHtxCollectionStatements
      tags: [cropcycle]
      parameters:
        - {name: cooperative_ref, in: query, schema: {type: string, format: uuid}}
        - {name: status, in: query, schema: {type: string, enum: [pending, confirmed, disputed]}}
        - {name: cursor, in: query, schema: {type: string, format: uuid}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        "200":
          description: Một trang bảng kê
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/HtxCollectionStatement"}}
                  next_cursor: {type: [string, "null"]}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/cropcycle/htx-collection/statements/{ref}:
    get:
      summary: Một bảng kê kèm lịch sử phản hồi của HTX — G3-2
      operationId: getHtxCollectionStatement
      tags: [cropcycle]
      parameters:
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Bảng kê
          content:
            application/json:
              schema:
                type: object
                required: [statement, responses]
                properties:
                  statement: {$ref: "#/components/schemas/HtxCollectionStatement"}
                  responses: {type: array, items: {$ref: "#/components/schemas/HtxCollectionResponse"}}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/cropcycle/htx-collection/statements/{ref}/responses:
    post:
      summary: Quản lý HTX xác nhận hoặc tranh chấp bảng kê — RB-6 chiều mua, G3-2
      description: |
        Chỉ `coop_manager` của đúng HTX. `revision` phải là bản hiện hành (409 `cropcycle.collection_statement_stale`).
        `confirmed`: số HTX = số MKG. `disputed`: bắt buộc `htx_rolls` (≠ số MKG) và `reason` 10–500 ký tự, không chứa SĐT/CCCD.
        Đã có phản hồi cho cùng revision → bắt buộc `reason`; bản mới thay bản trước (sổ chỉ ghi thêm, `supersedes_id`).
        MKG kéo phản hồi về qua `GET /v1/partner/htx-collection/responses` (ADR-0020).
      operationId: respondHtxCollectionStatement
      tags: [cropcycle]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [revision, outcome]
              properties:
                revision: {type: integer, minimum: 1}
                outcome: {type: string, enum: [confirmed, disputed]}
                htx_rolls: {type: [integer, "null"], minimum: 0}
                reason: {type: string, maxLength: 500}
      responses:
        "201":
          description: Đã ghi phản hồi (gọi lặp cùng Idempotency-Key → phản hồi như lần đầu)
          content:
            application/json:
              schema:
                type: object
                required: [response, statement]
                properties:
                  response: {$ref: "#/components/schemas/HtxCollectionResponse"}
                  statement: {$ref: "#/components/schemas/HtxCollectionStatement"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/cropcycle/htx-collection/responses:
    get:
      summary: Bí danh của GET /v1/partner/htx-collection/responses (ADR-0020)
      description: |
        Giữ để tương thích G3-2. Cùng kiểm cấp quyền chia sẻ `htx_collection_responses`, cùng sổ đọc, cùng dữ liệu với
        `GET /v1/partner/htx-collection/responses`. MKG dùng đường của bề mặt đối tác.
      operationId: listHtxCollectionResponseFeed
      tags: [cropcycle]
      parameters:
        - $ref: "#/components/parameters/PartnerGrantor"
        - {name: after, in: query, schema: {type: integer, minimum: 0, default: 0}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 500, default: 200}}
      responses:
        "200":
          description: Một trang luồng
          content:
            application/json:
              schema: {$ref: "#/components/schemas/HtxCollectionResponseFeedPage"}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
  # --- Bề mặt đối tác (ADR-0020, RB-2 / Q-MKG-12): tài khoản dịch vụ tenant BÊN NHẬN (MKG, vai mkg_sync) đọc dữ liệu
  # tối thiểu của tenant BÊN CẤP (tenant chương trình) sau khi kiểm cấp quyền chia sẻ đang hiệu lực; mọi lời gọi ghi sổ
  # pf_party.partner_read_log. Không có cấp quyền / đã thu hồi / hết hạn / loại không được cấp → 403 party.share_grant_missing.
  /v1/partner/grants:
