        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/extension/report-periods/close:
    post:
      summary: Chốt kỳ báo cáo của một tỉnh (FR-05) — TTKN tỉnh/QG; chốt lặp trả 200
