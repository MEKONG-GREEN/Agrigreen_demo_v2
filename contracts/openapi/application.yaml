  /v1/extension/roster/shifts:
    post:
      summary: Khai báo ca trực cho cán bộ trong tỉnh (US-DIR-03)
      operationId: extAddShift
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [actor_ref, starts_at, ends_at]
              properties:
                actor_ref: {type: string, format: uuid}
                starts_at: {type: string, format: date-time}
                ends_at: {type: string, format: date-time}
      responses:
        "201": {description: Đã ghi}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  # --- KN v7.7 P5: Lịch công tác tuần (FN-XA-03.08 đăng ký, FN-TI-02.07 duyệt) ---
  # Ngữ cảnh KN (vai kn_xa | kn_tinh | admin, phòng ban, tỉnh, xã phụ trách) lấy từ ngữ cảnh phiên của P1 (X-AG-Context)
  # khi có; chưa có P1 thì suy từ vai realm (kn_officer → kn_xa, kn_province_admin → kn_tinh, platform_admin → admin,
  # chỉ đọc) + phạm vi đơn vị (org_ref), phòng ban mặc định "trong_trot". Cấp Quốc gia (kn_tw) không có quyền (ma trận §5).
  # Cán bộ xã chỉ thấy lịch của mình; Cấp Tỉnh thấy lịch cùng phòng ban, cùng tỉnh; Admin xem mọi lịch.
  # Sửa lịch = phiên bản mới (sổ work_schedule_item, supersedes_id), không ghi đè (RB-1).
  /v1/extension/work-schedules:
    post:
      summary: Lưu nháp hoặc gửi duyệt lịch tuần của chính mình (FN-XA-03.08; Cấp Tỉnh "Lịch của tôi" FN-TI-02.07)
      description: |
        Mỗi lần gọi tạo một phiên bản mới của lịch (người gọi × phòng ban × tuần) — sổ chỉ ghi thêm (RB-1).
        action=draft: Nháp (khi lịch chưa gửi hoặc bị Yêu cầu chỉnh sửa). action=submit: Chờ duyệt; nếu lịch đã duyệt thì
        là "điều chỉnh" — phần điều chỉnh chờ duyệt lại, bản đã duyệt vẫn hiệu lực tới khi duyệt bản mới.
        Gửi sau hạn đăng ký → nhãn "Đăng ký muộn". Tuần đã kết thúc → 409 extension.week_locked.
        base_version (phiên bản client đã sửa) khác phiên bản hiện hành → 409 extension.schedule_version_conflict
        (máy ngoại tuyến phải tải lại). Gọi lặp cùng Idempotency-Key → 200 với đúng kết quả lần đầu.
        Trùng thời gian giữa các mục chỉ là cảnh báo (warnings), không chặn.
      operationId: extSaveWorkSchedule
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ExtWorkScheduleSave"}
      responses:
        "201":
          description: Đã ghi phiên bản mới
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ExtWorkScheduleDetail"}
        "200":
          description: Gọi lặp — kết quả lần đầu
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ExtWorkScheduleDetail"}
        "403": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
    get:
      summary: Danh sách lịch tuần trong phạm vi (tab Chờ duyệt / Đã duyệt / Yêu cầu chỉnh sửa của Cấp Tỉnh)
      operationId: extListWorkSchedules
      parameters:
        - {name: week_start, in: query, description: "Thứ Hai đầu tuần (giờ Việt Nam). Mặc định tuần kế tiếp", schema: {type: string, format: date}}
        - {name: status, in: query, schema: {$ref: "#/components/schemas/ExtWorkScheduleStatus"}}
        - {name: commune_code, in: query, schema: {type: string}}
        - {name: owner_level, in: query, schema: {type: string, enum: [commune, province]}}
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        "200":
          description: Một trang
          content:
            application/json:
              schema:
                type: object
                required: [week_start, items, next_cursor]
                properties:
                  week_start: {type: string, format: date}
                  items: {type: array, items: {$ref: "#/components/schemas/ExtWorkScheduleListItem"}}
                  next_cursor: {type: [string, "null"]}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/extension/work-schedules/mine:
    get:
      summary: Lịch tuần của tôi (mặc định tuần kế tiếp) kèm hạn đăng ký, hạn duyệt, trạng thái khóa
      operationId: extMyWorkSchedule
      parameters:
        - {name: week_start, in: query, schema: {type: string, format: date}}
      responses:
        "200":
          description: Lịch của tôi (schedule = null khi chưa đăng ký)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ExtMyWorkSchedule"}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/extension/work-schedules/counts:
    get:
      summary: Số đếm theo tab của tuần và số lịch chờ duyệt của mọi tuần chưa khóa (số đếm menu extension.work_schedules.pending)
      operationId: extWorkScheduleCounts
      parameters:
        - {name: week_start, in: query, schema: {type: string, format: date}}
      responses:
        "200":
          description: Số đếm
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ExtWorkScheduleCounts"}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/extension/work-schedules/unregistered:
    get:
      summary: Tab "Chưa đăng ký" — cán bộ trong phạm vi chưa gửi lịch tuần (chưa có hoặc mới lưu nháp)
      operationId: extWorkScheduleUnregistered
      parameters:
        - {name: week_start, in: query, schema: {type: string, format: date}}
        - {name: commune_code, in: query, schema: {type: string}}
      responses:
        "200":
          description: Danh sách
          content:
            application/json:
              schema:
                type: object
                required: [week_start, items]
                properties:
                  week_start: {type: string, format: date}
                  items: {type: array, items: {$ref: "#/components/schemas/ExtWorkScheduleUnregistered"}}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/extension/work-schedules/settings:
    get:
      summary: Cấu hình lịch công tác hiệu lực của tỉnh (hạn đăng ký, hạn duyệt, nhắc, cấp quản lý duyệt) — tạm, chờ khách Q-05/Q-16
      description: |
        Đọc từ tham số pf/masterdata (đặt qua Admin API, có phê duyệt R-56), khóa có chiều tỉnh
        "<khóa>:<mã tỉnh>" ưu tiên hơn khóa chung; chưa có → mặc định (provisional = true).
      operationId: extWorkScheduleSettings
      parameters:
        - {name: province_code, in: query, schema: {type: string}}
      responses:
        "200":
          description: Cấu hình
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ExtWorkScheduleSettings"}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/extension/work-schedules/copy-previous:
    post:
      summary: Sao chép tuần trước thành nháp của tuần đã chọn (ngày dời +7)
      operationId: extCopyPreviousWorkSchedule
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [week_start]
              properties:
                week_start: {type: string, format: date}
      responses:
        "201":
          description: Đã tạo nháp
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ExtWorkScheduleDetail"}
        "200":
          description: Gọi lặp
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ExtWorkScheduleDetail"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
  /v1/extension/work-schedules/bulk-approve:
    post:
      summary: Duyệt hàng loạt các lịch đang Chờ duyệt (bỏ qua lịch của chính mình, ngoài phạm vi, đã đổi trạng thái)
      operationId: extBulkApproveWorkSchedules
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids: {type: array, minItems: 1, maxItems: 200, items: {type: string, format: uuid}}
      responses:
        "200":
          description: Kết quả từng lịch
          content:
            application/json:
              schema:
                type: object
                required: [approved, skipped]
                properties:
                  approved: {type: array, items: {type: string, format: uuid}}
                  skipped:
                    type: array
                    items:
                      type: object
                      required: [id, code]
                      properties:
                        id: {type: string, format: uuid}
                        code: {type: string, description: "Mã lỗi problem (vd self_approval_forbidden, extension.schedule_state_conflict)"}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/extension/work-schedules/export:
    get:
      summary: Xuất lịch tuần trong phạm vi ra Excel (.xlsx) hoặc PDF khổ ngang
      operationId: extExportWorkSchedules
      parameters:
        - {name: week_start, in: query, schema: {type: string, format: date}}
        - {name: status, in: query, schema: {$ref: "#/components/schemas/ExtWorkScheduleStatus"}}
        - {name: commune_code, in: query, schema: {type: string}}
        - {name: format, in: query, schema: {type: string, enum: [xlsx, pdf], default: xlsx}}
      responses:
        "200":
          description: Tệp
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: {type: string, format: binary}
            application/pdf:
              schema: {type: string, format: binary}
        "403": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
  /v1/extension/work-schedules/{id}:
    get:
      summary: Chi tiết lịch tuần (phiên bản hiện hành, bản đã duyệt nếu đang điều chỉnh, cảnh báo, các phiên bản)
      operationId: extGetWorkSchedule
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: version, in: query, description: "Xem một phiên bản cũ", schema: {type: integer, minimum: 1}}
      responses:
        "200":
          description: Chi tiết
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ExtWorkScheduleDetail"}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/extension/work-schedules/{id}/log:
    get:
      summary: Khung Log của màn Detail — mọi sự việc của lịch (lưu nháp, gửi, duyệt, yêu cầu chỉnh sửa, điều chỉnh, khóa) kèm cũ → mới
      operationId: extWorkScheduleLog
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: cursor, in: query, description: "seq của dòng cuối trang trước (mới → cũ)", schema: {type: integer}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        "200":
          description: Một trang, mới nhất trước
          content:
            application/json:
              schema: {$ref: "#/components/schemas/KNLogPage"}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/extension/work-schedules/{id}/approve:
    post:
      summary: Duyệt phiên bản đang Chờ duyệt — người duyệt khác người đăng ký (R-56), cùng phòng ban, cùng tỉnh, cấp quản lý được duyệt (Q-05)
      operationId: extApproveWorkSchedule
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: {type: integer, minimum: 1, description: "Phiên bản người duyệt đã xem; khác phiên bản chờ duyệt → 409"}
                note: {type: string, maxLength: 1000}
      responses:
        "200":
          description: Đã duyệt
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ExtWorkScheduleDetail"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
  /v1/extension/work-schedules/{id}/request-changes:
    post:
      summary: Yêu cầu chỉnh sửa — bắt buộc lý do (≥ 10 ký tự); cán bộ nhận thông báo kèm lý do
      operationId: extRequestWorkScheduleChanges
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, reason]
              properties:
                version: {type: integer, minimum: 1}
                reason: {type: string, minLength: 10, maxLength: 1000}
      responses:
        "200":
          description: Đã ghi
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ExtWorkScheduleDetail"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  # Số liệu cân đối/báo cáo/dashboard đọc KẾT QUẢ ĐÃ LƯU theo vụ (FN-10 BR-04), không tính lại.

  # Phạm vi không phải toàn vùng: danh sách máy/chủ sở hữu/diện tích phải lọc theo cooperative_ref trong phạm vi.
  /v1/mechanization/owners:
    get:
      summary: Chủ sở hữu máy (FN-04) — nhãn đã che từ kho định danh, số máy đang hoạt động
      operationId: mechListOwners
      parameters:
        - {name: cooperative_ref, in: query, schema: {type: string, format: uuid}}
        - {name: owner_type, in: query, schema: {$ref: "#/components/schemas/MechOwnerType"}}
        - {name: include_inactive, in: query, schema: {type: boolean, default: false}}
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        "200":
          description: Một trang
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/MechOwner"}}
                  next_cursor: {type: [string, "null"]}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/mechanization/owners/{id}:
    get:
      summary: Một chủ sở hữu
      operationId: mechGetOwner
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Chủ sở hữu
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MechOwner"}
        "404": {description: mechanization.owner_not_found, $ref: "#/components/responses/Problem"}
  /v1/mechanization/machines:
    get:
      summary: Máy móc – thiết bị (FN-05 B1) kèm tình trạng và nhãn nguồn
      operationId: mechListMachines
      parameters:
        - {name: cooperative_ref, in: query, schema: {type: string, format: uuid}}
        - {name: owner_id, in: query, schema: {type: string, format: uuid}}
        - {name: farm_stage, in: query, schema: {type: string}}
        - {name: machine_type, in: query, schema: {type: string}}
        - {name: status, in: query, schema: {$ref: "#/components/schemas/MechMachineStatus"}}
        - {name: include_inactive, in: query, schema: {type: boolean, default: false}}
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        "200":
          description: Một trang
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/MechMachine"}}
                  next_cursor: {type: [string, "null"]}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/mechanization/machines/{ref}:
    get:
      summary: Một máy
      operationId: mechGetMachine
      parameters:
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Máy
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MechMachine"}
        "404": {description: mechanization.machine_not_found, $ref: "#/components/responses/Problem"}
  /v1/mechanization/cooperatives/{ref}/machine-count:
    get:
      summary: Số máy của HTX tại một ngày trong quá khứ (FN-05 BR-09, US-MAC-03)
      description: Đếm máy có Ngày HTX sở hữu ≤ T và (chưa vô hiệu hóa hoặc Ngày vô hiệu hóa > T); tình trạng tại T đọc từ sổ biến động.
      operationId: mechMachineCount
      parameters:
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: at, in: query, required: true, schema: {type: string, format: date}}
      responses:
        "200":
          description: Số máy
          content:
            application/json:
              schema:
                type: object
                required: [cooperative_ref, at, total, active, by_stage]
                properties:
                  cooperative_ref: {type: string, format: uuid}
                  at: {type: string, format: date}
                  total: {type: integer}
                  active: {type: integer, description: "Máy \"Hoạt động\" — tính vào năng lực (FN-05 BR-04)"}
                  by_stage:
                    type: array
                    items:
                      type: object
                      required: [farm_stage, machine_type, total, by_status]
                      properties:
                        farm_stage: {type: string}
                        machine_type: {type: string}
                        total: {type: integer}
                        by_status: {type: object, additionalProperties: {type: integer}}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/mechanization/cooperatives/{ref}/panel:
    get:
      summary: Panel chi tiết HTX trên bản đồ (FN-08 B5) — máy theo khâu, chủ sở hữu (nhãn đã che), mức đáp ứng đã lưu
      operationId: mechCooperativePanel
      parameters:
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: season_code, in: query, schema: {type: string}}
        - {name: season_year, in: query, schema: {type: integer}}
        - {name: run_id, in: query, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Panel
          content:
            application/json:
              schema:
                type: object
                required: [cooperative_ref, name, commune_code, province_code, machines, coverage, run]
                properties:
                  cooperative_ref: {type: string, format: uuid}
                  name: {type: string}
                  commune_code: {type: [string, "null"]}
                  province_code: {type: [string, "null"]}
                  note: {type: string, enum: ["Chưa có máy"]}
                  machines:
                    type: array
                    items:
                      allOf:
                        - $ref: "#/components/schemas/MechMachine"
                        - type: object
                          required: [owner_code, owner_label, owner_masked_phone]
                          properties:
                            owner_code: {type: string}
                            owner_label: {type: string, description: "Nhãn đã che (mục 10.4)"}
                            owner_masked_phone: {type: string}
                  coverage: {oneOf: [{$ref: "#/components/schemas/MechCoverageItem"}, {type: "null"}]}
                  run: {oneOf: [{$ref: "#/components/schemas/MechRun"}, {type: "null"}]}
        "422": {description: mechanization.cooperative_invalid, $ref: "#/components/responses/Problem"}
  /v1/mechanization/season-areas:
    get:
      summary: Diện tích canh tác & lịch mùa vụ theo HTX × vụ, kèm nhãn nguồn [App HTX]/[Nhập tay] và cờ khóa (FN-06)
      operationId: mechListSeasonAreas
      parameters:
        - {name: season_code, in: query, required: true, schema: {type: string}}
        - {name: season_year, in: query, required: true, schema: {type: integer}}
        - {name: cooperative_ref, in: query, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Danh sách
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/MechSeasonArea"}}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/mechanization/balance-runs:
    get:
      summary: Các lần cân đối đã lưu (mới nhất trước)
      operationId: mechListBalanceRuns
      parameters:
        - {name: season_code, in: query, schema: {type: string}}
        - {name: season_year, in: query, schema: {type: integer}}
      responses:
        "200":
          description: Danh sách
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/MechRun"}}
  /v1/mechanization/balance-runs/{id}:
    get:
      summary: Một lần cân đối và các dòng HTX × khâu × chủng loại đã lưu (bất biến)
      operationId: mechGetBalanceRun
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: province_code, in: query, schema: {type: string}}
        - {name: commune_code, in: query, schema: {type: string}}
        - {name: cooperative_ref, in: query, schema: {type: string, format: uuid}}
        - {name: farm_stage, in: query, schema: {type: string}}
        - {name: machine_type, in: query, schema: {type: string}}
      responses:
        "200":
          description: Kết quả
          content:
            application/json:
              schema:
                type: object
                required: [run, results]
                properties:
                  run: {$ref: "#/components/schemas/MechRun"}
                  results: {type: array, items: {$ref: "#/components/schemas/MechResult"}}
        "404": {description: mechanization.run_not_found, $ref: "#/components/responses/Problem"}
  /v1/mechanization/coverage:
    get:
      summary: Mức đáp ứng theo tỉnh → xã → HTX, kèm màu và chú giải (FN-08, FN-10 tab Tổng hợp/Thiếu hụt)
      description: |
        Đọc lần cân đối run_id, hoặc lần mới nhất của (season_code, season_year), hoặc mới nhất mọi vụ.
        Mức của một đơn vị là mức của khâu thấp nhất; nhu cầu/năng lực là tổng. Mức đáp ứng không cắt ở 100% (Thừa ≥ ngưỡng).
      operationId: mechCoverage
      parameters:
        - {name: level, in: query, schema: {type: string, enum: [province, commune, cooperative], default: province}}
        - {name: season_code, in: query, schema: {type: string}}
        - {name: season_year, in: query, schema: {type: integer}}
        - {name: run_id, in: query, schema: {type: string, format: uuid}}
        - {name: province_code, in: query, schema: {type: string}}
        - {name: commune_code, in: query, schema: {type: string}}
        - {name: farm_stage, in: query, schema: {type: string}}
        - {name: machine_type, in: query, schema: {type: string}}
      responses:
        "200":
          description: Tổng hợp
          content:
            application/json:
              schema:
                type: object
                required: [run, level, summary, stages, items, legend]
                properties:
                  run: {$ref: "#/components/schemas/MechRun"}
                  level: {type: string}
                  summary: {$ref: "#/components/schemas/MechGroup"}
                  stages: {type: object, additionalProperties: {$ref: "#/components/schemas/MechGroup"}}
                  items: {type: array, items: {$ref: "#/components/schemas/MechCoverageItem"}}
                  legend:
                    type: array
                    items:
                      type: object
                      required: [status, label, color]
                      properties:
                        status: {$ref: "#/components/schemas/MechCoverageStatus"}
                        label: {type: string}
                        color: {type: string}
        "404": {description: mechanization.run_not_found, $ref: "#/components/responses/Problem"}
  /v1/mechanization/dashboard:
    get:
      summary: Dashboard (FN-11) — 4 thẻ chỉ số và bảng "HTX cần ưu tiên" (mức đáp ứng thấp nhất trước)
      operationId: mechDashboard
      parameters:
        - {name: season_code, in: query, schema: {type: string}}
        - {name: season_year, in: query, schema: {type: integer}}
        - {name: run_id, in: query, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Dashboard
          content:
            application/json:
              schema:
                type: object
                required: [kpis, cooperatives_by_status, priority, run]
                properties:
                  kpis:
                    type: object
                    required: [total_machines, total_cooperatives, cooperatives_sufficient, cooperatives_shortage]
                    properties:
                      total_machines: {type: integer}
                      total_cooperatives: {type: integer}
                      cooperatives_sufficient: {type: integer, description: "Đủ hoặc Thừa"}
                      cooperatives_shortage: {type: integer}
                  cooperatives_by_status: {type: object, additionalProperties: {type: integer}}
                  priority: {type: array, items: {$ref: "#/components/schemas/MechCoverageItem"}}
                  run: {oneOf: [{$ref: "#/components/schemas/MechRun"}, {type: "null"}]}
  /v1/mechanization/trend:
    get:
      summary: Xu hướng nhiều năm theo vụ đã lưu (FN-11 B3) — lần cân đối mới nhất của mỗi vụ
      operationId: mechTrend
      parameters:
        - {name: season_code, in: query, schema: {type: string}}
        - {name: farm_stage, in: query, schema: {type: string}}
      responses:
        "200":
          description: Chuỗi theo vụ
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [run, summary, stages, cooperatives_by_status]
                      properties:
                        run: {$ref: "#/components/schemas/MechRun"}
                        summary: {$ref: "#/components/schemas/MechGroup"}
                        stages: {type: object, additionalProperties: {$ref: "#/components/schemas/MechGroup"}}
                        cooperatives_by_status: {type: object, additionalProperties: {type: integer}}
  # --- hết pf/mechanization ---

  # --- pf/notify --- (ADR-0015: hộp thư trong app; đẩy CHỈ dữ liệu; đồng bộ ngay)
  /v1/notifications:
    get:
      summary: Hộp thư của người gọi (cá nhân + chủ đề theo phạm vi/vai/tổ chức), mới nhất trước
      operationId: listNotifications
      parameters:
        - {name: cursor, in: query, description: "next_cursor của trang trước", schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
        - {name: unread, in: query, description: "true = chỉ chưa đọc", schema: {type: boolean}}
      responses:
        "200":
          description: Một trang. Thông báo chủ đề cũ hơn 90 ngày không hiện.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/Notification"}}
                  next_cursor: {type: [string, "null"]}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/notifications/unread-count:
    get:
      summary: Số thông báo chưa đọc (huy hiệu)
      operationId: notificationUnreadCount
      responses:
        "200":
          description: Đếm
          content:
            application/json:
              schema: {type: object, required: [unread], properties: {unread: {type: integer, minimum: 0}}}
  /v1/notifications/read-all:
    post:
      summary: Đánh dấu đã đọc mọi thông báo người gọi thấy được
      operationId: readAllNotifications
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Số đã đánh dấu
          content:
            application/json:
              schema: {type: object, required: [marked], properties: {marked: {type: integer, minimum: 0}}}
  /v1/notifications/{id}/read:
    post:
      summary: Đánh dấu đã đọc một thông báo (đọc lại giữ read_at lần đầu)
      operationId: readNotification
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Thông báo sau khi đọc
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Notification"}
        "404": {description: "notify.notification_not_found — không có, của người khác, ngoài phạm vi", $ref: "#/components/responses/Problem"}
  /v1/devices/{id}/push-token:
    post:
      summary: Gắn/cập nhật token đẩy FCM cho thiết bị pf/sync của CHÍNH người gọi (gọi mỗi lần khởi động và khi FCM đổi token)
      operationId: registerPushToken
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - {name: id, in: path, required: true, description: "device_id đã đăng ký ở POST /v1/devices", schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PushTokenInput"}
      responses:
        "200":
          description: Đã gắn. Không trả lại token.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PushToken"}
        "403": {description: "notify.device_unregistered | notify.device_revoked", $ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "503": {description: "notify.dependency_unavailable", $ref: "#/components/responses/Problem"}
  /v1/sync/nudge:
    post:
      summary: Yêu cầu thiết bị đồng bộ ngay (US-SYNC-02) — gửi thông điệp dữ liệu {kind sync_now}
      description: |
        Vai kn_province_admin, kn_national_admin, device_admin, platform_admin. Đúng một trong device_id hoặc unit.
        unit phải trong phạm vi; device_id phải có token đang dùng và thuộc phạm vi (device_admin/platform_admin: cả tenant).
        Giới hạn: một đích mỗi 5 phút, mỗi người 30 lần/giờ → 429 + Retry-After.
      operationId: syncNudge
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/NudgeInput"}
      responses:
        "202":
          description: Đã xếp lần gửi
          content:
            application/json:
              schema: {$ref: "#/components/schemas/NudgeResult"}
        "403": {description: "forbidden | notify.out_of_scope", $ref: "#/components/responses/Problem"}
        "404": {description: "notify.nudge_target_not_found", $ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "429": {description: "notify.nudge_rate_limited (retry_after_s, header Retry-After)", $ref: "#/components/responses/Problem"}
  # --- hết pf/notify ---

  /v1/geo/conflicts/{id}:
    get:
      summary: "Chi tiết xung đột ranh giới giữ cả hai phiên bản (US-SYNC-03): bản gây xung đột, bản hiện hành, thửa bị chồng lấn — không PII"
      operationId: getBoundaryConflict
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Xung đột kèm các phiên bản
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/BoundaryConflict"
                  - type: object
                    required: [versions]
                    properties:
                      versions:
                        type: array
                        items:
                          type: object
                          required: [role, boundary_id, plot_ref, plot_code, version, area_ha, current]
                          properties:
                            role: {type: string, enum: [record, current, overlapping]}
                            boundary_id: {type: string, format: uuid}
                            plot_ref: {type: string, format: uuid}
                            plot_code: {type: string}
                            version: {type: integer}
                            area_ha: {$ref: "#/components/schemas/Decimal"}
                            current: {type: boolean}
                            geometry: {$ref: "#/components/schemas/PolygonGeometry"}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/geo/admin-boundaries:
    get:
      summary: "G-05: ranh giới hành chính hiện hành theo cấp và đơn vị cha (FeatureCollection); đơn vị chưa có hình ở missing"
      operationId: listAdminBoundaries
      parameters:
        - {name: level, in: query, required: true, schema: {type: string, enum: [province, commune]}}
        - {name: parent, in: query, schema: {type: string}, description: "Mã tỉnh; bắt buộc với level=commune"}
        - {name: zoom, in: query, schema: {type: integer, minimum: 0, maximum: 22, default: 12}}
      responses:
        "200":
          description: Ranh giới
          content:
            application/geo+json:
              schema:
                type: object
                required: [type, features, missing]
                properties:
                  type: {type: string, enum: [FeatureCollection]}
                  features:
                    type: array
                    items:
                      type: object
                      required: [type, id, geometry, properties]
                      properties:
                        type: {type: string, enum: [Feature]}
                        id: {type: string}
                        geometry: {$ref: "#/components/schemas/PolygonGeometry"}
                        properties:
                          type: object
                          required: [code, level, name, parent_code, source, area_ha, imported_at]
                          properties:
                            code: {type: string}
                            level: {type: string, enum: [province, commune]}
                            name: {type: string}
                            parent_code: {type: [string, "null"]}
                            source: {type: string}
                            area_ha: {$ref: "#/components/schemas/Decimal"}
                            imported_at: {type: string, format: date-time}
                  missing: {type: array, items: {type: string}, description: "Mã đơn vị chưa nhập ranh giới"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/mechanization/area-sync-status:
    get:
      summary: Độ tươi dữ liệu App HTX và lần đồng bộ gần nhất theo HTX của một vụ (CGH FN-07 B5, AC-03) — chỉ báo "đang dùng dữ liệu nhập tay dự phòng"
      operationId: mechAreaSyncStatus
      parameters:
        - {name: season_code, in: query, required: true, schema: {type: string}}
        - {name: season_year, in: query, required: true, schema: {type: integer}}
      responses:
        "200":
          description: Độ tươi và nhật ký mới nhất theo HTX
          content:
            application/json:
              schema:
                type: object
                required: [last_app_htx_at, threshold_hours, stale, fallback_manual, message, items]
                properties:
                  last_app_htx_at: {type: [string, "null"], format: date-time}
                  threshold_hours: {type: string, description: "cgh.area_feed_stale_hours (mặc định 48)"}
                  stale: {type: boolean}
                  fallback_manual: {type: boolean}
                  message: {type: [string, "null"]}
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/MechAreaSyncCoop"}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/mechanization/area-sync-log:
    get:
      summary: Nhật ký đồng bộ và cập nhật thủ công diện tích vụ (CGH FN-07 B5, BR-04) — Admin CGH
      operationId: mechAreaSyncLog
      parameters:
        - {name: cooperative_ref, in: query, schema: {type: string, format: uuid}}
        - {name: season_code, in: query, schema: {type: string}}
        - {name: season_year, in: query, schema: {type: integer}}
        - {name: source, in: query, schema: {type: string, enum: [app_htx, manual]}}
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        "200":
          description: Một trang nhật ký, mới nhất trước
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  next_cursor: {type: [string, "null"]}
                  items: {type: array, items: {$ref: "#/components/schemas/MechAreaSyncLog"}}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/mechanization/forecasts:
    get:
      summary: "Dự báo nhu cầu đã lưu (FN-09, cgh.forecast/v1 — phương pháp tạm, cần DCRD xác nhận); chạy qua Admin API"
      operationId: mechListForecasts
      parameters:
        - {name: season_code, in: query, schema: {type: string}}
        - {name: season_year, in: query, schema: {type: integer}}
      responses:
        "200":
          description: Các lần chạy (mới nhất trước)
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/MechForecastRun"}}
  /v1/mechanization/forecasts/{id}:
    get:
      summary: Một lần dự báo đã lưu (không tính lại) và các dòng HTX × chủng loại trong phạm vi
      operationId: mechGetForecast
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: province_code, in: query, schema: {type: string}}
        - {name: commune_code, in: query, schema: {type: string}}
        - {name: cooperative_ref, in: query, schema: {type: string, format: uuid}}
        - {name: farm_stage, in: query, schema: {type: string}}
        - {name: machine_type, in: query, schema: {type: string}}
      responses:
        "200":
          description: Dự báo
          content:
            application/json:
              schema:
                type: object
                required: [run, results, summary]
                properties:
                  run: {$ref: "#/components/schemas/MechForecastRun"}
                  results: {type: array, items: {$ref: "#/components/schemas/MechForecastResult"}}
                  summary:
                    type: object
                    required: [forecast_area_ha, required_by_stage]
                    properties:
                      forecast_area_ha: {$ref: "#/components/schemas/Decimal"}
                      required_by_stage: {type: object, additionalProperties: {type: string}}
        "404": {description: mechanization.forecast_not_found, $ref: "#/components/responses/Problem"}
  # --- hết pf/mechanization ---

  /v1/dashboard:
    get:
      summary: "G-02 (US-DASH-01): bảng điều hành gộp — KPI pf/extension + HTX/hộ pf/party + thửa số hoá pf/geo + mục tiêu diện tích; tổng = tổng các con (toàn quốc = tổng các tỉnh); thiếu báo cáo → \"Số liệu tạm tính\""
      operationId: unifiedDashboard
      parameters:
        - {name: unit, in: query, schema: {type: string}, description: "Mã tỉnh/xã; bỏ trống = toàn quốc (nếu được) hoặc đơn vị phụ trách"}
        - {name: period, in: query, schema: {type: string, pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$"}}
      responses:
        "200":
          description: Bảng điều hành
          content:
            application/json:
              schema:
                type: object
                required: [unit, level, period, as_of, total, children, sources]
                properties:
                  unit: {type: [string, "null"]}
                  level: {type: string, enum: [national, province, commune]}
                  period: {type: string}
                  as_of: {type: string, format: date-time}
                  total: {$ref: "#/components/schemas/UnifiedFigures"}
                  children:
                    type: array
                    items:
                      allOf:
                        - $ref: "#/components/schemas/UnifiedFigures"
                        - type: object
                          required: [unit, name]
                          properties:
                            unit: {type: string}
                            name: {type: [string, "null"]}
                  sources: {type: array, items: {type: string}, description: "Module đã nối vào số liệu"}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/library:
    get:
      summary: "US-LIB-05: danh mục cá nhân (tài liệu đã lưu để đọc ngoại tuyến) của người gọi, mới lưu trước"
      operationId: listLibrary
      parameters:
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        "200":
          description: Một trang
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/LibraryItem"}}
                  next_cursor: {type: [string, "null"]}
  /v1/documents/{ref}/save:
    post:
      summary: "US-LIB-05: lưu tài liệu đang hiển thị vào danh mục cá nhân (đồng bộ xuống máy qua entity library_item)"
      operationId: saveDocument
      parameters:
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                note: {type: [string, "null"], maxLength: 500}
      responses:
        "200":
          description: Đã lưu
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LibraryItem"}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/documents/{ref}/unsave:
    post:
      summary: "US-LIB-05: bỏ lưu (không xóa cứng; máy nhận tombstone library_item)"
      operationId: unsaveDocument
      parameters:
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Đã bỏ lưu
          content:
            application/json:
              schema:
                type: object
                required: [document_ref, saved, removed_at]
                properties:
                  document_ref: {type: string, format: uuid}
                  saved: {type: boolean}
                  removed_at: {type: string, format: date-time}
        "404": {description: content.library_item_not_found, $ref: "#/components/responses/Problem"}
  # --- pf/reports: mẫu biểu, xuất Excel/PDF bất đồng bộ (mục 12, R-52), điểm kiểm soát xuất dữ liệu (mục 18) ---

  # Mẫu và lịch gửi quản trị qua Admin API (admin.yaml). Mọi yêu cầu xuất và cấp URL tải đi qua MỘT điểm kiểm soát:

  # nhật ký (không PII), hạn mức ngày reports.daily_export_quota (mặc định 50) → 429, vượt reports.export_anomaly_threshold

  # → sự kiện pf.reports.export.anomaly. Số liệu CGH lấy từ kết quả cân đối ĐÃ LƯU (FN-10 BR-04), không tính lại.
  # --- pf/extension: vòng đời báo cáo KN v7.7 (gói P4) ---
  # Mọi route cần X-AG-Context; vai trong ngữ cảnh: Cấp Tỉnh phát hành/rà soát/chốt/tổng hợp, Cấp Xã nhập, Cấp Quốc gia chỉ xem
  # (ghi → 403 extension.read_only). Sửa/mở lại/thu hồi là sự kiện bù (RB-1). Admin nhập thay mang on_behalf_of.
  /v1/extension/report-forms:
    get:
      summary: "Mẫu đã gán cho loại báo cáo của phòng ban (Bước 1 phát hành, FN-TI-02.02)"
      operationId: rcReportForms
      parameters:
        - {name: X-AG-Context, in: header, required: true, description: "Ngữ cảnh phiên KN (P1)", schema: {type: string, format: uuid}}
        - {name: report_type, in: query, schema: {type: string, enum: [weekly, monthly, seasonal, annual, adhoc]}}
        - {name: from_date, in: query, schema: {type: string, format: date}}
      responses:
        "200":
          description: Kết quả
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RcFormList"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/extension/report-batches/preview:
    post:
      summary: "Xem trước đợt phát hành: kỳ đã chia, số công việc = biểu × xã × kỳ, xã chưa có cán bộ"
      description: |
        Không ghi gì. Lịch kỳ hệ thống v2 (W11.03, QĐ-6 đề xuất, chờ Q-045): quy tắc lấy từ tham số
        extension.report_period_rule có hiệu lực tại from_date (nạp sẵn "kn.period_rule/v2;week_start=wed;week=year;month=week_end"
        từ 04/11/2026; trước đó/chưa có phiên bản → v1):
        tuần báo cáo Thứ Tư–Thứ Ba, nhãn "Tuần 41/2026" (tuần chứa 01/01 là tuần 1), tháng/quý/năm = các tuần có Thứ Ba
        thuộc kỳ. Hạn mặc định v2: tuần = 12:00 ngày sau ngày cuối kỳ, tháng = 10:00 Thứ Tư sau Thứ Ba cuối tháng.
        Đợt đã phát hành giữ period_rule đã ghi (v1 "kn.period_rule/v1-tam;week=season": tuần thứ Hai–Chủ nhật).
        W11.05b: period_type chọn kỳ ngày (day, hạn 09:00 hôm sau), tuần KSGM (ksgm_week — 4 tuần/tháng, ranh giới theo
        tham số extension.ksgm_week_starts:YYYY-MM, mặc định 1, 8, 15, 22) hoặc quý (quarter) — chỉ với quy tắc v2. Kỳ
        mang period_key; phát hành lưu khóa này (không tính lại khi tham số đổi).
      operationId: rcPreviewBatch
      parameters:
        - {name: X-AG-Context, in: header, required: true, description: "Ngữ cảnh phiên KN (P1)", schema: {type: string, format: uuid}}
        - {name: X-AG-Reason, in: header, required: false, description: "Lý do (bắt buộc ở chế độ hỗ trợ Admin, FN-AD-04.07)", schema: {type: string}}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RcBatchInput"}
      responses:
        "200":
          description: Kết quả
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RcPreview"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/extension/report-batches/provincial-import:
    post:
      summary: "Nạp giá trị cột Tỉnh giao từ tệp CSV UTF-8/.xlsx (FN-TI-02.02 Bước 4, UR-TI-02) — chỉ đọc tệp, không ghi"
      description: |
        Thân request là tệp (không multipart), đọc bằng shared/tabular (ô công thức → cả tệp bị từ chối). Một dòng một xã:
        cột "Mã xã" bắt buộc; mỗi cột Tỉnh giao có tiêu đề "<Mã biểu> <Chữ cột>" (vd "T01 E", "T01_E Diện tích giao");
        chỉ chọn một biểu thì "E"/"Cột E" cũng nhận. Cột không nhận ra → ignored_columns. Dòng lỗi (thiếu/trùng mã xã,
        số âm/không phải số) bị loại kèm lý do không chứa giá trị nhập; dòng khác vẫn nhận. Kết quả đưa vào provincial_values
        của POST /v1/extension/report-batches với provincial_source = excel (máy chủ kiểm lại phạm vi xã). Tối đa 500 dòng, 2 MB.
      operationId: rcImportProvincialValues
      parameters:
        - {name: X-AG-Context, in: header, required: true, description: "Ngữ cảnh phiên KN (P1)", schema: {type: string, format: uuid}}
        - {name: X-AG-Reason, in: header, required: false, description: "Lý do (bắt buộc ở chế độ hỗ trợ Admin, FN-AD-04.07)", schema: {type: string}}
        - $ref: "#/components/parameters/IdempotencyKey"
        - {name: report_type, in: query, required: true, schema: {type: string, enum: [weekly, monthly, seasonal, annual, adhoc]}}
        - {name: from_date, in: query, required: false, description: "Ngày bắt đầu đợt (chọn phiên bản mẫu áp dụng)", schema: {type: string, format: date}}
        - {name: template_ids, in: query, required: true, description: "template_id các biểu đã chọn, phân tách dấu phẩy", schema: {type: string}}
      requestBody:
        required: true
        content:
          text/csv: {schema: {type: string, format: binary}}
          application/vnd.openxmlformats-officedocument.spreadsheetml.sheet: {schema: {type: string, format: binary}}
      responses:
        "200":
          description: Giá trị đọc được và kết quả từng dòng
          content:
            application/json:
              schema:
                type: object
                required: [provincial_source, provincial_values, columns, ignored_columns, accepted, rejected, rows]
                properties:
                  provincial_source: {type: string, enum: [excel]}
                  provincial_values:
                    type: object
                    description: "template_id → mã xã → chữ cột → giá trị (như RcBatchInput.provincial_values)"
                    additionalProperties:
                      type: object
                      additionalProperties:
                        type: object
                        additionalProperties: {type: string}
                  columns:
                    type: array
                    items:
                      type: object
                      required: [header, template_id, form_code, letter]
                      properties:
                        header: {type: string}
                        template_id: {type: string, format: uuid}
                        form_code: {type: string}
                        letter: {type: string}
                  ignored_columns: {type: array, items: {type: string}}
                  accepted: {type: integer}
                  rejected: {type: integer}
                  rows:
                    type: array
                    items:
                      type: object
                      required: [row, commune_code, status, reason]
                      properties:
                        row: {type: integer, description: "Số dòng trong tệp (tiêu đề = 1)"}
                        commune_code: {type: string}
                        status: {type: string, enum: [accepted, rejected]}
                        reason: {type: [string, "null"], description: "Không chứa giá trị nhập"}
