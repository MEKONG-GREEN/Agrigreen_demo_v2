        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/regions/{id}/reactivate:
    post:
      summary: Dùng lại khu vực
      operationId: knReactivateRegion
      tags: [party]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "201":
          description: Đã dùng lại
          content:
            application/json:
              schema: {$ref: "#/components/schemas/KNRegion"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
  /v1/regions/{id}/log:
    get:
      summary: Khung Log của khu vực (cũ → mới)
      operationId: knRegionLog
      tags: [party]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: cursor, in: query, schema: {type: integer, minimum: 0}}
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Một trang
          content:
            application/json:
              schema: {$ref: "#/components/schemas/KNLogPage"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/orgs/tree:
    get:
      summary: "FN-AD-04.02: cây TTKNQG › TTKN tỉnh › Khu vực › Xã trong phạm vi người gọi (xem xuống, không ngang, không lên)"
      operationId: knAdminOrgTree
      tags: [party]
      parameters:
        - {name: include_inactive, in: query, schema: {type: boolean, default: false}}
      responses:
        "200":
          description: Rừng cây (gốc = Nút thấy được cao nhất)
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/KNOrgTreeNode"}}
  /v1/orgs/{ref}/region:
    post:
      summary: "Gán / đổi / bỏ (region_code null) Khu vực của Nút xã — đổi, bỏ cần lý do ≥ 10 ký tự (FN-AD-04.02)"
      operationId: knAssignRegion
      tags: [party]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [region_code]
              properties:
                region_code: {type: [string, "null"]}
                reason: {type: string, maxLength: 500}
      responses:
