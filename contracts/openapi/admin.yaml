openapi: 3.1.0
info:
  title: AgriGreen Admin API
  version: "1"
  description: |
    Bề mặt Admin (admin.<domain>) — OIDC + JWT + **MFA bắt buộc** cho mọi route (mục 11).
    Dữ liệu chủ, tham số, phê duyệt, nhật ký. Mọi POST bắt buộc Idempotency-Key (R-51).
    Lỗi theo RFC 9457 (docs/errors.md). Tenant lấy từ token, không bao giờ từ path/query/body (R-16).
    Thay đổi có phê duyệt dùng hai vai param_setter và param_approver; người duyệt không được là người đặt (R-56).

    Bề mặt Admin (admin.<domain>) — OIDC + MFA bắt buộc cho mọi route (mục 11).
    Dữ liệu chủ, tham số, phê duyệt, nhật ký. Mọi POST bắt buộc Idempotency-Key (R-51).
    Lỗi theo RFC 9457 (docs/errors.md). Tenant lấy từ token (R-16).

    Mỗi module giữ một phần riêng có đánh dấu "# --- <module> ---" để gộp dễ.
servers:
  - url: https://admin.agrigreen.vn
security:
  - oidc: []
paths:
  /v1/masterdata/catalog-imports:
    post:
      summary: Nhập danh mục hàng loạt từ CSV/XLSX (HTX US-CAT-02) — dòng hợp lệ được tạo trong một lần nhập, dòng lỗi kèm lý do
      description: |
        Vai masterdata_admin. Cột catalog (Danh mục), code (Mã), name (Tên); cột khác là thuộc tính của mục (vd growth_days).
        Mục đã có cùng nội dung → skipped; khác nội dung → rejected (sửa từng mục bằng PUT). Tối đa 500 dòng, 2 MB.
      operationId: importCatalogItems
      tags: [masterdata]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          text/csv: {schema: {type: string, format: binary}}
          application/vnd.openxmlformats-officedocument.spreadsheetml.sheet: {schema: {type: string, format: binary}}
      responses:
        "200":
          description: Kết quả
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CatalogImportResult"}
        "422": {description: "masterdata.catalog_import_invalid", $ref: "#/components/responses/Problem"}
  /v1/masterdata/catalog-imports/{id}:
    get:
      summary: Xem lại kết quả một lần nhập danh mục (US-CAT-02 AC-2)
      operationId: getCatalogImport
      tags: [masterdata]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Kết quả
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CatalogImportResult"}
        "404": {description: "masterdata.catalog_import_not_found", $ref: "#/components/responses/Problem"}
  /v1/masterdata/seed:
    post:
      summary: Nạp dữ liệu nền nhúng cho tenant của người gọi (chạy lặp an toàn)
      description: Vai masterdata_admin hoặc platform_admin. Đơn vị hành chính ĐBSCL, danh mục mặc định, tham số CGH đã duyệt.
      operationId: seedMasterdata
      tags: [masterdata]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Tổng kết
          content:
            application/json:
              schema:
                type: object
                properties:
                  admin_units: {$ref: "#/components/schemas/ImportResult"}
                  catalog_items_created: {type: integer}
                  params_created: {type: integer}
                  params_skipped: {type: integer}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/masterdata/admin-units/import:
    post:
      summary: Nhập danh mục đơn vị hành chính có hiệu lực theo thời gian
      description: |
        Vai masterdata_admin. Một giao dịch: thêm phiên bản mới, đóng hiệu lực phiên bản đang mở (valid_to + successors),
        bỏ qua dòng không đổi. Nhập lặp cùng tệp không đổi gì. Không bao giờ xóa hay sửa nội dung phiên bản đã có.
        Phát pf.masterdata.admin_unit.changed cho mỗi phiên bản thêm/đóng.
      operationId: importAdminUnits
      tags: [masterdata]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/GazetteerFile"}
      responses:
        "200":
          description: Tổng kết
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ImportResult"}
        "400": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "409": {description: "masterdata.admin_unit_conflict | masterdata.admin_unit_overlap", $ref: "#/components/responses/Problem"}
        "422": {description: "validation_failed | masterdata.admin_unit_invalid_reference", $ref: "#/components/responses/Problem"}
  /v1/masterdata/catalogs:
    get:
      summary: "G-06: danh sách danh mục kèm tên tiếng Việt, số mục, số mục ngừng dùng, thuộc tính (vai masterdata_admin)"
      operationId: mdListCatalogs
      responses:
        "200":
          description: Danh mục
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [catalog, name, item_count, inactive_count, attrs_schema]
                      properties:
                        catalog: {type: string}
                        name: {type: string}
                        item_count: {type: integer}
                        inactive_count: {type: integer}
                        attrs_schema: {type: array, items: {type: string}}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/masterdata/params:
    get:
      summary: "G-07: sổ đăng ký tham số — mọi khóa đã biết (kể cả chưa có phiên bản) và khóa đã có phiên bản, kèm tên, đơn vị, kiểu, khoảng hợp lệ, bản đang hiệu lực, số bản chờ duyệt"
      operationId: mdListParams
      parameters:
        - {name: prefix, in: query, schema: {type: string}, description: "Lọc theo tiền tố khóa, vd cgh."}
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Một trang (sắp theo khóa)
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [key, name, unit, kind, min, max, current, submitted_count]
                      properties:
                        key: {type: string}
                        name: {type: string}
                        unit: {type: string}
                        kind: {type: string, enum: [decimal, text, color], description: "color = mã màu HEX #RRGGBB (GIS US-CFG-01)"}
                        min: {type: [string, "null"]}
                        max: {type: [string, "null"]}
                        current:
                          oneOf:
                            - type: "null"
                            - type: object
                              required: [version, value, text, effective_from]
                              properties:
                                version: {type: integer}
                                value: {type: [string, "null"]}
                                text: {type: [string, "null"]}
                                effective_from: {type: string, format: date-time}
                        submitted_count: {type: integer}
                  next_cursor: {type: [string, "null"]}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/masterdata/catalogs/{catalog}/items:
    parameters:
      - $ref: "#/components/parameters/Catalog"
    get:
      summary: Liệt kê mục danh mục (mặc định gồm cả mục đã ngừng dùng)
      operationId: adminListCatalogItems
      tags: [masterdata]
      parameters:
        - {name: include_inactive, in: query, schema: {type: boolean, default: true}}
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Một trang
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/CatalogItem"}}
                  next_cursor: {type: [string, "null"]}
        "404": {$ref: "#/components/responses/Problem"}
    post:
      summary: Thêm mục danh mục (vai masterdata_admin)
      operationId: createCatalogItem
      tags: [masterdata]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CatalogItemInput"}
      responses:
        "201":
          description: Đã thêm. Gọi lặp cùng khóa trả lại đúng phản hồi này, kèm Idempotent-Replayed.
          headers:
            Location: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CatalogItem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {description: masterdata.catalog_not_found, $ref: "#/components/responses/Problem"}
        "409": {description: masterdata.catalog_item_exists, $ref: "#/components/responses/Problem"}
        "422": {description: "validation_failed | masterdata.farm_stage_invalid", $ref: "#/components/responses/Problem"}
  /v1/masterdata/catalogs/{catalog}/items/{code}:
    parameters:
      - $ref: "#/components/parameters/Catalog"
      - $ref: "#/components/parameters/ItemCode"
    put:
      summary: Sửa tên/thuộc tính (ghi lịch sử trước → sau; không đổi gì thì không ghi)
      operationId: updateCatalogItem
      tags: [masterdata]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CatalogItemInput"}
      responses:
        "200":
          description: Mục sau khi sửa
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CatalogItem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/masterdata/catalogs/{catalog}/items/{code}/deactivate:
    parameters:
      - $ref: "#/components/parameters/Catalog"
      - $ref: "#/components/parameters/ItemCode"
    post:
      summary: Ngừng dùng một mục (không xóa; lý do bắt buộc ≥ 10 ký tự)
      operationId: deactivateCatalogItem
      tags: [masterdata]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ReasonInput"}
      responses:
        "200":
          description: Mục đã ngừng dùng
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CatalogItem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {description: masterdata.catalog_item_state, $ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/masterdata/catalogs/{catalog}/items/{code}/reactivate:
    parameters:
      - $ref: "#/components/parameters/Catalog"
      - $ref: "#/components/parameters/ItemCode"
    post:
      summary: Dùng lại một mục đã ngừng
      operationId: reactivateCatalogItem
      tags: [masterdata]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ReasonInput"}
      responses:
        "200":
          description: Mục đang dùng
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CatalogItem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
  /v1/masterdata/catalogs/{catalog}/items/{code}/history:
    parameters:
      - $ref: "#/components/parameters/Catalog"
      - $ref: "#/components/parameters/ItemCode"
    get:
      summary: Lịch sử thay đổi của một mục (sổ chỉ ghi thêm, có chuỗi băm)
      operationId: catalogItemHistory
      tags: [masterdata]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Một trang, theo thứ tự ghi
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/CatalogChange"}}
                  next_cursor: {type: [string, "null"]}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/masterdata/params/versions:
    post:
      summary: Đề xuất phiên bản tham số (nháp, vai param_setter)
      description: |
        Số phiên bản tăng dần theo khóa. Nếu đã có phiên bản được duyệt cùng effective_from, phải nêu
        correction_reason — bản duyệt mới là bản ghi bù (supersedes_id), bản cũ vẫn trong sổ.
      operationId: proposeParam
      tags: [masterdata]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ParamProposal"}
      responses:
        "201":
          description: Đã tạo nháp
          headers:
            Location: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ParamVersion"}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {description: "validation_failed | masterdata.param_correction_required", $ref: "#/components/responses/Problem"}
    get:
      summary: Lịch sử phiên bản tham số (mọi trạng thái)
      operationId: listParamVersions
      tags: [masterdata]
      parameters:
        - {name: key, in: query, schema: {type: string}, examples: {norm: {value: "cgh.norm_ha_per_machine:MGD:thu_hoach"}}}
        - {name: status, in: query, schema: {type: string, enum: [draft, submitted, approved, rejected]}}
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Một trang, theo thứ tự tạo
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/ParamVersion"}}
                  next_cursor: {type: [string, "null"]}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/masterdata/params/versions/{id}:
    get:
      operationId: getParamVersion
      tags: [masterdata]
      parameters:
        - $ref: "#/components/parameters/VersionID"
      responses:
        "200":
          description: Phiên bản
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ParamVersion"}
        "404": {description: masterdata.param_version_not_found, $ref: "#/components/responses/Problem"}
  /v1/masterdata/params/versions/{id}/submit:
    post:
      summary: Gửi duyệt (chỉ người đặt)
      operationId: submitParamVersion
      tags: [masterdata]
      parameters:
        - $ref: "#/components/parameters/VersionID"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Đã gửi duyệt
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ParamVersion"}
        "403": {description: "forbidden | masterdata.param_not_setter", $ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {description: masterdata.param_invalid_transition, $ref: "#/components/responses/Problem"}
  /v1/masterdata/params/versions/{id}/approve:
    post:
      summary: Phê duyệt (vai param_approver, không phải người đặt — R-56)
      description: Ghi sổ param_approved và phát pf.masterdata.param.approved trong cùng giao dịch. Phiên bản đã duyệt bất biến.
      operationId: approveParamVersion
      tags: [masterdata]
      parameters:
        - $ref: "#/components/parameters/VersionID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        content:
          application/json:
            schema: {$ref: "#/components/schemas/DecisionInput"}
      responses:
        "200":
          description: Đã duyệt
          content:
            application/json:
              schema:
                type: object
                required: [version, approved]
                properties:
                  version: {$ref: "#/components/schemas/ParamVersion"}
                  approved: {$ref: "application.yaml#/components/schemas/ParamValue"}
        "403": {description: "forbidden | self_approval_forbidden", $ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {description: masterdata.param_invalid_transition, $ref: "#/components/responses/Problem"}
        "422": {description: masterdata.param_correction_required, $ref: "#/components/responses/Problem"}
  /v1/masterdata/params/versions/{id}/reject:
    post:
      summary: Từ chối (vai param_approver, không phải người đặt; lý do bắt buộc)
      operationId: rejectParamVersion
      tags: [masterdata]
      parameters:
        - $ref: "#/components/parameters/VersionID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/DecisionInput"}
      responses:
        "200":
          description: Đã từ chối
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ParamVersion"}
        "403": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/masterdata/params/restore-default:
    post:
      summary: Khôi phục mặc định / xóa cấu hình hiển thị (GIS US-CFG-02 AC-2) — tạo PHIÊN BẢN NHÁP mới mang giá trị mặc định nhúng, áp dụng khi được duyệt (R-56)
      description: |
        Không xóa phiên bản nào (RB-1, ADR-0011): "Xóa" một cấu hình = khôi phục giá trị mặc định bằng phiên bản mới,
        hiệu lực từ lúc đề xuất. Phiên bản đi qua gửi duyệt → phê duyệt bởi người khác người đặt; giá trị cũ vẫn
        trong sổ param_approved (tra cứu, kiểm toán). Vai param_setter. Khóa không có mặc định → 404 masterdata.param_no_default.
      operationId: restoreParamDefault
      tags: [masterdata]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key]
              properties:
                key: {type: string, examples: ["gis.stage_color:chin_ro"]}
                reason: {type: string, description: "Lý do (≥ 10 ký tự); bỏ trống → \"Khôi phục giá trị mặc định (GIS US-CFG-02)\""}
      responses:
        "201":
          description: Phiên bản nháp mang giá trị mặc định
          headers:
            Location: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ParamVersion"}
        "200":
          description: Gọi lặp cùng Idempotency-Key
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ParamVersion"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {description: masterdata.param_no_default, $ref: "#/components/responses/Problem"}
        "422": {description: "validation_failed (mã màu HEX, ngưỡng %) | masterdata.param_percent_thresholds", $ref: "#/components/responses/Problem"}
  # --- pf/party: tổ chức, HTX, nông hộ ---

  /v1/orgs:
    get:
      summary: "G-08: liệt kê cây tổ chức cho quản trị (toàn quốc thấy mọi tổ chức; quản trị tỉnh thấy trong tỉnh)"
      operationId: partyAdminListOrgs
      parameters:
        - {name: kind, in: query, schema: {type: string, enum: [ttkn_national, ttkn_province, extension_team, dcrd, cooperative, mkg, partner]}}
        - {name: parent_ref, in: query, schema: {type: string, format: uuid}, description: "Chỉ con trực tiếp của tổ chức này"}
        - {name: include_inactive, in: query, schema: {type: boolean, default: true}}
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Một trang
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/PartyOrg"}}
                  next_cursor: {type: [string, "null"]}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
    post:
      summary: Tạo tổ chức trong cây TW → Tỉnh → Xã; kind = cooperative kèm hồ sơ HTX, Mã HTX tự sinh
      operationId: partyCreateOrg
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PartyOrgInput"}
      responses:
        "201":
          description: Đã tạo; ghi sổ pf_party.org_event (action = created)
          headers:
            Location: {schema: {type: string}}
          content:
            application/json:
              schema:
                type: object
                required: [org, seq, representative_duplicate]
                properties:
                  org: {$ref: "#/components/schemas/PartyOrg"}
                  seq: {type: integer}
                  representative_duplicate: {type: boolean, description: "Người đại diện đã có trong kho định danh, dùng lại mã cũ"}
        "403": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
  /v1/orgs/export.xlsx:
    get:
      summary: Xuất cây tổ chức trong phạm vi ra Excel .xlsx (KN US-ADM-08) — cha luôn đứng trước con; tệp nhập lại được ngay
      description: |
        Cột: Mã tổ chức, Loại (mã kind), Tên, Mã đơn vị hành chính, Mã tổ chức cấp trên, Trạng thái (Hoạt động/Ngừng hoạt động).
        Gồm cả tổ chức ngừng hoạt động. Cấp trên ngoài phạm vi (vd TTKN QG khi TTKN tỉnh xuất) vẫn có mã để nối cây.
      operationId: partyExportOrgTree
      responses:
        "200":
          description: Tệp .xlsx (Content-Disposition attachment)
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: {type: string, format: binary}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/orgs/import:
    post:
      summary: Nhập cây tổ chức từ Excel .xlsx hoặc CSV UTF-8 (KN US-ADM-08), tối đa 500 dòng; kết quả theo từng dòng
      description: |
        Cùng cột với tệp xuất (tiêu đề có/không dấu; bắt buộc Mã tổ chức, Loại, Tên). Mã chưa có → tạo (CreateOrg);
        mã đã có → di chuyển nếu cấp trên/đơn vị khác (MoveOrg, ghi sổ với lý do `reason`), đổi tên nếu tên khác (RenameOrg).
        Dòng được xử lý cha trước con bất kể thứ tự trong tệp. HTX mới: để trống Mã tổ chức (Mã HTX do hệ thống sinh, CGH BR-01).
        Tệp không vô hiệu hóa tổ chức vắng mặt; cột Trạng thái chỉ để xem. Ô công thức, tệp .xls cũ, thiếu cột bắt buộc →
        từ chối cả tệp (party.import_invalid). Idem_key từng thao tác = Idempotency-Key + ":org:" + số dòng.
      operationId: partyImportOrgTree
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - {name: reason, in: query, schema: {type: string, minLength: 10}, description: "Lý do ghi sổ khi di chuyển/đổi tên; bỏ trống = \"Cập nhật cây tổ chức từ tệp nhập Excel\""}
      requestBody:
        required: true
        content:
          application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
            schema: {type: string, format: binary}
          text/csv:
            schema: {type: string}
      responses:
        "200":
          description: Kết quả theo dòng (thứ tự của tệp)
          content:
            application/json:
              schema:
                type: object
                required: [created, updated, unchanged, rejected, rows]
                properties:
                  created: {type: integer}
                  updated: {type: integer}
                  unchanged: {type: integer}
                  rejected: {type: integer}
                  rows:
                    type: array
                    items:
                      type: object
                      required: [row, status, code, org_ref, changes, reason]
                      properties:
                        row: {type: integer, description: "Số dòng trong tệp (dòng 1 là tiêu đề)"}
                        status: {type: string, enum: [created, updated, unchanged, rejected]}
                        code: {type: [string, "null"], description: "Mã tổ chức (HTX mới: mã vừa sinh)"}
                        org_ref: {type: [string, "null"], format: uuid}
                        changes: {type: array, items: {type: string, enum: [moved, renamed]}}
                        reason: {type: [string, "null"]}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/orgs/{ref}/move:
    post:
      summary: Di chuyển một nút kèm cả nhánh con sang cha mới (sáp nhập đơn vị hành chính), giữ lịch sử
      operationId: partyMoveOrg
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                new_parent_ref: {type: [string, "null"], format: uuid, description: "null = đưa lên gốc"}
                new_admin_unit_code: {type: string, description: "Mã đơn vị mới sau sáp nhập; bỏ trống = giữ"}
                reason: {type: string, minLength: 10}
      responses:
        "200": {$ref: "#/components/responses/PartyOrgChanged"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/orgs/{ref}/rename:
    post:
      summary: Đổi tên tổ chức (ghi sổ, action = renamed)
      operationId: partyRenameOrg
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string, maxLength: 200}
                reason: {type: string}
      responses:
        "200": {$ref: "#/components/responses/PartyOrgChanged"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/orgs/{ref}/events:
    get:
      summary: Nhật ký biến động chỉ đọc, lưu vĩnh viễn (HTX US-HTXSTATUS-03)
      operationId: partyOrgEvents
      parameters:
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Theo seq tăng dần
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/PartyOrgEvent"}}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/cooperatives/{ref}/deactivation-preview:
    get:
      summary: Phạm vi ảnh hưởng trước khi vô hiệu hóa HTX (HTX US-HTXSTATUS-01 AC-1) — số nông hộ, vụ chưa xong, nhật ký chờ duyệt
      description: >-
        Chỉ đọc, cùng vai và phạm vi với deactivate. Vụ chưa xong và nhật ký chờ duyệt đọc từ pf/cropcycle qua gốc lắp
        ráp; chưa nối → open_seasons, pending_logs = null và season_activity_available = false.
      operationId: partyCooperativeDeactivationPreview
      parameters:
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Phạm vi ảnh hưởng
          content:
            application/json:
              schema:
                type: object
                required: [cooperative_ref, active, active_households, active_children, open_seasons, pending_logs, season_activity_available]
                properties:
                  cooperative_ref: {type: string, format: uuid}
                  active: {type: boolean}
                  active_households: {type: integer, description: Nông hộ đang là thành viên}
                  active_children: {type: integer, description: Tổ chức con đang hoạt động (phải vô hiệu hóa trước)}
                  open_seasons: {type: [integer, "null"], description: Vụ đang mở (chưa hoàn thành)}
                  pending_logs: {type: [integer, "null"], description: Nhật ký canh tác chờ duyệt}
                  season_activity_available: {type: boolean}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
  /v1/cooperatives/{ref}/deactivate:
    post:
      summary: Vô hiệu hóa HTX (soft-delete) — lý do ≥ 20 ký tự; phát pf.party.org.deactivated để khóa tài khoản
      operationId: partyDeactivateCooperative
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string, minLength: 20}
      responses:
        "200": {$ref: "#/components/responses/PartyOrgChanged"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/cooperatives/{ref}/reactivate:
    post:
      summary: Kích hoạt lại HTX; phát pf.party.org.reactivated
      operationId: partyReactivateCooperative
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: {type: string}
      responses:
        "200": {$ref: "#/components/responses/PartyOrgChanged"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
  /v1/cooperatives/import-template.xlsx:
    get:
      summary: Tệp .xlsx mẫu để nhập HTX hàng loạt (HTX US-HTX-02)
      operationId: partyCooperativeImportTemplate
      responses:
        "200":
          description: Tệp mẫu (tiêu đề + một dòng ví dụ)
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: {type: string, format: binary}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/cooperatives/import:
    post:
      summary: Nhập hồ sơ HTX hàng loạt từ .xlsx hoặc CSV UTF-8 (HTX US-HTX-02), tối đa 200 dòng, 2 MB; kết quả theo dòng
      description: |
        Cột (tiêu đề có/không dấu): "Tên HTX", "Địa chỉ", "Người đại diện", "SĐT", "Mã xã" (bắt buộc), "Mã số thuế",
        "Diện tích (ha)", "Ngày thành lập" (YYYY-MM-DD), "Mã tổ chức cấp trên". Mã HTX do hệ thống sinh (CGH BR-01).
        Người đại diện và SĐT đi thẳng vào kho định danh (mục đích registry.admin) — không lưu ở pf_party (R-04).
        Tệp không đọc được (không phải .xlsx/CSV, .xls cũ, ô công thức, quá lớn) → 422 party.import_invalid với detail
        bắt đầu "Sai định dạng file". Thiếu cột bắt buộc trong tiêu đề hoặc ô bắt buộc trống → TỪNG DÒNG bị loại với lý do
        "Thiếu cột bắt buộc: <tên cột>"; tên HTX trùng → "Tên HTX này đã tồn tại, vui lòng chọn tên khác."; dòng hợp lệ
        khác vẫn được tạo. Mỗi dòng ghi sổ với idem_key <Idempotency-Key>:row:<n> — gọi lặp không tạo trùng.
        Vai: registry_admin, kn_province_admin (chỉ xã trong tỉnh), platform_admin.
      operationId: partyImportCooperatives
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          text/csv:
            schema: {type: string}
          application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
            schema: {type: string, format: binary}
      responses:
        "200":
          description: Kết quả theo dòng
          content:
            application/json:
              schema:
                type: object
                required: [created, rejected, rows]
                properties:
                  created: {type: integer}
                  rejected: {type: integer}
                  rows:
                    type: array
                    items:
                      type: object
                      required: [row, status, reason, org_ref, code, name]
                      properties:
                        row: {type: integer, description: "Số dòng trong tệp (dòng 1 là tiêu đề)"}
                        status: {type: string, enum: [created, rejected]}
                        reason: {type: [string, "null"], description: "Không chứa dữ liệu cá nhân"}
                        org_ref: {type: [string, "null"], format: uuid}
                        code: {type: [string, "null"], description: "Mã HTX hệ thống sinh"}
                        name: {type: [string, "null"], description: "Tên HTX ở dòng này"}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
  /v1/cooperatives/{ref}/copy:
    post:
      summary: Sao chép hồ sơ HTX (HTX US-HTX-03) — giữ địa bàn và cấu trúc, sửa riêng Tên và Người đại diện
      description: |
        Bản sao giữ mã xã, địa chỉ, tổ chức cấp trên (nếu còn hoạt động), diện tích đăng ký, ngày thành lập của hồ sơ nguồn.
        KHÔNG sao chép: Mã HTX (sinh mới), mã số thuế, toạ độ trụ sở, người đại diện (gửi `representative` mới hoặc bỏ trống).
        Tên trùng HTX đã có (không phân biệt hoa thường) → 409 party.cooperative_name_taken
        "Tên HTX này đã tồn tại, vui lòng chọn tên khác." Nguồn ngoài phạm vi → 404.
      operationId: partyCopyCooperative
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string, maxLength: 200}
                representative:
                  type: object
                  required: [full_name, phone]
                  description: Người đại diện của bản sao — chuyển thẳng vào kho định danh
                  properties:
                    full_name: {type: string}
                    phone: {type: string}
      responses:
        "201":
          description: Đã tạo bản sao
          content:
            application/json:
              schema:
                type: object
                required: [org, source_ref, representative_duplicate]
                properties:
                  org: {$ref: "#/components/schemas/PartyOrg"}
                  source_ref: {type: string, format: uuid}
                  representative_duplicate: {type: boolean}
        "200":
          description: Gọi lặp cùng Idempotency-Key
          content:
            application/json:
              schema:
                type: object
                required: [org, source_ref, representative_duplicate]
                properties:
                  org: {$ref: "#/components/schemas/PartyOrg"}
                  source_ref: {type: string, format: uuid}
                  representative_duplicate: {type: boolean}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/households/import:
    post:
      summary: Nhập nông hộ từ CSV UTF-8 hoặc Excel .xlsx (dòng đầu là tiêu đề), tối đa 200 dòng, 2 MB; kết quả theo từng dòng
      description: |
        Định dạng nhận theo chữ ký tệp; .xlsx đọc trang tính đầu. Cột (tiêu đề có/không dấu, vd "Họ tên" = ho_ten):
        full_name|ho_ten, phone|so_dien_thoai, national_id|cccd, address|dia_chi,
        cooperative_code|ma_htx, commune_code|ma_xa, cultivated_area_ha|dien_tich_ha,
        member_since|ngay_vao_htx (YYYY-MM-DD hoặc ô ngày Excel). Bắt buộc: full_name, phone, cooperative_code.
        Thiếu cột bắt buộc, ô công thức (hệ thống không tính công thức), tệp .xls cũ → từ chối cả tệp (party.import_invalid).
      operationId: partyImportHouseholds
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          text/csv:
            schema: {type: string}
          application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
            schema: {type: string, format: binary}
      responses:
        "200":
          description: Kết quả theo dòng
          content:
            application/json:
              schema:
                type: object
                required: [accepted, duplicate, rejected, rows]
                properties:
                  accepted: {type: integer}
                  duplicate: {type: integer}
                  rejected: {type: integer}
                  rows:
                    type: array
                    items:
                      type: object
                      required: [row, status, reason, household_ref]
                      properties:
                        row: {type: integer, description: "Số dòng trong tệp (dòng 1 là tiêu đề)"}
                        status: {type: string, enum: [accepted, duplicate, rejected]}
                        reason: {type: [string, "null"], description: "Không chứa dữ liệu cá nhân"}
                        household_ref: {type: [string, "null"], format: uuid}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  # --- hết pf/party ---

  # --- pf/sync --- (docs/dev/sync-contract.md)
  /v1/devices:
    get:
      summary: Liệt kê thiết bị của tenant (vai device_admin)
      operationId: syncListDevices
      parameters:
        - {name: actor_ref, in: query, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Một trang
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/SyncDeviceAdmin"}}
                  next_cursor: {type: [string, "null"]}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/devices/{id}/revoke:
    post:
      summary: Thu hồi thiết bị — mọi lời gọi đồng bộ sau đó trả 403 sync.device_revoked, app xóa dữ liệu cục bộ; phát pf.sync.device.revoked
      operationId: syncRevokeDevice
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string, minLength: 10, maxLength: 500}
      responses:
        "200":
          description: Đã thu hồi
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SyncDeviceAdmin"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {description: "sync.device_not_found", $ref: "#/components/responses/Problem"}
        "409": {description: "sync.device_already_revoked", $ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/sync/conflicts:
    get:
      summary: Sổ đăng ký xung đột đồng bộ (vai sync_conflict_resolver), SLA C-8
      operationId: syncListConflicts
      parameters:
        - {name: status, in: query, schema: {type: string, enum: [open, resolved]}}
        - {name: overdue, in: query, description: "true = chỉ mục đang mở đã quá due_at", schema: {type: boolean}}
        - {name: owner_org_ref, in: query, schema: {type: string, format: uuid}}
        - {name: entity, in: query, schema: {type: string}, description: "US-SYNC-03: lọc theo entity"}
        - {name: sla, in: query, schema: {type: string, enum: [on_track, due_soon, overdue]}, description: "US-SYNC-03: due_soon = còn hạn dưới 24 giờ"}
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Một trang
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/SyncConflict"}}
                  next_cursor: {type: [string, "null"]}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/sync/conflicts/{id}:
    get:
      summary: "US-SYNC-03: chi tiết xung đột — các bản ghi máy gửi (không payload) và các phiên bản do module sở hữu cung cấp (không PII)"
      operationId: syncGetConflict
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Xung đột
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SyncConflict"
                  - type: object
                    required: [resolution, records, versions, versions_available]
                    properties:
                      resolution: {type: [string, "null"], enum: [keep_version, correction, null]}
                      versions_available: {type: boolean}
                      records:
                        type: array
                        items:
                          type: object
                          required: [record_id, record_idem_key, entity, op, status, device_id, actor_ref, event_time, supersedes_id, payload_sha256]
                          properties:
                            record_id: {type: [string, "null"], format: uuid}
                            record_idem_key: {type: string}
                            entity: {type: string}
                            op: {type: string}
                            status: {type: string}
                            device_id: {type: string, format: uuid}
                            actor_ref: {type: string, format: uuid}
                            event_time: {type: string, format: date-time}
                            supersedes_id: {type: [string, "null"], format: uuid}
                            payload_sha256: {type: [string, "null"]}
                      versions:
                        type: array
                        items:
                          type: object
                          required: [record_id, role, label, current, event_time, data]
                          properties:
                            record_id: {type: string, format: uuid}
                            role: {type: string, enum: [record, current, overlapping]}
                            label: {type: string}
                            current: {type: boolean}
                            event_time: {type: string, format: date-time}
                            data: {type: object, description: "Dữ liệu phiên bản của module sở hữu (vd plot_boundary: plot_ref, plot_code, area_ha, geometry)"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {description: "sync.conflict_not_found", $ref: "#/components/responses/Problem"}
  /v1/sync/conflicts/{id}/resolve:
    post:
      summary: Đóng xung đột; phát pf.sync.conflict.resolved để module sở hữu entity áp quyết định bằng bản ghi bù
      operationId: syncResolveConflict
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note]
              properties:
                note: {type: string, minLength: 10, maxLength: 500}
                resolved_record_id: {type: string, format: uuid, description: "Bản ghi được giữ (keep_version) hoặc bản ghi bù đã tạo ở module sở hữu (correction)"}
                resolution: {type: string, enum: [keep_version, correction], description: "US-SYNC-03 (tùy chọn): keep_version bắt buộc resolved_record_id thuộc xung đột; correction không được trỏ bản ghi của xung đột"}
      responses:
        "200":
          description: Đã đóng
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SyncConflict"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {description: "sync.conflict_state — đã đóng", $ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/sync/integrations:
    get:
      summary: Giám sát đồng bộ tích hợp theo nguồn (GIS US-SYNC-01 AC-1) — mỗi consumer một dòng
      description: |
        Gộp lần xử lý thành công (shared.inbox) và thất bại (pf_sync.integration_failure) theo consumer trong cửa sổ
        window_hours (mặc định 24, tối đa 720): số sự kiện xử lý, lần thành công gần nhất, số lần lỗi, số sự kiện vào
        hàng chờ lỗi (DLQ), mã lỗi gần nhất (đã chuẩn hóa, không có thông điệp tự do — R-14), độ sâu DLQ hiện tại
        (RabbitMQ management API; null khi chưa cấu hình AG_RABBITMQ_MGMT_URL). Vai platform_admin, device_admin.
      operationId: syncIntegrations
      parameters:
        - {name: window_hours, in: query, schema: {type: integer, minimum: 1, maximum: 720, default: 24}}
        - {name: consumer, in: query, description: "Lọc theo nguồn (tên consumer)", schema: {type: string}}
        - {name: status, in: query, schema: {type: string, enum: [ok, error, idle]}}
      responses:
        "200":
          description: Tình trạng từng luồng đồng bộ
          content:
            application/json:
              schema:
                type: object
                required: [since, dlq_available, items]
                properties:
                  since: {type: string, format: date-time}
                  dlq_available: {type: boolean}
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/SyncIntegration"}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/sync/integrations/log:
    get:
      summary: Nhật ký đồng bộ tích hợp (GIS US-SYNC-01 AC-1) — thời điểm, nguồn, số bản ghi, thành công/lỗi, mã lỗi; mới nhất trước
      operationId: syncIntegrationLog
      parameters:
        - {name: consumer, in: query, schema: {type: string}}
        - {name: status, in: query, schema: {type: string, enum: [ok, error]}}
        - {name: from, in: query, description: "Mặc định: to − 7 ngày", schema: {type: string, format: date-time}}
        - {name: to, in: query, schema: {type: string, format: date-time}}
        - $ref: "#/components/parameters/Cursor"
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        "200":
          description: Một trang nhật ký
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  next_cursor: {type: [string, "null"]}
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/SyncIntegrationLogEntry"}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  # --- hết pf/sync ---

  # --- pf/mrv ---

  # Danh mục trường bằng chứng MRV có phiên bản + phê duyệt (R-56 dùng lại param_setter/param_approver).

  # Danh mục thương mại chưa chốt (C-1): thêm/đổi trường = phiên bản mới, không cần migration.
  /v1/mrv/catalog/seed:
    post:
      summary: Nạp danh mục mẫu G1 (awd_log, field_checklist) dạng NHÁP, provisional — loại đã có phiên bản thì bỏ qua
      operationId: seedMrvCatalog
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Kết quả theo loại minh chứng
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [evidence_type, created, version]
                      properties:
                        evidence_type: {type: string}
                        created: {type: boolean}
                        version: {oneOf: [{$ref: "#/components/schemas/MrvCatalogVersion"}, {type: "null"}]}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/mrv/catalog/versions:
    post:
      summary: Đề xuất phiên bản danh mục trường (vai param_setter) — số phiên bản tăng theo loại minh chứng
      operationId: proposeMrvCatalogVersion
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MrvCatalogInput"}
      responses:
        "201":
          description: Nháp đã tạo
          headers:
            Location: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MrvCatalogVersion"}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
    get:
      summary: Lịch sử phiên bản danh mục (mọi trạng thái)
      operationId: listMrvCatalogVersions
      parameters:
        - {name: evidence_type, in: query, schema: {type: string}}
        - {name: status, in: query, schema: {type: string, enum: [draft, submitted, approved, rejected]}}
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Một trang
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/MrvCatalogVersion"}}
                  next_cursor: {type: [string, "null"]}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/mrv/catalog/versions/{id}:
    get:
      operationId: getMrvCatalogVersion
      parameters:
        - $ref: "#/components/parameters/VersionID"
      responses:
        "200":
          description: Phiên bản
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MrvCatalogVersion"}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/mrv/catalog/versions/{id}/submit:
    post:
      summary: Gửi duyệt — chỉ người đặt
      operationId: submitMrvCatalogVersion
      parameters:
        - $ref: "#/components/parameters/VersionID"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Đã gửi duyệt
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MrvCatalogVersion"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
  /v1/mrv/catalog/versions/{id}/approve:
    post:
      summary: Phê duyệt (vai param_approver; không được là người đặt — self_approval_forbidden)
      operationId: approveMrvCatalogVersion
      parameters:
        - $ref: "#/components/parameters/VersionID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                note: {type: string, maxLength: 500}
      responses:
        "200":
          description: Đã duyệt — dùng được để thu minh chứng
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MrvCatalogVersion"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
  /v1/mrv/catalog/versions/{id}/reject:
    post:
      summary: Từ chối (vai param_approver; bắt buộc lý do)
      operationId: rejectMrvCatalogVersion
      parameters:
        - $ref: "#/components/parameters/VersionID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note]
              properties:
                note: {type: string, minLength: 5, maxLength: 500}
      responses:
        "200":
          description: Đã từ chối
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MrvCatalogVersion"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/mrv/methods:
    post:
      summary: Đề xuất phương pháp ước tính CO2 (vai param_setter) — ghim phiên bản tham số masterdata; trạng thái submitted
      description: >-
        Chờ khách ký phương pháp (C-1). Ước tính chỉ "chính thức" khi có phương pháp ĐÃ DUYỆT (người duyệt ≠ người đề xuất,
        R-56) cùng rule_version và mọi tham số đã dùng là bản đã duyệt đúng phiên bản được ghim.
      operationId: proposeMrvMethod
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rule_version, params, source_note]
              properties:
                rule_version: {type: string, examples: [mrv.co2.estimate.v1]}
                source_note: {type: string, minLength: 5, maxLength: 1000, description: Văn bản phương pháp đã ký}
                params:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items: {$ref: "#/components/schemas/MrvParamPin"}
      responses:
        "200":
          description: Gọi lặp cùng Idempotency-Key
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MrvMethodVersion"}
        "201":
          description: Đã đề xuất
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MrvMethodVersion"}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
    get:
      summary: Danh sách phiên bản phương pháp (param_setter, param_approver)
      operationId: listMrvMethods
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Trang kết quả
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/MrvMethodVersion"}}
                  next_cursor: {type: [string, "null"]}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/mrv/methods/{id}/approve:
    post:
      summary: Duyệt phương pháp (vai param_approver; không được là người đề xuất)
      operationId: approveMrvMethod
      parameters:
        - $ref: "#/components/parameters/VersionID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                note: {type: string, maxLength: 500}
      responses:
        "200":
          description: Đã duyệt
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MrvMethodVersion"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
  /v1/mrv/methods/{id}/reject:
    post:
      summary: Từ chối phương pháp (vai param_approver; bắt buộc lý do)
      operationId: rejectMrvMethod
      parameters:
        - $ref: "#/components/parameters/VersionID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note]
              properties:
                note: {type: string, minLength: 5, maxLength: 500}
      responses:
        "200":
          description: Đã từ chối
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MrvMethodVersion"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  # --- pf/content: soạn, duyệt, xuất bản tài liệu (content_editor_national, content_editor_province, content_reviewer) ---

  # Người duyệt xuất bản không được là tác giả phiên bản (R-56 → self_approval_forbidden).

  # TTKN tỉnh chỉ soạn phạm vi tỉnh/xã của mình, không soạn quy trình chuẩn quốc gia (KN BR-06).
  /v1/documents:
    get:
      summary: Tài liệu mọi trạng thái trong phạm vi người gọi (sắp theo ref giảm dần)
      operationId: adminListDocuments
      tags: [content]
      parameters:
        - {name: status, in: query, description: "Một hoặc nhiều trạng thái, phân tách bằng dấu phẩy", schema: {type: string}}
        - {name: kind, in: query, schema: {$ref: "#/components/schemas/ContentKind"}}
        - {name: tag, in: query, schema: {type: string}}
        - {name: category, in: query, schema: {type: string}}
        - {name: q, in: query, schema: {type: string}}
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Một trang
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/ContentAdminDocument"}}
                  next_cursor: {type: [string, "null"]}
        "403": {$ref: "#/components/responses/Problem"}
    post:
      summary: Tạo tài liệu ở trạng thái nháp (phiên bản 1). Tệp đính kèm tải sau, gắn bằng phiên bản mới.
      operationId: createDocument
      tags: [content]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/ContentInput"
                - type: object
                  required: [kind, audience]
                  properties:
                    kind: {$ref: "#/components/schemas/ContentKind"}
                    audience:
                      type: object
                      required: [level]
                      properties:
                        level: {type: string, enum: [national, province, commune]}
                        units: {type: array, items: {type: string}}
                    parent_ref: {type: [string, "null"], format: uuid, description: "Bắt buộc với supplement: quy trình chuẩn TW đã xuất bản"}
      responses:
        "201": {$ref: "#/components/responses/ContentDocumentVersion"}
        "403": {description: "forbidden, content.out_of_scope, content.kind_not_allowed", $ref: "#/components/responses/Problem"}
        "422": {description: "validation_failed, content.audience_invalid, content.tag_invalid, content.parent_invalid", $ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
  /v1/documents/extract:
    post:
      summary: Trích nội dung từ Word (.docx) hoặc PDF có lớp chữ để điền sẵn bản nháp — không lưu, không xuất bản (KN US-LIB-03, HTX US-CMS-02)
      description: |
        PDF: đọc chữ qua bảng ToUnicode của phông (tiếng Việt có dấu, chuẩn hóa NFC), ghép dòng thành đoạn, cỡ chữ lớn thành tiêu đề.
        PDF ảnh scan (không có lớp chữ, không OCR), PDF mã hóa, phông không giải mã được, .doc cũ → 422 content.extract_unsupported
        kèm lý do ở detail; tệp hỏng → 422 content.extract_failed.
      operationId: extractDocument
      tags: [content]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary, description: "Tối đa 15 MB"}
      responses:
        "200":
          description: Nội dung trích (Markdown đã lọc)
          content:
            application/json:
              schema:
                type: object
                required: [title, body, body_format, status]
                properties:
                  title: {type: string}
                  body: {type: string}
                  body_format: {type: string, enum: [markdown]}
                  status: {type: string, enum: [draft_only]}
        "413": {description: content.file_too_large, $ref: "#/components/responses/Problem"}
        "415": {description: content.file_type_not_allowed, $ref: "#/components/responses/Problem"}
        "422": {description: "content.extract_unsupported (PDF, .doc), content.extract_failed (tệp lỗi, ảnh scan)", $ref: "#/components/responses/Problem"}
  /v1/documents/{ref}:
    parameters:
      - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      summary: Tài liệu (mọi trạng thái) và lịch sử phiên bản
      operationId: adminGetDocument
      tags: [content]
      responses:
        "200":
          description: Tài liệu
          content:
            application/json:
              schema:
                type: object
                required: [document, versions]
                properties:
                  document: {$ref: "#/components/schemas/ContentAdminDocument"}
                  versions: {type: array, items: {$ref: "#/components/schemas/ContentVersionInfo"}}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/documents/{ref}/versions:
    parameters:
      - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      summary: Thêm phiên bản nháp mới (ghi thêm vào sổ; bản đã xuất bản vẫn hiển thị tới khi bản mới được duyệt)
      operationId: createDocumentVersion
      tags: [content]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ContentInput"}
      responses:
        "201": {$ref: "#/components/responses/ContentDocumentVersion"}
        "409": {description: "content.invalid_transition — đang chờ duyệt hoặc đã gỡ", $ref: "#/components/responses/Problem"}
        "422": {description: "content.attachment_not_found, content.tag_invalid, validation_failed", $ref: "#/components/responses/Problem"}
  /v1/documents/{ref}/versions/{no}:
    parameters:
      - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: no, in: path, required: true, schema: {type: integer, minimum: 1}}
    get:
      summary: Một phiên bản đầy đủ — xem trước giao diện mobile trước khi xuất bản (HTX US-CMS-01)
      operationId: adminGetDocumentVersion
      tags: [content]
      responses:
        "200": {$ref: "#/components/responses/ContentDocumentVersion"}
        "404": {description: content.version_not_found, $ref: "#/components/responses/Problem"}
  /v1/documents/{ref}/attachments:
    parameters:
      - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      summary: Tải tệp đính kèm (PDF, .docx, JPEG/PNG/WebP, MP4; ≤ 15 MB) — lưu kho đối tượng ghi một lần, kiểm SHA-256
      operationId: uploadDocumentAttachment
      tags: [content]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, sha256]
              properties:
                file: {type: string, format: binary}
                sha256: {type: string, pattern: "^[0-9a-fA-F]{64}$", description: SHA-256 nội dung do client tính}
      responses:
        "201":
          description: Đã lưu
          content:
            application/json:
              schema:
                type: object
                required: [id, document_ref, file_name, content_type, size, sha256, created_at]
                properties:
                  id: {type: string, format: uuid}
                  document_ref: {type: string, format: uuid}
                  file_name: {type: string}
                  content_type: {type: string}
                  size: {type: integer}
                  sha256: {type: string}
                  created_at: {type: string, format: date-time}
        "413": {description: content.file_too_large, $ref: "#/components/responses/Problem"}
        "415": {description: content.file_type_not_allowed, $ref: "#/components/responses/Problem"}
        "422": {description: content.checksum_mismatch, $ref: "#/components/responses/Problem"}
        "503": {description: "content.dependency_unavailable — chưa cấu hình kho đối tượng", $ref: "#/components/responses/Problem"}
  /v1/documents/{ref}/submit:
    parameters:
      - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      summary: Gửi phiên bản nháp mới nhất đi duyệt (draft → review)
      operationId: submitDocument
      tags: [content]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody: {$ref: "#/components/requestBodies/ContentTransition"}
      responses:
        "200": {$ref: "#/components/responses/ContentDocumentState"}
        "409": {description: content.invalid_transition, $ref: "#/components/responses/Problem"}
  /v1/documents/{ref}/return:
    parameters:
      - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      summary: Người duyệt trả lại phiên bản đang chờ duyệt, lý do ≥ 10 ký tự
      operationId: returnDocument
      tags: [content]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody: {$ref: "#/components/requestBodies/ContentTransition"}
      responses:
        "200": {$ref: "#/components/responses/ContentDocumentState"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/documents/{ref}/publish:
    parameters:
      - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      summary: Xuất bản phiên bản đang chờ duyệt; phát pf.content.document.published (và pf.content.alert.published với cảnh báo)
      operationId: publishDocument
      tags: [content]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody: {$ref: "#/components/requestBodies/ContentTransition"}
      responses:
        "200": {$ref: "#/components/responses/ContentDocumentVersion"}
        "403": {description: "self_approval_forbidden (tác giả tự duyệt), content.out_of_scope", $ref: "#/components/responses/Problem"}
        "409": {description: content.invalid_transition, $ref: "#/components/responses/Problem"}
        "422": {description: "validation_failed (BR-05 thiếu phân loại, tin thiếu chuyên mục), content.parent_invalid", $ref: "#/components/responses/Problem"}
  /v1/documents/{ref}/retire:
    parameters:
      - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      summary: Gỡ tài liệu (ẩn với người đọc, máy nhận tombstone); lý do ≥ 10 ký tự. Không xóa phiên bản nào.
      operationId: retireDocument
      tags: [content]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody: {$ref: "#/components/requestBodies/ContentTransition"}
      responses:
        "200": {$ref: "#/components/responses/ContentDocumentState"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/documents/{ref}/duplicate:
    parameters:
      - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      summary: Nhân bản thành tài liệu nháp mới, giữ nội dung, ảnh bìa, chuyên mục (HTX US-CMS-02 AC-1)
      operationId: duplicateDocument
      tags: [content]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "201": {$ref: "#/components/responses/ContentDocumentVersion"}
        "404": {$ref: "#/components/responses/Problem"}
  # --- hết pf/content ---

  # --- pf/geo ---
  /v1/geo/plots/import:
    post:
      summary: Nhập tệp ranh giới thửa GeoJSON/KML/Shapefile (.zip) (KN US-PLOT-02, GIS FN-05) — mỗi vùng thành một thửa, cùng quy tắc như vẽ tay; kết quả theo từng đối tượng
      description: |
        Thân request là nội dung tệp (≤ 200 đối tượng, ≤ 10 MB, xử lý đồng bộ). Chỉ nhận WGS84 (EPSG:4326):
        thành phần crs khác hoặc toạ độ ngoài miền kinh/vĩ độ (VN-2000/UTM) → 422 geo.crs_unsupported.
        Shapefile: gói .zip gồm .shp (Polygon/PolygonZ/PolygonM), .dbf, .prj (.shx, .cpg tùy chọn). .prj phải là
        GEOGCS WGS84; VN-2000 hoặc hệ chiếu phẳng → 422 geo.crs_unsupported (hệ thống không tự chuyển VN-2000 —
        chuyển sang EPSG:4326 bằng QGIS/ArcGIS trước). Tải .shp rời → 422 geo.format_invalid. Thuộc tính .dbf
        (tên trường không phân biệt hoa thường): TEN/TEN_THUA/MA_THUA (hoặc SO_TO + SO_THUA → "Tờ … thửa …") làm tên thửa
        (mã thửa do hệ thống sinh), MA_XA → commune_code, MA_HTX → Mã HTX tra ra cooperative_ref.
        Thuộc tính đối tượng được đọc (mọi định dạng): name, commune_code (hoặc ma_xa), cooperative_ref,
        cooperative_code (hoặc ma_htx; không có HTX mã này → đối tượng bị loại geo.cooperative_invalid), household_ref. Idem_key từng đối tượng =
        Idempotency-Key + ":" + thứ tự, nên nhập lại cùng khóa trả duplicate, không tạo trùng.
      operationId: importPlotBoundaries
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - {name: format, in: query, schema: {type: string, enum: [geojson, kml, shapefile]}, description: "Bỏ trống → nhận từ file_name hoặc nội dung"}
        - {name: file_name, in: query, schema: {type: string}}
        - {name: commune_code, in: query, schema: {type: string}, description: "Mặc định khi đối tượng không có commune_code"}
        - {name: cooperative_ref, in: query, schema: {type: string, format: uuid}, description: "Mặc định khi đối tượng không có cooperative_ref"}
        - {name: source, in: query, schema: {type: string, enum: [import_file, cadastral], default: import_file}}
        - {name: confirm_overlap, in: query, schema: {type: boolean, default: false}, description: "Nhận cả đối tượng chồng lấn cùng HTX/thửa nháp (mở xung đột xem xét); chồng lấn HTX khác luôn bị loại"}
      requestBody:
        required: true
        content:
          application/geo+json: {schema: {type: object}}
          application/json: {schema: {type: object}}
          application/vnd.google-earth.kml+xml: {schema: {type: string}}
          application/zip: {schema: {type: string, format: binary}}
      responses:
        "200":
          description: Kết quả theo đối tượng
          content:
            application/json:
              schema:
                type: object
                required: [format, accepted, flagged, duplicate, rejected, features]
                properties:
                  format: {type: string, enum: [geojson, kml, shapefile]}
                  accepted: {type: integer}
                  flagged: {type: integer, description: "Đã tạo, chồng lấn cùng HTX/thửa nháp đã xác nhận — chờ xem xét"}
                  duplicate: {type: integer}
                  rejected: {type: integer}
                  features:
                    type: array
                    items:
                      type: object
                      required: [index, name, status, code, reason, plot_ref, plot_code, area_ha, flagged_overlaps]
                      properties:
                        index: {type: integer}
                        name: {type: [string, "null"]}
                        status: {type: string, enum: [accepted, flagged, duplicate, rejected]}
                        code: {type: [string, "null"], description: "Mã lỗi khi rejected, vd geo.too_few_points, geo.overlap_cross_coop, geo.overlap_needs_confirm"}
                        reason: {type: [string, "null"]}
                        plot_ref: {type: [string, "null"], format: uuid}
                        plot_code: {type: [string, "null"]}
                        area_ha: {type: [string, "null"]}
                        flagged_overlaps: {type: array, items: {type: object}}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/geo/admin-boundaries/import:
    post:
      summary: Nhập ranh giới hành chính tỉnh/xã từ GeoJSON (GIS FN-07 BR-26/27); dry_run=true để kiểm và xem trước, chưa áp dụng
      description: |
        Mỗi Feature phải có properties.code là mã đơn vị còn hiệu lực trong pf/masterdata (cấp tỉnh hoặc xã).
        Nhập lại một mã: hình cũ được đóng (không xóa), hình mới là hiện hành. Hình xã dùng để kiểm thửa nằm trong địa giới xã.
      operationId: importAdminBoundaries
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - {name: source, in: query, required: true, schema: {type: string, maxLength: 300}, description: "Nguồn dữ liệu, vd CloudMap 2026-09"}
        - {name: dry_run, in: query, schema: {type: boolean, default: false}}
      requestBody:
        required: true
        content:
          application/geo+json: {schema: {type: object}}
          application/json: {schema: {type: object}}
      responses:
        "200":
          description: Kết quả theo đơn vị
          content:
            application/json:
              schema:
                type: object
                required: [dry_run, accepted, rejected, features]
                properties:
                  dry_run: {type: boolean}
                  accepted: {type: integer}
                  rejected: {type: integer}
                  features:
                    type: array
                    items:
                      type: object
                      required: [index, code, name, level, status, replaced, error_code, reason, area_ha]
                      properties:
                        index: {type: integer}
                        code: {type: [string, "null"]}
                        name: {type: [string, "null"]}
                        level: {type: [string, "null"], enum: [province, commune, null]}
                        status: {type: string, enum: [accepted, rejected]}
                        replaced: {type: boolean}
                        error_code: {type: [string, "null"]}
                        reason: {type: [string, "null"]}
                        area_ha: {type: [string, "null"]}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  # --- pf/geo G2: ranh giới HTX (nhập tệp), kho/Hub + sức chứa (BR-52: chỉ Admin nhập tay), đường bộ ---

  # Vai geo_admin (hoặc platform_admin); phạm vi TW → Tỉnh → Xã theo tổ chức của người gọi. Đọc qua Application API.
  /v1/geo/cooperative-boundaries/import:
    post:
      summary: Nhập hàng loạt ranh giới HTX từ GeoJSON/KML/Shapefile (.zip) (GIS US-BND-07) — HTX theo cooperative_ref hoặc Mã HTX (cooperative_code/ma_htx/MA_HTX); HTX đã có ranh giới → phiên bản mới thay phiên bản hiện hành
      description: |
        Cùng giới hạn và quy tắc hệ toạ độ như /v1/geo/plots/import: chỉ WGS84 (EPSG:4326) — hệ khác → 422 geo.crs_unsupported
        cho cả tệp. Đối tượng lỗi bị loại kèm mã/lý do, đối tượng hợp lệ vẫn được nạp. Idem_key từng đối tượng =
        Idempotency-Key + ":" + thứ tự.
      operationId: geoImportCoopBoundaries
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - {name: format, in: query, schema: {type: string, enum: [geojson, kml, shapefile]}}
        - {name: file_name, in: query, schema: {type: string}}
        - {name: reason, in: query, schema: {type: string, minLength: 10}, description: "Lý do khi thay ranh giới đang có; mặc định nêu tên tệp"}
      requestBody:
        required: true
        content:
          application/geo+json: {schema: {type: object}}
          application/json: {schema: {type: object}}
          application/vnd.google-earth.kml+xml: {schema: {type: string}}
          application/zip: {schema: {type: string, format: binary}}
      responses:
        "200":
          description: Kết quả theo đối tượng
          content:
            application/json:
              schema:
                type: object
                required: [format, accepted, duplicate, rejected, features]
                properties:
                  format: {type: string, enum: [geojson, kml, shapefile]}
                  accepted: {type: integer}
                  duplicate: {type: integer}
                  rejected: {type: integer}
                  features:
                    type: array
                    items:
                      type: object
                      required: [index, name, status, replaced, code, reason, cooperative_ref, boundary_id, version, area_ha]
                      properties:
                        index: {type: integer}
                        name: {type: [string, "null"]}
                        status: {type: string, enum: [accepted, duplicate, rejected]}
                        replaced: {type: boolean}
                        code: {type: [string, "null"]}
                        reason: {type: [string, "null"]}
                        cooperative_ref: {type: [string, "null"], format: uuid}
                        boundary_id: {type: [string, "null"], format: uuid}
                        version: {type: integer}
                        area_ha: {type: [string, "null"]}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
  /v1/geo/facilities:
    post:
      summary: Thêm kho/Hub/nhà máy của tenant (GIS US-BND-05 AC-1) — gắn Marker (point) và/hoặc vẽ khuôn viên (polygon); thiếu tên hoặc địa chỉ (tỉnh/xã) → "Vui lòng nhập đầy đủ Tên Hub và Địa chỉ."; sức chứa ≤ 0 hoặc sai định dạng → "Sức chứa phải là số lớn hơn 0." (AC-2)
      description: Hub của MKG không tạo ở đây — đến qua van công bố hub_facility. Sự kiện pf.geo.facility.recorded.
      operationId: geoCreateFacility
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/GeoFacilityInput"}
      responses:
        "201": {$ref: "#/components/responses/GeoFacilityWritten"}
        "403": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/geo/facilities/import:
    post:
      summary: Nhập hàng loạt vị trí kho/Hub từ GeoJSON/KML/Shapefile (GIS US-BND-08) — đối tượng điểm (marker) hoặc vùng (khuôn viên); thuộc tính name/ten, code/ma, kind/loai, capacity/suc_chua, unit/don_vi, province_code/ma_tinh, commune_code/ma_xa
      operationId: geoImportFacilities
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - {name: format, in: query, schema: {type: string, enum: [geojson, kml, shapefile]}}
        - {name: file_name, in: query, schema: {type: string}}
        - {name: kind, in: query, schema: {type: string, enum: [kho, hub, nha_may]}, description: "Mặc định khi thiếu thuộc tính loại (không có → hub)"}
        - {name: province_code, in: query, schema: {type: string}, description: "Mặc định khi thiếu province_code/ma_tinh"}
        - {name: commune_code, in: query, schema: {type: string}, description: "Mặc định khi thiếu commune_code/ma_xa"}
        - {name: unit, in: query, schema: {type: string, enum: [tan, m3, ke]}}
      requestBody:
        required: true
        content:
          application/geo+json: {schema: {type: object}}
          application/json: {schema: {type: object}}
          application/vnd.google-earth.kml+xml: {schema: {type: string}}
          application/zip: {schema: {type: string, format: binary}}
      responses:
        "200":
          description: Kết quả theo đối tượng
          content:
            application/json:
              schema:
                type: object
                required: [format, accepted, duplicate, rejected, features]
                properties:
                  format: {type: string, enum: [geojson, kml, shapefile]}
                  accepted: {type: integer}
                  duplicate: {type: integer}
                  rejected: {type: integer}
                  features:
                    type: array
                    items:
                      type: object
                      required: [index, name, status, code, reason, facility_ref, facility_code]
                      properties:
                        index: {type: integer}
                        name: {type: [string, "null"]}
                        status: {type: string, enum: [accepted, duplicate, rejected]}
                        code: {type: [string, "null"]}
                        reason: {type: [string, "null"]}
                        facility_ref: {type: [string, "null"], format: uuid}
                        facility_code: {type: [string, "null"]}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/geo/facilities/{ref}/versions:
    post:
      summary: Sửa kho/Hub (GIS US-BND-06 AC-1/AC-3) — bản ghi bù trỏ supersedes_id (= current_event_id) kèm lý do; trường bỏ trống giữ nguyên; sai phiên bản → 409 geo.version_conflict
      operationId: geoUpdateFacility
      parameters:
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/GeoFacilityInput"
                - type: object
                  required: [supersedes_id, correction_reason]
                  properties:
                    supersedes_id: {type: string, format: uuid}
                    correction_reason: {type: string, minLength: 10}
                    remove_polygon: {type: boolean, default: false}
      responses:
        "201": {$ref: "#/components/responses/GeoFacilityWritten"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/geo/facilities/{ref}/retire:
    post:
      summary: Xóa mềm kho/Hub (GIS US-BND-06 AC-2, BR-14/19) — ẩn khỏi bản đồ và danh sách vận hành; Event Log giữ người xóa, thời gian, lý do
      operationId: geoRetireFacility
      parameters:
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/GeoReason"}
      responses:
        "200": {$ref: "#/components/responses/GeoFacilityWritten"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/geo/facilities/{ref}/restore:
    post:
      summary: Khôi phục kho/Hub đã ngừng dùng
      operationId: geoRestoreFacility
      parameters:
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/GeoReason"}
      responses:
        "200": {$ref: "#/components/responses/GeoFacilityWritten"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/geo/facilities/{ref}/capacity:
    post:
      summary: Admin nhập tay sức chứa/dung lượng đã dùng của kho/Hub (GIS US-WH-01, BR-52) — có hiệu lực ngay, lần đồng bộ sau KHÔNG ghi đè; sửa ảnh chụp = supersedes_id + correction_reason
      operationId: geoRecordFacilityCapacity
      parameters:
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/GeoCapacityInput"}
      responses:
        "201": {$ref: "#/components/responses/GeoCapacityWritten"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/geo/facilities/{ref}/capacity/release:
    post:
      summary: Admin xác nhận áp dụng số đồng bộ thay số nhập tay (BR-52) — ghi dòng sổ release kèm lý do; không có số nhập tay → 409 geo.capacity_nothing_to_release
      operationId: geoReleaseFacilityCapacity
      parameters:
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/GeoReason"}
      responses:
        "200": {$ref: "#/components/responses/GeoCapacityWritten"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/geo/hubs/{ref}/capacity:
    post:
      summary: Admin nhập tay sức chứa hub MKG khi van công bố chưa tích hợp xong (BR-52); hub chưa nhận qua van → 404 geo.hub_not_found
      operationId: geoRecordHubCapacity
      parameters:
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/GeoCapacityInput"}
      responses:
        "201": {$ref: "#/components/responses/GeoCapacityWritten"}
        "404": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/geo/hubs/{ref}/capacity/release:
    post:
      summary: Admin xác nhận áp dụng số của van cho hub MKG (BR-52)
      operationId: geoReleaseHubCapacity
      parameters:
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/GeoReason"}
      responses:
        "200": {$ref: "#/components/responses/GeoCapacityWritten"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/geo/capacity/import:
    post:
      summary: Nhập hàng loạt ảnh chụp sức chứa (BRD FN-06 "nhập file theo mẫu"; nguồn import — số Admin, BR-52) — mỗi dòng theo facility_code hoặc hub_ref; tối đa 500 dòng
      operationId: geoImportCapacities
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  maxItems: 500
                  items:
                    type: object
                    required: [capacity, used]
                    properties:
                      facility_code: {type: string}
                      hub_ref: {type: string, format: uuid}
                      capacity: {$ref: "#/components/schemas/GeoDecimal"}
                      used: {$ref: "#/components/schemas/GeoDecimal"}
                      unit: {type: string, enum: [tan, m3, ke]}
                      as_of: {type: string, format: date-time}
      responses:
        "200":
          description: Kết quả theo dòng
          content:
            application/json:
              schema:
                type: object
                required: [accepted, duplicate, rejected, items]
                properties:
                  accepted: {type: integer}
                  duplicate: {type: integer}
                  rejected: {type: integer}
                  items:
                    type: array
                    items:
                      type: object
                      required: [index, status, code, reason, snapshot_id]
                      properties:
                        index: {type: integer}
                        status: {type: string, enum: [accepted, duplicate, rejected]}
                        code: {type: [string, "null"]}
                        reason: {type: [string, "null"]}
                        snapshot_id: {type: [string, "null"], format: uuid}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/geo/roads:
    post:
      summary: Vẽ mới tuyến đường bộ (GIS US-ROAD-02 AC-1) — chiều dài trắc địa tính trong DB; thiếu tên/phân loại → "Vui lòng nhập đầy đủ Tên tuyến và Phân loại."; tải trọng ≤ 0 hoặc sai định dạng → "Tải trọng tối đa phải là số lớn hơn 0." (AC-2)
      operationId: geoCreateRoad
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/GeoRoadInput"}
      responses:
        "201": {$ref: "#/components/responses/GeoRoadWritten"}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/geo/roads/{ref}/versions:
    post:
      summary: Sửa tuyến (GIS US-ROAD-03 AC-1) — kéo/thêm/xóa điểm, đổi tên/phân loại/tải trọng; phiên bản mới trỏ supersedes_id (= segment_id hiện hành) kèm lý do; trường bỏ trống giữ nguyên
      operationId: geoCorrectRoad
      parameters:
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/GeoRoadInput"
                - type: object
                  required: [supersedes_id, correction_reason]
                  properties:
                    supersedes_id: {type: string, format: uuid}
                    correction_reason: {type: string, minLength: 10}
      responses:
        "201": {$ref: "#/components/responses/GeoRoadWritten"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/geo/roads/{ref}/retire:
    post:
      summary: Ngừng dùng tuyến (xóa mềm, giữ lịch sử)
      operationId: geoRetireRoad
      parameters:
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/GeoReason"}
      responses:
        "200": {$ref: "#/components/responses/GeoRoadWritten"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/geo/roads/{ref}/restore:
    post:
      summary: Khôi phục tuyến đã ngừng dùng
      operationId: geoRestoreRoad
      parameters:
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/GeoReason"}
      responses:
        "200": {$ref: "#/components/responses/GeoRoadWritten"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  # --- hết pf/geo ---

  # --- pf/mechanization: Bản đồ CGH — ghi dữ liệu chủ, vụ mùa, chạy cân đối (chỉ cgh_admin; Cục KTHT → 403) ---

  # Không xóa cứng: vô hiệu hóa là sự kiện trong sổ kèm ngày và lý do. Mã CSH-/MAY- do hệ thống tự sinh.
  /v1/mechanization/owners:
    post:
      summary: Tạo chủ sở hữu máy (FN-04) — Mã CSH-<tỉnh HTX>-00001 tự sinh; họ tên/SĐT cá nhân chỉ vào kho định danh
      description: Thành viên HTX / HTX phải liên kết đúng một HTX. Chống trùng theo SĐT qua chỉ mục mù của kho định danh.
      operationId: mechCreateOwner
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [owner_type]
              properties:
                owner_type: {type: string, description: "Mã hoặc nhãn: thanh_vien_htx | htx | doanh_nghiep | khac"}
                cooperative_ref: {type: string, format: uuid}
                name: {type: string, description: "Bắt buộc trừ loại HTX; cá nhân → kho định danh"}
                phone: {type: string, description: "Bắt buộc trừ loại HTX; chỉ vào kho định danh"}
      responses:
        "201":
          description: Đã tạo
          content:
            application/json:
              schema:
                type: object
                required: [owner, seq]
                properties:
                  owner: {$ref: "#/components/schemas/MechOwner"}
                  seq: {type: integer}
        "403": {description: forbidden | mechanization.out_of_scope, $ref: "#/components/responses/Problem"}
        "409": {description: mechanization.owner_duplicate, $ref: "#/components/responses/Problem"}
        "422": {description: validation_failed | mechanization.cooperative_invalid, $ref: "#/components/responses/Problem"}
        "503": {description: mechanization.dependency_unavailable, $ref: "#/components/responses/Problem"}
  /v1/mechanization/owners/{id}/deactivate:
    post:
      summary: Vô hiệu hóa chủ sở hữu (FN-04 BR-05) — còn máy thì 409, trừ khi with_machines = true (máy chuyển Inactive)
      operationId: mechDeactivateOwner
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string, minLength: 10}
                with_machines: {type: boolean, default: false}
                deactivated_on: {type: string, format: date, description: "Ngày vô hiệu hóa của máy kèm theo; mặc định hôm nay"}
      responses:
        "200": {$ref: "#/components/responses/MechOwnerChanged"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {description: mechanization.owner_has_machines (active_machines) | mechanization.state_conflict, $ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/mechanization/owners/{id}/reactivate:
    post:
      summary: Kích hoạt lại chủ sở hữu
      operationId: mechReactivateOwner
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200": {$ref: "#/components/responses/MechOwnerChanged"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
  /v1/mechanization/owners/{id}/events:
    get:
      summary: Lịch sử biến động của chủ sở hữu (FN-04 B7)
      operationId: mechOwnerEvents
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Theo seq
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/MechOwnerEvent"}}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/mechanization/machines:
    post:
      summary: Thêm máy (FN-05) — Mã MAY-<tỉnh HTX>-00001 tự sinh; khâu tự gán theo chủng loại; Số máy/SN, Số khung duy nhất
      operationId: mechCreateMachine
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/MechMachineInput"
                - type: object
                  required: [cooperative_ref, machine_type, owner_id, owned_since]
      responses:
        "201":
          description: Đã tạo
          content:
            application/json:
              schema:
                type: object
                required: [machine, seq]
                properties:
                  machine: {$ref: "#/components/schemas/MechMachine"}
                  seq: {type: integer}
        "403": {$ref: "#/components/responses/Problem"}
        "409": {description: mechanization.serial_taken | mechanization.chassis_taken (existing_code), $ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/mechanization/machines/import:
    post:
      summary: Nhập danh sách máy của MỘT HTX từ CSV UTF-8 hoặc Excel .xlsx (FN-05 BR-07/BR-10, US-MAC-02)
      description: |
        Định dạng nhận theo chữ ký tệp; .xlsx đọc trang tính đầu, ô ngày Excel đọc thành ngày, ô công thức → từ chối cả tệp.
        Đối chiếu từng dòng theo Số máy/SN (thiếu thì Số khung): đã có → cập nhật, chưa có → tạo mới.
        mode=replace ("Thay thế toàn bộ"): máy đang Active của HTX vắng mặt trong tệp chuyển Inactive bằng sự kiện kèm Ngày vô hiệu hóa — không xóa.
        mode=update ("Cập nhật"): máy vắng mặt giữ nguyên. Tệp có cột "Mã máy" hoặc "Khâu", hoặc thiếu cột bắt buộc → từ chối cả tệp.
        Cột (tiêu đề có/không dấu): Chủng loại, Hãng, Model, Năm SX, Nhiên liệu, Công suất, Năng suất, Mã CSH, Số máy, Số khung, Ngày sở hữu (dd/mm/yyyy), Tình trạng.
      operationId: mechImportMachines
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - {name: cooperative_ref, in: query, required: true, schema: {type: string, format: uuid}}
        - {name: mode, in: query, required: true, schema: {type: string, enum: [update, replace]}}
      requestBody:
        required: true
        content:
          text/csv:
            schema: {type: string}
          application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
            schema: {type: string, format: binary}
      responses:
        "200":
          description: Kết quả theo dòng
          content:
            application/json:
              schema:
                type: object
                required: [mode, created, updated, reactivated, unchanged, rejected, rows, deactivated]
                properties:
                  mode: {type: string}
                  created: {type: integer}
                  updated: {type: integer}
                  reactivated: {type: integer}
                  unchanged: {type: integer}
                  rejected: {type: integer}
                  rows:
                    type: array
                    items:
                      type: object
                      required: [row, status, reason, machine_ref, code]
                      properties:
                        row: {type: integer}
                        status: {type: string, enum: [created, updated, reactivated, unchanged, rejected]}
                        reason: {type: [string, "null"], description: "vd \"Dòng 5: Số máy/SN trùng với dòng 9 trong cùng file\""}
                        machine_ref: {type: [string, "null"], format: uuid}
                        code: {type: [string, "null"]}
                  deactivated: {type: array, items: {$ref: "#/components/schemas/MechMachine"}}
        "422": {description: mechanization.import_invalid, $ref: "#/components/responses/Problem"}
  /v1/mechanization/machines/{ref}/update:
    post:
      summary: Sửa hồ sơ máy (chuyển HTX, đổi chủng loại → khâu đổi theo); Mã máy không đổi
      operationId: mechUpdateMachine
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MechMachineInput"}
      responses:
        "200": {$ref: "#/components/responses/MechMachineChanged"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/mechanization/machines/{ref}/status:
    post:
      summary: Đổi tình trạng máy (nhập tay, QT-03) — dòng sổ status_changed có event_time = thời điểm hiệu lực
      operationId: mechChangeMachineStatus
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: {type: string, description: "Mã hoặc nhãn: Hoạt động / Bảo trì / Hỏng / Ngừng hoạt động"}
                effective_at: {type: string, format: date-time, description: "Không ở tương lai, không trước lần cập nhật gần nhất"}
      responses:
        "200": {$ref: "#/components/responses/MechMachineChanged"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/mechanization/machines/{ref}/deactivate:
    post:
      summary: Vô hiệu hóa máy (FN-05 BR-06) — kèm Ngày vô hiệu hóa (≥ Ngày HTX sở hữu, không ở tương lai) và lý do
      operationId: mechDeactivateMachine
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string, minLength: 10}
                deactivated_on: {type: string, format: date}
      responses:
        "200": {$ref: "#/components/responses/MechMachineChanged"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/mechanization/machines/{ref}/reactivate:
    post:
      summary: Kích hoạt lại máy
      operationId: mechReactivateMachine
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200": {$ref: "#/components/responses/MechMachineChanged"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
  /v1/mechanization/machines/{ref}/events:
    get:
      summary: Lịch sử biến động của máy (FN-05 B8, AC-04)
      operationId: mechMachineEvents
      parameters:
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Theo seq
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/MechMachineEvent"}}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/mechanization/season-areas:
    post:
      summary: Nhập tay diện tích canh tác & lịch mùa vụ theo HTX × vụ (FN-06, US-SEA-01) — nhãn [Nhập tay], tùy chọn khóa
      operationId: mechRecordSeasonArea
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cooperative_ref, season_code, season_year, area_ha]
              properties:
                cooperative_ref: {type: string, format: uuid}
                season_code: {type: string}
                season_year: {type: integer}
                area_ha: {$ref: "#/components/schemas/MechDecimal"}
                lock: {type: boolean, default: false}
                source: {type: string, enum: [manual]}
                calendar:
                  type: array
                  items:
                    type: object
                    required: [stage, start, end]
                    properties:
                      stage: {type: string}
                      start: {type: string, format: date}
                      end: {type: string, format: date, description: "Sau ngày bắt đầu; cùng khâu không chồng lấn"}
      responses:
        "201": {$ref: "#/components/responses/MechAreaChanged"}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/mechanization/season-areas/{id}/lock:
    post:
      summary: Khóa bản ghi nhập tay — đồng bộ App HTX không ghi đè (FN-06 B5, QT-03)
      operationId: mechLockSeasonArea
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200": {$ref: "#/components/responses/MechAreaChanged"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
  /v1/mechanization/season-areas/{id}/unlock:
    post:
      summary: Mở khóa — App HTX được ưu tiên trở lại ở lần đồng bộ kế tiếp
      operationId: mechUnlockSeasonArea
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200": {$ref: "#/components/responses/MechAreaChanged"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
  /v1/mechanization/season-areas/{id}/events:
    get:
      summary: Lịch sử thay đổi của bản ghi diện tích vụ (FN-06 B7)
      operationId: mechSeasonAreaEvents
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Theo seq
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [seq, action, event_time, recorded_at, actor_ref, reason, area]
                      properties:
                        seq: {type: integer}
                        action: {type: string, enum: [recorded, synced, locked, unlocked]}
                        event_time: {type: string, format: date-time}
                        recorded_at: {type: string, format: date-time}
                        actor_ref: {type: string, format: uuid}
                        reason: {type: [string, "null"]}
                        area: {$ref: "#/components/schemas/MechSeasonArea"}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/mechanization/forecasts:
    post:
      summary: "Chạy và LƯU dự báo nhu cầu máy cho một vụ (FN-09) — phương pháp TẠM cgh.forecast/v1, cần DCRD xác nhận"
      description: |
        Diện tích dự báo = diện tích cùng vụ năm trước × (1 + tăng trưởng trung bình của tối đa 3 vụ cùng loại gần nhất, chặn ±20 %);
        số máy cần = diện tích dự báo ÷ định mức hiệu lực tại ngày bắt đầu vụ dự báo. Kết quả bất biến, lưu kèm đầu vào
        (docs/dev/cgh-forecast.md). Đọc qua Application API GET /v1/mechanization/forecasts/{id}.
      operationId: mechRunForecast
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [season_code, season_year]
              properties:
                season_code: {type: string}
                season_year: {type: integer, description: "Năm bắt đầu vụ dự báo"}
      responses:
        "201":
          description: Đã lưu
          content:
            application/json:
              schema:
                type: object
                required: [run]
                properties:
                  run: {type: object, description: "MechForecastRun (application.yaml)"}
        "200": {description: Gọi lặp cùng Idempotency-Key}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/mechanization/balance-runs:
    post:
      summary: Tính và LƯU cân đối cung–cầu của một vụ (FN-09, QT-01/QT-02) — phát pf.mechanization.balance.computed
      description: |
        Số máy cần = diện tích canh tác ÷ định mức hiệu lực TẠI VỤ (T = ngày bắt đầu vụ); năng lực = máy "Hoạt động" tại T;
        chỉ khâu bật cờ thí điểm. Kết quả bất biến, kèm rule_version và phiên bản tham số đã dùng.
        Chạy đồng bộ (dự kiến < 2 giây ở ĐTK 1); khi vượt ngưỡng sẽ chuyển sang 202 + job (R-52) mà không đổi hợp đồng kết quả.
      operationId: mechComputeBalance
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [season_code, season_year]
              properties:
                season_code: {type: string}
                season_year: {type: integer, description: "Năm bắt đầu vụ"}
      responses:
        "201":
          description: Đã lưu
          content:
            application/json:
              schema:
                type: object
                required: [run]
                properties:
                  run: {$ref: "#/components/schemas/MechRun"}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
  # --- hết pf/mechanization ---

  # --- pf/notify ---
  /v1/sync/nudge:
    post:
      summary: Yêu cầu thiết bị đồng bộ ngay (US-SYNC-02) — như Application API
      operationId: adminSyncNudge
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/NudgeInput"}
      responses:
        "202":
          description: Đã xếp lần gửi
          content:
            application/json:
              schema: {$ref: "#/components/schemas/NudgeResult"}
        "403": {description: "forbidden | mfa_required | notify.out_of_scope", $ref: "#/components/responses/Problem"}
        "404": {description: "notify.nudge_target_not_found", $ref: "#/components/responses/Problem"}
        "429": {description: "notify.nudge_rate_limited", $ref: "#/components/responses/Problem"}
  # --- hết pf/notify ---

  # --- pf/accounts --- tài khoản cán bộ qua Keycloak Admin REST (KN US-ADM-01..03, HTX US-ACC-01/02, CGH FN-01)

  #

  # Vai: platform_admin, account_admin, account_admin_province (đều [MFA]). Ma trận cấp vai (accounts/port/grants.go):

  #   platform_admin → mọi vai do module quản lý; account_admin → trừ account_admin, param_approver, vault_eraser;

  #   account_admin_province → chỉ kn_officer, coop_manager, chỉ tổ chức trong tỉnh (phạm vi theo org_ref, ADR-0009).

  # Thao tác trên một tài khoản đòi mọi vai hiện có của tài khoản đó nằm trong tập người gọi được cấp.

  # Họ tên, email, SĐT chỉ nằm trong Keycloak; pf_accounts chỉ giữ user_ref, org_ref, ảnh chụp vai (không PII).

  # Kích hoạt bằng liên kết một lần của Keycloak (execute-actions-email, 72 giờ) — không gửi mật khẩu tạm (ADR-0010).
  /v1/accounts/grants:
    get:
      summary: Vai người gọi được cấp, vai [MFA], ràng buộc vai ↔ loại tổ chức
      operationId: accountsGrants
      responses:
        "200":
          description: Ma trận cấp vai áp cho người gọi
          content:
            application/json:
              schema:
                type: object
                required: [grantable, mfa_roles, role_org_kinds]
                properties:
                  grantable: {type: array, items: {type: string}}
                  mfa_roles: {type: array, items: {type: string}}
                  role_org_kinds: {type: object, additionalProperties: {type: array, items: {type: string}}}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/accounts/users:
    get:
      summary: Tài khoản trong phạm vi — đọc Keycloak theo tenant_id của token, lọc org_ref thuộc phạm vi người gọi
      operationId: accountsListUsers
      parameters:
        - {name: org_ref, in: query, schema: {type: string, format: uuid}}
        - {name: cursor, in: query, schema: {type: string}, description: "next_cursor của trang trước (R-53)"}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
      responses:
        "200":
          description: Một trang
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/AccountsUser"}}
                  next_cursor: {type: [string, "null"]}
        "403": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
    post:
      summary: Tạo tài khoản — tenant_id từ token, org_ref trong phạm vi, vai theo ma trận; required actions VERIFY_EMAIL, UPDATE_PASSWORD (+ CONFIGURE_TOTP với vai [MFA])
      operationId: accountsCreateUser
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, org_ref, roles]
              properties:
                username: {type: string, description: "Bỏ trống → dùng email. 3–64 ký tự a-z 0-9 . _ - @"}
                email: {type: string, format: email}
                full_name: {type: string, description: "Họ tên; tách thành last_name (họ, đệm) + first_name (tên) nếu không gửi hai trường kia"}
                first_name: {type: string}
                last_name: {type: string}
                phone: {type: string, description: "10 chữ số bắt đầu bằng 0 (+84 được đổi); duy nhất trong tenant"}
                org_ref: {type: string, format: uuid}
                roles: {type: array, minItems: 1, items: {type: string}}
      responses:
        "201":
          description: Đã tạo trong Keycloak và ghi sổ pf_accounts.account_event (created, actions_sent); phát pf.accounts.user.created
          headers:
            Location: {schema: {type: string}}
          content:
            application/json:
              schema:
                type: object
                required: [user, seq, activation_email_sent]
                properties:
                  user: {$ref: "#/components/schemas/AccountsUser"}
                  seq: {type: integer}
                  activation_email_sent: {type: boolean, description: "false khi Keycloak không gửi được email — gửi lại bằng /resend-actions"}
        "403": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
  /v1/accounts/users/import:
    post:
      summary: Nhập tài khoản hàng loạt từ CSV (UTF-8) hoặc Excel .xlsx (trang tính đầu), tối đa 200 dòng; kết quả theo dòng
      description: |
        Cột (tiêu đề không phân biệt hoa thường, bỏ dấu): email; full_name|ho_ten (hoặc first_name|ten + last_name|ho);
        org_ref|ma_to_chuc (UUID tổ chức pf/party); roles|vai_tro (phân tách , ; |); tùy chọn username|ten_dang_nhap, phone|so_dien_thoai|sdt.
        Thiếu cột bắt buộc → từ chối cả tệp (accounts.import_invalid). Dòng lỗi bị loại kèm lý do ("Thiếu Email", "Sai định dạng Email",
        "Sai định dạng vai trò", "SĐT đã tồn tại", "Trùng với dòng N trong tệp"…), dòng hợp lệ được tạo và nhận liên kết kích hoạt.
      operationId: accountsImportUsers
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          text/csv:
            schema: {type: string}
          application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
            schema: {type: string, format: binary}
      responses:
        "200":
          description: Kết quả theo dòng
          content:
            application/json:
              schema:
                type: object
                required: [created, rejected, rows]
                properties:
                  created: {type: integer}
                  rejected: {type: integer}
                  rows:
                    type: array
                    items:
                      type: object
                      required: [row, status, reason, user_id, activation_email_sent]
                      properties:
                        row: {type: integer, description: "Số dòng trong tệp (dòng 1 là tiêu đề)"}
                        status: {type: string, enum: [created, rejected]}
                        reason: {type: [string, "null"], description: "Không chứa dữ liệu cá nhân"}
                        user_id: {type: [string, "null"], format: uuid}
                        activation_email_sent: {type: boolean}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/accounts/users/bulk:
    post:
      summary: Thao tác loạt (KN US-ADM-03) — khóa, mở khóa hoặc gửi lại liên kết cho tối đa 100 tài khoản; kết quả theo từng tài khoản
      operationId: accountsBulk
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, user_ids]
              properties:
                action: {type: string, enum: [lock, unlock, resend]}
                user_ids: {type: array, minItems: 1, maxItems: 100, items: {type: string, format: uuid}}
                reason: {type: string, minLength: 20, description: "Bắt buộc với lock/unlock"}
      responses:
        "200":
          description: Kết quả
          content:
            application/json:
              schema:
                type: object
                required: [succeeded, failed, items]
                properties:
                  succeeded: {type: integer}
                  failed: {type: integer}
                  items:
                    type: array
                    items:
                      type: object
                      required: [user_id, ok, replayed, code, detail]
                      properties:
                        user_id: {type: string, format: uuid}
                        ok: {type: boolean}
                        replayed: {type: boolean}
                        code: {type: [string, "null"], description: "Mã lỗi docs/errors.md"}
                        detail: {type: [string, "null"]}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/accounts/users/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}, description: "id người dùng Keycloak"}
    get:
      summary: Chi tiết tài khoản (vai đọc thẳng từ Keycloak)
      operationId: accountsGetUser
      responses:
        "200":
          description: Tài khoản
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AccountsUser"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/accounts/users/{id}/events:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      summary: Nhật ký thao tác (sổ chỉ ghi thêm — ai, lúc nào, lý do; US-HTXSTATUS-03)
      operationId: accountsUserEvents
      responses:
        "200":
          description: Theo seq tăng dần
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/AccountsEvent"}}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/accounts/users/{id}/lock:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      summary: Khóa tài khoản (enabled=false) và thu hồi mọi phiên — lý do ≥ 20 ký tự; phát pf.accounts.user.locked
      operationId: accountsLock
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/AccountsReason"
      responses:
        "200": {$ref: "#/components/responses/AccountsChanged"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/accounts/users/{id}/unlock:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      summary: Mở khóa — lý do ≥ 20 ký tự; tổ chức đang vô hiệu hóa → 409 accounts.org_inactive; phát pf.accounts.user.unlocked
      operationId: accountsUnlock
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/AccountsReason"
      responses:
        "200": {$ref: "#/components/responses/AccountsChanged"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/accounts/users/{id}/resend-actions:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      summary: Gửi lại liên kết một lần — mặc định các required action đang chờ; không còn → UPDATE_PASSWORD (đặt lại mật khẩu, không mật khẩu tạm)
      operationId: accountsResendActions
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                actions: {type: array, items: {type: string, enum: [VERIFY_EMAIL, UPDATE_PASSWORD, CONFIGURE_TOTP]}}
      responses:
        "200":
          description: Đã gửi; ghi sổ actions_sent
          content:
            application/json:
              schema:
                type: object
                required: [account, activation_email_sent, replayed]
                properties:
                  account: {$ref: "#/components/schemas/AccountsAccount"}
                  activation_email_sent: {type: boolean}
                  replayed: {type: boolean}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "502": {$ref: "#/components/responses/Problem"}
  /v1/accounts/users/{id}/assignment:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      summary: Đổi đơn vị công tác và/hoặc vai (roles là tập đầy đủ vai do module quản lý); thêm vai [MFA] khi chưa có OTP → CONFIGURE_TOTP
      operationId: accountsAssign
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                org_ref: {type: string, format: uuid}
                roles: {type: array, minItems: 1, items: {type: string}}
      responses:
        "200": {$ref: "#/components/responses/AccountsChanged"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  # --- pf/accounts KN v7.7 gói P1: tài khoản nhiều vai trò × Nút × phòng ban × xã (FN-AD-04.04), Log, Menu các cấp (FN-AD-04.07) ---
  # Chỉ Admin (platform_admin, account_admin) quản lý; vai Admin chỉ platform_admin gán. Header X-AG-Context (nếu có) được
  # middleware giải như ở Application API; trong ngữ cảnh hỗ trợ mọi thao tác ghi cần X-AG-Reason và ghi nhật ký hỗ trợ.
  /v1/accounts/mgmt-levels:
    get:
      summary: "Danh mục cấp quản lý (tạm, chờ khách Q-05)"
      operationId: accountsMgmtLevels
      tags: [accounts]
      responses:
        "200":
          description: Danh mục
          content:
            application/json:
              schema:
                type: object
                required: [items, provisional]
                properties:
                  items:
                    type: array
                    items: {type: object, required: [code, label], properties: {code: {type: string}, label: {type: string}}}
                  provisional: {type: boolean}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/accounts/kn-users:
    post:
      summary: "FN-AD-04.04 Tạo tài khoản KN: tên đăng nhập = SĐT chuẩn hóa (vắng → email), vai realm kn_user, liên kết kích hoạt (lần đầu bắt buộc đặt mật khẩu, không mật khẩu tạm) + các vai trò"
      description: |
        Tiên quyết (UR-AD-04): Nút tồn tại, đúng cấp của vai (Cấp Quốc gia → ttkn_national; Cấp Tỉnh, Cấp Xã → ttkn_province), đơn vị đã
        khai phòng ban → ngược lại 409 accounts.prerequisite_missing. Trùng SĐT/email → 409 accounts.duplicate_identity. Cấp Xã chưa gán xã →
        lưu được, cảnh báo commune_unassigned. Vai Admin không tạo kèm được (gán sau cho tài khoản platform_admin).
      operationId: accountsCreateKNUser
      tags: [accounts]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [full_name, email, assignments]
              properties:
                full_name: {type: string}
                email: {type: string, format: email}
                phone: {type: string, description: "0xxxxxxxxx hoặc +84…; chuẩn hóa thành tên đăng nhập"}
                assignments: {type: array, minItems: 1, items: {$ref: "#/components/schemas/KNAssignmentInput"}}
      responses:
        "201":
          description: Đã tạo
          content:
            application/json:
              schema:
                type: object
                required: [user, assignments, activation_email_sent, warnings]
                properties:
                  user: {$ref: "#/components/schemas/AccountsUser"}
                  assignments: {type: array, items: {$ref: "#/components/schemas/KNAssignment"}}
                  activation_email_sent: {type: boolean}
                  warnings: {type: array, items: {$ref: "#/components/schemas/KNWarning"}}
        "403": {description: "accounts.kn_admin_grant, không phải Admin", $ref: "#/components/responses/Problem"}
        "409": {description: "accounts.prerequisite_missing, accounts.duplicate_identity, accounts.assignment_duplicate", $ref: "#/components/responses/Problem"}
        "422": {description: "validation_failed, accounts.department_invalid, accounts.commune_invalid", $ref: "#/components/responses/Problem"}
  /v1/accounts/users/{id}/assignments:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      summary: "Khối Vai trò và phạm vi của màn Detail tài khoản"
      operationId: accountsListAssignments
      tags: [accounts]
      parameters:
        - {name: include_revoked, in: query, schema: {type: boolean, default: false}}
      responses:
        "200":
          description: Theo thời điểm gán
          content:
            application/json:
              schema: {type: object, required: [items], properties: {items: {type: array, items: {$ref: "#/components/schemas/KNAssignment"}}}}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
    post:
      summary: "Thêm vai trò (sổ role_assignment_event, phát pf.accounts.assignment.granted); vai Admin chỉ platform_admin gán cho tài khoản platform_admin"
      operationId: accountsGrantAssignment
      tags: [accounts]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/KNAssignmentInput"}
      responses:
        "201": {$ref: "#/components/responses/KNAssignmentChanged"}
        "403": {description: "accounts.self_action, accounts.kn_admin_grant", $ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/accounts/users/{id}/assignments/{aid}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: aid, in: path, required: true, schema: {type: string, format: uuid}}
    put:
      summary: "Sửa vai trò (Nút, phòng ban, cấp quản lý, xã phụ trách, hiệu lực) — có hiệu lực ở request kế tiếp của mọi ngữ cảnh; không đổi vai"
      operationId: accountsChangeAssignment
      tags: [accounts]
      parameters:
        - {name: Idempotency-Key, in: header, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/KNAssignmentInput"}
      responses:
        "200": {$ref: "#/components/responses/KNAssignmentChanged"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {description: "accounts.assignment_state (đã thu hồi / không có thay đổi), accounts.assignment_duplicate", $ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/accounts/users/{id}/assignments/{aid}/revoke:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: aid, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      summary: "Xóa (thu hồi) vai trò — lý do ≥ 10 ký tự; dữ liệu đã nhập bằng vai trò giữ nguyên; ngữ cảnh của vai trò hết hiệu lực ngay"
      operationId: accountsRevokeAssignment
      tags: [accounts]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/AccountsReason"
      responses:
        "200": {$ref: "#/components/responses/KNAssignmentChanged"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/accounts/users/{id}/profile:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    patch:
      summary: "Sửa Thông tin tài khoản (họ tên, email, SĐT) ở Keycloak; tài khoản đăng nhập bằng SĐT/email đổi tên đăng nhập theo; sổ chỉ ghi tên trường (RB-3)"
      operationId: accountsUpdateProfile
      tags: [accounts]
      parameters:
        - {name: Idempotency-Key, in: header, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                full_name: {type: string}
                email: {type: string, format: email}
                phone: {type: string}
                reason: {type: string}
      responses:
        "200":
          description: Đã sửa
          content:
            application/json:
              schema:
                type: object
                required: [user, changed_fields, seq, replayed]
                properties:
                  user: {$ref: "#/components/schemas/AccountsUser"}
                  changed_fields: {type: array, items: {type: string, enum: [full_name, email, phone, username]}}
                  seq: {type: integer}
                  replayed: {type: boolean}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {description: "accounts.duplicate_identity, accounts.state_conflict (không có thay đổi)", $ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "503": {description: accounts.profile_update_unavailable, $ref: "#/components/responses/Problem"}
  /v1/accounts/users/{id}/log:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      summary: "Khung Log của màn Detail (định dạng Log chung P2): tạo, khóa/mở, gửi lại liên kết, thêm/sửa/xóa vai trò (cũ → mới), sửa thông tin"
      operationId: accountsUserLog
      tags: [accounts]
      parameters:
        - {name: cursor, in: query, schema: {type: string}, description: "seq của dòng cuối trang trước"}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        "200":
          description: Theo thời điểm ghi
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/KNAccountLogEntry"}}
                  next_cursor: {type: [integer, "null"]}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/accounts/support-sessions:
    post:
      summary: "FN-AD-04.07 Menu các cấp: Admin (platform_admin, MFA) vào menu Cấp Quốc gia/Tỉnh/Xã để hỗ trợ — trả ngữ cảnh phiên (gửi qua X-AG-Context, dải cảnh báo vàng theo support_session_id)"
      description: |
        target_assignment_id: hỗ trợ một tài khoản (vai, Nút, xã của lần gán; on_behalf_of = tài khoản đó). Vắng: chọn role + org_ref (+ commune_codes
        với Cấp Xã). Mọi thao tác ghi trong ngữ cảnh này bắt buộc header X-AG-Reason (≥ 10 ký tự, mã hóa phần trăm) → nếu thiếu 422
        accounts.support_reason_required; mỗi thao tác ghi hai dòng nhật ký (attempted, completed). Hết hạn sau 4 giờ (tạm).
      operationId: accountsStartSupport
      tags: [accounts]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [department_code, reason]
              properties:
                target_assignment_id: {type: string, format: uuid}
                role: {type: string, enum: [kn_tw, kn_tinh, kn_xa]}
                org_ref: {type: string, format: uuid}
                commune_codes: {type: array, items: {type: string}}
                department_code: {type: string}
                reason: {type: string, minLength: 10}
      responses:
        "201":
          description: Ngữ cảnh hỗ trợ
          content:
            application/json:
              schema: {$ref: "#/components/schemas/KNSessionContext"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/accounts/support-sessions/{id}/end:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      summary: "Thoát chế độ hỗ trợ — ngữ cảnh hỗ trợ hết hiệu lực ngay"
      operationId: accountsEndSupport
      tags: [accounts]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Đã kết thúc
          content:
            application/json:
              schema:
                type: object
                required: [support_session_id, ended_at]
                properties:
                  support_session_id: {type: string, format: uuid}
                  ended_at: {type: [string, "null"], format: date-time}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {description: accounts.support_session_ended, $ref: "#/components/responses/Problem"}
  /v1/accounts/support-log:
    get:
      summary: "Nhật ký hỗ trợ (không xóa): thời điểm, Admin, thay cho ai, chức năng, nội dung, lý do — mới nhất trước"
      operationId: accountsSupportLog
      tags: [accounts]
      parameters:
        - {name: support_session_id, in: query, schema: {type: string, format: uuid}}
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        "200":
          description: Một trang
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/KNSupportLogEntry"}}
                  next_cursor: {type: [string, "null"]}
        "403": {$ref: "#/components/responses/Problem"}
  # --- hết pf/accounts ---

  # --- pf/reports: mẫu biểu (reports_admin, masterdata_admin hoặc platform_admin — CGH FN-10 BR-03) và lịch gửi định kỳ (US-DASH-03) ---
  /v1/reports/templates:
    get:
      summary: Mọi mẫu (mẫu hệ thống + phiên bản mới nhất của tenant, kể cả đã ngừng dùng)
      operationId: adminListReportTemplates
      tags: [reports]
      responses:
        "200":
          description: Danh sách
          content:
            application/json:
              schema: {type: object, required: [items], properties: {items: {type: array, items: {$ref: "#/components/schemas/ReportTemplate"}}}}
        "403": {$ref: "#/components/responses/Problem"}
    post:
      summary: Tạo phiên bản mới của mẫu (việc xuất cũ giữ ảnh chụp phiên bản cũ)
      operationId: saveReportTemplate
      tags: [reports]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, definition]
              properties:
                key: {type: string, pattern: "^[a-z][a-z0-9_.]{2,63}$"}
                definition: {$ref: "#/components/schemas/ReportDefinition"}
      responses:
        "201":
          description: Phiên bản mới
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ReportTemplate"}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/reports/templates/{key}/versions:
    get:
      summary: Lịch sử phiên bản của mẫu (mới nhất trước; mẫu hệ thống là phiên bản 0)
      operationId: listReportTemplateVersions
      tags: [reports]
      parameters:
        - {name: key, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: Phiên bản
          content:
            application/json:
              schema: {type: object, required: [items], properties: {items: {type: array, items: {$ref: "#/components/schemas/ReportTemplate"}}}}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/reports/templates/{key}/retire:
    post:
      summary: Ngừng dùng mẫu kèm lý do (phiên bản mới trạng thái retired; không xóa)
      operationId: retireReportTemplate
      tags: [reports]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - {name: key, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [reason], properties: {reason: {type: string, minLength: 10, maxLength: 500}}}
      responses:
        "201":
          description: Đã ngừng dùng
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ReportTemplate"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
  /v1/reports/schedules:
    get:
      summary: Lịch gửi người gọi được xem (người lập hoặc phạm vi bao trọn)
      operationId: listReportSchedules
      tags: [reports]
      responses:
        "200":
          description: Danh sách
          content:
            application/json:
              schema: {type: object, required: [items], properties: {items: {type: array, items: {$ref: "#/components/schemas/ReportSchedule"}}}}
        "403": {$ref: "#/components/responses/Problem"}
    post:
      summary: Lập lịch gửi báo cáo (tuần/tháng, giờ Việt Nam). Người nhận là actor_ref — email tra lúc gửi, không lưu
      description: HTX US-DASH-03 — quản lý HTX (coop_manager) lập lịch mẫu htx.production, chỉ trong HTX của mình (params.cooperative_ref được gán; HTX khác → 403).
      operationId: createReportSchedule
      tags: [reports]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [template_key, format, frequency, hour, recipients]
              properties:
                template_key: {type: string}
                format: {type: string, enum: [xlsx, pdf]}
                unit_code: {type: string}
                params: {type: object, description: "Như ReportParams của Application API; kỳ tính theo mốc (tháng: tháng trước; tuần: tháng đang chạy)"}
                frequency: {type: string, enum: [weekly, monthly]}
                weekday: {type: integer, minimum: 1, maximum: 7, description: "weekly: 1 = thứ Hai"}
                day_of_month: {type: integer, minimum: 1, maximum: 28, description: "monthly"}
                hour: {type: integer, minimum: 0, maximum: 23}
                recipients: {type: array, minItems: 1, maxItems: 50, items: {type: string, format: uuid}}
      responses:
        "201":
          description: Đã lập lịch
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ReportSchedule"}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/reports/schedules/{id}/deactivate:
    post:
      summary: Ngừng lịch kèm lý do (không xóa; lịch sử chạy giữ nguyên)
      operationId: deactivateReportSchedule
      tags: [reports]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [reason], properties: {reason: {type: string, minLength: 10, maxLength: 500}}}
      responses:
        "200":
          description: Lịch
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ReportSchedule"}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/reports/schedules/{id}/runs:
    get:
      summary: Các lần chạy của lịch — mỗi mốc (tuần ISO / tháng) đúng một lần, kèm kết quả gửi email
      operationId: listReportScheduleRuns
      tags: [reports]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Lần chạy
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [slot_key, slot_at, status, fired_at]
                      properties:
                        slot_key: {type: string, examples: [2026-W40, 2026-10]}
                        slot_at: {type: string, format: date-time}
                        status: {type: string, enum: [queued, skipped]}
                        skip_reason: {type: [string, "null"]}
                        job_id: {type: [string, "null"], format: uuid}
                        fired_at: {type: string, format: date-time}
                        delivery_status: {type: [string, "null"], enum: [sent, skipped, failed, null]}
                        delivery_note: {type: [string, "null"]}
                        sent_count: {type: [integer, "null"]}
                        delivered_at: {type: [string, "null"], format: date-time}
        "404": {$ref: "#/components/responses/Problem"}
  # --- pf/reports: mẫu báo cáo dạng lưới KN v7.7 (FN-AD-04.06). Vai platform_admin hoặc reports_admin (MFA). Nháp → đề nghị →
  # phát hành bởi NGƯỜI KHÁC (≠ người đề nghị, ≠ người sửa cuối — R-56, kiểm ở app/ và CHECK DB) → bất biến → ngừng dùng.
  # Mẫu chưa gán loại báo cáo không phát hành được. Mọi thao tác ghi sổ nhật ký (GET …/log). ---
  /v1/reports/forms:
    get:
      summary: Danh sách mẫu (lọc phòng ban, cấp, trạng thái, loại báo cáo) kèm phiên bản đang soạn và phiên bản phát hành mới nhất
      operationId: adminListForms
      tags: [reports]
      parameters:
        - {name: department, in: query, schema: {type: string}}
        - {name: level, in: query, schema: {type: string, enum: [commune, province]}}
        - {name: status, in: query, schema: {type: string, enum: [active, retired]}}
        - {name: report_type, in: query, schema: {$ref: "application.yaml#/components/schemas/FormReportType"}}
      responses:
        "200":
          description: Mẫu
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [template, open_version, published_version, report_types]
                      properties:
                        template: {$ref: "application.yaml#/components/schemas/FormTemplate"}
                        open_version: {oneOf: [{$ref: "application.yaml#/components/schemas/FormVersion"}, {type: "null"}]}
                        published_version: {oneOf: [{$ref: "application.yaml#/components/schemas/FormVersion"}, {type: "null"}]}
                        report_types: {type: array, items: {$ref: "application.yaml#/components/schemas/FormReportType"}}
        "403": {$ref: "#/components/responses/Problem"}
    post:
      summary: Tạo mẫu mới (trống, nhân bản từ phiên bản khác, hoặc kèm định nghĩa) → phiên bản nháp v1
      operationId: adminCreateForm
      tags: [reports]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name, department_code, entry_level]
              properties:
                code: {type: string, pattern: "^[A-Z0-9][A-Z0-9_.-]{1,31}$"}
                name: {type: string, maxLength: 300}
                department_code: {type: string, examples: [trong_trot]}
                entry_level: {type: string, enum: [commune, province]}
                definition: {$ref: "application.yaml#/components/schemas/FormDefinition"}
                clone_from_version_id: {type: string, format: uuid}
      responses:
        "201":
          description: Đã tạo
          content:
            application/json:
              schema:
                type: object
                required: [template, version]
                properties:
                  template: {$ref: "application.yaml#/components/schemas/FormTemplate"}
                  version: {$ref: "application.yaml#/components/schemas/FormVersion"}
        "403": {$ref: "#/components/responses/Problem"}
        "409": {description: reports.form_code_taken, $ref: "#/components/responses/Problem"}
        "422": {description: "validation_failed, reports.form_invalid, reports.formula_invalid, reports.formula_invalid_ref, reports.formula_cycle", $ref: "#/components/responses/Problem"}
  /v1/reports/forms/import:
    post:
      summary: Nạp một sheet Excel (.xlsx) thành mẫu mới hoặc nháp mới của mẫu có sẵn (tiêu đề gộp, chữ cái cột, công thức dòng dữ liệu)
      description: |
        Có template_id → nháp mới của mẫu đó (409 nếu đang có nháp); không → tạo mẫu (code, name, department_code, entry_level).
        Bố cục nhận: khung tiêu đề từ header_start; hàng chữ cái A, B, C… và dòng loại cột (tệp do hệ thống xuất) nếu có; dòng dữ
        liệu đầu tự nhận (dòng đầu có công thức, hoặc STT = 1) hoặc data_row. Công thức tham chiếu dòng khác/sheet khác hoặc hàm
        ngoài tập con → cột nhập + cảnh báo (report.warnings). Tệp hỏng → 422 reports.form_import_invalid; mọi lần nạp được ghi.
      operationId: adminImportForm
      tags: [reports]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - {name: template_id, in: query, schema: {type: string, format: uuid}}
        - {name: code, in: query, schema: {type: string}}
        - {name: name, in: query, schema: {type: string}}
        - {name: department_code, in: query, schema: {type: string}}
        - {name: entry_level, in: query, schema: {type: string, enum: [commune, province], default: commune}}
        - {name: sheet, in: query, schema: {type: string}}
        - {name: header_start, in: query, schema: {type: integer, minimum: 1}}
        - {name: data_row, in: query, schema: {type: integer, minimum: 1}}
        - {name: file_name, in: query, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
            schema: {type: string, format: binary}
      responses:
        "201":
          description: Đã nạp thành nháp
          content:
            application/json:
              schema:
                type: object
                required: [import_id, template, version, report]
                properties:
                  import_id: {type: string, format: uuid}
                  template: {$ref: "application.yaml#/components/schemas/FormTemplate"}
                  version: {$ref: "application.yaml#/components/schemas/FormVersion"}
                  report:
                    type: object
                    required: [sheet, sheets, header_rows, data_row, columns, merges, formulas, kind_row, warnings]
                    properties:
                      sheet: {type: string}
                      sheets: {type: array, items: {type: string}}
                      header_rows: {type: integer}
                      data_row: {type: integer}
                      columns: {type: integer}
                      merges: {type: integer}
                      formulas: {type: integer}
                      kind_row: {type: boolean}
                      warnings: {type: [array, "null"], items: {type: string}}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {description: reports.form_not_found, $ref: "#/components/responses/Problem"}
        "409": {description: "reports.form_code_taken, reports.form_draft_exists, reports.form_retired", $ref: "#/components/responses/Problem"}
        "413": {$ref: "#/components/responses/Problem"}
        "422": {description: reports.form_import_invalid, $ref: "#/components/responses/Problem"}
  /v1/reports/forms/seed:
    post:
      summary: Khởi tạo 14 mẫu Phòng Trồng trọt (T01–T07 tuần, M01 tháng, V01–V06 hàng vụ) thành nháp v1 + gán loại báo cáo, cấp Xã
      description: Mẫu đã có (cùng mã, phòng ban) giữ nguyên (skipped). Phần chưa biết từ tệp gốc đánh dấu placeholder/pending “chờ khách Q-01”.
      operationId: adminSeedForms
      tags: [reports]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                department_code: {type: string, default: trong_trot}
      responses:
        "200":
          description: Kết quả
          content:
            application/json:
              schema:
                type: object
                required: [created, skipped]
                properties:
                  created: {type: array, items: {type: string}}
                  skipped: {type: array, items: {type: string}}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/reports/forms/{id}:
    get:
      summary: Mẫu kèm lịch sử phiên bản (không kèm định nghĩa) và gán loại báo cáo
      operationId: adminGetForm
      tags: [reports]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Mẫu
          content:
            application/json:
              schema:
                type: object
                required: [template, versions, assignments]
                properties:
                  template: {$ref: "application.yaml#/components/schemas/FormTemplate"}
                  versions: {type: array, items: {$ref: "application.yaml#/components/schemas/FormVersion"}}
                  assignments: {type: array, items: {$ref: "application.yaml#/components/schemas/FormAssignment"}}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/reports/forms/{id}/retire:
    post:
      summary: Ngừng dùng cả mẫu (không xóa — RB-1), kèm lý do
      operationId: adminRetireForm
      tags: [reports]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [reason], properties: {reason: {type: string, minLength: 10, maxLength: 500}}}
      responses:
        "200":
          description: Đã ngừng dùng
          content:
            application/json:
              schema: {$ref: "application.yaml#/components/schemas/FormTemplate"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {description: reports.form_retired, $ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/reports/forms/{id}/log:
    get:
      summary: Nhật ký thiết kế mẫu (API Log chuẩn của màn Detail), mới nhất trước, cursor
      operationId: adminFormLog
      tags: [reports]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        "200":
          description: Nhật ký
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  next_cursor: {type: [string, "null"]}
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, event, actor_ref, actor_display, at, version_id, version, changes, reason, seq]
                      properties:
                        id: {type: string, format: uuid}
                        event:
                          type: string
                          enum: [template_created, template_updated, template_retired, draft_created, draft_saved, draft_ops_applied, imported, seeded, proposed, proposal_withdrawn, published, version_retired, assigned, assignment_revoked]
                        actor_ref: {type: string, format: uuid}
                        actor_display: {type: [string, "null"], description: "Tên tra từ vault lúc đọc (P1); null ở G1"}
                        at: {type: string, format: date-time}
                        version_id: {type: [string, "null"], format: uuid}
                        version: {type: [integer, "null"]}
                        changes:
                          type: array
                          items:
                            type: object
                            required: [field, old, new]
                            properties:
                              field: {type: string}
                              old: {}
                              new: {}
                        reason: {type: [string, "null"]}
                        seq: {type: integer}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/reports/forms/{id}/versions:
    post:
      summary: Tạo nháp mới từ một phiên bản (mặc định mới nhất); restore = khôi phục phiên bản cũ thành nháp
      operationId: adminNewFormVersion
      tags: [reports]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                from_version: {type: integer, minimum: 1}
                restore: {type: boolean}
      responses:
        "201":
          description: Nháp mới
          content:
            application/json:
              schema: {$ref: "application.yaml#/components/schemas/FormVersion"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {description: "reports.form_draft_exists, reports.form_retired", $ref: "#/components/responses/Problem"}
  /v1/reports/forms/{id}/versions/{v}:
    get:
      summary: Một phiên bản kèm định nghĩa lưới (mọi trạng thái)
      operationId: adminGetFormVersion
      tags: [reports]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: v, in: path, required: true, schema: {type: integer, minimum: 1}}
      responses:
        "200":
          description: Phiên bản
          content:
            application/json:
              schema:
                type: object
                required: [template, version]
                properties:
                  template: {$ref: "application.yaml#/components/schemas/FormTemplate"}
                  version: {$ref: "application.yaml#/components/schemas/FormVersion"}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/reports/forms/{id}/versions/{v}/draft:
    post:
      summary: Lưu nháp — thay định nghĩa và/hoặc áp dụng từ kỳ (chỉ phiên bản draft)
      operationId: adminSaveFormDraft
      tags: [reports]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: v, in: path, required: true, schema: {type: integer, minimum: 1}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                definition: {$ref: "application.yaml#/components/schemas/FormDefinition"}
                effective_from: {type: string, format: date}
                effective_label: {type: string, maxLength: 60}
      responses:
        "200":
          description: Nháp đã lưu
          content:
            application/json:
              schema: {$ref: "application.yaml#/components/schemas/FormVersion"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {description: "reports.form_version_locked, reports.form_retired", $ref: "#/components/responses/Problem"}
        "422": {description: "reports.form_invalid, reports.formula_invalid, reports.formula_invalid_ref, reports.formula_cycle", $ref: "#/components/responses/Problem"}
  /v1/reports/forms/{id}/versions/{v}/ops:
    post:
      summary: Thao tác lưới của trình thiết kế (cả lô hoặc không gì) — thêm/xóa/sửa cột, dòng tiêu đề, gộp/tách ô, dòng chỉ tiêu, ràng buộc
      description: |
        op ∈ insert_column {at, side before|after, column} · delete_column {letter} · update_column {letter, column} ·
        insert_header_row {row, side} · delete_header_row {row} · set_header_cell {row, letter, text} · merge {range} · unmerge {range} ·
        add_indicator {indicator, after} · delete_indicator {code} · set_rule {rule} · delete_rule {id} · set_meta {meta} ·
        set_groups {groups} · set_totals {totals} · set_period_block {block}. Chèn/xóa cột dời công thức, vùng gộp, nhóm như Excel;
        xóa cột đang được công thức tham chiếu → 422 reports.formula_invalid_ref (lỗi ở ops[i]).
      operationId: adminApplyFormOps
      tags: [reports]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: v, in: path, required: true, schema: {type: integer, minimum: 1}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ops]
              properties:
                ops:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items:
                    type: object
                    required: [op]
                    properties:
                      op: {type: string, enum: [insert_column, delete_column, update_column, insert_header_row, delete_header_row, set_header_cell, merge, unmerge, add_indicator, delete_indicator, set_rule, delete_rule, set_meta, set_groups, set_totals, set_period_block]}
                      at: {type: string}
                      side: {type: string, enum: [before, after]}
                      letter: {type: string}
                      row: {type: integer}
                      text: {type: string}
                      range: {type: string}
                      code: {type: string}
                      id: {type: string}
                      after: {type: string}
                      column: {$ref: "application.yaml#/components/schemas/FormColumn"}
                      indicator: {type: object, properties: {code: {type: string}, label: {type: string}, catalog: {type: string}, placeholder: {type: boolean}}}
                      rule: {$ref: "application.yaml#/components/schemas/FormRule"}
                      meta:
                        type: object
                        properties:
                          title: {type: string}
                          sheet_name: {type: string}
                          requirements: {type: string}
                          freeze_through: {type: string}
                          completeness: {type: string, enum: [complete, partial, placeholder]}
                          pending: {type: array, items: {type: object, properties: {part: {type: string}, detail: {type: string}, question: {type: string}}}}
                      groups: {type: array, items: {type: object, properties: {id: {type: string}, title: {type: string}, from: {type: string}, to: {type: string}}}}
                      totals: {type: array, items: {type: object, properties: {kind: {type: string, enum: [region, province]}, label: {type: string}, label_letter: {type: string}}}}
                      block: {$ref: "application.yaml#/components/schemas/FormPeriodBlock"}
      responses:
        "200":
          description: Nháp sau thao tác
          content:
            application/json:
              schema: {$ref: "application.yaml#/components/schemas/FormVersion"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {description: reports.form_version_locked, $ref: "#/components/responses/Problem"}
        "422": {description: "reports.form_invalid, reports.formula_invalid_ref…", $ref: "#/components/responses/Problem"}
  /v1/reports/forms/{id}/versions/{v}/propose:
    post:
      summary: Đề nghị phát hành nháp (khóa nội dung) kèm áp dụng từ kỳ — mẫu phải đã gán loại báo cáo
      operationId: adminProposeFormVersion
      tags: [reports]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: v, in: path, required: true, schema: {type: integer, minimum: 1}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                effective_from: {type: string, format: date, description: "Ngày bắt đầu kỳ áp dụng; không sớm hơn phiên bản đã phát hành"}
                effective_label: {type: string, examples: ["Tuần 37/2026"]}
      responses:
        "200":
          description: Đã đề nghị
          content:
            application/json:
              schema: {$ref: "application.yaml#/components/schemas/FormVersion"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {description: "reports.form_version_locked, reports.form_not_assigned, reports.form_retired", $ref: "#/components/responses/Problem"}
        "422": {description: "reports.form_effective_invalid, reports.form_invalid", $ref: "#/components/responses/Problem"}
  /v1/reports/forms/{id}/versions/{v}/withdraw:
    post:
      summary: Rút đề nghị — phiên bản về nháp
      operationId: adminWithdrawFormVersion
      tags: [reports]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: v, in: path, required: true, schema: {type: integer, minimum: 1}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, properties: {reason: {type: string, minLength: 10, maxLength: 500}}}
      responses:
        "200":
          description: Đã về nháp
          content:
            application/json:
              schema: {$ref: "application.yaml#/components/schemas/FormVersion"}
        "409": {description: reports.form_not_proposed, $ref: "#/components/responses/Problem"}
  /v1/reports/forms/{id}/versions/{v}/publish:
    post:
      summary: Phát hành phiên bản đã đề nghị — người phát hành ≠ người đề nghị và ≠ người sửa cuối (R-56); từ đây bất biến
      description: Phát sự kiện pf.reports.form_version.published v1.
      operationId: adminPublishFormVersion
      tags: [reports]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: v, in: path, required: true, schema: {type: integer, minimum: 1}}
      requestBody:
        content:
          application/json:
            schema: {type: object}
      responses:
        "200":
          description: Đã phát hành
          content:
            application/json:
              schema: {$ref: "application.yaml#/components/schemas/FormVersion"}
        "403": {description: self_approval_forbidden, $ref: "#/components/responses/Problem"}
        "409": {description: "reports.form_not_proposed, reports.form_not_assigned", $ref: "#/components/responses/Problem"}
  /v1/reports/forms/{id}/versions/{v}/retire:
    post:
      summary: Ngừng dùng một phiên bản đã phát hành (kèm lý do); công việc đã ghim phiên bản giữ nguyên
      operationId: adminRetireFormVersion
      tags: [reports]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: v, in: path, required: true, schema: {type: integer, minimum: 1}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [reason], properties: {reason: {type: string, minLength: 10, maxLength: 500}}}
      responses:
        "200":
          description: Đã ngừng dùng
          content:
            application/json:
              schema: {$ref: "application.yaml#/components/schemas/FormVersion"}
        "409": {description: reports.form_not_published, $ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/reports/form-versions/{id}/evaluate:
    post:
      summary: Xem trước màn nhập — kiểm và tính thử một lưới theo phiên bản (mọi trạng thái, kể cả nháp)
      operationId: adminEvaluateFormVersion
      tags: [reports]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "application.yaml#/components/schemas/FormEvalInput"}
      responses:
        "200":
          description: Kết quả
          content:
            application/json:
              schema: {$ref: "application.yaml#/components/schemas/FormEvalResult"}
        "404": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/reports/form-assignments:
    get:
      summary: Gán mẫu vào loại báo cáo của phòng ban × cấp (mặc định chỉ đang hiệu lực)
      operationId: adminListFormAssignments
      tags: [reports]
      parameters:
        - {name: template_id, in: query, schema: {type: string, format: uuid}}
        - {name: department, in: query, schema: {type: string}}
        - {name: level, in: query, schema: {type: string, enum: [commune, province]}}
        - {name: report_type, in: query, schema: {$ref: "application.yaml#/components/schemas/FormReportType"}}
        - {name: active, in: query, schema: {type: boolean, default: true}}
      responses:
        "200":
          description: Gán
          content:
            application/json:
              schema: {type: object, required: [items], properties: {items: {type: array, items: {$ref: "application.yaml#/components/schemas/FormAssignment"}}}}
    post:
      summary: Gán mẫu vào một loại báo cáo (phòng ban, cấp lấy theo mẫu); một loại gồm nhiều mẫu
      operationId: adminAssignForm
      tags: [reports]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [template_id, report_type]
              properties:
                template_id: {type: string, format: uuid}
                report_type: {$ref: "application.yaml#/components/schemas/FormReportType"}
      responses:
        "201":
          description: Đã gán
          content:
            application/json:
              schema: {$ref: "application.yaml#/components/schemas/FormAssignment"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {description: "reports.form_already_assigned, reports.form_retired", $ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/reports/form-assignments/{id}/revoke:
    post:
      summary: Bỏ gán (kèm lý do); công việc đã phát hành giữ nguyên
      operationId: adminRevokeFormAssignment
      tags: [reports]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [reason], properties: {reason: {type: string, minLength: 10, maxLength: 500}}}
      responses:
        "200":
          description: Đã bỏ gán
          content:
            application/json:
              schema: {$ref: "application.yaml#/components/schemas/FormAssignment"}
        "404": {description: reports.form_assignment_not_found, $ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  # --- hết pf/reports ---

  # --- pf/waterway: mạng đường thủy có phiên bản (mục 16; GIS FN-09, US-WATER-02/03). waterway_editor vẽ/sửa/dựng, waterway_publisher phát hành (≠ người dựng, R-56) ---
  /v1/waterway/segments:
    post:
      summary: Vẽ mới tuyến sông/kênh (kể cả nhánh rẽ) — GIS US-WATER-02, BR-39
      description: |
        Vai waterway_editor. Chiều dài do hệ thống tính (geodesic) — `length_m` gửi lên bị bỏ qua (AC-1).
        Thiếu tên/phân loại hoặc số đo ≤ 0/sai định dạng → 422 với thông báo AC-2. Tuyến `draft` không bao giờ vào đồ thị.
      operationId: createWaterwaySegment
      tags: [waterway]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/WaterwaySegmentInput"}
      responses:
        "201":
          description: Bản sửa số 1 đã ghi
          headers:
            Location: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/WaterwaySegment"}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
    get:
      summary: Bản hiện hành của các đoạn (kể cả nháp) — vai waterway_editor, waterway_publisher hoặc platform_admin
      operationId: listWaterwaySegments
      tags: [waterway]
      parameters:
        - {name: status, in: query, schema: {type: string, enum: [draft, confirmed, retired]}}
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Một trang (theo segment_ref)
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/WaterwaySegment"}}
                  next_cursor: {type: [string, "null"]}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/waterway/segments/{ref}:
    get:
      summary: Một đoạn — bản hiện hành và toàn bộ lịch sử sửa
      operationId: getWaterwaySegment
      tags: [waterway]
      parameters:
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Đoạn
          content:
            application/json:
              schema:
                type: object
                required: [head, history]
                properties:
                  head: {$ref: "#/components/schemas/WaterwaySegment"}
                  history: {type: array, items: {$ref: "#/components/schemas/WaterwaySegment"}}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/waterway/segments/{ref}/revisions:
    post:
      summary: Sửa tuyến (kéo/thêm/xóa điểm, thuộc tính, xác nhận, ngừng dùng) — GIS US-WATER-03, BR-40
      description: |
        Bản ghi bù (RB-1): thay toàn bộ nội dung, trỏ về bản trước, bắt buộc `reason` và `expected_revision` = số sửa hiện hành
        (khác → 409 waterway.revision_conflict). Thay đổi vào lớp bản đồ dùng chung sau khi dựng và phát hành phiên bản mạng mới.
      operationId: reviseWaterwaySegment
      tags: [waterway]
      parameters:
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/WaterwaySegmentInput"
                - $ref: "#/components/schemas/WaterwayRevision"
      responses:
        "201":
          description: Bản sửa mới
          content:
            application/json:
              schema: {$ref: "#/components/schemas/WaterwaySegment"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/waterway/structures:
    post:
      summary: Ghi công trình vượt sông (cầu, cống, âu thuyền, đường dây điện) gắn với một đoạn
      description: Vai waterway_editor. Vị trí phải cách tuyến ≤ waterway.structure_max_offset_m (mặc định 500 m).
      operationId: createWaterwayStructure
      tags: [waterway]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/WaterwayStructureInput"}
      responses:
        "201":
          description: Công trình đã ghi
          content:
            application/json:
              schema: {$ref: "#/components/schemas/WaterwayStructure"}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
    get:
      summary: Bản hiện hành của công trình, lọc theo đoạn
      operationId: listWaterwayStructures
      tags: [waterway]
      parameters:
        - {name: segment_ref, in: query, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Một trang
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/WaterwayStructure"}}
                  next_cursor: {type: [string, "null"]}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/waterway/structures/{ref}/revisions:
    post:
      summary: Sửa công trình (bản ghi bù; ngừng dùng = status retired)
      operationId: reviseWaterwayStructure
      tags: [waterway]
      parameters:
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/WaterwayStructureInput"
                - $ref: "#/components/schemas/WaterwayRevision"
      responses:
        "201":
          description: Bản sửa mới
          content:
            application/json:
              schema: {$ref: "#/components/schemas/WaterwayStructure"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/waterway/networks/builds:
    post:
      summary: Yêu cầu dựng phiên bản mạng (R-52 — 202 + job, worker dựng)
      description: |
        Vai waterway_editor. Tham số dựng (snap 25 m, nối tự động 150 m, báo cáo 1 km, nối chữ T 20 m, biên an toàn,
        lớp phương tiện) chốt lúc yêu cầu; worker dựng từ các đoạn ĐÃ XÁC NHẬN tại `requested_at` — tất định.
        Tập đoạn trùng một phiên bản built/published → job hoàn tất với `reused = true`, không tạo phiên bản mới.
      operationId: requestWaterwayBuild
      tags: [waterway]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Job đã nhận
          headers:
            Location: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/WaterwayBuild"}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/waterway/networks/builds/{id}:
    get:
      summary: Trạng thái job dựng
      operationId: getWaterwayBuild
      tags: [waterway]
      parameters:
        - $ref: "#/components/parameters/VersionID"
      responses:
        "200":
          description: Job
          content:
            application/json:
              schema: {$ref: "#/components/schemas/WaterwayBuild"}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/waterway/networks:
    get:
      summary: Phiên bản mạng, mới → cũ
      operationId: listWaterwayNetworks
      tags: [waterway]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Một trang
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/WaterwayNetworkVersion"}}
                  next_cursor: {type: [string, "null"]}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/waterway/networks/{version}:
    get:
      summary: Một phiên bản mạng
      operationId: getWaterwayNetwork
      tags: [waterway]
      parameters:
        - {name: version, in: path, required: true, schema: {type: integer, minimum: 1}}
      responses:
        "200":
          description: Phiên bản
          content:
            application/json:
              schema: {$ref: "#/components/schemas/WaterwayNetworkVersion"}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/waterway/networks/{version}/publish:
    post:
      summary: Phát hành phiên bản mạng — vai waterway_publisher, KHÁC người dựng (R-56)
      description: |
        Phiên bản đang phát hành chuyển sang `superseded` (giữ nguyên, vẫn định tuyến được khi ghim `version`);
        chỉ một phiên bản có hiệu lực. Phát sự kiện pf.waterway.network.published.
      operationId: publishWaterwayNetwork
      tags: [waterway]
      parameters:
        - {name: version, in: path, required: true, schema: {type: integer, minimum: 1}}
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Phiên bản đã phát hành
          content:
            application/json:
              schema: {$ref: "#/components/schemas/WaterwayNetworkVersion"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
  /v1/waterway/networks/{version}/findings:
    get:
      summary: Phát hiện khi dựng (giao cắt, nối chữ T, khe hở đã nối/chỉ báo cáo, đầu treo, tuyến cô lập)
      operationId: listWaterwayFindings
      tags: [waterway]
      parameters:
        - {name: version, in: path, required: true, schema: {type: integer, minimum: 1}}
        - {name: kind, in: query, schema: {type: string, enum: [crossing, t_join, gap_joined, gap_reported, dangling, isolated]}}
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Một trang (theo id)
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/WaterwayFinding"}}
                  next_cursor: {type: [string, "null"]}
        "404": {$ref: "#/components/responses/Problem"}
  # --- hết pf/waterway ---

  # --- pf/cropcycle: soạn / phát hành SOP (HTX US-CAT-01, US-CAT-03), dựng lại bảng chiếu ---
  /v1/cropcycle/sops:
    get:
      summary: Mọi mẫu SOP, kể cả nháp (sop_admin, param_approver, platform_admin)
      operationId: adminListCropSOPs
      parameters:
        - {name: status, in: query, schema: {type: string, enum: [draft, published, retired]}}
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        "200":
          description: Một trang
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/CropSOPTemplate"}}
                  next_cursor: {type: [string, "null"]}
        "403": {$ref: "#/components/responses/Problem"}
    post:
      summary: Tạo mẫu SOP với bản nháp phiên bản 1 (sop_admin)
      operationId: createCropSOP
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name, steps]
              properties:
                code: {type: string, pattern: "^[A-Z0-9][A-Z0-9_.-]{1,39}$"}
                name: {type: string, maxLength: 200, description: "Duy nhất (không phân biệt hoa thường, khoảng trắng)"}
                crop: {type: string, default: lua}
                scope: {type: string, enum: [system, htx], default: system}
                cooperative_ref: {type: [string, "null"], format: uuid}
                standard: {type: string}
                description: {type: string, maxLength: 2000}
                steps: {type: array, maxItems: 100, items: {$ref: "#/components/schemas/CropSOPStep"}}
                change_note: {type: string}
      responses:
        "201": {description: Đã tạo, content: {application/json: {schema: {$ref: "#/components/schemas/CropSOP"}}}}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/cropcycle/sops/{ref}:
    get:
      summary: Mẫu SOP kèm mọi phiên bản
      operationId: adminGetCropSOP
      parameters:
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200": {description: Mẫu, content: {application/json: {schema: {$ref: "#/components/schemas/CropSOP"}}}}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/cropcycle/sops/{ref}/versions:
    post:
      summary: Tạo bản nháp phiên bản mới (steps bỏ trống = chép phiên bản mới nhất)
      operationId: newCropSOPVersion
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                steps: {type: [array, "null"], items: {$ref: "#/components/schemas/CropSOPStep"}}
                change_note: {type: string}
      responses:
        "201": {description: Đã tạo, content: {application/json: {schema: {$ref: "#/components/schemas/CropSOP"}}}}
        "409": {$ref: "#/components/responses/Problem"}
  /v1/cropcycle/sops/{ref}/clone:
    post:
      summary: Nhân bản mẫu SOP giữ nguyên bước và thứ tự (HTX US-CAT-03)
      operationId: cloneCropSOP
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string}
                code: {type: string, description: "Bỏ trống → tự sinh"}
                scope: {type: string, enum: [system, htx]}
                cooperative_ref: {type: [string, "null"], format: uuid}
      responses:
        "201": {description: Bản sao (nháp), content: {application/json: {schema: {$ref: "#/components/schemas/CropSOP"}}}}
        "409": {$ref: "#/components/responses/Problem"}
  /v1/cropcycle/sops/{ref}/retire:
    post:
      summary: Ngừng dùng mẫu (không xóa; vụ đã ghim giữ phiên bản)
      operationId: retireCropSOP
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string, minLength: 10}
      responses:
        "200": {description: Đã ngừng dùng, content: {application/json: {schema: {$ref: "#/components/schemas/CropSOP"}}}}
        "409": {$ref: "#/components/responses/Problem"}
  /v1/cropcycle/sop-versions/{id}:
    get:
      summary: Một phiên bản SOP (kể cả nháp)
      operationId: adminGetCropSOPVersion
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Phiên bản
          content:
            application/json:
              schema:
                type: object
                required: [version, template]
                properties:
                  version: {$ref: "#/components/schemas/CropSOPVersion"}
                  template: {$ref: "#/components/schemas/CropSOPTemplate"}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/cropcycle/sop-versions/{id}/steps:
    post:
      summary: Thay bước của bản nháp (bản đã phát hành bất biến → 409 cropcycle.sop_state)
      operationId: updateCropSOPDraft
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [steps]
              properties:
                steps: {type: array, items: {$ref: "#/components/schemas/CropSOPStep"}}
                change_note: {type: string}
      responses:
        "200": {description: Đã sửa, content: {application/json: {schema: {$ref: "#/components/schemas/CropSOP"}}}}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/cropcycle/sop-versions/{id}/publish:
    post:
      summary: Phát hành bản nháp — param_approver khác người soạn (R-56); phải có bước thu hoạch
      operationId: publishCropSOP
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200": {description: Đã phát hành (phát pf.cropcycle.sop.published), content: {application/json: {schema: {$ref: "#/components/schemas/CropSOP"}}}}
        "403": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/cropcycle/variety-bindings:
    post:
      summary: Gắn giống lúa với mẫu SOP hệ thống đã ban hành (thay gắn cũ, không xóa)
      operationId: bindCropVariety
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [variety_code, template_ref]
              properties:
                variety_code: {type: string}
                template_ref: {type: string, format: uuid}
                note: {type: string, maxLength: 500}
      responses:
        "200": {description: Gắn hiện hành, content: {application/json: {schema: {$ref: "#/components/schemas/CropVarietyBinding"}}}}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/cropcycle/projections/rebuild:
    post:
      summary: Dựng lại bảng chiếu season_current, farm_log_current, coop_season_area, yield_summary từ sổ (R-22, platform_admin)
      operationId: rebuildCropProjections
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Số dòng đã dựng lại
          content:
            application/json:
              schema:
                type: object
                required: [seasons, farm_logs, coop_season_areas]
                properties:
                  seasons: {type: integer}
                  farm_logs: {type: integer}
                  coop_season_areas: {type: integer}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/cropcycle/stats/cooperatives/{ref}:
    get:
      summary: Số vụ đang mở và nhật ký chờ duyệt của một HTX — cảnh báo trong hộp thoại vô hiệu hóa HTX (registry_admin, platform_admin)
      description: HTX không có hoạt động (hoặc không thuộc tenant) → 0 / 0. Không có dữ liệu cá nhân.
      operationId: getCropCooperativeStats
      parameters:
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Số liệu
          content:
            application/json:
              schema:
                type: object
                required: [cooperative_ref, open_seasons, pending_logs]
                properties:
                  cooperative_ref: {type: string, format: uuid}
                  open_seasons: {type: integer}
                  pending_logs: {type: integer}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
  # --- hết pf/cropcycle ---
  # --- pf/party: cấp quyền chia sẻ giữa hai tenant (ADR-0020, RB-2 / Q-MKG-12) ---
  /v1/share-grants:
    post:
      summary: Đề xuất cấp quyền chia sẻ tenant này (bên cấp) → tenant khác (bên nhận) — ADR-0020
      description: |
        Chỉ `platform_admin` của tenant bên cấp. Một `platform_admin` KHÁC duyệt (R-56). `valid_from` vắng → lúc đề xuất;
        `valid_to` bắt buộc, ở tương lai, tối đa 5 năm.
      operationId: proposeShareGrant
      tags: [party]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [grantee_tenant_id, kinds, purpose, valid_to]
              properties:
                grantee_tenant_id: {type: string, format: uuid}
                kinds:
                  type: array
                  minItems: 1
                  items: {$ref: "#/components/schemas/ShareKind"}
                purpose: {type: string, minLength: 10, maxLength: 500}
                valid_from: {type: string, format: date-time}
                valid_to: {type: string, format: date-time}
      responses:
        "201":
          description: Đã đề xuất (gọi lặp cùng Idempotency-Key → như lần đầu)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ShareGrant"}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
    get:
      summary: Cấp quyền chia sẻ của tenant bên cấp — ADR-0020
      operationId: listShareGrants
      tags: [party]
      parameters:
        - {name: status, in: query, schema: {type: string, enum: [proposed, active, revoked]}}
        - {name: cursor, in: query, schema: {type: string, format: uuid}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        "200":
          description: Một trang
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/ShareGrant"}}
                  next_cursor: {type: [string, "null"], format: uuid}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/share-grants/{id}:
    get:
      summary: Một cấp quyền chia sẻ — ADR-0020
      operationId: getShareGrant
      tags: [party]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Cấp quyền
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ShareGrant"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/share-grants/{id}/approve:
    post:
      summary: Duyệt cấp quyền chia sẻ — người duyệt ≠ người đề xuất (R-56), ADR-0020
      description: Ghi cùng giao dịch bảng chiếu ở tenant bên nhận. Tự duyệt → 403 `self_approval_forbidden`.
      operationId: approveShareGrant
      tags: [party]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "201":
          description: Đã duyệt (gọi lặp của chính người duyệt → 200)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ShareGrant"}
        "200":
          description: Đã duyệt trước đó bởi chính người gọi
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ShareGrant"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
  /v1/share-grants/{id}/revoke:
    post:
      summary: Thu hồi cấp quyền chia sẻ (có hiệu lực ngay) — ADR-0020
      operationId: revokeShareGrant
      tags: [party]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string, minLength: 10, maxLength: 500}
      responses:
        "201":
          description: Đã thu hồi
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ShareGrant"}
        "200":
          description: Đã thu hồi trước đó bởi chính người gọi
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ShareGrant"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/share-grants/{id}/reads:
    get:
      summary: Sổ đọc của bên nhận với một cấp quyền (mỗi lời gọi /v1/partner/* một dòng) — ADR-0020
      operationId: listShareGrantReads
      tags: [party]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: after, in: query, schema: {type: integer, minimum: 0, default: 0}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 500, default: 100}}
      responses:
        "200":
          description: Một trang sổ đọc
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  next_cursor: {type: integer}
                  items: {type: array, items: {$ref: "#/components/schemas/ShareGrantRead"}}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
  # --- hết pf/party cấp quyền chia sẻ ---
  # --- pf/party KN v7.7 gói P2: phòng ban, khu vực, cây 3 cấp, bảng ảnh hưởng (FN-AD-04.02, 04.03) ---
  /v1/departments:
    get:
      summary: "FN-AD-04.03: phòng ban (module) của một đơn vị kèm số tài khoản/bản ghi (null khi chưa nối nguồn đếm)"
      operationId: knAdminListDepartments
      tags: [party]
      parameters:
        - {name: org_ref, in: query, schema: {type: string, format: uuid}, description: "Đơn vị (Nút cấp 1/2); vắng = đơn vị của Nút người gọi"}
        - {name: include_retired, in: query, schema: {type: boolean, default: false}}
      responses:
        "200":
          description: Danh sách theo thứ tự hiển thị
          content:
            application/json:
              schema: {$ref: "#/components/schemas/KNDepartmentList"}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
    post:
      summary: "FN-AD-04.03: khai báo phòng ban cho Nút cấp 1 (TTKNQG) hoặc cấp 2 (TTKN tỉnh); trùng mã trong đơn vị → 409"
      description: Chỉ Admin (platform_admin, registry_admin). Ghi sổ pf_party.department_event (created, ảnh chụp sau).
      operationId: knCreateDepartment
      tags: [party]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/KNDepartmentInput"}
      responses:
        "201":
          description: Đã tạo (gọi lặp cùng Idempotency-Key → như lần đầu)
          headers:
            Location: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/KNDepartment"}
        "403": {$ref: "#/components/responses/Problem"}
        "409": {description: party.department_code_taken, $ref: "#/components/responses/Problem"}
        "422": {description: validation_failed | party.department_unit_invalid, $ref: "#/components/responses/Problem"}
  /v1/departments/{id}:
    get:
      summary: Một phòng ban kèm số tài khoản/bản ghi
      operationId: knGetDepartment
      tags: [party]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Phòng ban
          content:
            application/json:
              schema: {$ref: "#/components/schemas/KNDepartment"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
    put:
      summary: Sửa tên, mô tả, thứ tự, bộ menu (không đổi gì → không ghi sổ; đổi → một dòng Log cũ → mới)
      operationId: knUpdateDepartment
      tags: [party]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string, minLength: 1, maxLength: 200}
                description: {type: string, maxLength: 1000}
                sort_order: {type: integer, minimum: 0, maximum: 100000}
                menu_profile: {type: string, enum: [trong_trot, generic]}
      responses:
        "200":
          description: Phòng ban sau khi sửa
          content:
            application/json:
              schema: {$ref: "#/components/schemas/KNDepartment"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {description: party.department_state (đã xóa), $ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/departments/{id}/status:
    post:
      summary: "Đổi trạng thái Đang áp dụng / Chưa mở / Ngưng hoạt động — hiệu lực ngay ở bước 2 đăng nhập và menu (UR-KT-02)"
      description: Ngưng (suspended) bắt buộc lý do ≥ 10 ký tự. Ngưng/đóng phòng ban còn tài khoản/dữ liệu → cảnh báo, dữ liệu cũ giữ nguyên.
      operationId: knDepartmentStatus
      tags: [party]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: {type: string, enum: [active, not_open, suspended]}
                reason: {type: string, minLength: 10, maxLength: 500}
      responses:
        "201":
          description: Đã đổi
          content:
            application/json:
              schema:
                type: object
                required: [department, warnings]
                properties:
                  department: {$ref: "#/components/schemas/KNDepartment"}
                  warnings: {type: array, items: {type: string}}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {description: party.department_state, $ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/departments/{id}/retire:
    post:
      summary: "Xóa phòng ban (sự kiện retired, không xóa cứng) — chặn khi có tài khoản/dữ liệu (409) hoặc chưa nối nguồn đếm (503)"
      operationId: knRetireDepartment
      tags: [party]
