      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200": {$ref: "#/components/responses/MechAreaChanged"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
  /v1/mechanization/season-areas/{id}/unlock:
    post:
      summary: Mở khóa — App HTX được ưu tiên trở lại ở lần đồng bộ kế tiếp
      operationId: mechUnlockSeasonArea
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200": {$ref: "#/components/responses/MechAreaChanged"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
  /v1/mechanization/season-areas/{id}/events:
    get:
      summary: Lịch sử thay đổi của bản ghi diện tích vụ (FN-06 B7)
      operationId: mechSeasonAreaEvents
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Theo seq
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [seq, action, event_time, recorded_at, actor_ref, reason, area]
                      properties:
                        seq: {type: integer}
                        action: {type: string, enum: [recorded, synced, locked, unlocked]}
                        event_time: {type: string, format: date-time}
                        recorded_at: {type: string, format: date-time}
                        actor_ref: {type: string, format: uuid}
                        reason: {type: [string, "null"]}
                        area: {$ref: "#/components/schemas/MechSeasonArea"}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/mechanization/forecasts:
    post:
      summary: "Chạy và LƯU dự báo nhu cầu máy cho một vụ (FN-09) — phương pháp TẠM cgh.forecast/v1, cần DCRD xác nhận"
      description: |
        Diện tích dự báo = diện tích cùng vụ năm trước × (1 + tăng trưởng trung bình của tối đa 3 vụ cùng loại gần nhất, chặn ±20 %);
        số máy cần = diện tích dự báo ÷ định mức hiệu lực tại ngày bắt đầu vụ dự báo. Kết quả bất biến, lưu kèm đầu vào
        (docs/dev/cgh-forecast.md). Đọc qua Application API GET /v1/mechanization/forecasts/{id}.
      operationId: mechRunForecast
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [season_code, season_year]
              properties:
                season_code: {type: string}
                season_year: {type: integer, description: "Năm bắt đầu vụ dự báo"}
      responses:
        "201":
          description: Đã lưu
          content:
            application/json:
              schema:
                type: object
                required: [run]
                properties:
                  run: {type: object, description: "MechForecastRun (application.yaml)"}
        "200": {description: Gọi lặp cùng Idempotency-Key}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/mechanization/balance-runs:
    post:
      summary: Tính và LƯU cân đối cung–cầu của một vụ (FN-09, QT-01/QT-02) — phát pf.mechanization.balance.computed
      description: |
        Số máy cần = diện tích canh tác ÷ định mức hiệu lực TẠI VỤ (T = ngày bắt đầu vụ); năng lực = máy "Hoạt động" tại T;
        chỉ khâu bật cờ thí điểm. Kết quả bất biến, kèm rule_version và phiên bản tham số đã dùng.
        Chạy đồng bộ (dự kiến < 2 giây ở ĐTK 1); khi vượt ngưỡng sẽ chuyển sang 202 + job (R-52) mà không đổi hợp đồng kết quả.
      operationId: mechComputeBalance
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [season_code, season_year]
              properties:
                season_code: {type: string}
                season_year: {type: integer, description: "Năm bắt đầu vụ"}
      responses:
        "201":
          description: Đã lưu
          content:
            application/json:
              schema:
                type: object
                required: [run]
                properties:
                  run: {$ref: "#/components/schemas/MechRun"}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
  # --- hết pf/mechanization ---

  # --- pf/notify ---
  /v1/sync/nudge:
    post:
      summary: Yêu cầu thiết bị đồng bộ ngay (US-SYNC-02) — như Application API
      operationId: adminSyncNudge
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/NudgeInput"}
      responses:
        "202":
          description: Đã xếp lần gửi
          content:
            application/json:
              schema: {$ref: "#/components/schemas/NudgeResult"}
        "403": {description: "forbidden | mfa_required | notify.out_of_scope", $ref: "#/components/responses/Problem"}
        "404": {description: "notify.nudge_target_not_found", $ref: "#/components/responses/Problem"}
        "429": {description: "notify.nudge_rate_limited", $ref: "#/components/responses/Problem"}
  # --- hết pf/notify ---

  # --- pf/accounts --- tài khoản cán bộ qua Keycloak Admin REST (KN US-ADM-01..03, HTX US-ACC-01/02, CGH FN-01)

  #

  # Vai: platform_admin, account_admin, account_admin_province (đều [MFA]). Ma trận cấp vai (accounts/port/grants.go):

  #   platform_admin → mọi vai do module quản lý; account_admin → trừ account_admin, param_approver, vault_eraser;

  #   account_admin_province → chỉ kn_officer, coop_manager, chỉ tổ chức trong tỉnh (phạm vi theo org_ref, ADR-0009).

  # Thao tác trên một tài khoản đòi mọi vai hiện có của tài khoản đó nằm trong tập người gọi được cấp.

  # Họ tên, email, SĐT chỉ nằm trong Keycloak; pf_accounts chỉ giữ user_ref, org_ref, ảnh chụp vai (không PII).

  # Kích hoạt bằng liên kết một lần của Keycloak (execute-actions-email, 72 giờ) — không gửi mật khẩu tạm (ADR-0010).
  /v1/accounts/grants:
    get:
      summary: Vai người gọi được cấp, vai [MFA], ràng buộc vai ↔ loại tổ chức
      operationId: accountsGrants
      responses:
        "200":
          description: Ma trận cấp vai áp cho người gọi
          content:
            application/json:
              schema:
                type: object
                required: [grantable, mfa_roles, role_org_kinds]
                properties:
                  grantable: {type: array, items: {type: string}}
                  mfa_roles: {type: array, items: {type: string}}
                  role_org_kinds: {type: object, additionalProperties: {type: array, items: {type: string}}}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/accounts/users:
    get:
      summary: Tài khoản trong phạm vi — đọc Keycloak theo tenant_id của token, lọc org_ref thuộc phạm vi người gọi
      operationId: accountsListUsers
      parameters:
        - {name: org_ref, in: query, schema: {type: string, format: uuid}}
        - {name: cursor, in: query, schema: {type: string}, description: "next_cursor của trang trước (R-53)"}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
      responses:
        "200":
          description: Một trang
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/AccountsUser"}}
                  next_cursor: {type: [string, "null"]}
        "403": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
    post:
      summary: Tạo tài khoản — tenant_id từ token, org_ref trong phạm vi, vai theo ma trận; required actions VERIFY_EMAIL, UPDATE_PASSWORD (+ CONFIGURE_TOTP với vai [MFA])
      operationId: accountsCreateUser
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, org_ref, roles]
              properties:
                username: {type: string, description: "Bỏ trống → dùng email. 3–64 ký tự a-z 0-9 . _ - @"}
                email: {type: string, format: email}
                full_name: {type: string, description: "Họ tên; tách thành last_name (họ, đệm) + first_name (tên) nếu không gửi hai trường kia"}
                first_name: {type: string}
                last_name: {type: string}
                phone: {type: string, description: "10 chữ số bắt đầu bằng 0 (+84 được đổi); duy nhất trong tenant"}
                org_ref: {type: string, format: uuid}
                roles: {type: array, minItems: 1, items: {type: string}}
      responses:
        "201":
          description: Đã tạo trong Keycloak và ghi sổ pf_accounts.account_event (created, actions_sent); phát pf.accounts.user.created
          headers:
            Location: {schema: {type: string}}
          content:
            application/json:
              schema:
                type: object
                required: [user, seq, activation_email_sent]
                properties:
                  user: {$ref: "#/components/schemas/AccountsUser"}
                  seq: {type: integer}
                  activation_email_sent: {type: boolean, description: "false khi Keycloak không gửi được email — gửi lại bằng /resend-actions"}
        "403": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
  /v1/accounts/users/import:
    post:
      summary: Nhập tài khoản hàng loạt từ CSV (UTF-8) hoặc Excel .xlsx (trang tính đầu), tối đa 200 dòng; kết quả theo dòng
      description: |
        Cột (tiêu đề không phân biệt hoa thường, bỏ dấu): email; full_name|ho_ten (hoặc first_name|ten + last_name|ho);
        org_ref|ma_to_chuc (UUID tổ chức pf/party); roles|vai_tro (phân tách , ; |); tùy chọn username|ten_dang_nhap, phone|so_dien_thoai|sdt.
        Thiếu cột bắt buộc → từ chối cả tệp (accounts.import_invalid). Dòng lỗi bị loại kèm lý do ("Thiếu Email", "Sai định dạng Email",
        "Sai định dạng vai trò", "SĐT đã tồn tại", "Trùng với dòng N trong tệp"…), dòng hợp lệ được tạo và nhận liên kết kích hoạt.
      operationId: accountsImportUsers
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          text/csv:
            schema: {type: string}
          application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
            schema: {type: string, format: binary}
      responses:
        "200":
          description: Kết quả theo dòng
          content:
            application/json:
              schema:
                type: object
                required: [created, rejected, rows]
                properties:
                  created: {type: integer}
                  rejected: {type: integer}
                  rows:
                    type: array
                    items:
                      type: object
                      required: [row, status, reason, user_id, activation_email_sent]
                      properties:
                        row: {type: integer, description: "Số dòng trong tệp (dòng 1 là tiêu đề)"}
                        status: {type: string, enum: [created, rejected]}
                        reason: {type: [string, "null"], description: "Không chứa dữ liệu cá nhân"}
                        user_id: {type: [string, "null"], format: uuid}
                        activation_email_sent: {type: boolean}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/accounts/users/bulk:
    post:
      summary: Thao tác loạt (KN US-ADM-03) — khóa, mở khóa hoặc gửi lại liên kết cho tối đa 100 tài khoản; kết quả theo từng tài khoản
      operationId: accountsBulk
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, user_ids]
              properties:
                action: {type: string, enum: [lock, unlock, resend]}
                user_ids: {type: array, minItems: 1, maxItems: 100, items: {type: string, format: uuid}}
                reason: {type: string, minLength: 20, description: "Bắt buộc với lock/unlock"}
      responses:
        "200":
          description: Kết quả
          content:
            application/json:
              schema:
                type: object
                required: [succeeded, failed, items]
                properties:
                  succeeded: {type: integer}
                  failed: {type: integer}
                  items:
                    type: array
                    items:
                      type: object
                      required: [user_id, ok, replayed, code, detail]
                      properties:
                        user_id: {type: string, format: uuid}
                        ok: {type: boolean}
                        replayed: {type: boolean}
                        code: {type: [string, "null"], description: "Mã lỗi docs/errors.md"}
                        detail: {type: [string, "null"]}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/accounts/users/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}, description: "id người dùng Keycloak"}
    get:
      summary: Chi tiết tài khoản (vai đọc thẳng từ Keycloak)
      operationId: accountsGetUser
      responses:
        "200":
          description: Tài khoản
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AccountsUser"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/accounts/users/{id}/events:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      summary: Nhật ký thao tác (sổ chỉ ghi thêm — ai, lúc nào, lý do; US-HTXSTATUS-03)
      operationId: accountsUserEvents
      responses:
        "200":
          description: Theo seq tăng dần
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/AccountsEvent"}}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/accounts/users/{id}/lock:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      summary: Khóa tài khoản (enabled=false) và thu hồi mọi phiên — lý do ≥ 20 ký tự; phát pf.accounts.user.locked
      operationId: accountsLock
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/AccountsReason"
      responses:
        "200": {$ref: "#/components/responses/AccountsChanged"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/accounts/users/{id}/unlock:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      summary: Mở khóa — lý do ≥ 20 ký tự; tổ chức đang vô hiệu hóa → 409 accounts.org_inactive; phát pf.accounts.user.unlocked
      operationId: accountsUnlock
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/AccountsReason"
      responses:
        "200": {$ref: "#/components/responses/AccountsChanged"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/accounts/users/{id}/resend-actions:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      summary: Gửi lại liên kết một lần — mặc định các required action đang chờ; không còn → UPDATE_PASSWORD (đặt lại mật khẩu, không mật khẩu tạm)
      operationId: accountsResendActions
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                actions: {type: array, items: {type: string, enum: [VERIFY_EMAIL, UPDATE_PASSWORD, CONFIGURE_TOTP]}}
      responses:
        "200":
          description: Đã gửi; ghi sổ actions_sent
          content:
            application/json:
              schema:
                type: object
                required: [account, activation_email_sent, replayed]
                properties:
                  account: {$ref: "#/components/schemas/AccountsAccount"}
                  activation_email_sent: {type: boolean}
                  replayed: {type: boolean}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "502": {$ref: "#/components/responses/Problem"}
  /v1/accounts/users/{id}/assignment:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      summary: Đổi đơn vị công tác và/hoặc vai (roles là tập đầy đủ vai do module quản lý); thêm vai [MFA] khi chưa có OTP → CONFIGURE_TOTP
      operationId: accountsAssign
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                org_ref: {type: string, format: uuid}
                roles: {type: array, minItems: 1, items: {type: string}}
      responses:
        "200": {$ref: "#/components/responses/AccountsChanged"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  # --- hết pf/accounts ---

  # --- pf/reports: mẫu biểu (reports_admin, masterdata_admin hoặc platform_admin — CGH FN-10 BR-03) và lịch gửi định kỳ (US-DASH-03) ---
  /v1/reports/templates:
    get:
      summary: Mọi mẫu (mẫu hệ thống + phiên bản mới nhất của tenant, kể cả đã ngừng dùng)
      operationId: adminListReportTemplates
      tags: [reports]
      responses:
        "200":
          description: Danh sách
          content:
            application/json:
              schema: {type: object, required: [items], properties: {items: {type: array, items: {$ref: "#/components/schemas/ReportTemplate"}}}}
        "403": {$ref: "#/components/responses/Problem"}
    post:
      summary: Tạo phiên bản mới của mẫu (việc xuất cũ giữ ảnh chụp phiên bản cũ)
      operationId: saveReportTemplate
      tags: [reports]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, definition]
              properties:
                key: {type: string, pattern: "^[a-z][a-z0-9_.]{2,63}$"}
                definition: {$ref: "#/components/schemas/ReportDefinition"}
      responses:
        "201":
          description: Phiên bản mới
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ReportTemplate"}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/reports/templates/{key}/versions:
    get:
      summary: Lịch sử phiên bản của mẫu (mới nhất trước; mẫu hệ thống là phiên bản 0)
      operationId: listReportTemplateVersions
      tags: [reports]
      parameters:
        - {name: key, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: Phiên bản
          content:
            application/json:
              schema: {type: object, required: [items], properties: {items: {type: array, items: {$ref: "#/components/schemas/ReportTemplate"}}}}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/reports/templates/{key}/retire:
    post:
      summary: Ngừng dùng mẫu kèm lý do (phiên bản mới trạng thái retired; không xóa)
      operationId: retireReportTemplate
      tags: [reports]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - {name: key, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [reason], properties: {reason: {type: string, minLength: 10, maxLength: 500}}}
      responses:
        "201":
          description: Đã ngừng dùng
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ReportTemplate"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
  /v1/reports/schedules:
    get:
      summary: Lịch gửi người gọi được xem (người lập hoặc phạm vi bao trọn)
      operationId: listReportSchedules
      tags: [reports]
      responses:
        "200":
          description: Danh sách
          content:
            application/json:
              schema: {type: object, required: [items], properties: {items: {type: array, items: {$ref: "#/components/schemas/ReportSchedule"}}}}
        "403": {$ref: "#/components/responses/Problem"}
    post:
      summary: Lập lịch gửi báo cáo (tuần/tháng, giờ Việt Nam). Người nhận là actor_ref — email tra lúc gửi, không lưu
      operationId: createReportSchedule
      tags: [reports]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [template_key, format, frequency, hour, recipients]
              properties:
                template_key: {type: string}
                format: {type: string, enum: [xlsx, pdf]}
                unit_code: {type: string}
                params: {type: object, description: "Như ReportParams của Application API; kỳ tính theo mốc (tháng: tháng trước; tuần: tháng đang chạy)"}
                frequency: {type: string, enum: [weekly, monthly]}
                weekday: {type: integer, minimum: 1, maximum: 7, description: "weekly: 1 = thứ Hai"}
                day_of_month: {type: integer, minimum: 1, maximum: 28, description: "monthly"}
                hour: {type: integer, minimum: 0, maximum: 23}
                recipients: {type: array, minItems: 1, maxItems: 50, items: {type: string, format: uuid}}
      responses:
        "201":
          description: Đã lập lịch
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ReportSchedule"}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/reports/schedules/{id}/deactivate:
    post:
      summary: Ngừng lịch kèm lý do (không xóa; lịch sử chạy giữ nguyên)
      operationId: deactivateReportSchedule
      tags: [reports]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [reason], properties: {reason: {type: string, minLength: 10, maxLength: 500}}}
      responses:
        "200":
          description: Lịch
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ReportSchedule"}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/reports/schedules/{id}/runs:
    get:
      summary: Các lần chạy của lịch — mỗi mốc (tuần ISO / tháng) đúng một lần, kèm kết quả gửi email
      operationId: listReportScheduleRuns
      tags: [reports]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Lần chạy
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [slot_key, slot_at, status, fired_at]
                      properties:
                        slot_key: {type: string, examples: [2026-W40, 2026-10]}
                        slot_at: {type: string, format: date-time}
                        status: {type: string, enum: [queued, skipped]}
                        skip_reason: {type: [string, "null"]}
                        job_id: {type: [string, "null"], format: uuid}
                        fired_at: {type: string, format: date-time}
                        delivery_status: {type: [string, "null"], enum: [sent, skipped, failed, null]}
                        delivery_note: {type: [string, "null"]}
                        sent_count: {type: [integer, "null"]}
                        delivered_at: {type: [string, "null"], format: date-time}
        "404": {$ref: "#/components/responses/Problem"}
  # --- hết pf/reports ---

  # --- pf/waterway: mạng đường thủy có phiên bản (mục 16; GIS FN-09, US-WATER-02/03). waterway_editor vẽ/sửa/dựng, waterway_publisher phát hành (≠ người dựng, R-56) ---
  /v1/waterway/segments:
    post:
      summary: Vẽ mới tuyến sông/kênh (kể cả nhánh rẽ) — GIS US-WATER-02, BR-39
      description: |
        Vai waterway_editor. Chiều dài do hệ thống tính (geodesic) — `length_m` gửi lên bị bỏ qua (AC-1).
        Thiếu tên/phân loại hoặc số đo ≤ 0/sai định dạng → 422 với thông báo AC-2. Tuyến `draft` không bao giờ vào đồ thị.
      operationId: createWaterwaySegment
      tags: [waterway]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/WaterwaySegmentInput"}
      responses:
        "201":
          description: Bản sửa số 1 đã ghi
          headers:
            Location: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/WaterwaySegment"}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
    get:
      summary: Bản hiện hành của các đoạn (kể cả nháp) — vai waterway_editor, waterway_publisher hoặc platform_admin
      operationId: listWaterwaySegments
      tags: [waterway]
      parameters:
        - {name: status, in: query, schema: {type: string, enum: [draft, confirmed, retired]}}
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Một trang (theo segment_ref)
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/WaterwaySegment"}}
                  next_cursor: {type: [string, "null"]}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/waterway/segments/{ref}:
    get:
      summary: Một đoạn — bản hiện hành và toàn bộ lịch sử sửa
      operationId: getWaterwaySegment
      tags: [waterway]
      parameters:
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Đoạn
          content:
            application/json:
              schema:
                type: object
                required: [head, history]
                properties:
                  head: {$ref: "#/components/schemas/WaterwaySegment"}
                  history: {type: array, items: {$ref: "#/components/schemas/WaterwaySegment"}}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/waterway/segments/{ref}/revisions:
    post:
      summary: Sửa tuyến (kéo/thêm/xóa điểm, thuộc tính, xác nhận, ngừng dùng) — GIS US-WATER-03, BR-40
      description: |
        Bản ghi bù (RB-1): thay toàn bộ nội dung, trỏ về bản trước, bắt buộc `reason` và `expected_revision` = số sửa hiện hành
        (khác → 409 waterway.revision_conflict). Thay đổi vào lớp bản đồ dùng chung sau khi dựng và phát hành phiên bản mạng mới.
      operationId: reviseWaterwaySegment
      tags: [waterway]
      parameters:
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/WaterwaySegmentInput"
                - $ref: "#/components/schemas/WaterwayRevision"
      responses:
        "201":
          description: Bản sửa mới
          content:
            application/json:
              schema: {$ref: "#/components/schemas/WaterwaySegment"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/waterway/structures:
    post:
      summary: Ghi công trình vượt sông (cầu, cống, âu thuyền, đường dây điện) gắn với một đoạn
      description: Vai waterway_editor. Vị trí phải cách tuyến ≤ waterway.structure_max_offset_m (mặc định 500 m).
      operationId: createWaterwayStructure
      tags: [waterway]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/WaterwayStructureInput"}
      responses:
        "201":
          description: Công trình đã ghi
          content:
            application/json:
              schema: {$ref: "#/components/schemas/WaterwayStructure"}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
    get:
      summary: Bản hiện hành của công trình, lọc theo đoạn
      operationId: listWaterwayStructures
      tags: [waterway]
      parameters:
        - {name: segment_ref, in: query, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Một trang
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/WaterwayStructure"}}
                  next_cursor: {type: [string, "null"]}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/waterway/structures/{ref}/revisions:
    post:
      summary: Sửa công trình (bản ghi bù; ngừng dùng = status retired)
      operationId: reviseWaterwayStructure
      tags: [waterway]
      parameters:
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/WaterwayStructureInput"
                - $ref: "#/components/schemas/WaterwayRevision"
      responses:
        "201":
          description: Bản sửa mới
          content:
            application/json:
              schema: {$ref: "#/components/schemas/WaterwayStructure"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/waterway/networks/builds:
    post:
      summary: Yêu cầu dựng phiên bản mạng (R-52 — 202 + job, worker dựng)
      description: |
        Vai waterway_editor. Tham số dựng (snap 25 m, nối tự động 150 m, báo cáo 1 km, nối chữ T 20 m, biên an toàn,
        lớp phương tiện) chốt lúc yêu cầu; worker dựng từ các đoạn ĐÃ XÁC NHẬN tại `requested_at` — tất định.
        Tập đoạn trùng một phiên bản built/published → job hoàn tất với `reused = true`, không tạo phiên bản mới.
      operationId: requestWaterwayBuild
      tags: [waterway]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Job đã nhận
          headers:
            Location: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/WaterwayBuild"}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/waterway/networks/builds/{id}:
    get:
      summary: Trạng thái job dựng
      operationId: getWaterwayBuild
      tags: [waterway]
      parameters:
        - $ref: "#/components/parameters/VersionID"
      responses:
        "200":
          description: Job
          content:
            application/json:
              schema: {$ref: "#/components/schemas/WaterwayBuild"}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/waterway/networks:
    get:
      summary: Phiên bản mạng, mới → cũ
      operationId: listWaterwayNetworks
      tags: [waterway]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Một trang
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/WaterwayNetworkVersion"}}
                  next_cursor: {type: [string, "null"]}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/waterway/networks/{version}:
    get:
      summary: Một phiên bản mạng
      operationId: getWaterwayNetwork
      tags: [waterway]
      parameters:
        - {name: version, in: path, required: true, schema: {type: integer, minimum: 1}}
      responses:
        "200":
          description: Phiên bản
          content:
            application/json:
              schema: {$ref: "#/components/schemas/WaterwayNetworkVersion"}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/waterway/networks/{version}/publish:
    post:
      summary: Phát hành phiên bản mạng — vai waterway_publisher, KHÁC người dựng (R-56)
      description: |
        Phiên bản đang phát hành chuyển sang `superseded` (giữ nguyên, vẫn định tuyến được khi ghim `version`);
        chỉ một phiên bản có hiệu lực. Phát sự kiện pf.waterway.network.published.
      operationId: publishWaterwayNetwork
      tags: [waterway]
      parameters:
        - {name: version, in: path, required: true, schema: {type: integer, minimum: 1}}
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Phiên bản đã phát hành
          content:
            application/json:
              schema: {$ref: "#/components/schemas/WaterwayNetworkVersion"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
  /v1/waterway/networks/{version}/findings:
    get:
      summary: Phát hiện khi dựng (giao cắt, nối chữ T, khe hở đã nối/chỉ báo cáo, đầu treo, tuyến cô lập)
      operationId: listWaterwayFindings
      tags: [waterway]
      parameters:
        - {name: version, in: path, required: true, schema: {type: integer, minimum: 1}}
        - {name: kind, in: query, schema: {type: string, enum: [crossing, t_join, gap_joined, gap_reported, dangling, isolated]}}
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Một trang (theo id)
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/WaterwayFinding"}}
                  next_cursor: {type: [string, "null"]}
        "404": {$ref: "#/components/responses/Problem"}
  # --- hết pf/waterway ---

  # --- pf/cropcycle: soạn / phát hành SOP (HTX US-CAT-01, US-CAT-03), dựng lại bảng chiếu ---
  /v1/cropcycle/sops:
    get:
      summary: Mọi mẫu SOP, kể cả nháp (sop_admin, param_approver, platform_admin)
      operationId: adminListCropSOPs
      parameters:
        - {name: status, in: query, schema: {type: string, enum: [draft, published, retired]}}
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        "200":
          description: Một trang
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/CropSOPTemplate"}}
                  next_cursor: {type: [string, "null"]}
        "403": {$ref: "#/components/responses/Problem"}
    post:
      summary: Tạo mẫu SOP với bản nháp phiên bản 1 (sop_admin)
      operationId: createCropSOP
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name, steps]
              properties:
                code: {type: string, pattern: "^[A-Z0-9][A-Z0-9_.-]{1,39}$"}
                name: {type: string, maxLength: 200, description: "Duy nhất (không phân biệt hoa thường, khoảng trắng)"}
                crop: {type: string, default: lua}
                scope: {type: string, enum: [system, htx], default: system}
                cooperative_ref: {type: [string, "null"], format: uuid}
                standard: {type: string}
                description: {type: string, maxLength: 2000}
                steps: {type: array, maxItems: 100, items: {$ref: "#/components/schemas/CropSOPStep"}}
                change_note: {type: string}
      responses:
        "201": {description: Đã tạo, content: {application/json: {schema: {$ref: "#/components/schemas/CropSOP"}}}}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/cropcycle/sops/{ref}:
    get:
      summary: Mẫu SOP kèm mọi phiên bản
      operationId: adminGetCropSOP
      parameters:
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200": {description: Mẫu, content: {application/json: {schema: {$ref: "#/components/schemas/CropSOP"}}}}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/cropcycle/sops/{ref}/versions:
    post:
      summary: Tạo bản nháp phiên bản mới (steps bỏ trống = chép phiên bản mới nhất)
      operationId: newCropSOPVersion
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                steps: {type: [array, "null"], items: {$ref: "#/components/schemas/CropSOPStep"}}
                change_note: {type: string}
      responses:
        "201": {description: Đã tạo, content: {application/json: {schema: {$ref: "#/components/schemas/CropSOP"}}}}
        "409": {$ref: "#/components/responses/Problem"}
  /v1/cropcycle/sops/{ref}/clone:
    post:
      summary: Nhân bản mẫu SOP giữ nguyên bước và thứ tự (HTX US-CAT-03)
      operationId: cloneCropSOP
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string}
                code: {type: string, description: "Bỏ trống → tự sinh"}
                scope: {type: string, enum: [system, htx]}
                cooperative_ref: {type: [string, "null"], format: uuid}
      responses:
        "201": {description: Bản sao (nháp), content: {application/json: {schema: {$ref: "#/components/schemas/CropSOP"}}}}
        "409": {$ref: "#/components/responses/Problem"}
  /v1/cropcycle/sops/{ref}/retire:
    post:
      summary: Ngừng dùng mẫu (không xóa; vụ đã ghim giữ phiên bản)
      operationId: retireCropSOP
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string, minLength: 10}
      responses:
        "200": {description: Đã ngừng dùng, content: {application/json: {schema: {$ref: "#/components/schemas/CropSOP"}}}}
        "409": {$ref: "#/components/responses/Problem"}
  /v1/cropcycle/sop-versions/{id}:
    get:
      summary: Một phiên bản SOP (kể cả nháp)
      operationId: adminGetCropSOPVersion
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Phiên bản
          content:
            application/json:
              schema:
                type: object
                required: [version, template]
                properties:
                  version: {$ref: "#/components/schemas/CropSOPVersion"}
                  template: {$ref: "#/components/schemas/CropSOPTemplate"}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/cropcycle/sop-versions/{id}/steps:
    post:
      summary: Thay bước của bản nháp (bản đã phát hành bất biến → 409 cropcycle.sop_state)
      operationId: updateCropSOPDraft
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [steps]
              properties:
                steps: {type: array, items: {$ref: "#/components/schemas/CropSOPStep"}}
                change_note: {type: string}
      responses:
        "200": {description: Đã sửa, content: {application/json: {schema: {$ref: "#/components/schemas/CropSOP"}}}}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/cropcycle/sop-versions/{id}/publish:
    post:
      summary: Phát hành bản nháp — param_approver khác người soạn (R-56); phải có bước thu hoạch
      operationId: publishCropSOP
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200": {description: Đã phát hành (phát pf.cropcycle.sop.published), content: {application/json: {schema: {$ref: "#/components/schemas/CropSOP"}}}}
        "403": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/cropcycle/variety-bindings:
    post:
      summary: Gắn giống lúa với mẫu SOP hệ thống đã ban hành (thay gắn cũ, không xóa)
      operationId: bindCropVariety
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [variety_code, template_ref]
              properties:
                variety_code: {type: string}
                template_ref: {type: string, format: uuid}
                note: {type: string, maxLength: 500}
      responses:
        "200": {description: Gắn hiện hành, content: {application/json: {schema: {$ref: "#/components/schemas/CropVarietyBinding"}}}}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/cropcycle/projections/rebuild:
    post:
      summary: Dựng lại bảng chiếu season_current, farm_log_current, coop_season_area, yield_summary từ sổ (R-22, platform_admin)
      operationId: rebuildCropProjections
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Số dòng đã dựng lại
          content:
            application/json:
              schema:
                type: object
                required: [seasons, farm_logs, coop_season_areas]
                properties:
                  seasons: {type: integer}
                  farm_logs: {type: integer}
                  coop_season_areas: {type: integer}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/cropcycle/stats/cooperatives/{ref}:
    get:
      summary: Số vụ đang mở và nhật ký chờ duyệt của một HTX — cảnh báo trong hộp thoại vô hiệu hóa HTX (registry_admin, platform_admin)
      description: HTX không có hoạt động (hoặc không thuộc tenant) → 0 / 0. Không có dữ liệu cá nhân.
      operationId: getCropCooperativeStats
      parameters:
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Số liệu
          content:
            application/json:
              schema:
                type: object
                required: [cooperative_ref, open_seasons, pending_logs]
                properties:
                  cooperative_ref: {type: string, format: uuid}
                  open_seasons: {type: integer}
                  pending_logs: {type: integer}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
  # --- hết pf/cropcycle ---
components:
  securitySchemes:
    oidc:
      type: openIdConnect
      openIdConnectUrl: https://auth.agrigreen.vn/realms/agrigreen/.well-known/openid-configuration
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, pattern: "^[A-Za-z0-9._:-]{8,200}$"}
    Catalog:
      name: catalog
      in: path
      required: true
      schema: {type: string, enum: [rice_variety, farm_stage, machine_type, season, pest]}
    ItemCode:
      name: code
      in: path
      required: true
      schema: {type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]{0,39}$"}
    VersionID:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
    Cursor:
      name: cursor
      in: query
      schema: {type: string}
    Limit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 200, default: 50}
  responses:
    Problem:
      description: RFC 9457
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    GeoFacilityWritten:
      description: Kho/Hub sau khi ghi và dòng sổ vừa ghi (hình dạng như GET /v1/geo/facilities/{ref} của Application API)
      headers:
        Location: {schema: {type: string}}
      content:
        application/json:
          schema:
            type: object
            required: [facility, event]
            properties:
              facility: {type: object, description: "GeoJSON Feature (điểm marker) — xem GeoFacilityFeature ở application.yaml"}
              event: {type: object, description: "Dòng sổ facility_event — xem GeoFacilityEvent ở application.yaml"}
    GeoCapacityWritten:
      description: Dòng sổ sức chứa vừa ghi và sức chứa hiệu lực sau đó (BR-52)
      content:
        application/json:
          schema:
            type: object
            required: [snapshot, capacity]
            properties:
              snapshot: {type: object, description: "Xem GeoCapacitySnapshot ở application.yaml"}
              capacity: {type: object, description: "Xem GeoCapacityView ở application.yaml (source, fill_pct, class, sync_differs, pending_sync)"}
    GeoRoadWritten:
      description: Tuyến sau khi ghi và phiên bản vừa ghi
      headers:
        Location: {schema: {type: string}}
      content:
        application/json:
          schema:
            type: object
            required: [road, segment]
            properties:
              road: {type: object, description: "GeoJSON Feature LineString — xem GeoRoadFeature ở application.yaml"}
              segment: {type: object, description: "Xem GeoRoadSegment ở application.yaml"}
    PartyOrgChanged:
      description: Trạng thái sau biến động và dòng sổ vừa ghi
      content:
        application/json:
          schema:
            type: object
            required: [org, event, active_households]
            properties:
              org: {$ref: "#/components/schemas/PartyOrg"}
              event: {$ref: "#/components/schemas/PartyOrgEvent"}
              active_households: {type: integer, description: "Số nông hộ đang là thành viên (cảnh báo phạm vi ảnh hưởng khi vô hiệu hóa)"}
    ContentDocumentVersion:
      description: Tài liệu và một phiên bản (phiên bản vừa ghi, vừa xuất bản hoặc được xem trước)
      content:
        application/json:
          schema:
            type: object
            required: [document, version]
            properties:
              document: {$ref: "#/components/schemas/ContentAdminDocument"}
              version: {$ref: "#/components/schemas/ContentVersion"}
    ContentDocumentState:
      description: Trạng thái tài liệu sau chuyển trạng thái
      content:
        application/json:
          schema:
            type: object
            required: [document]
            properties:
              document: {$ref: "#/components/schemas/ContentAdminDocument"}
    MechOwnerChanged:
      description: Chủ sở hữu sau biến động, dòng sổ vừa ghi và máy bị vô hiệu hóa kèm (nếu có)
      content:
        application/json:
          schema:
            type: object
            required: [owner, event, deactivated_machines]
            properties:
              owner: {$ref: "#/components/schemas/MechOwner"}
              event: {$ref: "#/components/schemas/MechOwnerEvent"}
              deactivated_machines: {type: array, items: {$ref: "#/components/schemas/MechMachine"}}
    MechMachineChanged:
      description: Máy sau biến động và dòng sổ vừa ghi
      content:
        application/json:
          schema:
            type: object
            required: [machine, event]
            properties:
              machine: {$ref: "#/components/schemas/MechMachine"}
              event: {$ref: "#/components/schemas/MechMachineEvent"}
    MechAreaChanged:
      description: Diện tích vụ sau biến động và dòng sổ vừa ghi
      content:
        application/json:
          schema:
            type: object
            required: [area, event]
            properties:
              area: {$ref: "#/components/schemas/MechSeasonArea"}
              event: {type: object}
    AccountsChanged:
      description: Trạng thái tài khoản sau thao tác và seq dòng sổ vừa ghi
      content:
        application/json:
          schema:
            type: object
            required: [account, seq, replayed]
            properties:
              account: {$ref: "#/components/schemas/AccountsAccount"}
              seq: {type: integer}
              replayed: {type: boolean}
  schemas:
    # --- pf/reports ---
    ReportDefinition:
      type: object
      required: [title, source, grouping, columns, formats]
      properties:
        title: {type: string, minLength: 5, maxLength: 200}
        source:
          type: string
          enum: [extension.sowing, extension.growth_pest, extension.program_progress, extension.tasks_sla, extension.period_summary, mechanization.summary, mechanization.shortage_by_coop, mechanization.season_compare]
        grouping: {type: string, enum: [national, province, commune, cooperative]}
        columns:
          type: array
          minItems: 1
          maxItems: 40
          items: {type: object, required: [key], properties: {key: {type: string}, title: {type: string}}}
        formats: {type: array, items: {type: string, enum: [xlsx, pdf]}}
        provisional_layout: {type: boolean}
        form_note: {type: string, maxLength: 500}
    ReportTemplate:
      type: object
      required: [key, version, builtin, status, definition]
      properties:
        key: {type: string}
        version: {type: integer, minimum: 0}
        builtin: {type: boolean}
        status: {type: string, enum: [active, retired]}
        definition: {$ref: "#/components/schemas/ReportDefinition"}
        reason: {type: [string, "null"]}
        created_by: {type: [string, "null"], format: uuid}
        created_at: {type: [string, "null"], format: date-time}
    ReportSchedule:
      type: object
      required: [id, template_key, format, params, frequency, hour, recipients, owner_ref, active, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        template_key: {type: string}
        format: {type: string, enum: [xlsx, pdf]}
        unit_code: {type: [string, "null"]}
        params: {type: object}
        frequency: {type: string, enum: [weekly, monthly]}
        weekday: {type: [integer, "null"]}
        day_of_month: {type: [integer, "null"]}
        hour: {type: integer}
        recipients: {type: array, items: {type: string, format: uuid}}
        owner_ref: {type: string, format: uuid}
        active: {type: boolean}
        deactivated_reason: {type: [string, "null"]}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    # --- hết pf/reports ---

    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: {type: string, format: uri}
        title: {type: string}
        status: {type: integer}
        code: {type: string}
        detail: {type: string}
        instance: {type: string}
        trace_id: {type: string}
        errors:
          type: array
          items:
            type: object
            properties:
              field: {type: string}
              reason: {type: string}
    GazetteerFile:
      type: object
      required: [format, source, units]
      additionalProperties: false
      properties:
        format: {type: string, const: agrigreen.admin_units/v1}
        source: {type: string, maxLength: 300, description: "Nguồn dữ liệu (văn bản, tệp gốc)"}
        note: {type: string}
        units:
          type: array
          minItems: 1
          maxItems: 5000
          items:
            type: object
            required: [code, name, level, valid_from]
            additionalProperties: false
            properties:
              code: {type: string, pattern: "^[0-9A-Z][0-9A-Z.-]{0,39}$"}
              name: {type: string, maxLength: 200}
              level: {type: string, enum: [province, commune, district], description: "district chỉ cho dữ liệu lịch sử, valid_to ≤ 2025-07-01"}
              parent_code: {type: string}
              valid_from: {type: string, format: date}
              valid_to: {type: string, format: date, description: "Không bao gồm; bỏ trống = còn hiệu lực"}
              successors: {type: array, items: {type: string}, description: "Đơn vị kế thừa, phải có hiệu lực tại valid_to"}
    ImportResult:
      type: object
      required: [created, closed, unchanged]
      properties:
        created: {type: integer}
        closed: {type: integer}
        unchanged: {type: integer}
    CatalogItemInput:
      type: object
      required: [name]
      properties:
        code: {type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]{0,39}$", description: "Bắt buộc khi thêm; khi sửa bỏ trống hoặc trùng mã trên đường dẫn"}
        name: {type: string, maxLength: 200}
        attrs:
          type: object
          additionalProperties: {type: string}
          description: |
            Theo danh mục — rice_variety: growth_days, expected_yield_t_per_ha (decimal); farm_stage: pilot (true|false, cờ thí điểm CGH), description;
            machine_type: farm_stage (mã khâu đang dùng); season: start_month, end_month; pest: kind (sau_hai|benh_hai|dong_vat_hai|co_dai).
    CatalogItem:
      type: object
      required: [catalog, code, name, attrs, active, deactivation_reason, revision, updated_at]
      properties:
        catalog: {type: string}
        code: {type: string}
        name: {type: string}
        attrs: {type: object, additionalProperties: {type: string}}
        active: {type: boolean}
        deactivation_reason: {type: [string, "null"]}
        revision: {type: integer}
        updated_at: {type: string, format: date-time}
    ReasonInput:
      type: object
      properties:
        reason: {type: string, minLength: 10, maxLength: 500}
    CatalogSnapshot:
      type: object
      properties:
        name: {type: string}
        attrs: {type: object, additionalProperties: {type: string}}
        active: {type: boolean}
        deactivation_reason: {type: string}
    CatalogChange:
      type: object
      required: [id, action, before, after, reason, event_time, actor_ref, seq, recorded_at]
      properties:
        id: {type: string, format: uuid}
        action: {type: string, enum: [created, updated, deactivated, reactivated]}
        before: {oneOf: [{$ref: "#/components/schemas/CatalogSnapshot"}, {type: "null"}]}
        after: {$ref: "#/components/schemas/CatalogSnapshot"}
        reason: {type: [string, "null"]}
        event_time: {type: string, format: date-time}
        actor_ref: {type: string, format: uuid}
        seq: {type: integer}
        recorded_at: {type: string, format: date-time}
    ParamProposal:
      type: object
      required: [key, effective_from, source_doc]
      properties:
        key: {type: string, maxLength: 200, pattern: "^[a-z][a-z0-9_]*(\\.[a-z0-9_]+)+(:[A-Za-z0-9_.-]+)*$", examples: ["cgh.norm_ha_per_machine:MGD:thu_hoach"]}
        value: {type: [string, number], description: "Số thập phân (chuỗi khuyến nghị); đọc thẳng thành decimal, không qua float. Loại trừ với text."}
        text: {type: string, maxLength: 1000}
        unit: {type: string, maxLength: 30}
        effective_from: {type: string, description: "RFC 3339, hoặc YYYY-MM-DD = 00:00 giờ Việt Nam"}
        source_doc: {type: string, maxLength: 300, description: "Số/ngày văn bản ban hành (bắt buộc — CGH FN-02 B3)"}
        correction_reason: {type: string, minLength: 10}
    ParamVersion:
      type: object
      required: [id, key, version, value, text, unit, effective_from, source_doc, status, setter_ref, created_at]
      properties:
        id: {type: string, format: uuid}
        key: {type: string}
        version: {type: integer, minimum: 1}
        value: {type: [string, "null"]}
        text: {type: [string, "null"]}
        unit: {type: string}
        effective_from: {type: string, format: date-time}
        source_doc: {type: string}
        correction_reason: {type: [string, "null"]}
        status: {type: string, enum: [draft, submitted, approved, rejected]}
        setter_ref: {type: string, format: uuid}
        submitted_at: {type: [string, "null"], format: date-time}
        approver_ref: {type: [string, "null"], format: uuid}
        decided_at: {type: [string, "null"], format: date-time}
        decision_note: {type: [string, "null"]}
        created_at: {type: string, format: date-time}
        setter_name: {type: [string, "null"], description: "G-07: tên cán bộ đặt (danh bạ pf/extension)"}
        approver_name: {type: [string, "null"], description: "G-07: tên cán bộ duyệt"}
    DecisionInput:
      type: object
      properties:
        note: {type: string, maxLength: 500, description: "Bắt buộc (≥ 10 ký tự) khi từ chối"}
    # --- pf/geo G2 ---

    GeoDecimal:
      description: Số thập phân (chuỗi hoặc số JSON); sai định dạng → thông báo nghiệp vụ tương ứng
      oneOf:
        - {type: string, pattern: "^-?[0-9]+(\\.[0-9]+)?$"}
        - {type: number}
    GeoReason:
      type: object
      required: [reason]
      properties:
        reason: {type: string, minLength: 10}
    GeoFacilityInput:
      type: object
      description: Tạo — name, capacity, province_code, commune_code ("địa chỉ" là đơn vị hành chính; không lưu địa chỉ chữ ngoài vault, R-04) và point hoặc polygon bắt buộc. Sửa — trường bỏ trống giữ nguyên.
      properties:
        ref: {type: string, format: uuid, description: "UUIDv7; bỏ trống → server sinh"}
        kind: {type: string, enum: [kho, hub, nha_may]}
        code: {type: string, pattern: "^[0-9A-Za-z][0-9A-Za-z._-]{0,39}$", description: "Bỏ trống → sinh từ loại + ref"}
        name: {type: string, maxLength: 200}
        point: {type: object, description: "GeoJSON Point WGS84 (marker)"}
        polygon: {type: object, description: "GeoJSON Polygon/MultiPolygon WGS84 (khuôn viên); không có point → marker là điểm trong vùng"}
        province_code: {type: string}
        commune_code: {type: string}
        capacity: {$ref: "#/components/schemas/GeoDecimal"}
        unit: {type: string, enum: [tan, m3, ke], default: tan}
        event_time: {type: string, format: date-time}
        device_id: {type: string}
    GeoCapacityInput:
      type: object
      required: [capacity, used]
      properties:
        capacity: {$ref: "#/components/schemas/GeoDecimal"}
        used: {$ref: "#/components/schemas/GeoDecimal"}
        unit: {type: string, enum: [tan, m3, ke], description: "Mặc định đơn vị của cơ sở"}
        as_of: {type: string, format: date-time, description: "Thời điểm số liệu; mặc định hiện tại"}
        supersedes_id: {type: string, format: uuid, description: "Sửa một ảnh chụp đã nhập (kèm correction_reason)"}
        correction_reason: {type: string, minLength: 10}
    GeoRoadInput:
      type: object
      description: Tạo — name, road_class, max_load_tons, geometry, province_code bắt buộc. Sửa — trường bỏ trống giữ nguyên.
      properties:
        ref: {type: string, format: uuid}
        name: {type: string, maxLength: 200}
        road_class: {type: string, enum: [quoc_lo, tinh_lo, huyen_lo, truc_xa, bo_ruong]}
        max_load_tons: {$ref: "#/components/schemas/GeoDecimal"}
        geometry: {type: object, description: "GeoJSON LineString WGS84, ≥ 2 điểm phân biệt"}
        province_code: {type: string}
        event_time: {type: string, format: date-time}
        device_id: {type: string}
    # --- hết pf/geo G2 ---

    PartyOrg:
      type: object
      required: [ref, kind, code, name, admin_unit_code, parent_ref, representative_ref, active]
      properties:
        ref: {type: string, format: uuid}
        kind: {type: string, enum: [ttkn_national, ttkn_province, extension_team, dcrd, cooperative, mkg, partner]}
        code: {type: string}
        name: {type: string}
        admin_unit_code: {type: [string, "null"]}
        parent_ref: {type: [string, "null"], format: uuid}
        representative_ref: {type: [string, "null"], format: uuid}
        active: {type: boolean}
    PartyOrgInput:
      type: object
      required: [kind, name]
      properties:
        kind: {type: string, enum: [ttkn_national, ttkn_province, extension_team, dcrd, cooperative, mkg, partner]}
        code: {type: string, maxLength: 40, description: "Bắt buộc trừ HTX; HTX không được gửi (Mã HTX tự sinh)"}
        name: {type: string, maxLength: 200}
        admin_unit_code: {type: string, description: "Tỉnh với ttkn_province; xã với extension_team và cooperative"}
        parent_ref: {type: string, format: uuid}
        representative_ref: {type: string, format: uuid, description: "Mã tham chiếu đã có trong kho định danh"}
        representative:
          type: object
          description: Hoặc gửi định danh người đại diện — chuyển thẳng vào kho định danh, không lưu ở pf_party
          required: [full_name, phone]
          properties:
            full_name: {type: string}
            phone: {type: string}
        cooperative:
          type: object
          properties:
            tax_code: {type: string, description: "10 hoặc 13 chữ số; duy nhất trong tenant"}
            area_ha: {type: string, description: "Decimal dạng chuỗi"}
            established_on: {type: string, format: date}
            location:
              type: object
              required: [lat, lon]
              properties:
                lat: {type: string}
                lon: {type: string}
    PartyOrgEvent:
      type: object
      required: [seq, action, event_time, recorded_at, actor_ref, reason, name, admin_unit_code, parent_ref, prev_parent_ref, prev_admin_unit_code, active]
      properties:
        seq: {type: integer}
        action: {type: string, enum: [created, moved, renamed, deactivated, reactivated]}
        event_time: {type: string, format: date-time}
        recorded_at: {type: string, format: date-time}
        actor_ref: {type: string, format: uuid}
        reason: {type: [string, "null"]}
        name: {type: string}
        admin_unit_code: {type: [string, "null"]}
        parent_ref: {type: [string, "null"], format: uuid}
        prev_parent_ref: {type: [string, "null"], format: uuid}
        prev_admin_unit_code: {type: [string, "null"]}
        active: {type: boolean}
        details: {type: object, description: "Hồ sơ HTX lúc tạo (không PII)"}
    # --- pf/sync ---

    SyncDeviceAdmin:
      type: object
      required: [device_id, registered_at, platform, app_version, revoked, actor_ref]
      properties:
        device_id: {type: string, format: uuid}
        registered_at: {type: string, format: date-time}
        platform: {type: string, enum: [android, ios]}
        app_version: {type: string}
        revoked: {type: boolean}
        actor_ref: {type: string, format: uuid}
        org_ref: {type: string, format: uuid}
        last_seen_at: {type: string, format: date-time}
        revoked_at: {type: string, format: date-time}
        revoke_reason: {type: string}
    SyncConflict:
      type: object
      required: [conflict_id, entity, first_record_id, device_id, reported_by, owner_org_ref, opened_at, due_at, status, overdue, resolved_at, resolved_by, resolution_note, resolved_record_id]
      properties:
        conflict_id: {type: string, format: uuid}
        entity: {type: string}
        first_record_id: {type: string, format: uuid}
        device_id: {type: string, format: uuid}
        reported_by: {type: string, format: uuid}
        owner_org_ref: {type: [string, "null"], format: uuid, description: "Đơn vị phụ trách xử lý (đơn vị của người gửi)"}
        opened_at: {type: string, format: date-time}
        due_at: {type: string, format: date-time, description: "opened_at + sync.conflict_sla_hours (mặc định 72, C-8)"}
        status: {type: string, enum: [open, resolved]}
        overdue: {type: boolean}
        resolved_at: {type: [string, "null"], format: date-time}
        resolved_by: {type: [string, "null"], format: uuid}
        resolution_note: {type: [string, "null"]}
        resolved_record_id: {type: [string, "null"], format: uuid}
        sla_status: {type: string, enum: [on_track, due_soon, overdue, resolved_on_time, resolved_late], description: "US-SYNC-03"}
    MrvFieldInput:
      type: object
      required: [key, label_vi, data_type]
      properties:
        key: {type: string, pattern: "^[a-z][a-z0-9_]{1,62}$", description: "Khóa dành riêng plot_ref/season (text), gps (geo_point), photo (photo) lấy giá trị từ cột riêng"}
