        "201":
          description: Đã tạo
          content:
            application/json:
              schema:
                type: object
                required: [machine, seq]
                properties:
                  machine: {$ref: "#/components/schemas/MechMachine"}
                  seq: {type: integer}
        "403": {$ref: "#/components/responses/Problem"}
        "409": {description: mechanization.serial_taken | mechanization.chassis_taken (existing_code), $ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/mechanization/machines/import:
    post:
      summary: Nhập danh sách máy của MỘT HTX từ CSV UTF-8 hoặc Excel .xlsx (FN-05 BR-07/BR-10, US-MAC-02)
      description: |
        Định dạng nhận theo chữ ký tệp; .xlsx đọc trang tính đầu, ô ngày Excel đọc thành ngày, ô công thức → từ chối cả tệp.
        Đối chiếu từng dòng theo Số máy/SN (thiếu thì Số khung): đã có → cập nhật, chưa có → tạo mới.
        mode=replace ("Thay thế toàn bộ"): máy đang Active của HTX vắng mặt trong tệp chuyển Inactive bằng sự kiện kèm Ngày vô hiệu hóa — không xóa.
        mode=update ("Cập nhật"): máy vắng mặt giữ nguyên. Tệp có cột "Mã máy" hoặc "Khâu", hoặc thiếu cột bắt buộc → từ chối cả tệp.
        Cột (tiêu đề có/không dấu): Chủng loại, Hãng, Model, Năm SX, Nhiên liệu, Công suất, Năng suất, Mã CSH, Số máy, Số khung, Ngày sở hữu (dd/mm/yyyy), Tình trạng.
      operationId: mechImportMachines
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - {name: cooperative_ref, in: query, required: true, schema: {type: string, format: uuid}}
        - {name: mode, in: query, required: true, schema: {type: string, enum: [update, replace]}}
      requestBody:
        required: true
        content:
          text/csv:
            schema: {type: string}
          application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
            schema: {type: string, format: binary}
      responses:
        "200":
          description: Kết quả theo dòng
          content:
            application/json:
              schema:
                type: object
                required: [mode, created, updated, reactivated, unchanged, rejected, rows, deactivated]
                properties:
                  mode: {type: string}
                  created: {type: integer}
                  updated: {type: integer}
                  reactivated: {type: integer}
                  unchanged: {type: integer}
                  rejected: {type: integer}
                  rows:
                    type: array
                    items:
                      type: object
                      required: [row, status, reason, machine_ref, code]
                      properties:
                        row: {type: integer}
                        status: {type: string, enum: [created, updated, reactivated, unchanged, rejected]}
                        reason: {type: [string, "null"], description: "vd \"Dòng 5: Số máy/SN trùng với dòng 9 trong cùng file\""}
                        machine_ref: {type: [string, "null"], format: uuid}
                        code: {type: [string, "null"]}
                  deactivated: {type: array, items: {$ref: "#/components/schemas/MechMachine"}}
        "422": {description: mechanization.import_invalid, $ref: "#/components/responses/Problem"}
