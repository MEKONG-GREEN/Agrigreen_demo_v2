openapi: 3.1.0
info:
  title: AgriGreen Admin API
  version: "1"
  description: |
    Bề mặt Admin (admin.<domain>) — OIDC + JWT + **MFA bắt buộc** cho mọi route (mục 11).
    Dữ liệu chủ, tham số, phê duyệt, nhật ký. Mọi POST bắt buộc Idempotency-Key (R-51).
    Lỗi theo RFC 9457 (docs/errors.md). Tenant lấy từ token, không bao giờ từ path/query/body (R-16).
    Thay đổi có phê duyệt dùng hai vai param_setter và param_approver; người duyệt không được là người đặt (R-56).

    Bề mặt Admin (admin.<domain>) — OIDC + MFA bắt buộc cho mọi route (mục 11).
    Dữ liệu chủ, tham số, phê duyệt, nhật ký. Mọi POST bắt buộc Idempotency-Key (R-51).
    Lỗi theo RFC 9457 (docs/errors.md). Tenant lấy từ token (R-16).

    Mỗi module giữ một phần riêng có đánh dấu "# --- <module> ---" để gộp dễ.
servers:
  - url: https://admin.agrigreen.vn
security:
  - oidc: []
paths:
  /v1/masterdata/seed:
    post:
      summary: Nạp dữ liệu nền nhúng cho tenant của người gọi (chạy lặp an toàn)
      description: Vai masterdata_admin hoặc platform_admin. Đơn vị hành chính ĐBSCL, danh mục mặc định, tham số CGH đã duyệt.
      operationId: seedMasterdata
      tags: [masterdata]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Tổng kết
          content:
            application/json:
              schema:
                type: object
                properties:
                  admin_units: {$ref: "#/components/schemas/ImportResult"}
                  catalog_items_created: {type: integer}
                  params_created: {type: integer}
                  params_skipped: {type: integer}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/masterdata/admin-units/import:
    post:
      summary: Nhập danh mục đơn vị hành chính có hiệu lực theo thời gian
      description: |
        Vai masterdata_admin. Một giao dịch: thêm phiên bản mới, đóng hiệu lực phiên bản đang mở (valid_to + successors),
        bỏ qua dòng không đổi. Nhập lặp cùng tệp không đổi gì. Không bao giờ xóa hay sửa nội dung phiên bản đã có.
        Phát pf.masterdata.admin_unit.changed cho mỗi phiên bản thêm/đóng.
      operationId: importAdminUnits
      tags: [masterdata]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/GazetteerFile"}
      responses:
        "200":
          description: Tổng kết
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ImportResult"}
        "400": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "409": {description: "masterdata.admin_unit_conflict | masterdata.admin_unit_overlap", $ref: "#/components/responses/Problem"}
        "422": {description: "validation_failed | masterdata.admin_unit_invalid_reference", $ref: "#/components/responses/Problem"}
  /v1/masterdata/catalogs/{catalog}/items:
    parameters:
      - $ref: "#/components/parameters/Catalog"
    get:
      summary: Liệt kê mục danh mục (mặc định gồm cả mục đã ngừng dùng)
      operationId: adminListCatalogItems
      tags: [masterdata]
      parameters:
        - {name: include_inactive, in: query, schema: {type: boolean, default: true}}
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Một trang
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/CatalogItem"}}
                  next_cursor: {type: [string, "null"]}
        "404": {$ref: "#/components/responses/Problem"}
    post:
      summary: Thêm mục danh mục (vai masterdata_admin)
      operationId: createCatalogItem
      tags: [masterdata]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CatalogItemInput"}
      responses:
        "201":
          description: Đã thêm. Gọi lặp cùng khóa trả lại đúng phản hồi này, kèm Idempotent-Replayed.
          headers:
            Location: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CatalogItem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {description: masterdata.catalog_not_found, $ref: "#/components/responses/Problem"}
        "409": {description: masterdata.catalog_item_exists, $ref: "#/components/responses/Problem"}
        "422": {description: "validation_failed | masterdata.farm_stage_invalid", $ref: "#/components/responses/Problem"}
  /v1/masterdata/catalogs/{catalog}/items/{code}:
    parameters:
      - $ref: "#/components/parameters/Catalog"
      - $ref: "#/components/parameters/ItemCode"
    put:
      summary: Sửa tên/thuộc tính (ghi lịch sử trước → sau; không đổi gì thì không ghi)
      operationId: updateCatalogItem
      tags: [masterdata]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CatalogItemInput"}
      responses:
        "200":
          description: Mục sau khi sửa
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CatalogItem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/masterdata/catalogs/{catalog}/items/{code}/deactivate:
    parameters:
      - $ref: "#/components/parameters/Catalog"
      - $ref: "#/components/parameters/ItemCode"
    post:
      summary: Ngừng dùng một mục (không xóa; lý do bắt buộc ≥ 10 ký tự)
      operationId: deactivateCatalogItem
      tags: [masterdata]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ReasonInput"}
      responses:
        "200":
          description: Mục đã ngừng dùng
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CatalogItem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {description: masterdata.catalog_item_state, $ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/masterdata/catalogs/{catalog}/items/{code}/reactivate:
    parameters:
      - $ref: "#/components/parameters/Catalog"
      - $ref: "#/components/parameters/ItemCode"
    post:
      summary: Dùng lại một mục đã ngừng
      operationId: reactivateCatalogItem
      tags: [masterdata]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ReasonInput"}
      responses:
        "200":
          description: Mục đang dùng
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CatalogItem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
  /v1/masterdata/catalogs/{catalog}/items/{code}/history:
    parameters:
      - $ref: "#/components/parameters/Catalog"
      - $ref: "#/components/parameters/ItemCode"
    get:
      summary: Lịch sử thay đổi của một mục (sổ chỉ ghi thêm, có chuỗi băm)
      operationId: catalogItemHistory
      tags: [masterdata]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Một trang, theo thứ tự ghi
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/CatalogChange"}}
                  next_cursor: {type: [string, "null"]}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/masterdata/params/versions:
    post:
      summary: Đề xuất phiên bản tham số (nháp, vai param_setter)
      description: |
        Số phiên bản tăng dần theo khóa. Nếu đã có phiên bản được duyệt cùng effective_from, phải nêu
        correction_reason — bản duyệt mới là bản ghi bù (supersedes_id), bản cũ vẫn trong sổ.
      operationId: proposeParam
      tags: [masterdata]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ParamProposal"}
      responses:
        "201":
          description: Đã tạo nháp
          headers:
            Location: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ParamVersion"}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {description: "validation_failed | masterdata.param_correction_required", $ref: "#/components/responses/Problem"}
    get:
      summary: Lịch sử phiên bản tham số (mọi trạng thái)
      operationId: listParamVersions
      tags: [masterdata]
      parameters:
        - {name: key, in: query, schema: {type: string}, examples: {norm: {value: "cgh.norm_ha_per_machine:MGD:thu_hoach"}}}
        - {name: status, in: query, schema: {type: string, enum: [draft, submitted, approved, rejected]}}
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Một trang, theo thứ tự tạo
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/ParamVersion"}}
                  next_cursor: {type: [string, "null"]}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/masterdata/params/versions/{id}:
    get:
      operationId: getParamVersion
      tags: [masterdata]
      parameters:
        - $ref: "#/components/parameters/VersionID"
      responses:
        "200":
          description: Phiên bản
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ParamVersion"}
        "404": {description: masterdata.param_version_not_found, $ref: "#/components/responses/Problem"}
  /v1/masterdata/params/versions/{id}/submit:
    post:
      summary: Gửi duyệt (chỉ người đặt)
      operationId: submitParamVersion
      tags: [masterdata]
      parameters:
        - $ref: "#/components/parameters/VersionID"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Đã gửi duyệt
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ParamVersion"}
        "403": {description: "forbidden | masterdata.param_not_setter", $ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {description: masterdata.param_invalid_transition, $ref: "#/components/responses/Problem"}
  /v1/masterdata/params/versions/{id}/approve:
    post:
      summary: Phê duyệt (vai param_approver, không phải người đặt — R-56)
      description: Ghi sổ param_approved và phát pf.masterdata.param.approved trong cùng giao dịch. Phiên bản đã duyệt bất biến.
      operationId: approveParamVersion
      tags: [masterdata]
      parameters:
        - $ref: "#/components/parameters/VersionID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        content:
          application/json:
            schema: {$ref: "#/components/schemas/DecisionInput"}
      responses:
        "200":
          description: Đã duyệt
          content:
            application/json:
              schema:
                type: object
                required: [version, approved]
                properties:
                  version: {$ref: "#/components/schemas/ParamVersion"}
                  approved: {$ref: "application.yaml#/components/schemas/ParamValue"}
        "403": {description: "forbidden | self_approval_forbidden", $ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {description: masterdata.param_invalid_transition, $ref: "#/components/responses/Problem"}
        "422": {description: masterdata.param_correction_required, $ref: "#/components/responses/Problem"}
  /v1/masterdata/params/versions/{id}/reject:
    post:
      summary: Từ chối (vai param_approver, không phải người đặt; lý do bắt buộc)
      operationId: rejectParamVersion
      tags: [masterdata]
      parameters:
        - $ref: "#/components/parameters/VersionID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/DecisionInput"}
      responses:
        "200":
          description: Đã từ chối
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ParamVersion"}
        "403": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  # --- pf/party: tổ chức, HTX, nông hộ ---
  /v1/orgs:
    post:
      summary: Tạo tổ chức trong cây TW → Tỉnh → Xã; kind = cooperative kèm hồ sơ HTX, Mã HTX tự sinh
      operationId: partyCreateOrg
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PartyOrgInput"}
      responses:
        "201":
          description: Đã tạo; ghi sổ pf_party.org_event (action = created)
          headers:
            Location: {schema: {type: string}}
          content:
            application/json:
              schema:
                type: object
                required: [org, seq, representative_duplicate]
                properties:
                  org: {$ref: "#/components/schemas/PartyOrg"}
                  seq: {type: integer}
                  representative_duplicate: {type: boolean, description: "Người đại diện đã có trong kho định danh, dùng lại mã cũ"}
        "403": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
  /v1/orgs/{ref}/move:
    post:
      summary: Di chuyển một nút kèm cả nhánh con sang cha mới (sáp nhập đơn vị hành chính), giữ lịch sử
      operationId: partyMoveOrg
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                new_parent_ref: {type: [string, "null"], format: uuid, description: "null = đưa lên gốc"}
                new_admin_unit_code: {type: string, description: "Mã đơn vị mới sau sáp nhập; bỏ trống = giữ"}
                reason: {type: string, minLength: 10}
      responses:
        "200": {$ref: "#/components/responses/PartyOrgChanged"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/orgs/{ref}/rename:
    post:
      summary: Đổi tên tổ chức (ghi sổ, action = renamed)
      operationId: partyRenameOrg
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string, maxLength: 200}
                reason: {type: string}
      responses:
        "200": {$ref: "#/components/responses/PartyOrgChanged"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/orgs/{ref}/events:
    get:
      summary: Nhật ký biến động chỉ đọc, lưu vĩnh viễn (HTX US-HTXSTATUS-03)
      operationId: partyOrgEvents
      parameters:
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Theo seq tăng dần
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/PartyOrgEvent"}}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/cooperatives/{ref}/deactivate:
    post:
      summary: Vô hiệu hóa HTX (soft-delete) — lý do ≥ 20 ký tự; phát pf.party.org.deactivated để khóa tài khoản
      operationId: partyDeactivateCooperative
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string, minLength: 20}
      responses:
        "200": {$ref: "#/components/responses/PartyOrgChanged"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/cooperatives/{ref}/reactivate:
    post:
      summary: Kích hoạt lại HTX; phát pf.party.org.reactivated
      operationId: partyReactivateCooperative
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: {type: string}
      responses:
        "200": {$ref: "#/components/responses/PartyOrgChanged"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
  /v1/households/import:
    post:
      summary: Nhập nông hộ từ CSV (UTF-8, dòng đầu là tiêu đề), tối đa 200 dòng; kết quả theo từng dòng
      description: |
        Cột: full_name|ho_ten, phone|so_dien_thoai, national_id|cccd, address|dia_chi,
        cooperative_code|ma_htx, commune_code|ma_xa, cultivated_area_ha|dien_tich_ha,
        member_since|ngay_vao_htx. Bắt buộc: full_name, phone, cooperative_code.
        Thiếu cột bắt buộc → từ chối cả tệp (party.import_invalid).
      operationId: partyImportHouseholds
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          text/csv:
            schema: {type: string}
      responses:
        "200":
          description: Kết quả theo dòng
          content:
            application/json:
              schema:
                type: object
                required: [accepted, duplicate, rejected, rows]
                properties:
                  accepted: {type: integer}
                  duplicate: {type: integer}
                  rejected: {type: integer}
                  rows:
                    type: array
                    items:
                      type: object
                      required: [row, status, reason, household_ref]
                      properties:
                        row: {type: integer, description: "Số dòng trong tệp (dòng 1 là tiêu đề)"}
                        status: {type: string, enum: [accepted, duplicate, rejected]}
                        reason: {type: [string, "null"], description: "Không chứa dữ liệu cá nhân"}
                        household_ref: {type: [string, "null"], format: uuid}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  # --- hết pf/party ---
  # --- pf/mechanization: Bản đồ CGH — ghi dữ liệu chủ, vụ mùa, chạy cân đối (chỉ cgh_admin; Cục KTHT → 403) ---
  # Không xóa cứng: vô hiệu hóa là sự kiện trong sổ kèm ngày và lý do. Mã CSH-/MAY- do hệ thống tự sinh.
  /v1/mechanization/owners:
    post:
      summary: Tạo chủ sở hữu máy (FN-04) — Mã CSH-<tỉnh HTX>-00001 tự sinh; họ tên/SĐT cá nhân chỉ vào kho định danh
      description: Thành viên HTX / HTX phải liên kết đúng một HTX. Chống trùng theo SĐT qua chỉ mục mù của kho định danh.
      operationId: mechCreateOwner
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [owner_type]
              properties:
                owner_type: {type: string, description: "Mã hoặc nhãn: thanh_vien_htx | htx | doanh_nghiep | khac"}
                cooperative_ref: {type: string, format: uuid}
                name: {type: string, description: "Bắt buộc trừ loại HTX; cá nhân → kho định danh"}
                phone: {type: string, description: "Bắt buộc trừ loại HTX; chỉ vào kho định danh"}
      responses:
        "201":
          description: Đã tạo
          content:
            application/json:
              schema:
                type: object
                required: [owner, seq]
                properties:
                  owner: {$ref: "#/components/schemas/MechOwner"}
                  seq: {type: integer}
        "403": {description: forbidden | mechanization.out_of_scope, $ref: "#/components/responses/Problem"}
        "409": {description: mechanization.owner_duplicate, $ref: "#/components/responses/Problem"}
        "422": {description: validation_failed | mechanization.cooperative_invalid, $ref: "#/components/responses/Problem"}
        "503": {description: mechanization.dependency_unavailable, $ref: "#/components/responses/Problem"}
  /v1/mechanization/owners/{id}/deactivate:
    post:
      summary: Vô hiệu hóa chủ sở hữu (FN-04 BR-05) — còn máy thì 409, trừ khi with_machines = true (máy chuyển Inactive)
      operationId: mechDeactivateOwner
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string, minLength: 10}
                with_machines: {type: boolean, default: false}
                deactivated_on: {type: string, format: date, description: "Ngày vô hiệu hóa của máy kèm theo; mặc định hôm nay"}
      responses:
        "200": {$ref: "#/components/responses/MechOwnerChanged"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {description: mechanization.owner_has_machines (active_machines) | mechanization.state_conflict, $ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/mechanization/owners/{id}/reactivate:
    post:
      summary: Kích hoạt lại chủ sở hữu
      operationId: mechReactivateOwner
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200": {$ref: "#/components/responses/MechOwnerChanged"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
  /v1/mechanization/owners/{id}/events:
    get:
      summary: Lịch sử biến động của chủ sở hữu (FN-04 B7)
      operationId: mechOwnerEvents
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Theo seq
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/MechOwnerEvent"}}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/mechanization/machines:
    post:
      summary: Thêm máy (FN-05) — Mã MAY-<tỉnh HTX>-00001 tự sinh; khâu tự gán theo chủng loại; Số máy/SN, Số khung duy nhất
      operationId: mechCreateMachine
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/MechMachineInput"
                - type: object
                  required: [cooperative_ref, machine_type, owner_id, owned_since]
      responses:
        "201":
          description: Đã tạo
          content:
            application/json:
              schema:
                type: object
                required: [machine, seq]
                properties:
                  machine: {$ref: "#/components/schemas/MechMachine"}
                  seq: {type: integer}
        "403": {$ref: "#/components/responses/Problem"}
        "409": {description: mechanization.serial_taken | mechanization.chassis_taken (existing_code), $ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/mechanization/machines/import:
    post:
      summary: Nhập danh sách máy của MỘT HTX từ CSV (FN-05 BR-07/BR-10, US-MAC-02)
      description: |
        Đối chiếu từng dòng theo Số máy/SN (thiếu thì Số khung): đã có → cập nhật, chưa có → tạo mới.
        mode=replace ("Thay thế toàn bộ"): máy đang Active của HTX vắng mặt trong tệp chuyển Inactive bằng sự kiện kèm Ngày vô hiệu hóa — không xóa.
        mode=update ("Cập nhật"): máy vắng mặt giữ nguyên. Tệp có cột "Mã máy" hoặc "Khâu", hoặc thiếu cột bắt buộc → từ chối cả tệp.
        Cột (tiêu đề có/không dấu): Chủng loại, Hãng, Model, Năm SX, Nhiên liệu, Công suất, Năng suất, Mã CSH, Số máy, Số khung, Ngày sở hữu (dd/mm/yyyy), Tình trạng.
      operationId: mechImportMachines
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - {name: cooperative_ref, in: query, required: true, schema: {type: string, format: uuid}}
        - {name: mode, in: query, required: true, schema: {type: string, enum: [update, replace]}}
      requestBody:
        required: true
        content:
          text/csv:
            schema: {type: string}
      responses:
        "200":
          description: Kết quả theo dòng
          content:
            application/json:
              schema:
                type: object
                required: [mode, created, updated, reactivated, unchanged, rejected, rows, deactivated]
                properties:
                  mode: {type: string}
                  created: {type: integer}
                  updated: {type: integer}
                  reactivated: {type: integer}
                  unchanged: {type: integer}
                  rejected: {type: integer}
                  rows:
                    type: array
                    items:
                      type: object
                      required: [row, status, reason, machine_ref, code]
                      properties:
                        row: {type: integer}
                        status: {type: string, enum: [created, updated, reactivated, unchanged, rejected]}
                        reason: {type: [string, "null"], description: "vd \"Dòng 5: Số máy/SN trùng với dòng 9 trong cùng file\""}
                        machine_ref: {type: [string, "null"], format: uuid}
                        code: {type: [string, "null"]}
                  deactivated: {type: array, items: {$ref: "#/components/schemas/MechMachine"}}
        "422": {description: mechanization.import_invalid, $ref: "#/components/responses/Problem"}
  /v1/mechanization/machines/{ref}/update:
    post:
      summary: Sửa hồ sơ máy (chuyển HTX, đổi chủng loại → khâu đổi theo); Mã máy không đổi
      operationId: mechUpdateMachine
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MechMachineInput"}
      responses:
        "200": {$ref: "#/components/responses/MechMachineChanged"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/mechanization/machines/{ref}/status:
    post:
      summary: Đổi tình trạng máy (nhập tay, QT-03) — dòng sổ status_changed có event_time = thời điểm hiệu lực
      operationId: mechChangeMachineStatus
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: {type: string, description: "Mã hoặc nhãn: Hoạt động / Bảo trì / Hỏng / Ngừng hoạt động"}
                effective_at: {type: string, format: date-time, description: "Không ở tương lai, không trước lần cập nhật gần nhất"}
      responses:
        "200": {$ref: "#/components/responses/MechMachineChanged"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/mechanization/machines/{ref}/deactivate:
    post:
      summary: Vô hiệu hóa máy (FN-05 BR-06) — kèm Ngày vô hiệu hóa (≥ Ngày HTX sở hữu, không ở tương lai) và lý do
      operationId: mechDeactivateMachine
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string, minLength: 10}
                deactivated_on: {type: string, format: date}
      responses:
        "200": {$ref: "#/components/responses/MechMachineChanged"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/mechanization/machines/{ref}/reactivate:
    post:
      summary: Kích hoạt lại máy
      operationId: mechReactivateMachine
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200": {$ref: "#/components/responses/MechMachineChanged"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
  /v1/mechanization/machines/{ref}/events:
    get:
      summary: Lịch sử biến động của máy (FN-05 B8, AC-04)
      operationId: mechMachineEvents
      parameters:
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Theo seq
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/MechMachineEvent"}}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/mechanization/season-areas:
    post:
      summary: Nhập tay diện tích canh tác & lịch mùa vụ theo HTX × vụ (FN-06, US-SEA-01) — nhãn [Nhập tay], tùy chọn khóa
      operationId: mechRecordSeasonArea
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cooperative_ref, season_code, season_year, area_ha]
              properties:
                cooperative_ref: {type: string, format: uuid}
                season_code: {type: string}
                season_year: {type: integer}
                area_ha: {$ref: "#/components/schemas/MechDecimal"}
                lock: {type: boolean, default: false}
                source: {type: string, enum: [manual]}
                calendar:
                  type: array
                  items:
                    type: object
                    required: [stage, start, end]
                    properties:
                      stage: {type: string}
                      start: {type: string, format: date}
                      end: {type: string, format: date, description: "Sau ngày bắt đầu; cùng khâu không chồng lấn"}
      responses:
        "201": {$ref: "#/components/responses/MechAreaChanged"}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/mechanization/season-areas/{id}/lock:
    post:
      summary: Khóa bản ghi nhập tay — đồng bộ App HTX không ghi đè (FN-06 B5, QT-03)
      operationId: mechLockSeasonArea
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200": {$ref: "#/components/responses/MechAreaChanged"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
  /v1/mechanization/season-areas/{id}/unlock:
    post:
      summary: Mở khóa — App HTX được ưu tiên trở lại ở lần đồng bộ kế tiếp
      operationId: mechUnlockSeasonArea
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200": {$ref: "#/components/responses/MechAreaChanged"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
  /v1/mechanization/season-areas/{id}/events:
    get:
      summary: Lịch sử thay đổi của bản ghi diện tích vụ (FN-06 B7)
      operationId: mechSeasonAreaEvents
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Theo seq
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [seq, action, event_time, recorded_at, actor_ref, reason, area]
                      properties:
                        seq: {type: integer}
                        action: {type: string, enum: [recorded, synced, locked, unlocked]}
                        event_time: {type: string, format: date-time}
                        recorded_at: {type: string, format: date-time}
                        actor_ref: {type: string, format: uuid}
                        reason: {type: [string, "null"]}
                        area: {$ref: "#/components/schemas/MechSeasonArea"}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/mechanization/balance-runs:
    post:
      summary: Tính và LƯU cân đối cung–cầu của một vụ (FN-09, QT-01/QT-02) — phát pf.mechanization.balance.computed
      description: |
        Số máy cần = diện tích canh tác ÷ định mức hiệu lực TẠI VỤ (T = ngày bắt đầu vụ); năng lực = máy "Hoạt động" tại T;
        chỉ khâu bật cờ thí điểm. Kết quả bất biến, kèm rule_version và phiên bản tham số đã dùng.
        Chạy đồng bộ (dự kiến < 2 giây ở ĐTK 1); khi vượt ngưỡng sẽ chuyển sang 202 + job (R-52) mà không đổi hợp đồng kết quả.
      operationId: mechComputeBalance
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [season_code, season_year]
              properties:
                season_code: {type: string}
                season_year: {type: integer, description: "Năm bắt đầu vụ"}
      responses:
        "201":
          description: Đã lưu
          content:
            application/json:
              schema:
                type: object
                required: [run]
                properties:
                  run: {$ref: "#/components/schemas/MechRun"}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
  # --- hết pf/mechanization ---
components:
  securitySchemes:
    oidc:
      type: openIdConnect
      openIdConnectUrl: https://auth.agrigreen.vn/realms/agrigreen/.well-known/openid-configuration
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, pattern: "^[A-Za-z0-9._:-]{8,200}$"}
    Catalog:
      name: catalog
      in: path
      required: true
      schema: {type: string, enum: [rice_variety, farm_stage, machine_type, season, pest]}
    ItemCode:
      name: code
      in: path
      required: true
      schema: {type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]{0,39}$"}
    VersionID:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
    Cursor:
      name: cursor
      in: query
      schema: {type: string}
    Limit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 200, default: 50}
  responses:
    Problem:
      description: RFC 9457
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    PartyOrgChanged:
      description: Trạng thái sau biến động và dòng sổ vừa ghi
      content:
        application/json:
          schema:
            type: object
            required: [org, event, active_households]
            properties:
              org: {$ref: "#/components/schemas/PartyOrg"}
              event: {$ref: "#/components/schemas/PartyOrgEvent"}
              active_households: {type: integer, description: "Số nông hộ đang là thành viên (cảnh báo phạm vi ảnh hưởng khi vô hiệu hóa)"}
    MechOwnerChanged:
      description: Chủ sở hữu sau biến động, dòng sổ vừa ghi và máy bị vô hiệu hóa kèm (nếu có)
      content:
        application/json:
          schema:
            type: object
            required: [owner, event, deactivated_machines]
            properties:
              owner: {$ref: "#/components/schemas/MechOwner"}
              event: {$ref: "#/components/schemas/MechOwnerEvent"}
              deactivated_machines: {type: array, items: {$ref: "#/components/schemas/MechMachine"}}
    MechMachineChanged:
      description: Máy sau biến động và dòng sổ vừa ghi
      content:
        application/json:
          schema:
            type: object
            required: [machine, event]
            properties:
              machine: {$ref: "#/components/schemas/MechMachine"}
              event: {$ref: "#/components/schemas/MechMachineEvent"}
    MechAreaChanged:
      description: Diện tích vụ sau biến động và dòng sổ vừa ghi
      content:
        application/json:
          schema:
            type: object
            required: [area, event]
            properties:
              area: {$ref: "#/components/schemas/MechSeasonArea"}
              event: {type: object}
  schemas:
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: {type: string, format: uri}
        title: {type: string}
        status: {type: integer}
        code: {type: string}
        detail: {type: string}
        instance: {type: string}
        trace_id: {type: string}
        errors:
          type: array
          items:
            type: object
            properties:
              field: {type: string}
              reason: {type: string}
    GazetteerFile:
      type: object
      required: [format, source, units]
      additionalProperties: false
      properties:
        format: {type: string, const: agrigreen.admin_units/v1}
        source: {type: string, maxLength: 300, description: "Nguồn dữ liệu (văn bản, tệp gốc)"}
        note: {type: string}
        units:
          type: array
          minItems: 1
          maxItems: 5000
          items:
            type: object
            required: [code, name, level, valid_from]
            additionalProperties: false
            properties:
              code: {type: string, pattern: "^[0-9A-Z][0-9A-Z.-]{0,39}$"}
              name: {type: string, maxLength: 200}
              level: {type: string, enum: [province, commune, district], description: "district chỉ cho dữ liệu lịch sử, valid_to ≤ 2025-07-01"}
              parent_code: {type: string}
              valid_from: {type: string, format: date}
              valid_to: {type: string, format: date, description: "Không bao gồm; bỏ trống = còn hiệu lực"}
              successors: {type: array, items: {type: string}, description: "Đơn vị kế thừa, phải có hiệu lực tại valid_to"}
    ImportResult:
      type: object
      required: [created, closed, unchanged]
      properties:
        created: {type: integer}
        closed: {type: integer}
        unchanged: {type: integer}
    CatalogItemInput:
      type: object
      required: [name]
      properties:
        code: {type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]{0,39}$", description: "Bắt buộc khi thêm; khi sửa bỏ trống hoặc trùng mã trên đường dẫn"}
        name: {type: string, maxLength: 200}
        attrs:
          type: object
          additionalProperties: {type: string}
          description: |
            Theo danh mục — rice_variety: growth_days, expected_yield_t_per_ha (decimal); farm_stage: pilot (true|false, cờ thí điểm CGH), description;
            machine_type: farm_stage (mã khâu đang dùng); season: start_month, end_month; pest: kind (sau_hai|benh_hai|dong_vat_hai|co_dai).
    CatalogItem:
      type: object
      required: [catalog, code, name, attrs, active, deactivation_reason, revision, updated_at]
      properties:
        catalog: {type: string}
        code: {type: string}
        name: {type: string}
        attrs: {type: object, additionalProperties: {type: string}}
        active: {type: boolean}
        deactivation_reason: {type: [string, "null"]}
        revision: {type: integer}
        updated_at: {type: string, format: date-time}
    ReasonInput:
      type: object
      properties:
        reason: {type: string, minLength: 10, maxLength: 500}
    CatalogSnapshot:
      type: object
      properties:
        name: {type: string}
        attrs: {type: object, additionalProperties: {type: string}}
        active: {type: boolean}
        deactivation_reason: {type: string}
    CatalogChange:
      type: object
      required: [id, action, before, after, reason, event_time, actor_ref, seq, recorded_at]
      properties:
        id: {type: string, format: uuid}
        action: {type: string, enum: [created, updated, deactivated, reactivated]}
        before: {oneOf: [{$ref: "#/components/schemas/CatalogSnapshot"}, {type: "null"}]}
        after: {$ref: "#/components/schemas/CatalogSnapshot"}
        reason: {type: [string, "null"]}
        event_time: {type: string, format: date-time}
        actor_ref: {type: string, format: uuid}
        seq: {type: integer}
        recorded_at: {type: string, format: date-time}
    ParamProposal:
      type: object
      required: [key, effective_from, source_doc]
      properties:
        key: {type: string, maxLength: 200, pattern: "^[a-z][a-z0-9_]*(\\.[a-z0-9_]+)+(:[A-Za-z0-9_.-]+)*$", examples: ["cgh.norm_ha_per_machine:MGD:thu_hoach"]}
        value: {type: [string, number], description: "Số thập phân (chuỗi khuyến nghị); đọc thẳng thành decimal, không qua float. Loại trừ với text."}
        text: {type: string, maxLength: 1000}
        unit: {type: string, maxLength: 30}
        effective_from: {type: string, description: "RFC 3339, hoặc YYYY-MM-DD = 00:00 giờ Việt Nam"}
        source_doc: {type: string, maxLength: 300, description: "Số/ngày văn bản ban hành (bắt buộc — CGH FN-02 B3)"}
        correction_reason: {type: string, minLength: 10}
    ParamVersion:
      type: object
      required: [id, key, version, value, text, unit, effective_from, source_doc, status, setter_ref, created_at]
      properties:
        id: {type: string, format: uuid}
        key: {type: string}
        version: {type: integer, minimum: 1}
        value: {type: [string, "null"]}
        text: {type: [string, "null"]}
        unit: {type: string}
        effective_from: {type: string, format: date-time}
        source_doc: {type: string}
        correction_reason: {type: [string, "null"]}
        status: {type: string, enum: [draft, submitted, approved, rejected]}
        setter_ref: {type: string, format: uuid}
        submitted_at: {type: [string, "null"], format: date-time}
        approver_ref: {type: [string, "null"], format: uuid}
        decided_at: {type: [string, "null"], format: date-time}
        decision_note: {type: [string, "null"]}
        created_at: {type: string, format: date-time}
    DecisionInput:
      type: object
      properties:
        note: {type: string, maxLength: 500, description: "Bắt buộc (≥ 10 ký tự) khi từ chối"}
    PartyOrg:
      type: object
      required: [ref, kind, code, name, admin_unit_code, parent_ref, representative_ref, active]
      properties:
        ref: {type: string, format: uuid}
        kind: {type: string, enum: [ttkn_national, ttkn_province, extension_team, dcrd, cooperative, mkg, partner]}
        code: {type: string}
        name: {type: string}
        admin_unit_code: {type: [string, "null"]}
        parent_ref: {type: [string, "null"], format: uuid}
        representative_ref: {type: [string, "null"], format: uuid}
        active: {type: boolean}
    PartyOrgInput:
      type: object
      required: [kind, name]
      properties:
        kind: {type: string, enum: [ttkn_national, ttkn_province, extension_team, dcrd, cooperative, mkg, partner]}
        code: {type: string, maxLength: 40, description: "Bắt buộc trừ HTX; HTX không được gửi (Mã HTX tự sinh)"}
        name: {type: string, maxLength: 200}
        admin_unit_code: {type: string, description: "Tỉnh với ttkn_province; xã với extension_team và cooperative"}
        parent_ref: {type: string, format: uuid}
        representative_ref: {type: string, format: uuid, description: "Mã tham chiếu đã có trong kho định danh"}
        representative:
          type: object
          description: Hoặc gửi định danh người đại diện — chuyển thẳng vào kho định danh, không lưu ở pf_party
          required: [full_name, phone]
          properties:
            full_name: {type: string}
            phone: {type: string}
        cooperative:
          type: object
          properties:
            tax_code: {type: string, description: "10 hoặc 13 chữ số; duy nhất trong tenant"}
            area_ha: {type: string, description: "Decimal dạng chuỗi"}
            established_on: {type: string, format: date}
            location:
              type: object
              required: [lat, lon]
              properties:
                lat: {type: string}
                lon: {type: string}
    PartyOrgEvent:
      type: object
      required: [seq, action, event_time, recorded_at, actor_ref, reason, name, admin_unit_code, parent_ref, prev_parent_ref, prev_admin_unit_code, active]
      properties:
        seq: {type: integer}
        action: {type: string, enum: [created, moved, renamed, deactivated, reactivated]}
        event_time: {type: string, format: date-time}
        recorded_at: {type: string, format: date-time}
        actor_ref: {type: string, format: uuid}
        reason: {type: [string, "null"]}
        name: {type: string}
        admin_unit_code: {type: [string, "null"]}
        parent_ref: {type: [string, "null"], format: uuid}
        prev_parent_ref: {type: [string, "null"], format: uuid}
        prev_admin_unit_code: {type: [string, "null"]}
        active: {type: boolean}
        details: {type: object, description: "Hồ sơ HTX lúc tạo (không PII)"}
    # --- pf/mechanization ---
    MechOwnerType:
      type: string
      enum: [thanh_vien_htx, htx, doanh_nghiep, khac]
      description: Thành viên HTX / HTX / Doanh nghiệp / Đơn vị khác (FN-04)
    MechMachineStatus:
      type: string
      enum: [hoat_dong, bao_tri, hong, ngung_hoat_dong]
    MechCoverageStatus:
      type: string
      enum: [sufficient, attention, shortage, surplus, no_data, no_norm, unclassified]
      description: Đủ / Cần chú ý / Thiếu / Thừa / Chưa có dữ liệu / Chưa cấu hình định mức / Chưa cấu hình ngưỡng (QT-02)
    MechOwner:
      type: object
      required: [id, code, owner_type, owner_type_label, cooperative_ref, person_ref, active, status_reason, label, masked_phone, label_unavailable, machines]
      properties:
        id: {type: string, format: uuid}
        code: {type: string, pattern: "^CSH-[A-Z]{2,6}-[0-9]{5,}$", description: "Mã CSH tự sinh (FN-04 BR-02)"}
        owner_type: {$ref: "#/components/schemas/MechOwnerType"}
        owner_type_label: {type: string}
        cooperative_ref: {type: [string, "null"], format: uuid}
        person_ref: {type: [string, "null"], format: uuid, description: "Mã tham chiếu kho định danh (R-04)"}
        active: {type: boolean}
        status_reason: {type: [string, "null"]}
        label: {type: string, description: "Tên tổ chức, hoặc nhãn cá nhân đã che"}
        masked_phone: {type: string}
        label_unavailable: {type: boolean}
        machines: {type: integer, description: "Số máy đang hoạt động"}
    MechMachine:
      type: object
      required: [ref, code, machine_type, farm_stage, cooperative_ref, owner_id, brand, model, serial_no, chassis_no, year_made, fuel, power_hp, capacity_ha, owned_since, status, status_label, status_source, source_label, status_at, active, deactivated_on, status_reason]
      properties:
        ref: {type: string, format: uuid}
        code: {type: string, pattern: "^MAY-[A-Z]{2,6}-[0-9]{5,}$", description: "Mã máy tự sinh — nhãn hiển thị, không đổi khi máy/HTX đổi tỉnh (ADR-0009)"}
        machine_type: {type: string}
        farm_stage: {type: string, description: "Khâu suy ra từ chủng loại (FN-05 AC-03)"}
        cooperative_ref: {type: string, format: uuid}
        owner_id: {type: string, format: uuid}
        brand: {type: [string, "null"]}
        model: {type: [string, "null"]}
        serial_no: {type: [string, "null"]}
        chassis_no: {type: [string, "null"]}
        year_made: {type: [integer, "null"]}
        fuel: {type: [string, "null"]}
        power_hp: {oneOf: [{$ref: "#/components/schemas/MechDecimal"}, {type: "null"}]}
        capacity_ha: {oneOf: [{$ref: "#/components/schemas/MechDecimal"}, {type: "null"}]}
        owned_since: {type: string, format: date}
        status: {$ref: "#/components/schemas/MechMachineStatus"}
        status_label: {type: string}
        status_source: {type: string, enum: [manual, import, app_htx]}
        source_label: {type: string, enum: ["Nhập tay", "App HTX"]}
        status_at: {type: string, format: date-time}
        active: {type: boolean}
        deactivated_on: {type: [string, "null"], format: date}
        status_reason: {type: [string, "null"]}
    MechSeasonArea:
      type: object
      required: [id, cooperative_ref, season_code, season_year, commune_code, area_ha, source, source_label, source_at, locked, calendar]
      properties:
        id: {type: string, format: uuid}
        cooperative_ref: {type: string, format: uuid}
        season_code: {type: string}
        season_year: {type: integer, description: "Năm bắt đầu vụ"}
        commune_code: {type: [string, "null"]}
        area_ha: {$ref: "#/components/schemas/MechDecimal"}
        source: {type: string, enum: [app_htx, manual]}
        source_label: {type: string, enum: ["App HTX", "Nhập tay"]}
        source_at: {type: string, format: date-time}
        locked: {type: boolean, description: "Khóa: đồng bộ App HTX không ghi đè (QT-03)"}
        calendar:
          type: array
          items:
            type: object
            required: [stage, start, end]
            properties:
              stage: {type: string}
              start: {type: string, format: date}
              end: {type: string, format: date}
    MechParam:
      type: object
      required: [key, value, version, source_doc]
      properties:
        key: {type: string}
        value: {$ref: "#/components/schemas/MechDecimal"}
        version: {type: integer}
        source_doc: {type: string}
    MechRun:
      type: object
      required: [id, season_code, season_year, season_key, reference_date, rule_version, pilot_stages, thresholds, result_count, status_counts, missing_norms, computed_at, seq]
      properties:
        id: {type: string, format: uuid}
        season_code: {type: string}
        season_year: {type: integer}
        season_key: {type: string, description: "vd DX-2025"}
        reference_date: {type: string, format: date, description: "T: ngày bắt đầu vụ — định mức, ngưỡng, số máy lấy tại T"}
        rule_version: {type: string}
        pilot_stages: {type: array, items: {type: string}}
        thresholds:
          type: object
          required: [sufficient, attention, surplus]
          properties:
            sufficient: {oneOf: [{$ref: "#/components/schemas/MechParam"}, {type: "null"}]}
            attention: {oneOf: [{$ref: "#/components/schemas/MechParam"}, {type: "null"}]}
            surplus: {oneOf: [{$ref: "#/components/schemas/MechParam"}, {type: "null"}]}
        result_count: {type: integer}
        status_counts: {type: object, additionalProperties: {type: integer}}
        missing_norms: {type: array, items: {type: string}}
        computed_at: {type: string, format: date-time}
        seq: {type: integer}
    MechResult:
      type: object
      required: [cooperative_ref, commune_code, province_code, farm_stage, machine_type, area_ha, area_source, area_source_label, area_locked, norm_key, norm, required, required_whole, machines_total, capacity, coverage_pct, gap, status, status_label, color, seq]
      properties:
        cooperative_ref: {type: string, format: uuid}
        commune_code: {type: [string, "null"]}
        province_code: {type: [string, "null"]}
        farm_stage: {type: string}
        machine_type: {type: string}
        area_ha: {oneOf: [{$ref: "#/components/schemas/MechDecimal"}, {type: "null"}]}
        area_source: {type: [string, "null"], enum: [app_htx, manual, null]}
        area_source_label: {type: string}
        area_locked: {type: boolean}
        norm_key: {type: string}
        norm: {oneOf: [{$ref: "#/components/schemas/MechParam"}, {type: "null"}], description: "Định mức hiệu lực tại vụ đã dùng (QT-01)"}
        required: {oneOf: [{$ref: "#/components/schemas/MechDecimal"}, {type: "null"}], description: "Diện tích ÷ định mức"}
        required_whole: {type: [integer, "null"]}
        machines_total: {type: integer}
        capacity: {type: integer, description: "Máy \"Hoạt động\" tại T"}
        coverage_pct: {oneOf: [{$ref: "#/components/schemas/MechDecimal"}, {type: "null"}]}
        gap: {type: [integer, "null"], description: "Năng lực − nhu cầu làm tròn lên (âm = thiếu)"}
        status: {$ref: "#/components/schemas/MechCoverageStatus"}
        status_label: {type: string}
        color: {type: string}
        seq: {type: integer}
    MechGroup:
      type: object
      required: [required, required_whole, capacity, machines_total, coverage_pct, status, status_label, color]
      properties:
        required: {$ref: "#/components/schemas/MechDecimal"}
        required_whole: {type: integer}
        capacity: {type: integer}
        machines_total: {type: integer}
        coverage_pct: {oneOf: [{$ref: "#/components/schemas/MechDecimal"}, {type: "null"}]}
        status: {$ref: "#/components/schemas/MechCoverageStatus"}
        status_label: {type: string}
        color: {type: string}
    MechCoverageItem:
      type: object
      required: [unit_code, cooperative_ref, name, province_code, commune_code, cooperatives, area_source, area_locked, overall, stages]
      properties:
        unit_code: {type: [string, "null"]}
        cooperative_ref: {type: [string, "null"], format: uuid}
        name: {type: string}
        province_code: {type: [string, "null"]}
        commune_code: {type: [string, "null"]}
        cooperatives: {type: integer}
        area_source: {type: [string, "null"]}
        area_locked: {type: boolean}
        overall: {$ref: "#/components/schemas/MechGroup"}
        stages: {type: object, additionalProperties: {$ref: "#/components/schemas/MechGroup"}}
    MechDecimal:
      type: string
      pattern: "^-?[0-9]+(\\.[0-9]+)?$"
      description: Số thập phân dạng chuỗi (không float)
    MechMachineInput:
      type: object
      description: Không có Mã máy (tự sinh) và không có farm_stage (khâu tự gán theo chủng loại — gửi farm_stage → 422)
      properties:
        cooperative_ref: {type: string, format: uuid}
        machine_type: {type: string, description: "Mã trong danh mục machine_type"}
        owner_id: {type: string, format: uuid}
        brand: {type: string}
        model: {type: string}
        serial_no: {type: string, description: "Số máy/SN — cần SN hoặc Số khung; duy nhất trong tenant"}
        chassis_no: {type: string}
        year_made: {type: integer}
        fuel: {type: string}
        power_hp: {$ref: "#/components/schemas/MechDecimal"}
        capacity_ha: {$ref: "#/components/schemas/MechDecimal"}
        owned_since: {type: string, format: date, description: "Ngày HTX sở hữu/tiếp nhận — không ở tương lai"}
        status: {type: string, description: "Chỉ khi tạo; mặc định Hoạt động"}
    MechOwnerEvent:
      type: object
      required: [seq, action, event_time, recorded_at, actor_ref, reason, active, cooperative_ref, machines_affected]
      properties:
        seq: {type: integer}
        action: {type: string, enum: [created, deactivated, reactivated]}
        event_time: {type: string, format: date-time}
        recorded_at: {type: string, format: date-time}
        actor_ref: {type: string, format: uuid}
        reason: {type: [string, "null"]}
        active: {type: boolean}
        cooperative_ref: {type: [string, "null"], format: uuid}
        machines_affected: {type: integer}
    MechMachineEvent:
      type: object
      required: [seq, action, source, event_time, recorded_at, actor_ref, reason, machine]
      properties:
        seq: {type: integer}
        action: {type: string, enum: [created, updated, status_changed, deactivated, reactivated]}
        source: {type: string, enum: [manual, import, app_htx]}
        event_time: {type: string, format: date-time}
        recorded_at: {type: string, format: date-time}
        actor_ref: {type: string, format: uuid}
        reason: {type: [string, "null"]}
        machine: {$ref: "#/components/schemas/MechMachine"}
    # --- hết pf/mechanization ---
