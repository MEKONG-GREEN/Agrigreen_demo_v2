                properties:
                  org_ref: {type: string, format: uuid}
                  commune_code: {type: string}
                  province_code: {type: string}
                  region_code: {type: [string, "null"]}
                  action: {type: string, enum: [assigned, changed, cleared]}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {description: party.region_state, $ref: "#/components/responses/Problem"}
        "422": {description: party.region_node_invalid | validation_failed, $ref: "#/components/responses/Problem"}
  /v1/orgs/{ref}/region-log:
    get:
      summary: Lịch sử gán khu vực của Nút xã (cũ → mới, lý do)
      operationId: knOrgRegionLog
      tags: [party]
      parameters:
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: cursor, in: query, schema: {type: integer, minimum: 0}}
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Một trang
          content:
            application/json:
              schema: {$ref: "#/components/schemas/KNLogPage"}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/orgs/{ref}/communes/ensure:
    post:
      summary: "Bảo đảm mỗi xã còn hiệu lực của tỉnh có Nút extension_team gắn mã ĐVHC (An Giang: 102), mã = code_prefix-mã xã"
      operationId: knEnsureCommuneNodes
      tags: [party]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}, description: "Nút TTKN tỉnh"}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                code_prefix: {type: string, maxLength: 20, default: XA}
      responses:
        "200":
          description: Kết quả
          content:
            application/json:
              schema:
                type: object
                required: [province_code, communes, existing, created]
                properties:
                  province_code: {type: string}
                  communes: {type: integer}
                  existing: {type: integer}
                  created: {type: array, items: {$ref: "#/components/schemas/PartyOrg"}}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
  /v1/orgs/{ref}/impact:
    get:
      summary: "Bảng Ảnh hưởng của Nút: tài khoản, HTX, thửa ruộng, kỳ chưa chốt (FN-AD-04.02)"
      operationId: knOrgImpact
      tags: [party]
      parameters:
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Bảng ảnh hưởng
          content:
            application/json:
              schema: {$ref: "#/components/schemas/KNImpact"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
  # --- hết pf/party KN v7.7 gói P2 ---
components:
  securitySchemes:
    oidc:
      type: openIdConnect
      openIdConnectUrl: https://auth.agrigreen.vn/realms/agrigreen/.well-known/openid-configuration
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, pattern: "^[A-Za-z0-9._:-]{8,200}$"}
    Catalog:
      name: catalog
      in: path
      required: true
      schema: {type: string, enum: [rice_variety, farm_stage, machine_type, season, pest, vessel_class, crop, material, production_model, report_type]}
    ItemCode:
      name: code
      in: path
      required: true
      schema: {type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]{0,39}$"}
    VersionID:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
    Cursor:
      name: cursor
      in: query
      schema: {type: string}
    Limit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 200, default: 50}
  responses:
    Problem:
      description: RFC 9457
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    GeoFacilityWritten:
      description: Kho/Hub sau khi ghi và dòng sổ vừa ghi (hình dạng như GET /v1/geo/facilities/{ref} của Application API)
      headers:
        Location: {schema: {type: string}}
      content:
        application/json:
          schema:
            type: object
            required: [facility, event]
            properties:
              facility: {type: object, description: "GeoJSON Feature (điểm marker) — xem GeoFacilityFeature ở application.yaml"}
              event: {type: object, description: "Dòng sổ facility_event — xem GeoFacilityEvent ở application.yaml"}
    GeoCapacityWritten:
      description: Dòng sổ sức chứa vừa ghi và sức chứa hiệu lực sau đó (BR-52)
      content:
        application/json:
          schema:
            type: object
            required: [snapshot, capacity]
            properties:
              snapshot: {type: object, description: "Xem GeoCapacitySnapshot ở application.yaml"}
              capacity: {type: object, description: "Xem GeoCapacityView ở application.yaml (source, fill_pct, class, sync_differs, pending_sync)"}
    GeoRoadWritten:
      description: Tuyến sau khi ghi và phiên bản vừa ghi
      headers:
        Location: {schema: {type: string}}
      content:
        application/json:
          schema:
            type: object
            required: [road, segment]
            properties:
              road: {type: object, description: "GeoJSON Feature LineString — xem GeoRoadFeature ở application.yaml"}
              segment: {type: object, description: "Xem GeoRoadSegment ở application.yaml"}
    PartyOrgChanged:
      description: Trạng thái sau biến động và dòng sổ vừa ghi
      content:
        application/json:
          schema:
            type: object
            required: [org, event, active_households]
            properties:
              org: {$ref: "#/components/schemas/PartyOrg"}
              event: {$ref: "#/components/schemas/PartyOrgEvent"}
              active_households: {type: integer, description: "Số nông hộ đang là thành viên (cảnh báo phạm vi ảnh hưởng khi vô hiệu hóa)"}
    ContentDocumentVersion:
      description: Tài liệu và một phiên bản (phiên bản vừa ghi, vừa xuất bản hoặc được xem trước)
      content:
        application/json:
          schema:
            type: object
            required: [document, version]
            properties:
              document: {$ref: "#/components/schemas/ContentAdminDocument"}
              version: {$ref: "#/components/schemas/ContentVersion"}
    ContentDocumentState:
      description: Trạng thái tài liệu sau chuyển trạng thái
      content:
        application/json:
          schema:
            type: object
            required: [document]
            properties:
              document: {$ref: "#/components/schemas/ContentAdminDocument"}
    MechOwnerChanged:
      description: Chủ sở hữu sau biến động, dòng sổ vừa ghi và máy bị vô hiệu hóa kèm (nếu có)
      content:
        application/json:
          schema:
            type: object
            required: [owner, event, deactivated_machines]
            properties:
              owner: {$ref: "#/components/schemas/MechOwner"}
              event: {$ref: "#/components/schemas/MechOwnerEvent"}
              deactivated_machines: {type: array, items: {$ref: "#/components/schemas/MechMachine"}}
    MechMachineChanged:
      description: Máy sau biến động và dòng sổ vừa ghi
      content:
        application/json:
          schema:
            type: object
            required: [machine, event]
            properties:
              machine: {$ref: "#/components/schemas/MechMachine"}
              event: {$ref: "#/components/schemas/MechMachineEvent"}
    MechAreaChanged:
      description: Diện tích vụ sau biến động và dòng sổ vừa ghi
      content:
        application/json:
          schema:
            type: object
            required: [area, event]
            properties:
              area: {$ref: "#/components/schemas/MechSeasonArea"}
              event: {type: object}
    AccountsChanged:
      description: Trạng thái tài khoản sau thao tác và seq dòng sổ vừa ghi
      content:
        application/json:
          schema:
            type: object
            required: [account, seq, replayed]
            properties:
              account: {$ref: "#/components/schemas/AccountsAccount"}
              seq: {type: integer}
              replayed: {type: boolean}
    KNAssignmentChanged:
      description: Lần gán vai trò sau thao tác, seq dòng sổ, cảnh báo (vd commune_unassigned)
      content:
        application/json:
          schema:
            type: object
            required: [assignment, seq, replayed, warnings]
            properties:
              assignment: {$ref: "#/components/schemas/KNAssignment"}
              seq: {type: integer}
              replayed: {type: boolean}
              warnings: {type: array, items: {$ref: "#/components/schemas/KNWarning"}}
  schemas:
    # --- pf/reports ---
    ReportDefinition:
      type: object
      required: [title, source, grouping, columns, formats]
      properties:
        title: {type: string, minLength: 5, maxLength: 200}
        source:
          type: string
          enum: [extension.sowing, extension.growth_pest, extension.program_progress, extension.tasks_sla, extension.period_summary, mechanization.summary, mechanization.shortage_by_coop, mechanization.season_compare, cropcycle.production]
        grouping: {type: string, enum: [national, province, commune, cooperative]}
        columns:
          type: array
          minItems: 1
          maxItems: 40
          items: {type: object, required: [key], properties: {key: {type: string}, title: {type: string}}}
        formats: {type: array, items: {type: string, enum: [xlsx, pdf]}}
        provisional_layout: {type: boolean}
        form_note: {type: string, maxLength: 500}
    ReportTemplate:
      type: object
      required: [key, version, builtin, status, definition]
      properties:
        key: {type: string}
        version: {type: integer, minimum: 0}
        builtin: {type: boolean}
        status: {type: string, enum: [active, retired]}
        definition: {$ref: "#/components/schemas/ReportDefinition"}
        reason: {type: [string, "null"]}
        created_by: {type: [string, "null"], format: uuid}
        created_at: {type: [string, "null"], format: date-time}
    ReportSchedule:
      type: object
      required: [id, template_key, format, params, frequency, hour, recipients, owner_ref, active, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        template_key: {type: string}
        format: {type: string, enum: [xlsx, pdf]}
        unit_code: {type: [string, "null"]}
        params: {type: object}
        frequency: {type: string, enum: [weekly, monthly]}
        weekday: {type: [integer, "null"]}
        day_of_month: {type: [integer, "null"]}
        hour: {type: integer}
        recipients: {type: array, items: {type: string, format: uuid}}
        owner_ref: {type: string, format: uuid}
        active: {type: boolean}
        deactivated_reason: {type: [string, "null"]}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    # --- hết pf/reports ---

    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: {type: string, format: uri}
        title: {type: string}
        status: {type: integer}
        code: {type: string}
        detail: {type: string}
        instance: {type: string}
        trace_id: {type: string}
        errors:
          type: array
          items:
            type: object
            properties:
              field: {type: string}
              reason: {type: string}
    GazetteerFile:
      type: object
      required: [format, source, units]
      additionalProperties: false
      properties:
        format: {type: string, const: agrigreen.admin_units/v1}
        source: {type: string, maxLength: 300, description: "Nguồn dữ liệu (văn bản, tệp gốc)"}
        note: {type: string}
        units:
          type: array
          minItems: 1
          maxItems: 5000
          items:
            type: object
            required: [code, name, level, valid_from]
            additionalProperties: false
            properties:
              code: {type: string, pattern: "^[0-9A-Z][0-9A-Z.-]{0,39}$"}
              name: {type: string, maxLength: 200}
              level: {type: string, enum: [province, commune, district], description: "district chỉ cho dữ liệu lịch sử, valid_to ≤ 2025-07-01"}
              parent_code: {type: string}
              valid_from: {type: string, format: date}
