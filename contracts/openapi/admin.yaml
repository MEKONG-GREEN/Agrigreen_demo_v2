openapi: 3.1.0
info:
  title: AgriGreen Admin API
  version: "1"
  description: |
    Bề mặt Admin (admin.<domain>) — OIDC + JWT + **MFA bắt buộc** cho mọi route (mục 11).
    Dữ liệu chủ, tham số, phê duyệt, nhật ký. Mọi POST bắt buộc Idempotency-Key (R-51).
    Lỗi theo RFC 9457 (docs/errors.md). Tenant lấy từ token, không bao giờ từ path/query/body (R-16).
    Thay đổi có phê duyệt dùng hai vai param_setter và param_approver; người duyệt không được là người đặt (R-56).

    Bề mặt Admin (admin.<domain>) — OIDC + MFA bắt buộc cho mọi route (mục 11).
    Dữ liệu chủ, tham số, phê duyệt, nhật ký. Mọi POST bắt buộc Idempotency-Key (R-51).
    Lỗi theo RFC 9457 (docs/errors.md). Tenant lấy từ token (R-16).

    Mỗi module giữ một phần riêng có đánh dấu "# --- <module> ---" để gộp dễ.
servers:
  - url: https://admin.agrigreen.vn
security:
  - oidc: []
paths:
  /v1/masterdata/seed:
    post:
      summary: Nạp dữ liệu nền nhúng cho tenant của người gọi (chạy lặp an toàn)
      description: Vai masterdata_admin hoặc platform_admin. Đơn vị hành chính ĐBSCL, danh mục mặc định, tham số CGH đã duyệt.
      operationId: seedMasterdata
      tags: [masterdata]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Tổng kết
          content:
            application/json:
              schema:
                type: object
                properties:
                  admin_units: {$ref: "#/components/schemas/ImportResult"}
                  catalog_items_created: {type: integer}
                  params_created: {type: integer}
                  params_skipped: {type: integer}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/masterdata/admin-units/import:
    post:
      summary: Nhập danh mục đơn vị hành chính có hiệu lực theo thời gian
      description: |
        Vai masterdata_admin. Một giao dịch: thêm phiên bản mới, đóng hiệu lực phiên bản đang mở (valid_to + successors),
        bỏ qua dòng không đổi. Nhập lặp cùng tệp không đổi gì. Không bao giờ xóa hay sửa nội dung phiên bản đã có.
        Phát pf.masterdata.admin_unit.changed cho mỗi phiên bản thêm/đóng.
      operationId: importAdminUnits
      tags: [masterdata]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/GazetteerFile"}
      responses:
        "200":
          description: Tổng kết
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ImportResult"}
        "400": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "409": {description: "masterdata.admin_unit_conflict | masterdata.admin_unit_overlap", $ref: "#/components/responses/Problem"}
        "422": {description: "validation_failed | masterdata.admin_unit_invalid_reference", $ref: "#/components/responses/Problem"}
  /v1/masterdata/catalogs/{catalog}/items:
    parameters:
      - $ref: "#/components/parameters/Catalog"
    get:
      summary: Liệt kê mục danh mục (mặc định gồm cả mục đã ngừng dùng)
      operationId: adminListCatalogItems
      tags: [masterdata]
      parameters:
        - {name: include_inactive, in: query, schema: {type: boolean, default: true}}
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Một trang
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/CatalogItem"}}
                  next_cursor: {type: [string, "null"]}
        "404": {$ref: "#/components/responses/Problem"}
    post:
      summary: Thêm mục danh mục (vai masterdata_admin)
      operationId: createCatalogItem
      tags: [masterdata]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CatalogItemInput"}
      responses:
        "201":
          description: Đã thêm. Gọi lặp cùng khóa trả lại đúng phản hồi này, kèm Idempotent-Replayed.
          headers:
            Location: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CatalogItem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {description: masterdata.catalog_not_found, $ref: "#/components/responses/Problem"}
        "409": {description: masterdata.catalog_item_exists, $ref: "#/components/responses/Problem"}
        "422": {description: "validation_failed | masterdata.farm_stage_invalid", $ref: "#/components/responses/Problem"}
  /v1/masterdata/catalogs/{catalog}/items/{code}:
    parameters:
      - $ref: "#/components/parameters/Catalog"
      - $ref: "#/components/parameters/ItemCode"
    put:
      summary: Sửa tên/thuộc tính (ghi lịch sử trước → sau; không đổi gì thì không ghi)
      operationId: updateCatalogItem
      tags: [masterdata]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CatalogItemInput"}
      responses:
        "200":
          description: Mục sau khi sửa
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CatalogItem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/masterdata/catalogs/{catalog}/items/{code}/deactivate:
    parameters:
      - $ref: "#/components/parameters/Catalog"
      - $ref: "#/components/parameters/ItemCode"
    post:
      summary: Ngừng dùng một mục (không xóa; lý do bắt buộc ≥ 10 ký tự)
      operationId: deactivateCatalogItem
      tags: [masterdata]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ReasonInput"}
      responses:
        "200":
          description: Mục đã ngừng dùng
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CatalogItem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {description: masterdata.catalog_item_state, $ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/masterdata/catalogs/{catalog}/items/{code}/reactivate:
    parameters:
      - $ref: "#/components/parameters/Catalog"
      - $ref: "#/components/parameters/ItemCode"
    post:
      summary: Dùng lại một mục đã ngừng
      operationId: reactivateCatalogItem
      tags: [masterdata]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ReasonInput"}
      responses:
        "200":
          description: Mục đang dùng
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CatalogItem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
  /v1/masterdata/catalogs/{catalog}/items/{code}/history:
    parameters:
      - $ref: "#/components/parameters/Catalog"
      - $ref: "#/components/parameters/ItemCode"
    get:
      summary: Lịch sử thay đổi của một mục (sổ chỉ ghi thêm, có chuỗi băm)
      operationId: catalogItemHistory
      tags: [masterdata]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Một trang, theo thứ tự ghi
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/CatalogChange"}}
                  next_cursor: {type: [string, "null"]}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/masterdata/params/versions:
    post:
      summary: Đề xuất phiên bản tham số (nháp, vai param_setter)
      description: |
        Số phiên bản tăng dần theo khóa. Nếu đã có phiên bản được duyệt cùng effective_from, phải nêu
        correction_reason — bản duyệt mới là bản ghi bù (supersedes_id), bản cũ vẫn trong sổ.
      operationId: proposeParam
      tags: [masterdata]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ParamProposal"}
      responses:
        "201":
          description: Đã tạo nháp
          headers:
            Location: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ParamVersion"}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {description: "validation_failed | masterdata.param_correction_required", $ref: "#/components/responses/Problem"}
    get:
      summary: Lịch sử phiên bản tham số (mọi trạng thái)
      operationId: listParamVersions
      tags: [masterdata]
      parameters:
        - {name: key, in: query, schema: {type: string}, examples: {norm: {value: "cgh.norm_ha_per_machine:MGD:thu_hoach"}}}
        - {name: status, in: query, schema: {type: string, enum: [draft, submitted, approved, rejected]}}
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Một trang, theo thứ tự tạo
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/ParamVersion"}}
                  next_cursor: {type: [string, "null"]}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/masterdata/params/versions/{id}:
    get:
      operationId: getParamVersion
      tags: [masterdata]
      parameters:
        - $ref: "#/components/parameters/VersionID"
      responses:
        "200":
          description: Phiên bản
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ParamVersion"}
        "404": {description: masterdata.param_version_not_found, $ref: "#/components/responses/Problem"}
  /v1/masterdata/params/versions/{id}/submit:
    post:
      summary: Gửi duyệt (chỉ người đặt)
      operationId: submitParamVersion
      tags: [masterdata]
      parameters:
        - $ref: "#/components/parameters/VersionID"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Đã gửi duyệt
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ParamVersion"}
        "403": {description: "forbidden | masterdata.param_not_setter", $ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {description: masterdata.param_invalid_transition, $ref: "#/components/responses/Problem"}
  /v1/masterdata/params/versions/{id}/approve:
    post:
      summary: Phê duyệt (vai param_approver, không phải người đặt — R-56)
      description: Ghi sổ param_approved và phát pf.masterdata.param.approved trong cùng giao dịch. Phiên bản đã duyệt bất biến.
      operationId: approveParamVersion
      tags: [masterdata]
      parameters:
        - $ref: "#/components/parameters/VersionID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        content:
          application/json:
            schema: {$ref: "#/components/schemas/DecisionInput"}
      responses:
        "200":
          description: Đã duyệt
          content:
            application/json:
              schema:
                type: object
                required: [version, approved]
                properties:
                  version: {$ref: "#/components/schemas/ParamVersion"}
                  approved: {$ref: "application.yaml#/components/schemas/ParamValue"}
        "403": {description: "forbidden | self_approval_forbidden", $ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {description: masterdata.param_invalid_transition, $ref: "#/components/responses/Problem"}
        "422": {description: masterdata.param_correction_required, $ref: "#/components/responses/Problem"}
  /v1/masterdata/params/versions/{id}/reject:
    post:
      summary: Từ chối (vai param_approver, không phải người đặt; lý do bắt buộc)
      operationId: rejectParamVersion
      tags: [masterdata]
      parameters:
        - $ref: "#/components/parameters/VersionID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/DecisionInput"}
      responses:
        "200":
          description: Đã từ chối
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ParamVersion"}
        "403": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  # --- pf/party: tổ chức, HTX, nông hộ ---

  /v1/orgs:
    post:
      summary: Tạo tổ chức trong cây TW → Tỉnh → Xã; kind = cooperative kèm hồ sơ HTX, Mã HTX tự sinh
      operationId: partyCreateOrg
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PartyOrgInput"}
      responses:
        "201":
          description: Đã tạo; ghi sổ pf_party.org_event (action = created)
          headers:
            Location: {schema: {type: string}}
          content:
            application/json:
              schema:
                type: object
                required: [org, seq, representative_duplicate]
                properties:
                  org: {$ref: "#/components/schemas/PartyOrg"}
                  seq: {type: integer}
                  representative_duplicate: {type: boolean, description: "Người đại diện đã có trong kho định danh, dùng lại mã cũ"}
        "403": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
  /v1/orgs/{ref}/move:
    post:
      summary: Di chuyển một nút kèm cả nhánh con sang cha mới (sáp nhập đơn vị hành chính), giữ lịch sử
      operationId: partyMoveOrg
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                new_parent_ref: {type: [string, "null"], format: uuid, description: "null = đưa lên gốc"}
                new_admin_unit_code: {type: string, description: "Mã đơn vị mới sau sáp nhập; bỏ trống = giữ"}
                reason: {type: string, minLength: 10}
      responses:
        "200": {$ref: "#/components/responses/PartyOrgChanged"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/orgs/{ref}/rename:
    post:
      summary: Đổi tên tổ chức (ghi sổ, action = renamed)
      operationId: partyRenameOrg
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string, maxLength: 200}
                reason: {type: string}
      responses:
        "200": {$ref: "#/components/responses/PartyOrgChanged"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/orgs/{ref}/events:
    get:
      summary: Nhật ký biến động chỉ đọc, lưu vĩnh viễn (HTX US-HTXSTATUS-03)
      operationId: partyOrgEvents
      parameters:
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Theo seq tăng dần
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/PartyOrgEvent"}}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/cooperatives/{ref}/deactivate:
    post:
      summary: Vô hiệu hóa HTX (soft-delete) — lý do ≥ 20 ký tự; phát pf.party.org.deactivated để khóa tài khoản
      operationId: partyDeactivateCooperative
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string, minLength: 20}
      responses:
        "200": {$ref: "#/components/responses/PartyOrgChanged"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/cooperatives/{ref}/reactivate:
    post:
      summary: Kích hoạt lại HTX; phát pf.party.org.reactivated
      operationId: partyReactivateCooperative
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: {type: string}
      responses:
        "200": {$ref: "#/components/responses/PartyOrgChanged"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
  /v1/households/import:
    post:
      summary: Nhập nông hộ từ CSV (UTF-8, dòng đầu là tiêu đề), tối đa 200 dòng; kết quả theo từng dòng
      description: |
        Cột: full_name|ho_ten, phone|so_dien_thoai, national_id|cccd, address|dia_chi,
        cooperative_code|ma_htx, commune_code|ma_xa, cultivated_area_ha|dien_tich_ha,
        member_since|ngay_vao_htx. Bắt buộc: full_name, phone, cooperative_code.
        Thiếu cột bắt buộc → từ chối cả tệp (party.import_invalid).
      operationId: partyImportHouseholds
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          text/csv:
            schema: {type: string}
      responses:
        "200":
          description: Kết quả theo dòng
          content:
            application/json:
              schema:
                type: object
                required: [accepted, duplicate, rejected, rows]
                properties:
                  accepted: {type: integer}
                  duplicate: {type: integer}
                  rejected: {type: integer}
                  rows:
                    type: array
                    items:
                      type: object
                      required: [row, status, reason, household_ref]
                      properties:
                        row: {type: integer, description: "Số dòng trong tệp (dòng 1 là tiêu đề)"}
                        status: {type: string, enum: [accepted, duplicate, rejected]}
                        reason: {type: [string, "null"], description: "Không chứa dữ liệu cá nhân"}
                        household_ref: {type: [string, "null"], format: uuid}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  # --- hết pf/party ---

  # --- pf/sync --- (docs/dev/sync-contract.md)
  /v1/devices:
    get:
      summary: Liệt kê thiết bị của tenant (vai device_admin)
      operationId: syncListDevices
      parameters:
        - {name: actor_ref, in: query, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Một trang
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/SyncDeviceAdmin"}}
                  next_cursor: {type: [string, "null"]}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/devices/{id}/revoke:
    post:
      summary: Thu hồi thiết bị — mọi lời gọi đồng bộ sau đó trả 403 sync.device_revoked, app xóa dữ liệu cục bộ; phát pf.sync.device.revoked
      operationId: syncRevokeDevice
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string, minLength: 10, maxLength: 500}
      responses:
        "200":
          description: Đã thu hồi
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SyncDeviceAdmin"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {description: "sync.device_not_found", $ref: "#/components/responses/Problem"}
        "409": {description: "sync.device_already_revoked", $ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/sync/conflicts:
    get:
      summary: Sổ đăng ký xung đột đồng bộ (vai sync_conflict_resolver), SLA C-8
      operationId: syncListConflicts
      parameters:
        - {name: status, in: query, schema: {type: string, enum: [open, resolved]}}
        - {name: overdue, in: query, description: "true = chỉ mục đang mở đã quá due_at", schema: {type: boolean}}
        - {name: owner_org_ref, in: query, schema: {type: string, format: uuid}}
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Một trang
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/SyncConflict"}}
                  next_cursor: {type: [string, "null"]}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/sync/conflicts/{id}:
    get:
      operationId: syncGetConflict
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Xung đột
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SyncConflict"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {description: "sync.conflict_not_found", $ref: "#/components/responses/Problem"}
  /v1/sync/conflicts/{id}/resolve:
    post:
      summary: Đóng xung đột; phát pf.sync.conflict.resolved để module sở hữu entity áp quyết định bằng bản ghi bù
      operationId: syncResolveConflict
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note]
              properties:
                note: {type: string, minLength: 10, maxLength: 500}
                resolved_record_id: {type: string, format: uuid, description: "Bản ghi được giữ (tùy chọn)"}
      responses:
        "200":
          description: Đã đóng
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SyncConflict"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {description: "sync.conflict_state — đã đóng", $ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  # --- hết pf/sync ---

  # --- pf/mrv ---

  # Danh mục trường bằng chứng MRV có phiên bản + phê duyệt (R-56 dùng lại param_setter/param_approver).

  # Danh mục thương mại chưa chốt (C-1): thêm/đổi trường = phiên bản mới, không cần migration.
  /v1/mrv/catalog/seed:
    post:
      summary: Nạp danh mục mẫu G1 (awd_log, field_checklist) dạng NHÁP, provisional — loại đã có phiên bản thì bỏ qua
      operationId: seedMrvCatalog
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Kết quả theo loại minh chứng
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [evidence_type, created, version]
                      properties:
                        evidence_type: {type: string}
                        created: {type: boolean}
                        version: {oneOf: [{$ref: "#/components/schemas/MrvCatalogVersion"}, {type: "null"}]}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/mrv/catalog/versions:
    post:
      summary: Đề xuất phiên bản danh mục trường (vai param_setter) — số phiên bản tăng theo loại minh chứng
      operationId: proposeMrvCatalogVersion
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MrvCatalogInput"}
      responses:
        "201":
          description: Nháp đã tạo
          headers:
            Location: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MrvCatalogVersion"}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
    get:
      summary: Lịch sử phiên bản danh mục (mọi trạng thái)
      operationId: listMrvCatalogVersions
      parameters:
        - {name: evidence_type, in: query, schema: {type: string}}
        - {name: status, in: query, schema: {type: string, enum: [draft, submitted, approved, rejected]}}
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Một trang
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/MrvCatalogVersion"}}
                  next_cursor: {type: [string, "null"]}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/mrv/catalog/versions/{id}:
    get:
      operationId: getMrvCatalogVersion
      parameters:
        - $ref: "#/components/parameters/VersionID"
      responses:
        "200":
          description: Phiên bản
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MrvCatalogVersion"}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/mrv/catalog/versions/{id}/submit:
    post:
      summary: Gửi duyệt — chỉ người đặt
      operationId: submitMrvCatalogVersion
      parameters:
        - $ref: "#/components/parameters/VersionID"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Đã gửi duyệt
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MrvCatalogVersion"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
  /v1/mrv/catalog/versions/{id}/approve:
    post:
      summary: Phê duyệt (vai param_approver; không được là người đặt — self_approval_forbidden)
      operationId: approveMrvCatalogVersion
      parameters:
        - $ref: "#/components/parameters/VersionID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                note: {type: string, maxLength: 500}
      responses:
        "200":
          description: Đã duyệt — dùng được để thu minh chứng
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MrvCatalogVersion"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
  /v1/mrv/catalog/versions/{id}/reject:
    post:
      summary: Từ chối (vai param_approver; bắt buộc lý do)
      operationId: rejectMrvCatalogVersion
      parameters:
        - $ref: "#/components/parameters/VersionID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note]
              properties:
                note: {type: string, minLength: 5, maxLength: 500}
      responses:
        "200":
          description: Đã từ chối
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MrvCatalogVersion"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  # --- pf/content: soạn, duyệt, xuất bản tài liệu (content_editor_national, content_editor_province, content_reviewer) ---

  # Người duyệt xuất bản không được là tác giả phiên bản (R-56 → self_approval_forbidden).

  # TTKN tỉnh chỉ soạn phạm vi tỉnh/xã của mình, không soạn quy trình chuẩn quốc gia (KN BR-06).
  /v1/documents:
    get:
      summary: Tài liệu mọi trạng thái trong phạm vi người gọi (sắp theo ref giảm dần)
      operationId: adminListDocuments
      tags: [content]
      parameters:
        - {name: status, in: query, description: "Một hoặc nhiều trạng thái, phân tách bằng dấu phẩy", schema: {type: string}}
        - {name: kind, in: query, schema: {$ref: "#/components/schemas/ContentKind"}}
        - {name: tag, in: query, schema: {type: string}}
        - {name: category, in: query, schema: {type: string}}
        - {name: q, in: query, schema: {type: string}}
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Một trang
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/ContentAdminDocument"}}
                  next_cursor: {type: [string, "null"]}
        "403": {$ref: "#/components/responses/Problem"}
    post:
      summary: Tạo tài liệu ở trạng thái nháp (phiên bản 1). Tệp đính kèm tải sau, gắn bằng phiên bản mới.
      operationId: createDocument
      tags: [content]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/ContentInput"
                - type: object
                  required: [kind, audience]
                  properties:
                    kind: {$ref: "#/components/schemas/ContentKind"}
                    audience:
                      type: object
                      required: [level]
                      properties:
                        level: {type: string, enum: [national, province, commune]}
                        units: {type: array, items: {type: string}}
                    parent_ref: {type: [string, "null"], format: uuid, description: "Bắt buộc với supplement: quy trình chuẩn TW đã xuất bản"}
      responses:
        "201": {$ref: "#/components/responses/ContentDocumentVersion"}
        "403": {description: "forbidden, content.out_of_scope, content.kind_not_allowed", $ref: "#/components/responses/Problem"}
        "422": {description: "validation_failed, content.audience_invalid, content.tag_invalid, content.parent_invalid", $ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
  /v1/documents/extract:
    post:
      summary: Trích nội dung từ Word (.docx) để điền sẵn bản nháp — không lưu, không xuất bản (KN US-LIB-03, HTX US-CMS-02)
      operationId: extractDocument
      tags: [content]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary, description: "Tối đa 15 MB"}
      responses:
        "200":
          description: Nội dung trích (Markdown đã lọc)
          content:
            application/json:
              schema:
                type: object
                required: [title, body, body_format, status]
                properties:
                  title: {type: string}
                  body: {type: string}
                  body_format: {type: string, enum: [markdown]}
                  status: {type: string, enum: [draft_only]}
        "413": {description: content.file_too_large, $ref: "#/components/responses/Problem"}
        "415": {description: content.file_type_not_allowed, $ref: "#/components/responses/Problem"}
        "422": {description: "content.extract_unsupported (PDF, .doc), content.extract_failed (tệp lỗi, ảnh scan)", $ref: "#/components/responses/Problem"}
  /v1/documents/{ref}:
    parameters:
      - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      summary: Tài liệu (mọi trạng thái) và lịch sử phiên bản
      operationId: adminGetDocument
      tags: [content]
      responses:
        "200":
          description: Tài liệu
          content:
            application/json:
              schema:
                type: object
                required: [document, versions]
                properties:
                  document: {$ref: "#/components/schemas/ContentAdminDocument"}
                  versions: {type: array, items: {$ref: "#/components/schemas/ContentVersionInfo"}}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/documents/{ref}/versions:
    parameters:
      - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      summary: Thêm phiên bản nháp mới (ghi thêm vào sổ; bản đã xuất bản vẫn hiển thị tới khi bản mới được duyệt)
      operationId: createDocumentVersion
      tags: [content]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ContentInput"}
      responses:
        "201": {$ref: "#/components/responses/ContentDocumentVersion"}
        "409": {description: "content.invalid_transition — đang chờ duyệt hoặc đã gỡ", $ref: "#/components/responses/Problem"}
        "422": {description: "content.attachment_not_found, content.tag_invalid, validation_failed", $ref: "#/components/responses/Problem"}
  /v1/documents/{ref}/versions/{no}:
    parameters:
      - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: no, in: path, required: true, schema: {type: integer, minimum: 1}}
    get:
      summary: Một phiên bản đầy đủ — xem trước giao diện mobile trước khi xuất bản (HTX US-CMS-01)
      operationId: adminGetDocumentVersion
      tags: [content]
      responses:
        "200": {$ref: "#/components/responses/ContentDocumentVersion"}
        "404": {description: content.version_not_found, $ref: "#/components/responses/Problem"}
  /v1/documents/{ref}/attachments:
    parameters:
      - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      summary: Tải tệp đính kèm (PDF, .docx, JPEG/PNG/WebP, MP4; ≤ 15 MB) — lưu kho đối tượng ghi một lần, kiểm SHA-256
      operationId: uploadDocumentAttachment
      tags: [content]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, sha256]
              properties:
                file: {type: string, format: binary}
                sha256: {type: string, pattern: "^[0-9a-fA-F]{64}$", description: SHA-256 nội dung do client tính}
      responses:
        "201":
          description: Đã lưu
          content:
            application/json:
              schema:
                type: object
                required: [id, document_ref, file_name, content_type, size, sha256, created_at]
                properties:
                  id: {type: string, format: uuid}
                  document_ref: {type: string, format: uuid}
                  file_name: {type: string}
                  content_type: {type: string}
                  size: {type: integer}
                  sha256: {type: string}
                  created_at: {type: string, format: date-time}
        "413": {description: content.file_too_large, $ref: "#/components/responses/Problem"}
        "415": {description: content.file_type_not_allowed, $ref: "#/components/responses/Problem"}
        "422": {description: content.checksum_mismatch, $ref: "#/components/responses/Problem"}
        "503": {description: "content.dependency_unavailable — chưa cấu hình kho đối tượng", $ref: "#/components/responses/Problem"}
  /v1/documents/{ref}/submit:
    parameters:
      - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      summary: Gửi phiên bản nháp mới nhất đi duyệt (draft → review)
      operationId: submitDocument
      tags: [content]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody: {$ref: "#/components/requestBodies/ContentTransition"}
      responses:
        "200": {$ref: "#/components/responses/ContentDocumentState"}
        "409": {description: content.invalid_transition, $ref: "#/components/responses/Problem"}
  /v1/documents/{ref}/return:
    parameters:
      - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      summary: Người duyệt trả lại phiên bản đang chờ duyệt, lý do ≥ 10 ký tự
      operationId: returnDocument
      tags: [content]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody: {$ref: "#/components/requestBodies/ContentTransition"}
      responses:
        "200": {$ref: "#/components/responses/ContentDocumentState"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/documents/{ref}/publish:
    parameters:
      - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      summary: Xuất bản phiên bản đang chờ duyệt; phát pf.content.document.published (và pf.content.alert.published với cảnh báo)
      operationId: publishDocument
      tags: [content]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody: {$ref: "#/components/requestBodies/ContentTransition"}
      responses:
        "200": {$ref: "#/components/responses/ContentDocumentVersion"}
        "403": {description: "self_approval_forbidden (tác giả tự duyệt), content.out_of_scope", $ref: "#/components/responses/Problem"}
        "409": {description: content.invalid_transition, $ref: "#/components/responses/Problem"}
        "422": {description: "validation_failed (BR-05 thiếu phân loại, tin thiếu chuyên mục), content.parent_invalid", $ref: "#/components/responses/Problem"}
  /v1/documents/{ref}/retire:
    parameters:
      - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      summary: Gỡ tài liệu (ẩn với người đọc, máy nhận tombstone); lý do ≥ 10 ký tự. Không xóa phiên bản nào.
      operationId: retireDocument
      tags: [content]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody: {$ref: "#/components/requestBodies/ContentTransition"}
      responses:
        "200": {$ref: "#/components/responses/ContentDocumentState"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/documents/{ref}/duplicate:
    parameters:
      - {name: ref, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      summary: Nhân bản thành tài liệu nháp mới, giữ nội dung, ảnh bìa, chuyên mục (HTX US-CMS-02 AC-1)
      operationId: duplicateDocument
      tags: [content]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "201": {$ref: "#/components/responses/ContentDocumentVersion"}
        "404": {$ref: "#/components/responses/Problem"}
  # --- hết pf/content ---

  # --- pf/geo ---
  /v1/geo/plots/import:
    post:
      summary: Nhập tệp ranh giới thửa GeoJSON/KML (KN US-PLOT-02, GIS FN-05) — mỗi vùng thành một thửa, cùng quy tắc như vẽ tay; kết quả theo từng đối tượng
      description: |
        Thân request là nội dung tệp (≤ 200 đối tượng, xử lý đồng bộ). Chỉ nhận WGS84 (EPSG:4326):
        thành phần crs khác hoặc toạ độ ngoài miền kinh/vĩ độ (VN-2000/UTM) → 422 geo.crs_unsupported.
        Shapefile chưa hỗ trợ → 422 geo.format_unsupported. Thuộc tính đối tượng được đọc:
        name, commune_code (hoặc ma_xa), cooperative_ref, household_ref. Idem_key từng đối tượng =
        Idempotency-Key + ":" + thứ tự, nên nhập lại cùng khóa trả duplicate, không tạo trùng.
      operationId: importPlotBoundaries
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - {name: format, in: query, schema: {type: string, enum: [geojson, kml, shapefile]}, description: "Bỏ trống → nhận từ file_name hoặc nội dung"}
        - {name: file_name, in: query, schema: {type: string}}
        - {name: commune_code, in: query, schema: {type: string}, description: "Mặc định khi đối tượng không có commune_code"}
        - {name: cooperative_ref, in: query, schema: {type: string, format: uuid}, description: "Mặc định khi đối tượng không có cooperative_ref"}
        - {name: source, in: query, schema: {type: string, enum: [import_file, cadastral], default: import_file}}
        - {name: confirm_overlap, in: query, schema: {type: boolean, default: false}, description: "Nhận cả đối tượng chồng lấn cùng HTX/thửa nháp (mở xung đột xem xét); chồng lấn HTX khác luôn bị loại"}
      requestBody:
        required: true
        content:
          application/geo+json: {schema: {type: object}}
          application/json: {schema: {type: object}}
          application/vnd.google-earth.kml+xml: {schema: {type: string}}
      responses:
        "200":
          description: Kết quả theo đối tượng
          content:
            application/json:
              schema:
                type: object
                required: [format, accepted, flagged, duplicate, rejected, features]
                properties:
                  format: {type: string, enum: [geojson, kml]}
                  accepted: {type: integer}
                  flagged: {type: integer, description: "Đã tạo, chồng lấn cùng HTX/thửa nháp đã xác nhận — chờ xem xét"}
                  duplicate: {type: integer}
                  rejected: {type: integer}
                  features:
                    type: array
                    items:
                      type: object
                      required: [index, name, status, code, reason, plot_ref, plot_code, area_ha, flagged_overlaps]
                      properties:
                        index: {type: integer}
                        name: {type: [string, "null"]}
                        status: {type: string, enum: [accepted, flagged, duplicate, rejected]}
                        code: {type: [string, "null"], description: "Mã lỗi khi rejected, vd geo.too_few_points, geo.overlap_cross_coop, geo.overlap_needs_confirm"}
                        reason: {type: [string, "null"]}
                        plot_ref: {type: [string, "null"], format: uuid}
                        plot_code: {type: [string, "null"]}
                        area_ha: {type: [string, "null"]}
                        flagged_overlaps: {type: array, items: {type: object}}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/geo/admin-boundaries/import:
    post:
      summary: Nhập ranh giới hành chính tỉnh/xã từ GeoJSON (GIS FN-07 BR-26/27); dry_run=true để kiểm và xem trước, chưa áp dụng
      description: |
        Mỗi Feature phải có properties.code là mã đơn vị còn hiệu lực trong pf/masterdata (cấp tỉnh hoặc xã).
        Nhập lại một mã: hình cũ được đóng (không xóa), hình mới là hiện hành. Hình xã dùng để kiểm thửa nằm trong địa giới xã.
      operationId: importAdminBoundaries
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - {name: source, in: query, required: true, schema: {type: string, maxLength: 300}, description: "Nguồn dữ liệu, vd CloudMap 2026-09"}
        - {name: dry_run, in: query, schema: {type: boolean, default: false}}
      requestBody:
        required: true
        content:
          application/geo+json: {schema: {type: object}}
          application/json: {schema: {type: object}}
      responses:
        "200":
          description: Kết quả theo đơn vị
          content:
            application/json:
              schema:
                type: object
                required: [dry_run, accepted, rejected, features]
                properties:
                  dry_run: {type: boolean}
                  accepted: {type: integer}
                  rejected: {type: integer}
                  features:
                    type: array
                    items:
                      type: object
                      required: [index, code, name, level, status, replaced, error_code, reason, area_ha]
                      properties:
                        index: {type: integer}
                        code: {type: [string, "null"]}
                        name: {type: [string, "null"]}
                        level: {type: [string, "null"], enum: [province, commune, null]}
                        status: {type: string, enum: [accepted, rejected]}
                        replaced: {type: boolean}
                        error_code: {type: [string, "null"]}
                        reason: {type: [string, "null"]}
                        area_ha: {type: [string, "null"]}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  # --- hết pf/geo ---
components:
  securitySchemes:
    oidc:
      type: openIdConnect
      openIdConnectUrl: https://auth.agrigreen.vn/realms/agrigreen/.well-known/openid-configuration
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, pattern: "^[A-Za-z0-9._:-]{8,200}$"}
    Catalog:
      name: catalog
      in: path
      required: true
      schema: {type: string, enum: [rice_variety, farm_stage, machine_type, season, pest]}
    ItemCode:
      name: code
      in: path
      required: true
      schema: {type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]{0,39}$"}
    VersionID:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
    Cursor:
      name: cursor
      in: query
      schema: {type: string}
    Limit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 200, default: 50}
  responses:
    Problem:
      description: RFC 9457
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    PartyOrgChanged:
      description: Trạng thái sau biến động và dòng sổ vừa ghi
      content:
        application/json:
          schema:
            type: object
            required: [org, event, active_households]
            properties:
              org: {$ref: "#/components/schemas/PartyOrg"}
              event: {$ref: "#/components/schemas/PartyOrgEvent"}
              active_households: {type: integer, description: "Số nông hộ đang là thành viên (cảnh báo phạm vi ảnh hưởng khi vô hiệu hóa)"}
    ContentDocumentVersion:
      description: Tài liệu và một phiên bản (phiên bản vừa ghi, vừa xuất bản hoặc được xem trước)
      content:
        application/json:
          schema:
            type: object
            required: [document, version]
            properties:
              document: {$ref: "#/components/schemas/ContentAdminDocument"}
              version: {$ref: "#/components/schemas/ContentVersion"}
    ContentDocumentState:
      description: Trạng thái tài liệu sau chuyển trạng thái
      content:
        application/json:
          schema:
            type: object
            required: [document]
            properties:
              document: {$ref: "#/components/schemas/ContentAdminDocument"}
  schemas:
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: {type: string, format: uri}
        title: {type: string}
        status: {type: integer}
        code: {type: string}
        detail: {type: string}
        instance: {type: string}
        trace_id: {type: string}
        errors:
          type: array
          items:
            type: object
            properties:
              field: {type: string}
              reason: {type: string}
    GazetteerFile:
      type: object
      required: [format, source, units]
      additionalProperties: false
      properties:
        format: {type: string, const: agrigreen.admin_units/v1}
        source: {type: string, maxLength: 300, description: "Nguồn dữ liệu (văn bản, tệp gốc)"}
        note: {type: string}
        units:
          type: array
          minItems: 1
          maxItems: 5000
          items:
            type: object
            required: [code, name, level, valid_from]
            additionalProperties: false
            properties:
              code: {type: string, pattern: "^[0-9A-Z][0-9A-Z.-]{0,39}$"}
              name: {type: string, maxLength: 200}
              level: {type: string, enum: [province, commune, district], description: "district chỉ cho dữ liệu lịch sử, valid_to ≤ 2025-07-01"}
              parent_code: {type: string}
              valid_from: {type: string, format: date}
              valid_to: {type: string, format: date, description: "Không bao gồm; bỏ trống = còn hiệu lực"}
              successors: {type: array, items: {type: string}, description: "Đơn vị kế thừa, phải có hiệu lực tại valid_to"}
    ImportResult:
      type: object
      required: [created, closed, unchanged]
      properties:
        created: {type: integer}
        closed: {type: integer}
        unchanged: {type: integer}
    CatalogItemInput:
      type: object
      required: [name]
      properties:
        code: {type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]{0,39}$", description: "Bắt buộc khi thêm; khi sửa bỏ trống hoặc trùng mã trên đường dẫn"}
        name: {type: string, maxLength: 200}
        attrs:
          type: object
          additionalProperties: {type: string}
          description: |
            Theo danh mục — rice_variety: growth_days, expected_yield_t_per_ha (decimal); farm_stage: pilot (true|false, cờ thí điểm CGH), description;
            machine_type: farm_stage (mã khâu đang dùng); season: start_month, end_month; pest: kind (sau_hai|benh_hai|dong_vat_hai|co_dai).
    CatalogItem:
      type: object
      required: [catalog, code, name, attrs, active, deactivation_reason, revision, updated_at]
      properties:
        catalog: {type: string}
        code: {type: string}
        name: {type: string}
        attrs: {type: object, additionalProperties: {type: string}}
        active: {type: boolean}
        deactivation_reason: {type: [string, "null"]}
        revision: {type: integer}
        updated_at: {type: string, format: date-time}
    ReasonInput:
      type: object
      properties:
        reason: {type: string, minLength: 10, maxLength: 500}
    CatalogSnapshot:
      type: object
      properties:
        name: {type: string}
        attrs: {type: object, additionalProperties: {type: string}}
        active: {type: boolean}
        deactivation_reason: {type: string}
    CatalogChange:
      type: object
      required: [id, action, before, after, reason, event_time, actor_ref, seq, recorded_at]
      properties:
        id: {type: string, format: uuid}
        action: {type: string, enum: [created, updated, deactivated, reactivated]}
        before: {oneOf: [{$ref: "#/components/schemas/CatalogSnapshot"}, {type: "null"}]}
        after: {$ref: "#/components/schemas/CatalogSnapshot"}
        reason: {type: [string, "null"]}
        event_time: {type: string, format: date-time}
        actor_ref: {type: string, format: uuid}
        seq: {type: integer}
        recorded_at: {type: string, format: date-time}
    ParamProposal:
      type: object
      required: [key, effective_from, source_doc]
      properties:
        key: {type: string, maxLength: 200, pattern: "^[a-z][a-z0-9_]*(\\.[a-z0-9_]+)+(:[A-Za-z0-9_.-]+)*$", examples: ["cgh.norm_ha_per_machine:MGD:thu_hoach"]}
        value: {type: [string, number], description: "Số thập phân (chuỗi khuyến nghị); đọc thẳng thành decimal, không qua float. Loại trừ với text."}
        text: {type: string, maxLength: 1000}
        unit: {type: string, maxLength: 30}
        effective_from: {type: string, description: "RFC 3339, hoặc YYYY-MM-DD = 00:00 giờ Việt Nam"}
        source_doc: {type: string, maxLength: 300, description: "Số/ngày văn bản ban hành (bắt buộc — CGH FN-02 B3)"}
        correction_reason: {type: string, minLength: 10}
    ParamVersion:
      type: object
      required: [id, key, version, value, text, unit, effective_from, source_doc, status, setter_ref, created_at]
      properties:
        id: {type: string, format: uuid}
        key: {type: string}
        version: {type: integer, minimum: 1}
        value: {type: [string, "null"]}
        text: {type: [string, "null"]}
        unit: {type: string}
        effective_from: {type: string, format: date-time}
        source_doc: {type: string}
        correction_reason: {type: [string, "null"]}
        status: {type: string, enum: [draft, submitted, approved, rejected]}
        setter_ref: {type: string, format: uuid}
        submitted_at: {type: [string, "null"], format: date-time}
        approver_ref: {type: [string, "null"], format: uuid}
        decided_at: {type: [string, "null"], format: date-time}
        decision_note: {type: [string, "null"]}
        created_at: {type: string, format: date-time}
    DecisionInput:
      type: object
      properties:
        note: {type: string, maxLength: 500, description: "Bắt buộc (≥ 10 ký tự) khi từ chối"}
    PartyOrg:
      type: object
      required: [ref, kind, code, name, admin_unit_code, parent_ref, representative_ref, active]
      properties:
        ref: {type: string, format: uuid}
        kind: {type: string, enum: [ttkn_national, ttkn_province, extension_team, dcrd, cooperative, mkg, partner]}
        code: {type: string}
        name: {type: string}
        admin_unit_code: {type: [string, "null"]}
        parent_ref: {type: [string, "null"], format: uuid}
        representative_ref: {type: [string, "null"], format: uuid}
        active: {type: boolean}
    PartyOrgInput:
      type: object
      required: [kind, name]
      properties:
        kind: {type: string, enum: [ttkn_national, ttkn_province, extension_team, dcrd, cooperative, mkg, partner]}
        code: {type: string, maxLength: 40, description: "Bắt buộc trừ HTX; HTX không được gửi (Mã HTX tự sinh)"}
        name: {type: string, maxLength: 200}
        admin_unit_code: {type: string, description: "Tỉnh với ttkn_province; xã với extension_team và cooperative"}
        parent_ref: {type: string, format: uuid}
        representative_ref: {type: string, format: uuid, description: "Mã tham chiếu đã có trong kho định danh"}
        representative:
          type: object
          description: Hoặc gửi định danh người đại diện — chuyển thẳng vào kho định danh, không lưu ở pf_party
          required: [full_name, phone]
          properties:
            full_name: {type: string}
            phone: {type: string}
        cooperative:
          type: object
          properties:
            tax_code: {type: string, description: "10 hoặc 13 chữ số; duy nhất trong tenant"}
            area_ha: {type: string, description: "Decimal dạng chuỗi"}
            established_on: {type: string, format: date}
            location:
              type: object
              required: [lat, lon]
              properties:
                lat: {type: string}
                lon: {type: string}
    PartyOrgEvent:
      type: object
      required: [seq, action, event_time, recorded_at, actor_ref, reason, name, admin_unit_code, parent_ref, prev_parent_ref, prev_admin_unit_code, active]
      properties:
        seq: {type: integer}
        action: {type: string, enum: [created, moved, renamed, deactivated, reactivated]}
        event_time: {type: string, format: date-time}
        recorded_at: {type: string, format: date-time}
        actor_ref: {type: string, format: uuid}
        reason: {type: [string, "null"]}
        name: {type: string}
        admin_unit_code: {type: [string, "null"]}
        parent_ref: {type: [string, "null"], format: uuid}
        prev_parent_ref: {type: [string, "null"], format: uuid}
        prev_admin_unit_code: {type: [string, "null"]}
        active: {type: boolean}
        details: {type: object, description: "Hồ sơ HTX lúc tạo (không PII)"}
    # --- pf/sync ---

    SyncDeviceAdmin:
      type: object
      required: [device_id, registered_at, platform, app_version, revoked, actor_ref]
      properties:
        device_id: {type: string, format: uuid}
        registered_at: {type: string, format: date-time}
        platform: {type: string, enum: [android, ios]}
        app_version: {type: string}
        revoked: {type: boolean}
        actor_ref: {type: string, format: uuid}
        org_ref: {type: string, format: uuid}
        last_seen_at: {type: string, format: date-time}
        revoked_at: {type: string, format: date-time}
        revoke_reason: {type: string}
    SyncConflict:
      type: object
      required: [conflict_id, entity, first_record_id, device_id, reported_by, owner_org_ref, opened_at, due_at, status, overdue, resolved_at, resolved_by, resolution_note, resolved_record_id]
      properties:
        conflict_id: {type: string, format: uuid}
        entity: {type: string}
        first_record_id: {type: string, format: uuid}
        device_id: {type: string, format: uuid}
        reported_by: {type: string, format: uuid}
        owner_org_ref: {type: [string, "null"], format: uuid, description: "Đơn vị phụ trách xử lý (đơn vị của người gửi)"}
        opened_at: {type: string, format: date-time}
        due_at: {type: string, format: date-time, description: "opened_at + sync.conflict_sla_hours (mặc định 72, C-8)"}
        status: {type: string, enum: [open, resolved]}
        overdue: {type: boolean}
        resolved_at: {type: [string, "null"], format: date-time}
        resolved_by: {type: [string, "null"], format: uuid}
        resolution_note: {type: [string, "null"]}
        resolved_record_id: {type: [string, "null"], format: uuid}
    MrvFieldInput:
      type: object
      required: [key, label_vi, data_type]
      properties:
        key: {type: string, pattern: "^[a-z][a-z0-9_]{1,62}$", description: "Khóa dành riêng plot_ref/season (text), gps (geo_point), photo (photo) lấy giá trị từ cột riêng"}
        label_vi: {type: string, maxLength: 200}
        data_type: {type: string, enum: [decimal, integer, boolean, enum, date, photo, geo_point, text]}
        unit: {type: string, maxLength: 20, description: "Chỉ decimal/integer"}
        required: {type: boolean, default: false}
        min: {type: string, description: "Số thập phân dạng chuỗi; photo = số ảnh, text = độ dài"}
        max: {type: string}
        max_scale: {type: integer, minimum: 0, maximum: 8}
        enum_values: {type: array, items: {type: string, pattern: "^[a-z0-9][a-z0-9_.-]{0,62}$"}}
        help_vi: {type: string, maxLength: 500}
    MrvCatalogInput:
      type: object
      required: [evidence_type, source_note, fields]
      properties:
        evidence_type: {type: string, pattern: "^[a-z][a-z0-9_]{2,39}$"}
        provisional: {type: boolean, default: false, description: "Danh mục tạm, chờ chốt C-1"}
        source_note: {type: string, maxLength: 500}
        fields: {type: array, minItems: 1, maxItems: 100, items: {$ref: "#/components/schemas/MrvFieldInput"}}
    MrvField:
      type: object
      required: [key, label_vi, data_type, unit, required, min, max, max_scale, enum_values, help_vi, position, reserved]
      properties:
        key: {type: string}
        label_vi: {type: string}
        data_type: {type: string}
        unit: {type: [string, "null"]}
        required: {type: boolean}
        min: {type: [string, "null"]}
        max: {type: [string, "null"]}
        max_scale: {type: [integer, "null"]}
        enum_values: {type: array, items: {type: string}}
        help_vi: {type: [string, "null"]}
        position: {type: integer}
        reserved: {type: boolean}
    MrvCatalogVersion:
      type: object
      required: [id, evidence_type, version, status, provisional, source_note, fields, setter_ref, approver_ref, submitted_at, decided_at, decision_note, created_at]
      properties:
        id: {type: string, format: uuid}
        evidence_type: {type: string}
        version: {type: integer}
        status: {type: string, enum: [draft, submitted, approved, rejected]}
        provisional: {type: boolean}
        source_note: {type: string}
        fields: {type: array, items: {$ref: "#/components/schemas/MrvField"}}
        setter_ref: {type: string, format: uuid}
        approver_ref: {type: [string, "null"], format: uuid}
        submitted_at: {type: [string, "null"], format: date-time}
        decided_at: {type: [string, "null"], format: date-time}
        decision_note: {type: [string, "null"]}
        created_at: {type: string, format: date-time}
    ContentKind:
      type: string
      enum: [procedure, guide, news, alert, supplement]
      description: procedure = quy trình kỹ thuật chuẩn quốc gia; supplement = hướng dẫn đặc thù địa phương gắn quy trình gốc; alert = cảnh báo khẩn (phát thông báo đẩy theo vùng)
    ContentAudience:
      type: object
      required: [level, units]
      properties:
        level: {type: string, enum: [national, province, commune]}
        units: {type: array, items: {type: string}, description: "Rỗng với national; [mã tỉnh] với province; mã các xã (cùng tỉnh) với commune"}
        province_code: {type: [string, "null"], description: Tỉnh sở hữu (chỉ đọc)}
    ContentDocument:
      type: object
      required: [ref, kind, audience, status, tags]
      properties:
        ref: {type: string, format: uuid}
        kind: {$ref: "#/components/schemas/ContentKind"}
        audience: {$ref: "#/components/schemas/ContentAudience"}
        parent_ref: {type: [string, "null"], format: uuid}
        status: {type: string, enum: [draft, review, published, retired]}
        title: {type: [string, "null"], description: Tiêu đề của bản xuất bản hiện hành}
        summary: {type: [string, "null"]}
        category: {type: [string, "null"]}
        tags: {type: array, items: {type: string}}
        published_version_no: {type: [integer, "null"]}
        published_at: {type: [string, "null"], format: date-time}
        publisher_ref: {type: [string, "null"], format: uuid}
        retired_at: {type: [string, "null"], format: date-time}
        retire_reason: {type: [string, "null"]}
    ContentAttachment:
      type: object
      required: [id, file_name, content_type, size, sha256, role]
      properties:
        id: {type: string, format: uuid}
        file_name: {type: string}
        content_type: {type: string, enum: [application/pdf, application/vnd.openxmlformats-officedocument.wordprocessingml.document, image/jpeg, image/png, image/webp, video/mp4]}
        size: {type: integer, maximum: 15728640}
        sha256: {type: string, pattern: "^[0-9a-f]{64}$"}
        role: {type: string, enum: [attachment, cover]}
        url: {type: [string, "null"], description: "URL tải có hạn; không ghi log (R-92)"}
        url_expires_at: {type: [string, "null"], format: date-time}
    ContentVersion:
      type: object
      required: [id, version_no, status, title, body, body_format, tags, attachments]
      properties:
        id: {type: string, format: uuid}
        version_no: {type: integer, minimum: 1}
        status: {type: string, enum: [draft, review, published, superseded, discarded, returned]}
        title: {type: string}
        summary: {type: string}
        body: {type: string, description: "Đã qua bộ lọc allow-list (không script, không on*, liên kết chỉ http/https/mailto/att:<id>). Client hiển thị Markdown ở chế độ tắt HTML thô."}
        body_format: {type: string, enum: [markdown, html]}
        category: {type: [string, "null"]}
        tags: {type: array, items: {type: string}}
        author_ref: {type: string, format: uuid}
        recorded_at: {type: string, format: date-time}
        attachments: {type: array, items: {$ref: "#/components/schemas/ContentAttachment"}}
    ContentVersionInfo:
      type: object
      required: [version_no, id, status, title, author_ref, recorded_at]
      properties:
        version_no: {type: integer}
        id: {type: string, format: uuid}
        status: {type: string, enum: [draft, review, published, superseded, discarded, returned]}
        title: {type: string}
        author_ref: {type: string, format: uuid}
        recorded_at: {type: string, format: date-time}
        published_at: {type: [string, "null"], format: date-time}
        publisher_ref: {type: [string, "null"], format: uuid}
        return_reason: {type: [string, "null"]}
    ContentAdminDocument:
      allOf:
        - $ref: "#/components/schemas/ContentDocument"
        - type: object
          required: [created_by, created_at, updated_at, last_version_no]
          properties:
            created_by: {type: string, format: uuid}
            created_at: {type: string, format: date-time}
            updated_at: {type: string, format: date-time}
            last_version_no: {type: integer}
            working_version_no: {type: [integer, "null"]}
            working_status: {type: [string, "null"], enum: [draft, review, null]}
    ContentInput:
      type: object
      required: [title]
      properties:
        title: {type: string, maxLength: 300}
        summary: {type: string, maxLength: 2000}
        body: {type: string, description: "Tối đa 512 KB; được lọc allow-list khi lưu"}
        body_format: {type: string, enum: [markdown, html], default: markdown}
        category: {type: string, enum: [technique, pest_warning, policy, market, event]}
        tags: {type: array, maxItems: 20, items: {type: string, description: "'<danh mục>:<mã>', danh mục thuộc rice_variety, farm_stage, season, pest"}}
        attachments:
          type: array
          maxItems: 30
          items:
            type: object
            required: [id]
            properties:
              id: {type: string, format: uuid, description: Tệp đã tải lên cho tài liệu hoặc có trong phiên bản gần nhất}
              role: {type: string, enum: [attachment, cover], default: attachment}
    # --- hết pf/content ---
  requestBodies:
    ContentTransition:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              version_no: {type: integer, minimum: 1, description: "Bắt buộc với submit/return/publish"}
              reason: {type: string, minLength: 10, description: "Bắt buộc với return/retire"}
