        geometry: {$ref: "#/components/schemas/WaterwayLineString"}
        width_m: {$ref: "#/components/schemas/WaterwayMeasure"}
        depth_m: {$ref: "#/components/schemas/WaterwayMeasure"}
        max_load_tons: {$ref: "#/components/schemas/WaterwayMeasure"}
        data_source: {type: string, enum: [digitised, official, survey, osm], default: digitised}
        note: {type: [string, "null"], maxLength: 1000}
        event_time: {type: string, format: date-time}
    WaterwayRevision:
      type: object
      required: [expected_revision, reason]
      properties:
        expected_revision: {type: integer, minimum: 1, description: "Số sửa hiện hành mà bản sửa dựa vào"}
        reason: {type: string, minLength: 5, maxLength: 500}
    WaterwaySegment:
      type: object
      required: [segment_ref, id, revision, name, waterway_class, status, geometry, length_m, width_m, depth_m, max_load_tons, data_source, note, event_time, recorded_at, supersedes_id, correction_reason, actor_ref, seq]
      properties:
        segment_ref: {type: string, format: uuid}
        id: {type: string, format: uuid, description: "id của bản sửa"}
        revision: {type: integer}
        name: {type: string}
        waterway_class: {type: string, enum: [kenh_chinh, noi_dong, muong, song]}
        status: {type: string, enum: [draft, confirmed, retired]}
        geometry: {$ref: "#/components/schemas/WaterwayLineString"}
        length_m: {type: string, description: "Geodesic, CSDL tính (US-WATER-02 AC-1)"}
        width_m: {type: [string, "null"]}
        depth_m: {type: [string, "null"], description: "Độ sâu khống chế mùa khô"}
        max_load_tons: {type: [string, "null"], description: "Tải trọng khai báo"}
        data_source: {type: string}
        note: {type: [string, "null"]}
        event_time: {type: string, format: date-time}
        recorded_at: {type: string, format: date-time}
        supersedes_id: {type: [string, "null"], format: uuid}
        correction_reason: {type: [string, "null"]}
        actor_ref: {type: string, format: uuid}
        seq: {type: integer}
    WaterwayStructureInput:
      type: object
      required: [kind, name, segment_ref, location]
      properties:
        kind: {type: string, enum: [cau, cong, au_thuyen, duong_day_dien]}
        name: {type: string, maxLength: 200}
        status: {type: string, enum: [active, retired], default: active}
        segment_ref: {type: string, format: uuid}
        location: {$ref: "#/components/schemas/WaterwayLocation"}
        clearance_height_m: {$ref: "#/components/schemas/WaterwayMeasure"}
        clearance_width_m: {$ref: "#/components/schemas/WaterwayMeasure"}
        depth_m: {$ref: "#/components/schemas/WaterwayMeasure"}
        survey_date: {type: string, format: date}
        data_source: {type: string, enum: [digitised, official, survey, osm], default: survey}
        note: {type: [string, "null"], maxLength: 1000}
        event_time: {type: string, format: date-time}
    WaterwayStructure:
      type: object
      required: [structure_ref, id, revision, kind, name, status, segment_ref, location, clearance_height_m, clearance_width_m, depth_m, survey_date, data_source, note, event_time, recorded_at, supersedes_id, correction_reason, actor_ref]
      properties:
        structure_ref: {type: string, format: uuid}
        id: {type: string, format: uuid}
        revision: {type: integer}
        kind: {type: string, enum: [cau, cong, au_thuyen, duong_day_dien]}
        name: {type: string}
        status: {type: string, enum: [active, retired]}
        segment_ref: {type: string, format: uuid}
        location: {$ref: "#/components/schemas/WaterwayLocation"}
        clearance_height_m: {type: [string, "null"]}
        clearance_width_m: {type: [string, "null"]}
        depth_m: {type: [string, "null"]}
        survey_date: {type: [string, "null"], format: date}
        data_source: {type: string}
        note: {type: [string, "null"]}
        event_time: {type: string, format: date-time}
        recorded_at: {type: string, format: date-time}
        supersedes_id: {type: [string, "null"], format: uuid}
        correction_reason: {type: [string, "null"]}
        actor_ref: {type: string, format: uuid}
    WaterwayBuildParams:
      type: object
      description: Ảnh chụp tham số dựng (số thập phân dạng chuỗi)
      properties:
        tolerances:
          type: object
          properties:
            snap_m: {type: string}
            auto_join_max_m: {type: string}
            report_gap_max_m: {type: string}
            on_segment_m: {type: string}
        safety:
          type: object
          properties:
            width_factor: {type: string}
            under_keel_m: {type: string}
            air_gap_m: {type: string}
        vessels:
          type: array
          items:
            type: object
            properties:
              code: {type: string}
              tons: {type: string}
              beam_m: {type: string}
              draft_m: {type: string}
              air_draft_m: {type: string}
    WaterwayBuild:
      type: object
      required: [id, status, requested_by, requested_at, network_version_no, reused, error_code, completed_at, params]
      properties:
        id: {type: string, format: uuid}
        status: {type: string, enum: [queued, completed, failed]}
        requested_by: {type: string, format: uuid}
        requested_at: {type: string, format: date-time, description: "Mốc as_of của sổ đoạn/công trình"}
        network_version_no: {type: [integer, "null"]}
        reused: {type: [boolean, "null"]}
        error_code: {type: [string, "null"]}
        completed_at: {type: [string, "null"], format: date-time}
        params: {$ref: "#/components/schemas/WaterwayBuildParams"}
    WaterwayNetworkVersion:
      type: object
      required: [id, version_no, status, segment_set_sha256, graph_sha256, rule_version, as_of, segment_count, structure_count, vertex_count, edge_count, component_count, finding_count, build_id, built_by, built_at, published_by, published_at, effective_from, superseded_at, params]
      properties:
        id: {type: string, format: uuid}
        version_no: {type: integer}
        status: {type: string, enum: [built, published, superseded]}
        segment_set_sha256: {type: string}
        graph_sha256: {type: string}
        rule_version: {type: string}
        as_of: {type: string, format: date-time}
        segment_count: {type: integer}
        structure_count: {type: integer}
        vertex_count: {type: integer}
        edge_count: {type: integer}
        component_count: {type: integer}
        finding_count: {type: integer}
        build_id: {type: string, format: uuid}
        built_by: {type: string, format: uuid}
        built_at: {type: string, format: date-time}
        published_by: {type: [string, "null"], format: uuid}
        published_at: {type: [string, "null"], format: date-time}
        effective_from: {type: [string, "null"], format: date-time}
        superseded_at: {type: [string, "null"], format: date-time}
        params: {$ref: "#/components/schemas/WaterwayBuildParams"}
    WaterwayFinding:
      type: object
      required: [id, kind, segment_refs, location, gap_m, auto_fixed, message]
      properties:
        id: {type: integer}
        kind: {type: string, enum: [crossing, t_join, gap_joined, gap_reported, dangling, isolated]}
        segment_refs: {type: array, items: {type: string, format: uuid}}
        location: {$ref: "#/components/schemas/WaterwayLocation"}
        gap_m: {type: [string, "null"]}
        auto_fixed: {type: boolean}
        message: {type: string}
    # --- hết pf/waterway ---

    # --- pf/cropcycle ---
    CropSOPStep:
      type: object
      required: [seq, name, activity_code, day_offset, window_days, mandatory]
      properties:
        seq: {type: integer, minimum: 1, description: "Liên tục 1..n (HTX US-CAT-01 AC-6)"}
        name: {type: string, maxLength: 200}
        stage_code: {type: string}
        activity_code: {type: string, enum: [lam_dat, gieo_sa, tuoi_nuoc, bon_phan, phun_thuoc, kiem_tra, thu_hoach]}
        day_offset: {type: integer, minimum: -60, maximum: 365, description: "Ngày so với ngày gieo sạ"}
        window_days: {type: integer, minimum: 0, maximum: 60}
        mandatory: {type: boolean}
        evidence_kinds: {type: array, items: {type: string, enum: [anh_hien_truong, hoa_don_vat_tu, phieu_kiem_nghiem, ghi_chu, khac]}}
        phi_days: {type: integer, minimum: 0, maximum: 120, description: "Thời gian cách ly sau phun thuốc"}
        instruction: {type: string}
    CropSOPTemplate:
      type: object
      required: [ref, code, name, crop, scope, status, latest_version]
      properties:
        ref: {type: string, format: uuid}
        code: {type: string}
        name: {type: string}
        crop: {type: string}
        scope: {type: string, enum: [system, htx]}
        cooperative_ref: {type: [string, "null"], format: uuid}
        standard: {type: [string, "null"]}
        description: {type: [string, "null"]}
        status: {type: string, enum: [draft, published, retired]}
        status_reason: {type: [string, "null"]}
        source_template_ref: {type: [string, "null"], format: uuid}
        latest_version: {type: integer}
        published_version: {type: [integer, "null"]}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    CropSOPVersion:
      type: object
      required: [id, template_ref, version_no, status, steps]
      properties:
        id: {type: string, format: uuid}
        template_ref: {type: string, format: uuid}
        version_no: {type: integer}
        status: {type: string, enum: [draft, published]}
        steps: {type: array, items: {$ref: "#/components/schemas/CropSOPStep"}}
        harvest_day_offset: {type: [integer, "null"]}
        harvest_window_days: {type: [integer, "null"]}
        source_version_ref: {type: [string, "null"], format: uuid}
        change_note: {type: [string, "null"]}
        authored_by: {type: string, format: uuid}
        authored_at: {type: string, format: date-time}
        published_by: {type: [string, "null"], format: uuid}
        published_at: {type: [string, "null"], format: date-time}
    CropSOP:
      allOf:
        - $ref: "#/components/schemas/CropSOPTemplate"
        - type: object
          required: [versions]
          properties:
            versions: {type: array, items: {$ref: "#/components/schemas/CropSOPVersion"}}
    CropVarietyBinding:
      type: object
      required: [variety_code, template_ref, bound_by, bound_at]
      properties:
        variety_code: {type: string}
        template_ref: {type: string, format: uuid}
        note: {type: [string, "null"]}
        bound_by: {type: string, format: uuid}
        bound_at: {type: string, format: date-time}
    # --- hết pf/cropcycle ---
    # --- pf/party: cấp quyền chia sẻ (ADR-0020) ---
    ShareKind:
      type: string
      enum: [cooperative_directory, plot_directory, season_harvest_dates, htx_collection_responses, waterway_routes, valve_hub, valve_collection, valve_mrv_evidence]
    ShareGrant:
      type: object
      required: [id, grantor_tenant_id, grantee_tenant_id, kinds, purpose, valid_from, valid_to, status, proposed_by, proposed_at, approved_by, approved_at, revoked_by, revoked_at, revoke_reason]
      properties:
        id: {type: string, format: uuid}
        grantor_tenant_id: {type: string, format: uuid}
        grantee_tenant_id: {type: string, format: uuid}
        kinds: {type: array, items: {$ref: "#/components/schemas/ShareKind"}}
        purpose: {type: string}
        valid_from: {type: string, format: date-time}
        valid_to: {type: string, format: date-time}
        status: {type: string, enum: [proposed, active, revoked]}
        proposed_by: {type: string, format: uuid}
        proposed_at: {type: string, format: date-time}
        approved_by: {type: [string, "null"], format: uuid}
        approved_at: {type: [string, "null"], format: date-time}
        revoked_by: {type: [string, "null"], format: uuid}
        revoked_at: {type: [string, "null"], format: date-time}
        revoke_reason: {type: [string, "null"]}
    ShareGrantRead:
      type: object
      required: [id, seq, grantee_tenant_id, kind, endpoint, query, item_count, actor_ref, recorded_at]
      properties:
        id: {type: string, format: uuid}
        seq: {type: integer}
        grantee_tenant_id: {type: string, format: uuid}
        kind: {$ref: "#/components/schemas/ShareKind"}
        endpoint: {type: string}
        query: {type: [string, "null"]}
        item_count: {type: integer}
        actor_ref: {type: string, format: uuid, description: "sub của tài khoản dịch vụ bên nhận"}
        recorded_at: {type: string, format: date-time}
    # --- hết pf/party cấp quyền chia sẻ ---
    # --- pf/party KN v7.7 gói P2 ---
    KNDepartment:
      type: object
      required: [id, org_ref, code, name, description, sort_order, status, status_label, menu_profile, retired, selectable, account_count, record_count, updated_by, updated_at]
      properties:
        id: {type: string, format: uuid}
        org_ref: {type: string, format: uuid, description: "Đơn vị: Nút cấp 1 (ttkn_national) hoặc cấp 2 (ttkn_province)"}
        code: {type: string, pattern: "^[a-z][a-z0-9_]{1,39}$", description: "Mã phòng ban — department_code của mọi bản ghi KN mới"}
        name: {type: string}
        description: {type: [string, "null"]}
        sort_order: {type: integer}
        status: {type: string, enum: [active, not_open, suspended], description: "Đang áp dụng / Chưa mở / Ngưng hoạt động"}
        status_label: {type: string}
        menu_profile: {type: string, enum: [trong_trot, generic], description: "Bộ menu dựng sẵn trong mã (kn.menu/v1)"}
        retired: {type: boolean, description: "Đã xóa (sự kiện retired) — mã không tái sử dụng"}
        selectable: {type: boolean, description: "Chọn được ở bước 2 đăng nhập (Đang áp dụng, chưa xóa)"}
        account_count: {type: [integer, "null"], description: "null = chưa nối nguồn đếm (P1) hoặc Application API"}
        record_count: {type: [integer, "null"]}
        updated_by: {type: string, format: uuid}
        updated_at: {type: string, format: date-time}
    KNDepartmentList:
      type: object
      required: [org_ref, items]
      properties:
        org_ref: {type: string, format: uuid}
        items: {type: array, items: {$ref: "#/components/schemas/KNDepartment"}}
    KNRegion:
      type: object
      required: [id, province_code, code, name, sort_order, active, deactivation_reason, commune_count, updated_by, updated_at]
      properties:
        id: {type: string, format: uuid}
        province_code: {type: string}
        code: {type: string}
        name: {type: string}
        sort_order: {type: integer}
        active: {type: boolean}
        deactivation_reason: {type: [string, "null"]}
        commune_count: {type: integer, description: "Số Nút xã đang hoạt động được gán"}
        updated_by: {type: string, format: uuid}
        updated_at: {type: string, format: date-time}
    KNRegionList:
      type: object
      required: [province_code, items, assigned_communes]
      properties:
        province_code: {type: string}
        items: {type: array, items: {$ref: "#/components/schemas/KNRegion"}}
        assigned_communes: {type: integer, description: "Σ commune_count"}
    KNRegionRef:
      type: object
      required: [code, name]
      properties:
        code: {type: string}
        name: {type: string}
    KNOrgTreeNode:
      type: object
      required: [ref, kind, code, name, admin_unit_code, level, active, region, commune_count, children]
      properties:
        ref: {type: [string, "null"], format: uuid, description: "null với nhóm khu vực"}
        kind: {type: string, enum: [ttkn_national, ttkn_province, extension_team, region, region_unassigned]}
        code: {type: string}
        name: {type: string}
        admin_unit_code: {type: [string, "null"]}
        level: {type: integer, description: "1 TTKNQG, 2 TTKN tỉnh, 3 Xã; 0 với nhóm khu vực"}
        active: {type: boolean}
        region:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/KNRegionRef"
        commune_count: {type: integer}
        children: {type: array, items: {$ref: "#/components/schemas/KNOrgTreeNode"}}
    # --- hết pf/party KN v7.7 gói P2 (chung) ---
    KNDepartmentInput:
      type: object
      required: [org_ref, code, name]
      properties:
        org_ref: {type: string, format: uuid}
        code: {type: string, pattern: "^[a-z][a-z0-9_]{1,39}$"}
        name: {type: string, minLength: 1, maxLength: 200}
        description: {type: string, maxLength: 1000}
        sort_order: {type: integer, minimum: 0, maximum: 100000}
        status: {type: string, enum: [active, not_open, suspended], default: not_open}
        menu_profile: {type: string, enum: [trong_trot, generic], default: generic}
    KNFieldChange:
      type: object
      required: [field, old, new]
      properties:
        field: {type: string}
        old: {type: [string, "null"]}
        new: {type: [string, "null"]}
    KNLogEntry:
      type: object
      required: [seq, event, actor_ref, actor_display, at, recorded_at, changes, reason]
      properties:
        seq: {type: integer}
        event: {type: string}
        actor_ref: {type: string, format: uuid}
        actor_display: {type: [string, "null"], description: "Tên tra lúc đọc từ actor_ref (RB-3), null khi chưa nối danh bạ"}
        at: {type: string, format: date-time}
        recorded_at: {type: string, format: date-time}
        changes: {type: array, items: {$ref: "#/components/schemas/KNFieldChange"}}
        reason: {type: [string, "null"]}
    KNLogPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/KNLogEntry"}}
        next_cursor: {type: [integer, "null"]}
    KNImpactRow:
      type: object
      required: [kind, label, count, available]
      properties:
        kind: {type: string, enum: [accounts, cooperatives, plots, open_periods]}
        label: {type: string}
        count: {type: [integer, "null"], description: "null khi chưa nối nguồn đếm"}
        area_ha: {type: string, description: "Thửa ruộng: tổng diện tích (decimal)"}
        available: {type: boolean}
    KNImpact:
      type: object
      required: [org, communes, rows, warnings, movable]
      properties:
        org: {$ref: "#/components/schemas/PartyOrg"}
        communes: {type: array, items: {type: string}}
        rows: {type: array, items: {$ref: "#/components/schemas/KNImpactRow"}}
        warnings: {type: array, items: {type: string}}
        movable: {type: boolean, description: "false với Nút cấp 1, 2"}
  requestBodies:
    ContentTransition:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              version_no: {type: integer, minimum: 1, description: "Bắt buộc với submit/return/publish"}
              reason: {type: string, minLength: 10, description: "Bắt buộc với return/retire"}
    AccountsReason:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [reason]
            properties:
              reason: {type: string, minLength: 20, description: "Lý do ≥ 20 ký tự (HTX US-HTXSTATUS-01 AC-3); không ghi dữ liệu cá nhân"}
