      description: GeoJSON LineString WGS84 [kinh độ, vĩ độ], ≥ 2 đỉnh phân biệt
      properties:
        type: {type: string, enum: [LineString]}
        coordinates:
          type: array
          minItems: 2
          items: {type: array, minItems: 2, maxItems: 2, items: {type: number}}
    WaterwayLocation:
      type: object
      required: [lat, lng]
      properties:
        lat: {type: number, minimum: -90, maximum: 90}
        lng: {type: number, minimum: -180, maximum: 180}
    WaterwayMeasure:
      description: Số thập phân > 0 (chuỗi hoặc số); null = chưa khai báo
      oneOf:
        - {type: string, pattern: "^[0-9]+(\\.[0-9]+)?$"}
        - {type: number}
        - {type: "null"}
    WaterwaySegmentInput:
      type: object
      required: [name, waterway_class, geometry]
      properties:
        name: {type: string, maxLength: 200}
        waterway_class: {type: string, enum: [kenh_chinh, noi_dong, muong, song], description: "GIS BR-35 + sông"}
        status: {type: string, enum: [draft, confirmed, retired], default: draft}
        geometry: {$ref: "#/components/schemas/WaterwayLineString"}
        width_m: {$ref: "#/components/schemas/WaterwayMeasure"}
        depth_m: {$ref: "#/components/schemas/WaterwayMeasure"}
        max_load_tons: {$ref: "#/components/schemas/WaterwayMeasure"}
        data_source: {type: string, enum: [digitised, official, survey, osm], default: digitised}
        note: {type: [string, "null"], maxLength: 1000}
        event_time: {type: string, format: date-time}
    WaterwayRevision:
      type: object
      required: [expected_revision, reason]
      properties:
        expected_revision: {type: integer, minimum: 1, description: "Số sửa hiện hành mà bản sửa dựa vào"}
        reason: {type: string, minLength: 5, maxLength: 500}
    WaterwaySegment:
      type: object
      required: [segment_ref, id, revision, name, waterway_class, status, geometry, length_m, width_m, depth_m, max_load_tons, data_source, note, event_time, recorded_at, supersedes_id, correction_reason, actor_ref, seq]
      properties:
        segment_ref: {type: string, format: uuid}
        id: {type: string, format: uuid, description: "id của bản sửa"}
        revision: {type: integer}
        name: {type: string}
        waterway_class: {type: string, enum: [kenh_chinh, noi_dong, muong, song]}
        status: {type: string, enum: [draft, confirmed, retired]}
        geometry: {$ref: "#/components/schemas/WaterwayLineString"}
        length_m: {type: string, description: "Geodesic, CSDL tính (US-WATER-02 AC-1)"}
        width_m: {type: [string, "null"]}
        depth_m: {type: [string, "null"], description: "Độ sâu khống chế mùa khô"}
        max_load_tons: {type: [string, "null"], description: "Tải trọng khai báo"}
        data_source: {type: string}
        note: {type: [string, "null"]}
        event_time: {type: string, format: date-time}
        recorded_at: {type: string, format: date-time}
        supersedes_id: {type: [string, "null"], format: uuid}
        correction_reason: {type: [string, "null"]}
        actor_ref: {type: string, format: uuid}
        seq: {type: integer}
    WaterwayStructureInput:
      type: object
      required: [kind, name, segment_ref, location]
      properties:
        kind: {type: string, enum: [cau, cong, au_thuyen, duong_day_dien]}
        name: {type: string, maxLength: 200}
        status: {type: string, enum: [active, retired], default: active}
        segment_ref: {type: string, format: uuid}
        location: {$ref: "#/components/schemas/WaterwayLocation"}
        clearance_height_m: {$ref: "#/components/schemas/WaterwayMeasure"}
        clearance_width_m: {$ref: "#/components/schemas/WaterwayMeasure"}
        depth_m: {$ref: "#/components/schemas/WaterwayMeasure"}
        survey_date: {type: string, format: date}
        data_source: {type: string, enum: [digitised, official, survey, osm], default: survey}
        note: {type: [string, "null"], maxLength: 1000}
        event_time: {type: string, format: date-time}
    WaterwayStructure:
      type: object
      required: [structure_ref, id, revision, kind, name, status, segment_ref, location, clearance_height_m, clearance_width_m, depth_m, survey_date, data_source, note, event_time, recorded_at, supersedes_id, correction_reason, actor_ref]
      properties:
        structure_ref: {type: string, format: uuid}
        id: {type: string, format: uuid}
        revision: {type: integer}
        kind: {type: string, enum: [cau, cong, au_thuyen, duong_day_dien]}
        name: {type: string}
        status: {type: string, enum: [active, retired]}
        segment_ref: {type: string, format: uuid}
        location: {$ref: "#/components/schemas/WaterwayLocation"}
        clearance_height_m: {type: [string, "null"]}
        clearance_width_m: {type: [string, "null"]}
        depth_m: {type: [string, "null"]}
        survey_date: {type: [string, "null"], format: date}
        data_source: {type: string}
        note: {type: [string, "null"]}
        event_time: {type: string, format: date-time}
        recorded_at: {type: string, format: date-time}
        supersedes_id: {type: [string, "null"], format: uuid}
        correction_reason: {type: [string, "null"]}
        actor_ref: {type: string, format: uuid}
    WaterwayBuildParams:
      type: object
      description: Ảnh chụp tham số dựng (số thập phân dạng chuỗi)
      properties:
        tolerances:
          type: object
          properties:
            snap_m: {type: string}
            auto_join_max_m: {type: string}
            report_gap_max_m: {type: string}
            on_segment_m: {type: string}
        safety:
          type: object
          properties:
            width_factor: {type: string}
            under_keel_m: {type: string}
            air_gap_m: {type: string}
        vessels:
          type: array
          items:
            type: object
            properties:
              code: {type: string}
              tons: {type: string}
              beam_m: {type: string}
              draft_m: {type: string}
              air_draft_m: {type: string}
    WaterwayBuild:
      type: object
      required: [id, status, requested_by, requested_at, network_version_no, reused, error_code, completed_at, params]
      properties:
        id: {type: string, format: uuid}
        status: {type: string, enum: [queued, completed, failed]}
        requested_by: {type: string, format: uuid}
        requested_at: {type: string, format: date-time, description: "Mốc as_of của sổ đoạn/công trình"}
        network_version_no: {type: [integer, "null"]}
        reused: {type: [boolean, "null"]}
        error_code: {type: [string, "null"]}
        completed_at: {type: [string, "null"], format: date-time}
        params: {$ref: "#/components/schemas/WaterwayBuildParams"}
    WaterwayNetworkVersion:
      type: object
      required: [id, version_no, status, segment_set_sha256, graph_sha256, rule_version, as_of, segment_count, structure_count, vertex_count, edge_count, component_count, finding_count, build_id, built_by, built_at, published_by, published_at, effective_from, superseded_at, params]
      properties:
        id: {type: string, format: uuid}
        version_no: {type: integer}
        status: {type: string, enum: [built, published, superseded]}
        segment_set_sha256: {type: string}
        graph_sha256: {type: string}
        rule_version: {type: string}
        as_of: {type: string, format: date-time}
        segment_count: {type: integer}
        structure_count: {type: integer}
        vertex_count: {type: integer}
        edge_count: {type: integer}
        component_count: {type: integer}
        finding_count: {type: integer}
        build_id: {type: string, format: uuid}
        built_by: {type: string, format: uuid}
        built_at: {type: string, format: date-time}
        published_by: {type: [string, "null"], format: uuid}
        published_at: {type: [string, "null"], format: date-time}
        effective_from: {type: [string, "null"], format: date-time}
        superseded_at: {type: [string, "null"], format: date-time}
        params: {$ref: "#/components/schemas/WaterwayBuildParams"}
    WaterwayFinding:
      type: object
      required: [id, kind, segment_refs, location, gap_m, auto_fixed, message]
      properties:
        id: {type: integer}
        kind: {type: string, enum: [crossing, t_join, gap_joined, gap_reported, dangling, isolated]}
        segment_refs: {type: array, items: {type: string, format: uuid}}
        location: {$ref: "#/components/schemas/WaterwayLocation"}
        gap_m: {type: [string, "null"]}
        auto_fixed: {type: boolean}
        message: {type: string}
    # --- hết pf/waterway ---

    # --- pf/cropcycle ---
    CropSOPStep:
      type: object
      required: [seq, name, activity_code, day_offset, window_days, mandatory]
      properties:
        seq: {type: integer, minimum: 1, description: "Liên tục 1..n (HTX US-CAT-01 AC-6)"}
        name: {type: string, maxLength: 200}
        stage_code: {type: string}
        activity_code: {type: string, enum: [lam_dat, gieo_sa, tuoi_nuoc, bon_phan, phun_thuoc, kiem_tra, thu_hoach]}
        day_offset: {type: integer, minimum: -60, maximum: 365, description: "Ngày so với ngày gieo sạ"}
        window_days: {type: integer, minimum: 0, maximum: 60}
        mandatory: {type: boolean}
        evidence_kinds: {type: array, items: {type: string, enum: [anh_hien_truong, hoa_don_vat_tu, phieu_kiem_nghiem, ghi_chu, khac]}}
        phi_days: {type: integer, minimum: 0, maximum: 120, description: "Thời gian cách ly sau phun thuốc"}
        instruction: {type: string}
    CropSOPTemplate:
      type: object
      required: [ref, code, name, crop, scope, status, latest_version]
      properties:
        ref: {type: string, format: uuid}
        code: {type: string}
        name: {type: string}
        crop: {type: string}
        scope: {type: string, enum: [system, htx]}
        cooperative_ref: {type: [string, "null"], format: uuid}
        standard: {type: [string, "null"]}
        description: {type: [string, "null"]}
        status: {type: string, enum: [draft, published, retired]}
        status_reason: {type: [string, "null"]}
        source_template_ref: {type: [string, "null"], format: uuid}
        latest_version: {type: integer}
        published_version: {type: [integer, "null"]}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    CropSOPVersion:
      type: object
      required: [id, template_ref, version_no, status, steps]
      properties:
        id: {type: string, format: uuid}
        template_ref: {type: string, format: uuid}
        version_no: {type: integer}
        status: {type: string, enum: [draft, published]}
        steps: {type: array, items: {$ref: "#/components/schemas/CropSOPStep"}}
        harvest_day_offset: {type: [integer, "null"]}
        harvest_window_days: {type: [integer, "null"]}
        source_version_ref: {type: [string, "null"], format: uuid}
        change_note: {type: [string, "null"]}
        authored_by: {type: string, format: uuid}
        authored_at: {type: string, format: date-time}
        published_by: {type: [string, "null"], format: uuid}
        published_at: {type: [string, "null"], format: date-time}
    CropSOP:
      allOf:
        - $ref: "#/components/schemas/CropSOPTemplate"
        - type: object
          required: [versions]
          properties:
            versions: {type: array, items: {$ref: "#/components/schemas/CropSOPVersion"}}
    CropVarietyBinding:
      type: object
      required: [variety_code, template_ref, bound_by, bound_at]
      properties:
        variety_code: {type: string}
        template_ref: {type: string, format: uuid}
        note: {type: [string, "null"]}
        bound_by: {type: string, format: uuid}
        bound_at: {type: string, format: date-time}
    # --- hết pf/cropcycle ---
  requestBodies:
    ContentTransition:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              version_no: {type: integer, minimum: 1, description: "Bắt buộc với submit/return/publish"}
              reason: {type: string, minLength: 10, description: "Bắt buộc với return/retire"}
    AccountsReason:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [reason]
            properties:
              reason: {type: string, minLength: 20, description: "Lý do ≥ 20 ký tự (HTX US-HTXSTATUS-01 AC-3); không ghi dữ liệu cá nhân"}
