        expected_bales: {type: integer, minimum: 1, description: "Bắt buộc khi tổ tính năng lực theo cuộn"}
        expected_ha: {type: string, pattern: "^[0-9]+(\\.[0-9]{1,3})?$", description: "Bắt buộc khi tổ tính năng lực theo ha"}
        mode: {type: string, enum: [manual, suggested], default: manual}
        suggestion_rank: {type: integer, minimum: 1, description: "Chỉ với mode = suggested"}
        override_reason: {type: string, minLength: 10, maxLength: 500, description: "Giám sát giao VƯỢT năng lực (chỉ manual, FM-06)"}
    AssignResult:
