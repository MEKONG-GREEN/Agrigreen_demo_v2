openapi: 3.1.0
info:
  title: MKG Internal API (api-internal)
  version: "1"
  description: |
    API nội bộ của vùng Mekong Green (mục 5, 11, 17) — đơn vị triển khai `cmd/api-internal`, cụm DB `mkg`.
    KHÔNG phải bề mặt của nền tảng: web-ops không sinh client từ tệp này. Hai listener:
      - bề mặt ứng dụng (`AG_HTTP_ADDR`, mặc định :8081) — OIDC + JWT;
      - bề mặt quản trị (`AG_ADMIN_HTTP_ADDR`, mặc định :8083) — OIDC + **MFA bắt buộc**; dữ liệu chủ và phê duyệt.
    Tenant = tài khoản MKG, lấy từ token (R-16). Mọi POST bắt buộc Idempotency-Key (R-51). Lỗi RFC 9457 (docs/errors.md, mục mkg/hub).
    Khối lượng là chuỗi thập phân kg, tối đa 3 chữ số (`"1520.500"`, R-10); tỷ lệ 6 chữ số; độ ẩm 2 chữ số; tọa độ WGS84 là số JSON.
    Dữ liệu sang nền tảng chỉ qua van công bố (contracts/publication/), không qua API này.
servers:
  - url: https://mkg-internal.agrigreen.local
    description: Bề mặt ứng dụng (chỉ trong vùng mkg)
  - url: https://mkg-admin.agrigreen.local
    description: Bề mặt quản trị (MFA)
security:
  - oidc: []
tags:
  - name: fieldops
    description: mkg/fieldops — lệnh gom, ca tổ gom, đếm cuộn theo công đoạn, xác nhận HTX, đối soát chiều mua, đồng bộ app hiện trường MKG
  - name: measurement
    description: mkg/measurement — sổ thiết bị cân, phiên cân, phiếu cân ba điểm, dung sai / định mức có phiên bản, đối soát, tranh chấp, nhập số cân khách, van MRV
  - name: hub
    description: mkg/hub — hub, kho, bãi; lô; mẻ; dịch chuyển tồn; van công bố
paths:
  # --- mkg/hub: bề mặt quản trị (MFA) ---
  /v1/hub/facilities:
    post:
      summary: "[Quản trị] Đề xuất cơ sở mới (phiên bản 1, chờ duyệt)"
      description: Vai hub_operator. Chưa có hiệu lực tới khi người KHÁC có vai hub_approver duyệt (R-56).
      operationId: proposeHubFacility
      tags: [hub]
      servers: [{url: "https://mkg-admin.agrigreen.local"}]
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/FacilitySpecInput"}}}
      responses:
        "201": {description: Phiên bản chờ duyệt, content: {application/json: {schema: {$ref: "#/components/schemas/FacilityVersion"}}}}
        "200": {description: Gọi lặp cùng khóa (phát lại)}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
    get:
      summary: Liệt kê cơ sở hiện hành (đã duyệt)
      operationId: listHubFacilities
      tags: [hub]
      parameters:
        - {name: kind, in: query, schema: {type: string, enum: [hub, warehouse, yard]}}
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, maximum: 200}}
      responses:
        "200":
          description: Trang cơ sở
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/Facility"}}
                  next_cursor: {type: [string, "null"]}
  /v1/hub/facilities/{id}/versions:
    parameters: [{$ref: "#/components/parameters/FacilityID"}]
    post:
      summary: "[Quản trị] Đề xuất thay đổi (phiên bản mới, bắt buộc reason ≥ 10 ký tự)"
      description: Ngừng dùng = phiên bản `status = inactive` — không xóa cứng (RB-1). Tối đa một phiên bản chờ duyệt.
      operationId: proposeHubFacilityChange
      tags: [hub]
      servers: [{url: "https://mkg-admin.agrigreen.local"}]
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/FacilitySpecInput"}}}
      responses:
        "201": {description: Phiên bản chờ duyệt, content: {application/json: {schema: {$ref: "#/components/schemas/FacilityVersion"}}}}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
    get:
      summary: "[Quản trị] Lịch sử phiên bản (chờ duyệt, đã duyệt, từ chối)"
      operationId: listHubFacilityVersions
      tags: [hub]
      servers: [{url: "https://mkg-admin.agrigreen.local"}]
      responses:
        "200":
          description: Mới nhất trước
          content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: "#/components/schemas/FacilityVersion"}}}}}}
  /v1/hub/facilities/{id}/versions/{version}/decision:
    parameters:
      - {$ref: "#/components/parameters/FacilityID"}
      - {name: version, in: path, required: true, schema: {type: integer, minimum: 1}}
    post:
      summary: "[Quản trị] Duyệt hoặc từ chối phiên bản"
      description: |
        Vai hub_approver, KHÁC người đề xuất (403 self_approval_forbidden). Từ chối bắt buộc reason.
        Duyệt → dữ liệu chủ hiện hành + xuất van `hub_facility` và `hub_capacity` trong cùng giao dịch.
      operationId: decideHubFacilityVersion
      tags: [hub]
      servers: [{url: "https://mkg-admin.agrigreen.local"}]
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: {type: string, enum: [approved, rejected]}
                reason: {type: string, minLength: 10, maxLength: 500}
      responses:
        "201":
          description: Quyết định đã ghi
          content:
            application/json:
              schema:
                type: object
                properties:
                  version: {$ref: "#/components/schemas/FacilityVersion"}
                  facility: {oneOf: [{$ref: "#/components/schemas/Facility"}, {type: "null"}]}
                  publications: {type: array, items: {$ref: "#/components/schemas/ValveExport"}}
        "403": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
  /v1/hub/projections/rebuild:
    post:
      summary: "[Quản trị] Dựng lại bảng chiếu tồn theo lô từ sổ (R-22)"
      operationId: rebuildHubProjections
      tags: [hub]
      servers: [{url: "https://mkg-admin.agrigreen.local"}]
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      responses:
        "200": {description: Số dòng đã dựng, content: {application/json: {schema: {type: object, properties: {lot_balances: {type: integer}}}}}}
  # --- mkg/hub: bề mặt ứng dụng ---

  /v1/hub/facilities/{id}:
    parameters: [{$ref: "#/components/parameters/FacilityID"}]
    get:
      summary: Dữ liệu chủ hiện hành của cơ sở
      operationId: getHubFacility
      tags: [hub]
      responses:
        "200": {description: Cơ sở, content: {application/json: {schema: {$ref: "#/components/schemas/Facility"}}}}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/hub/facilities/{id}/inventory:
    parameters: [{$ref: "#/components/parameters/FacilityID"}]
    get:
      summary: Tồn theo lô (xếp theo rủi ro xuống cấp) và sức chứa — lô là nguồn sự thật duy nhất
      operationId: getHubInventory
      tags: [hub]
      responses:
        "200":
          description: Tồn
          content:
            application/json:
              schema:
                type: object
                properties:
                  facility: {$ref: "#/components/schemas/Facility"}
                  lots: {type: array, items: {$ref: "#/components/schemas/RankedLot"}}
                  capacity: {$ref: "#/components/schemas/Capacity"}
                  risk_rule: {type: string, example: "hub.risk.v2#0"}
  /v1/hub/facilities/{id}/dispatch-suggestion:
    parameters: [{$ref: "#/components/parameters/FacilityID"}]
    get:
      summary: Đề xuất thứ tự xuất theo rủi ro xuống cấp (không FEFO), không ghi
      operationId: suggestHubDispatch
      tags: [hub]
      parameters: [{name: mass_kg, in: query, schema: {$ref: "#/components/schemas/Kg"}}]
      responses:
        "200":
          description: Đề xuất
          content:
            application/json:
              schema:
                type: object
                properties:
                  risk_rule: {type: string}
                  lots: {type: array, items: {$ref: "#/components/schemas/RankedLot"}}
                  allocations: {type: array, items: {$ref: "#/components/schemas/Allocation"}}
                  shortfall_kg: {oneOf: [{$ref: "#/components/schemas/Kg"}, {type: "null"}]}
  /v1/hub/facilities/{id}/receipts:
    parameters: [{$ref: "#/components/parameters/FacilityID"}]
    post:
      summary: Nhận một lô có N nguồn (tỷ lệ Σ = 1 chính xác)
      description: Vai hub_operator. Nguồn khai cùng `mass_kg` (hệ chia tỷ lệ dư lớn nhất) hoặc cùng `ratio`. Vượt sức chứa vẫn ghi nhận, trả `over_capacity = true`.
      operationId: receiveHubLot
      tags: [hub]
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [product, sources]
              description: mass_kg bắt buộc trừ khi có weigh_ticket_ref (G3, Q-MKG-04).
              properties:
                id: {type: string, format: uuid, description: UUIDv7 do thiết bị sinh (R-11)}
                weigh_ticket_ref: {type: string, format: uuid, description: "G3: phiếu cân HUB_IN đã về hub — id lô và khối lượng theo phiếu"}
                manual_reason: {type: string, minLength: 10, maxLength: 500, description: "G3: lý do nhập tay (cân hỏng) — bắt buộc khi tham số hub.weigh.v1 ticket_required"}
                code: {type: string, pattern: "^[A-Z0-9][A-Z0-9_-]{1,39}$"}
                product: {$ref: "#/components/schemas/Product"}
                mass_kg: {$ref: "#/components/schemas/Kg"}
                moisture_pct: {$ref: "#/components/schemas/Pct"}
                sources:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [kind, ref]
                    properties:
                      kind: {type: string, enum: [plot, cooperative, roll_count, supplier, lot, stocktake]}
                      ref: {type: string, format: uuid}
                      mass_kg: {$ref: "#/components/schemas/Kg"}
                      ratio: {type: string, pattern: "^[0-9]+(\\.[0-9]{1,6})?$"}
                event_time: {type: string, format: date-time}
                device_id: {type: string}
      responses:
        "201":
          description: Lô + dịch chuyển receive
          content:
            application/json:
              schema:
                type: object
                properties:
                  lot: {$ref: "#/components/schemas/Lot"}
                  movement: {$ref: "#/components/schemas/Movement"}
                  over_capacity: {type: boolean}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/hub/facilities/{id}/batches:
    parameters: [{$ref: "#/components/parameters/FacilityID"}]
    post:
      summary: Chạy một mẻ sấy / nén / phân loại (hao hụt = vào − ra ≥ 0)
      description: Thành phần đầu vào được chụp tại thời điểm mẻ chạy; lô ra có nguồn là các lô vào, tỷ lệ theo khối lượng.
      operationId: runHubBatch
      tags: [hub]
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, inputs, outputs]
              properties:
                kind: {type: string, enum: [drying, compression, sorting]}
                inputs:
                  type: array
                  minItems: 1
                  items: {type: object, required: [lot_id, mass_kg], properties: {lot_id: {type: string, format: uuid}, mass_kg: {$ref: "#/components/schemas/Kg"}}}
                outputs:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [product, mass_kg]
                    properties:
                      code: {type: string}
                      product: {$ref: "#/components/schemas/Product"}
                      mass_kg: {$ref: "#/components/schemas/Kg"}
                      moisture_pct: {$ref: "#/components/schemas/Pct"}
                event_time: {type: string, format: date-time}
      responses:
        "201": {description: Mẻ + lô ra}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/hub/facilities/{id}/dispatches:
    parameters: [{$ref: "#/components/parameters/FacilityID"}]
    post:
      summary: Xuất hàng — phân bổ đủ theo lô, mặc định rủi ro xuống cấp cao trước
      operationId: dispatchHub
      tags: [hub]
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mass_kg]
              properties:
                mass_kg: {$ref: "#/components/schemas/Kg"}
                destination_ref: {type: string, format: uuid, description: Chuyến / đơn hàng (mkg/logistics, mkg/orders): ''}
                allocations:
                  type: array
                  description: Rỗng → theo đề xuất rủi ro; có → chỉ định tay, tổng phải bằng mass_kg
                  items: {type: object, required: [lot_id, mass_kg], properties: {lot_id: {type: string, format: uuid}, mass_kg: {$ref: "#/components/schemas/Kg"}}}
                event_time: {type: string, format: date-time}
      responses:
        "201": {description: Phiếu xuất + dịch chuyển}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/hub/facilities/{id}/capacity-snapshots:
    parameters: [{$ref: "#/components/parameters/FacilityID"}]
    post:
      summary: Chụp sức chứa và xuất qua van hub_capacity v1
      operationId: publishHubCapacity
      tags: [hub]
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      responses:
        "201": {description: Bản ghi van, content: {application/json: {schema: {$ref: "#/components/schemas/ValveExport"}}}}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/hub/facilities/{id}/publications:
    parameters: [{$ref: "#/components/parameters/FacilityID"}]
    get:
      summary: Lịch sử bản ghi đã xuất qua van (kiểm toán)
      operationId: listHubPublications
      tags: [hub]
      parameters: [{name: contract, in: query, schema: {type: string, enum: [hub_facility, hub_capacity], default: hub_capacity}}]
      responses:
        "200": {description: Mới nhất trước, content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: "#/components/schemas/ValveExport"}}}}}}}
  /v1/hub/lots/{id}:
    get:
      summary: Lô, nguồn gốc, tồn còn lại và mọi dịch chuyển
      operationId: getHubLot
      tags: [hub]
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        "200":
          description: Lô
          content:
            application/json:
              schema:
                type: object
                properties:
                  lot: {$ref: "#/components/schemas/Lot"}
                  remaining_kg: {$ref: "#/components/schemas/Kg"}
                  movements: {type: array, items: {$ref: "#/components/schemas/Movement"}}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/hub/movements/{id}/corrections:
    post:
      summary: Sửa sai bằng dòng bù ngược dấu (receive, dispatch)
      description: Không UPDATE/DELETE dòng gốc (RB-1). Mỗi dòng bù một lần; bù làm tồn âm → 409.
      operationId: correctHubMovement
      tags: [hub]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string, minLength: 10}
                event_time: {type: string, format: date-time}
      responses:
        "201": {description: Dòng bù, content: {application/json: {schema: {$ref: "#/components/schemas/Movement"}}}}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  # --- mkg/hub G3 (migration mkg 000009): tham số, kiểm kê, chuyển kho, đo lường ---

  /v1/hub/params/{set}:
    parameters: [{name: set, in: path, required: true, schema: {type: string, enum: [risk, weigh]}}]
    get:
      summary: "[Quản trị] Bộ tham số có phiên bản (hub.risk.v2 / hub.weigh.v1) và bộ đang áp dụng"
      description: "active_version dạng hub.risk.v2#n; #0 = mặc định tạm (chờ khách, C-4)."
      operationId: getHubParams
      tags: [hub]
      responses:
        "200": {description: Phiên bản mới trước, content: {application/json: {schema: {type: object, properties: {param_set: {type: string}, active_version: {type: string}, active: {type: object}, items: {type: array, items: {$ref: "#/components/schemas/ParamVersion"}}}}}}}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/hub/params/{set}/versions:
    parameters: [{name: set, in: path, required: true, schema: {type: string, enum: [risk, weigh]}}]
    post:
      summary: "[Quản trị] Đề xuất phiên bản tham số (chờ duyệt)"
      description: "Vai hub_operator. Một phiên bản chờ mỗi bộ. risk: age_horizon_days, age_weight, moisture_warn_pct, moisture_span_pct, moisture_weight, alert_saturation, alert_weight (Σ trọng số = 100), humidity_warn_pct, humidity_crit_pct, temp_warn_c, temp_crit_c, crit_alert_weight. weigh: tolerance_pct, tolerance_min_kg, ticket_required, kg_per_roll_default. Khóa lạ bị từ chối."
      operationId: proposeHubParams
      tags: [hub]
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [params, reason]
              properties:
                params: {type: object}
                reason: {type: string, minLength: 10, maxLength: 500}
                effective_from: {type: string, format: date-time}
      responses:
        "201": {description: Phiên bản chờ duyệt, content: {application/json: {schema: {$ref: "#/components/schemas/ParamVersion"}}}}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/hub/params/{set}/versions/{version}/decision:
    parameters:
      - {name: set, in: path, required: true, schema: {type: string, enum: [risk, weigh]}}
      - {name: version, in: path, required: true, schema: {type: integer, minimum: 1}}
    post:
      summary: "[Quản trị] Duyệt / từ chối phiên bản tham số"
      description: Vai hub_approver, KHÁC người đặt (R-56; DB chặn lần hai bằng CHECK).
      operationId: decideHubParams
      tags: [hub]
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [decision], properties: {decision: {type: string, enum: [approved, rejected]}, reason: {type: string, minLength: 10}}}}}
      responses:
        "201": {description: Quyết định, content: {application/json: {schema: {$ref: "#/components/schemas/ParamVersion"}}}}
        "403": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
  /v1/hub/facilities/{id}/stocktakes:
    parameters: [{$ref: "#/components/parameters/FacilityID"}]
    post:
      summary: Ghi một lần đếm kiểm kê (Q-MKG-06) — chờ duyệt
      description: Vai hub_operator. Dòng theo dạng hàng, phủ mọi dạng hàng đang có tồn; sổ chụp lúc đếm. Một phiên chờ mỗi cơ sở; đếm lại = supersedes_id + reason.
      operationId: submitHubStocktake
      tags: [hub]
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lines]
              properties:
                lines: {type: array, minItems: 1, items: {type: object, required: [product, counted_kg], properties: {product: {$ref: "#/components/schemas/Product"}, counted_kg: {$ref: "#/components/schemas/Kg"}}}}
                note: {type: string, maxLength: 500}
                supersedes_id: {type: string, format: uuid}
                reason: {type: string, minLength: 10}
                event_time: {type: string, format: date-time}
      responses:
        "201": {description: Phiên chờ duyệt, content: {application/json: {schema: {$ref: "#/components/schemas/Stocktake"}}}}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
    get:
      summary: Phiên kiểm kê của cơ sở (mới trước)
      operationId: listHubStocktakes
      tags: [hub]
      responses:
        "200": {description: Danh sách, content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: "#/components/schemas/Stocktake"}}}}}}}
  /v1/hub/stocktakes/{id}:
    get:
      summary: Một phiên kiểm kê kèm dịch chuyển điều chỉnh
      operationId: getHubStocktake
      tags: [hub]
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        "200": {description: Phiên kiểm kê, content: {application/json: {schema: {$ref: "#/components/schemas/Stocktake"}}}}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/hub/stocktakes/{id}/decision:
    post:
      summary: Duyệt / từ chối phiên kiểm kê
      description: "Vai hub_approver, KHÁC người đếm (R-56, app + CHECK DB). Duyệt: sổ phải còn đúng lúc đếm (không thì 409 hub.stocktake_stale); thừa → lô origin stocktake; thiếu → trừ theo hub.risk.v2; dịch chuyển adjustment ref stocktake."
      operationId: decideHubStocktake
      tags: [hub]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [decision], properties: {decision: {type: string, enum: [approved, rejected]}, reason: {type: string, minLength: 10}}}}}
      responses:
        "201": {description: Quyết định + điều chỉnh, content: {application/json: {schema: {$ref: "#/components/schemas/Stocktake"}}}}
        "403": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
  /v1/hub/facilities/{id}/transfers:
    parameters: [{$ref: "#/components/parameters/FacilityID"}]
    post:
      summary: Xuất chuyển kho sang cơ sở khác (Q-MKG-10) — đang đi đường
      description: Vai hub_operator. Phiếu xuất destination_ref = cơ sở đích, dịch chuyển transfer_out; allocations rỗng → theo hub.risk.v2.
      operationId: startHubTransfer
      tags: [hub]
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to_facility_id, mass_kg]
              properties:
                to_facility_id: {type: string, format: uuid}
                mass_kg: {$ref: "#/components/schemas/Kg"}
                allocations: {type: array, items: {type: object, required: [lot_id, mass_kg], properties: {lot_id: {type: string, format: uuid}, mass_kg: {$ref: "#/components/schemas/Kg"}}}}
                event_time: {type: string, format: date-time}
      responses:
        "201": {description: Phiếu chuyển, content: {application/json: {schema: {$ref: "#/components/schemas/Transfer"}}}}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/hub/facilities/{id}/transfers/{transfer}/receipt:
    parameters:
      - {$ref: "#/components/parameters/FacilityID"}
      - {name: transfer, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      summary: Nhận hàng chuyển ở cơ sở đích
      description: "Vai hub_operator. mass_kg (tay) hoặc weigh_ticket_refs (phiếu HUB_IN của lô nguồn đã về — Σ). Mỗi lô nguồn → lô mới origin transfer, nguồn kind = lot tỷ lệ 1; hao hụt đường = xuất − nhận."
      operationId: receiveHubTransfer
      tags: [hub]
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                mass_kg: {$ref: "#/components/schemas/Kg"}
                weigh_ticket_refs: {type: array, items: {type: string, format: uuid}}
                event_time: {type: string, format: date-time}
      responses:
        "201": {description: Phiếu chuyển đã nhận, content: {application/json: {schema: {$ref: "#/components/schemas/Transfer"}}}}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/hub/transfers/{id}:
    get:
      summary: Phiếu chuyển kho
      operationId: getHubTransfer
      tags: [hub]
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        "200": {description: Phiếu chuyển, content: {application/json: {schema: {$ref: "#/components/schemas/Transfer"}}}}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/hub/lots/{id}/measurements:
    get:
      summary: Phiếu cân ↔ lô, hàng dự kiến về, hao hụt đã quy kết (cả khi lô chưa về hub)
      operationId: getHubLotMeasurements
      tags: [hub]
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        "200":
          description: Đo lường của lô
          content:
            application/json:
              schema:
                type: object
                properties:
                  lot_ref: {type: string, format: uuid}
                  hub_in: {type: [object, "null"]}
                  hub_out: {type: [object, "null"]}
                  links: {type: array, items: {type: object, properties: {outcome: {type: string, enum: [pending, receipt, manual_receipt, within_tolerance, adjusted, variance_unresolved, transfer_arrival, dispatch_linked, dispatch_variance, dispatch_unmatched, stale]}}}}
                  expected_rolls: {type: object, additionalProperties: {type: integer}}
                  expected_kg: {oneOf: [{$ref: "#/components/schemas/Kg"}, {type: "null"}]}
                  weigh_param_version: {type: string}
                  loss: {type: [object, "null"]}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/hub/facilities/{id}/losses:
    parameters: [{$ref: "#/components/parameters/FacilityID"}]
    get:
      summary: Hao hụt đã quy kết cho cơ sở (đối soát hiện hành của mỗi lô)
      operationId: getHubFacilityLosses
      tags: [hub]
      responses:
        "200": {description: Tổng hợp, content: {application/json: {schema: {type: object, properties: {lots: {type: integer}, loss_alerts: {type: integer}, hub_in_kg: {$ref: "#/components/schemas/Kg"}, hub_out_kg: {$ref: "#/components/schemas/Kg"}, expected_loss_kg: {$ref: "#/components/schemas/Kg"}, abnormal_loss_kg: {$ref: "#/components/schemas/Kg"}}}}}}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/measurement/devices:
    post:
      summary: "[Quản trị] Đề xuất đăng ký một kỳ thiết bị cân (khóa nguồn Ed25519 + băm chứng thư mTLS)"
      description: Vai scale_supervisor. Hiệu lực khi người KHÁC có vai device_approver duyệt (R-56). Kỳ (epoch) tăng dần, không dùng lại (ADR-0019).
      operationId: proposeScaleDevice
      tags: [measurement]
      servers: [{url: "https://mkg-admin.agrigreen.local"}]
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device_id, facility_ref, point, public_key, cert_sha256, scale_model]
              properties:
                device_id: {type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{2,63}$", description: Trùng CN/SAN chứng thư mTLS}
                epoch: {type: integer, minimum: 1, description: Bỏ trống = kỳ kế tiếp}
                facility_ref: {type: string, format: uuid}
                point: {type: string, enum: [HUB_IN, HUB_OUT]}
                public_key: {type: string, description: Khóa công khai Ed25519 32 byte, base64 chuẩn: ''}
                cert_sha256: {type: string, pattern: "^[0-9a-f]{64}$"}
                scale_model: {type: string, maxLength: 100, description: Mẫu cân (C-6)}
      responses:
        "201": {description: Kỳ chờ duyệt, content: {application/json: {schema: {$ref: "#/components/schemas/ScaleDevice"}}}}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
    get:
      summary: Liệt kê kỳ đăng ký thiết bị cân (kèm sức khỏe do ingest báo)
      operationId: listScaleDevices
      tags: [measurement]
      parameters:
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, maximum: 200}}
      responses:
        "200": {description: Trang thiết bị, content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: "#/components/schemas/ScaleDevice"}}, next_cursor: {type: [string, "null"]}}}}}}
  /v1/measurement/devices/{device_id}:
    get:
      summary: Mọi kỳ đăng ký của một thiết bị
      operationId: getScaleDevice
      tags: [measurement]
      parameters: [{name: device_id, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: Các kỳ, content: {application/json: {schema: {type: object, properties: {device_id: {type: string}, epochs: {type: array, items: {$ref: "#/components/schemas/ScaleDevice"}}}}}}}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/measurement/devices/{device_id}/epochs/{epoch}/decision:
    post:
      summary: "[Quản trị] Duyệt / từ chối đề xuất đăng ký"
      description: Vai device_approver, khác người đề xuất (R-56, CHECK DB). Duyệt kỳ mới → kỳ cũ đang hiệu lực thành superseded.
      operationId: decideScaleDevice
      tags: [measurement]
      servers: [{url: "https://mkg-admin.agrigreen.local"}]
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}, {name: device_id, in: path, required: true, schema: {type: string}}, {name: epoch, in: path, required: true, schema: {type: integer}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/Decision"}}}}
      responses:
        "201": {description: Đã quyết định, content: {application/json: {schema: {$ref: "#/components/schemas/ScaleDevice"}}}}
        "403": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
  /v1/measurement/devices/{device_id}/epochs/{epoch}/revoke:
    post:
      summary: "[Quản trị] Thu hồi ngay một kỳ đăng ký (lô mới bị ingest từ chối)"
      description: Vai device_approver hoặc scale_supervisor; thu hồi chỉ giảm tin cậy nên không cần người thứ hai. Bắt buộc lý do ≥ 10 ký tự.
      operationId: revokeScaleDevice
      tags: [measurement]
      servers: [{url: "https://mkg-admin.agrigreen.local"}]
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}, {name: device_id, in: path, required: true, schema: {type: string}}, {name: epoch, in: path, required: true, schema: {type: integer}}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [reason], properties: {reason: {type: string, minLength: 10}}}}}}
      responses:
        "201": {description: Đã thu hồi, content: {application/json: {schema: {$ref: "#/components/schemas/ScaleDevice"}}}}
        "409": {$ref: "#/components/responses/Problem"}
  /v1/measurement/tolerance-versions:
    post:
      summary: "[Quản trị] Đề xuất phiên bản bảng dung sai (C-4 — TẠM, chờ khách)"
      description: Vai reconciliation_officer. Áp theo THỜI ĐIỂM CÂN ≥ effective_from sau khi tolerance_approver khác người đặt duyệt. Chưa có phiên bản duyệt → mặc định tạm prototype (cờ 5 %, nghiêm trọng 15 %).
      operationId: proposeToleranceVersion
      tags: [measurement]
      servers: [{url: "https://mkg-admin.agrigreen.local"}]
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [commercial_flag_pct, commercial_critical_pct, roll_flag_pct, roll_critical_pct, effective_from, reason]
              properties:
                commercial_flag_pct: {$ref: "#/components/schemas/Pct"}
                commercial_critical_pct: {$ref: "#/components/schemas/Pct"}
                roll_flag_pct: {$ref: "#/components/schemas/Pct"}
                roll_critical_pct: {$ref: "#/components/schemas/Pct"}
                effective_from: {type: string, format: date-time}
                provisional: {type: boolean, default: true}
                reason: {type: string, minLength: 10}
      responses:
        "201": {description: Phiên bản chờ duyệt, content: {application/json: {schema: {$ref: "#/components/schemas/ParamVersion"}}}}
        "422": {$ref: "#/components/responses/Problem"}
    get:
      summary: Liệt kê phiên bản dung sai (cả hai bề mặt)
      operationId: listToleranceVersions
      tags: [measurement]
      responses:
        "200": {description: Phiên bản, content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: "#/components/schemas/ParamVersion"}}, provisional_default: {type: object}}}}}}
  /v1/measurement/tolerance-versions/{seq}/decision:
    post:
      summary: "[Quản trị] Duyệt / từ chối phiên bản dung sai"
      description: Vai tolerance_approver ≠ người đặt (R-56, CHECK DB). Từ chối cần lý do.
      operationId: decideToleranceVersion
      tags: [measurement]
      servers: [{url: "https://mkg-admin.agrigreen.local"}]
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}, {name: seq, in: path, required: true, schema: {type: integer}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/Decision"}}}}
      responses:
        "201": {description: Đã quyết định, content: {application/json: {schema: {$ref: "#/components/schemas/ParamVersion"}}}}
        "403": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
  /v1/measurement/loss-norm-versions:
    post:
      summary: "[Quản trị] Đề xuất phiên bản định mức hao hụt sấy theo độ ẩm (TẠM, chờ khách)"
      description: Vai reconciliation_officer. bands là các khoảng ẩm [from, to) liền nhau; chỉ hao hụt BẤT THƯỜNG > abnormal_alert_pct % HUB_IN mới cảnh báo.
      operationId: proposeLossNormVersion
      tags: [measurement]
      servers: [{url: "https://mkg-admin.agrigreen.local"}]
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bands, default_loss_pct, abnormal_alert_pct, effective_from, reason]
              properties:
                bands: {type: array, items: {type: object, required: [moisture_from, moisture_to, loss_pct], properties: {moisture_from: {$ref: "#/components/schemas/Pct"}, moisture_to: {$ref: "#/components/schemas/Pct"}, loss_pct: {$ref: "#/components/schemas/Pct"}}}}
                default_loss_pct: {$ref: "#/components/schemas/Pct"}
                abnormal_alert_pct: {$ref: "#/components/schemas/Pct"}
                effective_from: {type: string, format: date-time}
                provisional: {type: boolean, default: true}
                reason: {type: string, minLength: 10}
      responses:
        "201": {description: Phiên bản chờ duyệt, content: {application/json: {schema: {$ref: "#/components/schemas/ParamVersion"}}}}
    get:
      summary: Liệt kê phiên bản định mức hao hụt
      operationId: listLossNormVersions
      tags: [measurement]
      responses:
        "200": {description: Phiên bản, content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: "#/components/schemas/ParamVersion"}}}}}}}
  /v1/measurement/loss-norm-versions/{seq}/decision:
    post:
      summary: "[Quản trị] Duyệt / từ chối phiên bản định mức hao hụt"
      operationId: decideLossNormVersion
      tags: [measurement]
      servers: [{url: "https://mkg-admin.agrigreen.local"}]
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}, {name: seq, in: path, required: true, schema: {type: integer}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/Decision"}}}}
      responses:
        "201": {description: Đã quyết định, content: {application/json: {schema: {$ref: "#/components/schemas/ParamVersion"}}}}
  /v1/measurement/projections/rebuild:
    post:
      summary: "[Quản trị] Dựng lại bảng chiếu lot_mass_current, lot_yield_current, dispute_current từ sổ (R-22)"
      operationId: rebuildMeasurementProjections
      tags: [measurement]
      servers: [{url: "https://mkg-admin.agrigreen.local"}]
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      responses:
        "200": {description: Số lô / hồ sơ đã dựng, content: {application/json: {schema: {type: object, additionalProperties: {type: integer}}}}}
  # --- mkg/measurement: bề mặt ứng dụng ---

  /v1/measurement/sessions:
    post:
      summary: Mở phiên cân của lô trên một thiết bị (cửa sổ theo BỘ ĐẾM)
      description: Vai scale_supervisor. Điểm cân và cơ sở lấy từ kỳ đăng ký đang hiệu lực. Một thiết bị một phiên mở; cửa sổ không chồng phiên đã đóng.
      operationId: openWeighingSession
      tags: [measurement]
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [lot_ref, device_id, epoch, counter_from], properties: {id: {type: string, format: uuid}, lot_ref: {type: string, format: uuid}, device_id: {type: string}, epoch: {type: integer}, counter_from: {type: integer, minimum: 0}, event_time: {type: string, format: date-time}, collection_order_ref: {type: string, format: uuid, description: "G3-2: lệnh gom (lô gom mkg/fieldops) mà lô cân chở — ghi liên kết tường minh lô ↔ lệnh gom (409 measurement.collection_link_conflict nếu lệnh gom đã gắn lô khác)"}}}}}
      responses:
        "201": {description: Phiên mở, content: {application/json: {schema: {$ref: "#/components/schemas/WeighingSession"}}}}
        "409": {$ref: "#/components/responses/Problem"}
  /v1/measurement/sessions/{id}:
    get:
      summary: Đọc phiên cân
      operationId: getWeighingSession
      tags: [measurement]
      parameters: [{$ref: "#/components/parameters/MeasurementID"}]
      responses:
        "200": {description: Phiên, content: {application/json: {schema: {$ref: "#/components/schemas/WeighingSession"}}}}
  /v1/measurement/sessions/{id}/close:
    post:
      summary: Đóng phiên cân tại counter_to (kèm bì, độ ẩm) — ingest tích phân cửa sổ thành phiếu (R-70)
      operationId: closeWeighingSession
      tags: [measurement]
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}, {$ref: "#/components/parameters/MeasurementID"}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [counter_to], properties: {counter_to: {type: integer}, tare_kg: {$ref: "#/components/schemas/Kg"}, moisture_pct: {$ref: "#/components/schemas/Pct"}, event_time: {type: string, format: date-time}}}}}
      responses:
        "201": {description: Phiên đóng, content: {application/json: {schema: {$ref: "#/components/schemas/WeighingSession"}}}}
        "409": {$ref: "#/components/responses/Problem"}
  /v1/measurement/tickets/{id}:
    get:
      summary: Đọc một phiếu cân
      operationId: getWeighTicket
      tags: [measurement]
      parameters: [{$ref: "#/components/parameters/MeasurementID"}]
      responses:
        "200": {description: Phiếu, content: {application/json: {schema: {$ref: "#/components/schemas/WeighTicket"}}}}
  /v1/measurement/lots/{id}/tickets:
    parameters: [{$ref: "#/components/parameters/MeasurementID"}]
    get:
      summary: Mọi phiếu của lô (kể cả phiếu đã bị bù) + khối lượng hiệu lực ba điểm
      operationId: listLotTickets
      tags: [measurement]
      responses:
        "200": {description: Phiếu và khối lượng lô, content: {application/json: {schema: {type: object, properties: {mass: {type: object}, tickets: {type: array, items: {$ref: "#/components/schemas/WeighTicket"}}}}}}}
    post:
      summary: Phiếu nhập tay có bằng chứng (CUSTOMER_IN khi chưa tích hợp hệ cân khách — C-5; HUB_IN/HUB_OUT khi cân hỏng — Q-MKG-04)
      description: Vai scale_supervisor. Bắt buộc evidence_ref và reason. Phiếu mới cùng điểm phải là phiếu bù (supersedes_id + correction_reason). Lô đủ phiếu → đối soát CÙNG giao dịch; vượt dung sai → mở tranh chấp.
      operationId: recordManualTicket
      tags: [measurement]
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mass_kg, weighed_at, evidence_ref, reason]
              properties:
                id: {type: string, format: uuid}
                point: {type: string, enum: [HUB_IN, HUB_OUT, CUSTOMER_IN], default: CUSTOMER_IN}
                route: {type: string, enum: [HUB, DIRECT], default: HUB}
                mass_kg: {$ref: "#/components/schemas/Kg"}
                moisture_pct: {$ref: "#/components/schemas/Pct"}
                moisture_state: {type: string, enum: [not_measured, as_received, after_drying]}
                weighed_at: {type: string, format: date-time}
                evidence_ref: {type: string, format: uuid}
                customer_ref: {type: string, format: uuid}
                reason: {type: string, minLength: 10}
                supersedes_id: {type: string, format: uuid}
                correction_reason: {type: string, minLength: 10}
      responses:
        "201": {description: Phiếu (và đối soát nếu có), content: {application/json: {schema: {type: object, properties: {ticket: {$ref: "#/components/schemas/WeighTicket"}, reconciliation: {oneOf: [{$ref: "#/components/schemas/Reconciliation"}, {type: "null"}]}}}}}}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/measurement/lots/{id}/terms:
    post:
      summary: Đặt cách tính giá của lô (per_tonne | per_bale) — tạm tới G4 orders
      description: Vai reconciliation_officer. per_tonne → kiểm chéo cuộn ↔ khối lượng chính thức (RB-6); per_bale → chỉ tham khảo. Mặc định khi chưa đặt là per_tonne.
      operationId: setLotTerms
      tags: [measurement]
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}, {$ref: "#/components/parameters/MeasurementID"}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [pricing_basis], properties: {pricing_basis: {type: string, enum: [per_tonne, per_bale]}, contract_ref: {type: string, format: uuid}, customer_ref: {type: string, format: uuid}, reason: {type: string, minLength: 10, description: Bắt buộc khi đổi}}}}}}
      responses:
        "201": {description: Đã đặt}
  /v1/measurement/lots/{id}/collection:
    parameters: [{$ref: "#/components/parameters/MeasurementID"}]
    post:
      summary: Gắn lô cân với lệnh gom của mkg/fieldops (G3-2)
      description: >-
        Vai reconciliation_officer hoặc scale_supervisor. Dùng cho lô DIRECT (chỉ CUSTOMER_IN) hoặc khi phiên cân không mang
        collection_order_ref. Một lệnh gom thuộc tối đa một lô cân. Đổi lệnh gom của lô cần `reason` (bản ghi bù, RB-1).
        Gắn xong đối soát lại lô nếu đã đủ phiếu (số cuộn của lệnh gom vào đối chiếu RB-6). Không có liên kết = quy ước
        đồng nhất (lot_ref là mã lệnh gom).
      operationId: linkLotCollection
      tags: [measurement]
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [collection_order_ref], properties: {collection_order_ref: {type: string, format: uuid}, reason: {type: string, minLength: 10, maxLength: 500, description: Bắt buộc khi đổi}}}}}}
      responses:
        "201": {description: Đã gắn, content: {application/json: {schema: {$ref: "#/components/schemas/LotCollection"}}}}
        "200": {description: Phát lại}
        "409": {$ref: "#/components/responses/Problem"}
    get:
      summary: Liên kết hiện hành lô cân ↔ lệnh gom (explicit = false → quy ước đồng nhất)
      operationId: getLotCollection
      tags: [measurement]
      responses:
        "200": {description: Liên kết, content: {application/json: {schema: {$ref: "#/components/schemas/LotCollection"}}}}
  /v1/measurement/lots/{id}/reconciliations:
    parameters: [{$ref: "#/components/parameters/MeasurementID"}]
    post:
      summary: Đối soát lô (HUB_IN → HUB_OUT → CUSTOMER_IN; DIRECT chỉ CUSTOMER_IN)
      description: Vai reconciliation_officer. Đầu vào không đổi so với lần trước → 200 trả lần trước. Phát sự kiện NỘI BỘ mkg.measurement.reconciliation.completed.
      operationId: reconcileLot
      tags: [measurement]
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      responses:
        "201": {description: Lần đối soát mới, content: {application/json: {schema: {$ref: "#/components/schemas/Reconciliation"}}}}
        "200": {description: Không đổi / phát lại}
        "409": {$ref: "#/components/responses/Problem"}
    get:
      summary: Lịch sử đối soát của lô (mới nhất trước)
      operationId: listReconciliations
      tags: [measurement]
      responses:
        "200": {description: Lịch sử, content: {application/json: {schema: {type: object, properties: {latest: {$ref: "#/components/schemas/Reconciliation"}, items: {type: array, items: {$ref: "#/components/schemas/Reconciliation"}}}}}}}
  /v1/measurement/lots/{id}/yield:
    get:
      summary: Sản lượng quy đổi yield_kg_per_roll = mass(HUB_IN) / cuộn (DIRECT → CUSTOMER_IN, gộp) — không bao giờ qua van
      operationId: getLotYield
      tags: [measurement]
      parameters: [{$ref: "#/components/parameters/MeasurementID"}]
      responses:
        "200": {description: Sản lượng quy đổi}
  /v1/measurement/lots/{id}/mrv-evidence:
    post:
      summary: Công bố bằng chứng thu gom qua van mrv_collection_evidence (dự thảo, C-1) — khối lượng THEO BẬC mỗi thửa nguồn
      description: >-
        Tuyến HUB: HUB_IN × tỷ lệ thửa của lô hub (mass_basis HUB_IN). Tuyến DIRECT (G3-2): CUSTOMER_IN × tỷ lệ thửa theo số
        cuộn của lệnh gom liên kết, gắn cờ gộp (mass_basis CUSTOMER_IN_AGGREGATED). 409 measurement.no_hub_in /
        measurement.no_customer_in / measurement.no_plot_sources.
      operationId: publishMRVEvidence
      tags: [measurement]
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}, {$ref: "#/components/parameters/MeasurementID"}]
      requestBody: {required: false, content: {application/json: {schema: {type: object, properties: {season_ref: {type: string, format: uuid}}}}}}
      responses:
        "201": {description: Bản ghi van đã xuất}
        "409": {$ref: "#/components/responses/Problem"}
  /v1/measurement/lots/{id}/publications:
    get:
      summary: Bản ghi đã xuất qua van của lô (kiểm toán)
      operationId: listMeasurementPublications
      tags: [measurement]
      parameters: [{$ref: "#/components/parameters/MeasurementID"}]
      responses:
        "200": {description: Bản ghi van}
  /v1/measurement/customer-weight-imports:
    post:
      summary: Nhập số cân của khách (tệp / API / tay có bằng chứng — C-5, TẠM)
      description: Vai scale_supervisor. Mỗi dòng → một phiếu CUSTOMER_IN (file/api → customer_integration; manual → manual_evidence), cùng giao dịch; một dòng sai → cả lần bị từ chối. Tối đa 200 dòng.
      operationId: importCustomerWeights
      tags: [measurement]
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channel, rows]
              properties:
                channel: {type: string, enum: [file, api, manual]}
                customer_ref: {type: string, format: uuid}
                evidence_ref: {type: string, format: uuid, description: Bắt buộc với file và manual}
                file_sha256: {type: string, pattern: "^[0-9a-f]{64}$"}
                reason: {type: string, minLength: 10, description: Bắt buộc với manual}
                rows:
                  type: array
                  maxItems: 200
                  items: {type: object, required: [lot_ref, mass_kg, weighed_at], properties: {lot_ref: {type: string, format: uuid}, route: {type: string, enum: [HUB, DIRECT]}, mass_kg: {$ref: "#/components/schemas/Kg"}, moisture_pct: {$ref: "#/components/schemas/Pct"}, weighed_at: {type: string, format: date-time}, customer_ticket_no: {type: string}}}
      responses:
        "201": {description: Lần nhập + đối soát tự động}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/measurement/customer-weight-imports/{id}:
    get:
      summary: Đọc một lần nhập
      operationId: getCustomerWeightImport
      tags: [measurement]
      parameters: [{$ref: "#/components/parameters/MeasurementID"}]
      responses:
        "200": {description: Lần nhập}
  /v1/measurement/disputes:
    get:
      summary: Liệt kê hồ sơ tranh chấp
      operationId: listDisputes
      tags: [measurement]
      parameters:
        - {name: status, in: query, schema: {type: string, enum: [open, under_review, resolved, cancelled]}}
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, maximum: 200}}
      responses:
        "200": {description: Trang hồ sơ}
  /v1/measurement/disputes/{id}:
    get:
      summary: Hồ sơ tranh chấp kèm lịch sử
      operationId: getDispute
      tags: [measurement]
      parameters: [{$ref: "#/components/parameters/MeasurementID"}]
      responses:
        "200": {description: Hồ sơ}
  /v1/measurement/disputes/{id}/actions:
    post:
      summary: Thao tác hồ sơ (add_evidence | start_review | resolve | cancel)
      description: Vai dispute_officer. Vòng đời open → under_review → resolved | cancelled; bằng chứng thêm khi còn mở.
      operationId: actOnDispute
      tags: [measurement]
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}, {$ref: "#/components/parameters/MeasurementID"}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [action], properties: {action: {type: string, enum: [add_evidence, start_review, resolve, cancel]}, evidence_refs: {type: array, items: {type: string, format: uuid}}, resolution: {type: string, enum: [customer_weight, mkg_weight, agreed_weight]}, agreed_kg: {$ref: "#/components/schemas/Kg"}, note: {type: string, minLength: 10}}}}}
      responses:
        "201": {description: Hồ sơ sau thao tác}
        "409": {$ref: "#/components/responses/Problem"}
  # --- mkg/fieldops: bề mặt ứng dụng (field_collector, field_supervisor) ---
  /v1/fieldops/orders:
    get:
      summary: Liệt kê lệnh gom (cursor)
      operationId: listCollectionOrders
      tags: [fieldops]
      parameters:
        - {name: status, in: query, schema: {type: string, enum: [planned, approved, assigned, closed, cancelled]}}
        - {name: htx_ref, in: query, schema: {type: string, format: uuid}}
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, maximum: 200}}
      responses:
        "200":
          description: Trang lệnh gom
          content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: "#/components/schemas/CollectionOrder"}}, next_cursor: {type: [string, "null"]}}}}}
    post:
      summary: Lập lệnh gom (planned) — vai field_supervisor
      description: Thửa/HTX đối chiếu với nền tảng qua Application API (tài khoản dịch vụ MKG); thửa phải thuộc HTX. Chưa công bố tới khi người KHÁC duyệt (R-56).
      operationId: createCollectionOrder
      tags: [fieldops]
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/CollectionPlanInput"}}}}
      responses:
        "201": {description: Lệnh gom, content: {application/json: {schema: {$ref: "#/components/schemas/CollectionOrderResult"}}}}
        "422": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
  /v1/fieldops/orders/{id}:
    parameters: [{$ref: "#/components/parameters/OrderID"}]
    get:
      summary: Lệnh gom hiện hành và lịch sử sự kiện
      operationId: getCollectionOrder
      tags: [fieldops]
      responses:
        "200": {description: Lệnh gom, content: {application/json: {schema: {type: object, properties: {order: {$ref: "#/components/schemas/CollectionOrder"}, history: {type: array, items: {type: object}}, assignment: {oneOf: [{$ref: "#/components/schemas/CrewAssignment"}, {type: "null"}]}, baling: {type: array, items: {$ref: "#/components/schemas/BalingDeadline"}}, baling_deadline_days: {type: integer}}}}}}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/fieldops/orders/{id}/revisions:
    parameters: [{$ref: "#/components/parameters/OrderID"}]
    post:
      summary: Sửa kế hoạch khi còn planned (revision + 1; người sửa thành người lập)
      operationId: reviseCollectionOrder
      tags: [fieldops]
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/CollectionPlanInput"}}}}
      responses:
        "201": {description: Lệnh gom, content: {application/json: {schema: {$ref: "#/components/schemas/CollectionOrderResult"}}}}
        "409": {$ref: "#/components/responses/Problem"}
  /v1/fieldops/orders/{id}/decision:
    parameters: [{$ref: "#/components/parameters/OrderID"}]
    post:
      summary: Duyệt (→ approved, công bố collection_schedule) hoặc từ chối (→ cancelled, bắt buộc reason)
      description: Vai field_supervisor, KHÁC người lập (R-56 — 403 self_approval_forbidden; CHECK DB lớp hai).
      operationId: decideCollectionOrder
      tags: [fieldops]
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [decision], properties: {decision: {type: string, enum: [approved, rejected]}, reason: {type: string, minLength: 10}}}}}
      responses:
        "201": {description: Lệnh gom, content: {application/json: {schema: {$ref: "#/components/schemas/CollectionOrderResult"}}}}
        "403": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
  /v1/fieldops/orders/{id}/assign:
    parameters: [{$ref: "#/components/parameters/OrderID"}]
    post:
      summary: Giao / đổi tổ gom (approved | assigned → assigned) — kiểm năng lực tổ
      description: |
        proto FM-07: `crew_ref` phải có trong sổ tổ gom và đang `active` (lạ → 422 `fieldops.crew_unknown`, ngừng → 409 `fieldops.crew_inactive`).
        proto FM-06: mỗi ngày của [planned_from, planned_to] (mặc định = khung lệnh gom), tải các lệnh `assigned` khác của tổ + tải việc này
        (khối lượng theo đơn vị năng lực của tổ ÷ số ngày) ≤ `capacity_per_day`; vượt → 409 `fieldops.crew_over_capacity`, trừ khi giám sát
        giao tay kèm `override_reason` (phân công gắn `over_capacity = true`, cảnh báo `fieldops.crew_over_capacity_override`).
        proto FM-08: `mode = suggested` là xác nhận gợi ý (không bao giờ vượt năng lực). Giao lại đúng tổ với đúng việc đang giao → 200,
        không sinh phân công mới. Cảnh báo không chặn: `fieldops.planned_before_harvest`, `fieldops.baling_deadline_at_risk`,
        `fieldops.harvest_date_unknown`, `fieldops.harvest_date_unavailable`.
      operationId: assignCollectionOrder
      tags: [fieldops]
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/AssignInput"}}}}
      responses:
        "201": {description: Lệnh gom + phân công, content: {application/json: {schema: {$ref: "#/components/schemas/AssignResult"}}}}
        "200": {description: Giao lại đúng việc đang giao — không đổi (FM-08), content: {application/json: {schema: {$ref: "#/components/schemas/AssignResult"}}}}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/fieldops/orders/{id}/assignments:
    parameters: [{$ref: "#/components/parameters/OrderID"}]
    get:
      summary: Lịch sử phân công của lệnh gom (sổ crew_assignment)
      operationId: listCrewAssignments
      tags: [fieldops]
      responses:
        "200": {description: Phân công, content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: "#/components/schemas/CrewAssignment"}}}}}}}
  /v1/fieldops/orders/{id}/crew-suggestions:
    parameters: [{$ref: "#/components/parameters/OrderID"}]
    get:
      summary: Gợi ý tổ gom cho lệnh (proto FM-08) — chỉ đọc, giám sát xác nhận bằng POST …/assign mode = suggested
      description: >-
        Tổ đang hoạt động (FM-07), vừa năng lực mọi ngày (FM-06); xếp hạng: gần nhất (xã của lệnh thuộc `service_communes` của tổ) →
        ít tải nhất (tải cao nhất/ngày sau khi giao ÷ năng lực) → mã tổ. Tất định: cùng dữ liệu → cùng kết quả. Vai field_supervisor.
      operationId: suggestCrews
      tags: [fieldops]
      parameters:
        - {name: planned_from, in: query, schema: {type: string, format: date}}
        - {name: planned_to, in: query, schema: {type: string, format: date}}
        - {name: expected_bales, in: query, schema: {type: integer, minimum: 1}}
        - {name: expected_ha, in: query, schema: {type: string, pattern: "^[0-9]+(\\.[0-9]{1,3})?$"}}
      responses:
        "200":
          description: Gợi ý
          content:
            application/json:
              schema:
                type: object
                properties:
                  order_id: {type: string, format: uuid}
                  commune_code: {type: string}
                  planned_from: {type: string, format: date}
                  planned_to: {type: string, format: date}
                  suggested: {oneOf: [{$ref: "#/components/schemas/CrewSuggestion"}, {type: "null"}]}
                  suggestions: {type: array, items: {$ref: "#/components/schemas/CrewSuggestion"}}
                  unfit: {type: array, items: {$ref: "#/components/schemas/CrewSuggestion"}}
                  inactive_crews: {type: integer}
                  rule_version: {type: string}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/fieldops/orders/{id}/close:
    parameters: [{$ref: "#/components/parameters/OrderID"}]
    post:
      summary: Đóng lệnh gom (assigned → closed)
      operationId: closeCollectionOrder
      tags: [fieldops]
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      responses:
        "201": {description: Lệnh gom, content: {application/json: {schema: {$ref: "#/components/schemas/CollectionOrderResult"}}}}
        "409": {$ref: "#/components/responses/Problem"}
  /v1/fieldops/orders/{id}/cancel:
    parameters: [{$ref: "#/components/parameters/OrderID"}]
    post:
      summary: Hủy lệnh gom (không xóa — sự kiện cancelled kèm lý do, RB-1)
      operationId: cancelCollectionOrder
      tags: [fieldops]
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [reason], properties: {reason: {type: string, minLength: 10}}}}}}
      responses:
        "201": {description: Lệnh gom, content: {application/json: {schema: {$ref: "#/components/schemas/CollectionOrderResult"}}}}
        "409": {$ref: "#/components/responses/Problem"}
  /v1/fieldops/orders/{id}/roll-counts:
    parameters: [{$ref: "#/components/parameters/OrderID"}]
    get:
      summary: Sổ đếm cuộn (cả bản bị bù) + số hiệu lực theo thửa/công đoạn + tổng theo công đoạn
      operationId: listRollCounts
      tags: [fieldops]
      responses:
        "200": {description: Sổ và tổng, content: {application/json: {schema: {type: object, properties: {counts: {type: array, items: {$ref: "#/components/schemas/RollCount"}}, totals: {type: array, items: {type: object}}, order_totals: {type: object, additionalProperties: {type: integer}}}}}}}
    post:
      summary: Ghi số một công đoạn (bale → gather → boat_load)
      description: |
        proto FM-03: công đoạn trước phải có số. FM-04: bằng công đoạn trước, hoặc ít hơn kèm `discrepancy_reason`; nhiều hơn → 422.
        FM-09: bắt buộc `rolls`; `loose_kg` chỉ khi `rolls = 0` (rơm rời). Mỗi (thửa, công đoạn) một số hiệu lực — sửa bằng bản bù.
        boat_load → cập nhật đối soát chiều mua và công bố bảng kê `htx_collection_statement`. Phát sự kiện NỘI BỘ `mkg.fieldops.roll_count.recorded`.
      operationId: recordRollCount
      tags: [fieldops]
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/RollCountInput"}}}}
      responses:
        "201": {description: Bản ghi, content: {application/json: {schema: {$ref: "#/components/schemas/RollCountResult"}}}}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/fieldops/roll-counts/{id}/corrections:
    parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
    post:
      summary: Bản ghi bù (RB-1) — bắt buộc correction_reason; công đoạn sau vẫn phải thỏa FM-04
      operationId: correctRollCount
      tags: [fieldops]
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/RollCountInput"}}}}
      responses:
        "201": {description: Bản bù, content: {application/json: {schema: {$ref: "#/components/schemas/RollCountResult"}}}}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/fieldops/orders/{id}/htx-confirmations:
    parameters: [{$ref: "#/components/parameters/OrderID"}]
    get:
      summary: Xác nhận của HTX trên lệnh gom
      operationId: listHTXConfirmations
      tags: [fieldops]
      responses:
        "200": {description: Danh sách, content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {type: object}}}}}}}
    post:
      summary: Ghi xác nhận / tranh chấp của HTX (G3 — nhân viên MKG ghi thay; HTX tự xác nhận qua nền tảng ở G3-2)
      operationId: recordHTXConfirmation
      tags: [fieldops]
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plot_ref, outcome, event_time]
              properties:
                plot_ref: {type: string, format: uuid}
                outcome: {type: string, enum: [confirmed, disputed]}
                htx_rolls: {type: integer, minimum: 0, description: "Bắt buộc khi disputed (khác số MKG)"}
                reason: {type: string, minLength: 10, description: "Bắt buộc khi disputed"}
                statement_revision: {type: integer, description: "Phiên bản bảng kê HTX đã xem; cũ → 409 fieldops.statement_stale"}
                evidence_ref: {type: string, format: uuid}
                event_time: {type: string, format: date-time}
      responses:
        "201": {description: Xác nhận và đối soát, content: {application/json: {schema: {type: object, properties: {confirmation: {type: object}, reconciliation: {$ref: "#/components/schemas/BuySideReconciliation"}}}}}}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/fieldops/orders/{id}/crew-shifts:
    parameters: [{$ref: "#/components/parameters/OrderID"}]
    get:
      summary: Ca tổ gom của lệnh
      operationId: listCrewShifts
      tags: [fieldops]
      responses:
        "200": {description: Danh sách, content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {type: object}}}}}}}
    post:
      summary: Mở / đóng ca tổ gom
      operationId: recordCrewShift
      tags: [fieldops]
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [crew_ref, kind, event_time]
              properties:
                crew_ref: {type: string, format: uuid}
                kind: {type: string, enum: [opened, closed]}
                headcount: {type: integer, minimum: 1, maximum: 200, description: "Bắt buộc khi opened"}
                equipment_refs: {type: array, maxItems: 50, items: {type: string}}
                event_time: {type: string, format: date-time}
                device_id: {type: string}
      responses:
        "201": {description: Ca, content: {application/json: {schema: {type: object}}}}
        "409": {$ref: "#/components/responses/Problem"}
  /v1/fieldops/orders/{id}/publications:
    parameters: [{$ref: "#/components/parameters/OrderID"}]
    get:
      summary: Bản ghi đã xuất qua van (collection_schedule, htx_collection_statement) — kiểm toán
      operationId: listFieldopsPublications
      tags: [fieldops]
      responses:
        "200": {description: Danh sách, content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: "#/components/schemas/ValveExport"}}}}}}}
  /v1/fieldops/reconciliation:
    get:
      summary: Đối soát chiều mua MKG ↔ HTX theo thửa (RB-6) — pending / match / mismatch
      operationId: listBuySideReconciliation
      tags: [fieldops]
      parameters:
        - {name: order_id, in: query, schema: {type: string, format: uuid}}
        - {name: status, in: query, schema: {type: string, enum: [pending, match, mismatch]}}
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, maximum: 500}}
      responses:
        "200":
          description: Trang đối soát
          content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: "#/components/schemas/BuySideReconciliation"}}, page_counts: {type: object}, next_cursor: {type: [string, "null"]}}}}}
  /v1/fieldops/htx/{id}/kg-per-roll:
    get:
      summary: kg/cuộn học theo HTX — nội bộ MKG, KHÔNG BAO GIỜ qua van
      description: Σ kg cân / Σ cuộn của 30 lô gom đã cân gần nhất của HTX → toàn tenant → cấu hình (AG_FIELDOPS_KG_PER_ROLL) → 20 (tạm, chờ khách).
      operationId: getKgPerRoll
      tags: [fieldops]
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        "200":
          description: kg/cuộn
          content: {application/json: {schema: {type: object, properties: {htx_ref: {type: string, format: uuid}, kg_per_roll: {type: string, example: "17.0"}, source: {type: string, enum: [htx, system, config, default]}, samples: {type: integer}, rule_version: {type: string}}}}}
  /v1/fieldops/kg-per-roll/refresh:
    post:
      summary: Kéo khối lượng cân của lô gom đã xếp ghe/xe từ mkg/measurement (port WeighedMass) — vai field_supervisor
      operationId: refreshKgPerRoll
      tags: [fieldops]
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      responses:
        "200": {description: Số lô vừa có khối lượng, content: {application/json: {schema: {type: object, properties: {weighed_lots_added: {type: integer}}}}}}
  /v1/fieldops/sync/push:
    post:
      summary: Đồng bộ chiều lên của app hiện trường MKG (hình dạng docs/dev/sync-contract.md, hiện thực trong vùng mkg)
      description: |
        Header `X-Device-Id` bắt buộc, trùng `device_id`. Tối đa 500 bản ghi; entity `roll_count` (op `create` | `correct`).
        `id` UUIDv7 máy sinh; `idem_key` dạng `dev:<device_id>:<seq>`. Kết quả theo từng bản ghi: accepted | duplicate | rejected.
      operationId: fieldopsSyncPush
      tags: [fieldops]
      parameters:
        - {$ref: "#/components/parameters/IdempotencyKey"}
        - {name: X-Device-Id, in: header, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device_id, records]
              properties:
                device_id: {type: string}
                records:
                  type: array
                  maxItems: 500
                  items:
                    type: object
                    required: [id, idem_key, entity, op, event_time, payload]
                    properties:
                      id: {type: string}
                      idem_key: {type: string}
                      entity: {type: string, enum: [roll_count]}
                      op: {type: string, enum: [create, correct]}
                      event_time: {type: string, format: date-time}
                      supersedes_id: {type: [string, "null"]}
                      correction_reason: {type: [string, "null"]}
                      payload:
                        type: object
                        properties:
                          order_id: {type: string, format: uuid}
                          plot_ref: {type: string, format: uuid}
                          stage: {type: string, enum: [bale, gather, boat_load]}
                          rolls: {type: integer, minimum: 0}
                          loose_kg: {$ref: "#/components/schemas/Kg"}
                          discrepancy_reason: {type: string}
                          htx_confirmation_ref: {type: string, format: uuid}
                          gps: {$ref: "#/components/schemas/GPSFix"}
                          gps_status: {$ref: "#/components/schemas/GPSStatus"}
      responses:
        "200":
          description: Kết quả theo bản ghi
          content: {application/json: {schema: {type: object, properties: {results: {type: array, items: {type: object, properties: {id: {type: string}, status: {type: string, enum: [accepted, duplicate, rejected]}, code: {type: string}, errors: {type: array, items: {type: object}}}}}}}}}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/fieldops/sync/pull:
    get:
      summary: Đồng bộ chiều xuống — entity collection_order (đã duyệt/đang làm → upsert; khác → tombstone)
      description: >-
        Lọc theo sổ tổ gom: field_supervisor nhận mọi lệnh đã duyệt/đang làm; field_collector chỉ nhận upsert cho lệnh ĐÃ GIAO cho tổ mà
        tài khoản là thành viên — lệnh chưa giao / giao tổ khác → tombstone. Đổi tổ / đổi thành viên đẩy thay đổi xuống ở lần pull sau.
      operationId: fieldopsSyncPull
      tags: [fieldops]
      parameters:
        - {name: X-Device-Id, in: header, required: true, schema: {type: string}}
        - {name: cursor, in: query, schema: {type: string, description: "Mờ, có chữ ký HMAC gắn tenant + tài khoản + thiết bị"}}
        - {name: limit, in: query, schema: {type: integer, maximum: 1000}}
      responses:
        "200":
          description: Trang thay đổi
          content: {application/json: {schema: {type: object, properties: {changes: {type: array, items: {type: object}}, next_cursor: {type: string}, has_more: {type: boolean}, server_time: {type: string, format: date-time}, reset: {type: boolean}}}}}
        "400": {$ref: "#/components/responses/Problem"}
  /v1/fieldops/crews:
    get:
      summary: Sổ tổ gom (cursor = mã tổ cuối)
      operationId: listCrews
      tags: [fieldops]
      parameters:
        - {name: status, in: query, schema: {type: string, enum: [active, inactive]}}
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, maximum: 200}}
      responses:
        "200": {description: Trang tổ gom, content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: "#/components/schemas/Crew"}}, next_cursor: {type: [string, "null"]}}}}}}
    post:
      summary: Thêm tổ gom (active, phiên bản 1) — vai field_supervisor
      description: Thành viên là subject tài khoản MKG (UUID, không có dữ liệu cá nhân). Năng lực/ngày theo cuộn (số nguyên) hoặc ha.
      operationId: createCrew
      tags: [fieldops]
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/CrewInput"}}}}
      responses:
        "201": {description: Tổ gom, content: {application/json: {schema: {$ref: "#/components/schemas/CrewResult"}}}}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/fieldops/crews/{id}:
    parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
    get:
      summary: Tổ gom hiện hành và mọi phiên bản
      operationId: getCrew
      tags: [fieldops]
      responses:
        "200": {description: Tổ gom, content: {application/json: {schema: {type: object, properties: {crew: {$ref: "#/components/schemas/Crew"}, history: {type: array, items: {$ref: "#/components/schemas/CrewEvent"}}}}}}}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/fieldops/crews/{id}/revisions:
    parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
    post:
      summary: Phiên bản mới của tổ (tên, thành viên, năng lực, xã phục vụ) — không đổi trạng thái
      description: "`expected_version` khác phiên bản hiện hành → 409 fieldops.crew_version_conflict. Lệnh đang giao cho tổ đi xuống lại máy (lọc pull theo thành viên)."
      operationId: reviseCrew
      tags: [fieldops]
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/CrewInput"}}}}
      responses:
        "201": {description: Tổ gom, content: {application/json: {schema: {$ref: "#/components/schemas/CrewResult"}}}}
        "409": {$ref: "#/components/responses/Problem"}
  /v1/fieldops/crews/{id}/deactivate:
    parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
    post:
      summary: Ngừng tổ gom (không xóa, RB-1) — tổ ngừng không nhận việc mới (proto FM-07)
      operationId: deactivateCrew
      tags: [fieldops]
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/CrewStatusInput"}}}}
      responses:
        "201": {description: Tổ gom, content: {application/json: {schema: {$ref: "#/components/schemas/CrewResult"}}}}
        "409": {$ref: "#/components/responses/Problem"}
  /v1/fieldops/crews/{id}/reactivate:
    parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
    post:
      summary: Bật lại tổ gom
      operationId: reactivateCrew
      tags: [fieldops]
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/CrewStatusInput"}}}}
      responses:
        "201": {description: Tổ gom, content: {application/json: {schema: {$ref: "#/components/schemas/CrewResult"}}}}
        "409": {$ref: "#/components/responses/Problem"}
  /v1/fieldops/baling-deadlines:
    get:
      summary: Hạn cuộn sau gặt theo (lệnh gom đang mở, thửa) — proto FM-02
      description: >-
        Hạn = ngày gặt + `baling_deadline_days` (tham số có phiên bản; chưa duyệt → 3 ngày, `param_version = provisional-default`, TẠM,
        chờ khách). Quá hạn không chặn ghi nhưng gắn cờ (`overdue`, `baled_late`; `status=flagged` = cả hai). Ngày gặt từ bảng đệm
        (bề mặt partner của nền tảng); chưa biết → `harvest_unknown`.
      operationId: listBalingDeadlines
      tags: [fieldops]
      parameters:
        - {name: status, in: query, schema: {type: string, enum: [flagged, overdue, baled_late, pending, not_harvested, baled_on_time, harvest_unknown]}}
        - {name: order_id, in: query, schema: {type: string, format: uuid}}
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, maximum: 500}}
      responses:
        "200":
          description: Trang hạn cuộn
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/BalingDeadline"}}
                  next_cursor: {type: [string, "null"]}
                  baling_deadline_days: {type: integer}
                  param_version: {type: string}
                  provisional: {type: boolean}
                  today: {type: string, format: date}
                  rule_version: {type: string}
  /v1/fieldops/harvest-dates/refresh:
    post:
      summary: Làm mới bảng đệm ngày gặt của mọi lệnh gom đang mở (GET /v1/partner/season-harvest-dates của nền tảng) — vai field_supervisor
      description: Job `fieldops_harvest_dates` (AG_MKG_JOBS) chạy cùng việc này theo chu kỳ.
      operationId: refreshHarvestDates
      tags: [fieldops]
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      responses:
        "200": {description: Kết quả, content: {application/json: {schema: {type: object, properties: {plots: {type: integer}, known: {type: integer}, unknown: {type: integer}, unavailable: {type: integer}}}}}}
  /v1/fieldops/params/{key}:
    parameters: [{name: key, in: path, required: true, schema: {type: string, enum: [baling_deadline_days]}}]
    get:
      summary: Các phiên bản tham số và giá trị hiệu lực hôm nay
      operationId: getFieldopsParam
      tags: [fieldops]
      responses:
        "200":
          description: Tham số
          content: {application/json: {schema: {type: object, properties: {param_key: {type: string}, effective_value: {type: integer}, param_version: {type: string}, provisional: {type: boolean}, default_value: {type: integer}, versions: {type: array, items: {$ref: "#/components/schemas/FieldopsParam"}}}}}}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/fieldops/params/{key}/versions:
    parameters: [{name: key, in: path, required: true, schema: {type: string, enum: [baling_deadline_days]}}]
    post:
      summary: Đề xuất phiên bản tham số (pending tới khi người KHÁC duyệt, R-56)
      operationId: proposeFieldopsParam
      tags: [fieldops]
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [value, reason], properties: {value: {type: string, description: "baling_deadline_days: số ngày nguyên 0..60"}, effective_from: {type: string, format: date}, provisional: {type: boolean, default: true, description: "Tạm, chờ khách"}, reason: {type: string, minLength: 10, maxLength: 500}}}}}
      responses:
        "201": {description: Phiên bản, content: {application/json: {schema: {type: object, properties: {param: {$ref: "#/components/schemas/FieldopsParam"}}}}}}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/fieldops/params/{key}/versions/{version}/decision:
    parameters:
      - {name: key, in: path, required: true, schema: {type: string, enum: [baling_deadline_days]}}
      - {name: version, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      summary: Duyệt / từ chối phiên bản tham số — người quyết định KHÁC người đề xuất (403 self_approval_forbidden; CHECK DB lớp hai)
      operationId: decideFieldopsParam
      tags: [fieldops]
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [decision], properties: {decision: {type: string, enum: [approved, rejected]}, reason: {type: string, minLength: 10, description: "Bắt buộc khi rejected"}}}}}
      responses:
        "201": {description: Phiên bản, content: {application/json: {schema: {type: object, properties: {param: {$ref: "#/components/schemas/FieldopsParam"}}}}}}
        "403": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
components:
  securitySchemes:
    oidc:
      type: openIdConnect
      openIdConnectUrl: https://auth.agrigreen.vn/realms/agrigreen/.well-known/openid-configuration
  parameters:
    IdempotencyKey: {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 8, maxLength: 200}}
    FacilityID: {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    MeasurementID: {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    OrderID: {name: id, in: path, required: true, schema: {type: string, format: uuid}}
  responses:
    Problem:
      description: Lỗi RFC 9457
      content: {application/problem+json: {schema: {type: object, properties: {type: {type: string}, title: {type: string}, status: {type: integer}, code: {type: string}, trace_id: {type: string}}}}}
  schemas:
    Kg: {type: string, pattern: "^-?[0-9]+(\\.[0-9]{1,3})?$", example: "1520.500"}
    Pct: {type: string, pattern: "^[0-9]{1,3}(\\.[0-9]{1,2})?$", example: "14.50"}
    Product: {type: string, enum: [straw_bale, straw_loose, dried_straw, compressed_bale]}
    ParamVersion:
      type: object
      properties:
        id: {type: string, format: uuid}
        param_set: {type: string, enum: [risk, weigh]}
        version: {type: integer}
        rule_version: {type: string, enum: [hub.risk.v2, hub.weigh.v1]}
        params: {type: object}
        reason: {type: string}
        effective_from: {type: string, format: date-time}
        proposed_by: {type: string, format: uuid}
        state: {type: string, enum: [pending, approved, rejected]}
        decided_by: {type: [string, "null"], format: uuid}
        decided_at: {type: [string, "null"], format: date-time}
        kind: {type: string, enum: [tolerance, loss_norm]}
        status: {type: string, enum: [pending, approved, rejected]}
        provisional: {type: boolean}
        values: {type: object}
    Stocktake:
      type: object
      properties:
        id: {type: string, format: uuid}
        facility_id: {type: string, format: uuid}
        status: {type: string, enum: [pending, approved, rejected, superseded]}
        lines: {type: array, items: {type: object, properties: {product: {$ref: "#/components/schemas/Product"}, book_kg: {$ref: "#/components/schemas/Kg"}, counted_kg: {$ref: "#/components/schemas/Kg"}, variance_kg: {$ref: "#/components/schemas/Kg"}}}}
        book_kg: {$ref: "#/components/schemas/Kg"}
        counted_kg: {$ref: "#/components/schemas/Kg"}
        variance_kg: {$ref: "#/components/schemas/Kg"}
        supersedes_id: {type: [string, "null"], format: uuid}
        counted_by: {type: string, format: uuid}
        decided_by: {type: [string, "null"], format: uuid}
        adjustments: {type: array, items: {type: object, properties: {lot_id: {type: string, format: uuid}, movement_id: {type: string, format: uuid}, qty_kg: {$ref: "#/components/schemas/Kg"}}}}
    Transfer:
      type: object
      properties:
        id: {type: string, format: uuid}
        from_facility_id: {type: string, format: uuid}
        to_facility_id: {type: string, format: uuid}
        dispatch_id: {type: string, format: uuid}
        status: {type: string, enum: [in_transit, received]}
        dispatched_kg: {$ref: "#/components/schemas/Kg"}
        received_kg: {oneOf: [{$ref: "#/components/schemas/Kg"}, {type: "null"}]}
        loss_kg: {oneOf: [{$ref: "#/components/schemas/Kg"}, {type: "null"}]}
        source_lots: {type: array, items: {type: object}}
        received_lots: {type: array, items: {type: object}}
        dispatched_at: {type: string, format: date-time}
        received_at: {type: [string, "null"], format: date-time}
    FacilitySpecInput:
      type: object
      required: [code, name, kind, location, province_code, capacity_kg, effective_from]
      properties:
        code: {type: string, pattern: "^[A-Z0-9][A-Z0-9_-]{1,31}$"}
        name: {type: string, maxLength: 200}
        kind: {type: string, enum: [hub, warehouse, yard]}
        parent_facility_id: {type: string, format: uuid}
        location: {type: object, required: [lat, lng], properties: {lat: {type: number}, lng: {type: number}}}
        boundary: {type: object, description: GeoJSON Polygon hoặc MultiPolygon WGS84}
        province_code: {type: string, pattern: "^[0-9]{2}$"}
        status: {type: string, enum: [active, inactive], default: active}
        capacity_kg: {$ref: "#/components/schemas/Kg"}
        effective_from: {type: string, format: date-time}
        reason: {type: string, minLength: 10, description: Bắt buộc từ phiên bản 2}
        event_time: {type: string, format: date-time}
    Facility:
      type: object
      properties:
        id: {type: string, format: uuid}
        code: {type: string}
        name: {type: string}
        kind: {type: string}
        parent_facility_id: {type: [string, "null"]}
        location: {type: object, properties: {lat: {type: number}, lng: {type: number}}}
        boundary: {type: object}
        province_code: {type: string}
        status: {type: string}
        capacity_kg: {$ref: "#/components/schemas/Kg"}
        capacity_tons: {type: string}
        effective_from: {type: string, format: date-time}
        version: {type: integer}
        version_id: {type: string, format: uuid}
        proposed_by: {type: string, format: uuid}
        approved_by: {type: string, format: uuid}
        approved_at: {type: string, format: date-time}
    FacilityVersion:
      type: object
      properties:
        id: {type: string, format: uuid}
        facility_id: {type: string, format: uuid}
        version: {type: integer}
        state: {type: string, enum: [pending, approved, rejected]}
        supersedes_id: {type: [string, "null"]}
        change_reason: {type: [string, "null"]}
        proposed_by: {type: string, format: uuid}
        decided_by: {type: [string, "null"]}
        decided_at: {type: [string, "null"]}
    Lot:
      type: object
      properties:
        id: {type: string, format: uuid}
        facility_id: {type: string, format: uuid}
        code: {type: string}
        product: {$ref: "#/components/schemas/Product"}
        origin: {type: string, enum: [receipt, transform]}
        batch_id: {type: [string, "null"]}
        initial_kg: {$ref: "#/components/schemas/Kg"}
        moisture_pct: {type: [string, "null"]}
        sources:
          type: array
          items: {type: object, properties: {kind: {type: string}, ref: {type: string, format: uuid}, ratio: {type: string, example: "0.333334"}, mass_kg: {type: string}}}
        event_time: {type: string, format: date-time}
        recorded_at: {type: string, format: date-time}
    Movement:
      type: object
      properties:
        id: {type: string, format: uuid}
        lot_id: {type: string, format: uuid}
        kind: {type: string, enum: [receive, transform_in, transform_out, dispatch, correction]}
        qty_kg: {$ref: "#/components/schemas/Kg"}
        balance_after_kg: {$ref: "#/components/schemas/Kg"}
        ref_type: {type: [string, "null"]}
        ref_id: {type: [string, "null"]}
        supersedes_id: {type: [string, "null"]}
        correction_reason: {type: [string, "null"]}
        event_time: {type: string, format: date-time}
        recorded_at: {type: string, format: date-time}
    RankedLot:
      type: object
      properties:
        lot_id: {type: string, format: uuid}
        code: {type: string}
        product: {type: string}
        remaining_kg: {$ref: "#/components/schemas/Kg"}
        moisture_pct: {type: [string, "null"]}
        received_at: {type: string, format: date-time}
