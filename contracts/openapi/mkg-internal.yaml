        health: {type: object, properties: {last_seen_at: {type: [string, "null"]}, buffer_pct: {type: [string, "null"]}, clock_skew_ms: {type: [integer, "null"]}, last_counter: {type: [integer, "null"]}}}
    WeighingSession:
      type: object
      properties:
        id: {type: string, format: uuid}
        lot_ref: {type: string, format: uuid}
        point: {type: string}
        route: {type: string}
        device_id: {type: string}
        epoch: {type: integer}
        counter_from: {type: integer}
        counter_to: {type: [integer, "null"]}
        status: {type: string, enum: [open, closed]}
        moisture_pct: {type: [string, "null"]}
        tare_kg: {type: [string, "null"]}
    WeighTicket:
      type: object
      properties:
        id: {type: string, format: uuid}
        lot_ref: {type: string, format: uuid}
        point: {type: string, enum: [HUB_IN, HUB_OUT, CUSTOMER_IN]}
        route: {type: string, enum: [HUB, DIRECT]}
        source: {type: string, enum: [edge, customer_integration, manual_evidence]}
        mass_kg: {$ref: "#/components/schemas/Kg"}
        moisture_pct: {type: [string, "null"]}
        moisture_state: {type: string, enum: [not_measured, as_received, after_drying]}
        rule_version: {type: [string, "null"]}
        window: {type: [object, "null"], description: "Thiết bị, kỳ, khoảng bộ đếm, reading_batch, readings_sha256 (R-70)"}
        evidence_ref: {type: [string, "null"], format: uuid}
        supersedes_id: {type: [string, "null"], format: uuid}
        effective: {type: boolean}
    Reconciliation:
      type: object
      properties:
        id: {type: string, format: uuid}
        lot_ref: {type: string, format: uuid}
        route: {type: string}
        pricing_basis: {type: string, enum: [per_tonne, per_bale]}
        internal: {type: object, description: "status normal|abnormal|gain|not_applicable; loss_kg, loss_norm_pct, expected_loss_kg, abnormal_loss_kg"}
        commercial: {type: object, description: "status within|flag|critical|not_applicable; diff_kg (CUSTOMER_IN − HUB_OUT), diff_pct"}
        roll_check: {type: object, description: "status pending_rolls|within|flag|critical|informational; rolls, kg_per_roll_estimate, estimate_kg, variance_pct"}
        yield_kg_per_roll: {type: [string, "null"]}
        yield_aggregated: {type: boolean}
        outcome: {type: string, enum: [within_tolerance, loss_alert, dispute_opened, direct_aggregate]}
        tolerance_version: {type: string}
        loss_norm_version: {type: [string, "null"]}
        dispute_id: {type: [string, "null"], format: uuid}
        supersedes_id: {type: [string, "null"], format: uuid}
    CollectionPlanInput:
      type: object
      required: [htx_ref, window_from, window_to, plot_refs]
      properties:
        htx_ref: {type: string, format: uuid}
        commune_code: {type: string, pattern: "^[0-9]{5}$", description: "Bỏ trống → mã xã của HTX từ nền tảng"}
        window_from: {type: string, format: date}
        window_to: {type: string, format: date, description: "≥ window_from, khung tối đa 90 ngày"}
        plot_refs: {type: array, minItems: 1, maxItems: 200, items: {type: string, format: uuid}}
    CollectionOrder:
      type: object
      properties:
        order_id: {type: string, format: uuid, description: "= mã lô gom (lot_ref của sự kiện nội bộ) và schedule_ref của van"}
        status: {type: string, enum: [planned, approved, assigned, closed, cancelled]}
        revision: {type: integer}
        htx_ref: {type: string, format: uuid}
        commune_code: {type: string}
        window_from: {type: string, format: date}
        window_to: {type: string, format: date}
        plot_refs: {type: array, items: {type: string, format: uuid}}
        crew_ref: {type: [string, "null"], format: uuid}
        reason: {type: [string, "null"]}
        created_by: {type: string, format: uuid}
        approved_by: {type: [string, "null"], format: uuid}
        approved_at: {type: [string, "null"], format: date-time}
        published: {type: boolean}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        baling_overdue: {type: boolean, description: "proto FM-02: ít nhất một thửa đã quá hạn cuộn sau gặt mà chưa cuộn"}
    CollectionOrderResult:
      type: object
      properties:
        order: {$ref: "#/components/schemas/CollectionOrder"}
        event: {type: object}
        publications: {type: array, items: {$ref: "#/components/schemas/ValveExport"}}
    RollCountInput:
      type: object
      required: [rolls, event_time]
      properties:
        id: {type: string, format: uuid, description: "UUIDv7 máy sinh (R-11); bỏ trống → server sinh"}
        plot_ref: {type: string, format: uuid, description: "Bắt buộc với bản gốc"}
        stage: {type: string, enum: [bale, gather, boat_load], description: "Bắt buộc với bản gốc"}
        rolls: {type: integer, minimum: 0}
        loose_kg: {$ref: "#/components/schemas/Kg"}
        discrepancy_reason: {type: string, minLength: 10, maxLength: 500}
        htx_confirmation_ref: {type: string, format: uuid}
        correction_reason: {type: string, minLength: 10, maxLength: 500, description: "Bắt buộc với bản bù"}
        event_time: {type: string, format: date-time}
        device_id: {type: string}
        gps: {$ref: "#/components/schemas/GPSFix"}
        gps_status: {$ref: "#/components/schemas/GPSStatus"}
    GPSFix:
      type: object
      description: >-
        G3-2: dấu GPS tùy chọn của app hiện trường — không bao giờ chặn lưu (tọa độ hỏng → gps_status = invalid, bỏ tọa độ).
        Nhận `lng` hoặc `lon`; số JSON đọc dạng thập phân (không float), làm tròn 7 chữ số.
      properties:
        lat: {type: number, minimum: -90, maximum: 90}
        lng: {type: number, minimum: -180, maximum: 180}
        lon: {type: number, minimum: -180, maximum: 180}
        accuracy_m: {type: number, minimum: 0}
    GPSStatus:
      type: string
      description: "Trạng thái máy báo; giá trị lạ lưu là unknown"
      enum: [ok, weak, denied, unavailable, timeout, no_device]
    LotCollection:
      type: object
      properties:
        lot_ref: {type: string, format: uuid}
        collection_order_ref: {type: string, format: uuid}
        explicit: {type: boolean}
        id: {type: string, format: uuid}
        seq: {type: integer}
        origin: {type: string, enum: [session, manual]}
        session_ref: {type: [string, "null"], format: uuid}
        supersedes_id: {type: [string, "null"], format: uuid}
        event_time: {type: string, format: date-time}
    RollCount:
      type: object
      properties:
        id: {type: string, format: uuid}
        seq: {type: integer}
        order_id: {type: string, format: uuid}
        plot_ref: {type: string, format: uuid}
        htx_ref: {type: string, format: uuid}
        stage: {type: string, enum: [bale, gather, boat_load]}
        rolls: {type: integer}
        loose_kg: {oneOf: [{$ref: "#/components/schemas/Kg"}, {type: "null"}]}
        discrepancy_reason: {type: [string, "null"]}
        supersedes_id: {type: [string, "null"], format: uuid}
        correction_reason: {type: [string, "null"]}
        device_id: {type: [string, "null"]}
        rule_version: {type: string}
        event_time: {type: string, format: date-time}
        recorded_at: {type: string, format: date-time}
        gps:
          type: object
          description: "G3-2 (chỉ ở GET …/roll-counts): tọa độ dạng chuỗi thập phân"
          properties: {lat: {type: string}, lng: {type: string}, accuracy_m: {type: [string, "null"]}}
        gps_status: {type: string, enum: [ok, weak, denied, unavailable, timeout, no_device, invalid, unknown]}
        harvest_check: {$ref: "#/components/schemas/HarvestCheck"}
    RollCountResult:
      type: object
      properties:
        roll_count: {$ref: "#/components/schemas/RollCount"}
        total: {type: object}
        reconciliation: {oneOf: [{$ref: "#/components/schemas/BuySideReconciliation"}, {type: "null"}]}
        publications: {type: array, items: {$ref: "#/components/schemas/ValveExport"}}
        harvest_check: {oneOf: [{$ref: "#/components/schemas/HarvestCheck"}, {type: "null"}]}
        warnings: {type: array, items: {type: string, enum: [fieldops.harvest_date_unknown, fieldops.harvest_date_unavailable]}}
    BuySideReconciliation:
      type: object
      properties:
        order_id: {type: string, format: uuid}
        plot_ref: {type: string, format: uuid}
