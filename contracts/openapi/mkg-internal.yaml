openapi: 3.1.0
info:
  title: MKG Internal API (api-internal)
  version: "1"
  description: |
    API nội bộ của vùng Mekong Green (mục 5, 11, 17) — đơn vị triển khai `cmd/api-internal`, cụm DB `mkg`.
    KHÔNG phải bề mặt của nền tảng: web-ops không sinh client từ tệp này. Hai listener:
      - bề mặt ứng dụng (`AG_HTTP_ADDR`, mặc định :8081) — OIDC + JWT;
      - bề mặt quản trị (`AG_ADMIN_HTTP_ADDR`, mặc định :8083) — OIDC + **MFA bắt buộc**; dữ liệu chủ và phê duyệt.
    Tenant = tài khoản MKG, lấy từ token (R-16). Mọi POST bắt buộc Idempotency-Key (R-51). Lỗi RFC 9457 (docs/errors.md, mục mkg/hub).
    Khối lượng là chuỗi thập phân kg, tối đa 3 chữ số (`"1520.500"`, R-10); tỷ lệ 6 chữ số; độ ẩm 2 chữ số; tọa độ WGS84 là số JSON.
    Dữ liệu sang nền tảng chỉ qua van công bố (contracts/publication/), không qua API này.
servers:
  - url: https://mkg-internal.agrigreen.local
    description: Bề mặt ứng dụng (chỉ trong vùng mkg)
  - url: https://mkg-admin.agrigreen.local
    description: Bề mặt quản trị (MFA)
security:
  - oidc: []
tags:
  - name: hub
    description: mkg/hub — hub, kho, bãi; lô; mẻ; dịch chuyển tồn; van công bố
paths:
  # --- mkg/hub: bề mặt quản trị (MFA) ---
  /v1/hub/facilities:
    post:
      summary: "[Quản trị] Đề xuất cơ sở mới (phiên bản 1, chờ duyệt)"
      description: Vai hub_operator. Chưa có hiệu lực tới khi người KHÁC có vai hub_approver duyệt (R-56).
      operationId: proposeHubFacility
      tags: [hub]
      servers: [{url: "https://mkg-admin.agrigreen.local"}]
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/FacilitySpecInput"}}}
      responses:
        "201": {description: Phiên bản chờ duyệt, content: {application/json: {schema: {$ref: "#/components/schemas/FacilityVersion"}}}}
        "200": {description: Gọi lặp cùng khóa (phát lại)}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
    get:
      summary: Liệt kê cơ sở hiện hành (đã duyệt)
      operationId: listHubFacilities
      tags: [hub]
      parameters:
        - {name: kind, in: query, schema: {type: string, enum: [hub, warehouse, yard]}}
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, maximum: 200}}
      responses:
        "200":
          description: Trang cơ sở
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/Facility"}}
                  next_cursor: {type: [string, "null"]}
  /v1/hub/facilities/{id}/versions:
    parameters: [{$ref: "#/components/parameters/FacilityID"}]
    post:
      summary: "[Quản trị] Đề xuất thay đổi (phiên bản mới, bắt buộc reason ≥ 10 ký tự)"
      description: Ngừng dùng = phiên bản `status = inactive` — không xóa cứng (RB-1). Tối đa một phiên bản chờ duyệt.
      operationId: proposeHubFacilityChange
      tags: [hub]
      servers: [{url: "https://mkg-admin.agrigreen.local"}]
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/FacilitySpecInput"}}}
      responses:
        "201": {description: Phiên bản chờ duyệt, content: {application/json: {schema: {$ref: "#/components/schemas/FacilityVersion"}}}}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
    get:
      summary: "[Quản trị] Lịch sử phiên bản (chờ duyệt, đã duyệt, từ chối)"
      operationId: listHubFacilityVersions
      tags: [hub]
      servers: [{url: "https://mkg-admin.agrigreen.local"}]
      responses:
        "200":
          description: Mới nhất trước
          content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: "#/components/schemas/FacilityVersion"}}}}}}
  /v1/hub/facilities/{id}/versions/{version}/decision:
    parameters:
      - {$ref: "#/components/parameters/FacilityID"}
      - {name: version, in: path, required: true, schema: {type: integer, minimum: 1}}
    post:
      summary: "[Quản trị] Duyệt hoặc từ chối phiên bản"
      description: |
        Vai hub_approver, KHÁC người đề xuất (403 self_approval_forbidden). Từ chối bắt buộc reason.
        Duyệt → dữ liệu chủ hiện hành + xuất van `hub_facility` và `hub_capacity` trong cùng giao dịch.
      operationId: decideHubFacilityVersion
      tags: [hub]
      servers: [{url: "https://mkg-admin.agrigreen.local"}]
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: {type: string, enum: [approved, rejected]}
                reason: {type: string, minLength: 10, maxLength: 500}
      responses:
        "201":
          description: Quyết định đã ghi
          content:
            application/json:
              schema:
                type: object
                properties:
                  version: {$ref: "#/components/schemas/FacilityVersion"}
                  facility: {oneOf: [{$ref: "#/components/schemas/Facility"}, {type: "null"}]}
                  publications: {type: array, items: {$ref: "#/components/schemas/ValveExport"}}
        "403": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
  /v1/hub/projections/rebuild:
    post:
      summary: "[Quản trị] Dựng lại bảng chiếu tồn theo lô từ sổ (R-22)"
      operationId: rebuildHubProjections
      tags: [hub]
      servers: [{url: "https://mkg-admin.agrigreen.local"}]
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      responses:
        "200": {description: Số dòng đã dựng, content: {application/json: {schema: {type: object, properties: {lot_balances: {type: integer}}}}}}
  # --- mkg/hub: bề mặt ứng dụng ---
  /v1/hub/facilities/{id}:
    parameters: [{$ref: "#/components/parameters/FacilityID"}]
    get:
      summary: Dữ liệu chủ hiện hành của cơ sở
      operationId: getHubFacility
      tags: [hub]
      responses:
        "200": {description: Cơ sở, content: {application/json: {schema: {$ref: "#/components/schemas/Facility"}}}}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/hub/facilities/{id}/inventory:
    parameters: [{$ref: "#/components/parameters/FacilityID"}]
    get:
      summary: Tồn theo lô (xếp theo rủi ro xuống cấp) và sức chứa — lô là nguồn sự thật duy nhất
      operationId: getHubInventory
      tags: [hub]
      responses:
        "200":
          description: Tồn
          content:
            application/json:
              schema:
                type: object
                properties:
                  facility: {$ref: "#/components/schemas/Facility"}
                  lots: {type: array, items: {$ref: "#/components/schemas/RankedLot"}}
                  capacity: {$ref: "#/components/schemas/Capacity"}
                  risk_rule: {type: string, example: "hub.risk.v2#0"}
  /v1/hub/facilities/{id}/dispatch-suggestion:
    parameters: [{$ref: "#/components/parameters/FacilityID"}]
    get:
      summary: Đề xuất thứ tự xuất theo rủi ro xuống cấp (không FEFO), không ghi
      operationId: suggestHubDispatch
      tags: [hub]
      parameters: [{name: mass_kg, in: query, schema: {$ref: "#/components/schemas/Kg"}}]
      responses:
        "200":
          description: Đề xuất
          content:
            application/json:
              schema:
                type: object
                properties:
                  risk_rule: {type: string}
                  lots: {type: array, items: {$ref: "#/components/schemas/RankedLot"}}
                  allocations: {type: array, items: {$ref: "#/components/schemas/Allocation"}}
                  shortfall_kg: {oneOf: [{$ref: "#/components/schemas/Kg"}, {type: "null"}]}
  /v1/hub/facilities/{id}/receipts:
    parameters: [{$ref: "#/components/parameters/FacilityID"}]
    post:
      summary: Nhận một lô có N nguồn (tỷ lệ Σ = 1 chính xác)
      description: Vai hub_operator. Nguồn khai cùng `mass_kg` (hệ chia tỷ lệ dư lớn nhất) hoặc cùng `ratio`. Vượt sức chứa vẫn ghi nhận, trả `over_capacity = true`.
      operationId: receiveHubLot
      tags: [hub]
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [product, sources]
              description: mass_kg bắt buộc trừ khi có weigh_ticket_ref (G3, Q-MKG-04).
              properties:
                id: {type: string, format: uuid, description: UUIDv7 do thiết bị sinh (R-11)}
                weigh_ticket_ref: {type: string, format: uuid, description: "G3: phiếu cân HUB_IN đã về hub — id lô và khối lượng theo phiếu"}
                manual_reason: {type: string, minLength: 10, maxLength: 500, description: "G3: lý do nhập tay (cân hỏng) — bắt buộc khi tham số hub.weigh.v1 ticket_required"}
                code: {type: string, pattern: "^[A-Z0-9][A-Z0-9_-]{1,39}$"}
                product: {$ref: "#/components/schemas/Product"}
                mass_kg: {$ref: "#/components/schemas/Kg"}
                moisture_pct: {$ref: "#/components/schemas/Pct"}
                sources:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [kind, ref]
                    properties:
                      kind: {type: string, enum: [plot, cooperative, roll_count, supplier, lot, stocktake]}
                      ref: {type: string, format: uuid}
                      mass_kg: {$ref: "#/components/schemas/Kg"}
                      ratio: {type: string, pattern: "^[0-9]+(\\.[0-9]{1,6})?$"}
                event_time: {type: string, format: date-time}
                device_id: {type: string}
      responses:
        "201":
          description: Lô + dịch chuyển receive
          content:
            application/json:
              schema:
                type: object
                properties:
                  lot: {$ref: "#/components/schemas/Lot"}
                  movement: {$ref: "#/components/schemas/Movement"}
                  over_capacity: {type: boolean}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/hub/facilities/{id}/batches:
    parameters: [{$ref: "#/components/parameters/FacilityID"}]
    post:
      summary: Chạy một mẻ sấy / nén / phân loại (hao hụt = vào − ra ≥ 0)
      description: Thành phần đầu vào được chụp tại thời điểm mẻ chạy; lô ra có nguồn là các lô vào, tỷ lệ theo khối lượng.
      operationId: runHubBatch
      tags: [hub]
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, inputs, outputs]
              properties:
                kind: {type: string, enum: [drying, compression, sorting]}
                inputs:
                  type: array
                  minItems: 1
                  items: {type: object, required: [lot_id, mass_kg], properties: {lot_id: {type: string, format: uuid}, mass_kg: {$ref: "#/components/schemas/Kg"}}}
                outputs:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [product, mass_kg]
                    properties:
                      code: {type: string}
                      product: {$ref: "#/components/schemas/Product"}
                      mass_kg: {$ref: "#/components/schemas/Kg"}
                      moisture_pct: {$ref: "#/components/schemas/Pct"}
                event_time: {type: string, format: date-time}
      responses:
        "201": {description: Mẻ + lô ra}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/hub/facilities/{id}/dispatches:
    parameters: [{$ref: "#/components/parameters/FacilityID"}]
    post:
      summary: Xuất hàng — phân bổ đủ theo lô, mặc định rủi ro xuống cấp cao trước
      operationId: dispatchHub
      tags: [hub]
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mass_kg]
              properties:
                mass_kg: {$ref: "#/components/schemas/Kg"}
                destination_ref: {type: string, format: uuid, description: Chuyến / đơn hàng (mkg/logistics, mkg/orders)}
                allocations:
                  type: array
                  description: Rỗng → theo đề xuất rủi ro; có → chỉ định tay, tổng phải bằng mass_kg
                  items: {type: object, required: [lot_id, mass_kg], properties: {lot_id: {type: string, format: uuid}, mass_kg: {$ref: "#/components/schemas/Kg"}}}
                event_time: {type: string, format: date-time}
      responses:
        "201": {description: Phiếu xuất + dịch chuyển}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/hub/facilities/{id}/capacity-snapshots:
    parameters: [{$ref: "#/components/parameters/FacilityID"}]
    post:
      summary: Chụp sức chứa và xuất qua van hub_capacity v1
      operationId: publishHubCapacity
      tags: [hub]
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      responses:
        "201": {description: Bản ghi van, content: {application/json: {schema: {$ref: "#/components/schemas/ValveExport"}}}}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/hub/facilities/{id}/publications:
    parameters: [{$ref: "#/components/parameters/FacilityID"}]
    get:
      summary: Lịch sử bản ghi đã xuất qua van (kiểm toán)
      operationId: listHubPublications
      tags: [hub]
      parameters: [{name: contract, in: query, schema: {type: string, enum: [hub_facility, hub_capacity], default: hub_capacity}}]
      responses:
        "200": {description: Mới nhất trước, content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: "#/components/schemas/ValveExport"}}}}}}}
  /v1/hub/lots/{id}:
    get:
      summary: Lô, nguồn gốc, tồn còn lại và mọi dịch chuyển
      operationId: getHubLot
      tags: [hub]
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        "200":
          description: Lô
          content:
            application/json:
              schema:
                type: object
                properties:
                  lot: {$ref: "#/components/schemas/Lot"}
                  remaining_kg: {$ref: "#/components/schemas/Kg"}
                  movements: {type: array, items: {$ref: "#/components/schemas/Movement"}}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/hub/movements/{id}/corrections:
    post:
      summary: Sửa sai bằng dòng bù ngược dấu (receive, dispatch)
      description: Không UPDATE/DELETE dòng gốc (RB-1). Mỗi dòng bù một lần; bù làm tồn âm → 409.
      operationId: correctHubMovement
      tags: [hub]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string, minLength: 10}
                event_time: {type: string, format: date-time}
      responses:
        "201": {description: Dòng bù, content: {application/json: {schema: {$ref: "#/components/schemas/Movement"}}}}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  # --- mkg/hub G3 (migration mkg 000009): tham số, kiểm kê, chuyển kho, đo lường ---
  /v1/hub/params/{set}:
    parameters: [{name: set, in: path, required: true, schema: {type: string, enum: [risk, weigh]}}]
    get:
      summary: "[Quản trị] Bộ tham số có phiên bản (hub.risk.v2 / hub.weigh.v1) và bộ đang áp dụng"
      description: "active_version dạng hub.risk.v2#n; #0 = mặc định tạm (chờ khách, C-4)."
      operationId: getHubParams
      tags: [hub]
      responses:
        "200": {description: Phiên bản mới trước, content: {application/json: {schema: {type: object, properties: {param_set: {type: string}, active_version: {type: string}, active: {type: object}, items: {type: array, items: {$ref: "#/components/schemas/ParamVersion"}}}}}}}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/hub/params/{set}/versions:
    parameters: [{name: set, in: path, required: true, schema: {type: string, enum: [risk, weigh]}}]
    post:
      summary: "[Quản trị] Đề xuất phiên bản tham số (chờ duyệt)"
      description: "Vai hub_operator. Một phiên bản chờ mỗi bộ. risk: age_horizon_days, age_weight, moisture_warn_pct, moisture_span_pct, moisture_weight, alert_saturation, alert_weight (Σ trọng số = 100), humidity_warn_pct, humidity_crit_pct, temp_warn_c, temp_crit_c, crit_alert_weight. weigh: tolerance_pct, tolerance_min_kg, ticket_required, kg_per_roll_default. Khóa lạ bị từ chối."
      operationId: proposeHubParams
      tags: [hub]
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [params, reason]
              properties:
                params: {type: object}
                reason: {type: string, minLength: 10, maxLength: 500}
                effective_from: {type: string, format: date-time}
      responses:
        "201": {description: Phiên bản chờ duyệt, content: {application/json: {schema: {$ref: "#/components/schemas/ParamVersion"}}}}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/hub/params/{set}/versions/{version}/decision:
    parameters:
      - {name: set, in: path, required: true, schema: {type: string, enum: [risk, weigh]}}
      - {name: version, in: path, required: true, schema: {type: integer, minimum: 1}}
    post:
      summary: "[Quản trị] Duyệt / từ chối phiên bản tham số"
      description: Vai hub_approver, KHÁC người đặt (R-56; DB chặn lần hai bằng CHECK).
      operationId: decideHubParams
      tags: [hub]
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [decision], properties: {decision: {type: string, enum: [approved, rejected]}, reason: {type: string, minLength: 10}}}}}
      responses:
        "201": {description: Quyết định, content: {application/json: {schema: {$ref: "#/components/schemas/ParamVersion"}}}}
        "403": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
  /v1/hub/facilities/{id}/stocktakes:
    parameters: [{$ref: "#/components/parameters/FacilityID"}]
    post:
      summary: Ghi một lần đếm kiểm kê (Q-MKG-06) — chờ duyệt
      description: Vai hub_operator. Dòng theo dạng hàng, phủ mọi dạng hàng đang có tồn; sổ chụp lúc đếm. Một phiên chờ mỗi cơ sở; đếm lại = supersedes_id + reason.
      operationId: submitHubStocktake
      tags: [hub]
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lines]
              properties:
                lines: {type: array, minItems: 1, items: {type: object, required: [product, counted_kg], properties: {product: {$ref: "#/components/schemas/Product"}, counted_kg: {$ref: "#/components/schemas/Kg"}}}}
                note: {type: string, maxLength: 500}
                supersedes_id: {type: string, format: uuid}
                reason: {type: string, minLength: 10}
                event_time: {type: string, format: date-time}
      responses:
        "201": {description: Phiên chờ duyệt, content: {application/json: {schema: {$ref: "#/components/schemas/Stocktake"}}}}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
    get:
      summary: Phiên kiểm kê của cơ sở (mới trước)
      operationId: listHubStocktakes
      tags: [hub]
      responses:
        "200": {description: Danh sách, content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: "#/components/schemas/Stocktake"}}}}}}}
  /v1/hub/stocktakes/{id}:
    get:
      summary: Một phiên kiểm kê kèm dịch chuyển điều chỉnh
      operationId: getHubStocktake
      tags: [hub]
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        "200": {description: Phiên kiểm kê, content: {application/json: {schema: {$ref: "#/components/schemas/Stocktake"}}}}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/hub/stocktakes/{id}/decision:
    post:
      summary: Duyệt / từ chối phiên kiểm kê
      description: "Vai hub_approver, KHÁC người đếm (R-56, app + CHECK DB). Duyệt: sổ phải còn đúng lúc đếm (không thì 409 hub.stocktake_stale); thừa → lô origin stocktake; thiếu → trừ theo hub.risk.v2; dịch chuyển adjustment ref stocktake."
      operationId: decideHubStocktake
      tags: [hub]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [decision], properties: {decision: {type: string, enum: [approved, rejected]}, reason: {type: string, minLength: 10}}}}}
      responses:
        "201": {description: Quyết định + điều chỉnh, content: {application/json: {schema: {$ref: "#/components/schemas/Stocktake"}}}}
        "403": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
  /v1/hub/facilities/{id}/transfers:
    parameters: [{$ref: "#/components/parameters/FacilityID"}]
    post:
      summary: Xuất chuyển kho sang cơ sở khác (Q-MKG-10) — đang đi đường
      description: Vai hub_operator. Phiếu xuất destination_ref = cơ sở đích, dịch chuyển transfer_out; allocations rỗng → theo hub.risk.v2.
      operationId: startHubTransfer
      tags: [hub]
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to_facility_id, mass_kg]
              properties:
                to_facility_id: {type: string, format: uuid}
                mass_kg: {$ref: "#/components/schemas/Kg"}
                allocations: {type: array, items: {type: object, required: [lot_id, mass_kg], properties: {lot_id: {type: string, format: uuid}, mass_kg: {$ref: "#/components/schemas/Kg"}}}}
                event_time: {type: string, format: date-time}
      responses:
        "201": {description: Phiếu chuyển, content: {application/json: {schema: {$ref: "#/components/schemas/Transfer"}}}}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/hub/facilities/{id}/transfers/{transfer}/receipt:
    parameters:
      - {$ref: "#/components/parameters/FacilityID"}
      - {name: transfer, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      summary: Nhận hàng chuyển ở cơ sở đích
      description: "Vai hub_operator. mass_kg (tay) hoặc weigh_ticket_refs (phiếu HUB_IN của lô nguồn đã về — Σ). Mỗi lô nguồn → lô mới origin transfer, nguồn kind = lot tỷ lệ 1; hao hụt đường = xuất − nhận."
      operationId: receiveHubTransfer
      tags: [hub]
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                mass_kg: {$ref: "#/components/schemas/Kg"}
                weigh_ticket_refs: {type: array, items: {type: string, format: uuid}}
                event_time: {type: string, format: date-time}
      responses:
        "201": {description: Phiếu chuyển đã nhận, content: {application/json: {schema: {$ref: "#/components/schemas/Transfer"}}}}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/hub/transfers/{id}:
    get:
      summary: Phiếu chuyển kho
      operationId: getHubTransfer
      tags: [hub]
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        "200": {description: Phiếu chuyển, content: {application/json: {schema: {$ref: "#/components/schemas/Transfer"}}}}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/hub/lots/{id}/measurements:
    get:
      summary: Phiếu cân ↔ lô, hàng dự kiến về, hao hụt đã quy kết (cả khi lô chưa về hub)
      operationId: getHubLotMeasurements
      tags: [hub]
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        "200":
          description: Đo lường của lô
          content:
            application/json:
              schema:
                type: object
                properties:
                  lot_ref: {type: string, format: uuid}
                  hub_in: {type: [object, "null"]}
                  hub_out: {type: [object, "null"]}
                  links: {type: array, items: {type: object, properties: {outcome: {type: string, enum: [pending, receipt, manual_receipt, within_tolerance, adjusted, variance_unresolved, transfer_arrival, dispatch_linked, dispatch_variance, dispatch_unmatched, stale]}}}}
                  expected_rolls: {type: object, additionalProperties: {type: integer}}
                  expected_kg: {oneOf: [{$ref: "#/components/schemas/Kg"}, {type: "null"}]}
                  weigh_param_version: {type: string}
                  loss: {type: [object, "null"]}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/hub/facilities/{id}/losses:
    parameters: [{$ref: "#/components/parameters/FacilityID"}]
    get:
      summary: Hao hụt đã quy kết cho cơ sở (đối soát hiện hành của mỗi lô)
      operationId: getHubFacilityLosses
      tags: [hub]
      responses:
        "200": {description: Tổng hợp, content: {application/json: {schema: {type: object, properties: {lots: {type: integer}, loss_alerts: {type: integer}, hub_in_kg: {$ref: "#/components/schemas/Kg"}, hub_out_kg: {$ref: "#/components/schemas/Kg"}, expected_loss_kg: {$ref: "#/components/schemas/Kg"}, abnormal_loss_kg: {$ref: "#/components/schemas/Kg"}}}}}}
        "404": {$ref: "#/components/responses/Problem"}
components:
  securitySchemes:
    oidc:
      type: openIdConnect
      openIdConnectUrl: https://auth.agrigreen.vn/realms/agrigreen/.well-known/openid-configuration
  parameters:
    IdempotencyKey: {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 8, maxLength: 200}}
    FacilityID: {name: id, in: path, required: true, schema: {type: string, format: uuid}}
  responses:
    Problem:
      description: Lỗi RFC 9457
      content: {application/problem+json: {schema: {type: object, properties: {type: {type: string}, title: {type: string}, status: {type: integer}, code: {type: string}, trace_id: {type: string}}}}}
  schemas:
    Kg: {type: string, pattern: "^-?[0-9]+(\\.[0-9]{1,3})?$", example: "1520.500"}
    Pct: {type: string, pattern: "^[0-9]{1,3}(\\.[0-9]{1,2})?$", example: "14.50"}
    Product: {type: string, enum: [straw_bale, straw_loose, dried_straw, compressed_bale]}
    ParamVersion:
      type: object
      properties:
        id: {type: string, format: uuid}
        param_set: {type: string, enum: [risk, weigh]}
        version: {type: integer}
        rule_version: {type: string, enum: [hub.risk.v2, hub.weigh.v1]}
        params: {type: object}
        reason: {type: string}
        effective_from: {type: string, format: date-time}
        proposed_by: {type: string, format: uuid}
        state: {type: string, enum: [pending, approved, rejected]}
        decided_by: {type: [string, "null"], format: uuid}
        decided_at: {type: [string, "null"], format: date-time}
    Stocktake:
      type: object
      properties:
        id: {type: string, format: uuid}
        facility_id: {type: string, format: uuid}
        status: {type: string, enum: [pending, approved, rejected, superseded]}
        lines: {type: array, items: {type: object, properties: {product: {$ref: "#/components/schemas/Product"}, book_kg: {$ref: "#/components/schemas/Kg"}, counted_kg: {$ref: "#/components/schemas/Kg"}, variance_kg: {$ref: "#/components/schemas/Kg"}}}}
        book_kg: {$ref: "#/components/schemas/Kg"}
        counted_kg: {$ref: "#/components/schemas/Kg"}
        variance_kg: {$ref: "#/components/schemas/Kg"}
        supersedes_id: {type: [string, "null"], format: uuid}
        counted_by: {type: string, format: uuid}
        decided_by: {type: [string, "null"], format: uuid}
        adjustments: {type: array, items: {type: object, properties: {lot_id: {type: string, format: uuid}, movement_id: {type: string, format: uuid}, qty_kg: {$ref: "#/components/schemas/Kg"}}}}
    Transfer:
      type: object
      properties:
        id: {type: string, format: uuid}
        from_facility_id: {type: string, format: uuid}
        to_facility_id: {type: string, format: uuid}
        dispatch_id: {type: string, format: uuid}
        status: {type: string, enum: [in_transit, received]}
        dispatched_kg: {$ref: "#/components/schemas/Kg"}
        received_kg: {oneOf: [{$ref: "#/components/schemas/Kg"}, {type: "null"}]}
        loss_kg: {oneOf: [{$ref: "#/components/schemas/Kg"}, {type: "null"}]}
        source_lots: {type: array, items: {type: object}}
        received_lots: {type: array, items: {type: object}}
        dispatched_at: {type: string, format: date-time}
        received_at: {type: [string, "null"], format: date-time}
    FacilitySpecInput:
      type: object
      required: [code, name, kind, location, province_code, capacity_kg, effective_from]
      properties:
        code: {type: string, pattern: "^[A-Z0-9][A-Z0-9_-]{1,31}$"}
        name: {type: string, maxLength: 200}
        kind: {type: string, enum: [hub, warehouse, yard]}
        parent_facility_id: {type: string, format: uuid}
        location: {type: object, required: [lat, lng], properties: {lat: {type: number}, lng: {type: number}}}
        boundary: {type: object, description: GeoJSON Polygon hoặc MultiPolygon WGS84}
        province_code: {type: string, pattern: "^[0-9]{2}$"}
        status: {type: string, enum: [active, inactive], default: active}
        capacity_kg: {$ref: "#/components/schemas/Kg"}
        effective_from: {type: string, format: date-time}
        reason: {type: string, minLength: 10, description: Bắt buộc từ phiên bản 2}
        event_time: {type: string, format: date-time}
    Facility:
      type: object
      properties:
        id: {type: string, format: uuid}
        code: {type: string}
        name: {type: string}
        kind: {type: string}
        parent_facility_id: {type: [string, "null"]}
        location: {type: object, properties: {lat: {type: number}, lng: {type: number}}}
        boundary: {type: object}
        province_code: {type: string}
        status: {type: string}
        capacity_kg: {$ref: "#/components/schemas/Kg"}
        capacity_tons: {type: string}
        effective_from: {type: string, format: date-time}
        version: {type: integer}
        version_id: {type: string, format: uuid}
        proposed_by: {type: string, format: uuid}
        approved_by: {type: string, format: uuid}
        approved_at: {type: string, format: date-time}
    FacilityVersion:
      type: object
      properties:
        id: {type: string, format: uuid}
        facility_id: {type: string, format: uuid}
        version: {type: integer}
        state: {type: string, enum: [pending, approved, rejected]}
        supersedes_id: {type: [string, "null"]}
        change_reason: {type: [string, "null"]}
        proposed_by: {type: string, format: uuid}
        decided_by: {type: [string, "null"]}
        decided_at: {type: [string, "null"]}
    Lot:
      type: object
      properties:
        id: {type: string, format: uuid}
        facility_id: {type: string, format: uuid}
        code: {type: string}
        product: {$ref: "#/components/schemas/Product"}
        origin: {type: string, enum: [receipt, transform]}
        batch_id: {type: [string, "null"]}
        initial_kg: {$ref: "#/components/schemas/Kg"}
        moisture_pct: {type: [string, "null"]}
        sources:
          type: array
          items: {type: object, properties: {kind: {type: string}, ref: {type: string, format: uuid}, ratio: {type: string, example: "0.333334"}, mass_kg: {type: string}}}
        event_time: {type: string, format: date-time}
        recorded_at: {type: string, format: date-time}
    Movement:
      type: object
      properties:
        id: {type: string, format: uuid}
        lot_id: {type: string, format: uuid}
        kind: {type: string, enum: [receive, transform_in, transform_out, dispatch, correction]}
        qty_kg: {$ref: "#/components/schemas/Kg"}
        balance_after_kg: {$ref: "#/components/schemas/Kg"}
        ref_type: {type: [string, "null"]}
        ref_id: {type: [string, "null"]}
        supersedes_id: {type: [string, "null"]}
        correction_reason: {type: [string, "null"]}
        event_time: {type: string, format: date-time}
        recorded_at: {type: string, format: date-time}
    RankedLot:
      type: object
      properties:
        lot_id: {type: string, format: uuid}
        code: {type: string}
        product: {type: string}
        remaining_kg: {$ref: "#/components/schemas/Kg"}
        moisture_pct: {type: [string, "null"]}
        received_at: {type: string, format: date-time}
        age_days: {type: integer}
        risk_score: {type: string, example: "35.4"}
    Allocation:
      type: object
      properties: {lot_id: {type: string, format: uuid}, mass_kg: {$ref: "#/components/schemas/Kg"}, risk_score: {type: string}}
    Capacity:
      type: object
      properties:
        capacity_kg: {type: string}
        used_kg: {type: string}
        available_kg: {type: string}
        capacity_tons: {type: string}
        used_tons: {type: string}
        available_tons: {type: string}
        as_of: {type: string, format: date-time}
    ValveExport:
      type: object
      description: Một dòng sổ mkg_hub.valve_export; id = event_id trên outbox của cụm mkg
      properties:
        id: {type: string, format: uuid}
        contract: {type: string, enum: [hub_facility, hub_capacity]}
        contract_version: {type: integer}
        event_type: {type: string}
        schema_version: {type: integer}
        subject_ref: {type: string, format: uuid}
        seq: {type: integer}
        payload: {type: object, description: ĐÚNG các trường của hợp đồng van}
        event_time: {type: string, format: date-time}
        recorded_at: {type: string, format: date-time}
