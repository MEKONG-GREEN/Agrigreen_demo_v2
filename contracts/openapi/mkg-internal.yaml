openapi: 3.1.0
info:
  title: MKG Internal API (api-internal)
  version: "1"
  description: |
    API nội bộ của vùng Mekong Green (mục 5, 11, 17) — đơn vị triển khai `cmd/api-internal`, cụm DB `mkg`.
    KHÔNG phải bề mặt của nền tảng: web-ops không sinh client từ tệp này. Hai listener:
      - bề mặt ứng dụng (`AG_HTTP_ADDR`, mặc định :8081) — OIDC + JWT;
      - bề mặt quản trị (`AG_ADMIN_HTTP_ADDR`, mặc định :8083) — OIDC + **MFA bắt buộc**; dữ liệu chủ và phê duyệt.
    Tenant = tài khoản MKG, lấy từ token (R-16). Mọi POST bắt buộc Idempotency-Key (R-51). Lỗi RFC 9457 (docs/errors.md, mục mkg/hub).
    Khối lượng là chuỗi thập phân kg, tối đa 3 chữ số (`"1520.500"`, R-10); tỷ lệ 6 chữ số; độ ẩm 2 chữ số; tọa độ WGS84 là số JSON.
    Dữ liệu sang nền tảng chỉ qua van công bố (contracts/publication/), không qua API này.
servers:
  - url: https://mkg-internal.agrigreen.local
    description: Bề mặt ứng dụng (chỉ trong vùng mkg)
  - url: https://mkg-admin.agrigreen.local
    description: Bề mặt quản trị (MFA)
security:
  - oidc: []
tags:
  - name: hub
    description: mkg/hub — hub, kho, bãi; lô; mẻ; dịch chuyển tồn; van công bố
  - name: fieldops
    description: mkg/fieldops — lệnh gom, ca tổ gom, đếm cuộn theo công đoạn, xác nhận HTX, đối soát chiều mua, đồng bộ app hiện trường MKG
paths:
  # --- mkg/hub: bề mặt quản trị (MFA) ---
  /v1/hub/facilities:
    post:
      summary: "[Quản trị] Đề xuất cơ sở mới (phiên bản 1, chờ duyệt)"
      description: Vai hub_operator. Chưa có hiệu lực tới khi người KHÁC có vai hub_approver duyệt (R-56).
      operationId: proposeHubFacility
      tags: [hub]
      servers: [{url: "https://mkg-admin.agrigreen.local"}]
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/FacilitySpecInput"}}}
      responses:
        "201": {description: Phiên bản chờ duyệt, content: {application/json: {schema: {$ref: "#/components/schemas/FacilityVersion"}}}}
        "200": {description: Gọi lặp cùng khóa (phát lại)}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
    get:
      summary: Liệt kê cơ sở hiện hành (đã duyệt)
      operationId: listHubFacilities
      tags: [hub]
      parameters:
        - {name: kind, in: query, schema: {type: string, enum: [hub, warehouse, yard]}}
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, maximum: 200}}
      responses:
        "200":
          description: Trang cơ sở
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/Facility"}}
                  next_cursor: {type: [string, "null"]}
  /v1/hub/facilities/{id}/versions:
    parameters: [{$ref: "#/components/parameters/FacilityID"}]
    post:
      summary: "[Quản trị] Đề xuất thay đổi (phiên bản mới, bắt buộc reason ≥ 10 ký tự)"
      description: Ngừng dùng = phiên bản `status = inactive` — không xóa cứng (RB-1). Tối đa một phiên bản chờ duyệt.
      operationId: proposeHubFacilityChange
      tags: [hub]
      servers: [{url: "https://mkg-admin.agrigreen.local"}]
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/FacilitySpecInput"}}}
      responses:
        "201": {description: Phiên bản chờ duyệt, content: {application/json: {schema: {$ref: "#/components/schemas/FacilityVersion"}}}}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
    get:
      summary: "[Quản trị] Lịch sử phiên bản (chờ duyệt, đã duyệt, từ chối)"
      operationId: listHubFacilityVersions
      tags: [hub]
      servers: [{url: "https://mkg-admin.agrigreen.local"}]
      responses:
        "200":
          description: Mới nhất trước
          content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: "#/components/schemas/FacilityVersion"}}}}}}
  /v1/hub/facilities/{id}/versions/{version}/decision:
    parameters:
      - {$ref: "#/components/parameters/FacilityID"}
      - {name: version, in: path, required: true, schema: {type: integer, minimum: 1}}
    post:
      summary: "[Quản trị] Duyệt hoặc từ chối phiên bản"
      description: |
        Vai hub_approver, KHÁC người đề xuất (403 self_approval_forbidden). Từ chối bắt buộc reason.
        Duyệt → dữ liệu chủ hiện hành + xuất van `hub_facility` và `hub_capacity` trong cùng giao dịch.
      operationId: decideHubFacilityVersion
      tags: [hub]
      servers: [{url: "https://mkg-admin.agrigreen.local"}]
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: {type: string, enum: [approved, rejected]}
                reason: {type: string, minLength: 10, maxLength: 500}
      responses:
        "201":
          description: Quyết định đã ghi
          content:
            application/json:
              schema:
                type: object
                properties:
                  version: {$ref: "#/components/schemas/FacilityVersion"}
                  facility: {oneOf: [{$ref: "#/components/schemas/Facility"}, {type: "null"}]}
                  publications: {type: array, items: {$ref: "#/components/schemas/ValveExport"}}
        "403": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
  /v1/hub/projections/rebuild:
    post:
      summary: "[Quản trị] Dựng lại bảng chiếu tồn theo lô từ sổ (R-22)"
      operationId: rebuildHubProjections
      tags: [hub]
      servers: [{url: "https://mkg-admin.agrigreen.local"}]
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      responses:
        "200": {description: Số dòng đã dựng, content: {application/json: {schema: {type: object, properties: {lot_balances: {type: integer}}}}}}
  # --- mkg/hub: bề mặt ứng dụng ---
  /v1/hub/facilities/{id}:
    parameters: [{$ref: "#/components/parameters/FacilityID"}]
    get:
      summary: Dữ liệu chủ hiện hành của cơ sở
      operationId: getHubFacility
      tags: [hub]
      responses:
        "200": {description: Cơ sở, content: {application/json: {schema: {$ref: "#/components/schemas/Facility"}}}}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/hub/facilities/{id}/inventory:
    parameters: [{$ref: "#/components/parameters/FacilityID"}]
    get:
      summary: Tồn theo lô (xếp theo rủi ro xuống cấp) và sức chứa — lô là nguồn sự thật duy nhất
      operationId: getHubInventory
      tags: [hub]
      responses:
        "200":
          description: Tồn
          content:
            application/json:
              schema:
                type: object
                properties:
                  facility: {$ref: "#/components/schemas/Facility"}
                  lots: {type: array, items: {$ref: "#/components/schemas/RankedLot"}}
                  capacity: {$ref: "#/components/schemas/Capacity"}
                  risk_rule: {type: string, example: hub.risk.v1}
  /v1/hub/facilities/{id}/dispatch-suggestion:
    parameters: [{$ref: "#/components/parameters/FacilityID"}]
    get:
      summary: Đề xuất thứ tự xuất theo rủi ro xuống cấp (không FEFO), không ghi
      operationId: suggestHubDispatch
      tags: [hub]
      parameters: [{name: mass_kg, in: query, schema: {$ref: "#/components/schemas/Kg"}}]
      responses:
        "200":
          description: Đề xuất
          content:
            application/json:
              schema:
                type: object
                properties:
                  risk_rule: {type: string}
                  lots: {type: array, items: {$ref: "#/components/schemas/RankedLot"}}
                  allocations: {type: array, items: {$ref: "#/components/schemas/Allocation"}}
                  shortfall_kg: {oneOf: [{$ref: "#/components/schemas/Kg"}, {type: "null"}]}
  /v1/hub/facilities/{id}/receipts:
    parameters: [{$ref: "#/components/parameters/FacilityID"}]
    post:
      summary: Nhận một lô có N nguồn (tỷ lệ Σ = 1 chính xác)
      description: Vai hub_operator. Nguồn khai cùng `mass_kg` (hệ chia tỷ lệ dư lớn nhất) hoặc cùng `ratio`. Vượt sức chứa vẫn ghi nhận, trả `over_capacity = true`.
      operationId: receiveHubLot
      tags: [hub]
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [product, mass_kg, sources]
              properties:
                id: {type: string, format: uuid, description: UUIDv7 do thiết bị sinh (R-11)}
                code: {type: string, pattern: "^[A-Z0-9][A-Z0-9_-]{1,39}$"}
                product: {$ref: "#/components/schemas/Product"}
                mass_kg: {$ref: "#/components/schemas/Kg"}
                moisture_pct: {$ref: "#/components/schemas/Pct"}
                sources:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [kind, ref]
                    properties:
                      kind: {type: string, enum: [plot, cooperative, roll_count, supplier, lot]}
                      ref: {type: string, format: uuid}
                      mass_kg: {$ref: "#/components/schemas/Kg"}
                      ratio: {type: string, pattern: "^[0-9]+(\\.[0-9]{1,6})?$"}
                event_time: {type: string, format: date-time}
                device_id: {type: string}
      responses:
        "201":
          description: Lô + dịch chuyển receive
          content:
            application/json:
              schema:
                type: object
                properties:
                  lot: {$ref: "#/components/schemas/Lot"}
                  movement: {$ref: "#/components/schemas/Movement"}
                  over_capacity: {type: boolean}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/hub/facilities/{id}/batches:
    parameters: [{$ref: "#/components/parameters/FacilityID"}]
    post:
      summary: Chạy một mẻ sấy / nén / phân loại (hao hụt = vào − ra ≥ 0)
      description: Thành phần đầu vào được chụp tại thời điểm mẻ chạy; lô ra có nguồn là các lô vào, tỷ lệ theo khối lượng.
      operationId: runHubBatch
      tags: [hub]
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, inputs, outputs]
              properties:
                kind: {type: string, enum: [drying, compression, sorting]}
                inputs:
                  type: array
                  minItems: 1
                  items: {type: object, required: [lot_id, mass_kg], properties: {lot_id: {type: string, format: uuid}, mass_kg: {$ref: "#/components/schemas/Kg"}}}
                outputs:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [product, mass_kg]
                    properties:
                      code: {type: string}
                      product: {$ref: "#/components/schemas/Product"}
                      mass_kg: {$ref: "#/components/schemas/Kg"}
                      moisture_pct: {$ref: "#/components/schemas/Pct"}
                event_time: {type: string, format: date-time}
      responses:
        "201": {description: Mẻ + lô ra}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/hub/facilities/{id}/dispatches:
    parameters: [{$ref: "#/components/parameters/FacilityID"}]
    post:
      summary: Xuất hàng — phân bổ đủ theo lô, mặc định rủi ro xuống cấp cao trước
      operationId: dispatchHub
      tags: [hub]
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mass_kg]
              properties:
                mass_kg: {$ref: "#/components/schemas/Kg"}
                destination_ref: {type: string, format: uuid, description: Chuyến / đơn hàng (mkg/logistics, mkg/orders)}
                allocations:
                  type: array
                  description: Rỗng → theo đề xuất rủi ro; có → chỉ định tay, tổng phải bằng mass_kg
                  items: {type: object, required: [lot_id, mass_kg], properties: {lot_id: {type: string, format: uuid}, mass_kg: {$ref: "#/components/schemas/Kg"}}}
                event_time: {type: string, format: date-time}
      responses:
        "201": {description: Phiếu xuất + dịch chuyển}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/hub/facilities/{id}/capacity-snapshots:
    parameters: [{$ref: "#/components/parameters/FacilityID"}]
    post:
      summary: Chụp sức chứa và xuất qua van hub_capacity v1
      operationId: publishHubCapacity
      tags: [hub]
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      responses:
        "201": {description: Bản ghi van, content: {application/json: {schema: {$ref: "#/components/schemas/ValveExport"}}}}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/hub/facilities/{id}/publications:
    parameters: [{$ref: "#/components/parameters/FacilityID"}]
    get:
      summary: Lịch sử bản ghi đã xuất qua van (kiểm toán)
      operationId: listHubPublications
      tags: [hub]
      parameters: [{name: contract, in: query, schema: {type: string, enum: [hub_facility, hub_capacity], default: hub_capacity}}]
      responses:
        "200": {description: Mới nhất trước, content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: "#/components/schemas/ValveExport"}}}}}}}
  /v1/hub/lots/{id}:
    get:
      summary: Lô, nguồn gốc, tồn còn lại và mọi dịch chuyển
      operationId: getHubLot
      tags: [hub]
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        "200":
          description: Lô
          content:
            application/json:
              schema:
                type: object
                properties:
                  lot: {$ref: "#/components/schemas/Lot"}
                  remaining_kg: {$ref: "#/components/schemas/Kg"}
                  movements: {type: array, items: {$ref: "#/components/schemas/Movement"}}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/hub/movements/{id}/corrections:
    post:
      summary: Sửa sai bằng dòng bù ngược dấu (receive, dispatch)
      description: Không UPDATE/DELETE dòng gốc (RB-1). Mỗi dòng bù một lần; bù làm tồn âm → 409.
      operationId: correctHubMovement
      tags: [hub]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string, minLength: 10}
                event_time: {type: string, format: date-time}
      responses:
        "201": {description: Dòng bù, content: {application/json: {schema: {$ref: "#/components/schemas/Movement"}}}}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}

  # --- mkg/fieldops: bề mặt ứng dụng (field_collector, field_supervisor) ---
  /v1/fieldops/orders:
    get:
      summary: Liệt kê lệnh gom (cursor)
      operationId: listCollectionOrders
      tags: [fieldops]
      parameters:
        - {name: status, in: query, schema: {type: string, enum: [planned, approved, assigned, closed, cancelled]}}
        - {name: htx_ref, in: query, schema: {type: string, format: uuid}}
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, maximum: 200}}
      responses:
        "200":
          description: Trang lệnh gom
          content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: "#/components/schemas/CollectionOrder"}}, next_cursor: {type: [string, "null"]}}}}}
    post:
      summary: Lập lệnh gom (planned) — vai field_supervisor
      description: Thửa/HTX đối chiếu với nền tảng qua Application API (tài khoản dịch vụ MKG); thửa phải thuộc HTX. Chưa công bố tới khi người KHÁC duyệt (R-56).
      operationId: createCollectionOrder
      tags: [fieldops]
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/CollectionPlanInput"}}}}
      responses:
        "201": {description: Lệnh gom, content: {application/json: {schema: {$ref: "#/components/schemas/CollectionOrderResult"}}}}
        "422": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
  /v1/fieldops/orders/{id}:
    parameters: [{$ref: "#/components/parameters/OrderID"}]
    get:
      summary: Lệnh gom hiện hành và lịch sử sự kiện
      operationId: getCollectionOrder
      tags: [fieldops]
      responses:
        "200": {description: Lệnh gom, content: {application/json: {schema: {type: object, properties: {order: {$ref: "#/components/schemas/CollectionOrder"}, history: {type: array, items: {type: object}}}}}}}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/fieldops/orders/{id}/revisions:
    parameters: [{$ref: "#/components/parameters/OrderID"}]
    post:
      summary: Sửa kế hoạch khi còn planned (revision + 1; người sửa thành người lập)
      operationId: reviseCollectionOrder
      tags: [fieldops]
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/CollectionPlanInput"}}}}
      responses:
        "201": {description: Lệnh gom, content: {application/json: {schema: {$ref: "#/components/schemas/CollectionOrderResult"}}}}
        "409": {$ref: "#/components/responses/Problem"}
  /v1/fieldops/orders/{id}/decision:
    parameters: [{$ref: "#/components/parameters/OrderID"}]
    post:
      summary: Duyệt (→ approved, công bố collection_schedule) hoặc từ chối (→ cancelled, bắt buộc reason)
      description: Vai field_supervisor, KHÁC người lập (R-56 — 403 self_approval_forbidden; CHECK DB lớp hai).
      operationId: decideCollectionOrder
      tags: [fieldops]
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [decision], properties: {decision: {type: string, enum: [approved, rejected]}, reason: {type: string, minLength: 10}}}}}
      responses:
        "201": {description: Lệnh gom, content: {application/json: {schema: {$ref: "#/components/schemas/CollectionOrderResult"}}}}
        "403": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
  /v1/fieldops/orders/{id}/assign:
    parameters: [{$ref: "#/components/parameters/OrderID"}]
    post:
      summary: Giao / đổi tổ gom (approved | assigned → assigned)
      operationId: assignCollectionOrder
      tags: [fieldops]
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [crew_ref], properties: {crew_ref: {type: string, format: uuid}}}}}}
      responses:
        "201": {description: Lệnh gom, content: {application/json: {schema: {$ref: "#/components/schemas/CollectionOrderResult"}}}}
        "409": {$ref: "#/components/responses/Problem"}
  /v1/fieldops/orders/{id}/close:
    parameters: [{$ref: "#/components/parameters/OrderID"}]
    post:
      summary: Đóng lệnh gom (assigned → closed)
      operationId: closeCollectionOrder
      tags: [fieldops]
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      responses:
        "201": {description: Lệnh gom, content: {application/json: {schema: {$ref: "#/components/schemas/CollectionOrderResult"}}}}
        "409": {$ref: "#/components/responses/Problem"}
  /v1/fieldops/orders/{id}/cancel:
    parameters: [{$ref: "#/components/parameters/OrderID"}]
    post:
      summary: Hủy lệnh gom (không xóa — sự kiện cancelled kèm lý do, RB-1)
      operationId: cancelCollectionOrder
      tags: [fieldops]
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [reason], properties: {reason: {type: string, minLength: 10}}}}}}
      responses:
        "201": {description: Lệnh gom, content: {application/json: {schema: {$ref: "#/components/schemas/CollectionOrderResult"}}}}
        "409": {$ref: "#/components/responses/Problem"}
  /v1/fieldops/orders/{id}/roll-counts:
    parameters: [{$ref: "#/components/parameters/OrderID"}]
    get:
      summary: Sổ đếm cuộn (cả bản bị bù) + số hiệu lực theo thửa/công đoạn + tổng theo công đoạn
      operationId: listRollCounts
      tags: [fieldops]
      responses:
        "200": {description: Sổ và tổng, content: {application/json: {schema: {type: object, properties: {counts: {type: array, items: {$ref: "#/components/schemas/RollCount"}}, totals: {type: array, items: {type: object}}, order_totals: {type: object, additionalProperties: {type: integer}}}}}}}
    post:
      summary: Ghi số một công đoạn (bale → gather → boat_load)
      description: |
        proto FM-03: công đoạn trước phải có số. FM-04: bằng công đoạn trước, hoặc ít hơn kèm `discrepancy_reason`; nhiều hơn → 422.
        FM-09: bắt buộc `rolls`; `loose_kg` chỉ khi `rolls = 0` (rơm rời). Mỗi (thửa, công đoạn) một số hiệu lực — sửa bằng bản bù.
        boat_load → cập nhật đối soát chiều mua và công bố bảng kê `htx_collection_statement`. Phát sự kiện NỘI BỘ `mkg.fieldops.roll_count.recorded`.
      operationId: recordRollCount
      tags: [fieldops]
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/RollCountInput"}}}}
      responses:
        "201": {description: Bản ghi, content: {application/json: {schema: {$ref: "#/components/schemas/RollCountResult"}}}}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/fieldops/roll-counts/{id}/corrections:
    parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
    post:
      summary: Bản ghi bù (RB-1) — bắt buộc correction_reason; công đoạn sau vẫn phải thỏa FM-04
      operationId: correctRollCount
      tags: [fieldops]
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/RollCountInput"}}}}
      responses:
        "201": {description: Bản bù, content: {application/json: {schema: {$ref: "#/components/schemas/RollCountResult"}}}}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/fieldops/orders/{id}/htx-confirmations:
    parameters: [{$ref: "#/components/parameters/OrderID"}]
    get:
      summary: Xác nhận của HTX trên lệnh gom
      operationId: listHTXConfirmations
      tags: [fieldops]
      responses:
        "200": {description: Danh sách, content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {type: object}}}}}}}
    post:
      summary: Ghi xác nhận / tranh chấp của HTX (G3 — nhân viên MKG ghi thay; HTX tự xác nhận qua nền tảng ở G3-2)
      operationId: recordHTXConfirmation
      tags: [fieldops]
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plot_ref, outcome, event_time]
              properties:
                plot_ref: {type: string, format: uuid}
                outcome: {type: string, enum: [confirmed, disputed]}
                htx_rolls: {type: integer, minimum: 0, description: "Bắt buộc khi disputed (khác số MKG)"}
                reason: {type: string, minLength: 10, description: "Bắt buộc khi disputed"}
                statement_revision: {type: integer, description: "Phiên bản bảng kê HTX đã xem; cũ → 409 fieldops.statement_stale"}
                evidence_ref: {type: string, format: uuid}
                event_time: {type: string, format: date-time}
      responses:
        "201": {description: Xác nhận và đối soát, content: {application/json: {schema: {type: object, properties: {confirmation: {type: object}, reconciliation: {$ref: "#/components/schemas/BuySideReconciliation"}}}}}}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/fieldops/orders/{id}/crew-shifts:
    parameters: [{$ref: "#/components/parameters/OrderID"}]
    get:
      summary: Ca tổ gom của lệnh
      operationId: listCrewShifts
      tags: [fieldops]
      responses:
        "200": {description: Danh sách, content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {type: object}}}}}}}
    post:
      summary: Mở / đóng ca tổ gom
      operationId: recordCrewShift
      tags: [fieldops]
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [crew_ref, kind, event_time]
              properties:
                crew_ref: {type: string, format: uuid}
                kind: {type: string, enum: [opened, closed]}
                headcount: {type: integer, minimum: 1, maximum: 200, description: "Bắt buộc khi opened"}
                equipment_refs: {type: array, maxItems: 50, items: {type: string}}
                event_time: {type: string, format: date-time}
                device_id: {type: string}
      responses:
        "201": {description: Ca, content: {application/json: {schema: {type: object}}}}
        "409": {$ref: "#/components/responses/Problem"}
  /v1/fieldops/orders/{id}/publications:
    parameters: [{$ref: "#/components/parameters/OrderID"}]
    get:
      summary: Bản ghi đã xuất qua van (collection_schedule, htx_collection_statement) — kiểm toán
      operationId: listFieldopsPublications
      tags: [fieldops]
      responses:
        "200": {description: Danh sách, content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: "#/components/schemas/ValveExport"}}}}}}}
  /v1/fieldops/reconciliation:
    get:
      summary: Đối soát chiều mua MKG ↔ HTX theo thửa (RB-6) — pending / match / mismatch
      operationId: listBuySideReconciliation
      tags: [fieldops]
      parameters:
        - {name: order_id, in: query, schema: {type: string, format: uuid}}
        - {name: status, in: query, schema: {type: string, enum: [pending, match, mismatch]}}
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, maximum: 500}}
      responses:
        "200":
          description: Trang đối soát
          content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: "#/components/schemas/BuySideReconciliation"}}, page_counts: {type: object}, next_cursor: {type: [string, "null"]}}}}}
  /v1/fieldops/htx/{id}/kg-per-roll:
    get:
      summary: kg/cuộn học theo HTX — nội bộ MKG, KHÔNG BAO GIỜ qua van
      description: Σ kg cân / Σ cuộn của 30 lô gom đã cân gần nhất của HTX → toàn tenant → cấu hình (AG_FIELDOPS_KG_PER_ROLL) → 20 (tạm, chờ khách).
      operationId: getKgPerRoll
      tags: [fieldops]
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        "200":
          description: kg/cuộn
          content: {application/json: {schema: {type: object, properties: {htx_ref: {type: string, format: uuid}, kg_per_roll: {type: string, example: "17.0"}, source: {type: string, enum: [htx, system, config, default]}, samples: {type: integer}, rule_version: {type: string}}}}}
  /v1/fieldops/kg-per-roll/refresh:
    post:
      summary: Kéo khối lượng cân của lô gom đã xếp ghe/xe từ mkg/measurement (port WeighedMass) — vai field_supervisor
      operationId: refreshKgPerRoll
      tags: [fieldops]
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      responses:
        "200": {description: Số lô vừa có khối lượng, content: {application/json: {schema: {type: object, properties: {weighed_lots_added: {type: integer}}}}}}
  /v1/fieldops/sync/push:
    post:
      summary: Đồng bộ chiều lên của app hiện trường MKG (hình dạng docs/dev/sync-contract.md, hiện thực trong vùng mkg)
      description: |
        Header `X-Device-Id` bắt buộc, trùng `device_id`. Tối đa 500 bản ghi; entity `roll_count` (op `create` | `correct`).
        `id` UUIDv7 máy sinh; `idem_key` dạng `dev:<device_id>:<seq>`. Kết quả theo từng bản ghi: accepted | duplicate | rejected.
      operationId: fieldopsSyncPush
      tags: [fieldops]
      parameters:
        - {$ref: "#/components/parameters/IdempotencyKey"}
        - {name: X-Device-Id, in: header, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device_id, records]
              properties:
                device_id: {type: string}
                records:
                  type: array
                  maxItems: 500
                  items:
                    type: object
                    required: [id, idem_key, entity, op, event_time, payload]
                    properties:
                      id: {type: string}
                      idem_key: {type: string}
                      entity: {type: string, enum: [roll_count]}
                      op: {type: string, enum: [create, correct]}
                      event_time: {type: string, format: date-time}
                      supersedes_id: {type: [string, "null"]}
                      correction_reason: {type: [string, "null"]}
                      payload:
                        type: object
                        properties:
                          order_id: {type: string, format: uuid}
                          plot_ref: {type: string, format: uuid}
                          stage: {type: string, enum: [bale, gather, boat_load]}
                          rolls: {type: integer, minimum: 0}
                          loose_kg: {$ref: "#/components/schemas/Kg"}
                          discrepancy_reason: {type: string}
                          htx_confirmation_ref: {type: string, format: uuid}
      responses:
        "200":
          description: Kết quả theo bản ghi
          content: {application/json: {schema: {type: object, properties: {results: {type: array, items: {type: object, properties: {id: {type: string}, status: {type: string, enum: [accepted, duplicate, rejected]}, code: {type: string}, errors: {type: array, items: {type: object}}}}}}}}}
        "403": {$ref: "#/components/responses/Problem"}
  /v1/fieldops/sync/pull:
    get:
      summary: Đồng bộ chiều xuống — entity collection_order (đã duyệt/đang làm → upsert; khác → tombstone)
      operationId: fieldopsSyncPull
      tags: [fieldops]
      parameters:
        - {name: X-Device-Id, in: header, required: true, schema: {type: string}}
        - {name: cursor, in: query, schema: {type: string, description: "Mờ, có chữ ký HMAC gắn tenant + tài khoản + thiết bị"}}
        - {name: limit, in: query, schema: {type: integer, maximum: 1000}}
      responses:
        "200":
          description: Trang thay đổi
          content: {application/json: {schema: {type: object, properties: {changes: {type: array, items: {type: object}}, next_cursor: {type: string}, has_more: {type: boolean}, server_time: {type: string, format: date-time}, reset: {type: boolean}}}}}
        "400": {$ref: "#/components/responses/Problem"}
components:
  securitySchemes:
    oidc:
      type: openIdConnect
      openIdConnectUrl: https://auth.agrigreen.vn/realms/agrigreen/.well-known/openid-configuration
  parameters:
    IdempotencyKey: {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 8, maxLength: 200}}
    FacilityID: {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    OrderID: {name: id, in: path, required: true, schema: {type: string, format: uuid}}
  responses:
    Problem:
      description: Lỗi RFC 9457
      content: {application/problem+json: {schema: {type: object, properties: {type: {type: string}, title: {type: string}, status: {type: integer}, code: {type: string}, trace_id: {type: string}}}}}
  schemas:
    Kg: {type: string, pattern: "^-?[0-9]+(\\.[0-9]{1,3})?$", example: "1520.500"}
    Pct: {type: string, pattern: "^[0-9]{1,3}(\\.[0-9]{1,2})?$", example: "14.50"}
    Product: {type: string, enum: [straw_bale, straw_loose, dried_straw, compressed_bale]}
    FacilitySpecInput:
      type: object
      required: [code, name, kind, location, province_code, capacity_kg, effective_from]
      properties:
        code: {type: string, pattern: "^[A-Z0-9][A-Z0-9_-]{1,31}$"}
        name: {type: string, maxLength: 200}
        kind: {type: string, enum: [hub, warehouse, yard]}
        parent_facility_id: {type: string, format: uuid}
        location: {type: object, required: [lat, lng], properties: {lat: {type: number}, lng: {type: number}}}
        boundary: {type: object, description: GeoJSON Polygon hoặc MultiPolygon WGS84}
        province_code: {type: string, pattern: "^[0-9]{2}$"}
        status: {type: string, enum: [active, inactive], default: active}
        capacity_kg: {$ref: "#/components/schemas/Kg"}
        effective_from: {type: string, format: date-time}
        reason: {type: string, minLength: 10, description: Bắt buộc từ phiên bản 2}
        event_time: {type: string, format: date-time}
    Facility:
      type: object
      properties:
        id: {type: string, format: uuid}
        code: {type: string}
        name: {type: string}
        kind: {type: string}
        parent_facility_id: {type: [string, "null"]}
        location: {type: object, properties: {lat: {type: number}, lng: {type: number}}}
        boundary: {type: object}
        province_code: {type: string}
        status: {type: string}
        capacity_kg: {$ref: "#/components/schemas/Kg"}
        capacity_tons: {type: string}
        effective_from: {type: string, format: date-time}
        version: {type: integer}
        version_id: {type: string, format: uuid}
        proposed_by: {type: string, format: uuid}
        approved_by: {type: string, format: uuid}
        approved_at: {type: string, format: date-time}
    FacilityVersion:
      type: object
      properties:
        id: {type: string, format: uuid}
        facility_id: {type: string, format: uuid}
        version: {type: integer}
        state: {type: string, enum: [pending, approved, rejected]}
        supersedes_id: {type: [string, "null"]}
        change_reason: {type: [string, "null"]}
        proposed_by: {type: string, format: uuid}
        decided_by: {type: [string, "null"]}
        decided_at: {type: [string, "null"]}
    Lot:
      type: object
      properties:
        id: {type: string, format: uuid}
        facility_id: {type: string, format: uuid}
        code: {type: string}
        product: {$ref: "#/components/schemas/Product"}
        origin: {type: string, enum: [receipt, transform]}
        batch_id: {type: [string, "null"]}
        initial_kg: {$ref: "#/components/schemas/Kg"}
        moisture_pct: {type: [string, "null"]}
        sources:
          type: array
          items: {type: object, properties: {kind: {type: string}, ref: {type: string, format: uuid}, ratio: {type: string, example: "0.333334"}, mass_kg: {type: string}}}
        event_time: {type: string, format: date-time}
        recorded_at: {type: string, format: date-time}
    Movement:
      type: object
      properties:
        id: {type: string, format: uuid}
        lot_id: {type: string, format: uuid}
        kind: {type: string, enum: [receive, transform_in, transform_out, dispatch, correction]}
        qty_kg: {$ref: "#/components/schemas/Kg"}
        balance_after_kg: {$ref: "#/components/schemas/Kg"}
        ref_type: {type: [string, "null"]}
        ref_id: {type: [string, "null"]}
        supersedes_id: {type: [string, "null"]}
        correction_reason: {type: [string, "null"]}
        event_time: {type: string, format: date-time}
        recorded_at: {type: string, format: date-time}
    RankedLot:
      type: object
      properties:
        lot_id: {type: string, format: uuid}
        code: {type: string}
        product: {type: string}
        remaining_kg: {$ref: "#/components/schemas/Kg"}
        moisture_pct: {type: [string, "null"]}
        received_at: {type: string, format: date-time}
        age_days: {type: integer}
        risk_score: {type: string, example: "35.4"}
    Allocation:
      type: object
      properties: {lot_id: {type: string, format: uuid}, mass_kg: {$ref: "#/components/schemas/Kg"}, risk_score: {type: string}}
    Capacity:
      type: object
      properties:
        capacity_kg: {type: string}
        used_kg: {type: string}
        available_kg: {type: string}
        capacity_tons: {type: string}
        used_tons: {type: string}
        available_tons: {type: string}
        as_of: {type: string, format: date-time}
    ValveExport:
      type: object
      description: Một dòng sổ valve_export (mkg_hub hoặc mkg_fieldops); id = event_id trên outbox của cụm mkg
      properties:
        id: {type: string, format: uuid}
        contract: {type: string, enum: [hub_facility, hub_capacity, collection_schedule, htx_collection_statement]}
        contract_version: {type: integer}
        event_type: {type: string}
        schema_version: {type: integer}
        subject_ref: {type: string, format: uuid}
        seq: {type: integer}
        payload: {type: object, description: ĐÚNG các trường của hợp đồng van}
        event_time: {type: string, format: date-time}
        recorded_at: {type: string, format: date-time}
    CollectionPlanInput:
      type: object
      required: [htx_ref, window_from, window_to, plot_refs]
      properties:
        htx_ref: {type: string, format: uuid}
        commune_code: {type: string, pattern: "^[0-9]{5}$", description: "Bỏ trống → mã xã của HTX từ nền tảng"}
        window_from: {type: string, format: date}
        window_to: {type: string, format: date, description: "≥ window_from, khung tối đa 90 ngày"}
        plot_refs: {type: array, minItems: 1, maxItems: 200, items: {type: string, format: uuid}}
    CollectionOrder:
      type: object
      properties:
        order_id: {type: string, format: uuid, description: "= mã lô gom (lot_ref của sự kiện nội bộ) và schedule_ref của van"}
        status: {type: string, enum: [planned, approved, assigned, closed, cancelled]}
        revision: {type: integer}
        htx_ref: {type: string, format: uuid}
        commune_code: {type: string}
        window_from: {type: string, format: date}
        window_to: {type: string, format: date}
        plot_refs: {type: array, items: {type: string, format: uuid}}
        crew_ref: {type: [string, "null"], format: uuid}
        reason: {type: [string, "null"]}
        created_by: {type: string, format: uuid}
        approved_by: {type: [string, "null"], format: uuid}
        approved_at: {type: [string, "null"], format: date-time}
        published: {type: boolean}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    CollectionOrderResult:
      type: object
      properties:
        order: {$ref: "#/components/schemas/CollectionOrder"}
        event: {type: object}
        publications: {type: array, items: {$ref: "#/components/schemas/ValveExport"}}
    RollCountInput:
      type: object
      required: [rolls, event_time]
      properties:
        id: {type: string, format: uuid, description: "UUIDv7 máy sinh (R-11); bỏ trống → server sinh"}
        plot_ref: {type: string, format: uuid, description: "Bắt buộc với bản gốc"}
        stage: {type: string, enum: [bale, gather, boat_load], description: "Bắt buộc với bản gốc"}
        rolls: {type: integer, minimum: 0}
        loose_kg: {$ref: "#/components/schemas/Kg"}
        discrepancy_reason: {type: string, minLength: 10, maxLength: 500}
        htx_confirmation_ref: {type: string, format: uuid}
        correction_reason: {type: string, minLength: 10, maxLength: 500, description: "Bắt buộc với bản bù"}
        event_time: {type: string, format: date-time}
        device_id: {type: string}
    RollCount:
      type: object
      properties:
        id: {type: string, format: uuid}
        seq: {type: integer}
        order_id: {type: string, format: uuid}
        plot_ref: {type: string, format: uuid}
        htx_ref: {type: string, format: uuid}
        stage: {type: string, enum: [bale, gather, boat_load]}
        rolls: {type: integer}
        loose_kg: {oneOf: [{$ref: "#/components/schemas/Kg"}, {type: "null"}]}
        discrepancy_reason: {type: [string, "null"]}
        supersedes_id: {type: [string, "null"], format: uuid}
        correction_reason: {type: [string, "null"]}
        device_id: {type: [string, "null"]}
        rule_version: {type: string}
        event_time: {type: string, format: date-time}
        recorded_at: {type: string, format: date-time}
    RollCountResult:
      type: object
      properties:
        roll_count: {$ref: "#/components/schemas/RollCount"}
        total: {type: object}
        reconciliation: {oneOf: [{$ref: "#/components/schemas/BuySideReconciliation"}, {type: "null"}]}
        publications: {type: array, items: {$ref: "#/components/schemas/ValveExport"}}
    BuySideReconciliation:
      type: object
      properties:
        order_id: {type: string, format: uuid}
        plot_ref: {type: string, format: uuid}
        htx_ref: {type: string, format: uuid}
        statement_ref: {type: string, format: uuid}
        statement_revision: {type: integer}
        mkg_rolls: {type: integer}
        mkg_roll_count_id: {type: string, format: uuid}
        htx_rolls: {type: [integer, "null"]}
        outcome: {type: [string, "null"], enum: [confirmed, disputed, null]}
        confirmation_id: {type: [string, "null"], format: uuid}
        confirmed_revision: {type: [integer, "null"]}
        status: {type: string, enum: [pending, match, mismatch]}
        updated_at: {type: string, format: date-time}
