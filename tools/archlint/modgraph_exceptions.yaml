# Ngoại lệ của agmodgraph (W1.2, ADR-0027 mục 5) — vi phạm ĐANG CÓ được chấp nhận tạm, đã rà soát.
#
# Quy tắc: tools/archlint/modgraph.go; quy trình: docs/dev/modules.md mục "Đồ thị module".
#   - Vi phạm mới (không có trong tệp này) làm hỏng `go run ./tools/archlint ./...`.
#   - Mục lỗi thời (vi phạm không còn xảy ra) cũng làm hỏng cổng: xóa mục trong cùng PR đã gỡ nó.
#   - Danh sách chỉ được co lại. Thêm mục mới cần review như thay đổi hợp đồng (ADR-0027) và
#     phải có rule, from, to, reason, owner (gói kế hoạch W<n>.<m> sẽ gỡ), until.
#   - Quy tắc `depends` không có ngoại lệ: chạy `go run ./tools/modgen`.
#
# Khóa: (rule, from, to). cycle/tier/version: from, to là module. schema: from là migration (hoặc
# module với owns_schema thừa), to là schema.

# Schema vận hành/dbadmin, không thuộc module nào (được phép lâu dài; phải còn được migration tạo).
ops_schemas:
  - schema: mkg_monitor
    reason: "vai giám sát sql_exporter cụm mkg (mkg 000013, docs/runbooks/ingest.md mục 7) — hàm SECURITY DEFINER chỉ trả số đếm, chủ là dbadmin"
  - schema: ts_monitor
    reason: "vai giám sát sql_exporter cụm ts (ts 000003) — cùng mẫu mkg_monitor, chủ là dbadmin"
  - schema: k_ref
    reason: "TẠM (W2.4, pf 000091): chỉ có hàm k_ref.ctx_uuid/ctx_text của lõi; W2.5 dựng module sở hữu k_ref (owns_schema) và XÓA mục này (cổng báo lỗi khi schema đã có chủ)"

