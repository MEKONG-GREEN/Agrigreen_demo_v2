# Khối ```sql được docsql bỏ qua (R-OPS-04). Không sửa bản tài liệu gốc trong
# docs/kien-truc/ để bỏ qua — ghi ở đây.
#
# Mỗi mục:
#   doc:    tên tệp tài liệu (không kèm thư mục)
#   block:  số thứ tự khối sql trong tài liệu, đếm từ 1 (để người đọc tìm; được kiểm khớp)
#   hash:   ≥ 8 ký tự hex đầu của SHA-256 thân khối — xem: go run ./tools/docsql -list TỆP.md
#   reason: lý do. Khối minh họa: "minh họa: …". Lỗi tài liệu: "lỗi trong tài liệu v4.1: …"
#           và thêm câu hỏi vào docs/cau-hoi-ton-dong.md mục H.
#
# Khối đổi nội dung → hash đổi → mục thành "thừa" và docsql hỏng: xem lại mục đó.
#
