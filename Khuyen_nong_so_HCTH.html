:root{
  --primary:#00A82D;--primary-hover:#008F26;--primary-text:#007A20;
  --accent:#00A3E0;--ghost-bg:#F1F5F9;--ghost-hover:#E2E8F0;--ghost-text:#334155;
  --destructive:#E74C3C;
  --text-1:#0F172A;--text-2:#475569;--text-3:#64748B;--disabled-bg:#E2E8F0;--disabled-text:#94A3B8;
  --app-bg:#F8FAFC;--border:#E2E8F0;--brand-deep:#1E5C39;--brand-deepest:#123B24;
  --s-solid:#00A82D;--s-soft:#E6F6EA;--s-text:#007A20;
  --i-solid:#00A3E0;--i-soft:#E5F5FB;--i-text:#00719C;
  --w-solid:#F5A623;--w-soft:#FEF3E0;--w-text:#9A5A00;
  --d-solid:#E74C3C;--d-soft:#FCEAE8;--d-text:#C0392B;
  --n-solid:#95A5A6;--n-soft:#F1F5F9;--n-text:#475569;
  --shadow:0 8px 16px rgba(0,0,0,.15);
  --canvas:#E5E5E5;--frame-label:#7A7A7A;
  --font-heading:"Noto Serif",Georgia,"Times New Roman",serif;
  
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--canvas);color:var(--text-1);font-family:Roboto,system-ui,"Segoe UI",Arial,sans-serif;font-size:16px;line-height:1.5;font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--font-heading);margin:0}

/* Figma chrome */
.topbar{position:sticky;top:0;z-index:5;background:#2C2C2C;color:#fff;font-family:Roboto,system-ui,Arial,sans-serif;font-size:14px;display:flex;align-items:center;gap:16px;padding:0 16px;height:44px}
.topbar b{font-weight:500}
.topbar nav{display:flex;gap:2px;overflow-x:auto}
.topbar a{color:#B3B3B3;text-decoration:none;padding:6px 10px;border-radius:6px;white-space:nowrap}
.topbar a:hover{background:#3D3D3D;color:#fff}
.canvas{padding:48px clamp(16px,4vw,64px) 96px;display:flex;flex-direction:column;gap:64px}
.frame-wrap{min-width:0}
.frame-name{font-family:Roboto,system-ui,Arial,sans-serif;font-size:14px;color:var(--frame-label);margin:0 0 6px}
.frame-scroll{overflow:visible}
.screen{width:100%;max-width:1440px;height:900px;background:var(--app-bg);overflow:hidden;position:relative}

/* Atoms */
.btn{font:inherit;font-weight:600;font-size:16px;height:42px;padding:0 18px;border-radius:8px;border:0;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;white-space:nowrap}
.btn.sm{height:32px;padding:0 12px;font-size:15px}
.p{background:var(--primary);color:#fff}.p:hover{background:var(--primary-hover)}
.g{background:var(--ghost-bg);color:var(--ghost-text)}.g:hover{background:var(--ghost-hover)}
.d{background:var(--destructive);color:#fff}
.btn[disabled]{background:var(--disabled-bg);color:var(--disabled-text);cursor:not-allowed}
.ico{width:16px;height:16px;flex:none}
.field label{display:block;font-size:15px;font-weight:600;margin-bottom:6px}
.field label i{color:var(--d-text);font-style:normal}
.inp{height:42px;width:100%;border:1px solid var(--border);border-radius:8px;padding:0 12px;font:inherit;color:var(--text-1);background:#fff}
.inp::placeholder{color:var(--text-3)}
.inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,163,224,.25)}
.inp.sm{height:36px}
.hint{font-size:14px;color:var(--text-3);margin-top:4px}
.cb{width:18px;height:18px;border:1.5px solid #94A3B8;border-radius:4px;display:inline-grid;place-items:center;background:#fff;vertical-align:middle}
.cb.on{background:var(--primary);border-color:var(--primary)}
.badge{display:inline-flex;align-items:center;font-size:14px;font-weight:600;padding:2px 10px;border-radius:999px;border:1px solid;white-space:nowrap;font-family:Roboto,system-ui,Arial,sans-serif}
.b-s{background:var(--s-soft);color:var(--s-text);border-color:rgba(0,122,32,.22)}
.b-i{background:var(--i-soft);color:var(--i-text);border-color:rgba(0,113,156,.22)}
.b-w{background:var(--w-soft);color:var(--w-text);border-color:rgba(154,90,0,.22)}
.b-d{background:var(--d-soft);color:var(--d-text);border-color:rgba(192,57,43,.22)}
.b-n{background:var(--n-soft);color:var(--n-text);border-color:rgba(71,85,105,.22)}
.dot{display:inline-flex;align-items:center;gap:6px;font-size:15px;white-space:nowrap}
.dot::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--c)}
.banner{display:flex;gap:10px;align-items:flex-start;border:1px solid;border-radius:8px;padding:10px 12px;font-size:15px}
.banner b{display:block}
.card{background:#fff;border:1px solid var(--border);border-radius:16px}
.card-hd{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 16px 0}
.card-hd h3{font-size:20.5px}
.card-bd{padding:16px}
.seg{display:inline-flex;background:var(--ghost-bg);border-radius:8px;padding:3px}
.seg button{font:inherit;font-size:15px;font-weight:600;border:0;background:transparent;color:var(--text-2);padding:6px 14px;border-radius:6px;cursor:pointer}
.seg button[aria-pressed="true"]{background:#fff;color:var(--text-1);box-shadow:0 0 0 1px var(--border)}
.tabs{display:flex;gap:24px;border-bottom:1px solid var(--border)}
.tabs button{font:inherit;font-size:16px;font-weight:600;color:var(--text-3);padding:10px 0;margin-bottom:-1px;background:none;border:0;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.tabs button[aria-selected="true"]{color:var(--text-1);box-shadow:inset 0 -2px 0 var(--accent)}
.tabs .count{font-size:12.5px;background:var(--ghost-bg);color:var(--text-2);padding:0 6px;border-radius:999px}
.hatch{background:repeating-linear-gradient(45deg,#EEF2F6 0 8px,#F8FAFC 8px 16px);border:1px dashed #CBD5E1;border-radius:10px;display:grid;place-items:center;color:var(--text-3);font-size:14px}
.avatar{width:32px;height:32px;border-radius:50%;background:#E6F6EA;color:var(--brand-deepest);display:grid;place-items:center;font-weight:700;font-size:14px}
.muted{color:var(--text-3)}
.user-menu{position:relative;z-index:20}
.user{display:flex;align-items:center;gap:10px;background:none;border:0;padding:4px 8px 4px 4px;border-radius:999px;font:inherit;cursor:pointer;text-align:left;color:inherit}
.user:hover,.user[aria-expanded="true"]{background:var(--ghost-bg)}
.user .avatar{width:32px;height:32px;font-size:14px;flex:none}
.user .u-tx{display:flex;flex-direction:column}
.user .uname{font-size:15px;font-weight:600;line-height:1.25;color:var(--text-1);white-space:nowrap}
.user .role{font-size:12.5px;line-height:1.25;color:var(--text-3);white-space:nowrap}
.user .u-chev{width:14px;height:14px;color:var(--text-3);transition:transform .15s}
.user[aria-expanded="true"] .u-chev{transform:rotate(180deg)}
.u-pop{position:absolute;right:0;top:calc(100% + 8px);width:260px;background:#fff;border:1px solid var(--border);border-radius:14px;box-shadow:0 16px 40px -8px rgba(15,23,42,.22);padding:6px;color:var(--text-1)}
.u-pop[hidden]{display:none}
.u-pop .u-hd{display:flex;gap:12px;align-items:center;padding:12px 10px 14px;border-bottom:1px solid var(--border);margin-bottom:6px}
.u-pop .u-hd .avatar{width:40px;height:40px;font-size:16px}
.u-pop .u-hd b{display:block;font-size:16px}
.u-pop .u-hd small{display:block;font-size:14px;color:var(--text-3)}
.u-pop .u-hd .badge{margin-top:6px}
.u-it{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border:0;background:none;border-radius:8px;font:inherit;font-size:15px;color:var(--text-1);cursor:pointer;text-align:left}
.u-it:hover,.u-it:focus-visible{background:var(--ghost-bg);outline:none}
.u-it svg{width:18px;height:18px;flex:none;color:var(--text-2)}
.u-it.out{color:var(--d-text)}.u-it.out svg{color:var(--d-text)}.u-it.out:hover{background:var(--d-soft)}
.u-sep{height:1px;background:var(--border);margin:6px 4px}
@media (prefers-reduced-motion:reduce){.user .u-chev{transition:none}}
.small{font-size:14px}

/* Table */
table{border-collapse:collapse;width:100%;font-size:15px}
th{text-align:left;font-size:12.5px;font-weight:600;color:var(--text-3);padding:10px 16px;border-bottom:1px solid var(--border);white-space:nowrap;background:#fff}
td{padding:8px 16px;height:48px;border-bottom:1px solid var(--border);white-space:nowrap}
tbody tr:hover td{background:var(--app-bg)}
tr.sel td{background:var(--i-soft)!important}
.num{text-align:right}
.kebab{color:var(--text-3);font-weight:700;letter-spacing:1px}

/* Shell */
.shell{display:grid;grid-template-columns:248px 1fr;grid-template-rows:100%;height:100%}
.side{background:linear-gradient(180deg,var(--brand-deepest),var(--brand-deep));color:#fff;padding:20px 14px;display:flex;flex-direction:column}
.logo{display:flex;align-items:center;gap:10px;padding:2px 6px 20px}
.logo-mark{width:36px;height:36px;border-radius:10px;background:var(--primary);display:grid;place-items:center;font-weight:700;font-size:15px}
.logo b{font-family:Roboto,system-ui,Arial,sans-serif;font-weight:700;font-size:18.5px}
.side h4{font-size:12.5px;font-weight:600;opacity:.6;margin:16px 10px 6px}
.side{overflow-y:auto}
.ni{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:8px;font:inherit;font-size:15px;color:rgba(255,255,255,.88);background:none;border:0;cursor:pointer;text-align:left;min-height:36px}
.ni:hover{background:rgba(255,255,255,.08);color:#fff}
.ni svg.i{width:18px;height:18px;flex:none;opacity:.85}
.ni .lbl{flex:1;min-width:0}
.ni .chev{width:14px;height:14px;flex:none;opacity:.7;transition:transform .15s}
.ni[aria-expanded="true"] .chev{transform:rotate(90deg)}
.ni.on{background:#E6F6EA;color:var(--brand-deepest);font-weight:600;box-shadow:inset 3px 0 0 var(--primary)}
.ni.on svg.i{opacity:1}
.ni.parent-on{color:#fff;font-weight:600}
.ni .cnt{font-size:12.5px;font-weight:600;padding:0 7px;border-radius:999px;background:rgba(255,255,255,.16);color:#fff}
.ni.on .cnt{background:var(--w-soft);color:var(--w-text)}
.sub{margin:2px 0 4px 19px;padding-left:10px;border-left:1px solid rgba(255,255,255,.16);display:flex;flex-direction:column;gap:2px}
.sub[hidden]{display:none}
.sub .ni{padding:7px 10px;min-height:34px}
@media (prefers-reduced-motion:reduce){.ni .chev{transition:none}}
/* Collapsed rail */
.rail{width:72px;background:linear-gradient(180deg,var(--brand-deepest),var(--brand-deep));padding:16px 12px;display:flex;flex-direction:column;align-items:center;gap:4px;border-radius:12px}
.rail .ri{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;color:rgba(255,255,255,.88);position:relative}
.rail .ri svg{width:20px;height:20px}
.rail .ri.on{background:#E6F6EA;color:var(--brand-deepest);box-shadow:inset 3px 0 0 var(--primary)}
.rail .ri.hover{background:rgba(255,255,255,.08)}
.rail .sep{width:28px;height:1px;background:rgba(255,255,255,.16);margin:8px 0}
.flyout{position:absolute;left:56px;top:0;width:200px;background:#fff;border-radius:12px;box-shadow:var(--shadow);padding:8px;color:var(--text-1);z-index:2}
.flyout b{display:block;font-size:12.5px;color:var(--text-3);padding:4px 10px 6px}
.flyout div{padding:8px 10px;border-radius:8px;font-size:15px}
.flyout .on{background:#E6F6EA;color:var(--brand-deepest);font-weight:600}
.spec{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.spec .navbox{background:linear-gradient(180deg,var(--brand-deepest),var(--brand-deep));padding:8px;border-radius:12px}
.spec .ni{cursor:default}
.frame{background:#fff;padding:32px}
.frame h2{font-size:26px;margin:0 0 4px}
.frame .desc{color:var(--text-2);margin:0 0 24px;max-width:75ch}
.set-label{font-family:Roboto,system-ui,Arial,sans-serif;font-size:12.5px;color:#9747FF;margin:0 0 6px}
.set-label::before{content:"❖ "}
.set{border:1px dashed #9747FF;border-radius:6px;padding:20px;display:inline-block}
.side-foot{margin-top:auto;display:flex;align-items:center;gap:10px;padding:14px 6px 0;border-top:1px solid rgba(255,255,255,.12);font-size:14px;line-height:1.35}
.side-foot .mark{width:24px;height:24px;border-radius:7px;background:var(--primary);display:grid;place-items:center;font-size:9px;font-weight:700;color:#fff;flex:none}
.side-foot b{display:block;font-size:14px;font-weight:600;color:#fff}
.side-foot small{display:block;font-size:12.5px;color:rgba(255,255,255,.6)}
.side nav{margin-bottom:16px}
.main{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden}
.top{height:72px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:16px;padding:0 32px}
.search{position:relative;width:360px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%)}
.search .inp{padding-left:36px;height:38px}
/* Footer variants */
.app-foot{flex:none;font-size:14px;color:var(--text-3)}
.app-foot a{color:var(--text-2);text-decoration:none}
.app-foot a:hover{color:var(--primary-text);text-decoration:underline}
.app-foot .links{display:flex;gap:16px}
.app-foot .mark{width:20px;height:20px;border-radius:6px;background:var(--primary);display:grid;place-items:center;font-size:8px;font-weight:700;color:#fff;flex:none}
/* A: minimal, nằm trên canvas */
.foot-a{height:44px;margin:0 32px;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.foot-a .l{display:flex;align-items:center;gap:8px}
.foot-a .l b{color:var(--text-1);font-weight:600}
.foot-a .r{display:flex;align-items:center;gap:16px}
.foot-a .sep{width:1px;height:12px;background:var(--border)}
/* B: trắng 2 tầng */
.foot-b{background:#fff;border-top:1px solid var(--border);padding:16px 32px 12px}
.foot-b .t{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;padding-bottom:12px;border-bottom:1px solid var(--border)}
.foot-b .t .l{display:flex;gap:10px;align-items:center}
.foot-b .t .l b{display:block;color:var(--text-1);font-size:15px}
.foot-b .cols{display:flex;gap:40px}
.foot-b .cols small{display:block;font-size:12.5px;font-weight:600;color:var(--text-3);margin-bottom:2px}
.foot-b .cols span{color:var(--text-1)}
.foot-b .btm{display:flex;justify-content:space-between;padding-top:10px}
/* C: soft brand */
.foot-c{height:44px;background:#E6F6EA;color:var(--brand-deep);display:flex;align-items:center;justify-content:center;gap:12px;font-weight:500}
.foot-c a{color:var(--brand-deepest);font-weight:600}
.foot-c .dot-s{width:4px;height:4px;border-radius:50%;background:currentColor;opacity:.5}
.page-hd h1.hero{font-size:32.5px;line-height:1.2}
.back{display:inline-block;font-size:16px;font-weight:600;color:var(--primary-text);text-decoration:none;margin-bottom:12px}
.back:hover{text-decoration:underline}
.bc{display:flex;align-items:center;gap:10px;font-size:18.5px}
.bc a{color:var(--text-2);text-decoration:none}
.bc a:hover{color:var(--primary-text)}
.bc .sep{color:var(--text-3)}
.bc [aria-current]{color:var(--text-1);font-weight:600}
.top-title{font-size:26px;line-height:1.3}
.top .right{margin-left:auto;display:flex;align-items:center;gap:16px}
.content{padding:28px 32px;overflow:hidden;flex:1}
.page-hd{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px}
.page-hd h1{font-size:26px;line-height:1.3}
.crumb{font-size:14px;color:var(--text-3);margin-bottom:6px}
.crumb a{color:var(--primary-text);text-decoration:none}

/* Login */
.login{position:relative;height:100%;display:grid;grid-template-columns:1fr 448px;gap:80px;align-items:center;padding:48px 96px;overflow:hidden;background:var(--brand-deepest)}
.login::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(90deg,rgba(18,59,36,.78) 0%,rgba(18,59,36,.45) 38%,rgba(18,59,36,.08) 62%,rgba(18,59,36,0) 100%),linear-gradient(0deg,rgba(18,59,36,.55) 0%,rgba(18,59,36,0) 35%)}
.login-brand{position:relative;z-index:2;height:100%;color:#fff;display:flex;flex-direction:column;justify-content:space-between}
.login-brand .logo{padding:0}
.login-brand .logo b{font-size:20.5px}
.login-brand h1{font-size:52px;line-height:1.15;max-width:15ch;text-shadow:0 2px 16px rgba(0,0,0,.25)}
.login-brand p{margin:16px 0 0;opacity:.9;max-width:44ch;font-size:18.5px;line-height:1.6}
.login-brand .accent{width:56px;height:4px;border-radius:2px;background:var(--w-solid);margin-bottom:24px}
.login-brand .eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(6px);margin-bottom:20px}
.login-brand .eyebrow::before{content:"";width:6px;height:6px;border-radius:50%;background:#7CE495}
.login-brand .foot{display:flex;justify-content:space-between;font-size:14px;opacity:.75}
.pattern{position:absolute;right:-80px;bottom:-80px;width:520px;opacity:.12}
.login-photo{position:absolute;inset:0;z-index:0;width:100%;height:100%;object-fit:cover;object-position:center}
.login-form{position:relative;z-index:2;background:#fff;border-radius:20px;padding:40px;box-shadow:0 30px 60px -12px rgba(0,0,0,.35),0 0 0 1px rgba(255,255,255,.6)}
.login-box{width:100%;display:flex;flex-direction:column;gap:18px}
.login-box h2{font-size:32.5px;line-height:1.2}
.pw{position:relative}.pw button{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:0;font:inherit;font-size:15px;font-weight:600;color:var(--primary-text);cursor:pointer}
.row{display:flex;align-items:center;gap:8px}
.between{display:flex;align-items:center;justify-content:space-between}


/* Chọn phòng ban */
.dept{position:relative;height:100%;display:flex;flex-direction:column;overflow:hidden;background:var(--brand-deepest)}
.dept-photo{position:absolute;inset:0;z-index:0;width:100%;height:100%;object-fit:cover;object-position:center}
.dept::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(18,59,36,.55) 0%,rgba(18,59,36,.35) 35%,rgba(18,59,36,.6) 100%)}
.dept>*:not(.dept-photo){position:relative;z-index:2}
.dept>.dept-top{z-index:3}
.dept-top{height:72px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 120px;color:#fff;border-bottom:1px solid rgba(255,255,255,.16)}
.dept-top .logo{padding:0}.dept-top .logo b{font-size:20.5px}
.dept-top .who{display:flex;align-items:center;gap:16px}
.dept-top .user .avatar{background:#fff}
.dept-top .user .uname{color:#fff}.dept-top .user .role,.dept-top .user .u-chev{color:rgba(255,255,255,.75)}
.dept-top .user:hover,.dept-top .user[aria-expanded="true"]{background:rgba(255,255,255,.14)}
.dept-top .user .avatar{color:var(--brand-deepest)}
.btn.ol{background:rgba(255,255,255,.12);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.35);backdrop-filter:blur(6px)}.btn.ol:hover{background:rgba(255,255,255,.22)}
.dept-body{flex:1;min-height:0;padding:56px 120px 48px;overflow:auto}
.dept-hd h1{font-size:39px;line-height:1.2;color:#fff;text-shadow:0 2px 16px rgba(0,0,0,.25)}
.dept-hd p{margin:8px 0 0;font-size:18.5px;color:rgba(255,255,255,.88)}
.dept-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;margin-top:40px}
.opt{display:flex;flex-direction:column;align-items:flex-start;padding:30px;border:1px solid rgba(255,255,255,.7);border-radius:16px;background:rgba(255,255,255,.96);box-shadow:0 12px 32px -8px rgba(0,0,0,.28);cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%;transition:border-color .15s,box-shadow .15s}
.opt:hover,.opt:focus-visible{background:#fff;border-color:var(--primary);box-shadow:0 0 0 3px rgba(0,168,45,.25),0 16px 36px -8px rgba(0,0,0,.32);outline:none}
.opt .oi{width:60px;height:60px;border-radius:14px;display:grid;place-items:center;background:var(--s-soft);color:var(--brand-deep);margin-bottom:28px}
.opt .oi svg{width:26px;height:26px}
.opt b{font-family:var(--font-heading);font-size:24px;font-weight:700;line-height:1.3}
.opt .desc{margin-top:2px;font-size:18.5px;color:var(--text-2)}
.opt .go{margin-top:20px;display:inline-flex;align-items:center;gap:10px;font-size:17px;font-weight:600;color:var(--primary-text)}
.opt .go svg{width:16px;height:16px;transition:transform .15s}
.opt:hover .go svg{transform:translateX(3px)}
.opt .spin{display:none;width:16px;height:16px;border:2px solid rgba(0,122,32,.25);border-top-color:var(--primary);border-radius:50%;animation:spin .7s linear infinite}
.opt.loading{border-color:var(--primary);box-shadow:0 0 0 3px rgba(0,168,45,.14);cursor:progress}
.opt.loading .go svg{display:none}.opt.loading .spin{display:block}
.dept-grid.busy .opt:not(.loading){opacity:.5;pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.opt,.opt .go svg{transition:none}.opt:hover .go svg{transform:none}.opt .spin{animation-duration:2s}}


/* Form view (Detail) */
.fv-content{padding:20px 32px}
.fv{display:flex;flex-direction:column;gap:16px;height:100%}
.fv-bar{display:flex;align-items:center;gap:8px}
.fv-bar .acts-l{display:flex;gap:6px;align-items:center}
.fv-dirty{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:var(--w-text);background:var(--w-soft);border:1px solid rgba(154,90,0,.22);border-radius:999px;padding:2px 10px;margin-left:4px}
.fv-dirty::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--w-solid)}
.fv-bar .sp{flex:1}
.stages{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:#fff}
.stages button{position:relative;font:inherit;font-size:15px;font-weight:600;color:var(--text-3);background:#fff;border:0;height:32px;padding:0 22px 0 24px;cursor:pointer}
.stages button:first-child{padding-left:14px}
.stages button:last-child{padding-right:14px}
.stages button:not(:last-child)::after{content:"";position:absolute;right:-9px;top:4px;width:22px;height:22px;background:inherit;border-top:1px solid var(--border);border-right:1px solid var(--border);transform:rotate(45deg);z-index:1;border-radius:0 3px 0 0}
.stages button[aria-current="step"]{background:var(--s-soft);color:var(--s-text)}
.stages button.done{color:var(--text-2)}
.rec-pager{display:flex;align-items:center;gap:6px;font-size:15px;color:var(--text-2);margin-left:12px}
.rec-pager .btn{width:32px;padding:0}
.fv-body{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px;min-height:0;flex:1}
.sheet{background:#fff;border:1px solid var(--border);border-radius:16px;padding:24px 28px;overflow:hidden;display:flex;flex-direction:column}
.sheet-type{font-size:14px;font-weight:600;color:var(--text-3)}
.sheet-title{display:flex;align-items:center;gap:12px;margin:2px 0 18px}
.sheet-title h1{font-size:32.5px;line-height:1.2}
.ff{display:grid;grid-template-columns:1fr 1fr;gap:4px 40px;margin-bottom:20px}
.ff-r{display:grid;grid-template-columns:120px 1fr;align-items:center;gap:12px;min-height:34px}
.ff-r>span:first-child{font-size:15px;font-weight:600;color:var(--text-2)}
.ff-v{font:inherit;font-size:16px;color:var(--text-1);border:0;border-bottom:1px solid transparent;background:none;height:30px;padding:0 2px;width:100%;min-width:0}
.ff-v:hover{border-bottom-color:#CBD5E1}
.ff-v:focus{outline:none;border-bottom-color:var(--primary)}
.ff-v.req{background:linear-gradient(transparent 0 0)}
.ff-v.edited{border-bottom:2px solid var(--primary);background:var(--s-soft)}
.sheet .tabs{gap:4px;margin-bottom:0}
.sheet .tabs button{padding:9px 14px;font-size:16px;border-radius:8px 8px 0 0}
.sheet .tabs button:hover{background:var(--ghost-bg);color:var(--text-1)}
.sheet .tabs button[aria-selected="true"]{color:var(--primary-text);box-shadow:inset 0 -2px 0 var(--primary);background:none}
.sheet table th{background:none;padding:10px 10px}
.sheet table td{padding:6px 10px;height:42px}
.sheet table th:first-child,.sheet table td:first-child{padding-left:0}
.sheet table th:last-child,.sheet table td:last-child{padding-right:0}
.addline{display:inline-block;margin:10px 0 0;font-size:15px;font-weight:600;color:var(--primary-text);text-decoration:none}
.addline:hover{text-decoration:underline}
tr.newrow td{background:var(--i-soft)}
tr.newrow input{font:inherit;font-size:15px;border:0;border-bottom:2px solid var(--primary);background:#fff;height:28px;width:100%;padding:0 4px}
.totals{margin:14px 0 0 auto;width:300px;display:grid;grid-template-columns:1fr auto;gap:6px 0;font-size:15px;color:var(--text-2);text-align:right}
.totals b{color:var(--text-1);padding-left:16px}
.totals{align-items:center}
.totals .grand,.totals .grand+b{border-top:1px solid var(--border);padding-top:8px;margin-top:4px}
.totals .grand{font-weight:600;color:var(--text-1)}
.totals .grand+b{font-family:Roboto,system-ui,Arial,sans-serif;font-weight:700;font-size:24px}
.chatter{background:#fff;border:1px solid var(--border);border-radius:16px;display:flex;flex-direction:column;overflow:hidden}
.ch-hd{display:flex;align-items:center;gap:4px;padding:12px 12px 12px 16px;border-bottom:1px solid var(--border)}
.ch-hd .sp{flex:1}
.ch-hd .ib{width:30px;height:30px}
.ch-hd .follow{font:inherit;font-size:15px;font-weight:600;color:var(--primary-text);background:none;border:0;padding:0 6px;cursor:pointer;white-space:nowrap}
.ch-hd .btn{padding:0 10px}
.ch-body{padding:8px 16px 16px;overflow:auto}
.ch-sep{display:flex;align-items:center;gap:10px;font-size:12.5px;font-weight:600;color:var(--text-3);margin:10px 0}
.ch-sep::before,.ch-sep::after{content:"";flex:1;height:1px;background:var(--border)}
.msg{display:grid;grid-template-columns:32px 1fr;gap:10px;padding:10px 0}
.msg .avatar{width:32px;height:32px}
.msg .who b{font-size:15px}.msg .who span{font-size:12.5px;color:var(--text-3);margin-left:6px}
.msg p{margin:2px 0 0;font-size:15px;color:var(--text-2)}
.msg ul{margin:6px 0 0;padding-left:16px;font-size:14px;color:var(--text-2);display:flex;flex-direction:column;gap:3px}
.msg ul i{font-style:normal;color:var(--text-3)}
.msg ul .to{color:var(--primary-text);font-weight:600}
.msg.note p{background:var(--w-soft);border-radius:8px;padding:8px 10px;color:var(--text-1)}

.fv-crumb{display:flex;align-items:center;gap:8px;font-size:20.5px}
.fv-crumb a{color:var(--primary-text);text-decoration:none}.fv-crumb a:hover{text-decoration:underline}
.fv-crumb span{color:var(--text-3)}.fv-crumb b{font-weight:600}
.fv-crumb .sp{flex:1}
.fv-strip{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--border);border-radius:12px;padding:8px 8px 8px 12px}
.fv-strip .acts-l{display:flex;gap:6px;align-items:center}
.fv-strip .sp{flex:1}
.fv-strip .stages{border:0;border-radius:8px;background:var(--app-bg)}
.fv-strip .stages button{background:var(--app-bg)}
.fv-strip .stages button[aria-current="step"]{background:var(--s-soft)}
.sheet-o{padding:28px 32px;flex:1}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 48px;margin:4px 0 24px}
.fgrid>div:first-child{border-right:1px solid var(--border);padding-right:48px}
.fr{display:grid;grid-template-columns:160px 1fr;gap:16px;align-items:center;min-height:40px}
.fr-k{font-size:16px;font-weight:600;color:var(--text-1)}
.fr-v{display:flex;align-items:center;gap:8px;font-size:16px;color:var(--text-1);min-width:0}
.fr-v a{color:var(--primary-text);text-decoration:none}.fr-v a:hover{text-decoration:underline}
.fr-v .ext{width:15px;height:15px;color:var(--text-3)}
.otabs{display:flex;border-bottom:1px solid var(--border)}
.otabs button{font:inherit;font-size:16px;font-weight:600;color:var(--primary-text);background:none;border:1px solid transparent;border-bottom:0;border-radius:8px 8px 0 0;padding:10px 18px;margin-bottom:-1px;cursor:pointer}
.otabs button:hover{background:var(--app-bg)}
.otabs button[aria-selected="true"]{color:var(--text-1);background:#fff;border-color:var(--border)}
.opanes{padding-top:16px}
.otable{border:1px solid var(--border);border-radius:10px;border-collapse:separate;border-spacing:0;overflow:hidden}
.otable th{background:var(--ghost-bg);font-size:14px;color:var(--text-2)}
.sheet .otable th:first-child,.sheet .otable td:first-child{padding-left:16px}
.sheet .otable th:last-child,.sheet .otable td:last-child{padding-right:16px}
.otable td{height:44px}
.otable tr:last-child td{border-bottom:0}
.otable .lnk{color:var(--primary-text);text-decoration:none;font-weight:500}

/* Dashboard */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:16px}
.kpi{padding:16px}
.kpi small{font-size:12.5px;font-weight:600;color:var(--text-3);display:block}
.kpi b{font-family:Roboto,system-ui,Arial,sans-serif;font-weight:700;font-size:32.5px;display:block;line-height:1.2;margin:4px 0}
.up{color:var(--s-text);font-size:14px;font-weight:600}.down{color:var(--d-text);font-size:14px;font-weight:600}
.dash{display:grid;grid-template-columns:2fr 1fr;gap:16px}
.li{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--border)}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0}
.legend{display:flex;gap:16px}

.greet{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.ofilter{display:flex;align-items:center;gap:8px;margin-bottom:24px;position:relative;z-index:12}
.osearch{position:relative;flex:0 0 600px;min-width:0;display:flex;align-items:center;gap:8px;height:38px;padding:0 0 0 12px;background:#fff;border:1px solid var(--border);border-radius:8px}
.osearch:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,163,224,.2)}
.osearch>input{flex:1;min-width:80px;border:0;outline:none;font:inherit;font-size:15px;background:none;height:100%}
.ochips{display:flex;gap:6px;flex-wrap:nowrap;overflow:hidden;min-width:0;flex:0 1 auto}
.ochip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 4px 0 8px;border-radius:6px;background:var(--s-soft);color:var(--s-text);font-size:14px;font-weight:600;white-space:nowrap}
.ochip button{border:0;background:none;color:inherit;cursor:pointer;font-size:16px;line-height:1;padding:0 2px;border-radius:4px}
.ochip button:hover{background:rgba(0,122,32,.12)}
.otoggle{height:100%;width:34px;border:0;border-left:1px solid var(--border);background:var(--ghost-bg);border-radius:0 7px 7px 0;color:var(--text-2);cursor:pointer;display:grid;place-items:center}
.otoggle:hover{background:var(--ghost-hover)}
.otoggle[aria-expanded="true"] svg{transform:rotate(180deg)}
.opanel{position:absolute;left:-1px;top:calc(100% + 6px);width:480px;background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:0 16px 40px -8px rgba(15,23,42,.25);padding:16px 20px 16px}
.opanel[hidden]{display:none}
.oclose{position:absolute;right:10px;top:8px;width:28px;height:28px;border:0;background:none;border-radius:6px;font-size:21.5px;line-height:1;color:var(--text-3);cursor:pointer}
.oclose:hover{background:var(--ghost-bg);color:var(--text-1)}
.of-grid{display:grid;grid-template-columns:120px 110px 1fr;column-gap:12px;row-gap:4px;align-items:center;padding-right:16px}
.of-k{font-size:15px;color:var(--text-1);font-weight:500}
.of-op{height:32px;border:0;border-bottom:1px solid transparent;background:none;font:inherit;font-size:15px;color:var(--text-2);cursor:pointer;padding:0 2px}
.of-op:hover{border-bottom-color:var(--border)}
.of-op:focus{outline:none;border-bottom-color:var(--accent)}
.of-v{height:32px;border:0;border-bottom:1px solid #CBD5E1;background:none;font:inherit;font-size:15px;color:var(--text-1);padding:0 2px;min-width:0}
.of-v:focus{outline:none;border-bottom-color:var(--accent)}
.of-fixed{display:flex;align-items:center;font-weight:600}
.of-ft{display:flex;gap:8px;margin-top:16px;padding-top:14px;border-top:1px solid var(--border)}
.operiod{height:38px;font-weight:600;background:#fff}
.onav{display:flex;gap:4px}.onav .btn{height:38px;width:34px;padding:0;font-size:18.5px}
.dfilter{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:12px;margin-bottom:24px}
.dfilter .vsep{width:1px;height:24px;background:var(--border);margin:0 4px}
.fsel{font:inherit;font-size:15px;cursor:pointer;color:var(--text-1)}
.fsel:hover{border-color:#CBD5E1;background:var(--app-bg)}
.fsel .k{color:var(--text-3)}
.fsel svg{color:var(--text-3)}
.fsel.on{border-color:rgba(0,122,32,.35);background:var(--s-soft)}
.fsel.on span:not(.k){color:var(--s-text);font-weight:600}
.dd{position:relative}
.dd-pop{position:absolute;left:0;top:calc(100% + 6px);z-index:15;min-width:100%;width:200px;background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:0 12px 32px -8px rgba(15,23,42,.2);padding:4px}
.dd-pop[hidden]{display:none}
.dd-it{display:flex;align-items:center;gap:8px;width:100%;padding:8px 10px;border:0;background:none;border-radius:6px;font:inherit;font-size:15px;color:var(--text-1);cursor:pointer;text-align:left}
.dd-it:hover,.dd-it:focus-visible{background:var(--ghost-bg);outline:none}
.dd-it .ck{visibility:hidden;color:var(--primary)}
.dd-it[aria-selected="true"]{font-weight:600;color:var(--s-text)}
.dd-it[aria-selected="true"] .ck{visibility:visible}
.fsel[aria-expanded="true"]{border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,163,224,.2)}
.dfilter-act{margin-left:auto;display:flex;gap:8px}
.dfilter .reset{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 10px;border:0;background:none;border-radius:8px;font:inherit;font-size:15px;font-weight:600;color:var(--primary-text);cursor:pointer;white-space:nowrap}
.dfilter .reset:hover{background:var(--s-soft)}

.greet h1{font-size:32.5px;line-height:1.2}
.sec-hd{display:flex;align-items:center;justify-content:space-between;margin:0 0 12px}
.sec-hd h2{font-size:20.5px}
.hot{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:8px;margin-bottom:24px;scrollbar-width:thin}
.hot-card{flex:0 0 246px;padding:16px 16px 8px;scroll-snap-align:start}
.hot-card small{font-size:12.5px;font-weight:600;color:var(--text-3);display:block}
.hot-card b{font-family:Roboto,system-ui,Arial,sans-serif;font-weight:700;font-size:28px;display:block;line-height:1.2;margin:4px 0}
.hot-card svg{display:block;margin-top:8px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.pg{margin-bottom:14px}.pg:last-child{margin-bottom:0}
.bar{height:8px;background:var(--ghost-bg);border-radius:999px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:999px}
.bar.thin{height:6px;margin-top:4px}
.cp{display:grid;grid-template-columns:110px 1fr 56px;gap:12px;align-items:center;margin-bottom:12px}
.cp:last-child{margin-bottom:0}
.cp-v{text-align:right}
.alerts{padding:4px 16px}
.al{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--border)}
.al:last-child{border-bottom:0}
.al .grow{flex:1;min-width:0}
.al-ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none}
.acts{display:inline-flex;gap:4px}
.ib{width:32px;height:32px;border-radius:8px;border:0;background:transparent;color:var(--text-2);display:grid;place-items:center;cursor:pointer}
.ib svg{width:18px;height:18px}
.ib:hover{background:var(--ghost-bg);color:var(--text-1)}
.ib.del{color:var(--d-text)}.ib.del:hover{background:var(--d-soft)}
table.tight th:first-child,table.tight td:first-child,
table.tight th:nth-last-child(-n+2),table.tight td:nth-last-child(-n+2){width:1%}
table.tight th:nth-last-child(2),table.tight td:nth-last-child(2){padding-right:24px}
.kv-form{display:grid;grid-template-columns:repeat(2,1fr);gap:14px 24px}
.kv-form .field label{font-size:14px;margin-bottom:4px}
.card-ft{display:flex;justify-content:flex-end;gap:8px;padding:12px 16px;border-top:1px solid var(--border)}
/* List */
.filters{display:flex;gap:8px;align-items:center;padding:16px}
.select{height:36px;border:1px solid var(--border);border-radius:8px;padding:0 12px;display:inline-flex;align-items:center;gap:8px;font-size:15px;color:var(--text-2);background:#fff}
.bulk{display:flex;align-items:center;gap:8px;padding:10px 16px;background:#fff;border-top:1px solid var(--border);border-bottom:1px solid var(--border);font-size:15px}
.toolbar{display:flex;align-items:center;gap:8px;padding:16px;margin-bottom:16px}
.pager{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;font-size:15px;color:var(--text-2)}
.pages{display:flex;gap:4px}
.pages span{min-width:32px;height:32px;border-radius:8px;display:grid;place-items:center}
.pages .on{background:var(--ghost-bg);color:var(--text-1);font-weight:600}

/* Detail */
.detail{display:grid;grid-template-columns:1fr 380px;gap:16px;align-items:start}
.dtabs{margin:-4px 0 16px;gap:4px}
.dtabs button{padding:10px 16px;font-size:17px;border-radius:8px 8px 0 0}
.dtabs button:hover{color:var(--text-1);background:var(--ghost-bg)}
.dtabs button[aria-selected="true"]{color:var(--primary-text);box-shadow:inset 0 -2px 0 var(--primary);background:none}
.dcol{display:flex;flex-direction:column;gap:16px;min-width:0}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.duo .files{grid-template-columns:repeat(4,1fr);gap:8px}
.tabpane[hidden]{display:none}

.kv{display:grid;grid-template-columns:repeat(2,1fr);gap:20px 24px}
.kv small{display:block;font-size:12.5px;font-weight:600;color:var(--text-3)}
.kv span{font-size:16px}
.files{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.files .hatch{aspect-ratio:4/3}
.tl{position:relative;padding-left:20px}
.tl::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:var(--border)}
.tl-item{position:relative;padding-bottom:16px}
.tl-item::before{content:"";position:absolute;left:-19px;top:5px;width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid var(--c,var(--n-solid))}
.actbar{position:absolute;left:248px;right:0;bottom:0;background:#fff;border-top:1px solid var(--border);display:flex;align-items:center;gap:8px;padding:12px 32px}
.actbar .why{margin-right:auto;font-size:15px;color:var(--w-text);display:flex;align-items:center;gap:6px}


/* Detail (form view) */
.dv{height:auto;gap:12px}
.dv .sheet{padding:20px 28px 16px}
.dv .dsec{padding-bottom:16px;margin-bottom:16px;border-bottom:1px solid var(--border)}
.dv .dsec h3{font-size:18.5px;margin:0 0 6px}
.dv .dsec-g{display:grid;grid-template-columns:1fr 1fr;gap:0 40px}
.dv .detail{gap:16px}
.dv .fr{min-height:38px;grid-template-columns:140px 1fr}
.dv .fr-k{font-weight:500;color:var(--text-2)}
.dv .fr-k i{color:var(--d-text);font-style:normal}
.dv .ff-v{border-bottom-color:#CBD5E1}
.dv .opanes .tabpane[hidden]{display:none}
.dv .tl{padding-top:4px}


/* Notifications */
.nt-menu{position:relative;z-index:21}
.nt-btn{position:relative;width:40px;height:40px;border:0;border-radius:10px;background:none;color:var(--text-2);display:grid;place-items:center;cursor:pointer}
.nt-btn:hover{background:var(--ghost-bg);color:var(--text-1)}
.nt-btn[aria-expanded="true"]{background:var(--ghost-bg);color:var(--text-1)}
.nt-btn svg{width:20px;height:20px}
.nt-count{position:absolute;top:3px;right:2px;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--destructive);color:#fff;font-size:12.5px;font-weight:700;line-height:18px;text-align:center;box-shadow:0 0 0 2px #fff}
.nt-count[hidden]{display:none}
.nt-pop{position:absolute;right:-8px;top:calc(100% + 10px);width:400px;background:#fff;border:1px solid var(--border);border-radius:14px;box-shadow:0 16px 40px -8px rgba(15,23,42,.22);color:var(--text-1);display:flex;flex-direction:column;overflow:hidden}
.nt-pop[hidden]{display:none}
.nt-hd{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 0}
.nt-hd h3{font-size:18.5px}
.nt-link{font:inherit;font-size:15px;font-weight:600;color:var(--primary-text);background:none;border:0;padding:4px 6px;border-radius:6px;cursor:pointer}
.nt-link:hover{background:var(--s-soft)}
.nt-link[disabled]{color:var(--disabled-text);background:none;cursor:default}
.nt-tabs{display:flex;gap:4px;padding:10px 16px 0;border-bottom:1px solid var(--border)}
.nt-tabs button{font:inherit;font-size:15px;font-weight:600;color:var(--text-3);background:none;border:0;padding:8px 10px;margin-bottom:-1px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.nt-tabs button[aria-selected="true"]{color:var(--text-1);box-shadow:inset 0 -2px 0 var(--primary)}
.nt-tabs .n{font-size:12.5px;background:var(--ghost-bg);color:var(--text-2);border-radius:999px;padding:0 7px}
.nt-list{max-height:420px;overflow:auto;padding:4px 0}
.nt-grp{font-size:14px;font-weight:600;color:var(--text-3);padding:10px 16px 4px}
.nt-it{display:grid;grid-template-columns:36px 1fr 8px;gap:12px;align-items:start;width:100%;padding:10px 16px;border:0;background:none;font:inherit;text-align:left;cursor:pointer;color:inherit}
.nt-it:hover,.nt-it:focus-visible{background:var(--app-bg);outline:none}
.nt-it.unread{background:var(--i-soft)}
.nt-it.unread:hover{background:#D9F0F9}
.nt-it .al-ic{width:36px;height:36px}
.nt-it b{display:block;font-size:15px;font-weight:600}
.nt-it:not(.unread) b{font-weight:500;color:var(--text-2)}
.nt-it p{margin:2px 0 4px;font-size:14px;color:var(--text-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.nt-it time{font-size:12.5px;color:var(--text-3)}
.nt-it .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);margin-top:6px}
.nt-it:not(.unread) .dot{visibility:hidden}
.nt-empty{padding:40px 16px;text-align:center;font-size:15px;color:var(--text-3)}
.nt-ft{border-top:1px solid var(--border);padding:8px;text-align:center}
.nt-ft a{display:block;font-size:15px;font-weight:600;color:var(--primary-text);text-decoration:none;padding:8px;border-radius:8px}
.nt-ft a:hover{background:var(--s-soft)}


/* Brand logo */

.logo-mark,.side-foot .mark,.app-foot .mark,.mark{background:#fff var(--logo) center/88% no-repeat!important;color:transparent!important}
.logo-mark{box-shadow:0 0 0 1px var(--border)}

.note{font-family:Roboto,system-ui,Arial,sans-serif;font-size:14px;color:var(--frame-label);margin-top:8px;max-width:90ch}

/* ===== Lớp bổ sung cho prototype (dùng token của Design Sample) ===== */
html,body{height:100%}
body{background:var(--app-bg);overflow:hidden}
#app{height:100%}
.shell{height:100%;grid-template-columns:276px minmax(0,1fr)}
.main{background:var(--app-bg)}
.content{overflow:auto;padding:24px 32px 48px}
.side nav{margin-bottom:12px}
.side .ni{font-family:inherit}
.scrim{display:none}
.menu-btn{display:none;flex:none}
.crumb-t{color:var(--text-2)}
.bc{min-width:0;flex-wrap:wrap;row-gap:2px}
.top .right{flex:none}
.row.wrap{flex-wrap:wrap}
.muted{color:var(--text-3)}
.b6{font-weight:600}
.err-t{color:var(--d-text)}
.small{font-size:14px}

/* trang */
.page-hd{flex-wrap:wrap;align-items:flex-end}
.page-hd h1{overflow-wrap:anywhere}
.acts-r{flex-wrap:wrap;justify-content:flex-end}
.pg-l{min-width:0}
.back{cursor:pointer}
.greet{flex-wrap:wrap}
.note-t{color:var(--text-3);font-size:14px;margin:12px 4px 0;max-width:110ch}
.kpis.k3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpis.k4{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpis.k5{grid-template-columns:repeat(5,minmax(0,1fr))}
.kpis.k6{grid-template-columns:repeat(6,minmax(0,1fr))}
.kpi{min-width:0}
.kpi small{overflow-wrap:anywhere}
.kpi.click{text-align:left;font:inherit;cursor:pointer;display:block;width:100%;color:inherit}
.kpi.click:hover{border-color:var(--accent)}
.kpi.click small{font-size:12.5px}
.cmp3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-bottom:8px}
.cp{grid-template-columns:120px 1fr 44px}
.card.clip{overflow:hidden}
.tw{overflow-x:auto}
.tfoot{padding:12px 16px;border-top:1px solid var(--border)}
.infobar{display:flex;align-items:center;gap:12px;padding:12px 16px;margin-bottom:16px;flex-wrap:wrap}
.dfilter .search{width:300px;max-width:100%}
.dfilter{margin-bottom:16px}
.dfilter-act{margin-left:auto}
.dfilter .search .inp{padding-left:36px}
.fv-strip{margin-bottom:16px;flex-wrap:wrap;min-height:48px}
.fv-strip .acts-l{flex-wrap:wrap}
.fv-strip .sp{flex:1}

/* bảng */
tr.rowlink{cursor:pointer}
tr.rowlink:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
td.act,th.act{width:1%;text-align:right}
td.empty{text-align:center;color:var(--text-3);padding:28px 16px;white-space:normal}
td.num,th.num{text-align:right}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:normal;max-width:360px;min-width:180px}
.pages .pg{min-width:32px;height:32px;border:0;background:none;border-radius:8px;font:inherit;color:inherit;cursor:pointer}
.pages .pg.on{background:var(--ghost-bg);color:var(--text-1);font-weight:600}
.cbb{border:0;background:none;padding:0;cursor:pointer;display:inline-grid}
.cbb[disabled]{opacity:.45;cursor:not-allowed}
.cell-a{display:inline-block;background:var(--n-soft);border-radius:6px;padding:2px 10px}
.cell-c{display:inline-block;background:var(--s-soft);border-radius:6px;padding:2px 10px}
tr.sumrow td{background:var(--app-bg);font-weight:600}
.tree{display:inline-flex;align-items:center}
.tree .tg{border:0;background:none;width:20px;cursor:pointer;color:var(--text-3);font-size:15px;padding:0}
.tg-sp{display:inline-block;width:20px}

/* tab */
.pills{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.pills button{font:inherit;font-weight:500;font-size:16px;border:1px solid var(--border);background:#fff;color:var(--text-2);padding:7px 16px;border-radius:10px;cursor:pointer}
.pills button[aria-selected="true"]{background:var(--s-soft);border-color:rgba(0,122,32,.35);color:var(--brand-deepest);font-weight:600}
.tabs{overflow-x:auto}
.tabs button{white-space:nowrap}

/* form chi tiết */
.detail{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px;align-items:start}
.sheet{padding:22px 28px 20px;min-width:0}
.sheet .tabs{margin-bottom:16px}
.dsec{padding-bottom:16px;margin-bottom:16px;border-bottom:1px solid var(--border)}
.dsec:last-child{border-bottom:0;margin-bottom:0;padding-bottom:0}
.dsec h3{font-size:18.5px;margin:0 0 8px}
.dsec-g{display:grid;grid-template-columns:1fr 1fr;gap:0 40px}
.fr{grid-template-columns:150px minmax(0,1fr);min-height:38px}
.fr.full{grid-column:1/-1}
.fr-k{font-size:15px;font-weight:500;color:var(--text-2)}
.fr-k i{color:var(--d-text);font-style:normal}
.fr-v{min-width:0}
.fr-v.col{display:flex;flex-direction:column;align-items:stretch;gap:2px}
.fr-v>.ff-v,.fr-v.col>.ff-v{width:100%}
.ff-v{border-bottom:1px solid #CBD5E1;border-radius:0;font:inherit;font-size:16px;color:var(--text-1);background:none;height:32px;padding:0 2px;width:100%;min-width:0}
.ff-v:focus{outline:none;border-bottom-color:var(--primary);background:var(--s-soft)}
textarea.ff-v{height:auto;padding:5px 2px;resize:vertical;line-height:1.45}
.ff-v[readonly]:not(.auto):not(.calc):not(.sug),.ff-v[disabled]:not(.auto):not(.calc):not(.sug){border-bottom-color:transparent;resize:none}
select.ff-v:disabled,select.inp.ro{appearance:none;-webkit-appearance:none;opacity:1;color:var(--text-1);background:none}
select.ff-v:disabled{padding-left:2px}
span.ff-v.ro{display:block;height:auto;min-height:30px;padding:5px 2px;border-bottom-color:transparent;overflow-wrap:anywhere}
.ff-v.auto{background:var(--n-soft);border:1px dashed #CBD5E1;border-radius:6px;padding:0 8px}
.ff-v.calc{background:var(--s-soft);border:1px dashed rgba(0,122,32,.4);border-radius:6px;padding:0 8px}
.ff-v.sug{background:var(--w-soft);border:1px dashed rgba(154,90,0,.4);border-radius:6px;padding:0 8px}
span.ff-v.auto,span.ff-v.calc,span.ff-v.sug{padding:5px 8px}
.ff-v.err,.inp.err{border-color:var(--destructive)!important;box-shadow:0 0 0 2px rgba(231,76,60,.18)}
.ff-v.err{border:1px solid var(--destructive);border-radius:6px;padding:0 6px}
.ff-v.req{border-bottom:2px solid var(--w-solid)}
.ff-v.num{text-align:right;width:90px}
.ff-v.sm{font-size:15px}
.hint{font-size:14px;color:var(--text-3);margin-top:3px}
.col-r{display:flex;flex-direction:column;gap:16px;min-width:0}
.hist{min-width:0}
.hist .card-bd{padding-top:10px}
.tl-item{padding-bottom:14px}
.tl-item b{font-size:15px}
.note-box{background:var(--i-soft);border:1px solid rgba(0,113,156,.25);color:var(--i-text);border-radius:12px;padding:12px 14px;font-size:15px}
.otw{overflow-x:auto;border:1px solid var(--border);border-radius:10px}
.otw table th{background:var(--ghost-bg);font-size:14px;color:var(--text-2)}
.otw table td{height:44px}
.otw table tr:last-child td{border-bottom:0}
.otw .tw{border:0}
.addline{cursor:pointer}
.pv-box{height:200px;font-size:15px}
.duo2{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:16px;margin-bottom:16px}
table.hs th,table.hs td{text-align:center}
table.hs th:first-child,table.hs td:first-child{text-align:left}
table.pv{border-collapse:collapse}
table.pv th,table.pv td{border:1px solid var(--border);padding:6px 8px;font-size:14px;text-align:center;white-space:normal;height:auto;background:#fff}
table.pv th{background:var(--ghost-bg);color:var(--text-2)}
table.pv td.bad{outline:2px solid var(--destructive);outline-offset:-2px;background:var(--d-soft);font-weight:700}
table.pv .calc-c{background:var(--s-soft)}
table.pv tr.sum td{font-weight:600;background:var(--app-bg)}
.chk-res{list-style:none;padding:0;margin:0}
.chk-res li{padding:8px 0;border-bottom:1px solid var(--border);font-size:15px}
.chk-res li:last-child{border-bottom:0}
.chk-res .err{color:var(--d-text)}
.chk-res .warn{color:var(--w-text)}
.chk-res a{color:var(--primary-text);font-weight:600}
.sug-c{background:var(--w-soft);padding:2px 8px;border-radius:6px}
table.fill .sc{width:90px;text-align:right}
table.fill td{height:52px}

/* kho */
.kho{display:grid;grid-template-columns:260px minmax(0,1fr);gap:16px;align-items:start}
.kho-main{min-width:0}
.kho-tree .card-bd{padding:8px 12px 14px;display:flex;flex-direction:column;gap:2px}
.fo{display:flex;gap:8px;align-items:center;width:100%;border:0;background:none;padding:8px 10px;border-radius:8px;font:inherit;font-size:15px;text-align:left;cursor:pointer;color:var(--text-1)}
.fo:hover{background:var(--ghost-bg)}
.fo.on{background:var(--s-soft);color:var(--brand-deepest)}
.fo.fo2{padding-left:34px;font-weight:400}
.fo b{font-weight:600}

/* tài liệu biểu */
.doc-card{padding:8px 16px}
.doc{padding:16px 8px;font-size:15px}
.doc-hd{display:flex;justify-content:space-between;gap:24px;font-size:14px;flex-wrap:wrap}
.doc-hd .r{text-align:center}
.doc-t{text-align:center;display:flex;flex-direction:column;gap:4px;margin:16px 0}
.doc-ft{text-align:right;display:flex;flex-direction:column;gap:2px;margin-top:16px}
.file-btn{cursor:pointer}
.file-btn.dis{opacity:.5;cursor:not-allowed}

/* banner / nút */
.banner{margin-bottom:12px}
.banner.b-err{background:var(--d-soft);border-color:rgba(192,57,43,.25);color:var(--d-text)}
.banner.b-warn{background:var(--w-soft);border-color:rgba(154,90,0,.25);color:var(--w-text)}
.btn svg.ico{flex:none}
.btn.ol{background:rgba(255,255,255,.12);color:#fff}
.inp.area{height:auto;padding:10px 12px;resize:vertical;line-height:1.45}
select.inp{padding-right:28px}

/* đăng nhập */
.login{overflow:auto}
.login-form{min-width:0}
.demo-box{border-top:1px dashed var(--border);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.chip{border:1px solid var(--border);background:#fff;border-radius:999px;font:inherit;font-size:14px;padding:3px 10px;cursor:pointer;color:var(--text-2)}
.chip:hover{border-color:var(--primary);color:var(--primary-text)}
.opt.dis{background:rgba(255,255,255,.55);cursor:not-allowed;box-shadow:none;border-color:rgba(255,255,255,.4)}
.opt.dis:hover{background:rgba(255,255,255,.55);border-color:rgba(255,255,255,.4);box-shadow:none}
.opt.dis b{opacity:.85}
.dept .who{display:flex;gap:12px;align-items:center}
.dept-top .user .u-tx{text-align:left}

/* modal + toast */
.m-bg{position:fixed;inset:0;background:rgba(15,23,42,.45);display:grid;place-items:center;padding:16px;z-index:100}
.m{background:#fff;border-radius:16px;box-shadow:0 24px 60px -12px rgba(15,23,42,.4);width:min(560px,100%);max-height:100%;display:flex;flex-direction:column;overflow:hidden}
.m.wide{width:min(900px,100%)}
.m-hd{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 20px 8px}
.m-hd h3{font-size:21.5px}
.m-bd{padding:8px 20px 16px;overflow:auto;min-width:0}
.m-ft{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--border);flex-wrap:wrap}
.m-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px;margin-bottom:8px}
.m-grid.ro .inp{background:var(--app-bg)}
.field.full{grid-column:1/-1}
.field label i{color:var(--d-text);font-style:normal}
.m-p{margin:0 0 12px;color:var(--text-2);line-height:1.55}
.m-h4{font-family:var(--font-heading);font-size:17px;margin:14px 0 8px}
.m-ul{margin:6px 0 0;padding-left:18px}
.chk-list{display:flex;flex-direction:column;gap:6px;border:1px solid var(--border);border-radius:8px;padding:10px 12px;max-height:180px;overflow:auto}
.chk-list.inl{border:0;padding:4px 0;max-height:none}
.chk{display:flex;gap:8px;align-items:center;font-size:15px}
.grp-row{display:grid;grid-template-columns:230px minmax(0,1fr);gap:12px;align-items:center;margin-bottom:8px}
.hs-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 14px}
.exf{border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:10px}
.exf .between{gap:12px;flex-wrap:wrap}
#toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:200;max-width:min(440px,calc(100vw - 32px))}
.toast{background:#0F172A;color:#fff;padding:11px 14px;border-radius:10px;font-size:15px;line-height:1.45;box-shadow:var(--shadow);border-left:4px solid var(--primary);animation:tin .2s ease-out}
.toast.t-e{border-left-color:var(--destructive)}
.toast.t-w{border-left-color:var(--w-solid)}
.toast.t-i{border-left-color:var(--accent)}
.toast.out{opacity:0;transform:translateY(6px);transition:.25s}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.toast{animation:none}.toast.out{transition:none}}

/* responsive */
@media (max-width:1180px){
 .detail{grid-template-columns:minmax(0,1fr)}
 .kpis.k6,.kpis.k5{grid-template-columns:repeat(3,minmax(0,1fr))}
 .cmp3,.duo2,.kho{grid-template-columns:minmax(0,1fr)}
 .dept-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
 .login{grid-template-columns:1fr 420px;gap:40px;padding:48px 48px}
}
@media (max-width:900px){
 body{overflow:auto}
 .shell{grid-template-columns:minmax(0,1fr)}
 .side{position:fixed;left:0;top:0;bottom:0;width:272px;z-index:60;transform:translateX(-100%);transition:transform .2s}
 .shell.nav-open .side{transform:none}
 .shell.nav-open .scrim{display:block;position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:50}
 .menu-btn{display:grid}
 .top{padding:0 16px;gap:8px;height:64px}
 .user .u-tx,.user .u-chev{display:none}
 .content{padding:16px 16px 40px}
 .dept-top,.dept-body{padding-left:16px;padding-right:16px}
 .login{grid-template-columns:minmax(0,1fr);padding:24px 16px;gap:24px;height:auto;min-height:100%}
 .login-brand{gap:24px;height:auto}
 .login-brand h1{font-size:34.5px}
 .login-form{padding:24px}
}
@media (max-width:640px){
 .kpis.k3,.kpis.k4,.kpis.k5,.kpis.k6{grid-template-columns:repeat(2,minmax(0,1fr))}
 .dsec-g,.m-grid,.hs-grid,.grp-row{grid-template-columns:minmax(0,1fr)}
 .fr{grid-template-columns:minmax(0,1fr);gap:2px;padding:4px 0}
 .dept-grid{grid-template-columns:minmax(0,1fr)}

 .sheet{padding:16px}
 .page-hd{align-items:flex-start}
 .acts-r{justify-content:flex-start}
 .dfilter .search{width:100%}
 .dfilter-act{margin-left:0}
 .nt-pop{position:fixed;left:8px;right:8px;top:64px;width:auto}
 .m-bg{padding:8px}
}

.chk input{width:17px;height:17px;accent-color:var(--primary);flex:none}

.bar-btn{display:grid;grid-template-columns:120px 1fr 34px;gap:12px;align-items:center;width:100%;border:0;background:none;font:inherit;text-align:left;padding:5px 6px;border-radius:8px;cursor:pointer;color:inherit;margin-bottom:2px}

function tryRestore(){

  if(Date.now()-s.t>SESSION_MS){clearSession();return false}
  const u=USERS.find(x=>x.un===s.un);if(!u||u.status==='Đã khóa'||u.mustChange)return false;

const deptsForNode=name=>{const n=NODES.find(x=>x.ten===name);if(!n)return [];const prov=n.cap===2?n:n.cap===3?nodeById(n.cha):null;return prov&&prov.id==='AG'?DEPTS:[]};

function diffUser(old,d){
 const L=[];
 [['name','Họ tên'],['email','Email'],['phone','Số điện thoại']].forEach(([k,l])=>{if((old[k]||'')!==(d[k]||''))L.push(`${l}: ${old[k]||'—'} → ${d[k]||'—'}`)});
 const n=Math.max(old.rows.length,d.rows.length);
 for(let i=0;i<n;i++){const a=old.rows[i],b=d.rows[i];
  if(!a)L.push('Thêm vai trò: '+fmtRow(b)+` (${b.level})`);
  else if(!b)L.push('Xóa vai trò: '+fmtRow(a));
  else if(fmtRow(a)+a.level!==fmtRow(b)+b.level)L.push(`Vai trò ${i+1}: ${fmtRow(a)} (${a.level}) → ${fmtRow(b)} (${b.level})`)}
 return L;
}
/* mỗi xã chỉ có 1 Cán bộ xã phụ trách trong mỗi phòng ban */
function xaConflicts(d,un){
 const out=[];
 d.rows.forEach((r,ri)=>{if(r.role!=='Cấp Xã')return;
  r.xa.forEach(x=>r.depts.forEach(dp=>{
   USERS.forEach(u=>{if(u.un===un)return;u.rows.forEach(ur=>{if(ur.role==='Cấp Xã'&&(ur.xa||[]).includes(x)&&ur.depts.includes(dp)&&!out.some(o=>o.xa===x&&o.dept===dp&&o.holder===u))out.push({xa:x,dept:dp,holder:u,hrow:ur})})})}))});
 return out;
}

function validateUser(d,isNew,cur){
 const un=(d.un||'').trim().toLowerCase(),name=(d.name||'').trim(),phone=(d.phone||'').trim(),email=(d.email||'').trim();
 if(!name)return 'Nhập họ tên.';
 if(isNew&&!un)return 'Nhập tên đăng nhập.';
 if(!phone)return 'Nhập số điện thoại.';
 if(!d.rows.length)return 'Tài khoản cần ít nhất một vai trò.';
 if(!email&&!d.rows.every(x=>x.role==='Cấp Xã'))return 'Nhập email (chỉ cán bộ cấp xã chưa có email mới được để trống).';
 const others=USERS.filter(x=>!cur||x.un!==cur.un);
 if(isNew&&others.some(x=>x.un===un))return `Trùng tên đăng nhập ${un}. Từ chối lưu.`;
 if(email&&others.some(x=>x.email&&x.email.toLowerCase()===email.toLowerCase()))return 'Trùng email với tài khoản khác. Từ chối lưu.';
 if(others.some(x=>x.phone.replace(/\s/g,'')===phone.replace(/\s/g,'')))return 'Trùng số điện thoại với tài khoản khác. Từ chối lưu.';
 for(let i=0;i<d.rows.length;i++){const r=d.rows[i];if(r.role==='Admin')continue;
  if(!r.node)return `Vai trò ${i+1}: chọn Nút.`;
  if(needsDept(r.role)&&!r.depts.length)return `Vai trò ${i+1}: chọn ít nhất một phòng ban.`;
  const al=deptsForNode(r.node).map(x=>x.ma);if(r.depts.some(x=>!al.includes(x)))return `Vai trò ${i+1}: phòng ban không thuộc đơn vị của Nút “${r.node}”. Chặn lưu.`;
  if(d.rows.some((o,j)=>j<i&&o.role===r.role&&o.node===r.node&&JSON.stringify(o.depts)===JSON.stringify(r.depts)))return `Vai trò ${i+1} trùng với một dòng phân quyền đã có.`}
 return '';
}
function saveUser(d){
 const isNew=S.r.id==='new',cur=isNew?null:userByUn(S.r.id),err=validateUser(d,isNew,cur);
 if(err){toast(err,'e');return false}
 const cf=xaConflicts(d,isNew?(d.un||'').trim().toLowerCase():cur.un);
 if(cf.length){

 }

function nsCalc(){

 const grp=s=>{const n=(ngachOf(s.ng)||{}).nhom||'';return n.startsWith('CVCC')||n.startsWith('CVC')?'cvc':n.startsWith('CV')?'cv':n.startsWith('CS')?'cs':'cl'};
 const z=()=>({tong:0,nu:0,dang:0,dtts:0,cvc:0,cv:0,cs:0,cl:0,ts:0,ths:0,dh:0,cdk:0,a1:0,a2:0,a3:0,a4:0,miss:[]});
 const add=(r,s)=>{r.tong++;if(s.gt==='Nữ')r.nu++;if(s.tk.dang)r.dang++;if(s.tk.dt!=='Kinh')r.dtts++;r[grp(s)]++;const t=tdKey(s);if(t==='Tiến sĩ')r.ts++;else if(t==='Thạc sĩ')r.ths++;else if(t==='Đại học')r.dh++;else r.cdk++;const a=age(s,date);if(a==null)r.miss.push(s);else if(a<30)r.a1++;else if(a<=40)r.a2++;else if(a<=50)r.a3++;else r.a4++};
 const rows=[],tot=z();
 ['BGD','HCTH','TT','CNTS','KHTC','TTTT'].forEach(u=>{const L=vc.filter(s=>s.u===u);if(!L.length)return;const r=z();L.forEach(s=>add(r,s));rows.push({name:UNIT_SHORT[u],r})});
 vc.forEach(s=>add(tot,s));
 const sum=tot.a1+tot.a2+tot.a3+tot.a4,noCn=vc.filter(s=>tdKey(s)===s.td.trim()).length;
 return {date,rows,tot,tong:tot.tong,sum,miss:tot.miss,thieu:tot.miss[0]||null,err:tot.miss.length>0,noCn,ag:[tot.a1,tot.a2,tot.a3,tot.a4]};
}

/* ====================== FN-09 Danh sách nâng bậc (theo BRD v3.0 cập nhật) ======================
   - Người đến kỳ (thường xuyên, vượt khung): hệ thống tự tính từ ngạch, bậc và mốc xếp bậc.
   - Mốc xếp bậc KHÔNG lưu trong hồ sơ (FN-07 BR-06): lấy từ ngày hưởng của quyết định gần nhất trong sổ quyết định (FN-10),
     người chưa có quyết định dùng dữ liệu chuyển đổi ban đầu.
   - Nâng bậc trước hạn: Phòng HCTH lập danh sách từ thành tích đã ghi nhận; hệ thống quy đổi số tháng, kiểm tra chỉ tiêu. */
const NB_ASOF='2026-09-30';                 // ngày chốt số liệu
const addMonths=(iso,m)=>{const d=new Date(iso+'T00:00:00Z'),day=d.getUTCDate();d.setUTCMonth(d.getUTCMonth()+m);if(d.getUTCDate()!==day)d.setUTCDate(0);return d.toISOString().slice(0,10)};
const NB_STATE={};                           // khóa kỳ nâng bậc → {tt,sel,reason,note,snap}
const CHI_TIEU={nam:2026,tong:49,daDung:0};
const NB_PARAM={tnvkChuKy:12,tnvkKhoiDiem:5,tnvkTang:1,xepLoaiNam:3,thanhTichNam:5}; // tham số khai báo khi triển khai, chờ Phòng HCTH xác nhận
const MAU_NB={'Thường xuyên':['Mẫu số 1','NLTX'],'Trước hạn':['Mẫu số 2','NLTH'],'Vượt khung':['Mẫu số 4','TNVK']};
const LOAI_CODE={'Thường xuyên':'TX','Trước hạn':'TH','Vượt khung':'VK'};
/* bảng quy đổi thành tích → số tháng nâng trước hạn (khai báo khi triển khai, chờ Phòng HCTH xác nhận; mẫu có 9 và 12 tháng) */
const quyDoi=t=>/thủ tướng|toàn quốc|huân chương/i.test(t)?12:/bằng khen|chiến sĩ thi đua cấp tỉnh/i.test(t)&&/ubnd|tỉnh/i.test(t)?9:0;
const NB_MIG=XB;                             // dữ liệu chuyển đổi ban đầu (Mekong Green nạp một lần, không hiển thị trong hồ sơ)
/* mốc xếp bậc hiện tại */
function mocXep(s){
 let best=null;
 QD.forEach(q=>{if(q.st==='Đã hủy')return;q.ng.forEach(p=>{if(p.ten===s.ten&&p.ngay&&(!best||p.ngay>best.date))best={date:p.ngay,src:`Quyết định ${q.so} (ngày hưởng ${fmtD(p.ngay)})`}})});
 if(!best&&NB_MIG[s.id])best={date:NB_MIG[s.id],src:'Dữ liệu chuyển đổi ban đầu'};
 if(s.moc&&(!best||s.moc>best.date))best={date:s.moc,src:'Nhập trong hồ sơ (thẻ Ngạch - Bậc)'};
 return best;
}
/* % TNVK đã hưởng lấy từ sổ quyết định (hồ sơ không lưu %) */
function tnvkPrev(name){
 for(const q of QD){if(q.loai!=='TNVK'||q.st==='Đã hủy')continue;const p=q.ng.find(x=>x.ten===name);if(p){const m=String(p.hs).match(/→\s*(\d+)%/);if(m)return +m[1]}}
 return null;
}
/* Danh sách NLTH do Phòng HCTH lập từ thành tích đã ghi nhận: {sid, ktKey} */
const NLTH_LIST=[];
const ktKeyOf=k=>`${k.nam}|${k.ht}`;
const ktUsedBy=(s,key)=>(s.ktUsed||[]).includes(key);
const nlthPending=()=>NLTH_LIST.filter(e=>{const s=staffById(e.sid);if(!s||ktUsedBy(s,e.ktKey))return false;const k=s.kt.find(x=>ktKeyOf(x)===e.ktKey),n=ngachOf(s.ng),mx=mocXep(s);if(!k||!n||!mx)return false;return +addMonths(addMonths(mx.date,n.giu),-quyDoi(`${k.ht} ${k.cap}`)).slice(0,4)===CHI_TIEU.nam}).length;
const xepLoai=(s,yrs)=>yrs.map(y=>(s.kqn||{})[y]||null);
function condXepLoai(vals,yrs){
 const bad=yrs.filter((y,i)=>vals[i]==='KHTNV'),miss=yrs.filter((y,i)=>!vals[i]);
 if(bad.length)return ['Chưa đủ','KHTNV '+bad.join(', '),'Chưa đủ: KHTNV '+bad.join(', ')];
 if(miss.length)return ['Cần xem xét','thiếu xếp loại '+miss.join(', '),'Cần xem xét: thiếu xếp loại '+miss.join(', ')];
 return ['Đủ','','Đủ'];
}
function nlthRow(s,n,k,normal,mx){
 const m=quyDoi(`${k.ht} ${k.cap}`);if(!m)return null;
 const key=ktKeyOf(k),early=addMonths(normal,-m),ye=+early.slice(0,4),yrs=[ye-3,ye-2,ye-1],vals=xepLoai(s,yrs),[dk,why,txt0]=condXepLoai(vals,yrs);
 const duKien=ye!==CHI_TIEU.nam,pend=nlthPending(),quotaOk=CHI_TIEU.daDung+pend<=CHI_TIEU.tong;
 return {id:`${s.id}~${early}~TH`,sid:s.id,name:s.ten,unit:UNIT_SHORT[s.u]||unitName(s),loai:'Trước hạn',cur:`Bậc ${s.bac} · ${hsS(s.hs)}`,nxt:`Bậc ${s.bac+1} · ${hsS(hsLookup(s.ng,s.bac+1))}`,due:early,months:m,dk,why,hard:duKien,duKien:duKien?ye:0,ktKey:key,
  canCu:[['Mốc xếp bậc hiện tại',`${fmtD(mx.date)} · ${mx.src}`,'Đủ'],['Thành tích 5 năm gần nhất',`${k.ht} ${k.cap} ${k.nam} (quy đổi ${m} tháng)`,'Đủ'],[`Xếp loại ${yrs.join(' · ')}`,vals.map(v=>v||'—').join(' · '),txt0],['Ngày nâng trước hạn',`${fmtD(normal)} − ${m} tháng = ${fmtD(early)}`,duKien?`Dự kiến năm ${ye}: chưa xuất Mẫu số 2 trước năm chỉ tiêu`:'Đủ'],[`Chỉ tiêu NLTH năm ${CHI_TIEU.nam}`,`đã dùng ${CHI_TIEU.daDung}, đang lập ${pend} / ${CHI_TIEU.tong}`,duKien||quotaOk?'Đủ':'Chưa đủ: vượt chỉ tiêu']]};
}
/* Danh sách để Phòng HCTH tick chọn NLTH: mọi viên chức đang công tác, trừ người đang nằm trong danh sách đến kỳ (nâng bậc đúng hạn)
   và người đã được đưa vào danh sách NLTH. Mỗi người có thể chọn một thành tích ghi trong hồ sơ (NL03-05). */
function nlthPool(chosenKt){
 const tg=fst('nb',NB_DEF).tg||'3';
 const dueSet=new Set(nbRows(tg).filter(r=>r.loai!=='Trước hạn'&&r.tt!=='Đã có quyết định').map(r=>r.sid));
 const out=[];let excluded=0;
 STAFF.forEach(s=>{
  if(s.loai!=='Viên chức'||!isActive(s))return;
  if(dueSet.has(s.id)){excluded++;return}
  if(NLTH_LIST.some(e=>e.sid===s.id&&!ktUsedBy(s,e.ktKey)))return;
  const mx=mocXep(s),n=s.ng?ngachOf(s.ng):null;
  const base={sid:s.id,name:s.ten,unit:UNIT_SHORT[s.u]||unitName(s),bacTxt:s.bac&&n?`${s.bac}/${n.bac}`:'—',mx,normal:null,opts:[],block:''};
  if(!n||!s.bac){base.block='Chưa có ngạch, bậc';out.push(base);return}
  if(s.bac>=n.bac){base.block='Đang ở bậc cuối (xét thâm niên vượt khung)';out.push(base);return}
  if(!mx){base.block='Chưa có mốc xếp bậc';out.push(base);return}
  base.normal=addMonths(mx.date,n.giu);
  const yrMin=+NB_ASOF.slice(0,4)-NB_PARAM.thanhTichNam;
  s.kt.forEach(k=>{const key=ktKeyOf(k);if(ktUsedBy(s,key)||k.nam<yrMin)return;const row=nlthRow(s,n,k,base.normal,mx);base.opts.push({key,k,row,label:`${k.ht} ${k.cap} ${k.nam}`+(row?'':' (không quy đổi)')})});
  const ok=base.opts.filter(o=>o.row);
  if(!s.kt.length)base.block='Chưa có thành tích ghi trong hồ sơ';
  else if(!ok.length)base.block=base.opts.length?'Thành tích không thuộc bảng quy đổi':'Thành tích đã dùng hoặc quá 5 năm';
  else{const want=chosenKt&&chosenKt[s.id];const pick=ok.find(o=>o.key===want)||ok[0];base.pick=pick;base.row=pick.row}
  out.push(base);
 });
 out.excluded=excluded;return out;
}
const nlthCandidates=()=>nlthPool().filter(p=>p.row).map(p=>({...p.row,ckey:p.sid,kt:p.pick.k}));

function nbCompute(endISO){
 const rows=[];
 STAFF.forEach(s=>{
  const mx=mocXep(s);
  if(s.loai!=='Viên chức'||!isActive(s)||!s.ng||!s.bac||!mx)return;
  const n=ngachOf(s.ng);if(!n)return;
  const xb=mx.date,unit=UNIT_SHORT[s.u]||unitName(s),bacCuoi=s.bac>=n.bac;
  const mk=(loai,due,cur,nxt,extra)=>({id:`${s.id}~${due}~${LOAI_CODE[loai]}`,sid:s.id,name:s.ten,unit,loai,cur,nxt,due,months:0,...extra});
  const rowMoc=['Mốc xếp bậc hiện tại',`${fmtD(xb)} · ${mx.src}`,'Đủ'];
  if(!bacCuoi){
   const due=addMonths(xb,n.giu),y=+due.slice(0,4),yrs=[y-3,y-2,y-1],vals=xepLoai(s,yrs),[dk,why,txt]=condXepLoai(vals,yrs);
   if(due<=endISO)rows.push(mk('Thường xuyên',due,`Bậc ${s.bac} · ${hsS(s.hs)}`,`Bậc ${s.bac+1} · ${hsS(hsLookup(s.ng,s.bac+1))}`,{dk,why,canCu:[rowMoc,['Thời gian giữ bậc',`${n.giu} tháng (${fmtD(xb)} → ${fmtD(due)})`,'Đủ'],[`Xếp loại ${yrs.join(' · ')}`,vals.map(v=>v||'—').join(' · '),txt],['Kỷ luật','Hệ thống không quản lý kỷ luật: Phòng HCTH tự đối chiếu','Đủ']]}));
   // nâng bậc trước hạn: chỉ những người Phòng HCTH đã đưa vào danh sách NLTH
   NLTH_LIST.filter(e=>e.sid===s.id).forEach(e=>{const k=s.kt.find(x=>ktKeyOf(x)===e.ktKey);if(!k||ktUsedBy(s,e.ktKey))return;const r=nlthRow(s,n,k,due,mx);if(r)rows.push(r)});
  }else{
   const prev=tnvkPrev(s.ten),first=prev==null,due=addMonths(xb,first?n.giu:NB_PARAM.tnvkChuKy),y=+due.slice(0,4),yrs=[y-3,y-2,y-1],vals=xepLoai(s,yrs),[dk,why,txt]=condXepLoai(vals,yrs);

function phValid(p){
 if(!p.tc.length)return 'Phiếu chưa có tiêu chí.';
 if(p.tc.some(t=>!(t.n||'').trim()||!(parseFloat(t.max)>0)))return 'Mỗi tiêu chí cần tên và điểm tối đa lớn hơn 0.';

 if(new Set(mins).size!==mins.length)return 'Bảng quy đổi có hai mức trùng ngưỡng điểm.';
 if(Math.max(...mins)>tot)return `Ngưỡng cao nhất (${Math.max(...mins)}) vượt tổng điểm của phiếu (${tot}).`;

 return '';
}

function phCommit(pub){
 const d=S.draft,p=PHIEU.find(x=>x.id===d.id);d.tc.forEach(t=>t.max=parseFloat(t.max)||0);d.qd.forEach(q=>q.min=parseFloat(q.min)||0);

 if(err){toast(err,'e');return false}
 const changed=JSON.stringify([p.tc,p.qd,p.dt])!==JSON.stringify([d.tc,d.qd,d.dt]);
 if(p.st==='Đang dùng'&&changed){p.ver++;addH(p.hist,`Sửa phiếu: tạo phiên bản ${p.ver} cho đợt sau (đợt đang mở dùng phiên bản cũ)`)}
 else if(changed)addH(p.hist,'Sửa phiếu');
 p.tc=d.tc;p.qd=d.qd;p.dt=d.dt;

}

 return `<div class="otw"><table class="fill"><thead><tr><th>STT</th><th>Tiêu chí</th><th class="num">Điểm tối đa</th><th>Tự đánh giá</th></tr></thead><tbody>${p.tc.map((t,i)=>`<tr><td>${i+1}</td><td>${esc(t.n)}</td><td class="num">${t.max}</td><td>${mode==='xa'?inp('self',i):`<span class="ff-v ro">${f.self[i]===''?'—':f.self[i]}</span>`}</td></tr>`).join('')}<tr class="sumrow"><td colspan="2"><b>Tổng điểm · mức gợi ý</b></td><td class="num"><b>${phTotal(p)}</b></td><td><b>${st}</b> ${mucB(mucTheoDiem(p,st))}</td></tr></tbody></table></div>`;
}

function saveData(){
 try{const o={};Object.keys(PERSIST).forEach(k=>o[k]=PERSIST[k]);localStorage.setItem(DKEY,JSON.stringify(o))}catch(_){}
}
function loadData(){
 try{
  const o=JSON.parse(localStorage.getItem(DKEY)||'null');if(!o)return;
  Object.keys(PERSIST).forEach(k=>{
   if(!(k in o))return;const t=PERSIST[k],v=o[k];
   if(Array.isArray(t)){t.splice(0,t.length,...(k==='USERS'?v.map(mkUser):v))}
   else{Object.keys(t).forEach(x=>delete t[x]);Object.assign(t,v)}
  });
 }catch(_){}
}
