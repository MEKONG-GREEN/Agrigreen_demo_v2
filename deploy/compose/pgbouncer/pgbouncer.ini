; PgBouncer transaction mode — cấu hình ĐTK 1 (mục 4).
; R-30: ngữ cảnh tenant chỉ đặt bằng SET LOCAL trong giao dịch; đặt ở mức phiên sẽ rò rỉ.
; Kết nối replication của engine đồng bộ KHÔNG đi qua đây (mục 15, điều kiện 5).
[databases]
* = host=postgres port=5432

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
max_client_conn = 1000
default_pool_size = 20
; Pool theo khối lượng công việc: mỗi (database, vai) một pool riêng.
server_reset_query =
server_reset_query_always = 0
ignore_startup_parameters = extra_float_digits,application_name,timezone
max_prepared_statements = 0
