# ĐTK 1 — Docker Compose toàn bộ nền tảng cho Local/Dev (mục 4). Chỉ dùng dữ liệu tổng hợp (mục 21).
#
#   ./scripts/gen-dev-secrets.ps1      # hoặc: sh scripts/gen-dev-secrets.sh — sinh deploy/compose/.env
#   docker compose -f deploy/compose/docker-compose.yml up -d --build --wait
#
# Địa chỉ trên máy (mọi cổng chỉ mở ở 127.0.0.1):
#   web vận hành        http://localhost:3000
#   Application API     http://localhost:8080   (/healthz, /readyz)
#   Admin API (MFA)     http://localhost:8082
#   identity-vault      http://localhost:8090   (bề mặt Internal — production chỉ mTLS trong cụm)
#   API nội bộ MKG      http://localhost:8081   (/healthz, /readyz) · quản trị MKG (MFA) http://localhost:8083
#   Internal API pf     https://api-platform:8084 — mTLS, CHỈ trong mạng compose (optimizer), không mở ra máy
#   ingest (nhận lô)    https://localhost:8443  — mTLS chứng thư thiết bị; /healthz, /readyz ở ingest:8091 trong mạng compose
#   edge-sim            agent biên mô phỏng → ingest; đăng ký sổ thiết bị: sh scripts/dev-edge-bootstrap.sh
#   Keycloak            http://localhost:8180   (realm agrigreen; issuer = http://localhost:8180/realms/agrigreen)
#   S3 (SeaweedFS)      http://localhost:9000
#   RabbitMQ            http://localhost:15672
#   Public API (G5)     http://localhost:8085   — chỉ với --profile phasek (bên thứ ba, khóa API X-API-Key)
#
# Bí mật chỉ nằm trong deploy/compose/.env (không commit). Mỗi dịch vụ chỉ nhận
# đúng biến nó cần (không dùng env_file chung): api-platform KHÔNG có mật khẩu
# vai vault_app, KEK hay khóa ký neo.
# Kho S3: SeaweedFS thay cho kho tương thích S3 TRONG LÃNH THỔ (RB-7) ở môi trường thật.
name: agrigreen

# Cứng hóa chung cho container ứng dụng (mục 18): hệ tệp gốc chỉ đọc, bỏ mọi
# capability, không nâng quyền.
x-hardened: &hardened
  read_only: true
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]

x-go-app: &go-app
  <<: *hardened
  restart: unless-stopped

# Biến dùng chung của các dịch vụ Go (không có bí mật).
x-otel-env: &otel-env
  AG_ENV: local
  AG_OTLP_ENDPOINT: otel-collector:4317
  AG_OTLP_INSECURE: "true"

x-oidc-env: &oidc-env
  # Issuer công khai (trình duyệt thấy) khác địa chỉ nội bộ → lấy khóa ký qua JWKS nội bộ,
  # vẫn so issuer và audience (R-54). Xem cmd/api-platform/oidc.go.
  AG_OIDC_ISSUER: http://localhost:8180/realms/agrigreen
  AG_OIDC_AUDIENCE: agrigreen-api
  AG_OIDC_JWKS_URL: http://keycloak:8080/realms/agrigreen/protocol/openid-connect/certs

# Keycloak Admin REST cho pf/accounts (tài khoản dịch vụ agrigreen-accounts, realm dev).
x-kc-admin-env: &kc-admin-env
  AG_KC_ADMIN_URL: http://keycloak:8080
  AG_KC_REALM: agrigreen
  AG_KC_CLIENT_ID: agrigreen-accounts
  AG_KC_CLIENT_SECRET: ${AG_KC_CLIENT_SECRET:?chạy scripts/gen-dev-secrets để bổ sung AG_KC_CLIENT_SECRET vào deploy/compose/.env}
  AG_KC_ACTIONS_CLIENT_ID: agrigreen-web-ops
  AG_KC_ACTIONS_REDIRECT_URI: http://localhost:3000/

x-s3-env: &s3-env
  AG_S3_ENDPOINT: seaweedfs:9000
  AG_S3_BUCKET: ${AG_S3_BUCKET:-agrigreen}
  AG_S3_ACCESS_KEY: agrigreen-app
  AG_S3_SECRET_KEY: ${S3_APP_SECRET_KEY:?chạy scripts/gen-dev-secrets để sinh deploy/compose/.env}
  AG_S3_USE_TLS: "false"

# Chứng thư mTLS của bề mặt Internal (api-platform ↔ optimizer), sinh bởi
# scripts/gen-dev-certs (gen-dev-secrets tự gọi) vào deploy/compose/.certs (gitignore).
# create_host_path: false → thiếu tệp thì compose báo lỗi thay vì tạo thư mục rỗng.
# Mỗi dịch vụ chỉ nhận đúng khóa của nó; khóa CA không gắn vào đâu.
x-internal-server-certs: &internal-server-certs
  - { type: bind, source: ./.certs/ca.crt, target: /certs/ca.crt, read_only: true, bind: { create_host_path: false } }
  - { type: bind, source: ./.certs/api-platform.crt, target: /certs/api-platform.crt, read_only: true, bind: { create_host_path: false } }
  - { type: bind, source: ./.certs/api-platform.key, target: /certs/api-platform.key, read_only: true, bind: { create_host_path: false } }

# Listener nhận lô mTLS của cmd/ingest (ADR-0019): chứng thư máy chủ + CA cấp chứng thư
# thiết bị. Dev dùng chung CA nội bộ; production nên có CA riêng cho thiết bị biên.
x-ingest-server-certs: &ingest-server-certs
  # CA THIẾT BỊ riêng (không phải ca.crt của dịch vụ nội bộ): ingest chỉ tin chứng thư client do nó ký.
  - { type: bind, source: ./.certs/device-ca.crt, target: /certs/device-ca.crt, read_only: true, bind: { create_host_path: false } }
  - { type: bind, source: ./.certs/ingest.crt, target: /certs/ingest.crt, read_only: true, bind: { create_host_path: false } }
  - { type: bind, source: ./.certs/ingest.key, target: /certs/ingest.key, read_only: true, bind: { create_host_path: false } }

x-optimizer-client-certs: &optimizer-client-certs
  - { type: bind, source: ./.certs/ca.crt, target: /certs/ca.crt, read_only: true, bind: { create_host_path: false } }
  - { type: bind, source: ./.certs/optimizer.crt, target: /certs/optimizer.crt, read_only: true, bind: { create_host_path: false } }
  - { type: bind, source: ./.certs/optimizer.key, target: /certs/optimizer.key, read_only: true, bind: { create_host_path: false } }

services:
  # ---------------------------------------------------------------- hạ tầng
  postgres:
    image: agrigreen/postgres:dev   # postgis/postgis:17-3.5 + pgRouting (deploy/compose/postgres)
    build: { context: ./postgres, dockerfile: Dockerfile }
    environment:
      POSTGRES_PASSWORD: ${PG_SUPERUSER_PASSWORD:?chạy scripts/gen-dev-secrets để sinh deploy/compose/.env}
    command: ["postgres", "-c", "max_connections=300", "-c", "wal_level=logical", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "max_locks_per_transaction=256"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U postgres"]  # TCP: server tạm của bước init chỉ nghe unix socket
      interval: 5s
      retries: 20
    restart: unless-stopped

  pgbouncer:
    image: edoburu/pgbouncer:v1.24.1-p1
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      AG_DB_APP_PASSWORD: ${AG_DB_APP_PASSWORD:?chạy scripts/gen-dev-secrets}
      AG_DB_PASSWORD_VAULT_APP: ${AG_DB_PASSWORD_VAULT_APP:?chạy scripts/gen-dev-secrets}
    entrypoint: ["/bin/sh", "/etc/pgbouncer-src/entrypoint.sh"]
    volumes: ["./pgbouncer:/etc/pgbouncer-src:ro"]
    ports: ["127.0.0.1:6432:6432"]
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 6432"]
      interval: 5s
      retries: 20
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  migrate-bootstrap:
    <<: *hardened
    image: agrigreen/migrate:dev
    build: { context: ../.., dockerfile: Dockerfile, args: { CMD: migrate } }
    depends_on:
      postgres: { condition: service_healthy }
    command: ["bootstrap"]
    environment:
      AG_PG_ADMIN_URL: postgres://postgres:${PG_SUPERUSER_PASSWORD}@postgres:5432/postgres?sslmode=disable
      AG_DB_APP_PASSWORD: ${AG_DB_APP_PASSWORD}
      AG_DB_PASSWORD_VAULT_APP: ${AG_DB_PASSWORD_VAULT_APP}
    restart: "no"

  migrate-up:
    <<: *hardened
    image: agrigreen/migrate:dev
    build: { context: ../.., dockerfile: Dockerfile, args: { CMD: migrate } }
    depends_on:
      migrate-bootstrap: { condition: service_completed_successfully }
    command: ["up"]
    environment:
      AG_DB_URL: postgres://postgres:5432/?sslmode=disable
      AG_DB_APP_PASSWORD: ${AG_DB_APP_PASSWORD}
    restart: "no"

  rabbitmq:
    image: rabbitmq:4.1-management
    environment:
      RABBITMQ_DEFAULT_USER: agrigreen
      RABBITMQ_DEFAULT_PASS: ${AMQP_PASSWORD:?chạy scripts/gen-dev-secrets}
    ports: ["127.0.0.1:5672:5672", "127.0.0.1:15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      retries: 12
    restart: unless-stopped

  # Một lần: vhost RIÊNG cho sự kiện nội bộ MKG (ADR-0018) + tài khoản mkg_internal chỉ có
  # quyền trên vhost đó. Tài khoản nền tảng (agrigreen) bị gỡ quyền trên mkg.internal: không
  # bind, không đọc được sự kiện nội bộ. Qua management API (idempotent, chạy lại an toàn).
  rabbitmq-init:
    <<: *hardened
    image: curlimages/curl:8.15.0
    depends_on:
      rabbitmq: { condition: service_healthy }
    environment:
      AMQP_PASSWORD: ${AMQP_PASSWORD}
      AMQP_INTERNAL_PASSWORD: ${AMQP_INTERNAL_PASSWORD:?chạy scripts/gen-dev-secrets để bổ sung AMQP_INTERNAL_PASSWORD}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        B=http://rabbitmq:15672/api
        api() { curl -fsS --retry 30 --retry-delay 2 --retry-all-errors -u "agrigreen:$$AMQP_PASSWORD" -H 'content-type: application/json' "$$@" -o /dev/null; }
        api -X PUT "$$B/vhosts/mkg.internal" -d '{"description":"Sự kiện nội bộ MKG (ADR-0018)","default_queue_type":"quorum"}'
        api -X PUT "$$B/users/mkg_internal" -d "{\"password\":\"$$AMQP_INTERNAL_PASSWORD\",\"tags\":\"\"}"
        api -X PUT "$$B/permissions/mkg.internal/mkg_internal" -d '{"configure":".*","write":".*","read":".*"}'
        # Tạo vhost qua API tự cấp quyền cho người tạo — gỡ ngay: nền tảng không có quyền trên mkg.internal.
        curl -sS -u "agrigreen:$$AMQP_PASSWORD" -X DELETE "$$B/permissions/mkg.internal/agrigreen" -o /dev/null || true
        echo "rabbitmq-init: vhost mkg.internal sẵn sàng"
    tmpfs: ["/tmp"]
    restart: "no"

  valkey:
    image: valkey/valkey:8-alpine
    command: ["valkey-server", "--save", "", "--appendonly", "no"]   # cache, KHÔNG phải nguồn sự thật
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      retries: 12
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?chạy scripts/gen-dev-secrets}
      # Thay placeholder ${AG_KC_CLIENT_SECRET} của client agrigreen-accounts khi nhập realm.
      AG_KC_CLIENT_SECRET: ${AG_KC_CLIENT_SECRET:?chạy scripts/gen-dev-secrets}
      # Issuer cố định theo địa chỉ trình duyệt; container khác gọi keycloak:8080 (backchannel).
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    # Theme đăng nhập "agrigreen" (KN v7.7 FN-CH-00.01, Hình 3a; realm đặt loginTheme = agrigreen). VPS
    # (docker-compose.vps.yml) chỉ ghi đè thư mục import nên kế thừa mount theme này.
    volumes:
      - "./keycloak:/opt/keycloak/data/import:ro"
      - "./keycloak-themes/agrigreen:/opt/keycloak/themes/agrigreen:ro"
    ports: ["127.0.0.1:8180:8080"]
    healthcheck:
      # Ảnh Keycloak không có curl: gọi cổng quản trị 9000 bằng /dev/tcp của bash.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 30
    restart: unless-stopped

  # Kho S3 cho Local/Dev: SeaweedFS (Apache-2.0). MinIO đã ngừng phát hành image
  # công khai (2026). Production dùng kho tương thích S3 TRONG LÃNH THỔ có khóa đối
  # tượng và thông tin xác thực không có quyền xóa (RB-7, ADR-0007, mục 22).
  # Hai danh tính: "agrigreen" (quản trị, chỉ s3-init dùng) và "agrigreen-app"
  # (ứng dụng, chỉ Read/Write/List trên bucket). Lưu ý: hành động Write của
  # SeaweedFS gồm cả xóa — giới hạn "không xóa" chỉ kiểm chứng được trên kho thật.
  seaweedfs:
    image: chrislusf/seaweedfs:4.47
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mkdir -p /tmp/cfg
        cat > /tmp/cfg/s3.json <<EOF
        {"identities":[
          {"name":"admin","credentials":[{"accessKey":"agrigreen","secretKey":"$$S3_ROOT_SECRET"}],"actions":["Admin","Read","Write","List","Tagging"]},
          {"name":"agrigreen-app","credentials":[{"accessKey":"agrigreen-app","secretKey":"$$S3_APP_SECRET_KEY"}],"actions":["Read:$$BUCKET","Write:$$BUCKET","List:$$BUCKET"]}
        ]}
        EOF
        exec weed server -dir=/data -ip.bind=0.0.0.0 -s3 -s3.port=9000 -s3.config=/tmp/cfg/s3.json -master.volumeSizeLimitMB=256
    environment:
      S3_ROOT_SECRET: ${MINIO_ROOT_PASSWORD:?chạy scripts/gen-dev-secrets}
      S3_APP_SECRET_KEY: ${S3_APP_SECRET_KEY:?chạy scripts/gen-dev-secrets}
      BUCKET: ${AG_S3_BUCKET:-agrigreen}
    tmpfs: ["/tmp"]
    volumes: ["objects:/data"]
    ports: ["127.0.0.1:9000:9000"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status && wget -q -O /dev/null http://127.0.0.1:9000/ || wget -q -S -O /dev/null http://127.0.0.1:9000/ 2>&1 | grep -q 'HTTP/'"]
      interval: 5s
      timeout: 5s
      start_period: 20s
      retries: 30
    restart: unless-stopped

  # Một lần: tạo bucket và thử bật versioning bằng AWS CLI (Apache-2.0).
  s3-init:
    <<: *hardened
    image: amazon/aws-cli:2.37.4
    depends_on:
      seaweedfs: { condition: service_healthy }
    environment:
      HOME: /tmp
      AWS_ACCESS_KEY_ID: agrigreen
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_DEFAULT_REGION: us-east-1
      BUCKET: ${AG_S3_BUCKET:-agrigreen}
    tmpfs: ["/tmp"]
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        E="--endpoint-url http://seaweedfs:9000"
        aws $$E s3api head-bucket --bucket "$$BUCKET" 2>/dev/null || aws $$E s3api create-bucket --bucket "$$BUCKET"
        aws $$E s3api put-bucket-versioning --bucket "$$BUCKET" --versioning-configuration Status=Enabled \
          || echo "s3-init: kho dev chưa hỗ trợ versioning — bỏ qua (chỉ Local/Dev)"
        echo "s3-init: xong bucket $$BUCKET"
    restart: "no"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.128.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes: ["./otel/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro"]
    ports: ["127.0.0.1:4317:4317", "127.0.0.1:4318:4318"]
    <<: *hardened
    restart: unless-stopped

  # ---------------------------------------------------------------- ứng dụng
  identity-vault:
    <<: *go-app
    image: agrigreen/identity-vault:dev
    build: { context: ../.., dockerfile: Dockerfile, args: { CMD: identity-vault } }
    depends_on:
      migrate-up: { condition: service_completed_successfully }
      pgbouncer: { condition: service_healthy }
      keycloak: { condition: service_healthy }
    environment:
      <<: [*otel-env, *oidc-env]
      AG_HTTP_ADDR: ":8090"
      AG_VAULT_DB_URL: postgres://pgbouncer:6432/?sslmode=disable
      AG_DB_VIA_PGBOUNCER: "1"
      AG_DB_PASSWORD_VAULT_APP: ${AG_DB_PASSWORD_VAULT_APP}
      AG_VAULT_KEK: ${AG_VAULT_KEK:?chạy scripts/gen-dev-secrets}
      AG_VAULT_KEK_ID: local-1
      AG_VAULT_BLIND_KEY: ${AG_VAULT_BLIND_KEY:?chạy scripts/gen-dev-secrets}
    ports: ["127.0.0.1:8090:8090"]

  api-platform:
    <<: *go-app
    image: agrigreen/api-platform:dev
    build: { context: ../.., dockerfile: Dockerfile, args: { CMD: api-platform } }
    depends_on:
      migrate-up: { condition: service_completed_successfully }
      s3-init: { condition: service_completed_successfully }
      pgbouncer: { condition: service_healthy }
      keycloak: { condition: service_healthy }
      identity-vault: { condition: service_started }
    environment:
      <<: [*otel-env, *oidc-env, *s3-env, *kc-admin-env]
      AG_HTTP_ADDR: ":8080"
      AG_ADMIN_HTTP_ADDR: ":8082"
      AG_PF_DB_URL: postgres://pgbouncer:6432/?sslmode=disable
      AG_DB_VIA_PGBOUNCER: "1"
      AG_DB_APP_PASSWORD: ${AG_DB_APP_PASSWORD}
      # Màn giám sát đồng bộ (GIS US-SYNC-01): độ sâu DLQ qua management API.
      AG_RABBITMQ_MGMT_URL: http://agrigreen:${AMQP_PASSWORD}@rabbitmq:15672
      AG_VAULT_URL: http://identity-vault:8090
      AG_SYNC_CURSOR_KEY: ${AG_SYNC_CURSOR_KEY:?chạy scripts/gen-dev-secrets}
      AG_CORS_ORIGINS: ${AG_CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      # Internal API /internal/v1 cho optimizer (mục 11): mTLS bắt buộc, CN/SAN client = optimizer.
      AG_INTERNAL_HTTP_ADDR: ":8084"
      AG_INTERNAL_TLS_CERT: /certs/api-platform.crt
      AG_INTERNAL_TLS_KEY: /certs/api-platform.key
      AG_INTERNAL_CLIENT_CA: /certs/ca.crt
      AG_INTERNAL_CLIENT_NAMES: optimizer
      # Điểm kiểm soát xuất (ADR-0024): observe (ĐTK 1) | enforce (Phase K) — đặt AG_EGRESS_MODE trong .env.
      AG_EGRESS_MODE: ${AG_EGRESS_MODE:-observe}
      # Admin API cấp khóa API cần pepper (ADR-0022 mục 4); rỗng khi chưa chạy hồ sơ phasek.
      AG_APIKEY_PEPPER_V1: ${AG_APIKEY_PEPPER_V1:-}
      AG_APIKEY_PEPPER_CURRENT: "1"
    volumes: *internal-server-certs
    ports: ["127.0.0.1:8080:8080", "127.0.0.1:8082:8082"]
    # 8084 (Internal, mTLS) chỉ trong mạng compose — KHÔNG publish ra máy chủ.
    expose: ["8084"]

  # API nội bộ MKG (vùng mkg, mục 5): cụm ag_mkg qua PgBouncer, vai theo module + mkg_api (idempotency).
  api-internal:
    <<: *go-app
    image: agrigreen/api-internal:dev
    build: { context: ../.., dockerfile: Dockerfile, args: { CMD: api-internal } }
    depends_on:
      migrate-up: { condition: service_completed_successfully }
      pgbouncer: { condition: service_healthy }
      keycloak: { condition: service_healthy }
    environment:
      <<: [*otel-env, *oidc-env]
      AG_HTTP_ADDR: ":8081"
      AG_ADMIN_HTTP_ADDR: ":8083"
      AG_MKG_DB_URL: postgres://pgbouncer:6432/?sslmode=disable
      # Job hub_capacity_daily: khóa leader mức phiên nối THẲNG PostgreSQL (không qua PgBouncer).
      AG_MKG_DB_DIRECT_URL: postgres://postgres:5432/?sslmode=disable
      # Web nội bộ MKG (apps/web-internal) gọi chéo từ trình duyệt.
      AG_CORS_ORIGINS: ${AG_MKG_CORS_ORIGINS:-http://localhost:3001,http://127.0.0.1:3001}
      AG_DB_VIA_PGBOUNCER: "1"
      AG_DB_APP_PASSWORD: ${AG_DB_APP_PASSWORD}
      # Nền tảng → MKG (ADR-0020): mkg/fieldops đọc bề mặt đối tác /v1/partner/* bằng tài khoản dịch vụ
      # agrigreen-mkg-sync của tenant MKG (tenant RIÊNG). Đọc được khi tenant chương trình
      # (AG_PARTNER_GRANTOR_TENANT) đã duyệt cấp quyền chia sẻ (POST /v1/share-grants, hai quản trị).
      # AG_PLATFORM_API_URL trống → nguồn thửa/HTX đóng (lập lệnh gom trả 503 fieldops.directory_unavailable).
      AG_PLATFORM_API_URL: ${AG_PLATFORM_API_URL:-}
      AG_PLATFORM_TOKEN_URL: ${AG_PLATFORM_TOKEN_URL:-http://keycloak:8080/realms/agrigreen/protocol/openid-connect/token}
      AG_MKG_SA_CLIENT_ID: ${AG_MKG_SA_CLIENT_ID:-agrigreen-mkg-sync}
      AG_MKG_SA_CLIENT_SECRET: ${AG_MKG_SA_CLIENT_SECRET:-}
      AG_MKG_TENANT_ID: ${AG_MKG_TENANT_ID:-}
      AG_PARTNER_GRANTOR_TENANT: ${AG_PARTNER_GRANTOR_TENANT:-}
    # Ảnh distroless không có curl: chính binary kiểm /readyz (cmd/api-internal -healthcheck).
    healthcheck:
      test: ["CMD", "/app", "-healthcheck", "http://127.0.0.1:8081/readyz"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 20
    ports: ["127.0.0.1:8081:8081", "127.0.0.1:8083:8083"]

  # Engine mô phỏng chọn Hub (Python, pf/simulation): nhận pf.simulation.job.requested từ
  # RabbitMQ, GET ảnh chụp + POST kết quả qua Internal API của api-platform (mTLS). Không mở cổng.
  optimizer:
    <<: *hardened
    image: agrigreen/optimizer:dev
    build: { context: ../../optimizer, dockerfile: Dockerfile }
    command: ["consume"]
    depends_on:
      rabbitmq: { condition: service_healthy }
      api-platform: { condition: service_started }
    environment:
      AG_AMQP_URL: amqp://agrigreen:${AMQP_PASSWORD}@rabbitmq:5672/
      AG_OPTIMIZER_QUEUE: pf.simulation.optimizer
      AG_INTERNAL_API_URL: https://api-platform:8084
      AG_OPTIMIZER_CLIENT_CERT: /certs/optimizer.crt
      AG_OPTIMIZER_CLIENT_KEY: /certs/optimizer.key
      AG_INTERNAL_CA: /certs/ca.crt
    volumes: *optimizer-client-certs
    tmpfs: ["/tmp"]
    restart: unless-stopped

  outbox-publisher:
    <<: *go-app
    image: agrigreen/outbox-publisher:dev
    build: { context: ../.., dockerfile: Dockerfile, args: { CMD: outbox-publisher } }
    depends_on:
      migrate-up: { condition: service_completed_successfully }
      rabbitmq: { condition: service_healthy }
      rabbitmq-init: { condition: service_completed_successfully }
    environment:
      <<: *otel-env
      AG_DB_URL: postgres://postgres:5432/?sslmode=disable
      AG_DB_APP_PASSWORD: ${AG_DB_APP_PASSWORD}
      AG_AMQP_URL: amqp://agrigreen:${AMQP_PASSWORD}@rabbitmq:5672/
      # Sự kiện nội bộ MKG (kind = internal) → vhost mkg.internal (ADR-0018). %2F không cần: tên vhost không có '/'.
      AG_AMQP_INTERNAL_URL: amqp://mkg_internal:${AMQP_INTERNAL_PASSWORD}@rabbitmq:5672/mkg.internal

  # Consumer sự kiện nội bộ MKG (vùng mkg, ADR-0018): vhost mkg.internal, cụm ag_mkg qua PgBouncer.
  # G3-0: khung — chưa có consumer; health ở 8086 (không publish ra máy).
  worker-internal:
    <<: *go-app
    image: agrigreen/worker-internal:dev
    build: { context: ../.., dockerfile: Dockerfile, args: { CMD: worker-internal } }
    depends_on:
      migrate-up: { condition: service_completed_successfully }
      pgbouncer: { condition: service_healthy }
      rabbitmq-init: { condition: service_completed_successfully }
    environment:
      <<: *otel-env
      AG_MKG_DB_URL: postgres://pgbouncer:6432/?sslmode=disable
      AG_DB_VIA_PGBOUNCER: "1"
      AG_DB_APP_PASSWORD: ${AG_DB_APP_PASSWORD}
      AG_AMQP_INTERNAL_URL: amqp://mkg_internal:${AMQP_INTERNAL_PASSWORD}@rabbitmq:5672/mkg.internal
      AG_HEALTH_ADDR: ":8086"
    healthcheck:
      test: ["CMD", "/app", "-healthcheck", "http://127.0.0.1:8086/readyz"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 20

  # Nhận lô số đo có chữ ký nguồn từ agent biên qua mTLS (vùng mkg, mục 13.2/14, ADR-0017/0019):
  # ghi ts_weigh (cụm ag_ts, vai ingest_ts/ts_reader) và tích phân phiếu cân (cụm ag_mkg, vai
  # ingest_mkg) — hai pool qua PgBouncer, không câu SQL nào chạm cả hai cụm (R-07).
  # 8091: /healthz, /readyz thuần HTTP — chỉ trong mạng compose. 8443: nhận lô mTLS — chỉ
  # 127.0.0.1 của máy (VPS: địa chỉ giao diện VPN/OT qua AG_INGEST_BIND_ADDR, xem
  # docs/runbooks/ingest.md; KHÔNG bao giờ qua Caddy/internet).
  ingest:
    <<: *go-app
    image: agrigreen/ingest:dev
    build: { context: ../.., dockerfile: Dockerfile, args: { CMD: ingest } }
    depends_on:
      migrate-up: { condition: service_completed_successfully }
      pgbouncer: { condition: service_healthy }
    environment:
      <<: *otel-env
      AG_HTTP_ADDR: ":8091"
      AG_INGEST_HTTP_ADDR: ":8443"
      AG_INGEST_TLS_CERT: /certs/ingest.crt
      AG_INGEST_TLS_KEY: /certs/ingest.key
      AG_INGEST_CLIENT_CA: /certs/device-ca.crt
      # Từ chối khởi động nếu CA client đã ký chứng thư máy chủ (luôn bật ở AG_ENV=production).
      AG_INGEST_REQUIRE_DEVICE_CA: "1"
      AG_TS_DB_URL: postgres://pgbouncer:6432/?sslmode=disable
      AG_MKG_DB_URL: postgres://pgbouncer:6432/?sslmode=disable
      AG_DB_VIA_PGBOUNCER: "1"
      AG_DB_APP_PASSWORD: ${AG_DB_APP_PASSWORD}
      # Tham số tạm (chờ khách): ngưỡng cờ lệch đồng hồ, phiên kẹt — mặc định trong cmd/ingest.
      AG_INGEST_INTEGRATE_INTERVAL: 15s
    volumes: *ingest-server-certs
    healthcheck:
      test: ["CMD", "/app", "-healthcheck", "http://127.0.0.1:8091/readyz"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 20
    expose: ["8091", "8443"]
    ports: ["${AG_INGEST_BIND_ADDR:-127.0.0.1}:8443:8443"]

  # ---------------------------------------------------------------- agent biên mô phỏng (chỉ dev)
  # edge-sim = cmd/edge-agent với bộ điều hợp simulator, đẩy lô tới https://ingest:8443.
  # Ba bước (docs/runbooks/ingest.md mục 2):
  #   edge-sim-init    (root, một lần) chép chứng thư client dev device-edge-sim-01.* từ
  #                    scripts/gen-dev-certs vào volume, khóa 0600 chủ 65532 (agent từ chối khóa
  #                    đọc được bởi người khác — tệp bind từ máy là 0644).
  #   edge-sim-enroll  (một lần, idempotent) `edge-agent enroll -skip-if-enrolled`: sinh khóa ký
  #                    nguồn Ed25519 + state.json kỳ 1 trong volume; chạy lại giữ nguyên.
  #   edge-sim         `edge-agent run`. Lô bị ingest từ chối (403 unknown_device) cho tới khi
  #                    sổ thiết bị có kỳ đã duyệt: chạy scripts/dev-edge-bootstrap.sh (đề xuất
  #                    bằng scale_supervisor, duyệt bằng device_approver KHÁC người — R-56).
  # docker-compose.vps.yml tắt ba dịch vụ này (profile dev-sim).
  edge-sim-init:
    <<: *hardened
    image: busybox:1.37
    cap_add: ["CHOWN", "DAC_OVERRIDE", "FOWNER"]
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mkdir -p /data/tls
        cp /src/device.crt /data/tls/device.crt
        cp /src/device.key /data/tls/device.key
        chmod 700 /data /data/tls
        chmod 644 /data/tls/device.crt
        chmod 600 /data/tls/device.key
        chown -R 65532:65532 /data
        echo "edge-sim-init: chứng thư client đã chép vào volume"
    volumes:
      - { type: volume, source: edge_sim_data, target: /data }
      - { type: bind, source: ./.certs/device-edge-sim-01.crt, target: /src/device.crt, read_only: true, bind: { create_host_path: false } }
      - { type: bind, source: ./.certs/device-edge-sim-01.key, target: /src/device.key, read_only: true, bind: { create_host_path: false } }
    restart: "no"

  edge-sim-enroll:
    <<: *hardened
    image: agrigreen/edge-agent:dev
    build: { context: ../.., dockerfile: Dockerfile, args: { CMD: edge-agent } }
    depends_on:
      edge-sim-init: { condition: service_completed_successfully }
    command: ["enroll", "-config", "/etc/edge-agent/enroll.json", "-epoch", "1", "-skip-if-enrolled"]
    volumes:
      - { type: volume, source: edge_sim_data, target: /var/lib/edge-agent }
      - { type: bind, source: ./edge-sim, target: /etc/edge-agent, read_only: true }
    restart: "no"

  edge-sim:
    <<: *go-app
    image: agrigreen/edge-agent:dev
    build: { context: ../.., dockerfile: Dockerfile, args: { CMD: edge-agent } }
    depends_on:
      edge-sim-enroll: { condition: service_completed_successfully }
      ingest: { condition: service_healthy }
    command: ["run", "-config", "/etc/edge-agent/run.json"]
    volumes:
      - { type: volume, source: edge_sim_data, target: /var/lib/edge-agent }
      - { type: bind, source: ./edge-sim, target: /etc/edge-agent, read_only: true }
      - { type: bind, source: ./.certs/ca.crt, target: /certs/ca.crt, read_only: true, bind: { create_host_path: false } }

  worker:
    <<: *go-app
    image: agrigreen/worker:dev
    build: { context: ../.., dockerfile: Dockerfile, args: { CMD: worker } }
    depends_on:
      migrate-up: { condition: service_completed_successfully }
      s3-init: { condition: service_completed_successfully }
      rabbitmq: { condition: service_healthy }
      pgbouncer: { condition: service_healthy }
      keycloak: { condition: service_healthy }
    environment:
      <<: [*otel-env, *s3-env, *kc-admin-env]
      # Consumer đi qua PgBouncer; job vận hành + khóa leader nối THẲNG PostgreSQL (khóa mức phiên).
      AG_DB_URL: postgres://pgbouncer:6432/?sslmode=disable
      AG_DB_VIA_PGBOUNCER: "1"
      AG_DB_DIRECT_URL: postgres://postgres:5432/?sslmode=disable
      AG_DB_APP_PASSWORD: ${AG_DB_APP_PASSWORD}
      AG_AMQP_URL: amqp://agrigreen:${AMQP_PASSWORD}@rabbitmq:5672/
      AG_ANCHOR_SIGNING_KEY: ${AG_ANCHOR_SIGNING_KEY:?chạy scripts/gen-dev-secrets}
      AG_ANCHOR_KEY_ID: local-dev-1
      AG_EGRESS_MODE: ${AG_EGRESS_MODE:-observe}   # ADR-0024
      AG_REPORT_LINK_BASE: ${AG_REPORT_LINK_BASE:-http://localhost:8080}   # A4: liên kết tải báo cáo Chi cục (api-platform)

  # Public API cho bên thứ ba (G5, ADR-0022) — TẮT mặc định, chỉ chạy với hồ sơ Phase K:
  #   docker compose -f deploy/compose/docker-compose.yml --profile phasek up -d --build --wait
  # (docs/runbooks/phase-k.md mục 6). Không RabbitMQ (outbox ghi DB), không identity-vault, không DB mkg/ts.
  # AG_PUBLIC_OPERATOR_TENANT: tenant đơn vị vận hành — đặt trong .env sau khi tạo tenant; rỗng → thoát lỗi.
  api-public:
    <<: *go-app
    profiles: [phasek]
    image: agrigreen/api-public:dev
    build: { context: ../.., dockerfile: Dockerfile, args: { CMD: api-public } }
    depends_on:
      migrate-up: { condition: service_completed_successfully }
      pgbouncer: { condition: service_healthy }
      valkey: { condition: service_healthy }
    environment:
      # s3-env: tải tệp xuất qua api-public (GET /v1/jobs/{id}/file, ADR-0022 mục 8). Dev dùng chung khóa
      # agrigreen-app; Helm Phase K dùng khóa CHỈ ĐỌC riêng pf-public-s3 (F29).
      <<: [*otel-env, *s3-env]
      AG_PUBLIC_API_ENABLED: "1"
      AG_PUBLIC_HTTP_ADDR: ":8085"
      AG_PF_DB_URL: postgres://pgbouncer:6432/?sslmode=disable
      AG_DB_VIA_PGBOUNCER: "1"
      AG_DB_APP_PASSWORD: ${AG_DB_APP_PASSWORD}
      AG_PUBLIC_OPERATOR_TENANT: ${AG_PUBLIC_OPERATOR_TENANT:-}
      AG_APIKEY_PEPPER_V1: ${AG_APIKEY_PEPPER_V1:-}
      AG_APIKEY_PEPPER_CURRENT: "1"
      # Giới hạn tần suất dùng chung (ADR-0022 mục 7). Rỗng → bộ đếm trong tiến trình.
      AG_VALKEY_URL: ${AG_VALKEY_URL:-redis://valkey:6379/0}
      AG_EGRESS_MODE: ${AG_EGRESS_MODE:-enforce}
      # Tùy chọn (ADR-0022 mục 5): client credentials cho đơn vị thẩm định.
      AG_PUBLIC_OIDC_ISSUER: ${AG_PUBLIC_OIDC_ISSUER:-}
      AG_PUBLIC_OIDC_AUDIENCE: ${AG_PUBLIC_OIDC_AUDIENCE:-}
    ports: ["127.0.0.1:8085:8085"]

  web-ops:
    <<: *hardened
    image: agrigreen/web-ops:dev
    build:
      context: ../../apps/web-ops
      dockerfile: Dockerfile
      # NEXT_PUBLIC_* nhúng lúc build (địa chỉ trình duyệt gọi, không phải tên container).
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
        NEXT_PUBLIC_ADMIN_API_BASE: http://localhost:8082
        NEXT_PUBLIC_OIDC_ISSUER: http://localhost:8180/realms/agrigreen
        NEXT_PUBLIC_OIDC_CLIENT_ID: agrigreen-web-ops
        NEXT_PUBLIC_API_MOCK: "0"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
      NEXT_PUBLIC_ADMIN_API_BASE: http://localhost:8082
      NEXT_PUBLIC_OIDC_ISSUER: http://localhost:8180/realms/agrigreen
      NEXT_PUBLIC_OIDC_CLIENT_ID: agrigreen-web-ops
      NEXT_PUBLIC_API_MOCK: "0"
    # Next.js standalone chỉ ghi cache — đặt trên tmpfs thuộc user node (uid 1000).
    tmpfs: ["/tmp", "/app/.next/cache:uid=1000,gid=1000,mode=0755"]
    depends_on:
      api-platform: { condition: service_started }
    ports: ["127.0.0.1:3000:3000"]
    restart: unless-stopped

  web-internal:
    <<: *hardened
    image: agrigreen/web-internal:dev
    build:
      context: ../../apps/web-internal
      dockerfile: Dockerfile
      # NEXT_PUBLIC_* nhúng lúc build: web nội bộ MKG CHỈ gọi api-internal (vùng mkg).
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8081
        NEXT_PUBLIC_ADMIN_API_BASE: http://localhost:8083
        NEXT_PUBLIC_OIDC_ISSUER: http://localhost:8180/realms/agrigreen
        NEXT_PUBLIC_OIDC_CLIENT_ID: agrigreen-web-internal
        NEXT_PUBLIC_API_MOCK: "0"
    tmpfs: ["/tmp", "/app/.next/cache:uid=1000,gid=1000,mode=0755"]
    depends_on:
      api-internal: { condition: service_started }
    ports: ["127.0.0.1:3001:3001"]
    restart: unless-stopped

volumes:
  pgdata: {}
  objects: {}
  # data_dir của edge-sim (state.json, WAL, source.key, tls/). Xóa volume = "mất đĩa" → kỳ mới.
  edge_sim_data: {}
