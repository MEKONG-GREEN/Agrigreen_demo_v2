# Profile `kn` — hệ thống Khuyến nông chạy ĐỘC LẬP (KN-STANDALONE-10B-PROFILE-CI, PLAN-KN-STANDALONE nguyên tắc 3, Q8).
# Tệp GHI ĐÈ, dùng cùng tệp gốc; cấu hình mặc định (chỉ docker-compose.yml) không đổi:
#
#   sh scripts/gen-dev-secrets.sh
#   docker compose -f deploy/compose/docker-compose.yml -f deploy/compose/docker-compose.kn.yml up -d --build --wait
#
# Khác Local/Dev mặc định:
#   - Chỉ chạy: postgres, pgbouncer, keycloak, rabbitmq, valkey, seaweedfs, identity-vault, migrate-*, api-platform,
#     worker, outbox-publisher, web-ops (cùng job một lần rabbitmq-init, s3-init và otel-collector trong mạng compose).
#   - KHÔNG chạy: api-internal, worker-internal, ingest, edge-sim*, optimizer, web-internal (profile `full-stack`, không
#     bao giờ bật cùng tệp này); api-public và integration-gateway vốn đã tắt mặc định.
#   - Keycloak nhập realm riêng `kn` (deploy/compose/keycloak-kn): client đăng nhập chỉ có kn-web, kn-field; trang "Quên
#     mật khẩu" gốc tắt. Realm agrigreen dùng chung không được nhập.
#   - Dự án Compose riêng `agrigreen-kn` (volume DB riêng, tenant KN mới). Cổng máy trùng stack mặc định: dừng stack mặc
#     định trước khi dựng.
# Seed tenant KN và kiểm khói: go run ./tools/knsmoke — docs/dev/kn-standalone.md.
name: agrigreen-kn

x-kn-oidc-env: &kn-oidc-env
  AG_OIDC_ISSUER: http://localhost:8180/realms/kn
  AG_OIDC_JWKS_URL: http://keycloak:8080/realms/kn/protocol/openid-connect/certs

x-kn-kc-admin-env: &kn-kc-admin-env
  AG_KC_REALM: kn
  AG_KC_CLIENT_ID: kn-accounts
  AG_KC_ACTIONS_CLIENT_ID: kn-web

services:
  keycloak:
    # Cùng đích mount với tệp gốc → thay thư mục import: chỉ realm kn.
    volumes:
      - "./keycloak-kn:/opt/keycloak/data/import:ro"

  identity-vault:
    environment:
      <<: *kn-oidc-env

  api-platform:
    environment:
      <<: [*kn-oidc-env, *kn-kc-admin-env]

  worker:
    environment:
      <<: *kn-kc-admin-env

  web-ops:
    build:
      args:
        NEXT_PUBLIC_OIDC_ISSUER: http://localhost:8180/realms/kn
        NEXT_PUBLIC_OIDC_CLIENT_ID: kn-web
    environment:
      NEXT_PUBLIC_OIDC_ISSUER: http://localhost:8180/realms/kn
      NEXT_PUBLIC_OIDC_CLIENT_ID: kn-web

  # Hệ ngoài KN: MKG nội bộ, ingest/thiết bị biên, optimizer mô phỏng, web nội bộ MKG.
  api-internal: { profiles: ["full-stack"] }
  worker-internal: { profiles: ["full-stack"] }
  ingest: { profiles: ["full-stack"] }
  edge-sim-init: { profiles: ["full-stack"] }
  edge-sim-enroll: { profiles: ["full-stack"] }
  edge-sim: { profiles: ["full-stack"] }
  optimizer: { profiles: ["full-stack"] }
  web-internal: { profiles: ["full-stack"] }
