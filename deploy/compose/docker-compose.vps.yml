# Ghi đè cho MỘT VPS (demo/thử nghiệm, vd VPS VNPT trong lãnh thổ — RB-7). Dùng cùng file gốc:
#
#   sh deploy/vps/prepare.sh <domain> <email-acme> "<cidr-quản-trị>"   # sinh .env + realm VPS
#   docker compose -f deploy/compose/docker-compose.yml -f deploy/compose/docker-compose.vps.yml up -d --build --wait
#
# Khác Local/Dev:
#   - Caddy là cổng DUY NHẤT ra internet (80/443, TLS tự động). Mọi dịch vụ khác vẫn chỉ nghe 127.0.0.1.
#     app.<domain> → web-ops · api.<domain> → Application API · auth.<domain> → Keycloak
#     admin.<domain> → Admin API, chỉ mở cho ADMIN_ALLOW_CIDR (kể cả /admin của Keycloak).
#   - Keycloak chạy chế độ production (`start`), dữ liệu realm lưu trong PostgreSQL (database keycloak).
#   - Mọi địa chỉ trình duyệt thấy (issuer, CORS, redirect, NEXT_PUBLIC_*) theo AG_DOMAIN.
#   - ingest (8443, mTLS) chỉ nghe AG_INGEST_BIND_ADDR (giao diện VPN/OT), không qua Caddy;
#     edge-sim (mô phỏng) tắt bằng profile dev-sim.
# Xem docs/runbooks/vps-deploy.md.

x-vps-env: &vps-env
  # Bắt buộc với mọi dịch vụ Go (residency.ValidateEnv): thiếu/sai → từ chối khởi động.
  AG_ENV: ${AG_ENV:-staging}
  # Chỉ có hiệu lực khi AG_ENV=production: mọi đích phải thuộc tên miền của mình hoặc dịch vụ nội bộ.
  AG_RESIDENCY_ALLOWLIST: ${AG_DOMAIN:?chạy deploy/vps/prepare.sh},single-label

x-vps-oidc: &vps-oidc
  AG_OIDC_ISSUER: https://auth.${AG_DOMAIN}/realms/agrigreen

# sslmode=disable giữa ứng dụng ↔ pgbouncer ↔ postgres (kế thừa docker-compose.yml): CHẤP NHẬN cho VPS MỘT
# máy — lưu lượng chỉ trong mạng bridge nội bộ của Docker trên cùng host, không ra NIC vật lý. Phải xem lại
# (bật TLS/verify-full hoặc ADR chấp nhận rủi ro) ngay khi DB tách sang máy khác hay chạy nhiều node.

# Mạng compose cố định (M12): Caddy có IP tĩnh để api-platform tin ĐÚNG một proxy (AG_TRUSTED_PROXIES) —
# ClientIP = IP thật của người dùng (giới hạn theo IP của /v1/public, sổ truy cập), không giả được bằng
# X-Forwarded-For. Đổi dải khi trùng mạng có sẵn trên host (đặt cả hai biến trong .env, IP phải thuộc dải).
# Lần đầu áp dụng trên VPS đang chạy: `docker compose ... down` rồi `up` để Docker tạo lại mạng default.
x-vps-proxy: &vps-proxy
  AG_TRUSTED_PROXIES: ${AG_VPS_CADDY_IP:-172.30.10.10}

services:
  caddy:
    image: caddy:2.10-alpine
    depends_on:
      web-ops: { condition: service_started }
      api-platform: { condition: service_started }
      keycloak: { condition: service_healthy }
    environment:
      AG_DOMAIN: ${AG_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?chạy deploy/vps/prepare.sh}
      ADMIN_ALLOW_CIDR: ${ADMIN_ALLOW_CIDR:?chạy deploy/vps/prepare.sh}
    ports: ["80:80", "443:443", "443:443/udp"]
    networks:
      default:
        ipv4_address: ${AG_VPS_CADDY_IP:-172.30.10.10}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  # Một lần: tạo vai + database cho Keycloak (idempotent).
  kc-db-init:
    image: postgis/postgis:17-3.5
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: ${PG_SUPERUSER_PASSWORD}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:?chạy deploy/vps/prepare.sh}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        psql -v ON_ERROR_STOP=1 -v pw="$$KC_DB_PASSWORD" <<'SQL'
        SELECT format('CREATE ROLE keycloak LOGIN PASSWORD %L', :'pw')
          WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'keycloak') \gexec
        SELECT format('ALTER ROLE keycloak PASSWORD %L', :'pw') \gexec
        SELECT 'CREATE DATABASE keycloak OWNER keycloak'
          WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = 'keycloak') \gexec
        SQL
        echo "kc-db-init: xong"
    restart: "no"

  keycloak:
    command: ["start", "--import-realm"]
    depends_on:
      kc-db-init: { condition: service_completed_successfully }
    environment:
      KC_HOSTNAME: https://auth.${AG_DOMAIN}
      KC_HTTP_ENABLED: "true"          # TLS kết thúc ở Caddy
      KC_PROXY_HEADERS: xforwarded
      KC_PROXY_TRUSTED_ADDRESSES: ${AG_VPS_CADDY_IP:-172.30.10.10}  # chỉ tin X-Forwarded-* từ Caddy (M12)
      KC_CACHE: local                  # một node: không lập cụm JGroups
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
    # Realm sinh bởi prepare.sh (redirect/origin theo AG_DOMAIN). Chỉ nhập khi realm CHƯA có.
    volumes: ["./.vps/keycloak:/opt/keycloak/data/import:ro"]

  # Ngoại lệ tường minh (cmd/identity-vault/prodguard.go, có hiệu lực khi AG_ENV=production): VPS một máy — kho chỉ
  # trong mạng compose (cổng chỉ bind 127.0.0.1), không mTLS; KEK phần mềm từ .env cho tới khi có KMS/HSM.
  # RỦI RO ĐÃ BIẾT (M10, RB-3/RB-7): KEK bọc khóa của mọi chủ thể nằm trong .env/bộ nhớ tiến trình — lộ máy là
  # lộ KEK. CHỜ QUYẾT ĐỊNH nhà cung cấp KMS/HSM trong lãnh thổ; khi có: hiện thực ở internal/vault/identity/kms,
  # đặt AG_VAULT_KMS=<nhà cung cấp> và BỎ AG_VAULT_ALLOW_LOCAL_KMS. Trong lúc chờ: kho ghi cảnh báo
  # event=security.kms_software lúc khởi động, /readyz trả kms_local=1, metric ag_vault_kms_software=1.
  identity-vault:
    environment:
      <<: [*vps-env, *vps-oidc]
      AG_VAULT_ALLOW_PLAINTEXT: "1"
      AG_VAULT_ALLOW_LOCAL_KMS: "1"

  # Listener Internal :8084 (mTLS, optimizer) vẫn chỉ trong mạng compose — Caddy không định
  # tuyến tới, không publish. Chứng thư dev do prepare.sh → gen-dev-secrets → gen-dev-certs sinh.
  api-platform:
    environment:
      <<: [*vps-env, *vps-oidc, *vps-proxy]
      AG_CORS_ORIGINS: https://app.${AG_DOMAIN}
      AG_KC_ACTIONS_REDIRECT_URI: https://app.${AG_DOMAIN}/

  # API nội bộ MKG: KHÔNG ra internet (Caddy không định tuyến), chỉ 127.0.0.1 của VPS.
  api-internal:
    environment:
      <<: [*vps-env, *vps-oidc]

  outbox-publisher:
    environment:
      <<: *vps-env

  # Consumer sự kiện nội bộ MKG (vhost mkg.internal, ADR-0018): không ra internet.
  worker-internal:
    environment:
      <<: *vps-env

  # Nhận lô mTLS từ agent biên (ADR-0019): CHỈ từ vùng OT/VPN. Caddy KHÔNG định tuyến tới
  # ingest; 8443 bind vào AG_INGEST_BIND_ADDR (đặt trong .env = địa chỉ giao diện WireGuard/VPN
  # của VPS, vd 10.88.0.1; mặc định 127.0.0.1) và tường lửa chỉ mở 8443 cho dải VPN của hub.
  # Chứng thư thiết bị do CA THIẾT BỊ riêng ký CSR của `edge-agent enroll`; AG_INGEST_CLIENT_CA chỉ chứa CA
  # thiết bị (ingest từ chối khởi động nếu CA này ký chứng thư máy chủ — docs/runbooks/device-pki.md).
  ingest:
    environment:
      <<: *vps-env

  # Agent biên mô phỏng chỉ dành cho Local/Dev/CI — không chạy trên VPS (bật lại bằng --profile dev-sim).
  edge-sim-init:
    profiles: ["dev-sim"]
  edge-sim-enroll:
    profiles: ["dev-sim"]
  edge-sim:
    profiles: ["dev-sim"]

  worker:
    environment:
      <<: *vps-env
      AG_KC_ACTIONS_REDIRECT_URI: https://app.${AG_DOMAIN}/

  web-ops:
    build:
      args:
        NEXT_PUBLIC_API_BASE_URL: https://api.${AG_DOMAIN}
        NEXT_PUBLIC_ADMIN_API_BASE: https://admin.${AG_DOMAIN}
        NEXT_PUBLIC_OIDC_ISSUER: https://auth.${AG_DOMAIN}/realms/agrigreen
        NEXT_PUBLIC_OIDC_CLIENT_ID: agrigreen-web-ops
        NEXT_PUBLIC_API_MOCK: "0"
    environment:
      NEXT_PUBLIC_API_BASE_URL: https://api.${AG_DOMAIN}
      NEXT_PUBLIC_ADMIN_API_BASE: https://admin.${AG_DOMAIN}
      NEXT_PUBLIC_OIDC_ISSUER: https://auth.${AG_DOMAIN}/realms/agrigreen

networks:
  default:
    ipam:
      config:
        - subnet: ${AG_VPS_SUBNET:-172.30.10.0/24}

volumes:
  caddy_data: {}
  caddy_config: {}
