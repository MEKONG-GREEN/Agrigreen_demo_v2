# pgBackRest cho Local/Dev/CI (mục 22). Production: kho sao lưu trong lãnh thổ có
# khóa đối tượng (repo S3 TLS), cùng lịch full tuần / diff ngày / WAL liên tục.
# Mật khẩu mã hóa kho (repo1-cipher-pass) lấy từ biến PGBACKREST_REPO1_CIPHER_PASS,
# không nằm trong tệp này.
[global]
repo1-path=/var/lib/pgbackrest
repo1-cipher-type=aes-256-cbc
repo1-retention-full=4
repo1-retention-diff=7
compress-type=zst
start-fast=y
archive-check=y
log-level-console=info
log-level-file=off
lock-path=/tmp/pgbackrest

[agrigreen]
pg1-path=/var/lib/postgresql/data
pg1-socket-path=/var/run/postgresql
