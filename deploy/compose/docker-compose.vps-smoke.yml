# Isolated CI ONLY; never include this file on a real VPS.
services:
  caddy-smoke:
    image: caddy:2.10-alpine
    mem_limit: 128m
    cpus: "0.50"
    ports: ["127.0.0.1:9080:9080"]
    volumes: ["../vps/Caddyfile.smoke:/etc/caddy/Caddyfile:ro"]
    depends_on:
      seaweedfs: { condition: service_healthy }
  smtp:
    image: axllent/mailpit:v1.27
    mem_limit: 128m
    cpus: "0.50"
    ports: ["127.0.0.1:8025:8025"]
  fcm-smoke:
    image: python:3.13-alpine
    mem_limit: 64m
    cpus: "0.50"
    command: ["python", "/smoke/fcm.py"]
    volumes: ["../vps/fcm-smoke.py:/smoke/fcm.py:ro"]
  keycloak:
    environment:
      AG_KC_SMTP_AUTH: "false"
      AG_KC_SMTP_STARTTLS: "false"
      AG_KC_SMTP_SSL: "false"
    depends_on:
      smtp: { condition: service_started }
