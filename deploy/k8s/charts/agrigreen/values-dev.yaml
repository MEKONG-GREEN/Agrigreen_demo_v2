# Dev — cụm dùng chung, dữ liệu tổng hợp (mục 21). Cụm nhỏ (1 bản mỗi thứ), không sao lưu, không
# HSM. Bí mật: KHÔNG dùng External Secrets — sinh ngẫu nhiên bằng deploy/k8s/scripts/dev-secrets.ps1
# (không commit). CA dịch vụ dev: scripts/gen-dev-certs → Secret agrigreen-service-ca (k8s-deploy.md mục 6).
# Vẫn giữ NetworkPolicy mặc định từ chối và tách vùng — để lỗi luồng lộ ra sớm ở dev.
global:
  env: dev
  domain: agrigreen.dev.example.vn
  imageRegistry: registry.example.vn/agrigreen-dev
  imagePullPolicy: Always
  residencyAllowlist: "svc.cluster.local,single-label,agrigreen.dev.example.vn,10.0.0.0/8"

scheduling:
  nodeSelectorByZone: {}

external:
  objectStorage: ["10.0.0.0/8"]   # kho S3 dev trong cụm/ mạng nội bộ
  kubeAPI: ["10.0.0.0/8"]
  otVpn: ["10.0.0.0/8"]
  adminVpn: ["10.0.0.0/8"]
  nodes: ["10.0.0.0/8"]

common:
  s3:
    endpoint: s3.dev.example.vn
    useTLS: "true"

postgres:
  instances: 1
  pooler:
    instances: 1
  backup:
    enabled: false
  clusters:
    pf:    { zone: data,  storage: 10Gi, walStorage: 2Gi, cpu: "500m", memory: 1Gi, database: ag_pf }
    mkg:   { zone: data,  storage: 5Gi,  walStorage: 2Gi, cpu: "500m", memory: 1Gi, database: ag_mkg }
    ts:    { zone: data,  storage: 10Gi, walStorage: 2Gi, cpu: "500m", memory: 1Gi, database: ag_ts }
    vault: { zone: vault, storage: 2Gi,  walStorage: 1Gi, cpu: "250m", memory: 512Mi, database: ag_vault }
    iam:   { zone: data,  storage: 2Gi,  walStorage: 1Gi, cpu: "250m", memory: 512Mi, database: keycloak, keycloak: true }

rabbitmq:
  replicas: 1
  storage: 2Gi

externalSecrets:
  enabled: false

pki:
  deviceCA:
    enabled: false   # dev: CA thiết bị từ scripts/gen-dev-certs (device-ca.crt) → ConfigMap agrigreen-device-ca-source

apps:
  api-platform:
    replicas: 1
    pdb: { minAvailable: 0 }
    hpa: { enabled: false }
  worker: { replicas: 1, pdb: { minAvailable: 0 } }
  outbox-publisher-pf: { replicas: 1, pdb: { minAvailable: 0 } }
  optimizer: { replicas: 1, pdb: { minAvailable: 0 } }
  web-ops: { replicas: 1, pdb: { minAvailable: 0 } }
  api-internal: { replicas: 1, pdb: { minAvailable: 0 } }
  worker-internal: { replicas: 1, pdb: { minAvailable: 0 } }
  outbox-publisher-mkg: { replicas: 1, pdb: { minAvailable: 0 } }
  ingest:
    replicas: 1
    pdb: { minAvailable: 0 }
    hpa: { enabled: false }
  web-internal: { replicas: 1, pdb: { minAvailable: 0 } }
  identity-vault: { replicas: 1, pdb: { minAvailable: 0 } }
  otel-collector: { replicas: 1, pdb: { minAvailable: 0 } }
