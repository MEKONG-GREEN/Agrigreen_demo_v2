{{- /*
Bí mật theo vùng (External Secrets Operator, Apache-2.0). Nguồn: kho bí mật TRONG LÃNH THỔ (RB-7)
qua ClusterSecretStore .Values.externalSecrets.store. Không giá trị bí mật nào nằm trong repo.
Mỗi Secret chỉ tạo trong namespace của vùng nó (Secret có phạm vi namespace).
*/ -}}
{{- if .Values.externalSecrets.enabled }}
{{- $root := . }}
{{- $es := .Values.externalSecrets }}
{{- $o := "{{" }}{{- $c := "}}" }}
{{- range $zone, $secrets := $es.secrets }}
{{- if include "agrigreen.on" (dict "root" $root "zone" $zone) }}
{{- $ns := include "agrigreen.ns" (dict "root" $root "zone" $zone) }}
{{- range $name, $s := $secrets }}
{{- if ne $s.enabled false }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels: {{- include "agrigreen.labels" (dict "root" $root "zone" $zone) | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef: { kind: ClusterSecretStore, name: {{ $es.store }} }
  target:
    name: {{ $name }}
    creationPolicy: Owner
{{- with $s.type }}
    template:
      type: {{ . }}
{{- end }}
{{- if $s.extract }}
  # Mọi thuộc tính của khóa ở kho (vd AG_APIKEY_PEPPER_V1, _V2…, _CURRENT): thêm phiên bản pepper mới
  # chỉ là thao tác ở kho bí mật, không sửa chart (ADR-0022 mục 4).
  dataFrom:
    - extract: { key: {{ printf "%s/%s" $es.remotePrefix $s.remote | quote }} }
{{- else }}
  data:
{{- range $k := $s.keys }}
    - secretKey: {{ $k | quote }}
      remoteRef:
        key: {{ printf "%s/%s" $es.remotePrefix (index ($s.keyRemotes | default dict) $k | default $s.remote) | quote }}
        property: {{ $k | quote }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- /* RabbitMQ: rmq-<user> (username/password) ở vùng data cho User CR; URL dựng sẵn ở vùng ứng dụng. */}}
{{- $mqHost := printf "%s.%s.%s" $root.Values.rabbitmq.name (include "agrigreen.ns" (dict "root" $root "zone" "data")) (include "agrigreen.svcSuffix" $root) }}
{{- if include "agrigreen.on" (dict "root" $root "zone" "data") }}
{{- range $u, $spec := $root.Values.rabbitmq.users }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rmq-{{ $u }}
  namespace: {{ include "agrigreen.ns" (dict "root" $root "zone" "data") }}
  labels: {{- include "agrigreen.labels" (dict "root" $root "zone" "data") | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef: { kind: ClusterSecretStore, name: {{ $es.store }} }
  target: { name: rmq-{{ $u }}, creationPolicy: Owner }
  data:
{{- range $k := list "username" "password" }}
    - secretKey: {{ $k }}
      remoteRef: { key: {{ printf "%s/rabbitmq/%s" $es.remotePrefix $u | quote }}, property: {{ $k }} }
{{- end }}
{{- end }}
{{- end }}
{{- range $name, $a := $es.amqp }}
{{- if include "agrigreen.on" (dict "root" $root "zone" $a.zone) }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}
  namespace: {{ include "agrigreen.ns" (dict "root" $root "zone" $a.zone) }}
  labels: {{- include "agrigreen.labels" (dict "root" $root "zone" $a.zone) | nindent 4 }}
    agrigreen.vn/rabbitmq-user: {{ $a.user }}
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef: { kind: ClusterSecretStore, name: {{ $es.store }} }
  target:
    name: {{ $name }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
{{- range $key, $kind := $a.urls }}
{{- $cred := printf "%s .username %s:%s .password | urlquery %s" $o $c $o $c }}
{{- if eq $kind "platform" }}
        {{ $key }}: {{ printf "amqp://%s@%s:5672/" $cred $mqHost | quote }}
{{- else if eq $kind "internal" }}
        {{ $key }}: {{ printf "amqp://%s@%s:5672/%s" $cred $mqHost ($root.Values.rabbitmq.vhosts.internal.name) | quote }}
{{- else if eq $kind "mgmt" }}
        {{ $key }}: {{ printf "http://%s@%s:15672" $cred $mqHost | quote }}
{{- else }}
{{- fail (printf "amqp url kind không hợp lệ: %s" $kind) }}
{{- end }}
{{- end }}
  data:
{{- range $k := list "username" "password" }}
    - secretKey: {{ $k }}
      remoteRef: { key: {{ printf "%s/rabbitmq/%s" $es.remotePrefix $a.user | quote }}, property: {{ $k }} }
{{- end }}
{{- end }}
{{- end }}
{{- end }}
