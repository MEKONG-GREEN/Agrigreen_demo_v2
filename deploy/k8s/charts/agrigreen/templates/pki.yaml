{{- /*
PKI nội bộ trong lãnh thổ (ADR-0019, ADR-0021, docs/runbooks/pki.md):
  - CA DỊCH VỤ: cert-manager (Apache-2.0) ClusterIssuer kiểu CA; khóa CA trung gian trong Secret
    agrigreen-service-ca của namespace cert-manager (External Secrets). Chứng thư lá 90 ngày, tự gia hạn.
    trust-manager (Apache-2.0) phát bó CA công khai agrigreen-service-ca tới pf/mkg/vault.
  - CA THIẾT BỊ: step-ca (Apache-2.0) + HSM trong agrigreen-pki, KHÁC CA dịch vụ; chỉ người vận hành
    ký CSR thiết bị qua VPN quản trị. Bó CA công khai agrigreen-device-ca chỉ tới agrigreen-mkg (ingest).
*/ -}}
{{- if .Values.pki.enabled }}
{{- $root := . }}
{{- $pki := .Values.pki }}
{{- if include "agrigreen.on" (dict "root" $root "zone" "pki") }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $pki.serviceIssuer }}
  namespace: {{ $pki.certManagerNamespace }}
  labels: {{- include "agrigreen.labels" (dict "root" $root "zone" "pki") | nindent 4 }}
spec:
  refreshInterval: {{ $root.Values.externalSecrets.refreshInterval }}
  secretStoreRef: { kind: ClusterSecretStore, name: {{ $root.Values.externalSecrets.store }} }
  target:
    name: {{ $pki.serviceIssuer }}
    creationPolicy: Owner
    template: { type: kubernetes.io/tls }
  data:
{{- range $k := list "tls.crt" "tls.key" }}
    - secretKey: {{ $k | quote }}
      remoteRef: { key: {{ printf "%s/pki/service-ca" $root.Values.externalSecrets.remotePrefix | quote }}, property: {{ $k | quote }} }
{{- end }}
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ $pki.serviceIssuer }}
  labels: {{- include "agrigreen.labels" (dict "root" $root "zone" "pki") | nindent 4 }}
spec:
  ca:
    secretName: {{ $pki.serviceIssuer }}
---
# Bó CA dịch vụ (chỉ phần công khai). Khi thay CA: thêm CA mới vào nguồn trước, gỡ CA cũ sau (pki.md mục 4).
apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  name: agrigreen-service-ca
  labels: {{- include "agrigreen.labels" (dict "root" $root "zone" "pki") | nindent 4 }}
spec:
  sources:
    - secret: { name: {{ $pki.serviceIssuer }}, key: tls.crt }
{{- if $pki.serviceCAExtraSource }}
    # Trong lúc thay CA dịch vụ: PEM CA cũ (hoặc mới) để hai CA cùng được tin (pki.md mục 4).
    - configMap: { name: agrigreen-service-ca-extra, key: ca.crt }
{{- end }}
  target:
    configMap: { key: ca.crt }
    namespaceSelector:
      matchLabels: { agrigreen.vn/trust-service-ca: "true" }
---
# Bó CA thiết bị: PEM công khai của CA trung gian + gốc thiết bị do người vận hành CA đặt vào
# ConfigMap agrigreen-device-ca-source (namespace tin cậy của trust-manager) sau nghi thức dựng CA.
apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  name: agrigreen-device-ca
  labels: {{- include "agrigreen.labels" (dict "root" $root "zone" "pki") | nindent 4 }}
spec:
  sources:
    - configMap: { name: agrigreen-device-ca-source, key: ca.crt }
  target:
    configMap: { key: ca.crt }
    namespaceSelector:
      matchLabels: { agrigreen.vn/trust-device-ca: "true" }
{{- if $pki.deviceCA.enabled }}
{{- $ns := include "agrigreen.ns" (dict "root" $root "zone" "pki") }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: step-ca-config
  namespace: {{ $ns }}
  labels: {{- include "agrigreen.labels" (dict "root" $root "zone" "pki") | nindent 4 }}
    app.kubernetes.io/name: step-ca
data:
  ca.json: |
    {
      "root": "/home/step/certs/root_ca.crt",
      "crt": "/home/step/certs/intermediate_ca.crt",
      "key": {{ $pki.deviceCA.hsm.keyUri | quote }},
      "kms": { "type": "pkcs11", "uri": {{ printf "%s?pin-source=/run/secrets/hsm/pin" $pki.deviceCA.hsm.kmsUri | quote }} },
      "address": ":9000",
      "dnsNames": [{{ printf "step-ca.%s.%s" $ns (include "agrigreen.svcSuffix" $root) | quote }}],
      "logger": { "format": "json" },
      "db": { "type": "badgerv2", "dataSource": "/home/step/db" },
      "authority": {
        "enableAdmin": true,
        "claims": {
          "minTLSCertDuration": "24h",
          "maxTLSCertDuration": {{ $pki.deviceCA.maxCertDuration | quote }},
          "defaultTLSCertDuration": {{ $pki.deviceCA.defaultCertDuration | quote }},
          "disableRenewal": true
        }
      },
      "tls": { "minVersion": 1.2, "maxVersion": 1.3 }
    }
  device-leaf.tpl: |
{{ $root.Files.Get "files/step-ca/device-leaf.tpl" | indent 4 }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: step-ca-db
  namespace: {{ $ns }}
  labels: {{- include "agrigreen.labels" (dict "root" $root "zone" "pki") | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 5Gi } }
{{- with $root.Values.postgres.storageClass }}
  storageClassName: {{ . }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: step-ca
  namespace: {{ $ns }}
  labels: {{- include "agrigreen.labels" (dict "root" $root "zone" "pki") | nindent 4 }}
    app.kubernetes.io/name: step-ca
spec:
  replicas: 1          # badger DB một ghi; HA bằng HSM + sao lưu PVC (pki.md)
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: step-ca }
  template:
    metadata:
      labels: {{- include "agrigreen.labels" (dict "root" $root "zone" "pki") | nindent 8 }}
        app.kubernetes.io/name: step-ca
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext: {{- include "agrigreen.podSecurity" (dict "uid" 1000) | nindent 8 }}
{{- with (index ($root.Values.scheduling.nodeSelectorByZone | default dict) "pki") }}
      nodeSelector: {{ toJson . }}
{{- end }}
      containers:
        - name: step-ca
          image: {{ $pki.deviceCA.image }}
          args: ["/home/step/config/ca.json"]
          securityContext: {{- include "agrigreen.containerSecurity" . | nindent 12 }}
          ports: [{ name: https, containerPort: 9000, protocol: TCP }]
          readinessProbe: { tcpSocket: { port: https }, periodSeconds: 10 }
          livenessProbe: { tcpSocket: { port: https }, initialDelaySeconds: 20, periodSeconds: 20 }
          resources: {{ toJson $root.Values.common.resources.small }}
          volumeMounts:
            - { name: config, mountPath: /home/step/config, readOnly: true }
            - { name: certs, mountPath: /home/step/certs, readOnly: true }
            - { name: db, mountPath: /home/step/db }
            - { name: hsm-pin, mountPath: /run/secrets/hsm, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: config, configMap: { name: step-ca-config } }
        # PEM công khai của CA gốc + trung gian thiết bị (sau nghi thức dựng CA, pki.md mục 3).
        - { name: certs, configMap: { name: step-ca-certs } }
        - { name: db, persistentVolumeClaim: { claimName: step-ca-db } }
        - { name: hsm-pin, secret: { secretName: step-ca-hsm-pin, defaultMode: 0400 } }
        - { name: tmp, emptyDir: { sizeLimit: 64Mi } }
---
apiVersion: v1
kind: Service
metadata:
  name: step-ca
  namespace: {{ $ns }}
  labels: {{- include "agrigreen.labels" (dict "root" $root "zone" "pki") | nindent 4 }}
    app.kubernetes.io/name: step-ca
spec:
  selector: { app.kubernetes.io/name: step-ca }
  ports: [{ name: https, port: 9000, targetPort: https, protocol: TCP }]
{{- end }}
{{- end }}
{{- /* Chứng thư lá của dịch vụ, trong namespace của vùng dùng nó. */}}
{{- range $crt := $pki.serviceCertificates }}
{{- if include "agrigreen.on" (dict "root" $root "zone" $crt.zone) }}
{{- $ns := include "agrigreen.ns" (dict "root" $root "zone" $crt.zone) }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $crt.name }}
  namespace: {{ $ns }}
  labels: {{- include "agrigreen.labels" (dict "root" $root "zone" $crt.zone) | nindent 4 }}
spec:
  secretName: {{ $crt.name }}
  commonName: {{ $crt.commonName }}
  duration: {{ $pki.serviceCertDuration }}
  renewBefore: {{ $pki.serviceCertRenewBefore }}
  privateKey: { algorithm: ECDSA, size: 256, rotationPolicy: Always }
  usages: {{ toJson (concat (list "digital signature" "key encipherment") $crt.usages) }}
{{- if $crt.dnsService }}
  dnsNames:
    - {{ $crt.dnsService }}
    - {{ printf "%s.%s.svc" $crt.dnsService $ns }}
    - {{ printf "%s.%s.%s" $crt.dnsService $ns (include "agrigreen.svcSuffix" $root) }}
{{- range $crt.extraDNS }}
    - {{ tpl . $root }}
{{- end }}
{{- else }}
  dnsNames: [{{ $crt.commonName }}]
{{- end }}
  issuerRef: { kind: ClusterIssuer, name: {{ $pki.serviceIssuer }}, group: cert-manager.io }
{{- end }}
{{- end }}
{{- end }}
