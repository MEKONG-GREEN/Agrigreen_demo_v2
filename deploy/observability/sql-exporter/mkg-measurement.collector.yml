# Collector cho sql_exporter (github.com/burningalchemist/sql_exporter, MIT) — chỉ số VẬN HÀNH
# của mkg/measurement + ts_weigh mà tiến trình Go chưa xuất qua OTLP (docs/runbooks/ingest.md mục 7).
# Chỉ số đếm/tuổi — không số đo, không khối lượng, không lô, không danh tính khách (van: không qua).
#
# Vai giám sát chỉ đọc xuyên tenant (G3, migration mkg 000013 + ts 000003):
#   - target `mkg` (database ag_mkg) nối bằng vai `mkg_monitor`, chạy các metric ag_mkg_*;
#   - target `ts`  (database ag_ts)  nối bằng vai `ts_monitor`, collector riêng ts-weigh.collector.yml (ag_ts_*).
# Hai vai NOBYPASSRLS, KHÔNG có quyền SELECT trên bảng gốc (mkg_measurement.*, ts_weigh.*): chỉ
# EXECUTE các hàm SECURITY DEFINER gộp trong schema mkg_monitor / ts_monitor (chủ hàm
# mkg_monitor_owner / ts_monitor_owner, BYPASSRLS, GRANT theo cột). Truy vấn dưới chỉ gọi hàm.
# Mật khẩu: AG_DB_PASSWORD_MKG_MONITOR / AG_DB_PASSWORD_TS_MONITOR (hoặc AG_DB_APP_PASSWORD), qua PgBouncer
# (userlist đã có hai vai). Ví dụ data_source_name:
#   postgres://mkg_monitor:<mật khẩu>@pgbouncer:6432/ag_mkg?sslmode=disable
#   postgres://ts_monitor:<mật khẩu>@pgbouncer:6432/ag_ts?sslmode=disable
collector_name: agrigreen_mkg_measurement
min_interval: 60s

metrics:
  # Thiết bị có kỳ đang hiệu lực: lần cuối ingest nhận lô (chưa nhận → thời điểm duyệt).
  - metric_name: ag_mkg_device_last_seen_timestamp_seconds
    type: gauge
    help: "Thời điểm (unix) ingest nhận lô gần nhất của kỳ thiết bị; chưa có lô → thời điểm duyệt"
    key_labels: [device_id, epoch, point, status]
    values: [ts]
    query: |
      SELECT device_id, epoch, point, status, last_seen_ts AS ts
      FROM mkg_monitor.device_health()

  # Độ đầy đệm agent tự báo (phía máy chủ — thấy được cả khi không scrape được máy biên).
  - metric_name: ag_mkg_device_buffer_pct
    type: gauge
    help: "Độ đầy đệm đĩa (%) agent báo trong lô gần nhất"
    key_labels: [device_id, epoch]
    values: [buffer_pct]
    query: |
      SELECT device_id, epoch, buffer_pct
      FROM mkg_monitor.device_health()
      WHERE status = 'active' AND buffer_pct IS NOT NULL

  # Đối soát 24 giờ qua theo trạng thái thương mại (§19: tỉ lệ phiếu vượt dung sai).
  - metric_name: ag_mkg_reconciliations_24h
    type: gauge
    help: "Số lần đối soát ghi trong 24 giờ qua theo commercial_status"
    key_labels: [commercial_status]
    values: [n]
    query: |
      SELECT commercial_status, n FROM mkg_monitor.reconciliations_24h()

  # Tranh chấp đang mở / đang xem xét theo mức.
  - metric_name: ag_mkg_disputes_open
    type: gauge
    help: "Số tranh chấp khối lượng đang open/under_review"
    key_labels: [severity]
    values: [n]
    query: |
      SELECT severity, n FROM mkg_monitor.disputes_open()

  - metric_name: ag_mkg_dispute_oldest_open_timestamp_seconds
    type: gauge
    help: "Thời điểm (unix) mở của tranh chấp đang mở lâu nhất (0 = không có)"
    values: [ts]
    query: |
      SELECT mkg_monitor.dispute_oldest_open_ts() AS ts
