name: agrigreen_field
description: "AgriGreen — app hiện trường ngoại tuyến (cán bộ khuyến nông, HTX, nông dân)."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.13.4

# Mọi dependency phải có giấy phép MIT/BSD/Apache-2.0/ISC/MPL-2.0 — xem README.md.
# Plugin của lõi (SQLCipher, secure storage, AppAuth, camera, GPS, Firebase,
# thông báo cục bộ, url_launcher) đến qua agrigreen_mobile.
dependencies:
  flutter:
    sdk: flutter
  # Lõi di động dùng chung với apps/htx-app (docs/dev/g2-conventions.md §1).
  agrigreen_mobile:
    path: ../../packages/agrigreen_mobile
  flutter_riverpod: ^3.4.3
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  connectivity_plus: ^7.3.1
  path_provider: ^2.1.6
  path: ^1.9.1
  firebase_messaging: ^16.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.3
  integration_test:
    sdk: flutter
  # Chỉ kiểm thử import trực tiếp (bản chạy nhận qua agrigreen_mobile).
  crypto: ^3.0.7
  http: ^1.6.0
  image: ^4.10.1
  pinenacl: ^0.6.0

flutter:
  uses-material-design: true
