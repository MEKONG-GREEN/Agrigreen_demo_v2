# Ngoại lệ cổng W9.1 "không r_* có quyền trên schema module khác trừ k_ref và *_pub"
# (migrations/schema_isolation_integration_test.go, ADR-0028 §4, R-DB-05, R-DB-10).
#
# CHỈ ĐƯỢC CO LẠI: thêm mục mới cần lý do kiến trúc và gói kế hoạch gỡ (owner W<n>.<m>). Cổng hỏng khi có quyền
# chéo không có ở đây, hoặc khi một mục không còn xảy ra (xóa mục đó).
#
# owner ADR-0028-write-port: điểm vào GHI chéo module LÂU DÀI — hàm SECURITY DEFINER của module chủ, chỉ USAGE schema +
# EXECUTE cho r_* bên gọi, không quyền bảng (ADR-0028 Hiện thực, docs/dev/modules.md "Điểm vào ghi chéo module"). Không
# thuộc schema _pub (_pub chỉ chứa view đọc phân tích, R-DB-10). Mỗi điểm vào mới phải rà soát như thay đổi hợp đồng.
#
# Khóa: role (vai nhóm r_<module>), schema (schema của module khác), object (rỗng = mọi đối tượng của schema;
# "tiền_tố*" = theo tiền tố, vd "function pf_workflow.*"), cluster (rỗng = mọi cụm).
exceptions:
  - role: r_masterdata
    schema: pf_workflow
    reason: >-
      W6.1 (pf 000118): lối ghi duyệt bốn mắt là hàm SECURITY DEFINER pf_workflow.submit/decide gọi TRONG giao
      dịch của module gửi duyệt (port Approvals) — USAGE schema + EXECUTE, không quyền bảng. Điểm vào ghi lâu dài.
    owner: ADR-0028-write-port
  - role: r_party
    schema: pf_workflow
    reason: >-
      W6.1 (pf 000118): như r_masterdata — cấp quyền chia sẻ gửi/duyệt qua pf_workflow.submit/decide
      (SECURITY DEFINER, port party/port.FourEyes). Điểm vào ghi lâu dài.
    owner: ADR-0028-write-port
  - role: r_forms
    schema: pf_workflow
    reason: >-
      W6.2 (pf 000122): rà soát bốn mắt của cap/forms ghi yêu cầu/quyết định (kind forms.submission) qua
      pf_workflow.submit/decide (SECURITY DEFINER) TRONG giao dịch của pf/forms — USAGE schema + EXECUTE, không quyền
      bảng. Điểm vào ghi lâu dài.
    owner: ADR-0028-write-port
  - role: r_extension
    schema: pf_forms
    reason: >-
      W6.2 (pf 000122): vòng đời báo cáo KN v1 (extension/reportcycle) ghi song song chốt/mở lại kỳ + ảnh chụp đóng
      băng qua pf_forms.mirror (SECURITY DEFINER, port forms/port.Freezer) TRONG giao dịch của pf/extension — USAGE
      schema + EXECUTE, không quyền bảng. Điểm vào ghi lâu dài; bỏ khi KN chuyển sang kỳ native.
    owner: ADR-0028-write-port
  - role: r_metrics
    schema: pf_workflow
    reason: >-
      W6.4 (pf 000129): thêm/sửa job tổng hợp r_agg là thay đổi đặc quyền — cap/analytics ghi yêu cầu/quyết định
      bốn mắt (kind agg.job) qua pf_workflow.submit/decide (SECURITY DEFINER) TRONG giao dịch của pf/metrics cùng
      dòng danh mục pf_metrics.agg_job — USAGE schema + EXECUTE, không quyền bảng. Điểm vào ghi lâu dài.
    owner: ADR-0028-write-port
