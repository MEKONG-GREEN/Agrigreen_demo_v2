# Ngoại lệ cổng W9.1 "không r_* có quyền trên schema module khác trừ k_ref và *_pub"
# (migrations/schema_isolation_integration_test.go, ADR-0028 §4, R-DB-05, R-DB-10).
#
# CHỈ ĐƯỢC CO LẠI: thêm mục mới cần lý do kiến trúc và gói kế hoạch gỡ (owner W<n>.<m>). Cổng hỏng khi có quyền
# chéo không có ở đây, hoặc khi một mục không còn xảy ra (xóa mục đó).
#
# Khóa: role (vai nhóm r_<module>), schema (schema của module khác), object (rỗng = mọi đối tượng của schema;
# "tiền_tố*" = theo tiền tố, vd "function pf_workflow.*"), cluster (rỗng = mọi cụm).
exceptions:
  - role: r_masterdata
    schema: pf_workflow
    reason: >-
      W6.1 (pf 000118): lối ghi duyệt bốn mắt là hàm SECURITY DEFINER pf_workflow.submit/decide gọi TRONG giao
      dịch của module gửi duyệt (port Approvals) — USAGE schema + EXECUTE, không quyền bảng. Gỡ khi điểm vào
      chuyển sang schema công bố pf_workflow_pub (R-DB-10).
    owner: W6.3
  - role: r_party
    schema: pf_workflow
    reason: >-
      W6.1 (pf 000118): như r_masterdata — cấp quyền chia sẻ gửi/duyệt qua pf_workflow.submit/decide
      (SECURITY DEFINER, port party/port.FourEyes). Gỡ khi điểm vào chuyển sang pf_workflow_pub (R-DB-10).
    owner: W6.3
