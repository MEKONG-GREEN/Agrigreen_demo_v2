# Tệp khai báo module — ADR-0027, kiến trúc v4.1 §7.1, docs/dev/modules.md.
# Trường SINH (go run ./tools/modgen): depends (khóa), provides, consumes, permissions, owns_schema.
# Trường TAY: name, aka, kind, zones, version, ràng buộc trong depends, shares, enable.
name: pf/forms
aka: [cap/forms]
kind: capability
zones: [pf]
version: 1.0.0
depends:
  pf/sync: ">=1.0 <2"
  pf/workflow: ">=1.0 <2"
provides:
  ports:
    - DurablePublisher
    - Entry
    - FacilityDirectory
    - FiguresReader
    - Freezer
    - PeriodControl
    - Publisher
    - SubmissionFeed
    - SystemProgressReader
    - Validator
  events: [pf.forms.period.closed/v1, pf.forms.submission.recorded/v1]
  internal_events: []
  publications: [pf_forms_pub.closed_figures/v1]
  data_products: []
consumes:
  events: []
permissions: []
shares: []
owns_schema: [pf_forms, pf_forms_pub]
enable: per_tenant
