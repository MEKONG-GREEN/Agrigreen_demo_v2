# Tệp khai báo module — ADR-0027, kiến trúc v4.1 §7.1, docs/dev/modules.md.
# Trường SINH (go run ./tools/modgen): depends (khóa), provides, consumes, permissions, owns_schema.
# Trường TAY: name, aka, kind, zones, version, ràng buộc trong depends, shares, enable.
name: pf/masterdata
aka: [cap/masterdata]
hosts: [cap/import]
kind: capability
zones: [pf]
version: 1.0.0
depends:
  pf/kref: ">=1.0 <2"
  pf/party: ">=2.0 <3"
  pf/sync: ">=1.0 <2"
  pf/workflow: ">=1.0 <2"
provides:
  ports:
    - AdminUnitHistory
    - CNTSCatalogs
    - Catalogs
    - EffectiveCatalogs
    - FormUsage
    - StaffNames
  events: [pf.masterdata.admin_unit.changed/v1, pf.masterdata.param.approved/v1]
  internal_events: []
  publications: []
  data_products: []
consumes:
  events: []
permissions: [masterdata_admin]
shares: []
owns_schema: [pf_masterdata]
enable: per_tenant
