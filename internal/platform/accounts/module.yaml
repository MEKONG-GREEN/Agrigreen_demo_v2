# Tệp khai báo module — ADR-0027, kiến trúc v4.1 §7.1, docs/dev/modules.md.
# Trường SINH (go run ./tools/modgen): depends (khóa), provides, consumes, permissions, owns_schema.
# Trường TAY: name, aka, kind, zones, version, ràng buộc trong depends, shares, enable.
name: pf/accounts
aka: [k/access]
hosts: [cap/import]
kind: kernel
zones: [pf]
version: 1.0.0
depends:
  pf/party: ">=2.0 <3"
  vault/identity: ">=1.0 <2"
provides:
  ports:
    - ActionLinks
    - Assignments
    - Directory
    - FarmerAccounts
    - FarmerHouseholds
    - InternalUnits
    - KNContextResolver
    - KNDirectory
    - KNPeople
    - MailDirectory
    - OTPAdmin
    - ProfileUpdater
    - RecipientDirectory
    - RoleHolders
    - ScopedDutyHolders
    - SessionReader
    - StaffContacts
    - XaScopes
  events:
    - pf.accounts.assignment.changed/v1
    - pf.accounts.assignment.granted/v1
    - pf.accounts.assignment.revoked/v1
    - pf.accounts.user.created/v1
    - pf.accounts.user.dormant_warning/v1
    - pf.accounts.user.locked/v1
    - pf.accounts.user.unlocked/v1
  internal_events: []
  publications: []
  data_products: []
consumes:
  events: [pf.party.org.deactivated/v1, pf.party.org.reactivated/v1]
permissions: [account_admin, account_admin_province, farmer, kn_user, login_totp_required]
shares: []
owns_schema: [pf_accounts]
enable: always
