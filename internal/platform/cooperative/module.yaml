# Tệp khai báo module — ADR-0027, kiến trúc v4.1 §7.1, docs/dev/modules.md.
# Trường SINH (go run ./tools/modgen): depends (khóa), provides, consumes, permissions, owns_schema.
# Trường TAY: name, aka, kind, zones, version, ràng buộc trong depends, shares, enable.
name: pf/cooperative
aka: [dom/cooperative]
hosts: [cap/export, cap/import]
kind: domain
zones: [pf]
version: 1.0.0
depends:
  pf/apiclient: ">=1.0 <2"
  pf/geo: ">=2.0 <3"
  pf/masterdata: ">=1.0 <2"
  pf/metrics: ">=1.0 <2"
  pf/party: ">=2.0 <3"
  pf/reports: ">=1.0 <2"
  pf/sync: ">=1.0 <2"
  vault/identity: ">=1.0 <2"
provides:
  ports:
    - Cooperatives
    - Diary
    - FarmerHouseholds
    - FarmerIdentity
    - HTXConfirmations
    - HouseholdIdentities
    - Households
    - MachineCounts
    - Plots
    - Resolve
    - Seasons
  events:
    - pf.cropcycle.coop_season_area.changed/v1
    - pf.cropcycle.farm_log.recorded/v1
    - pf.cropcycle.farm_log.reviewed/v1
    - pf.cropcycle.harvest.declared/v1
    - pf.cropcycle.season.completed/v1
    - pf.cropcycle.season.corrected/v1
    - pf.cropcycle.season.opened/v1
    - pf.cropcycle.sop.published/v1
    - pf.geo.cooperative_boundary.recorded/v1
    - pf.geo.plot.created/v1
    - pf.geo.plot.restored/v1
    - pf.geo.plot.retired/v1
    - pf.geo.plot_boundary.recorded/v1
    - pf.party.household.membership_changed/v1
    - pf.party.household.registered/v1
  internal_events: []
  publications:
    - pf_cooperative_pub.confirmations/v1
    - pf_cooperative_pub.cooperatives/v1
    - pf_cooperative_pub.plots/v1
    - pf_cooperative_pub.seasons/v1
  data_products: [confirmations_v1, cooperatives_v1, plots_v1, seasons_v1]
consumes:
  events: []
permissions: [coop_manager, farmer, plot_editor, plot_viewer, sop_admin]
shares: [diary_entry, household, plot, season]
owns_schema: [pf_coop, pf_cooperative_pub]
enable: per_tenant
