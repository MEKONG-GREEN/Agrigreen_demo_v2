# Tệp khai báo module — ADR-0027, kiến trúc v4.1 §7.1, docs/dev/modules.md.
# Trường SINH (go run ./tools/modgen): depends (khóa), provides, consumes, permissions, owns_schema.
# Trường TAY: name, aka, kind, zones, version, ràng buộc trong depends, shares, enable.
name: pf/simulation
aka: [dom/hubsim]
kind: domain
zones: [pf]
version: 1.0.0
depends: {}
provides:
  ports: [ParamSet, Router, SupplySource]
  events:
    - pf.simulation.job.completed/v1
    - pf.simulation.job.requested/v1
    - pf.simulation.run.submitted/v1
  internal_events: []
  publications: []
  data_products: []
consumes:
  events: []
permissions: [simulation_analyst]
shares: []
owns_schema: [pf_simulation]
enable: per_tenant
