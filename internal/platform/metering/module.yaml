# Tệp khai báo module — ADR-0027, kiến trúc v4.1 §7.1, docs/dev/modules.md.
# Trường SINH (go run ./tools/modgen): depends (khóa), provides, permissions, owns_schema.
# Trường TAY: name, aka, kind, zones, version, ràng buộc trong depends, shares, enable.
name: pf/metering
aka: [dom/metering]
kind: domain
zones: [pf]
version: 1.0.0
depends:
  pf/apiclient: ">=1.0 <2"
  pf/masterdata: ">=1.0 <2"
provides:
  ports: [Checkpoint, Ledger, Quotas, Usage]
  events: [pf.metering.egress.anomaly_detected/v1, pf.metering.statement.requested/v1]
  internal_events: []
  publications: []
  data_products: []
permissions: [billing_approver, billing_officer, metering_viewer]
shares: []
owns_schema: [pf_metering]
enable: per_tenant
