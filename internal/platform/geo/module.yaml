# Tệp khai báo module — ADR-0027, kiến trúc v4.1 §7.1, docs/dev/modules.md.
# Trường SINH (go run ./tools/modgen): depends (khóa), provides, consumes, permissions, owns_schema.
# Trường TAY: name, aka, kind, zones, version, ràng buộc trong depends, shares, enable.
name: pf/geo
aka: [cap/geo]
kind: capability
zones: [pf]
version: 2.0.0
depends:
  pf/apiclient: ">=1.0 <2"
  pf/metrics: ">=1.0 <2"
  pf/party: ">=2.0 <3"
provides:
  ports:
    - AdminGeometry
    - FarmerHouseholds
    - GpsLog
    - HubSink
    - Layer
    - MapLayers
    - PlotGeometry
  events: [pf.geo.facility.recorded/v1]
  internal_events: []
  publications:
    - pf_geo_pub.layer_geometry/v1
    - pf_geo_pub.plot_boundary/v1
    - pf_geo_pub.plot_event/v1
  data_products: []
consumes:
  events: []
permissions: [coop_manager, farmer, geo_admin, map_consumer]
shares: []
owns_schema: [pf_geo, pf_geo_pub]
enable: per_tenant
