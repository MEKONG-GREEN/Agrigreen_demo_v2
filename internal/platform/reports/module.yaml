# Tệp khai báo module — ADR-0027, kiến trúc v4.1 §7.1, docs/dev/modules.md.
# Trường SINH (go run ./tools/modgen): depends (khóa), provides, consumes, permissions, owns_schema.
# Trường TAY: name, aka, kind, zones, version, ràng buộc trong depends, shares, enable.
name: pf/reports
aka: [cap/export, cap/import]
kind: capability
zones: [pf]
version: 1.0.0
depends:
  pf/accounts: ">=1.0 <2"
  pf/masterdata: ">=1.0 <2"
  pf/party: ">=2.0 <3"
provides:
  ports:
    - FormEngine
    - Mailer
    - cropcyclesrc.ReportData
    - extensionsrc.Consolidations
    - extensionsrc.DispatchHistory
    - extensionsrc.ReportData
    - mechanizationsrc.ReportData
  events:
    - pf.reports.dispatch.requested/v1
    - pf.reports.export.anomaly/v1
    - pf.reports.export.completed/v1
    - pf.reports.export.requested/v1
    - pf.reports.form_version.published/v1
  internal_events: []
  publications: []
  data_products: []
consumes:
  events: []
permissions: [reports_admin]
shares: []
owns_schema: [pf_reports]
enable: per_tenant
