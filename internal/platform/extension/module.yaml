# Tệp khai báo module — ADR-0027, kiến trúc v4.1 §7.1, docs/dev/modules.md.
# Trường SINH (go run ./tools/modgen): depends (khóa), provides, consumes, permissions, owns_schema.
# Trường TAY: name, aka, kind, zones, version, ràng buộc trong depends, shares, enable.
name: pf/extension
aka: [dom/extension]
hosts: [cap/export, cap/task]
kind: domain
zones: [pf]
version: 1.0.0
depends:
  pf/accounts: ">=1.0 <2"
  pf/cooperative: ">=1.0 <2"
  pf/forms: ">=1.0 <2"
  pf/geo: ">=2.0 <3"
  pf/masterdata: ">=1.0 <2"
  pf/metrics: ">=1.0 <2"
  pf/notify: ">=1.0 <2"
  pf/party: ">=2.0 <3"
  pf/reports: ">=1.0 <2"
  pf/sync: ">=1.0 <2"
provides:
  ports:
    - ClosedFigures
    - KHTCPlanDepartments
    - KHTCPlans
    - KHTCPrograms
    - KHTCReportStates
    - KHTCSourceCrosswalk
    - KHTCSources
    - TablePDF
  events:
    - pf.extension.cnts_alert.changed/v1
    - pf.extension.cnts_duty.changed/v1
    - pf.extension.cnts_form.reminded/v1
    - pf.extension.consolidation.completed/v1
    - pf.extension.directive.issued/v1
    - pf.extension.outbreak.reported/v1
    - pf.extension.period.closed/v1
    - pf.extension.period.reopened/v1
    - pf.extension.report_batch.issued/v1
    - pf.extension.report_task.reminded/v1
    - pf.extension.submission.adjustment_requested/v1
    - pf.extension.submission.submitted/v1
    - pf.extension.support_request.submitted/v1
    - pf.extension.task.created/v1
    - pf.extension.task.escalated/v1
    - pf.extension.work_schedule.reminded/v1
    - pf.extension.work_schedule.reviewed/v1
    - pf.extension.work_schedule.submitted/v1
  internal_events: []
  publications:
    - pf_extension_pub.closed_figures/v1
    - pf_extension_pub.consolidation_closed/v1
    - pf_extension_pub.directive_target_ack/v1
    - pf_extension_pub.field_report/v1
    - pf_extension_pub.task/v1
    - pf_extension_pub.task_event/v1
  data_products: []
consumes:
  events: [pf.forms.submission.recorded/v1]
permissions: []
shares: []
owns_schema: [pf_extension, pf_extension_pub]
enable: per_tenant
