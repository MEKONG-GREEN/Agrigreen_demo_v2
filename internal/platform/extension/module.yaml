# Tệp khai báo module — ADR-0027, kiến trúc v4.1 §7.1, docs/dev/modules.md.
# Trường SINH (go run ./tools/modgen): depends (khóa), provides, consumes, permissions, owns_schema.
# Trường TAY: name, aka, kind, zones, version, ràng buộc trong depends, shares, enable.
name: pf/extension
aka: [dom/extension]
kind: domain
zones: [pf]
version: 1.0.0
depends:
  pf/accounts: ">=1.0 <2"
  pf/cooperative: ">=1.0 <2"
  pf/geo: ">=1.0 <2"
  pf/masterdata: ">=1.0 <2"
  pf/metrics: ">=1.0 <2"
  pf/notify: ">=1.0 <2"
  pf/party: ">=1.0 <2"
  pf/reports: ">=1.0 <2"
  pf/sync: ">=1.0 <2"
provides:
  ports: [TablePDF]
  events:
    - pf.extension.consolidation.completed/v1
    - pf.extension.directive.issued/v1
    - pf.extension.period.closed/v1
    - pf.extension.period.reopened/v1
    - pf.extension.report_batch.issued/v1
    - pf.extension.report_task.reminded/v1
    - pf.extension.submission.adjustment_requested/v1
    - pf.extension.submission.submitted/v1
    - pf.extension.support_request.submitted/v1
    - pf.extension.task.created/v1
    - pf.extension.task.escalated/v1
    - pf.extension.work_schedule.reminded/v1
    - pf.extension.work_schedule.reviewed/v1
    - pf.extension.work_schedule.submitted/v1
  internal_events: []
  publications: []
  data_products: []
consumes:
  events: []
permissions: []
shares: []
owns_schema: [pf_extension]
enable: per_tenant
