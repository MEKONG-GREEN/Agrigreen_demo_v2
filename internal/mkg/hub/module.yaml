# Tệp khai báo module — ADR-0027, kiến trúc v4.1 §7.1, docs/dev/modules.md.
# Trường SINH (go run ./tools/modgen): depends (khóa), provides, consumes, permissions, owns_schema.
# Trường TAY: name, aka, kind, zones, version, ràng buộc trong depends, shares, enable.
name: mkg/hub
aka: [mkg/hub]
kind: domain
zones: [mkg]
version: 1.0.0
depends: {}
provides:
  ports: [EnvReadings, LotOrigins, Lots, Publication, Stock]
  events: [mkg.hub.capacity.published/v1, mkg.hub.facility.published/v1]
  internal_events: []
  publications: [hub_capacity, hub_facility]
  data_products: []
consumes:
  events:
    - mkg.fieldops.roll_count.recorded/v1
    - mkg.logistics.trip.milestone_recorded/v1
    - mkg.measurement.reconciliation.completed/v1
    - mkg.measurement.weigh_ticket.recorded/v1
permissions: [hub_approver, hub_operator]
shares: []
owns_schema: [mkg_hub]
enable: always
