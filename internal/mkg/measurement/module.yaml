# Tệp khai báo module — ADR-0027, kiến trúc v4.1 §7.1, docs/dev/modules.md.
# Trường SINH (go run ./tools/modgen): depends (khóa), provides, permissions, owns_schema.
# Trường TAY: name, aka, kind, zones, version, ràng buộc trong depends, shares, enable.
name: mkg/measurement
aka: [mkg/measurement]
kind: domain
zones: [mkg, ts]
version: 1.0.0
depends:
  mkg/fieldops: ">=1.0 <2"
  mkg/hub: ">=1.0 <2"
provides:
  ports:
    - CollectionLinks
    - CollectionPlots
    - DeviceHealth
    - DeviceRegistry
    - Integrator
    - LotMass
    - Publication
    - RollTotals
    - RollTotalsAsOf
    - TicketWriter
    - WeighingSessions
  events: [mkg.measurement.mrv_collection_evidence.published/v1]
  internal_events:
    - mkg.measurement.reconciliation.completed/v1
    - mkg.measurement.weigh_ticket.recorded/v1
  publications: [mrv_collection_evidence]
  data_products: []
permissions:
    - device_approver
    - dispute_officer
    - reconciliation_officer
    - scale_supervisor
    - tolerance_approver
shares: []
owns_schema: [mkg_measurement, ts_weigh]
enable: always
