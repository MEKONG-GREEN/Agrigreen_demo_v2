# Tệp khai báo module — ADR-0027, kiến trúc v4.1 §7.1, docs/dev/modules.md.
# Trường SINH (go run ./tools/modgen): depends (khóa), provides, consumes, permissions, owns_schema.
# Trường TAY: name, aka, kind, zones, version, ràng buộc trong depends, shares, enable.
name: mkg/acctbridge
aka: [mkg/acctbridge]
kind: domain
zones: [mkg]
version: 1.0.0
depends:
  mkg/costing: ">=1.0 <2"
provides:
  ports: [LedgerAdapter]
  events: []
  internal_events:
    - mkg.acctbridge.journal.pushed/v1
    - mkg.acctbridge.journal_build.requested/v1
    - mkg.acctbridge.journal_push.requested/v1
  publications: []
  data_products: []
consumes:
  events: [mkg.costing.period.closed/v1]
permissions: [accounting_bridge_operator]
shares: []
owns_schema: [mkg_acctbridge]
enable: always
