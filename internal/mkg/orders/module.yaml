# Tệp khai báo module — ADR-0027, kiến trúc v4.1 §7.1, docs/dev/modules.md.
# Trường SINH (go run ./tools/modgen): depends (khóa), provides, permissions, owns_schema.
# Trường TAY: name, aka, kind, zones, version, ràng buộc trong depends, shares, enable.
name: mkg/orders
aka: [mkg/orders]
kind: domain
zones: [mkg]
version: 1.0.0
depends:
  mkg/hub: ">=1.0 <2"
  mkg/measurement: ">=1.0 <2"
provides:
  ports: [Contracts, Deliveries, Receipts]
  events: []
  internal_events: [mkg.orders.delivery.accepted/v1]
  publications: []
  data_products: []
permissions: [sales_approver, sales_officer]
shares: []
owns_schema: [mkg_orders]
enable: always
