# Tệp khai báo module — ADR-0027, kiến trúc v4.1 §7.1, docs/dev/modules.md.
# Trường SINH (go run ./tools/modgen): depends (khóa), provides, consumes, permissions, owns_schema.
# Trường TAY: name, aka, kind, zones, version, ràng buộc trong depends, shares, enable.
name: pf/hrm
aka: [dom/hrm]
kind: domain
zones: [pf]
version: 1.0.0
depends:
  pf/evidence: ">=1.0 <2"
  pf/export: ">=1.0 <2"
  pf/forms: ">=1.0 <2"
  pf/notify: ">=1.0 <2"
  vault/identity: ">=1.0 <2"
provides:
  ports: [Catalog, Directory, NotifyDirectory, PromotionWriter, Units]
  events:
    - pf.hrm.appraisal.changed/v1
    - pf.hrm.plan.reminded/v1
    - pf.hrm.promotion_due.detected/v1
  internal_events: []
  publications: []
  data_products: []
consumes:
  events: []
permissions: []
shares: []
owns_schema: [pf_hrm]
enable: per_tenant
